name: Actualizar y publicar

on:
  schedule:
    - cron: '30 4 * * *'   # cada día a las 04:30 UTC (06:30 en horario peninsular de verano)
  push:
    branches: [main, master]
    paths: ['config/**', 'src/**', 'scripts/**', 'public/**', 'astro.config.mjs', 'package.json']
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: sinplanes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Pipeline de planes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: npm run pipeline

      - name: Avisar de planes de prensa por revisar
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/open-review-issue.mjs

      - name: Guardar datos en el repo
        run: |
          git config user.name "sinplanes-bot"
          git config user.email "bot@sinplanes.com"
          git add data/
          git diff --cached --quiet || git commit -m "datos: $(date -u +%F)"
          git push

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
