name: Desplegar sitio

# Construye el sitio con lo que haya en el repo y lo publica. NO llama a ninguna API ni usa secretos:
# el esqueleto fijo sale de config/ y los eventos de data/events.json (puede faltar o estar viejo).
#
# Requisito único: Settings > Pages > Source = "GitHub Actions".
#
# Se dispara: al cambiar código, config o data/ (un push manual con datos), al terminar cada workflow de datos (los commits del bot no
# disparan `push`), y una vez al día como red de seguridad para que cambien el mes, el fin de semana y los eventos caducados.

on:
  push:
    branches: [main, master]
    paths: ['config/**', 'data/**', 'src/**', 'scripts/**', 'public/**', 'astro.config.mjs', 'package.json', 'package-lock.json', '.github/workflows/deploy.yml']
  workflow_run:
    workflows: ['Datos · agendas y tendencias (sin IA)', 'Datos · prensa, resúmenes y traducciones (IA)']
    types: [completed]
  schedule:
    # GitHub retrasa (a veces horas) o se salta disparos de `schedule`, así que hay varios: justo tras la medianoche de Madrid
    # (22:00 UTC en verano, 23:00 en invierno) para que el día cambie a tiempo, y más durante la madrugada y la mañana como respaldo.
    # Reconstruir es barato e idempotente, así que no pasa nada si varios llegan.
    - cron: '7 22,23 * * *'
    - cron: '37 22,23,0 * * *'
    - cron: '27 2,5,8 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Un workflow de datos fallido no impide desplegar, pero no hace falta reaccionar a uno cancelado.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Construir (compone el esqueleto y los datos, y genera el HTML)
        run: npm run build
      - name: Verificar que el esqueleto fijo está completo
        run: npm run check-skeleton
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
