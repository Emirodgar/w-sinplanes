# Fichas ampliadas de los lugares fijos (museos, monumentos, parques, rutas y actividades), por id de config/lugares.yml.
# ------------------------------------------------------------
# Cada ficha: relacionados (ids de otros planes), imagen / imagen_tam [ancho, alto] (opcionales) y contenido.es con
# imagen_alt (si hay imagen), texto (párrafos) y faq (p = pregunta, r = respuesta). Hoy solo en castellano.
# Horarios, precios y condiciones de entrada NO se publican aquí: cambian y se remite siempre a la web oficial.

museo-nacional-prado:
  relacionados: [museo-reina-sofia, museo-thyssen-bornemisza, parque-buen-retiro, museos-gratis]
  contenido:
    es:
      texto:
        - "El Museo Nacional del Prado es la gran pinacoteca de España y una de las más importantes del mundo. Abrió sus puertas en 1819 y reúne una colección extraordinaria de pintura europea, con especial fuerza en los siglos XVI al XIX."
        - "Entre sus obras más célebres están Las Meninas de Velázquez, las Majas y los fusilamientos del 3 de mayo de Goya, El jardín de las delicias de El Bosco y varias obras maestras de El Greco, Tiziano o Rubens. Es imposible verlo todo en una visita, así que conviene elegir qué salas priorizar."
        - "Lo mejor es ir con un plan: elige entre tres y cinco obras o salas, consulta el plano y reserva la entrada con antelación en temporada alta. El museo ofrece franjas de entrada gratuita, que suelen estar muy concurridas. Combina la visita con el Retiro, que está al lado, y con el Reina Sofía y el Thyssen, que completan el llamado Paseo del Arte."
      faq:
        - p: "¿Qué no hay que perderse en el Prado?"
          r: "Las Meninas, las Majas y los fusilamientos del 3 de mayo de Goya, El jardín de las delicias de El Bosco, y obras de El Greco, Tiziano y Rubens. Elige antes qué ver, porque el museo es enorme."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Entre dos y tres horas para una visita selectiva. Si quieres verlo con calma, reserva medio día o divide la visita en dos."
        - p: "¿Cuándo es gratis?"
          r: "El museo tiene franjas de entrada gratuita a lo largo de la semana. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
        - p: "¿Hay que reservar entrada?"
          r: "Se recomienda comprar la entrada con antelación, sobre todo en temporada alta, fines de semana y festivos, para evitar colas."
        - p: "¿Se pueden hacer fotos?"
          r: "Las condiciones sobre fotografía y mochilas las fija el museo y cambian. Consúltalas en la web oficial antes de ir."
        - p: "¿Es buen plan con niños?"
          r: "Sí, con una visita corta y centrada en pocas obras. El museo ofrece materiales y actividades para familias; consúltalos en su web."
museo-reina-sofia:
  relacionados: [museo-nacional-prado, museo-thyssen-bornemisza, matadero-madrid, museos-gratis]
  contenido:
    es:
      texto:
        - "El Museo Reina Sofía es el gran museo de arte del siglo XX y contemporáneo de España. Está instalado en el antiguo Hospital General de San Carlos, un edificio del siglo XVIII al que se añadieron torres de cristal diseñadas por Jean Nouvel."
        - "Su pieza más famosa es el Guernica de Picasso, que ocupa una sala propia y acompaña a bocetos y estudios del cuadro. La colección incluye además a Dalí, Miró, Juan Gris y otros nombres de las vanguardias, y un buen repaso al arte español y europeo del último siglo."
        - "El Guernica suele concentrar a la mayoría de los visitantes, así que conviene verlo a primera hora o en las franjas de menos afluencia. Después, recorre el resto de la colección con calma. El museo organiza exposiciones temporales y tiene una cafetería y una librería muy completa. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Dónde está el Guernica?"
          r: "En el Museo Reina Sofía, en una sala propia, junto con bocetos y estudios de la obra."
        - p: "¿Qué más hay en el museo?"
          r: "Obras de Dalí, Miró, Juan Gris y otros artistas de las vanguardias, además de arte español y europeo del siglo XX y contemporáneo."
        - p: "¿Cuándo es gratis?"
          r: "El museo tiene franjas de entrada gratuita. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Entre dos y tres horas para una visita selectiva, con el Guernica incluido."
        - p: "¿Hay que reservar entrada?"
          r: "Se recomienda reservar con antelación en temporada alta y los fines de semana."
        - p: "¿Qué más ver cerca?"
          r: "El Museo del Prado, el Thyssen y el Retiro están a pocos minutos a pie. El conjunto se conoce como el Paseo del Arte."
museo-thyssen-bornemisza:
  relacionados: [museo-nacional-prado, museo-reina-sofia, parque-buen-retiro]
  contenido:
    es:
      texto:
        - "El Museo Thyssen-Bornemisza completa el llamado Paseo del Arte de Madrid junto al Prado y al Reina Sofía. Su colección recorre ocho siglos de pintura, desde el gótico hasta las vanguardias del siglo XX, y se disfruta con un recorrido cronológico muy fácil de seguir."
        - "Reúne obras de grandes maestros, desde primitivos italianos y flamencos hasta impresionistas, expresionistas y artistas del siglo XX, en un edificio que antes fue el palacio de Villahermosa. Es un museo manejable, con una visita más abarcable que la del Prado."
        - "Si tienes poco tiempo, es una buena opción para una visita de dos horas. El recorrido empieza por la planta superior con el arte más antiguo y baja hacia el presente. Aprovecha para ver las exposiciones temporales y para pasear después por el Retiro. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué tipo de arte hay en el Thyssen?"
          r: "Pintura europea de ocho siglos, desde el gótico hasta las vanguardias del siglo XX, con obras de maestros antiguos, impresionistas y expresionistas."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Entre dos y tres horas bastan para recorrerlo con calma."
        - p: "¿Se visita por orden?"
          r: "Sí, el recorrido es cronológico, de la planta superior (arte antiguo) a la inferior (arte moderno)."
        - p: "¿Hay que reservar entrada?"
          r: "Se recomienda comprar la entrada con antelación en temporada alta y fines de semana."
        - p: "¿Cuándo es gratis?"
          r: "El museo tiene franjas de entrada gratuita o reducida. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
        - p: "¿Es buen plan con niños?"
          r: "Sí, con una visita breve. El museo ofrece actividades y recorridos para familias."
palacio-real-madrid:
  relacionados: [galeria-de-las-colecciones-reales, plaza-mayor-madrid, real-monasterio-encarnacion, teatro-real-madrid]
  contenido:
    es:
      texto:
        - "El Palacio Real de Madrid es la residencia oficial del Rey, aunque solo se utiliza para actos de Estado. Es el mayor palacio real de Europa occidental por superficie y se puede visitar casi todo el año, salvo cuando hay actos oficiales."
        - "La visita recorre salones decorados con tapices, frescos y lámparas de cristal, como el Salón del Trono y el Comedor de Gala, además de la Real Armería y la Real Farmacia. Hay colecciones de instrumentos de cuerda, relojes y mobiliario de los siglos XVIII y XIX."
        - "Consulta con antelación si el palacio está abierto el día que quieras ir, porque se cierra por actos oficiales. Reserva la entrada en temporada alta para evitar colas y calcula entre una y dos horas de visita. Los jardines de Sabatini y el Campo del Moro, junto al palacio, son un buen complemento. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Vive el Rey en el Palacio Real?"
          r: "No, la residencia de la familia real es otro lugar. El palacio se usa para actos oficiales y ceremonias."
        - p: "¿Qué se visita?"
          r: "Salones de gala, como el del Trono y el Comedor de Gala, la Real Armería, la Real Farmacia y distintas colecciones de arte y mobiliario."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Entre una y dos horas para la visita completa."
        - p: "¿Puede estar cerrado?"
          r: "Sí, el palacio cierra durante actos oficiales. Comprueba la web antes de ir."
        - p: "¿Hay que reservar entrada?"
          r: "Se recomienda reservar con antelación en temporada alta."
        - p: "¿Qué más ver cerca?"
          r: "La Catedral de la Almudena, la plaza de Oriente, los jardines de Sabatini y el Campo del Moro."
galeria-de-las-colecciones-reales:
  relacionados: [palacio-real-madrid, museo-nacional-prado, real-monasterio-encarnacion]
  contenido:
    es:
      texto:
        - "La Galería de las Colecciones Reales es un museo situado junto al Palacio Real de Madrid, dedicado a las colecciones que la Corona de España ha reunido durante siglos. Muestra tapices, pintura, mobiliario, carruajes y piezas de gran valor histórico y artístico."
        - "El edificio, de diseño contemporáneo, mira al valle del Manzanares y a la Casa de Campo. Su recorrido ordena las obras por épocas y reyes, y permite entender cómo se formó el patrimonio artístico de la monarquía española."
        - "Es una buena visita complementaria al Palacio Real, y se puede hacer en una o dos horas. Si vas a combinar ambos, mira si hay entradas conjuntas y reserva con antelación. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué hay en la Galería de las Colecciones Reales?"
          r: "Tapices, pinturas, mobiliario, carruajes y otras piezas de las colecciones de la Corona."
        - p: "¿Dónde está?"
          r: "Junto al Palacio Real de Madrid, mirando al valle del Manzanares."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Entre una y dos horas."
        - p: "¿Se puede combinar con el Palacio Real?"
          r: "Sí, ambos están muy cerca. Consulta en la web si hay entradas conjuntas."
        - p: "¿Hay que reservar?"
          r: "Se recomienda reservar en temporada alta y los fines de semana."
plaza-mayor-madrid:
  relacionados: [puerta-sol-madrid, mercado-san-miguel, mercadillos-navidad, barrio-la-latina]
  contenido:
    es:
      texto:
        - "La Plaza Mayor es una de las plazas más conocidas de Madrid. Es un gran espacio rectangular y cerrado, rodeado de soportales y de edificios de varias plantas, que se construyó a comienzos del siglo XVII y ha sido escenario de fiestas, mercados y actos públicos durante siglos."
        - "En el centro se alza la estatua de Felipe III, y en uno de los lados, la Casa de la Panadería, con sus frescos en la fachada. Bajo los soportales hay tiendas de recuerdos, sellos y monedas, y las terrazas de la plaza son un lugar clásico para tomar algo, aunque más caro que en las calles de alrededor."
        - "En invierno se instala el mercado navideño, con puestos de belenes y adornos, y a lo largo del año hay conciertos y actividades. Para comer, mejor salir a las callejuelas cercanas, donde están los bocadillos de calamares y las tabernas más tradicionales. A primera hora de la mañana se ve con más calma."
      faq:
        - p: "¿Qué se puede ver en la Plaza Mayor?"
          r: "La estatua de Felipe III, la Casa de la Panadería con sus frescos, los soportales y el ambiente de las terrazas."
        - p: "¿Hay mercado de Navidad?"
          r: "Sí, en invierno se instala el mercado navideño, con puestos de belenes y adornos. Consulta las fechas cada año."
        - p: "¿Es mejor comer en la plaza?"
          r: "Las terrazas de la plaza son más caras. Las callejuelas de los alrededores tienen tabernas y bocadillos de calamares más económicos."
        - p: "¿Cuándo es mejor ir?"
          r: "A primera hora de la mañana o al atardecer, para evitar las horas de más gente."
        - p: "¿Qué más ver cerca?"
          r: "El Mercado de San Miguel, la Puerta del Sol, el Palacio Real y el barrio de La Latina."
puerta-sol-madrid:
  relacionados: [plaza-mayor-madrid, campanadas, mercado-san-miguel, palacio-real-madrid]
  contenido:
    es:
      texto:
        - "La Puerta del Sol es el corazón de Madrid y uno de los lugares más conocidos de España. Aquí está el kilómetro cero de las carreteras radiales, marcado con una placa en el suelo, y el reloj de la Real Casa de Correos que marca las campanadas de Nochevieja."
        - "La plaza es un punto de encuentro habitual y un cruce de calles muy transitado. En ella se encuentran la estatua del Oso y el Madroño, símbolo de la ciudad, el edificio de la Real Casa de Correos, hoy sede del gobierno regional, y el cartel luminoso de Tío Pepe, uno de los más fotografiados."
        - "Es una parada rápida, de quince o veinte minutos, que se combina bien con un paseo por la Plaza Mayor, la calle Mayor o las calles peatonales del centro. Cuidado con los carteristas en las zonas de mucha gente y con los timos habituales de las zonas turísticas. En Nochevieja se llena de personas que quieren vivir las campanadas."
      faq:
        - p: "¿Qué es el kilómetro cero?"
          r: "Una placa en el suelo, frente a la Real Casa de Correos, que marca el origen de las carreteras radiales de España."
        - p: "¿Qué reloj es el de las Campanadas?"
          r: "El de la Real Casa de Correos, situado en la Puerta del Sol, que marca las doce campanadas de Nochevieja."
        - p: "¿Qué más ver en la plaza?"
          r: "La estatua del Oso y el Madroño, el cartel de Tío Pepe y la Real Casa de Correos."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Unos quince o veinte minutos para ver los puntos principales, más si te sientas a observar el ambiente."
        - p: "¿Hay peligro de carteristas?"
          r: "Es una zona muy concurrida y los carteristas actúan en sitios con mucha gente. Cuida tus pertenencias."
        - p: "¿Qué hay cerca?"
          r: "La Plaza Mayor, el Mercado de San Miguel, la calle Preciados y el Palacio Real están a pocos minutos a pie."
puerta-alcala-madrid:
  relacionados: [parque-buen-retiro, museo-nacional-prado, puerta-sol-madrid]
  contenido:
    es:
      texto:
        - "La Puerta de Alcalá es un arco de triunfo neoclásico del siglo XVIII, erigido por orden de Carlos III y diseñado por Francesco Sabatini. Se levanta en la plaza de la Independencia, junto al parque del Retiro, y es uno de los símbolos más reconocibles de Madrid."
        - "Tiene cinco vanos y está adornado con esculturas y relieves. Estuvo en la antigua entrada de la ciudad desde el camino de Alcalá y hoy se encuentra rodeada de tráfico. Se ve bien desde la acera y por la noche, iluminada, tiene especial encanto."
        - "Es una parada rápida de diez o quince minutos que se combina con un paseo por el Retiro, a un paso. Para una buena foto, ve a primera hora o al atardecer, cuando hay menos gente y la luz es más suave."
      faq:
        - p: "¿Quién construyó la Puerta de Alcalá?"
          r: "Fue diseñada por Francesco Sabatini y construida en el siglo XVIII por orden de Carlos III."
        - p: "¿Se puede subir?"
          r: "No, es un monumento para ver desde fuera."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Diez o quince minutos para verla y hacer fotos."
        - p: "¿Qué hay cerca?"
          r: "El parque del Retiro está a pocos metros, con el Palacio de Cristal y el estanque."
        - p: "¿Cuándo es mejor ir?"
          r: "A primera hora o al atardecer, para evitar el tráfico y tener mejor luz."
parque-buen-retiro:
  relacionados: [museo-nacional-prado, puerta-alcala-madrid, feria-libro-madrid, museo-thyssen-bornemisza]
  contenido:
    es:
      texto:
        - "El Parque del Buen Retiro es el gran parque de Madrid y uno de los lugares más queridos por los madrileños. Declarado Patrimonio Mundial por la UNESCO junto al Paseo del Prado, es un oasis de jardines, paseos arbolados, estanques y monumentos en pleno centro."
        - "Entre sus rincones más conocidos están el Estanque Grande, con barcas de remo y el monumento a Alfonso XII, el Palacio de Cristal, el Palacio de Velázquez y la Rosaleda. También hay un paseo de esculturas y varios rincones tranquilos, como el Bosque del Recuerdo."
        - "Es perfecto para pasear, hacer deporte, leer o simplemente descansar. El parque abre desde primera hora y lo mejor es visitarlo por la mañana o al atardecer. En primavera, con la Rosaleda, y en otoño, con los colores, es especialmente bonito. Cada año acoge la Feria del Libro, a finales de primavera."
      faq:
        - p: "¿Qué ver en el Retiro?"
          r: "El Estanque Grande con barcas, el Palacio de Cristal, el Palacio de Velázquez, la Rosaleda y el Bosque del Recuerdo."
        - p: "¿Es gratis?"
          r: "El acceso al parque es libre. Algunas actividades, como alquilar una barca, son de pago."
        - p: "¿Se pueden alquilar barcas?"
          r: "Sí, en el Estanque Grande, normalmente con horario de apertura y temporada. Consulta las condiciones."
        - p: "¿Cuándo es mejor ir?"
          r: "Por la mañana o al atardecer. En primavera y otoño el parque está especialmente bonito."
        - p: "¿Es buen plan con niños?"
          r: "Sí, hay zonas de juegos, barcas, marionetas en algunos periodos y mucho espacio para correr."
        - p: "¿Es Patrimonio Mundial?"
          r: "Sí, forma parte del Paisaje de la Luz, Paseo del Prado y El Retiro, declarado por la UNESCO."
teatro-real-madrid:
  relacionados: [loteria-navidad, palacio-real-madrid, plaza-mayor-madrid]
  contenido:
    es:
      texto:
        - "El Teatro Real es el coliseo de la ópera de Madrid. Inaugurado en 1850, ha sido escenario de grandes estrenos y de la mejor ópera, ballet y música clásica, y sigue siendo una de las instituciones culturales más importantes de España."
        - "Tiene temporada propia de ópera, con producciones de alto nivel, y también programa ballet y conciertos. Además, el edificio se puede visitar con una visita guiada, que permite conocer la sala, los camerinos, los talleres y los entresijos de un gran teatro."
        - "Si quieres ir a una función, consulta la programación y compra con antelación: las óperas más demandadas se agotan. Hay entradas de distintos precios, algunas con visibilidad reducida. Cada 22 de diciembre se celebra aquí el sorteo de la Lotería de Navidad. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué se puede hacer en el Teatro Real?"
          r: "Asistir a una ópera, un ballet o un concierto, o hacer una visita guiada al edificio."
        - p: "¿Se puede visitar sin ir a una función?"
          r: "Sí, hay visitas guiadas al edificio. Consulta los horarios y la reserva en la web oficial."
        - p: "¿Hay entradas baratas?"
          r: "Hay entradas de distintos precios, incluidas algunas con visibilidad reducida. Consulta las condiciones en la web."
        - p: "¿Qué ropa llevar?"
          r: "No hay código de vestir obligatorio, aunque muchas personas se visten con algo más formal para ir a la ópera."
        - p: "¿Qué más ver cerca?"
          r: "El Palacio Real, la Plaza de Oriente y la plaza de Isabel II están a pocos pasos."
matadero-madrid:
  relacionados: [museo-reina-sofia, parque-buen-retiro, barrio-la-latina]
  contenido:
    es:
      texto:
        - "Matadero Madrid es un gran centro de creación contemporánea instalado en el antiguo matadero municipal de la ciudad, junto al río Manzanares. Las naves industriales del siglo XX se han transformado en espacios de arte, teatro, cine y cultura."
        - "Su programación es muy variada: exposiciones, teatro, danza, música, cine, talleres y encuentros, además de mercados y eventos al aire libre. Alberga espacios como las Naves del Español, la Cineteca y la Central de Diseño, y es un buen lugar para descubrir propuestas culturales diferentes."
        - "Muchas actividades son gratuitas o de bajo coste, pero conviene consultar la programación antes de ir. Es un plan que combina bien con un paseo por Madrid Río y con una comida por el barrio de Legazpi y Arganzuela. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es Matadero Madrid?"
          r: "Un centro de creación contemporánea en el antiguo matadero municipal, con exposiciones, teatro, cine y más."
        - p: "¿Es gratis?"
          r: "Muchas actividades son gratuitas o de bajo coste, pero depende de cada espacio. Consulta la programación."
        - p: "¿Qué más hay cerca?"
          r: "Madrid Río, con paseos y zonas de ocio junto al Manzanares."
        - p: "¿Cómo llegar?"
          r: "En metro hasta Legazpi, o a pie desde Madrid Río. Consulta las opciones de transporte público."
        - p: "¿Es buen plan con niños?"
          r: "Hay actividades para familias en algunos periodos. Consulta la programación."
mercado-san-miguel:
  relacionados: [plaza-mayor-madrid, barrio-la-latina, puerta-sol-madrid]
  contenido:
    es:
      texto:
        - "El Mercado de San Miguel es un mercado cubierto de hierro y cristal inaugurado en 1916, junto a la Plaza Mayor. Hoy es un espacio gastronómico donde se puede picar de todo, de pie o sentado, entre puestos de producto fresco, tapas, vinos y conservas."
        - "Ofrece una gran variedad: jamón, quesos, mariscos, tortillas, croquetas, pinchos, dulces y bebidas de todo tipo. Es muy popular entre turistas y madrileños, y ofrece una forma rápida de probar muchas cosas en un solo sitio, aunque los precios son más altos que en las tabernas de la zona."
        - "Se llena mucho a la hora de comer y los fines de semana, así que conviene ir a primera hora o a media tarde. Si quieres una experiencia más barata, combina una parada aquí con unas tapas en las tabernas de La Latina. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué se puede comer?"
          r: "Jamón, quesos, mariscos, tortillas, croquetas, pinchos, dulces y vino, entre otros productos."
        - p: "¿Es caro?"
          r: "Los precios suelen ser más altos que en las tabernas de la zona, por ser un enclave muy turístico."
        - p: "¿Cuándo es mejor ir?"
          r: "A primera hora o a media tarde. A la hora de comer y los fines de semana se llena."
        - p: "¿Se puede reservar?"
          r: "En general no, es un mercado de libre acceso. Algunos puestos tienen mesas."
        - p: "¿Qué más ver cerca?"
          r: "La Plaza Mayor, la Puerta del Sol y el barrio de La Latina."
barrio-la-latina:
  relacionados: [mercado-san-miguel, plaza-mayor-madrid, matadero-madrid]
  contenido:
    es:
      texto:
        - "La Latina es uno de los barrios más animados y castizos de Madrid. Sus calles medievales, estrechas y con mucha historia, están llenas de tabernas, bares de tapas y terrazas, y es el lugar perfecto para un aperitivo o una tarde de tapeo."
        - "La calle de la Cava Baja y sus alrededores concentran muchos de los bares más conocidos. Los domingos y festivos por la mañana se celebra el Rastro, el gran mercadillo de Madrid, y después los bares de La Latina se llenan de gente que sale a tomar el vermut y las tapas."
        - "Para disfrutarlo, ve a pie, sin prisas, y entra en distintos bares para probar una tapa en cada uno. Los domingos hay mucha gente y es mejor ir pronto. Si prefieres algo más tranquilo, elige un día entre semana. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el Rastro?"
          r: "El mercadillo al aire libre de Madrid, que se celebra los domingos y festivos por la mañana, en las calles cercanas a La Latina."
        - p: "¿Qué se puede comer en La Latina?"
          r: "Tapas tradicionales, como tortilla, croquetas, patatas bravas, calamares y raciones, en las tabernas y bares del barrio."
        - p: "¿Cuándo es mejor ir?"
          r: "Los domingos tras el Rastro hay mucho ambiente. Entre semana está más tranquilo."
        - p: "¿Es seguro?"
          r: "Es una zona muy concurrida, así que conviene cuidar tus pertenencias, sobre todo en el Rastro."
        - p: "¿Es buen plan con niños?"
          r: "Sí, durante el día. Por la noche es más de adultos."
casa-villa-casa-cisneros:
  relacionados: [plaza-mayor-madrid, puerta-sol-madrid, real-monasterio-encarnacion]
  contenido:
    es:
      texto:
        - "La Casa de la Villa y la Casa de Cisneros son dos edificios históricos situados en la plaza de la Villa, en el corazón del Madrid de los Austrias. Durante siglos fueron la sede del Ayuntamiento de la ciudad y hoy se pueden visitar."
        - "La Casa de la Villa es un edificio del siglo XVII de estilo barroco, con una fachada de ladrillo y piedra y salones decorados con tapices y pinturas. La Casa de Cisneros, de estilo plateresco, está conectada por una pasarela y se utiliza para actos institucionales."
        - "La plaza de la Villa es una de las más antiguas y tranquilas de Madrid, y con la estatua de Álvaro de Bazán en el centro. Para visitar los interiores, consulta si hay visitas guiadas y sus horarios, ya que a veces hay que reservar. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es la Casa de la Villa?"
          r: "Un edificio del siglo XVII que fue sede del Ayuntamiento de Madrid durante siglos."
        - p: "¿Se puede visitar?"
          r: "Sí, a través de visitas guiadas. Consulta los horarios y la reserva en la web oficial."
        - p: "¿Qué es la Casa de Cisneros?"
          r: "Un edificio de estilo plateresco junto a la Casa de la Villa, unido por una pasarela."
        - p: "¿Dónde está?"
          r: "En la plaza de la Villa, junto a la calle Mayor, en el Madrid de los Austrias."
        - p: "¿Qué hay cerca?"
          r: "La Plaza Mayor, el Mercado de San Miguel y el Palacio Real están a pocos minutos a pie."
real-monasterio-encarnacion:
  relacionados: [palacio-real-madrid, galeria-de-las-colecciones-reales, casa-villa-casa-cisneros]
  contenido:
    es:
      texto:
        - "El Real Monasterio de la Encarnación es un convento de monjas agustinas recoletas fundado en 1611 por la reina Margarita de Austria, esposa de Felipe III. Se encuentra junto al Palacio Real y se puede visitar en visita guiada."
        - "El monasterio conserva una interesante colección de pintura y escultura religiosa de los siglos XVII y XVIII, con obras de Gregorio Fernández y otros artistas. Su relicario es uno de los más singulares de España, con miles de piezas, entre ellas una ampolla con la sangre de san Pantaleón, que según la tradición se licúa cada 27 de julio."
        - "La visita es por grupos y con guía, y conviene consultar el horario y la reserva con antelación, ya que no abre todos los días. Es una buena opción para completar la visita al Palacio Real, más tranquila y con un ambiente muy distinto. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el Real Monasterio de la Encarnación?"
          r: "Un convento de monjas agustinas recoletas fundado en 1611 por Margarita de Austria, junto al Palacio Real."
        - p: "¿Qué se puede ver?"
          r: "Pintura y escultura religiosa de los siglos XVII y XVIII y un relicario con miles de piezas."
        - p: "¿Qué es el milagro de san Pantaleón?"
          r: "Según la tradición, la sangre del santo, conservada en una ampolla, se licúa cada 27 de julio."
        - p: "¿Cómo se visita?"
          r: "Con visita guiada y por grupos. Conviene reservar. Consulta los horarios en la web oficial."
        - p: "¿Qué más ver cerca?"
          r: "El Palacio Real, la Plaza de Oriente y el Teatro Real están a pocos minutos."
sagrada-familia:
  relacionados: [park-guell, casa-batllo, casa-mila-pedrera, catedral-barcelona]
  contenido:
    es:
      texto:
        - "La Sagrada Familia es la obra maestra inacabada de Antoni Gaudí y el monumento más visitado de Barcelona. Sus obras comenzaron en 1882 y siguen en marcha, financiadas en gran parte con las entradas de los visitantes. Forma parte de las obras de Gaudí declaradas Patrimonio Mundial por la UNESCO."
        - "Las fachadas del Nacimiento y de la Pasión cuentan la vida de Jesús con una escultura muy distinta en cada una. El interior es lo más sorprendente: columnas que se abren como árboles, bóvedas de formas naturales y una luz de colores que cambia a lo largo del día según la hora y la orientación de las vidrieras."
        - "Las entradas se venden con día y hora fijados y se agotan con antelación, así que reserva online antes de viajar. Prevé entre una hora y media y dos para la visita, con o sin audioguía, y valora subir a una de las torres si hay plazas. Cuidado con los revendedores en las colas de alrededor. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Por qué sigue sin terminar?"
          r: "Porque las obras comenzaron en 1882 y se financian principalmente con las entradas y donaciones, con un proyecto muy complejo. Consulta en la web oficial el estado actual de las obras."
        - p: "¿Hay que reservar entrada?"
          r: "Sí, conviene reservar online con antelación: las entradas se venden con hora y se agotan, sobre todo en temporada alta."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Entre una hora y media y dos horas, más si subes a una torre."
        - p: "¿Se puede subir a las torres?"
          r: "Sí, hay entradas con subida a las torres, con plazas limitadas. Consulta las condiciones en la web."
        - p: "¿Qué ver por dentro?"
          r: "Las columnas en forma de árbol, las bóvedas y las vidrieras de colores, que cambian de luz a lo largo del día."
        - p: "¿Es Patrimonio Mundial?"
          r: "Sí, forma parte de las obras de Antoni Gaudí declaradas Patrimonio Mundial por la UNESCO."
park-guell:
  relacionados: [sagrada-familia, casa-batllo, casa-mila-pedrera]
  contenido:
    es:
      texto:
        - "El Park Güell es el parque modernista de Gaudí, con arquitectura y naturaleza fundidas en una colina con vistas a toda Barcelona. Forma parte de las obras de Gaudí declaradas Patrimonio Mundial por la UNESCO y es uno de los lugares más fotografiados de la ciudad."
        - "Lo más famoso es la Zona Monumental: la gran plaza con su banco ondulado cubierto de mosaico de trencadís, la salamandra de colores, las columnas inclinadas del pórtico y los edificios de la entrada. El resto del parque son senderos, jardines y miradores de acceso libre."
        - "La Zona Monumental tiene aforo limitado y entrada con horario, y conviene reservarla con antelación. Evita las horas centrales y ve a primera hora o al final de la tarde, cuando hay menos gente y mejor luz. Lleva calzado cómodo, porque hay cuestas, y agua. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Es gratis el Park Güell?"
          r: "Parte del parque es de acceso libre, pero la Zona Monumental, con el banco ondulado, requiere entrada con horario. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
        - p: "¿Hay que reservar?"
          r: "Sí, conviene reservar con antelación la entrada a la Zona Monumental, porque el aforo es limitado."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Entre una hora y media y dos horas, más si exploras la zona libre del parque."
        - p: "¿Cuándo es mejor ir?"
          r: "A primera hora de la mañana o al final de la tarde, cuando hay menos gente y la luz es mejor."
        - p: "¿Cómo llegar?"
          r: "En metro y autobús o a pie desde las paradas cercanas. Hay cuestas, así que lleva calzado cómodo."
        - p: "¿Es buen plan con niños?"
          r: "Sí, aunque hay cuestas y escaleras. Los mosaicos y la salamandra suelen gustar a los pequeños."
casa-batllo:
  relacionados: [casa-mila-pedrera, sagrada-familia, park-guell]
  contenido:
    es:
      texto:
        - "La Casa Batlló es una de las casas más espectaculares de Gaudí, en pleno Passeig de Gràcia. Gaudí la reformó entre 1904 y 1906 y creó una fachada de colores y formas ondulantes, con balcones que parecen máscaras y un tejado que recuerda al lomo de un dragón."
        - "Por dentro, todo parece naturaleza: el patio de luces cubierto de azulejos azules que cambian de tono según la altura, el salón principal con sus ventanales, la escalera y el desván, con arcos de catenaria. Es una casa donde casi no hay líneas rectas y cada detalle está pensado."
        - "La visita se hace con audioguía y suele incluir realidad aumentada. Reserva con antelación, porque en temporada alta se agotan las entradas, y prevé una hora y media. La Casa Batlló forma parte del tramo conocido como la Manzana de la Discordia, junto a la Casa Amatller y la Casa Lleó Morera. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Quién construyó la Casa Batlló?"
          r: "Antoni Gaudí la reformó entre 1904 y 1906 para la familia Batlló."
        - p: "¿Qué es la Manzana de la Discordia?"
          r: "El tramo del Passeig de Gràcia donde conviven edificios modernistas de distintos arquitectos, entre ellos la Casa Batlló, la Casa Amatller y la Casa Lleó Morera."
        - p: "¿Hay que reservar entrada?"
          r: "Sí, conviene reservar con antelación, sobre todo en temporada alta."
        - p: "¿Cuánto dura la visita?"
          r: "Entre una hora y una hora y media, con audioguía."
        - p: "¿Qué no hay que perderse?"
          r: "La fachada, el patio de luces de azulejos azules, el salón principal y la azotea con las chimeneas."
        - p: "¿Es Patrimonio Mundial?"
          r: "Sí, forma parte de las obras de Gaudí declaradas Patrimonio Mundial por la UNESCO."
casa-mila-pedrera:
  relacionados: [casa-batllo, sagrada-familia, park-guell]
  contenido:
    es:
      texto:
        - "La Casa Milà, conocida como La Pedrera, es otra de las grandes obras de Gaudí en Barcelona. Se construyó entre 1906 y 1912 como vivienda para la familia Milà, y su fachada de piedra ondulada, sin apenas líneas rectas, le valió ese apodo de cantera."
        - "Lo más impresionante es la azotea, con sus chimeneas y salidas de ventilación que parecen guerreros esculpidos y con vistas a la ciudad, y el desván, con arcos de ladrillo que forman una estructura de costillas. También se puede visitar un piso reconstruido para ver cómo se vivía a principios del siglo XX."
        - "Reserva con antelación, porque las entradas se agotan en temporada alta, y prevé una hora y media para la visita. La Pedrera también organiza visitas nocturnas y actividades culturales. Forma parte de las obras de Gaudí declaradas Patrimonio Mundial por la UNESCO. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Por qué se llama La Pedrera?"
          r: "Por su fachada de piedra ondulada, que recuerda a una cantera, apodo que se le dio cuando se construyó."
        - p: "¿Qué ver en La Pedrera?"
          r: "La azotea con las chimeneas, el desván con sus arcos y un piso reconstruido de principios del siglo XX."
        - p: "¿Hay que reservar entrada?"
          r: "Sí, conviene reservar con antelación, sobre todo en temporada alta."
        - p: "¿Cuánto dura la visita?"
          r: "Una hora y media aproximadamente."
        - p: "¿Hay visitas nocturnas?"
          r: "La Pedrera organiza visitas y actividades en horario especial. Consulta la oferta en la web oficial."
        - p: "¿Es Patrimonio Mundial?"
          r: "Sí, forma parte de las obras de Gaudí declaradas Patrimonio Mundial por la UNESCO."
palau-musica-catalana:
  relacionados: [gran-teatre-liceu, catedral-barcelona, museo-picasso-barcelona]
  contenido:
    es:
      texto:
        - "El Palau de la Música Catalana es una joya del modernismo, obra de Lluís Domènech i Montaner, inaugurada en 1908. Forma parte, con el Hospital de Sant Pau, del conjunto declarado Patrimonio Mundial por la UNESCO y sigue siendo una sala de conciertos en activo."
        - "La sala principal es el gran atractivo: una claraboya invertida de cristal de colores preside el techo, rodeada de esculturas, mosaicos y vidrieras. Los detalles decorativos, con flores, instrumentos y figuras, cubren casi todas las superficies del edificio, y el fastuoso auditorio es de una belleza muy especial."
        - "Se puede visitar con una visita guiada o asistir a un concierto, que es la mejor manera de vivir la sala con su acústica. Reserva con antelación, porque las visitas se llenan. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el Palau de la Música Catalana?"
          r: "Una sala de conciertos modernista, obra de Domènech i Montaner, inaugurada en 1908 y declarada Patrimonio Mundial."
        - p: "¿Se puede visitar?"
          r: "Sí, con visitas guiadas. Consulta los horarios y la reserva en la web oficial."
        - p: "¿Es mejor visitar o ir a un concierto?"
          r: "Si puedes, un concierto: ves la sala en uso y disfrutas de la acústica. Si no, la visita guiada te permite verla con detalle."
        - p: "¿Cuánto dura la visita?"
          r: "Alrededor de una hora. Consulta la duración exacta en la web."
        - p: "¿Qué no hay que perderse?"
          r: "La gran claraboya de cristal de colores de la sala de conciertos."
gran-teatre-liceu:
  relacionados: [palau-musica-catalana, teatro-real-madrid, catedral-barcelona]
  contenido:
    es:
      texto:
        - "El Gran Teatre del Liceu es el gran teatro de ópera de Barcelona, situado en La Rambla desde 1847. Ha sido escenario de grandes estrenos y de una de las mejores temporadas de ópera de Europa, y es un símbolo cultural de la ciudad."
        - "En 1994 un incendio destruyó gran parte del teatro, que se reconstruyó y reabrió en 1999 respetando su sala en forma de herradura, con palcos dorados y una decoración muy cuidada. Hoy combina la tradición con la tecnología más moderna, y ofrece ópera, ballet y conciertos."
        - "Puedes asistir a una función o hacer una visita guiada, que muestra la sala, los foyers, los salones y algunas zonas de backstage. Reserva con antelación si quieres ver una ópera en temporada, y consulta si hay entradas a precios reducidos. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el Liceu?"
          r: "El gran teatro de ópera de Barcelona, en La Rambla, inaugurado en 1847."
        - p: "¿Qué pasó en 1994?"
          r: "Un incendio destruyó gran parte del edificio, que se reconstruyó y reabrió en 1999."
        - p: "¿Se puede visitar sin ir a una función?"
          r: "Sí, hay visitas guiadas al edificio. Consulta los horarios en la web oficial."
        - p: "¿Hay entradas baratas?"
          r: "El teatro suele ofrecer entradas de distintos precios, incluidas algunas con visibilidad reducida. Consulta la web."
        - p: "¿Qué ropa llevar?"
          r: "No hay código de vestir obligatorio, aunque muchas personas se visten con algo más formal para ir a la ópera."
catedral-barcelona:
  relacionados: [museo-picasso-barcelona, palau-musica-catalana, sagrada-familia]
  contenido:
    es:
      texto:
        - "La Catedral de la Santa Cruz y Santa Eulalia es la catedral gótica de Barcelona, en pleno Barrio Gótico. Se construyó entre los siglos XIII y XV y su fachada principal es de finales del siglo XIX, aunque se inspira en el diseño medieval original."
        - "Por dentro destacan las naves altas y oscuras, el coro de madera tallada, la cripta con el sepulcro de santa Eulalia y el claustro, un remanso de paz con jardín y una colonia de trece ocas que viven en él desde hace siglos. También se puede subir en ascensor a la azotea para ver la ciudad desde arriba."
        - "Muchas personas visitan la catedral en horarios de culto, con entrada gratuita limitada, y existe además una entrada de pago para el recorrido turístico. Respeta el carácter religioso del edificio y la vestimenta adecuada. Los domingos, delante de la catedral, se suele bailar la sardana. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué ver en la catedral de Barcelona?"
          r: "El coro, la cripta de santa Eulalia, el claustro con las ocas y la vista desde la azotea."
        - p: "¿Por qué hay ocas en el claustro?"
          r: "Es una tradición de siglos: hay trece ocas, que recuerdan la edad de santa Eulalia al morir según la leyenda."
        - p: "¿Se puede subir a la azotea?"
          r: "Sí, hay un ascensor que lleva a la azotea, con entrada aparte. Consulta las condiciones."
        - p: "¿Es gratis?"
          r: "Hay horarios de culto con acceso limitado y una entrada de pago para el recorrido turístico. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
        - p: "¿Qué ropa llevar?"
          r: "Ropa discreta, con hombros y rodillas cubiertos, por respeto al carácter religioso del edificio."
        - p: "¿Qué es la sardana?"
          r: "Una danza tradicional catalana que se baila en corro. Suele celebrarse delante de la catedral algunos días; consulta el horario."
mnac-museo-nacional-arte-cataluna:
  relacionados: [museo-picasso-barcelona, museo-arte-contemporaneo-macba, sagrada-familia]
  contenido:
    es:
      texto:
        - "El MNAC, Museo Nacional de Arte de Cataluña, ocupa el Palau Nacional de Montjuïc, un edificio construido para la Exposición Internacional de 1929. Reúne una de las colecciones de arte catalán más completas, desde el románico hasta el siglo XX, con una vista espectacular de Barcelona."
        - "Su gran tesoro es la colección de pintura mural románica, con ábsides completos trasladados desde iglesias del Pirineo, que se exponen recreando su espacio original. También hay arte gótico, renacentista y barroco, y una sección de arte moderno que incluye el modernismo catalán."
        - "Desde la terraza del Palau Nacional se ve toda la ciudad, y delante está la Fuente Mágica de Montjuïc, que ofrece espectáculos de luz y música en horarios concretos. Combina la visita con un paseo por la montaña de Montjuïc. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué hay en el MNAC?"
          r: "Arte catalán desde el románico hasta el siglo XX, con una excepcional colección de pintura mural románica."
        - p: "¿Dónde está?"
          r: "En el Palau Nacional, en la montaña de Montjuïc, Barcelona."
        - p: "¿Qué es la Fuente Mágica?"
          r: "Una fuente de agua, luz y música que ofrece espectáculos en horarios concretos, delante del museo."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Entre dos y tres horas para una visita selectiva."
        - p: "¿Hay buenas vistas?"
          r: "Sí, desde la terraza del Palau Nacional se ve toda Barcelona."
        - p: "¿Cómo llegar?"
          r: "En metro y autobús, o a pie subiendo desde Plaça d'Espanya con las escaleras mecánicas."
museo-arte-contemporaneo-macba:
  relacionados: [museo-picasso-barcelona, mnac-museo-nacional-arte-cataluna, boqueria]
  contenido:
    es:
      texto:
        - "El MACBA, Museo de Arte Contemporáneo de Barcelona, ocupa un edificio blanco y luminoso diseñado por Richard Meier en el barrio del Raval. Su colección recoge arte de la segunda mitad del siglo XX y del siglo XXI, con obras de artistas catalanes, españoles e internacionales."
        - "El museo organiza exposiciones temporales y recorridos por su colección, y está en la plaza dels Àngels, un punto de encuentro de patinadores y jóvenes que da un ambiente muy especial al entorno. Cerca están el CCCB, la Boqueria y la Rambla del Raval."
        - "Si te interesa el arte contemporáneo, es una buena visita de dos horas. Combínalo con un paseo por el Raval y una comida cercana. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué hay en el MACBA?"
          r: "Arte contemporáneo de la segunda mitad del siglo XX y del XXI, con exposiciones temporales y colección propia."
        - p: "¿Quién diseñó el edificio?"
          r: "El arquitecto Richard Meier."
        - p: "¿Dónde está?"
          r: "En el barrio del Raval, en la plaza dels Àngels, en Barcelona."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Alrededor de dos horas."
        - p: "¿Qué hay cerca?"
          r: "El CCCB, el mercado de la Boqueria y la Rambla del Raval."
museo-picasso-barcelona:
  relacionados: [catedral-barcelona, museo-arte-contemporaneo-macba, boqueria]
  contenido:
    es:
      texto:
        - "El Museo Picasso de Barcelona ocupa cinco palacios medievales de la calle Montcada, en el barrio de la Ribera. Su colección se centra en la juventud del artista y en su relación con la ciudad, y es una de las mejores para entender cómo evolucionó Picasso desde sus primeros años."
        - "Reúne obras de su etapa de formación, de su periodo azul y de otras épocas, y sobre todo la serie completa de Las Meninas, una reinterpretación del cuadro de Velázquez que Picasso pintó en 1957. El recorrido permite seguir la evolución del artista antes de llegar a la fama."
        - "Reserva con antelación, porque las entradas se agotan en temporada alta, y prevé una hora y media de visita. Es un museo pequeño y bien organizado, ideal para combinar con un paseo por el Born y la basílica de Santa María del Mar. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué hay en el Museo Picasso?"
          r: "Obras de juventud y de distintas etapas de Picasso, además de la serie completa de Las Meninas."
        - p: "¿Dónde está?"
          r: "En la calle Montcada, en el barrio de la Ribera, en Barcelona, en cinco palacios medievales."
        - p: "¿Hay que reservar entrada?"
          r: "Sí, conviene reservar con antelación, sobre todo en temporada alta."
        - p: "¿Cuánto dura la visita?"
          r: "Una hora y media aproximadamente."
        - p: "¿Qué más ver cerca?"
          r: "La basílica de Santa María del Mar, el barrio del Born y la catedral."
boqueria:
  relacionados: [museo-arte-contemporaneo-macba, catedral-barcelona, museo-picasso-barcelona, mercado-san-miguel]
  contenido:
    es:
      texto:
        - "La Boqueria, oficialmente Mercat de Sant Josep, es el mercado más famoso de Barcelona y uno de los más conocidos de Europa. Se encuentra en La Rambla y reúne puestos de fruta, verdura, carne, pescado, embutidos, dulces y mucho colorido."
        - "Además de comprar producto fresco, se puede comer y picar en los bares del mercado, que sirven platos de cocina catalana como huevos con setas, calamares o tortilla. Los puestos de fruta y zumos recién hechos están a la entrada, y los más tradicionales, en el interior."
        - "Se llena mucho, sobre todo a mediodía, y es una zona con carteristas, así que cuida tus pertenencias. Para comer más auténtico y más barato, evita los puestos de la entrada y adéntrate hacia el interior, o sal a las calles cercanas. Ve a primera hora de la mañana si quieres evitar las multitudes. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es la Boqueria?"
          r: "El mercado más famoso de Barcelona, oficialmente Mercat de Sant Josep, situado en La Rambla."
        - p: "¿Qué se puede comer?"
          r: "Tapas y platos de cocina catalana en los bares del mercado, además de fruta, zumos, embutidos y dulces."
        - p: "¿Cuándo es mejor ir?"
          r: "A primera hora de la mañana, antes de que se llene de gente."
        - p: "¿Es caro?"
          r: "Los puestos de la entrada son los más turísticos y caros. Los del interior y de las calles cercanas suelen ser más económicos."
        - p: "¿Hay peligro de carteristas?"
          r: "Sí, es una zona muy concurrida. Cuida tus pertenencias."
teatro-museo-dali:
  relacionados: [casa-salvador-dali-portlligat, museo-picasso-barcelona, parque-natural-cap-creus]
  contenido:
    es:
      texto:
        - "El Teatro-Museo Dalí, en Figueres, es el gran museo dedicado a Salvador Dalí, creado por el propio artista en el antiguo teatro municipal de su ciudad natal e inaugurado en 1974. Es una obra de arte en sí misma, un espacio surrealista pensado por Dalí como un único objeto teatral."
        - "El recorrido incluye una enorme cúpula geodésica, el patio con el Cadillac lluvioso, la Sala Mae West, obras de todas las épocas del artista y la cripta donde está enterrado. Es un museo lleno de sorpresas y detalles, con una colección que va de sus primeras obras a las últimas."
        - "Figueres está a unas dos horas de Barcelona y a poco más de una de la Costa Brava. Reserva con antelación, porque las entradas se agotan en verano, y combínalo con la Casa de Dalí en Portlligat y el castillo de Púbol para completar el llamado triángulo daliniano. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Quién creó el Teatro-Museo Dalí?"
          r: "El propio Salvador Dalí, que lo diseñó en el antiguo teatro municipal de Figueres, inaugurado como museo en 1974."
        - p: "¿Dónde está enterrado Dalí?"
          r: "En una cripta del propio Teatro-Museo, en Figueres."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Entre dos y tres horas."
        - p: "¿Hay que reservar entrada?"
          r: "Sí, conviene reservar con antelación, sobre todo en verano."
        - p: "¿Qué más ver de Dalí?"
          r: "La Casa de Dalí en Portlligat (Cadaqués) y el castillo de Púbol, que forman el triángulo daliniano."
        - p: "¿Cómo llegar desde Barcelona?"
          r: "En tren o autobús hasta Figueres, en aproximadamente dos horas."
casa-salvador-dali-portlligat:
  relacionados: [teatro-museo-dali, parque-natural-cap-creus]
  contenido:
    es:
      texto:
        - "La Casa de Salvador Dalí en Portlligat, junto a Cadaqués, es la casa donde vivió y trabajó el artista durante gran parte de su vida. Está en una pequeña bahía de la Costa Brava, y se ha mantenido casi igual que cuando vivían Dalí y Gala."
        - "El recorrido incluye el taller, la biblioteca, el dormitorio, los patios y el jardín con su piscina en forma de falo, además de las obras y los objetos que el artista usaba. Es una visita muy íntima, que permite entender la relación entre Dalí, el paisaje y su obra."
        - "El acceso es muy limitado: las visitas son en grupos reducidos y con horario fijado, así que reserva con mucha antelación. Cadaqués es un pueblo precioso de casas blancas, con una iglesia que domina la bahía, y está dentro del Parque Natural del Cap de Creus. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Es difícil conseguir entrada?"
          r: "El aforo es muy limitado y se visita en grupos con hora fijada, así que reserva con mucha antelación."
        - p: "¿Qué se puede ver?"
          r: "El taller, la biblioteca, el dormitorio, los patios y el jardín con la piscina."
        - p: "¿Cuánto dura la visita?"
          r: "Es una visita corta, de menos de una hora. Consulta la duración exacta en la web."
        - p: "¿Cómo llegar?"
          r: "Desde Cadaqués, en coche o a pie por un sendero costero. Consulta las condiciones de acceso."
        - p: "¿Qué más ver cerca?"
          r: "El pueblo de Cadaqués y el Parque Natural del Cap de Creus."
monasterio-santa-maria-ripoll:
  relacionados: [monasterio-san-juan-abadesas, parque-natural-zona-volcanica-garrotxa, catedral-barcelona]
  contenido:
    es:
      texto:
        - "El Monasterio de Santa María de Ripoll es uno de los grandes monumentos del románico catalán y un lugar clave en la historia de Cataluña. Fundado en el siglo IX por Wifredo el Velloso, se le considera cuna de Cataluña y alberga su sepulcro."
        - "Lo más impresionante es la portada, una obra maestra de la escultura románica del siglo XII, con relieves que narran escenas del Antiguo y el Nuevo Testamento a modo de gran libro de piedra. El claustro, de dos pisos, es otro de los grandes atractivos."
        - "Ripoll está en el Ripollès, a unos 100 kilómetros de Barcelona, y es una buena excursión de un día que se combina con Sant Joan de les Abadesses. Consulta los horarios de apertura del monasterio y del claustro, y prevé una hora de visita. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el Monasterio de Ripoll?"
          r: "Un monasterio benedictino fundado en el siglo IX, considerado cuna de Cataluña, con una portada románica excepcional."
        - p: "¿Qué ver?"
          r: "La portada esculpida del siglo XII, el claustro y la iglesia con el sepulcro de Wifredo el Velloso."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Alrededor de una hora."
        - p: "¿Cómo llegar desde Barcelona?"
          r: "En tren desde Barcelona hasta Ripoll, o en coche. Consulta los horarios."
        - p: "¿Qué más ver cerca?"
          r: "El monasterio de Sant Joan de les Abadesses y la Zona Volcánica de la Garrotxa."
monasterio-san-juan-abadesas:
  relacionados: [monasterio-santa-maria-ripoll, parque-natural-zona-volcanica-garrotxa]
  contenido:
    es:
      texto:
        - "El Monasterio de Sant Joan de les Abadesses es uno de los grandes monumentos del románico catalán. Fundado en el siglo IX, está en el Ripollès y destaca por su iglesia románica y por el Santísimo Misterio, un conjunto escultórico del siglo XIII."
        - "El Santísimo Misterio es un grupo de madera policromada que representa el Descendimiento de la cruz, una obra de gran expresividad. El monasterio incluye también un claustro gótico, un museo con piezas de orfebrería y textiles y una iglesia de planta basilical."
        - "El pueblo, con su puente medieval, es muy agradable para pasear y combina bien con Ripoll, a pocos kilómetros. Consulta los horarios de visita del monasterio y prevé una hora. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el Santísimo Misterio?"
          r: "Un conjunto escultórico de madera policromada del siglo XIII que representa el Descendimiento de la cruz."
        - p: "¿Qué más hay en el monasterio?"
          r: "Una iglesia románica, un claustro y un museo con piezas de orfebrería y textiles."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Alrededor de una hora."
        - p: "¿Qué más ver cerca?"
          r: "El monasterio de Santa María de Ripoll, el puente medieval del pueblo y la Garrotxa."
        - p: "¿Cómo llegar?"
          r: "En coche desde Ripoll o Barcelona. El transporte público es más limitado; consulta horarios."
ciudad-artes-ciencias:
  relacionados: [museo-las-ciencias, lonja-seda, catedral-valencia, fallas]
  contenido:
    es:
      texto:
        - "La Ciudad de las Artes y las Ciencias es el gran complejo cultural y de ocio de Valencia, un conjunto de edificios futuristas obra de Santiago Calatrava y Félix Candela que se ha convertido en uno de los símbolos de la ciudad. Está en el antiguo cauce del río Turia, hoy un gran jardín."
        - "Reúne varios espacios: el Hemisfèric, con su cine IMAX y planetario con forma de ojo; el Museu de les Ciències Príncipe Felipe; el Oceanogràfic, uno de los mayores acuarios de Europa; el Palau de les Arts Reina Sofía, dedicado a la ópera; el Ágora y el Umbracle, un paseo con jardines. Cada uno se visita por separado y hay entradas combinadas."
        - "Aunque se puede pasear por el exterior sin pagar, el interior de los edificios requiere entrada. Si vas con niños, el Oceanogràfic y el Museo de las Ciencias son los más recomendables. Ve en bici o a pie desde el jardín del Turia y evita las horas de más calor. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué incluye la Ciudad de las Artes y las Ciencias?"
          r: "El Hemisfèric, el Museu de les Ciències, el Oceanogràfic, el Palau de les Arts, el Ágora y el Umbracle."
        - p: "¿Se puede entrar gratis?"
          r: "Se puede pasear por el exterior, pero el acceso a los edificios requiere entrada. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
        - p: "¿Qué ver si tengo poco tiempo?"
          r: "Un paseo por el exterior para ver la arquitectura y, si hay tiempo, el Oceanogràfic o el Museo de las Ciencias."
        - p: "¿Es buen plan con niños?"
          r: "Sí, el Oceanogràfic y el Museo de las Ciencias están muy pensados para las familias."
        - p: "¿Cómo llegar?"
          r: "En metro, tranvía o autobús, o a pie y en bici por el jardín del Turia."
        - p: "¿Hay entradas combinadas?"
          r: "Sí, existen entradas combinadas para varios espacios. Consulta las opciones en la web oficial."
museo-las-ciencias:
  relacionados: [ciudad-artes-ciencias, instituto-valenciano-arte-moderno-ivam, lonja-seda]
  contenido:
    es:
      texto:
        - "El Museo de las Ciencias Príncipe Felipe, dentro de la Ciudad de las Artes y las Ciencias, es un museo interactivo pensado para tocar, experimentar y aprender. Su lema, prohibido no tocar, resume su filosofía: aquí la ciencia se explica a través de exhibiciones y experimentos."
        - "Ocupa un gran edificio de Calatrava con forma de esqueleto de ballena. Incluye exposiciones permanentes dedicadas a la genética, la física, la geología o el cuerpo humano, además de exposiciones temporales y espacios de juego para los más pequeños."
        - "Es uno de los mejores museos de España para ir con niños, y también interesa a los adultos. Prevé entre dos y tres horas de visita y consulta si hay talleres o actividades. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el Museo de las Ciencias?"
          r: "Un museo interactivo en el que se puede tocar y experimentar, dentro de la Ciudad de las Artes y las Ciencias."
        - p: "¿Es buen plan con niños?"
          r: "Sí, es uno de los mejores museos de España para familias."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Entre dos y tres horas."
        - p: "¿Qué ver?"
          r: "Exposiciones sobre el cuerpo humano, la genética, la física y la geología, además de exposiciones temporales."
        - p: "¿Hay entradas combinadas?"
          r: "Sí, se puede combinar con otros espacios de la Ciudad de las Artes y las Ciencias."
lonja-seda:
  relacionados: [catedral-valencia, miguelete, palacio-generalitat, ciudad-artes-ciencias]
  contenido:
    es:
      texto:
        - "La Lonja de la Seda es uno de los grandes monumentos del gótico civil europeo y Patrimonio Mundial de la UNESCO desde 1996. Se construyó entre los siglos XV y XVI como sede de las transacciones mercantiles de la seda, en la época de mayor esplendor de Valencia."
        - "Lo más espectacular es la Sala de Contratación, una gran nave con columnas helicoidales que se abren como palmeras hasta formar bóvedas. Además, el edificio tiene un patio de naranjos, una torre y un salón del Consulado del Mar, con un techo de madera policromada."
        - "Es una visita corta, de una hora aproximadamente, y está en el centro, junto al Mercado Central. Combínala con la catedral y el Miguelete. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es la Lonja de la Seda?"
          r: "Un edificio gótico civil del siglo XV, antigua sede de las transacciones de la seda, declarado Patrimonio Mundial."
        - p: "¿Qué ver?"
          r: "La Sala de Contratación con sus columnas helicoidales, el patio de naranjos y el salón del Consulado del Mar."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Alrededor de una hora."
        - p: "¿Dónde está?"
          r: "En el centro de Valencia, junto al Mercado Central."
        - p: "¿Es Patrimonio Mundial?"
          r: "Sí, desde 1996, declarada por la UNESCO."
catedral-valencia:
  relacionados: [miguelete, lonja-seda, palacio-generalitat]
  contenido:
    es:
      texto:
        - "La Catedral de Valencia es un templo gótico con elementos románicos, renacentistas y barrocos que reflejan siglos de historia. Está en pleno centro, junto a la plaza de la Virgen, y es el gran templo de la ciudad."
        - "Guarda en su capilla del Santo Cáliz una copa que la tradición considera el Santo Grial, un objeto de gran devoción. También destacan sus puertas, como la de los Apóstoles, donde los jueves a mediodía se reúne el Tribunal de las Aguas, la institución más antigua de Europa que sigue en funcionamiento. Además, se puede subir al Miguelete, su torre campanario."
        - "Respeta el carácter religioso del edificio y la vestimenta adecuada. Consulta los horarios de visita, porque algunas zonas se cierran durante el culto. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el Santo Cáliz?"
          r: "Una copa que la tradición considera el Santo Grial y que se venera en una capilla de la catedral."
        - p: "¿Qué es el Tribunal de las Aguas?"
          r: "Una institución medieval que resuelve cada jueves a mediodía los conflictos de riego de la huerta, ante la puerta de los Apóstoles."
        - p: "¿Se puede subir a la torre?"
          r: "Sí, al Miguelete, la torre campanario. Consulta las condiciones de acceso."
        - p: "¿Es gratis?"
          r: "Hay una entrada para el recorrido turístico. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
        - p: "¿Qué ropa llevar?"
          r: "Ropa discreta, con hombros y rodillas cubiertos, por respeto al carácter religioso del edificio."
miguelete:
  relacionados: [catedral-valencia, lonja-seda, palacio-generalitat]
  contenido:
    es:
      texto:
        - "El Miguelete es la torre campanario de la Catedral de Valencia, uno de los símbolos de la ciudad. Es una torre gótica octogonal de unos 50 metros de altura y su nombre procede de la campana de San Miguel, que se colocó en el siglo XV."
        - "Subir es una de las visitas más populares de Valencia. Hay más de doscientos escalones de caracol, con tramos estrechos, hasta llegar a la terraza, donde las vistas de los tejados, las calles y el casco antiguo son magníficas. Desde arriba se aprecia bien la forma del casco histórico."
        - "La escalera es estrecha y se hace a pie: no es apta para personas con movilidad reducida ni recomendable si tienes vértigo o claustrofobia. Evita las horas de más calor y compra la entrada con antelación si puedes. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Cuántos escalones tiene?"
          r: "Más de doscientos, en una escalera de caracol estrecha."
        - p: "¿Merece la pena subir?"
          r: "Sí, las vistas del casco antiguo y de la ciudad desde la terraza son de las mejores de Valencia."
        - p: "¿Es apto para todo el mundo?"
          r: "No. La escalera es estrecha y no es adecuada para personas con movilidad reducida, vértigo o claustrofobia."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Unos 30-45 minutos entre subida, vistas y bajada."
        - p: "¿Cuándo es mejor ir?"
          r: "A primera hora o al atardecer, para evitar el calor y las colas."
palacio-generalitat:
  relacionados: [catedral-valencia, lonja-seda, miguelete]
  contenido:
    es:
      texto:
        - "El Palacio de la Generalitat es la sede del gobierno autonómico valenciano y un excelente ejemplo del gótico civil valenciano. Se construyó entre los siglos XV y XVI, y su fachada, con una galería y una torre, es una de las más reconocibles del centro de Valencia."
        - "Por dentro destacan el Salón de Cortes, con un techo de madera dorada y policromada, y el patio gótico con una escalera de piedra. El edificio conserva pinturas, tapices y objetos históricos que cuentan la historia de las instituciones valencianas."
        - "Se puede visitar con visitas guiadas en determinados días y con reserva, normalmente gratuitas. Consulta los horarios con antelación, porque cambian. Está en la plaza de Manises, junto a la catedral. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el Palacio de la Generalitat?"
          r: "La sede del gobierno autonómico valenciano, en un edificio gótico de los siglos XV y XVI."
        - p: "¿Se puede visitar?"
          r: "Sí, con visitas guiadas en determinados días y con reserva. Consulta la web oficial."
        - p: "¿Qué ver?"
          r: "El Salón de Cortes con su techo dorado, el patio gótico y la escalera de piedra."
        - p: "¿Es gratis?"
          r: "Las visitas suelen ser gratuitas, pero conviene confirmarlo y reservar. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
        - p: "¿Dónde está?"
          r: "En la plaza de Manises, junto a la catedral, en el centro de Valencia."
palau-musica-valencia:
  relacionados: [ciudad-artes-ciencias, instituto-valenciano-arte-moderno-ivam, estacion-norte]
  contenido:
    es:
      texto:
        - "El Palau de la Música de València es una gran sala de conciertos situada en los jardines del antiguo cauce del Turia, inaugurada en 1987. Es sede de orquestas y de una programación de música clásica, ópera, jazz y música popular, y un lugar de referencia de la vida cultural de la ciudad."
        - "El edificio, de líneas contemporáneas, destaca por su gran cúpula de cristal y por los jardines que lo rodean. La sala principal tiene una acústica muy cuidada y acoge conciertos de la Orquesta de Valencia y de grandes artistas nacionales e internacionales."
        - "Lo mejor es consultar la programación y asistir a un concierto. El entorno, con el jardín del Turia, es perfecto para pasear antes o después. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el Palau de la Música?"
          r: "Una sala de conciertos en el jardín del Turia, inaugurada en 1987."
        - p: "¿Qué se puede ver?"
          r: "Conciertos de música clásica, ópera, jazz y otros géneros. Consulta la programación."
        - p: "¿Dónde está?"
          r: "En los jardines del antiguo cauce del Turia, en Valencia."
        - p: "¿Se puede visitar sin concierto?"
          r: "Depende de la programación y de las visitas organizadas. Consulta la web oficial."
        - p: "¿Qué más hacer cerca?"
          r: "Pasear por el jardín del Turia y visitar el Museo de Bellas Artes o los Jardines de Viveros."
instituto-valenciano-arte-moderno-ivam:
  relacionados: [museo-las-ciencias, ciudad-artes-ciencias, palau-musica-valencia]
  contenido:
    es:
      texto:
        - "El IVAM, Instituto Valenciano de Arte Moderno, es el gran museo de arte moderno y contemporáneo de la Comunidad Valenciana. Fue inaugurado en 1989 y su colección parte de la obra del escultor Julio González, con un fondo importante de arte del siglo XX."
        - "Su colección permanente incluye obras de Julio González, vanguardias españolas y europeas, fotografía y artistas contemporáneos, además de un programa de exposiciones temporales que cambia con frecuencia. Es un museo pensado para recorrer con calma."
        - "Prevé entre una hora y media y dos de visita, y consulta la programación de exposiciones temporales antes de ir, porque a veces son el atractivo principal. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué hay en el IVAM?"
          r: "Arte moderno y contemporáneo, con una colección centrada en Julio González y vanguardias del siglo XX, además de exposiciones temporales."
        - p: "¿Quién fue Julio González?"
          r: "Un escultor español, pionero de la escultura en hierro, cuya obra es la base de la colección."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Entre una hora y media y dos horas."
        - p: "¿Hay exposiciones temporales?"
          r: "Sí, el museo programa varias al año. Consulta la web."
        - p: "¿Dónde está?"
          r: "En el centro de Valencia, junto al antiguo cauce del Turia."
estacion-norte:
  relacionados: [lonja-seda, catedral-valencia, palacio-generalitat]
  contenido:
    es:
      texto:
        - "La Estación del Norte de Valencia es una estación ferroviaria modernista inaugurada en 1917, una de las más bellas de España. Su fachada, decorada con motivos de naranjas, flores y mosaicos, la convierte en un monumento en sí misma, junto a la plaza de toros y al ayuntamiento."
        - "Por dentro destacan el vestíbulo, con mosaicos cerámicos y marquetería, y las taquillas de madera tallada, que conservan el aire de la época. Aunque es una estación en activo, se puede visitar sin necesidad de viajar y merece una parada breve."
        - "Es una visita rápida, de unos 15 o 20 minutos, que se combina bien con un paseo por el centro, la plaza del Ayuntamiento y la Plaza de Toros. Si llegas en tren, aprovecha para verla con calma. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es la Estación del Norte?"
          r: "La principal estación de Valencia, un edificio modernista inaugurado en 1917."
        - p: "¿Se puede visitar sin viajar?"
          r: "Sí, el vestíbulo y las taquillas se pueden ver sin billete."
        - p: "¿Qué ver?"
          r: "La fachada con motivos de naranjas y flores, el vestíbulo con mosaicos cerámicos y las taquillas de madera."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Unos 15-20 minutos."
        - p: "¿Qué hay cerca?"
          r: "La plaza del Ayuntamiento, la plaza de Toros y el centro histórico."
castillo-santa-barbara:
  relacionados: [palmeral, san-juan, castillo-peniscola]
  contenido:
    es:
      texto:
        - "El Castillo de Santa Bárbara domina Alicante desde lo alto del monte Benacantil y es el gran mirador de la ciudad. Es una fortaleza medieval con siglos de historia, que fue ampliada en distintas épocas y que ofrece unas vistas espectaculares de la bahía, el puerto y la costa."
        - "Se puede subir a pie por un sendero o en coche, y también en un ascensor desde la playa del Postiguet. El recorrido incluye patios, murallas, salas y un pequeño museo que explica la historia del castillo y de la ciudad. Al atardecer, la luz sobre la bahía es especialmente bonita."
        - "Lleva calzado cómodo, agua y protección solar, porque en verano hace mucho calor y hay poca sombra. Prevé entre una hora y dos de visita. Consulta las condiciones de acceso y si hay entrada. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Cómo se sube al castillo?"
          r: "A pie por un sendero, en coche o en ascensor desde la playa del Postiguet."
        - p: "¿Es gratis?"
          r: "Consulta las condiciones de acceso en la web oficial, porque pueden cambiar."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Entre una y dos horas, según lo que veas."
        - p: "¿Cuándo es mejor ir?"
          r: "Al atardecer, para evitar el calor y ver la ciudad con la mejor luz."
        - p: "¿Qué ropa y calzado llevar?"
          r: "Calzado cómodo, gorra, agua y protección solar, sobre todo en verano."
        - p: "¿Es buen plan con niños?"
          r: "Sí, aunque hay cuestas y escaleras. El ascensor facilita el acceso."
palmeral:
  relacionados: [castillo-santa-barbara, castillo-peniscola, catedral-segorbe]
  contenido:
    es:
      texto:
        - "El Palmeral de Elche es el mayor palmeral de Europa y un paisaje único, Patrimonio Mundial de la UNESCO desde el año 2000. Creado en época andalusí con un sistema de riego, reúne a decenas de miles de palmeras datileras que forman un bosque de huertos urbanos."
        - "Dentro del palmeral hay lugares muy visitados, como el Huerto del Cura, un jardín con la palmera imperial, y otras zonas con senderos, estanques y acequias. Elche también es famosa por el Misteri d'Elx, una representación religiosa medieval que se celebra cada agosto, declarada Patrimonio Inmaterial."
        - "Lo mejor es recorrerlo a pie, con calma y a primera hora o al atardecer, evitando las horas de más calor. Lleva agua y protección solar, y consulta las visitas guiadas y las entradas del Huerto del Cura. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el Palmeral de Elche?"
          r: "El mayor palmeral de Europa, creado en época andalusí y Patrimonio Mundial de la UNESCO."
        - p: "¿Qué es el Huerto del Cura?"
          r: "Un jardín dentro del palmeral, con una palmera imperial y otras especies de plantas."
        - p: "¿Qué es el Misteri d'Elx?"
          r: "Una representación religiosa medieval que se celebra en agosto en Elche, declarada Patrimonio Inmaterial."
        - p: "¿Cuándo es mejor ir?"
          r: "A primera hora o al atardecer, para evitar el calor."
        - p: "¿Es gratis?"
          r: "Hay zonas de acceso libre y espacios de pago, como el Huerto del Cura. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
castillo-peniscola:
  relacionados: [castillo-santa-barbara, palmeral, catedral-segorbe]
  contenido:
    es:
      texto:
        - "El Castillo de Peñíscola es una fortaleza templaria del siglo XIII que se alza sobre un peñón que entra en el Mediterráneo y es uno de los castillos más fotogénicos de España. Fue residencia del papa Luna, Benedicto XIII, durante el cisma de Occidente, y ha servido de escenario de series y películas."
        - "La visita recorre patios, salones, la iglesia, los jardines y el torreón con vistas, con una exposición sobre su historia. El casco antiguo de Peñíscola, de calles estrechas y casas blancas, rodea el castillo y se recorre en un paseo agradable, con tiendas y bares."
        - "Evita las horas de calor en verano y prevé una hora y media de visita. Lleva calzado cómodo, porque hay escaleras y cuestas, y consulta si hay visitas guiadas o nocturnas. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Quién fue el papa Luna?"
          r: "Benedicto XIII, que vivió en el castillo de Peñíscola durante el cisma de Occidente."
        - p: "¿Qué ver?"
          r: "Los patios, la iglesia, los salones, los jardines y las vistas del Mediterráneo desde las torres."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Alrededor de una hora y media."
        - p: "¿Cuándo es mejor ir?"
          r: "A primera hora o al atardecer, para evitar el calor y las aglomeraciones."
        - p: "¿Es buen plan con niños?"
          r: "Sí, aunque hay escaleras y cuestas. Les suele gustar por su aspecto de fortaleza."
catedral-segorbe:
  relacionados: [castillo-peniscola, palmeral, catedral-valencia]
  contenido:
    es:
      texto:
        - "La Catedral de Segorbe es el gran templo de esta ciudad del interior de Castellón, sede episcopal de la diócesis de Segorbe-Castellón. Un edificio de origen gótico, con añadidos posteriores, que conserva su claustro y un importante museo catedralicio."
        - "El museo reúne retablos, tallas, orfebrería y otras piezas de arte sacro de gran valor, y permite conocer la historia religiosa y artística de la ciudad. El claustro y las capillas completan la visita, en un ambiente tranquilo y poco masificado."
        - "Segorbe es una buena excursión desde Valencia o Castellón, con un casco antiguo bien conservado y una gastronomía con productos de la sierra. Consulta los horarios de visita, que suelen ser limitados. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es la Catedral de Segorbe?"
          r: "La catedral de la diócesis de Segorbe-Castellón, un edificio de origen gótico con museo catedralicio."
        - p: "¿Qué ver?"
          r: "El museo catedralicio, el claustro y las capillas."
        - p: "¿Dónde está?"
          r: "En Segorbe, en el interior de Castellón, a unos 60 kilómetros de Valencia."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Alrededor de una hora."
        - p: "¿Qué más ver en Segorbe?"
          r: "El casco antiguo, las murallas y los paisajes de la sierra Espadán."
real-alcazar-sevilla:
  relacionados: [giralda, archivo-general-indias, casa-pilatos, feria-abril]
  contenido:
    es:
      texto:
        - "El Real Alcázar de Sevilla es un palacio fortificado de origen musulmán, ampliado con los siglos, y uno de los mejores ejemplos del estilo mudéjar. Es Patrimonio Mundial junto con la catedral y el Archivo de Indias, y sigue siendo residencia oficial del Rey cuando visita la ciudad."
        - "El corazón del conjunto es el Palacio de Pedro I, del siglo XIV, con el Patio de las Doncellas, el Salón de Embajadores con su cúpula dorada y yeserías de gran delicadeza. A su alrededor se extienden jardines con estanques, fuentes, naranjos y rincones sombreados. Ha sido escenario de series y películas, entre ellas Juego de Tronos."
        - "Reserva la entrada con antelación, porque se agota, sobre todo en primavera y otoño. Prevé entre dos y tres horas de visita y evita las horas de más calor si vas en verano. Combina el Alcázar con la catedral, la Giralda y el barrio de Santa Cruz, que están al lado. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el Real Alcázar de Sevilla?"
          r: "Un palacio fortificado de origen musulmán, ampliado en época cristiana, con el Palacio mudéjar de Pedro I como pieza central."
        - p: "¿Hay que reservar entrada?"
          r: "Sí, conviene reservar con antelación, sobre todo en temporada alta."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Entre dos y tres horas, entre palacios y jardines."
        - p: "¿Qué no hay que perderse?"
          r: "El Patio de las Doncellas, el Salón de Embajadores, el Palacio de Carlos V y los jardines."
        - p: "¿Sigue siendo residencia real?"
          r: "Sí, forma parte de las residencias oficiales del Rey y se usa para actos oficiales."
        - p: "¿Es Patrimonio Mundial?"
          r: "Sí, junto con la catedral y el Archivo General de Indias, desde 1987."
giralda:
  relacionados: [real-alcazar-sevilla, torre-oro, barrio-santa-cruz, semana-santa-sevilla]
  contenido:
    es:
      texto:
        - "La Giralda es el símbolo de Sevilla. Era el alminar de la antigua mezquita almohade, construido en el siglo XII, al que los cristianos añadieron en el siglo XVI un campanario renacentista. Hoy forma parte de la catedral, Patrimonio Mundial junto al Alcázar y el Archivo de Indias."
        - "Subir a la Giralda es una de las experiencias más populares de la ciudad. En vez de escaleras tiene rampas, que según la tradición permitían subir a caballo, y desde lo alto se ve toda Sevilla, con los tejados, los patios de la catedral y el río. La entrada a la torre suele incluir la visita a la catedral."
        - "Compra las entradas con antelación y evita las horas de más calor. En la catedral también puedes ver el sepulcro de Cristóbal Colón y el retablo mayor. Prevé una hora y media para el conjunto. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es la Giralda?"
          r: "La torre de la catedral de Sevilla, antiguo alminar de la mezquita almohade del siglo XII, con un campanario renacentista añadido después."
        - p: "¿Se puede subir?"
          r: "Sí, por rampas en vez de escaleras. Desde lo alto hay vistas de toda la ciudad."
        - p: "¿Hay que pagar?"
          r: "La entrada a la catedral y la Giralda es de pago, con condiciones especiales en algunos horarios. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
        - p: "¿Qué más ver en la catedral?"
          r: "El sepulcro de Colón, el retablo mayor y el patio de los Naranjos."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Alrededor de hora y media para catedral y torre."
torre-oro:
  relacionados: [giralda, real-alcazar-sevilla, plaza-espana-sevilla]
  contenido:
    es:
      texto:
        - "La Torre del Oro es una torre albarrana de origen almohade, construida a comienzos del siglo XIII a orillas del Guadalquivir como parte de las defensas de la ciudad. Su nombre se atribuye a los reflejos dorados de sus azulejos sobre el agua, o al oro llegado de América que se guardó en ella."
        - "Hoy alberga un pequeño museo naval, con maquetas, instrumentos y documentos sobre la historia del puerto de Sevilla, y desde su azotea se ven el río y el casco antiguo. La visita es corta, de unos 20 o 30 minutos, y combina bien con un paseo por el paseo de Colón."
        - "Es una de las imágenes más típicas de Sevilla, y se ve especialmente bien al atardecer, con la luz sobre el río. Aprovecha para cruzar el puente de Triana o pasear por la orilla. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es la Torre del Oro?"
          r: "Una torre defensiva de origen almohade, del siglo XIII, a orillas del Guadalquivir."
        - p: "¿Por qué se llama así?"
          r: "Se atribuye a los reflejos dorados de sus azulejos sobre el agua, o al oro que llegó de América."
        - p: "¿Se puede visitar?"
          r: "Sí, alberga un museo naval. Consulta los horarios y las condiciones."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Unos 20-30 minutos."
        - p: "¿Cuándo es mejor verla?"
          r: "Al atardecer, cuando la luz reflejada en el río da más color."
archivo-general-indias:
  relacionados: [real-alcazar-sevilla, giralda, casa-pilatos]
  contenido:
    es:
      texto:
        - "El Archivo General de Indias es uno de los grandes archivos del mundo y custodia millones de documentos sobre la historia de la América española, la administración colonial y los viajes de descubrimiento. Está en la antigua Casa Lonja de Mercaderes, un edificio renacentista de Juan de Herrera, del siglo XVI."
        - "Entre los documentos se conservan cartas de Colón, Hernán Cortés, Cervantes o Magallanes, mapas, planos y dibujos. En la visita se ve el edificio, la gran escalera de mármol y jaspe, y exposiciones que muestran algunos de los documentos más significativos."
        - "Es una visita corta, de entre 30 y 60 minutos, ideal para combinar con la catedral y el Alcázar, que están a pocos pasos. Forma parte, junto con ellos, del conjunto Patrimonio Mundial de la UNESCO. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el Archivo General de Indias?"
          r: "Un archivo con millones de documentos sobre la América española, instalado en la antigua Lonja de Mercaderes de Sevilla."
        - p: "¿Qué documentos hay?"
          r: "Documentos de Colón, Cortés, Magallanes y otros personajes, además de mapas, planos y dibujos."
        - p: "¿Se puede visitar?"
          r: "Sí, hay visita al edificio y exposiciones. Consulta los horarios y condiciones."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Entre 30 y 60 minutos."
        - p: "¿Es Patrimonio Mundial?"
          r: "Sí, forma parte del conjunto de la catedral, el Alcázar y el Archivo de Indias."
casa-pilatos:
  relacionados: [real-alcazar-sevilla, barrio-santa-cruz, archivo-general-indias]
  contenido:
    es:
      texto:
        - "La Casa de Pilatos es uno de los palacios más bellos de Sevilla, una mezcla de estilos mudéjar, gótico y renacentista italiano. Construida a finales del siglo XV y comienzos del XVI por la familia Enríquez de Ribera, hoy pertenece a la casa ducal de Medinaceli."
        - "Destaca por su patio principal, con arcos, azulejos y yeserías, y por sus jardines. Conserva una de las mayores colecciones de azulejos de España, además de esculturas clásicas, techos artesonados y una escalera con cúpula. El recorrido tiene una planta baja y una alta, esta última con visita guiada."
        - "Es una visita agradable, de una hora, menos masificada que el Alcázar. Se encuentra en el centro, cerca del barrio de Santa Cruz y de la plaza del Salvador. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es la Casa de Pilatos?"
          r: "Un palacio sevillano de los siglos XV y XVI, con estilos mudéjar, gótico y renacentista."
        - p: "¿Qué ver?"
          r: "El patio principal con azulejos, los jardines, las esculturas clásicas y la escalera con cúpula."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Alrededor de una hora."
        - p: "¿Quién es su propietario?"
          r: "Pertenece a la casa ducal de Medinaceli."
        - p: "¿Dónde está?"
          r: "En el centro de Sevilla, cerca del barrio de Santa Cruz."
plaza-espana-sevilla:
  relacionados: [parque-maria-luisa, torre-oro, real-alcazar-sevilla]
  contenido:
    es:
      texto:
        - "La Plaza de España es una de las plazas más hermosas de España. Diseñada por Aníbal González para la Exposición Iberoamericana de 1929, tiene forma de semicírculo, con un gran edificio de ladrillo y cerámica, una torre a cada extremo y un canal con puentes."
        - "A lo largo de la plaza hay bancos de azulejos que representan las provincias españolas, cada una con su escudo y una escena histórica. Se puede pasear por los soportales, cruzar los puentes y alquilar una barca en el canal. Ha sido escenario de películas, como una de la saga Star Wars."
        - "La entrada es libre y está junto al parque de María Luisa. Ve a primera hora o al atardecer, cuando hay menos gente y mejor luz, y evita las horas de más calor. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es la Plaza de España?"
          r: "Una gran plaza semicircular construida para la Exposición Iberoamericana de 1929, obra de Aníbal González."
        - p: "¿Se paga entrada?"
          r: "No, es de acceso libre. Las barcas del canal sí son de pago."
        - p: "¿Qué ver?"
          r: "Los bancos de azulejos de las provincias, los puentes, las torres y el canal."
        - p: "¿Cuándo es mejor ir?"
          r: "A primera hora o al atardecer, para evitar las multitudes y el calor."
        - p: "¿Qué hay cerca?"
          r: "El parque de María Luisa y el barrio de Santa Cruz."
parque-maria-luisa:
  relacionados: [plaza-espana-sevilla, torre-oro, barrio-santa-cruz]
  contenido:
    es:
      texto:
        - "El Parque de María Luisa es el gran pulmón verde de Sevilla, un parque romántico con jardines, fuentes, estanques y pabellones que se creó para la Exposición Iberoamericana de 1929. Se llega desde la Plaza de España y es perfecto para pasear a la sombra."
        - "Entre sus rincones más bonitos están la Glorieta de Bécquer, con monumentos al poeta, la Fuente de las Ranas y la Plaza de América, con tres pabellones y palomas. En los pabellones están el Museo Arqueológico y el Museo de Artes y Costumbres Populares."
        - "La entrada es libre y se puede recorrer a pie, en bici o en coche de caballos. Es un buen plan para las horas de calor, con sombras y agua. Llévate agua y calzado cómodo. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué ver en el Parque de María Luisa?"
          r: "La Glorieta de Bécquer, la Fuente de las Ranas, la Plaza de América y los pabellones con museos."
        - p: "¿Es gratis?"
          r: "Sí, el acceso al parque es libre."
        - p: "¿Cómo recorrerlo?"
          r: "A pie, en bici o en coche de caballos."
        - p: "¿Qué museos hay?"
          r: "El Museo Arqueológico y el Museo de Artes y Costumbres Populares, en la Plaza de América."
        - p: "¿Es buen plan con niños?"
          r: "Sí, hay mucho espacio, fuentes y palomas, y se puede alquilar bici o carrito."
barrio-santa-cruz:
  relacionados: [giralda, real-alcazar-sevilla, casa-pilatos]
  contenido:
    es:
      texto:
        - "El barrio de Santa Cruz es el antiguo barrio judío de Sevilla y uno de los rincones más encantadores del centro histórico. Sus callejuelas estrechas, plazas con naranjos, casas encaladas y patios con flores forman un laberinto pensado para perderse."
        - "Entre sus lugares más conocidos están la plaza de Doña Elvira, la calle Agua, la plaza de los Venerables y los Jardines de Murillo. Aquí se siente la Sevilla más tradicional, con tabernas, tiendas de artesanía y rincones tranquilos a pocos metros de la catedral y del Alcázar."
        - "Lo mejor es recorrerlo a pie, sin prisas y sin mapa, a primera hora de la mañana o al atardecer, cuando hay menos gente. En las horas centrales se llena de turistas y calor. Cuida tus pertenencias y prueba una tapa en alguna taberna del barrio. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el barrio de Santa Cruz?"
          r: "El antiguo barrio judío de Sevilla, con calles estrechas, plazas con naranjos y casas encaladas."
        - p: "¿Qué ver?"
          r: "La plaza de Doña Elvira, la calle Agua, la plaza de los Venerables y los Jardines de Murillo."
        - p: "¿Cuándo es mejor ir?"
          r: "A primera hora o al atardecer, para evitar el calor y las multitudes."
        - p: "¿Es seguro?"
          r: "Es una zona muy concurrida, así que conviene cuidar tus pertenencias."
        - p: "¿Qué más hay cerca?"
          r: "La catedral, la Giralda, el Alcázar y la Casa de Pilatos."
metropol-parasol:
  relacionados: [giralda, ayuntamiento-sevilla, barrio-santa-cruz]
  contenido:
    es:
      texto:
        - "Las Setas de Sevilla, oficialmente Metropol Parasol, son una enorme estructura de madera diseñada por el arquitecto Jürgen Mayer en la Plaza de la Encarnación. Con sus formas onduladas, parecen setas gigantes y son uno de los mayores símbolos de la Sevilla contemporánea."
        - "Se puede subir a la azotea para pasear por la pasarela y ver la ciudad desde las alturas, con vistas de la catedral y de los tejados del casco antiguo. Debajo hay un mercado, un espacio de ocio y el Antiquarium, con restos romanos encontrados durante las obras."
        - "El mejor momento para subir es el atardecer, con la ciudad iluminada, aunque se llena. Consulta los horarios del mirador y las condiciones de acceso, que cambian según la época. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué son las Setas de Sevilla?"
          r: "Una gran estructura de madera de Jürgen Mayer, el Metropol Parasol, en la Plaza de la Encarnación."
        - p: "¿Se puede subir?"
          r: "Sí, hay un mirador en la azotea con vistas de la ciudad. Consulta los horarios."
        - p: "¿Qué hay debajo?"
          r: "Un mercado, un espacio de ocio y el Antiquarium, con restos romanos."
        - p: "¿Cuándo es mejor ir?"
          r: "Al atardecer, para ver la ciudad iluminada. Se llena, así que llega pronto."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Alrededor de una hora, entre subida, paseo y visita al Antiquarium."
ayuntamiento-sevilla:
  relacionados: [metropol-parasol, giralda, barrio-santa-cruz]
  contenido:
    es:
      texto:
        - "El Ayuntamiento de Sevilla es un hermoso edificio en la Plaza Nueva, con una fachada renacentista plateresca del siglo XVI, rica en relieves y esculturas, y otra neoclásica del siglo XIX que da a la plaza. Es la sede del gobierno municipal y un buen ejemplo de la arquitectura histórica de la ciudad."
        - "La fachada plateresca, con sus detalles ornamentales, es una de las más bellas de Andalucía. En el interior se pueden ver salones históricos, como el Salón Colombino y la Sala Capitular, que muestran el esplendor de la Sevilla del Siglo de Oro."
        - "Hay visitas guiadas al interior en determinados horarios y con reserva, normalmente gratuitas. Consulta las condiciones antes de ir. La Plaza Nueva es una de las plazas más animadas del centro, con terrazas y un monumento a San Fernando. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el Ayuntamiento de Sevilla?"
          r: "La sede del gobierno municipal, con una fachada renacentista plateresca del siglo XVI y otra neoclásica."
        - p: "¿Se puede visitar?"
          r: "Sí, con visitas guiadas en determinados horarios. Consulta la web oficial."
        - p: "¿Qué ver?"
          r: "La fachada plateresca, el Salón Colombino y la Sala Capitular."
        - p: "¿Dónde está?"
          r: "En la Plaza Nueva, en el centro de Sevilla."
        - p: "¿Es gratis?"
          r: "Las visitas suelen ser gratuitas, pero conviene confirmarlo. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
museo-picasso-malaga:
  relacionados: [museo-carmen-thyssen, centre-pompidou, alcazaba-malaga, museo-picasso-barcelona]
  contenido:
    es:
      texto:
        - "El Museo Picasso Málaga está dedicado al artista más universal nacido en la ciudad, en 1881. Se encuentra en el Palacio de Buenavista, un edificio renacentista del siglo XVI en el casco histórico, y reúne obras de distintas etapas de su vida, donadas en gran parte por su familia."
        - "La colección recorre la trayectoria de Picasso, desde sus primeras obras hasta su etapa final, con pintura, dibujo, escultura, cerámica y obra gráfica. El edificio conserva además restos arqueológicos fenicios y romanos visibles en el sótano, y se organizan exposiciones temporales."
        - "Es una buena visita de una hora y media o dos. Combínala con la casa natal de Picasso, que está cerca, en la plaza de la Merced, y con un paseo por el centro. Reserva con antelación en temporada alta. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Nació Picasso en Málaga?"
          r: "Sí, nació en Málaga en 1881. El museo está en el centro histórico de la ciudad."
        - p: "¿Qué hay en el museo?"
          r: "Pintura, dibujo, escultura, cerámica y obra gráfica de distintas etapas de Picasso."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Entre una hora y media y dos horas."
        - p: "¿Hay que reservar?"
          r: "Se recomienda reservar en temporada alta."
        - p: "¿Qué más ver cerca?"
          r: "La casa natal de Picasso, la plaza de la Merced y la catedral."
museo-carmen-thyssen:
  relacionados: [museo-picasso-malaga, catedral-malaga, centre-pompidou]
  contenido:
    es:
      texto:
        - "El Museo Carmen Thyssen Málaga ocupa el Palacio de Villalón, un edificio renacentista del siglo XVI en el centro histórico. Su colección se centra en la pintura española del siglo XIX, con especial atención a la pintura andaluza, el costumbrismo y el paisaje."
        - "Reúne obras de artistas como Zurbarán, Sorolla, Zuloaga o Ignacio Pinazo, y es una buena oportunidad para conocer el arte andaluz del XIX en un entorno muy agradable. El museo organiza además exposiciones temporales y actividades culturales."
        - "Es una visita de una o dos horas, que se combina bien con el Picasso y la catedral. Consulta las exposiciones temporales, porque pueden ser un atractivo especial. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué hay en el Museo Carmen Thyssen?"
          r: "Pintura española del siglo XIX, con énfasis en la andaluza, el costumbrismo y el paisaje."
        - p: "¿Dónde está?"
          r: "En el Palacio de Villalón, en el centro histórico de Málaga."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Entre una y dos horas."
        - p: "¿Qué más ver cerca?"
          r: "El Museo Picasso, la catedral y el teatro romano."
        - p: "¿Hay exposiciones temporales?"
          r: "Sí, el museo programa varias al año. Consulta la web."
coleccion-museo-ruso-malaga:
  relacionados: [centre-pompidou, museo-picasso-malaga, museo-carmen-thyssen]
  contenido:
    es:
      texto:
        - "La Colección del Museo Ruso de Málaga es una sede del Museo Estatal Ruso de San Petersburgo, instalada en la antigua Tabacalera, un edificio industrial junto al río Guadalmedina. Presenta arte ruso de los siglos XV al XXI y es uno de los espacios culturales más singulares de la ciudad."
        - "La colección ofrece un recorrido por el arte ruso, con iconos, pintura realista, vanguardias y arte contemporáneo, y organiza exposiciones temporales. Es una buena opción para conocer una cultura poco presente en otros museos españoles."
        - "Antes de ir, comprueba el estado actual del museo, su programación y sus horarios, ya que pueden haber cambiado. Está cerca de otros museos de Málaga, por lo que se combina bien con un recorrido cultural por la ciudad. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el Museo Ruso de Málaga?"
          r: "Una sede del Museo Estatal Ruso, instalada en la antigua Tabacalera, dedicada al arte ruso."
        - p: "¿Qué hay en la colección?"
          r: "Arte ruso de los siglos XV al XXI, con iconos, pintura realista, vanguardias y arte contemporáneo."
        - p: "¿Dónde está?"
          r: "En el edificio de la antigua Tabacalera, en Málaga."
        - p: "¿Está abierto?"
          r: "Comprueba el estado y los horarios actuales en la web oficial, ya que han podido cambiar."
        - p: "¿Qué más ver cerca?"
          r: "El Centre Pompidou y el Museo Automovilístico y de la Moda."
centre-pompidou:
  relacionados: [museo-picasso-malaga, coleccion-museo-ruso-malaga, soho-malaga-barrio-las-artes]
  contenido:
    es:
      texto:
        - "El Centre Pompidou Málaga es una sede del museo parisino en el puerto de Málaga, en el Muelle Uno. Es conocido por su edificio, el Cubo, un cubo de cristal de colores diseñado por Daniel Buren, y por una colección de arte moderno y contemporáneo de primer nivel."
        - "Su exposición permanente reúne obras de artistas como Picasso, Frida Kahlo, Miró, Giacometti o Magritte, en un recorrido por los grandes movimientos del siglo XX. Además, organiza exposiciones temporales y actividades para todos los públicos."
        - "Prevé entre una y dos horas de visita. El museo está en el puerto, rodeado de restaurantes y terrazas, por lo que se combina bien con un paseo junto al mar. Consulta la programación y las condiciones del acuerdo con el Pompidou, que se ha renovado en distintas ocasiones. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el Cubo?"
          r: "Un edificio con forma de cubo de cristal de colores, diseñado por Daniel Buren, que alberga el Centre Pompidou en el puerto de Málaga."
        - p: "¿Qué hay en el museo?"
          r: "Arte moderno y contemporáneo de la colección del Pompidou, con obras de grandes maestros del siglo XX."
        - p: "¿Dónde está?"
          r: "En el Muelle Uno, en el puerto de Málaga."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Entre una y dos horas."
        - p: "¿Qué hay cerca?"
          r: "El paseo del Muelle Uno, con terrazas y tiendas, y el centro histórico."
catedral-malaga:
  relacionados: [alcazaba-malaga, teatro-romano-malaga, museo-carmen-thyssen, semana-santa-malaga]
  contenido:
    es:
      texto:
        - "La Catedral de Málaga es una gran iglesia renacentista construida entre los siglos XVI y XVIII. Se la conoce como La Manquita porque tiene una sola torre terminada: según la tradición, el dinero previsto para la segunda se destinó a otros fines."
        - "El interior destaca por su coro de madera tallada, sus altas bóvedas y sus capillas. Se puede subir a la cubierta, desde donde se ven la ciudad, el puerto y la Alcazaba, con una vista panorámica muy completa del centro histórico."
        - "Respeta el carácter religioso del edificio y la vestimenta adecuada. Prevé entre una hora y una hora y media de visita. Consulta los horarios, que varían según el culto. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Por qué se llama La Manquita?"
          r: "Porque solo tiene una torre terminada, de las dos previstas."
        - p: "¿Qué ver?"
          r: "El coro de madera tallada, las capillas y las vistas desde la cubierta."
        - p: "¿Se puede subir a la cubierta?"
          r: "Sí, con entrada aparte. Consulta las condiciones."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Entre una hora y una hora y media."
        - p: "¿Qué ropa llevar?"
          r: "Ropa discreta, con hombros y rodillas cubiertos, por respeto al carácter religioso."
alcazaba-malaga:
  relacionados: [teatro-romano-malaga, catedral-malaga, museo-picasso-malaga]
  contenido:
    es:
      texto:
        - "La Alcazaba de Málaga es una fortaleza palaciega musulmana del siglo XI, una de las mejor conservadas de España. Se alza sobre una colina en pleno centro, con patios, jardines, fuentes, murallas y vistas del puerto y de la ciudad."
        - "El recorrido asciende por varias puertas y patios hasta los palacios nazaríes, con arcos de herradura, yeserías y estanques. Desde las murallas se ven la catedral, el puerto y el Teatro Romano, que se encuentra justo a sus pies. Otra fortaleza, el castillo de Gibralfarro, está unida por un camino fortificado."
        - "Lleva calzado cómodo, agua y protección solar, porque hay cuestas y escaleras. Evita las horas de más calor y reserva una hora y media o dos para la visita. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es la Alcazaba de Málaga?"
          r: "Una fortaleza palaciega musulmana del siglo XI, con patios, jardines y vistas de la ciudad."
        - p: "¿Qué ver?"
          r: "Los patios, los jardines, los palacios nazaríes y las vistas del puerto desde las murallas."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Entre una hora y media y dos horas."
        - p: "¿Cómo se sube?"
          r: "A pie, por rampas y escaleras. Hay un ascensor desde el exterior en algunos tramos; consulta la accesibilidad."
        - p: "¿Qué hay cerca?"
          r: "El Teatro Romano, la catedral y el Museo Picasso."
teatro-romano-malaga:
  relacionados: [alcazaba-malaga, catedral-malaga, museo-picasso-malaga]
  contenido:
    es:
      texto:
        - "El Teatro Romano de Málaga es un teatro del siglo I a.C., construido en época de Augusto, al pie de la Alcazaba. Quedó oculto durante siglos bajo edificios y fue redescubierto en 1951, y hoy se puede visitar en pleno centro, junto a la plaza de la Aduana."
        - "Se conserva buena parte de la cávea, con las gradas de piedra en forma de semicírculo, y el escenario, además de restos de columnas y elementos decorativos. Un centro de interpretación ayuda a entender la historia del teatro y de la ciudad romana de Malaca."
        - "La visita es corta, de unos 20 o 30 minutos. Se combina con la Alcazaba, que está justo encima, y con el Museo Picasso. Consulta los horarios y las condiciones de entrada. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el Teatro Romano de Málaga?"
          r: "Un teatro del siglo I a.C., al pie de la Alcazaba, redescubierto en 1951."
        - p: "¿Se puede visitar?"
          r: "Sí, con un centro de interpretación. Consulta horarios y condiciones."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Unos 20-30 minutos."
        - p: "¿Dónde está?"
          r: "En el centro de Málaga, junto a la plaza de la Aduana y al pie de la Alcazaba."
        - p: "¿Qué más ver cerca?"
          r: "La Alcazaba, el Museo Picasso y la catedral."
soho-malaga-barrio-las-artes:
  relacionados: [centre-pompidou, coleccion-museo-ruso-malaga, museo-picasso-malaga]
  contenido:
    es:
      texto:
        - "El Soho de Málaga, conocido como el barrio de las artes, es una zona del centro que se ha transformado en un gran espacio de arte urbano, galerías, estudios y creatividad. Sus calles están llenas de murales de artistas locales e internacionales."
        - "El proyecto MAUS, Málaga Arte Urbano Soho, ha convertido muchas paredes en lienzos, con obras de gran tamaño repartidas por el barrio. Además hay cafés, tiendas independientes y restaurantes, y es una zona perfecta para pasear con calma y fotografiar."
        - "Se recorre a pie en una o dos horas, con ayuda de un mapa o una ruta guiada de arte urbano. Combínalo con el Centre Pompidou y el Muelle Uno, que están cerca. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el Soho de Málaga?"
          r: "Un barrio del centro de la ciudad, conocido como barrio de las artes, con murales, galerías y estudios."
        - p: "¿Qué es el MAUS?"
          r: "El proyecto Málaga Arte Urbano Soho, que ha llenado el barrio de murales de artistas locales e internacionales."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Una o dos horas, a pie."
        - p: "¿Hay rutas guiadas?"
          r: "Sí, existen rutas de arte urbano por el barrio. Consulta la oferta local."
        - p: "¿Qué más ver cerca?"
          r: "El Centre Pompidou, el Muelle Uno y el centro histórico."
gruta-las-maravillas:
  relacionados: [barrio-santa-cruz, parque-nacional-donana, alcazaba-malaga]
  contenido:
    es:
      texto:
        - "La Gruta de las Maravillas es una cueva en Aracena, en la Sierra de Aracena y Picos de Aroche, en Huelva. Es una de las cuevas más bellas de España, con lagos subterráneos, estalactitas, estalagmitas y salas de formas caprichosas que se recorren con visita guiada."
        - "El recorrido dura unos 45 minutos y atraviesa distintas salas con nombres como la Sala de los Culs de Gat o la Sala de la Catedral, con formaciones de gran variedad de colores y formas. La temperatura se mantiene estable durante todo el año."
        - "Lleva una chaqueta y calzado cómodo, porque hay humedad y escaleras. El aforo es limitado, así que conviene reservar con antelación. Aracena es también famosa por su jamón ibérico, y la sierra es un buen destino para pasear y comer. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es la Gruta de las Maravillas?"
          r: "Una cueva en Aracena (Huelva) con lagos subterráneos y formaciones de estalactitas y estalagmitas."
        - p: "¿Cuánto dura la visita?"
          r: "Unos 45 minutos aproximadamente, con guía."
        - p: "¿Hay que reservar?"
          r: "Sí, conviene reservar con antelación, porque el aforo es limitado."
        - p: "¿Qué ropa llevar?"
          r: "Una chaqueta y calzado cómodo, porque hay humedad y escaleras."
        - p: "¿Es buen plan con niños?"
          r: "Sí, la visita suele gustar a los niños, aunque hay escaleras y tramos estrechos."
        - p: "¿Qué más hacer en Aracena?"
          r: "Probar el jamón ibérico, visitar el castillo y pasear por la sierra."
universidad-salamanca:
  relacionados: [catedrales-salamanca, casa-las-conchas, clerecia, plaza-mayor-salamanca, salamanca-un-dia, llaves-de-la-ciudad-salamanca]
  contenido:
    es:
      texto:
        - "La Universidad de Salamanca es la más antigua de España que sigue en funcionamiento. Nació en 1218 y fue durante siglos uno de los grandes centros del saber europeo, con figuras como Fray Luis de León o Miguel de Unamuno ligadas a sus aulas."
        - "El conjunto histórico gira en torno al Patio de Escuelas. La fachada plateresca de las Escuelas Mayores es una de las imágenes más reconocibles de la ciudad, y en ella se esconde una pequeña rana sobre una calavera que los visitantes buscan por tradición. Dentro se recorren las aulas históricas y la Biblioteca Antigua, con fondos de gran valor."
        - "Otoño es buen momento para visitarla: la Biblioteca Antigua forma parte de «Las llaves de la ciudad», el programa de visitas guiadas que Salamanca celebra cada año (en 2026, del 24 de octubre al 20 de diciembre). Quien completa el pasaporte del programa puede optar a un sorteo para ver el sanctasanctórum de la biblioteca. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es lo más conocido de la Universidad de Salamanca?"
          r: "La fachada plateresca de las Escuelas Mayores, con la rana escondida, y la Biblioteca Antigua."
        - p: "¿Dónde está la rana?"
          r: "En la fachada de las Escuelas Mayores, sobre una calavera. Es tradición intentar encontrarla."
        - p: "¿Se puede visitar la Biblioteca Antigua?"
          r: "Sí. Además de la visita habitual, forma parte de «Las llaves de la ciudad», con visitas guiadas en otoño. Consulta la web oficial para plazas y condiciones."
        - p: "¿Qué es Las llaves de la ciudad?"
          r: "Un programa anual de visitas guiadas a espacios patrimoniales de Salamanca. La prensa local lo presenta como gratuito, pero hay que reservar en la web de Turismo de Salamanca."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Una hora o dos para el exterior y las zonas visitables. Más si añades la Biblioteca Antigua y el entorno de las catedrales."
        - p: "¿Qué más ver cerca?"
          r: "Las Catedrales, la Casa de las Conchas y la Clerecía están a pocos minutos a pie."
plaza-mayor-salamanca:
  relacionados: [universidad-salamanca, casa-las-conchas, catedrales-salamanca, salamanca-un-dia, llaves-de-la-ciudad-salamanca]
  contenido:
    es:
      texto:
        - "La Plaza Mayor de Salamanca es una de las más bellas de España y el centro de la vida de la ciudad. Es una plaza barroca de piedra dorada, construida en el siglo XVIII con diseño de Alberto de Churriguera, con soportales continuos y un conjunto muy armónico."
        - "En los arcos y en las fachadas hay medallones con relieves de personajes de la historia de España, y en uno de sus lados se levanta el Ayuntamiento, la Casa Consistorial. De día es un buen punto para tomar un café bajo los soportales, y de noche, con la iluminación, gana mucho."
        - "Este otoño la Casa Consistorial participa en «Las llaves de la ciudad», el programa de visitas del Ayuntamiento (en 2026, del 24 de octubre al 20 de diciembre), que abre algunas de sus dependencias. Consulta siempre la web oficial para horarios y condiciones de visita, que cambian."
      faq:
        - p: "¿Quién diseñó la Plaza Mayor?"
          r: "Alberto de Churriguera, en el siglo XVIII, dentro del barroco salmantino."
        - p: "¿Qué son los medallones?"
          r: "Relieves con retratos de personajes de la historia de España que decoran los arcos y las fachadas de la plaza."
        - p: "¿Se puede visitar el Ayuntamiento?"
          r: "Se abre a visitas durante «Las llaves de la ciudad», que se celebra en otoño. Consulta la web oficial de Turismo de Salamanca para fechas y reservas."
        - p: "¿Cuándo es mejor ir?"
          r: "De día para pasear y tomar un café, y al anochecer, cuando la iluminación resalta la piedra dorada."
        - p: "¿Qué más ver cerca?"
          r: "La Casa de las Conchas, la Universidad y las Catedrales, todas a pocos minutos a pie."
catedrales-salamanca:
  relacionados: [universidad-salamanca, casa-las-conchas, clerecia, plaza-mayor-salamanca, salamanca-un-dia]
  contenido:
    es:
      texto:
        - "Salamanca tiene dos catedrales unidas: la Vieja, románica y del siglo XII, y la Nueva, gótica y construida entre los siglos XVI y XVIII. Se recorren juntas y son una de las visitas principales de la ciudad."
        - "La Catedral Vieja conserva un interior recogido y un retablo muy admirado, y la Nueva destaca por sus bóvedas y su gran altura. En la Puerta de Ramos de la Catedral Nueva hay detalles curiosos añadidos en una restauración reciente, como un astronauta y un dragón comiendo un helado, que los visitantes suelen buscar."
        - "Las torres tienen acceso con recorrido por el interior de la catedral y vistas sobre la ciudad. Reserva con antelación en temporada alta y combina la visita con la Universidad y la Casa de las Conchas, que están muy cerca. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué diferencia hay entre la Catedral Vieja y la Nueva?"
          r: "La Vieja es románica, del siglo XII. La Nueva es gótica, construida entre los siglos XVI y XVIII."
        - p: "¿Dónde está el astronauta?"
          r: "En la Puerta de Ramos de la Catedral Nueva. Junto a él hay otras figuras curiosas, como un dragón con un helado."
        - p: "¿Se puede subir a las torres?"
          r: "Sí, hay acceso a las torres con vistas de la ciudad. Consulta la web oficial para entradas y horarios."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Entre una y dos horas para ver las dos catedrales, más si subes a las torres."
        - p: "¿Hay que reservar?"
          r: "Se recomienda en temporada alta, fines de semana y festivos."
        - p: "¿Qué más ver cerca?"
          r: "La Universidad, la Casa de las Conchas y la Clerecía están a pocos minutos a pie."
casa-las-conchas:
  relacionados: [universidad-salamanca, clerecia, catedrales-salamanca, plaza-mayor-salamanca, salamanca-un-dia]
  contenido:
    es:
      texto:
        - "La Casa de las Conchas es uno de los edificios más fotografiados de Salamanca. Es una casa señorial gótica de principios del siglo XVI, con la fachada cubierta de conchas de vieira, un símbolo asociado al Camino de Santiago."
        - "Hoy es una biblioteca pública, así que se puede entrar a su patio interior, con una galería de arcos de aire mudéjar, un buen sitio para parar un momento. Las ventanas con rejas de estilo plateresco completan una fachada que mezcla influencias muy distintas."
        - "Está muy cerca de la Clerecía y de la Universidad, así que es fácil incluirla en un paseo por el centro. Conviene mirar la fachada con luz de tarde, cuando la piedra dorada se ve mejor. Consulta siempre la web oficial para horarios y condiciones de acceso, que cambian."
      faq:
        - p: "¿Por qué tiene conchas?"
          r: "Las conchas de vieira son el símbolo del Camino de Santiago y decoran la fachada del edificio."
        - p: "¿Se puede entrar?"
          r: "Sí, funciona como biblioteca pública y se puede acceder a su patio. Consulta los horarios en la web oficial."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Unos 15 o 30 minutos."
        - p: "¿Qué más ver cerca?"
          r: "La Clerecía, la Universidad, las Catedrales y la Plaza Mayor."
clerecia:
  relacionados: [casa-las-conchas, universidad-salamanca, catedrales-salamanca, llaves-de-la-ciudad-salamanca, salamanca-un-dia]
  contenido:
    es:
      texto:
        - "La Clerecía es el antiguo Real Colegio del Espíritu Santo, levantado por los jesuitas en el siglo XVII. Es un gran edificio barroco que preside una de las calles más fotografiadas de Salamanca, con una iglesia monumental, un patio claustral y dos torres."
        - "Su gran atractivo son las torres, conocidas como Scala Coeli, la escalera del cielo. Se sube por el interior hasta lo alto, con vistas muy buenas sobre los tejados y las cúpulas de la ciudad."
        - "La nueva museografía de Scala Coeli y de las torres es una de las novedades de «Las llaves de la ciudad», el programa de visitas guiadas que Salamanca celebra en otoño (en 2026, del 24 de octubre al 20 de diciembre). Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es la Clerecía?"
          r: "El antiguo colegio jesuita de Salamanca, un gran conjunto barroco del siglo XVII."
        - p: "¿Qué es Scala Coeli?"
          r: "La visita a las torres de la Clerecía, con un recorrido interior y vistas de la ciudad."
        - p: "¿Qué novedad tiene en 2026?"
          r: "Se ha renovado la museografía de Scala Coeli y de las torres, dentro de «Las llaves de la ciudad»."
        - p: "¿Hay que reservar?"
          r: "Se recomienda reservar, sobre todo en temporada alta, en la web oficial de Turismo de Salamanca."
        - p: "¿Qué más ver cerca?"
          r: "La Casa de las Conchas y la Universidad están a pocos minutos a pie."
convento-duenas:
  relacionados: [catedrales-salamanca, universidad-salamanca, colegio-mayor-arzobispo-fonseca, llaves-de-la-ciudad-salamanca, salamanca-un-dia]
  contenido:
    es:
      texto:
        - "El Convento de las Dueñas es un convento dominico del siglo XVI con uno de los claustros más especiales de Salamanca. Su claustro plateresco es de dos pisos, con arcos y capiteles tallados con figuras fantásticas, calaveras, animales y rostros extraños que han dado pie a numerosas leyendas."
        - "Conviene mirar los capiteles con calma, porque son muy distintos entre sí. El convento está muy cerca de San Esteban, en un barrio de calles tranquilas junto a la zona de las Catedrales."
        - "El convento forma parte de «Las llaves de la ciudad», el programa de visitas de Salamanca (en 2026, del 24 de octubre al 20 de diciembre), con una visita teatralizada que se recupera este año. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué tiene de especial el claustro?"
          r: "Es plateresco, con dos pisos y capiteles tallados con figuras fantásticas, animales, calaveras y rostros."
        - p: "¿Se puede visitar con guía?"
          r: "Sí, en otoño hay una visita teatralizada dentro de «Las llaves de la ciudad». Consulta la web oficial de Turismo de Salamanca."
        - p: "¿Qué es Las llaves de la ciudad?"
          r: "Un programa anual de visitas guiadas a espacios patrimoniales de Salamanca. La prensa local lo presenta como gratuito, pero hay que reservar en la web oficial."
        - p: "¿Qué más ver cerca?"
          r: "San Esteban y las Catedrales están a pocos minutos a pie."
colegio-mayor-arzobispo-fonseca:
  relacionados: [convento-duenas, universidad-salamanca, clerecia, llaves-de-la-ciudad-salamanca, salamanca-un-dia]
  contenido:
    es:
      texto:
        - "El Colegio Mayor Arzobispo Fonseca, conocido como el de los Irlandeses, es un edificio renacentista del siglo XVI. Destaca por su patio de columnas de estilo plateresco, de proporciones muy elegantes."
        - "Es uno de los espacios más tranquilos del centro histórico, un buen lugar para detenerse en el camino entre la Universidad y las Catedrales. El patio se disfruta con calma y suele sorprender a quienes lo descubren por primera vez."
        - "El colegio participa en «Las llaves de la ciudad», el programa de visitas de Salamanca (en 2026, del 24 de octubre al 20 de diciembre), con una visita teatralizada. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Por qué se le llama de los Irlandeses?"
          r: "Es el nombre popular del colegio mayor, por su vinculación histórica con estudiantes irlandeses."
        - p: "¿Qué tiene de especial?"
          r: "Su patio de columnas plateresco, de estilo renacentista."
        - p: "¿Se puede visitar con guía?"
          r: "Sí, en otoño hay una visita teatralizada dentro de «Las llaves de la ciudad». Consulta la web oficial de Turismo de Salamanca para reservar."
        - p: "¿Qué más ver cerca?"
          r: "La Universidad, las Catedrales y las Dueñas, todas a pocos minutos a pie."
museo-art-nouveau-art-deco:
  relacionados: [catedrales-salamanca, universidad-salamanca, casa-las-conchas, salamanca-un-dia]
  contenido:
    es:
      texto:
        - "El Museo Art Nouveau y Art Déco, en la Casa Lis, ocupa un palacete modernista junto a la muralla, sobre el río Tormes. Es un museo distinto al resto de Salamanca: aquí se ve el arte decorativo de 1900 a 1930, con vidrieras, esculturas, cristal, joyas, objetos cotidianos y una gran colección de muñecas y juguetes."
        - "La luz que entra por las vidrieras es parte del atractivo del edificio. Es una buena visita para cambiar de registro tras unos días de piedra románica y barroca, y se recorre sin prisa en una hora o dos."
        - "Combínalo con un paseo por el río y por la zona de las Catedrales, que está muy cerca. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué se puede ver en la Casa Lis?"
          r: "Arte decorativo modernista y art déco: vidrieras, esculturas, cristal, objetos cotidianos y una colección de muñecas y juguetes."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Una o dos horas."
        - p: "¿Hay que reservar?"
          r: "Se recomienda en fines de semana y temporada alta. Consulta la web oficial."
        - p: "¿Qué más ver cerca?"
          r: "Las Catedrales y el paseo junto al Tormes."
domus-artium-2002:
  relacionados: [museo-art-nouveau-art-deco, catedrales-salamanca, llaves-de-la-ciudad-salamanca, salamanca-un-dia]
  contenido:
    es:
      texto:
        - "El Domus Artium 2002, conocido como DA2, es el centro de arte contemporáneo de Salamanca. Reúne exposiciones temporales de artistas actuales y es una visita muy distinta de la oferta monumental de la ciudad."
        - "Las exposiciones cambian a lo largo del año, así que conviene consultar qué hay en cartel antes de ir. Sirve de contrapunto moderno a un centro histórico dominado por la piedra y el barroco."
        - "Este otoño el DA2 abre sus almacenes dentro de «Las llaves de la ciudad», el programa de visitas de Salamanca (en 2026, del 24 de octubre al 20 de diciembre). Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el DA2?"
          r: "El centro de arte contemporáneo de Salamanca, con exposiciones temporales."
        - p: "¿Se pueden ver los almacenes?"
          r: "Sí, durante «Las llaves de la ciudad» hay una visita a los almacenes del DA2. Consulta la web oficial de Turismo de Salamanca para reservar."
        - p: "¿Qué exposiciones hay ahora?"
          r: "Cambian durante el año. Consulta la programación en la web oficial."
        - p: "¿Qué más ver cerca?"
          r: "Las Catedrales y el paseo junto al Tormes."
basilica-nuestra-senora-pilar:
  relacionados: [la-seo-catedral-san-salvador, palacio-aljaferia, lonja-zaragoza, pilar]
  contenido:
    es:
      texto:
        - "La Basílica de Nuestra Señora del Pilar es el gran símbolo de Zaragoza y uno de los grandes santuarios marianos de España. Se levanta junto al Ebro y alberga la Virgen del Pilar, una pequeña imagen sobre una columna de jaspe que atrae a peregrinos de todo el mundo, sobre todo cada 12 de octubre."
        - "El templo, de estilo barroco, destaca por sus once cúpulas cubiertas de azulejos de colores y por las pinturas de la cúpula del coro, obra de Goya y de Francisco Bayeu. En el interior se encuentra la Santa Capilla, donde se venera la Virgen, y en un lateral se conservan las bombas que cayeron en 1936 sin llegar a explotar. También se puede subir a una de las torres para ver la ciudad desde las alturas."
        - "Es un lugar de culto, así que respeta el silencio y la vestimenta adecuada. La visita se puede combinar con la plaza del Pilar, la catedral de La Seo y la Lonja, todas muy cerca. Si vas en octubre, coincide con las Fiestas del Pilar y con la Ofrenda de Flores. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es la Virgen del Pilar?"
          r: "Una pequeña imagen de la Virgen sobre una columna de jaspe, venerada en la Santa Capilla de la basílica y patrona de Zaragoza y de la Hispanidad."
        - p: "¿Qué ver en la basílica?"
          r: "Las cúpulas con pinturas de Goya y Bayeu, la Santa Capilla, las bombas de 1936 y el museo del Pilar."
        - p: "¿Se puede subir a la torre?"
          r: "Sí, hay un mirador en una de las torres. Consulta las condiciones de acceso."
        - p: "¿Hay que pagar entrada?"
          r: "La entrada a la basílica es libre, y hay entradas de pago para la torre y el museo. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
        - p: "¿Cuándo es la Ofrenda de Flores?"
          r: "El 12 de octubre, durante las Fiestas del Pilar."
        - p: "¿Qué ropa llevar?"
          r: "Ropa discreta, con hombros y rodillas cubiertos, por respeto al carácter religioso."
palacio-aljaferia:
  relacionados: [la-seo-catedral-san-salvador, basilica-nuestra-senora-pilar, iglesia-san-pablo-zaragoza, alcazaba-malaga]
  contenido:
    es:
      texto:
        - "El Palacio de la Aljafería es una joya del arte hispanomusulmán, construido en el siglo XI como residencia de los reyes de la taifa de Zaragoza. Es la mejor muestra de arquitectura islámica del norte de la península y un monumento único que conserva elementos de todas las épocas."
        - "Lo más impresionante es el patio de Santa Isabel, con sus arcos entrelazados, y el oratorio, un pequeño espacio que fue mezquita, con un mihrab de gran riqueza decorativa. Tras la conquista cristiana se añadieron el palacio de los Reyes Católicos, con un techo artesonado dorado, y el Salón del Trono. La Torre del Trovador es famosa por inspirar la ópera de Verdi."
        - "Hoy es sede de las Cortes de Aragón, por lo que algunas zonas tienen un horario limitado. Forma parte del conjunto Mudéjar de Aragón, declarado Patrimonio Mundial. Prevé una hora y media de visita. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es la Aljafería?"
          r: "Un palacio hispanomusulmán del siglo XI que fue residencia de los reyes de la taifa de Zaragoza y hoy es sede de las Cortes de Aragón."
        - p: "¿Qué ver?"
          r: "El patio de Santa Isabel, el oratorio, el palacio de los Reyes Católicos y la Torre del Trovador."
        - p: "¿Es Patrimonio Mundial?"
          r: "Sí, forma parte del conjunto de arquitectura mudéjar de Aragón."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Alrededor de una hora y media."
        - p: "¿Es gratis?"
          r: "Hay franjas de entrada gratuita. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
la-seo-catedral-san-salvador:
  relacionados: [basilica-nuestra-senora-pilar, palacio-aljaferia, museo-foro-caesaraugusta, lonja-zaragoza]
  contenido:
    es:
      texto:
        - "La Seo, la catedral del Salvador de Zaragoza, es un templo que mezcla estilos gótico, mudéjar, renacentista y barroco, resultado de siglos de reformas. Su fachada lateral de ladrillo y cerámica mudéjar es una de las más bellas de Aragón, y forma parte del conjunto Patrimonio Mundial del mudéjar aragonés."
        - "El interior destaca por su retablo mayor, de alabastro, el coro, la capilla de San Bernardo y la Parroquieta, una capilla mudéjar. El Museo de Tapices, uno de los más importantes de Europa, reúne piezas flamencas y góticas de gran valor. Bajo la plaza se ven además restos del foro romano de Caesaraugusta."
        - "Es un lugar de culto, así que respeta el silencio y la vestimenta. Prevé una hora y media de visita y combina con la basílica del Pilar, a pocos metros. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es La Seo?"
          r: "La catedral del Salvador de Zaragoza, con estilos gótico, mudéjar, renacentista y barroco."
        - p: "¿Qué ver?"
          r: "El retablo mayor, la Parroquieta, el Museo de Tapices y la fachada mudéjar."
        - p: "¿Qué es el Museo de Tapices?"
          r: "Un museo con una excelente colección de tapices flamencos y góticos, dentro de la catedral."
        - p: "¿Es Patrimonio Mundial?"
          r: "Sí, forma parte del conjunto de arquitectura mudéjar de Aragón."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Alrededor de una hora y media."
lonja-zaragoza:
  relacionados: [basilica-nuestra-senora-pilar, la-seo-catedral-san-salvador, museo-foro-caesaraugusta]
  contenido:
    es:
      texto:
        - "La Lonja de Zaragoza es un edificio renacentista del siglo XVI construido para las transacciones comerciales de la ciudad. Es uno de los mejores ejemplos del Renacimiento aragonés y se encuentra en la plaza del Pilar, junto al Ebro."
        - "Destaca su gran sala, de tres naves separadas por columnas muy esbeltas y un techo de bóvedas decoradas. Hoy se utiliza como sala de exposiciones del Ayuntamiento, con muestras temporales de arte y fotografía, normalmente de acceso gratuito."
        - "Es una parada corta y gratuita en la mayoría de los casos, de unos 20 o 30 minutos, ideal para combinar con la basílica y La Seo. Consulta la programación de exposiciones y los horarios. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es la Lonja?"
          r: "Un edificio renacentista del siglo XVI, construido para el comercio, que hoy es sala de exposiciones."
        - p: "¿Es gratis?"
          r: "Las exposiciones suelen ser de acceso gratuito, pero conviene consultar la programación."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Unos 20-30 minutos."
        - p: "¿Dónde está?"
          r: "En la plaza del Pilar, junto a la basílica y La Seo."
        - p: "¿Qué ver?"
          r: "La gran sala de columnas y bóvedas, además de la exposición temporal."
museo-foro-caesaraugusta:
  relacionados: [la-seo-catedral-san-salvador, lonja-zaragoza, basilica-nuestra-senora-pilar]
  contenido:
    es:
      texto:
        - "El Museo del Foro de Caesaraugusta permite pasear por los restos del foro de la antigua ciudad romana de Caesaraugusta, bajo la plaza de la Seo, en pleno centro de Zaragoza. Forma parte de la Ruta de Caesaraugusta, que reúne cuatro espacios romanos de la ciudad."
        - "La visita recorre las ruinas de las tiendas, las calles y el sistema de cloacas del foro, con paneles, maquetas y audiovisuales que explican cómo se vivía en la ciudad hace casi dos mil años. Es una forma original de descubrir la Zaragoza romana bajo la actual."
        - "Prevé unos 45 minutos de visita, que se combinan bien con la catedral de La Seo y el resto de la Ruta de Caesaraugusta, formada por el museo del Teatro, el del Puerto Fluvial y el de las Termas Públicas. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el Museo del Foro de Caesaraugusta?"
          r: "Un museo bajo la plaza de la Seo con los restos del foro de la antigua Caesaraugusta."
        - p: "¿Qué es la Ruta de Caesaraugusta?"
          r: "Un recorrido que reúne cuatro espacios romanos de Zaragoza: el Foro, el Teatro, el Puerto Fluvial y las Termas Públicas."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Unos 45 minutos."
        - p: "¿Dónde está?"
          r: "Bajo la plaza de la Seo, en el centro de Zaragoza."
        - p: "¿Es buen plan con niños?"
          r: "Sí, los audiovisuales y las maquetas ayudan a entenderlo."
instituto-aragones-arte-cultura-contemporaneos-pablo-serrano:
  relacionados: [puente-tercer-milenio, parque-metropolitano-agua-luis-bunuel, museo-foro-caesaraugusta]
  contenido:
    es:
      texto:
        - "El Instituto Aragonés de Arte y Cultura Contemporáneos Pablo Serrano, conocido como IAACC, es un museo de arte contemporáneo de Zaragoza que lleva el nombre del escultor aragonés. Reúne obras de Pablo Serrano y de otros artistas del siglo XX y del XXI, con especial atención al arte aragonés y español."
        - "La colección permanente se completa con exposiciones temporales, actividades educativas y talleres para todos los públicos. Es un espacio ideal para conocer cómo se ha desarrollado el arte contemporáneo en Aragón, con una programación activa."
        - "Prevé una hora de visita y consulta la programación de exposiciones, porque suelen ser el principal atractivo. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el IAACC Pablo Serrano?"
          r: "Un museo de arte contemporáneo en Zaragoza, dedicado al escultor aragonés Pablo Serrano y al arte actual."
        - p: "¿Qué hay en el museo?"
          r: "Obras de Pablo Serrano y de otros artistas contemporáneos, además de exposiciones temporales."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Alrededor de una hora."
        - p: "¿Hay actividades para niños?"
          r: "Suele haber talleres y actividades educativas. Consulta la programación."
        - p: "¿Es gratis?"
          r: "Consulta las condiciones de entrada en la web oficial."
puente-tercer-milenio:
  relacionados: [parque-metropolitano-agua-luis-bunuel, basilica-nuestra-senora-pilar, palacio-aljaferia]
  contenido:
    es:
      texto:
        - "El Puente del Tercer Milenio es un gran puente de arco sobre el Ebro, construido para la Exposición Internacional de 2008. Es uno de los más grandes de Europa en su tipo y destaca por su estructura de arco de acero y por su diseño moderno, que lo convierte en un icono de la Zaragoza contemporánea."
        - "Es un puente de uso vial y peatonal, con un paso para personas que permite cruzar el río y ver el arco de cerca. Se encuentra junto al recinto de la Expo 2008 y al parque del Agua, y su silueta se ve bien desde las orillas del Ebro, sobre todo al atardecer, cuando se ilumina."
        - "Es una parada corta, de unos 20 o 30 minutos, que se combina con el parque del Agua y la torre del Agua. Lleva calzado cómodo y evita las horas de más calor en verano. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el Puente del Tercer Milenio?"
          r: "Un gran puente de arco sobre el Ebro, construido para la Expo de 2008."
        - p: "¿Se puede cruzar a pie?"
          r: "Sí, tiene un paso peatonal. Consulta las condiciones de acceso."
        - p: "¿Cuándo es mejor ir?"
          r: "Al atardecer, cuando el puente se ilumina y hace menos calor."
        - p: "¿Qué hay cerca?"
          r: "El parque Metropolitano del Agua y el recinto de la Expo 2008."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Unos 20-30 minutos."
parque-metropolitano-agua-luis-bunuel:
  relacionados: [puente-tercer-milenio, instituto-aragones-arte-cultura-contemporaneos-pablo-serrano, monasterio-piedra]
  contenido:
    es:
      texto:
        - "El Parque Metropolitano del Agua Luis Buñuel es un gran espacio verde junto al Ebro, creado para la Exposición Internacional de 2008, dedicada al agua y al desarrollo sostenible. Es uno de los parques más grandes de Zaragoza y un lugar perfecto para pasear, hacer deporte y disfrutar de la naturaleza."
        - "Reúne jardines, lagunas, zonas de ocio y canales con deportes de aguas bravas, y cerca están algunas construcciones de la Expo, como la Torre del Agua y el Acuario Fluvial. Se puede recorrer a pie o en bicicleta, y tiene áreas de juegos, zonas de pícnic y espacios para actividades al aire libre."
        - "Es un buen plan para un día de buen tiempo, sobre todo en primavera y otoño. Lleva agua y protección solar en verano, y consulta las actividades de aguas bravas y el acuario antes de ir. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es el Parque del Agua?"
          r: "Un gran parque junto al Ebro, creado para la Expo de 2008, con jardines, lagunas y zonas de ocio."
        - p: "¿Es gratis?"
          r: "El acceso al parque es libre, aunque algunas actividades, como el acuario o las aguas bravas, son de pago."
        - p: "¿Qué actividades hay?"
          r: "Paseos, bici, zonas de juegos, pícnic y deportes de aguas bravas en los canales."
        - p: "¿Qué hay cerca?"
          r: "La Torre del Agua, el Acuario Fluvial y el Puente del Tercer Milenio."
        - p: "¿Es buen plan con niños?"
          r: "Sí, hay áreas de juegos y mucho espacio para correr."
iglesia-santa-engracia:
  relacionados: [iglesia-san-pablo-zaragoza, basilica-nuestra-senora-pilar, la-seo-catedral-san-salvador]
  contenido:
    es:
      texto:
        - "La Basílica de Santa Engracia es uno de los templos más antiguos y venerados de Zaragoza, dedicado a la santa mártir que es patrona de la ciudad. Se levanta sobre el lugar donde, según la tradición, se enterró a los mártires de Caesaraugusta."
        - "Su portada renacentista del siglo XVI, obra de Gil Morlanes y Tudelilla, es una de las joyas del plateresco aragonés. En la cripta se conserva el sarcófago paleocristiano y, en el interior, el retablo y varias capillas que muestran la riqueza artística de la basílica."
        - "Es un lugar de culto, así que respeta el silencio y la vestimenta adecuada. Prevé media hora o una hora de visita. Consulta los horarios de apertura, que cambian según el culto. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Quién fue santa Engracia?"
          r: "Una mártir de Caesaraugusta, patrona de Zaragoza, cuyo culto se remonta a época paleocristiana."
        - p: "¿Qué ver en la basílica?"
          r: "La portada plateresca, la cripta con el sarcófago paleocristiano y el interior con sus capillas."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Entre media hora y una hora."
        - p: "¿Es gratis?"
          r: "La entrada a la iglesia es normalmente libre. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
        - p: "¿Qué ropa llevar?"
          r: "Ropa discreta, por respeto al carácter religioso del edificio."
iglesia-san-pablo-zaragoza:
  relacionados: [iglesia-santa-engracia, palacio-aljaferia, la-seo-catedral-san-salvador]
  contenido:
    es:
      texto:
        - "La Iglesia de San Pablo es una de las más singulares de Zaragoza y el corazón del barrio de San Pablo, también conocido como el Gancho, uno de los más tradicionales de la ciudad. Su torre mudéjar, de ladrillo decorado, es una de las más hermosas de Aragón."
        - "El templo combina elementos gótico-mudéjares con un interior de grandes dimensiones, donde destaca el retablo mayor, una obra renacentista en alabastro de gran valor. El barrio que lo rodea ha ido renovándose y hoy mezcla comercios tradicionales, bares de tapas y espacios culturales."
        - "Es una parada corta, que se combina bien con un paseo por el barrio y una comida de tapas por las calles cercanas. Consulta los horarios de apertura, porque la iglesia cierra durante el culto. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
      faq:
        - p: "¿Qué es la iglesia de San Pablo?"
          r: "Una iglesia gótico-mudéjar del barrio de San Pablo, con una torre de ladrillo decorado y un retablo mayor renacentista."
        - p: "¿Qué ver?"
          r: "La torre mudéjar, el retablo mayor y el ambiente del barrio."
        - p: "¿Cuánto tiempo se necesita?"
          r: "Unos 30-45 minutos."
        - p: "¿Qué hay cerca?"
          r: "Calles con tapas y bares tradicionales, y el casco histórico de Zaragoza."
        - p: "¿Es gratis?"
          r: "La entrada suele ser libre, pero consulta los horarios. Consulta siempre la web oficial para horarios, entradas y condiciones de acceso, que cambian."
