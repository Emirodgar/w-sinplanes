# Carreras populares de España (página /carreras/; NO está enlazada en el menú superior)
# ------------------------------------------------------------
# Las fechas son APROXIMADAS: cada edición cambia el domingo exacto. La página solo muestra mes y tramo
# (principios / mediados / finales), así que basta con acertar la época. Antes de publicar, contrasta las
# que marques con `revisar: true` en la web oficial de la carrera.
#
# Campos de cada carrera:
#   id         identificador único (sin espacios)
#   nombre     nombre de la carrera (igual en todos los idiomas)
#   ciudad     ciudad o localidad de salida
#   ccaa       slug de config/geo.json (andalucia, madrid, pais-vasco…); se traduce solo
#   tipo       maraton | media | popular | trail
#   distancia  texto libre: "42,195 km", "10 km", "21–110 km"…
#   mes        1-12 (0 = varía según la ciudad o la edición)
#   cuando     principios | mediados | finales   (omitir si mes: 0)
#   web        (opcional) URL oficial; si existe sale el nombre como enlace
#   revisar    (opcional) true si la fecha es la que menos seguridad tengo
#
# Plantilla:
#   - id: ejemplo
#     nombre: "…"
#     ciudad: "…"
#     ccaa: madrid
#     tipo: popular
#     distancia: "10 km"
#     mes: 5
#     cuando: mediados   # principios | mediados | finales
#     web: "https://…"

