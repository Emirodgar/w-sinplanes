# Lugares fijos de sinplanes.com: museos, monumentos, parques, rutas y actividades que se pueden hacer todo el año.
# ------------------------------------------------------------
# Procedencia: selección hecha a partir del rastreo de spain.info (sección "lugares de interés"). Solo entra lo
# permanente; las exposiciones temporales, giras y eventos de una sola edición se dejan fuera. Los resúmenes
# son propios (no se copia el texto de la fuente); cada ficha enlaza a la página de spain.info.
#
# Formato (una línea por lugar, para poder revisarlo de un vistazo):
#   - { id: <slug de spain.info>, lugar: [Provincia, Municipio], temas: [...], es: [titulo, resumen], en: [title, summary] }
# `id` es también el último tramo de la URL de la fuente (ver `bases`, una por grupo) y de la página en sinplanes.
# Grupos: lugares (museos, monumentos), naturaleza (parques y reservas), rutas (itinerarios fijos) y actividades.
# `lugar` puede ser null en rutas que cruzan varias comunidades: salen como plan de toda España.
# Horarios y entradas cambian: la ficha no los publica y remite siempre a la fuente.

bases:
  lugares: https://www.spain.info/es/lugares-interes/
  naturaleza: https://www.spain.info/es/naturaleza/
  rutas: https://www.spain.info/es/ruta/
  actividades: https://www.spain.info/es/actividades/

