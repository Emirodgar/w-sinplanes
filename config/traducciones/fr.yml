castanas-otono:
  imagen_alt: "Sol d'une châtaigneraie en automne couvert de feuilles dorées et de bogues de châtaigne"
  texto:
    - "Quand octobre arrive, les châtaigneraies du nord et du centre de la péninsule se couvrent de bogues tombées parmi les feuilles. Aller ramasser des châtaignes est l'un des plans d'automne les plus simples et les plus gratifiants : une balade tranquille en forêt, un panier qui se remplit peu à peu et, au retour, quelque chose de délicieux à faire griller à la maison."
    - "La saison commence, selon l'altitude et l'année, vers la mi-octobre et se prolonge jusque bien avant dans novembre. Les meilleures châtaigneraies se trouvent généralement en montagne, dans des zones au climat humide : El Bierzo (León), le Valle del Genal (Málaga), la sierra de Francia (Salamanque), le Valle del Tiétar (Ávila), ainsi qu'une bonne partie de la Galice et des Asturies."
    - "Le plus important est de savoir à qui appartient la châtaigneraie. Beaucoup sont des propriétés privées, avec un propriétaire qui les entretient et en vend les fruits, et ramasser sans autorisation peut avoir des conséquences. Renseigne-toi au village, à la mairie ou dans une maison d'hôtes de la région : il est fréquent que quelqu'un t'indique où l'on peut ramasser ou te mette en contact avec un propriétaire."
    - "Prévois des chaussures fermées qui accrochent bien, des gants épais (les bogues piquent pour de bon), un panier ou un sac et des vêtements que tu ne crains pas de salir. Les châtaignes tombent toutes seules quand elles sont mûres : le plus courant est de ramasser celles qui sont au sol, sans gauler les arbres ni les abîmer. Les jours qui suivent la pluie et le vent sont généralement les plus généreux."
    - "Une fois à la maison, fais une entaille dans la peau de chaque châtaigne avant de la griller ou de la cuire, pour qu'elle n'éclate pas. Elles se conservent mieux dans un endroit frais ou au réfrigérateur, et il vaut mieux les consommer en quelques jours. Le final naturel de ce plan, c'est un magosto : châtaignes grillées, feu de joie et vin nouveau."
  mapa:
    titulo: "Où aller ramasser des châtaignes"
    centro: [40.0, -5.0]
    zoom: 6
    puntos:
      - { nombre: "El Bierzo (León)", lat: 42.55, lon: -6.6, desc: "Châtaigneraies centenaires de Las Médulas et des vallées voisines ; berceau du magosto." }
      - { nombre: "Valle del Genal (Málaga)", lat: 36.57, lon: -5.17, desc: "Serranía de Ronda : Igualeja, Pujerra, Genalguacil et Júzcar, avec des châtaigniers dans toute la vallée." }
      - { nombre: "Sierra de Francia (Salamanque)", lat: 40.485, lon: -6.108, desc: "Autour de La Alberca et de Miranda del Castañar, avec des châtaigneraies sur les versants." }
      - { nombre: "Valle del Tiétar (Ávila)", lat: 40.2, lon: -5.1, desc: "Arenas de San Pedro, Candeleda et Guisando, au pied de la sierra de Gredos." }
      - { nombre: "Sierra de Aracena (Huelva)", lat: 37.89, lon: -6.56, desc: "Les châtaigneraies de la province de Huelva, à Castaño del Robledo et Galaroza." }
  faq:
    - p: "Quand est la saison des châtaignes ?"
      r: "En Espagne, de la mi-octobre à la mi-novembre environ. Dans les zones basses elle commence plus tôt et dans les zones plus élevées elle est décalée de quelques jours. Pour viser juste, renseigne-toi sur la zone la semaine précédente : la récolte change d'une année à l'autre selon la pluie et la chaleur de l'été."
    - p: "Peut-on ramasser des châtaignes dans n'importe quelle forêt ?"
      r: "Pas toujours. Beaucoup de châtaigneraies sont des propriétés privées et, en forêt publique, chaque mairie ou communauté peut avoir ses propres règles. Renseigne-toi auprès de la mairie ou des habitants avant de ramasser, et n'entre pas dans les propriétés clôturées."
    - p: "Où aller ramasser des châtaignes ?"
      r: "Les destinations classiques sont El Bierzo (León), le Valle del Genal (Málaga), la sierra de Francia (Salamanque) et le Valle del Tiétar (Ávila), ainsi que la Galice, les Asturies et la région d'Aracena. Toutes ont de très vastes châtaigneraies et une grande tradition."
    - p: "Que faut-il emporter ?"
      r: "Des gants épais, des chaussures fermées, un panier ou un sac et des vêtements chauds que tu ne crains pas de salir. Les bogues s'ouvrent en les écrasant avec la semelle de la chaussure, sans besoin d'outils."
    - p: "Comment fait-on griller les châtaignes ?"
      r: "Fais une entaille dans la peau de chacune, mets-les dans une poêle à châtaignes percée, au four ou sur un gril, et laisse-les de 20 à 30 minutes jusqu'à ce que la peau s'ouvre. Enveloppe-les quelques minutes dans un torchon pour qu'elles continuent de cuire dans leur propre vapeur et s'épluchent mieux."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, mais avec précaution : les bogues piquent. Donne-leur des gants et apprends-leur à ne pas mettre la main sans regarder. Pour eux, c'est une activité qui mêle balade, jeu et récompense."
    - p: "Qu'est-ce qu'un magosto ?"
      r: "C'est la fête traditionnelle d'automne de la Galice, des Asturies et d'El Bierzo : on fait griller des châtaignes sur un feu de joie et on les mange avec du vin nouveau ou du cidre, surtout à la Saint-Martin, le 11 novembre."
setas:
  imagen_alt: "Mains cueillant un bolet en forêt, avec un panier en osier rempli de champignons"
  texto:
    - "Avec les premières pluies d'automne, les pinèdes, les chênaies et les châtaigneraies se remplissent de champignons, et partir à leur recherche devient l'un des plans les plus attendus de l'année. C'est une excuse parfaite pour passer la matinée en forêt, avec ou sans panier plein."
    - "La haute saison va d'octobre à novembre, même si elle dépend beaucoup de la pluie et des températures : après quelques semaines humides et sans gelées, la forêt se met en route. Des provinces comme Soria, les Pyrénées, León, Zamora, la sierra de Gredos ou la Catalogne sont des classiques, et dans beaucoup d'entre elles il existe des sentiers mycologiques et des journées organisées."
    - "Avant de partir, renseigne-toi sur la réglementation de la zone. Plusieurs communautés exigent un permis ou une autorisation de cueillette (en Castille-et-León, par exemple, fonctionne le système Micocyl), et il existe des limites de quantité, des zones interdites et des horaires. Les règles changent d'un endroit à l'autre, alors consulte le site de la mairie ou de la communauté autonome."
    - "Si tu n'as pas d'expérience, la règle d'or est de ne manger aucun champignon que tu n'as pas identifié avec certitude. Le plus sage pour commencer est de t'inscrire à une sortie guidée ou à une journée mycologique avec un expert, et d'emporter un guide de terrain. Cueille avec un panier en osier, qui laisse tomber les spores et permet au champignon de respirer, et coupe ou extrais avec soin sans ravager le terrain."
  mapa:
    titulo: "Où aller aux champignons"
    centro: [41.2, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Pinèdes de Soria", lat: 41.95, lon: -2.75, desc: "Vinuesa, Covaleda et Duruelo de la Sierra, avec Micocyl comme système de permis." }
      - { nombre: "Pyrénées (Val d'Aran)", lat: 42.7, lon: 0.8, desc: "Forêts humides de sapins et de hêtres dans les Pyrénées de Lleida." }
      - { nombre: "Montagne de León", lat: 42.95, lon: -5.1, desc: "Riaño, Babia et Luna, avec des chênaies de chênes tauzins et des hêtraies." }
      - { nombre: "Sanabria (Zamora)", lat: 42.1, lon: -6.7, desc: "Pinèdes et châtaigneraies autour du lac de Sanabria." }
      - { nombre: "Sierra de Gredos (Ávila)", lat: 40.3, lon: -5.2, desc: "Pinèdes et chênaies du Valle del Tiétar et du Barranco." }
      - { nombre: "Solsonès (Catalogne)", lat: 42.0, lon: 1.5, desc: "Pinèdes et forêts mixtes avec une grande tradition mycologique." }
  faq:
    - p: "Quand est la saison des champignons ?"
      r: "En Espagne, la saison principale va d'octobre à novembre, même si dans certaines zones elle se prolonge jusqu'en décembre ou commence en septembre. Elle dépend de la pluie, de l'altitude et de la température : après plusieurs semaines humides et sans gelées, la forêt se met en route."
    - p: "Où chercher des champignons ?"
      r: "Soria, les Pyrénées, les montagnes de León et de Zamora, la sierra de Gredos ou la Catalogne sont des destinations classiques. Le plus pratique est de demander à l'office de tourisme ou dans une maison d'hôtes de la région, où l'on connaît en général les parcours et la réglementation en vigueur."
    - p: "Faut-il un permis pour cueillir des champignons ?"
      r: "Dans beaucoup de zones, oui. Plusieurs communautés autonomes exigent un permis ou une autorisation de cueillette, et il peut y avoir des limites de quantité et des zones interdites. Renseigne-toi toujours avant de partir sur le site de la mairie ou de la communauté autonome."
    - p: "Comment savoir si un champignon est comestible ?"
      r: "Ne te fie pas aux astuces populaires : on ne peut manger un champignon que si on l'a identifié avec certitude. Dans le doute, ne le cueille pas. Une sortie guidée ou une journée mycologique est le moyen le plus sûr d'apprendre, et en cas d'intoxication il faut se rendre aux urgences ou appeler le 112."
    - p: "Que faut-il emporter ?"
      r: "Un panier en osier, un couteau, un guide d'identification, des chaussures de montagne, des vêtements chauds, de l'eau et de quoi manger. Évite les sacs en plastique, qui abîment les champignons et empêchent les spores de tomber."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, à condition qu'ils soient accompagnés et sachent qu'on ne touche ni ne mange rien sans qu'un adulte l'ait vérifié. Les plus petits adorent la recherche, mais il vaut mieux choisir des parcours simples et veiller à ce qu'ils ne portent pas les mains à la bouche."
hayedos:
  imagen_alt: "Sentier couvert de feuilles entre des hêtres aux couleurs de l'automne, avec un peu de brume au fond"
  texto:
    - "Pendant quelques semaines d'automne, les hêtraies passent du vert au jaune, à l'orange et au cuivré, et le sol se couvre de feuilles. C'est l'un des spectacles naturels les plus photogéniques d'Espagne et un plan parfait pour marcher sans se presser entre des troncs argentés."
    - "Le meilleur moment se situe généralement entre la mi-octobre et la mi-novembre, même si le pic de couleur change chaque année selon le froid, la pluie et le vent. Parmi les hêtraies les plus connues figurent la Selva de Irati (Navarre), le Hayedo de Montejo (Madrid), le Hayedo de la Tejera Negra (Guadalajara) et celui d'Otzarreta (Biscaye), ainsi que ceux de Cantabrie, des Asturies et des Pyrénées."
    - "Attention aux quotas : certaines hêtraies, comme celle de Montejo, limitent le nombre de visiteurs ou exigent une réservation ou un permis d'accès, surtout les week-ends de couleur maximale. Consulte d'abord le site de l'espace protégé et, si tu peux, vas-y en semaine : il y aura moins de monde et plus de silence."
    - "Prévois des chaussures confortables qui accrochent sur les feuilles mouillées, une couche chaude et un imperméable, car dans la hêtraie l'humidité est habituelle, et ne t'écarte pas des sentiers balisés. Les matins avec un peu de brume et la lumière basse de fin de journée sont les meilleurs moments pour photographier."
  mapa:
    titulo: "Où voir une hêtraie en automne"
    centro: [42.0, -2.5]
    zoom: 7
    puntos:
      - { nombre: "Selva de Irati (Navarre)", lat: 42.98, lon: -1.1, desc: "L'une des plus grandes hêtraies-sapinières d'Europe, entre Ochagavía et Orbaizeta." }
      - { nombre: "Hayedo de Montejo (Madrid)", lat: 41.12, lon: -3.5, desc: "La hêtraie la plus méridionale d'Europe ; accès avec quota et réservation." }
      - { nombre: "Hayedo de la Tejera Negra (Guadalajara)", lat: 41.15, lon: -3.15, desc: "Dans la sierra de Ayllón, près de Cantalojas, avec des sentiers balisés." }
      - { nombre: "Hayedo de Otzarreta (Biscaye)", lat: 43.03, lon: -2.78, desc: "Dans le parc naturel de Gorbeia, l'une des plus photographiées." }
      - { nombre: "Saja-Besaya (Cantabrie)", lat: 43.1, lon: -4.2, desc: "Vastes hêtraies dans le parc naturel, avec de beaux sentiers d'automne." }
      - { nombre: "Redes (Asturies)", lat: 43.17, lon: -5.3, desc: "Hêtraies de montagne dans le parc naturel de Redes." }
      - { nombre: "Selva de Oza (Huesca)", lat: 42.85, lon: -0.75, desc: "Hêtraies et sapinières des Pyrénées aragonaises, dans la vallée de Hecho." }
  faq:
    - p: "Quel est le meilleur moment pour voir une hêtraie en automne ?"
      r: "Entre la mi-octobre et la mi-novembre, avec un pic de couleur qui dure en général deux ou trois semaines. Il varie chaque année avec le froid et la pluie ; il vaut donc mieux consulter le bulletin de l'espace protégé ou les réseaux sociaux des centres d'accueil des visiteurs."
    - p: "Quelles sont les plus belles hêtraies d'Espagne ?"
      r: "La Selva de Irati (Navarre), le Hayedo de Montejo (Madrid), le Hayedo de la Tejera Negra (Guadalajara) et celui d'Otzarreta (Biscaye) sont les plus connues. Celles de Cantabrie, des Asturies et des Pyrénées sont aussi remarquables."
    - p: "Faut-il réserver ou demander un permis ?"
      r: "Pour certaines, oui. Le Hayedo de Montejo, par exemple, limite les visites et exige une autorisation, et dans d'autres espaces il y a des quotas ou des parkings qui se remplissent les week-ends de couleur maximale. Consulte le site de l'espace protégé avant d'y aller."
    - p: "Peut-on y aller avec des enfants ou un chien ?"
      r: "Les parcours courts et balisés conviennent aux enfants. Avec un chien, cela dépend de chaque espace : dans certains ils sont interdits ou doivent être tenus en laisse ; il vaut donc mieux vérifier avant."
    - p: "Quels vêtements et quelles chaussures prévoir ?"
      r: "Des chaussures confortables qui accrochent sur les feuilles mouillées, des vêtements chauds en couches et un imperméable, car l'humidité et la température chutent vite en forêt."
    - p: "Comment éviter la foule ?"
      r: "Va-y en semaine, tôt le matin ou en fin d'après-midi, et évite les ponts et les week-ends de couleur maximale. Une autre option consiste à choisir des hêtraies moins connues de la même région."
berrea:
  texto:
    - "À la fin de l'été, les cerfs mâles commencent à bramer pour attirer les femelles et défier leurs rivaux. Ce rugissement grave et puissant, qui résonne dans la montagne à l'aube et au crépuscule, c'est la berrea (le brame du cerf), l'un des spectacles de faune les plus impressionnants d'Espagne."
    - "La berrea se concentre entre septembre et octobre, avec son point culminant généralement à la fin septembre et au début octobre, même si cela varie selon la zone et l'année. Les lieux les plus connus sont le parc national de Cabañeros, le parc national de Monfragüe, la Sierra de Andújar, la Reserva Nacional de Riaño et la Sierra de la Culebra, entre autres."
    - "Le mieux est d'arriver avant l'aube ou un peu avant la tombée de la nuit, quand les cerfs sont les plus actifs, et d'écouter en silence depuis un point d'observation. Emporte des jumelles, des vêtements chauds et de couleurs discrètes, et n'utilise ni lampe torche ni flash. Les cerfs en rut sont imprévisibles : garde toujours tes distances et ne t'approche pas d'eux."
    - "Dans certains espaces, il y a des parcours guidés, des observatoires ou des accès réglementés pendant la berrea, et il vaut mieux réserver à l'avance. Consulte le site de l'espace protégé ou du centre d'accueil des visiteurs avant d'y aller."
  mapa:
    titulo: "Où écouter la berrea"
    centro: [40.0, -5.0]
    zoom: 6
    puntos:
      - { nombre: "Parc national de Cabañeros (Ciudad Real)", lat: 39.4, lon: -4.5, desc: "Rañas (plateaux herbeux) et forêt méditerranéenne avec de grandes populations de cerfs ; visites guidées pendant la berrea." }
      - { nombre: "Parc national de Monfragüe (Cáceres)", lat: 39.83, lon: -6.05, desc: "Dehesa et falaises avec plusieurs belvédères pour écouter à l'aube." }
      - { nombre: "Sierra de Andújar (Jaén)", lat: 38.25, lon: -4.0, desc: "L'un des meilleurs endroits du sud ; très fréquenté, il vaut mieux réserver." }
      - { nombre: "Reserva Nacional de Riaño (León)", lat: 42.98, lon: -5.0, desc: "Berrea de montagne, entre hêtraies et chênaies des Picos de Europa de León." }
      - { nombre: "Sierra de la Culebra (Zamora)", lat: 41.85, lon: -6.2, desc: "Vaste réserve de chasse avec beaucoup de cerfs et quelques loups." }
  faq:
    - p: "Quand a lieu la berrea du cerf ?"
      r: "Entre septembre et octobre. Le moment de plus forte activité est généralement la fin septembre et le début octobre, même si cela change selon la zone et l'année. Le mieux est de sortir à l'aube ou au crépuscule."
    - p: "Où voir la berrea ?"
      r: "Les lieux les plus connus sont Cabañeros, Monfragüe, la Sierra de Andújar, la Reserva Nacional de Riaño et la Sierra de la Culebra. Dans beaucoup d'entre eux, il y a des parcours guidés, des observatoires ou des points d'écoute balisés."
    - p: "Que faut-il emporter ?"
      r: "Des jumelles, des vêtements chauds et de couleurs discrètes (verts, marrons, gris), des chaussures confortables et de quoi manger et boire. Aux heures de plus grande activité, il fait frais, même si la journée est chaude."
    - p: "Est-il dangereux de s'approcher des cerfs ?"
      r: "Oui. Les mâles en rut sont très agressifs et imprévisibles. Ne t'approche pas, ne les contourne pas, ne leur coupe pas le passage et garde la distance indiquée par les guides ou les panneaux."
    - p: "Faut-il réserver ?"
      r: "Dans certains espaces, oui, surtout pour les parcours guidés, les observatoires ou les accès réglementés en pleine berrea. Consulte le site de l'espace protégé ou du centre d'accueil des visiteurs avant d'y aller, car les places partent vite."
    - p: "Peut-on y aller avec des enfants ?"
      r: "Oui, c'est un très beau plan pour eux, mais il faut y aller en silence, tôt le matin et sans s'éloigner du groupe. Choisis des parcours simples, et de préférence avec un guide."
vendimia:
  texto:
    - "Septembre est le mois des vendanges dans une bonne partie de l'Espagne : les grappes mûres sont coupées à la main ou à la machine et les caves se remplissent d'une odeur de moût. Les vivre de près, entre vignobles et pressoirs, est l'un des plans de fin d'été les plus charmants, et il a beaucoup d'une fête."
    - "La date exacte change selon la zone, le cépage et l'année. Les raisins blancs et les variétés précoces se récoltent souvent dès la fin août, et les rouges les plus tardifs peuvent se prolonger jusqu'en octobre. Des régions comme La Rioja, la Ribera del Duero, Jerez, le Penedès, les Rías Baixas ou La Mancha organisent des visites, des dégustations et des activités liées aux vendanges."
    - "Beaucoup de caves proposent des expériences où tu peux couper des grappes, fouler le raisin ou voir comment la récolte arrive à la cave, généralement sur réservation préalable et payantes. Il y a aussi des fêtes consacrées aux vendanges, comme celles de Jerez ou celles de San Mateo à Logroño, avec foulage du raisin, offrandes du premier moût et dégustations."
    - "Si tu t'inscris à une expérience dans le vignoble, prévois des chaussures fermées et confortables, une casquette, de la crème solaire et des vêtements qui peuvent se tacher. Il vaut mieux y aller tôt le matin, quand il fait moins chaud et qu'on travaille plus tranquillement."
  mapa:
    titulo: "Où vivre les vendanges"
    centro: [40.0, -3.5]
    zoom: 6
    puntos:
      - { nombre: "La Rioja (Logroño)", lat: 42.4627, lon: -2.445, desc: "Rioja Alta et Rioja Baja, avec les fêtes de San Mateo à Logroño et de nombreuses caves ouvertes à la visite." }
      - { nombre: "Ribera del Duero (Burgos et Valladolid)", lat: 41.62, lon: -3.9, desc: "Vignobles de rouge le long du Duero, avec des caves ouvertes à la visite." }
      - { nombre: "Rías Baixas (Pontevedra)", lat: 42.51, lon: -8.81, desc: "Terre de l'albariño, avec des vendanges précoces et des caves autour de Cambados." }
      - { nombre: "Penedès (Barcelone)", lat: 41.3446, lon: 1.6988, desc: "Terre du cava et du vin, avec des caves et des expériences de vendanges autour de Vilafranca." }
      - { nombre: "La Mancha (Ciudad Real)", lat: 39.0, lon: -3.2, desc: "Le plus grand vignoble d'Espagne, avec des caves et des fêtes des vendanges dans ses villages." }
      - { nombre: "Jerez (Cadix)", lat: 36.6864, lon: -6.1377, desc: "Capitale du xérès, avec sa fête des vendanges et ses caves historiques." }
  faq:
    - p: "Quand ont lieu les vendanges en Espagne ?"
      r: "Cela dépend de la zone et du cépage, mais la période principale va de la fin août à octobre, avec septembre comme mois central. Les raisins blancs et précoces sont récoltés avant les rouges tardifs."
    - p: "Où vivre les vendanges ?"
      r: "Les destinations classiques sont La Rioja, la Ribera del Duero, Jerez, le Penedès, les Rías Baixas et La Mancha. Beaucoup de caves organisent des visites et des expériences à ces dates."
    - p: "Peut-on participer aux vendanges ?"
      r: "Oui, certaines caves proposent des expériences où tu peux couper des grappes, fouler le raisin ou voir l'arrivée de la récolte. Elles sont généralement payantes et sur réservation préalable ; renseigne-toi donc à l'avance."
    - p: "Y a-t-il des fêtes des vendanges ?"
      r: "Oui. Parmi les plus connues figurent les Fiestas de la Vendimia de Jerez et les Fiestas de San Mateo et des vendanges de La Rioja à Logroño, avec foulage du raisin, offrande du moût et dégustations."
    - p: "Que faut-il emporter ?"
      r: "Des chaussures fermées et confortables, une casquette, de la crème solaire et des vêtements qui peuvent se tacher. Il vaut mieux y aller tôt le matin, quand il fait moins chaud."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "En général, oui. Beaucoup de caves organisent des activités pour les familles, avec un foulage de raisin symbolique et du moût sans alcool. Demande lors de la réservation si les enfants sont admis."
mercadillos-navidad:
  texto:
    - "Les marchés de Noël remplissent de chalets, de lumières et d'odeurs de douceurs les places de nombreuses villes. C'est un plan parfait pour se promener, acheter de l'artisanat et des décorations, et commencer à entrer dans l'ambiance de Noël."
    - "Certains sont des classiques : le marché de la Plaza Mayor de Madrid, la Fira de Santa Llúcia de Barcelone, près de la cathédrale, ou le marché de Santo Tomás de Bilbao, qui a lieu le 21 décembre. Bien d'autres villes installent le leur, avec des chalets d'artisanat, de douceurs, de crèches et des spectacles pour enfants."
    - "Ils ouvrent généralement à partir de la fin novembre et durent jusqu'à Nochebuena (le 24 décembre) ou jusqu'aux Rois mages. Le plus agréable est d'y aller en semaine ou en début d'après-midi, quand il y a moins de monde, et de prendre des espèces, car tous les chalets n'acceptent pas la carte. Couvre-toi bien : on passe beaucoup de temps en plein air."
  faq:
    - p: "Quand ouvrent les marchés de Noël ?"
      r: "La plupart ouvrent à partir de la fin novembre ou du début décembre et ferment à Nochebuena, même si certains durent jusqu'aux Rois mages. Renseigne-toi sur les dates de chaque ville."
    - p: "Quels sont les plus connus ?"
      r: "Celui de la Plaza Mayor de Madrid, la Fira de Santa Llúcia de Barcelone et le marché de Santo Tomás de Bilbao comptent parmi les plus traditionnels, même si presque chaque ville a le sien."
    - p: "Faut-il payer l'entrée ?"
      r: "Non. L'entrée est libre, et tu ne paies que ce que tu achètes ou certaines attractions, comme les patinoires ou les spectacles."
    - p: "Que peut-on acheter ?"
      r: "Des crèches et des santons, des décorations, des bougies, de l'artisanat, des douceurs de Noël, des turrones et des jouets, selon le marché."
    - p: "Quel est le meilleur moment pour y aller ?"
      r: "En semaine et en début d'après-midi, pour éviter la foule. Le week-end et les ponts, il y a énormément de monde."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, beaucoup proposent des chalets de jouets, des spectacles et la visite du Père Noël ou des Rois mages. Fais attention à la foule et ne perds pas les plus petits de vue."
luces-navidad:
  texto:
    - "Chaque année, les villes espagnoles rivalisent pour avoir les illuminations de Noël les plus spectaculaires. Des rues couvertes de lumières, de grands sapins, des spectacles de lumière et de musique et beaucoup de monde qui se promène font de la visite des illuminations un plan très simple et très festif."
    - "Vigo s'est fait connaître pour son déploiement, et Madrid, Málaga, Valence ou Barcelone organisent aussi des illuminations très visitées. L'allumage a généralement lieu à la fin novembre ou au début décembre, lors d'une cérémonie publique, et les lumières restent allumées jusqu'aux Rois mages."
    - "Le plus pratique est de se déplacer à pied ou en transports en commun, car les centres-villes se remplissent de monde et des rues sont fermées à la circulation, surtout le week-end et les jours d'allumage. Si tu veux éviter la foule, va-y en semaine, en début de soirée. Couvre-toi bien et mets des chaussures confortables, car on marche beaucoup."
  faq:
    - p: "Quand les lumières de Noël sont-elles allumées ?"
      r: "Normalement à la fin novembre ou début décembre, lors d'une cérémonie publique. Chaque ville a sa date, annoncée quelques semaines à l'avance."
    - p: "Jusqu'à quand restent-elles allumées ?"
      r: "En général jusqu'aux Rois mages, le 6 janvier, même si dans certaines villes elles restent quelques jours de plus."
    - p: "Quelles villes ont les plus belles illuminations ?"
      r: "Vigo, Madrid, Málaga, Valence et Barcelone comptent généralement parmi les plus visitées, même si beaucoup de villes moyennes ont des illuminations très soignées."
    - p: "Quel est le meilleur moment pour y aller ?"
      r: "En semaine et en début de soirée. Le week-end, les jours de pont et les jours d'allumage, il y a beaucoup de monde."
    - p: "Comment me déplacer ?"
      r: "À pied ou en transports en commun. Dans les zones les plus visitées, des rues sont fermées et il est compliqué de se garer."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, c'est très attrayant pour eux. Fais attention à la foule et fixe un point de rendez-vous au cas où vous seriez séparés."
cabalgata-reyes:
  texto:
    - "La Cabalgata de Reyes est l'un des grands plans en famille de Noël : l'après-midi du 5 janvier, les Rois mages parcourent les rues de presque toutes les villes et de tous les villages d'Espagne avec des chars, de la musique et une pluie de bonbons, avant la nuit où ils déposent les cadeaux."
    - "Les plus connues sont celles de Madrid, de Barcelone, où les Rois arrivent par le port, de Séville, avec l'une des plus anciennes d'Espagne, ou de Valence, mais chaque localité organise la sienne. Les chars partent généralement à la tombée du jour, et le parcours et l'horaire sont publiés sur le site ou les réseaux de la mairie quelques jours avant."
    - "Arrive en avance et choisis une bonne place : les trottoirs se remplissent une ou deux heures avant. Prends un grand sac pour les bonbons, des vêtements chauds et de la patience, et surveille les enfants pendant que les bonbons pleuvent. S'il pleut, vérifie si le défilé est maintenu ou annulé."
  faq:
    - p: "Quand a lieu la Cabalgata de Reyes ?"
      r: "Le 5 janvier dans l'après-midi, même si l'horaire et le parcours changent d'une localité à l'autre."
    - p: "Où voir la cabalgata ?"
      r: "Dans presque toutes les villes et tous les villages. Celles de Madrid, Barcelone, Séville et Valence sont parmi les plus grandes, mais chaque mairie publie le parcours."
    - p: "Est-ce gratuit ?"
      r: "Oui, voir la cabalgata depuis la rue est gratuit."
    - p: "Quand arriver pour avoir une place ?"
      r: "Une ou deux heures avant dans les grandes villes, et un peu moins dans les petits villages."
    - p: "Que faut-il emporter ?"
      r: "Des vêtements chauds, un sac pour les bonbons et de la patience. Dans les zones très fréquentées, prévois un point de rendez-vous au cas où vous seriez séparés."
    - p: "Que se passe-t-il s'il pleut ?"
      r: "Cela dépend de la ville. Certaines sont maintenues et d'autres sont reportées ou réduites. Consulte le site ou les réseaux de la mairie."
loteria-navidad:
  texto:
    - "Le tirage de la Lotería de Navidad, chaque 22 décembre, est l'un des rites les plus suivis de Noël en Espagne. Les enfants de San Ildefonso chantent les numéros et les prix sur leur mélodie inimitable, que l'on entend à la radio et à la télévision dans tout le pays."
    - "Le tirage a lieu depuis des années au Teatro Real de Madrid et dure plusieurs heures, dès le petit matin. Le prix le plus célèbre est El Gordo, mais il y a beaucoup de prix, et on joue en famille, entre amis ou au travail, souvent avec un numéro partagé."
    - "Tu peux le suivre à la télévision ou à la radio, ou consulter les résultats sur le site officiel de Loterías. L'accès au Teatro Real est limité, donc le plus courant est de le regarder depuis chez soi. Si tu as joué, garde bien ton billet (le « décimo ») et vérifie les délais pour toucher les prix."
  faq:
    - p: "Quand a lieu le tirage de Noël ?"
      r: "Le 22 décembre, dès le petit matin. Il dure plusieurs heures."
    - p: "Où a-t-il lieu ?"
      r: "Au Teatro Real de Madrid. L'accès du public est limité."
    - p: "Qui chante les numéros ?"
      r: "Les enfants du Colegio de San Ildefonso, qui les chantent avec les prix."
    - p: "Comment le suivre ?"
      r: "À la télévision, à la radio ou sur internet. Tu peux aussi vérifier les résultats sur le site officiel de Loterías."
    - p: "Quand faut-il toucher le prix ?"
      r: "Les prix doivent être encaissés dans un certain délai. Consulte les conditions et les délais sur le site officiel de Loterías."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, beaucoup adorent entendre chanter les numéros et l'ambiance de la matinée."
campanadas:
  texto:
    - "Les Campanadas de Nochevieja marquent le passage à la nouvelle année en Espagne avec une tradition unique : manger douze grains de raisin, un à chaque coup de cloche, pour accueillir la nouvelle année avec de la chance. Elles sont retransmises en direct depuis l'horloge de la Puerta del Sol de Madrid et sont suivies dans presque tous les foyers."
    - "Beaucoup de gens les regardent à la télévision, chez eux ou avec des amis et de la famille, et d'autres préfèrent se rendre sur une place. À la Puerta del Sol, l'accès a généralement une capacité limitée et des contrôles de sécurité ; renseigne-toi donc sur les conditions et arrive en avance. D'autres villes organisent leurs propres événements sur les places principales."
    - "Pour les raisins, quelques conseils pratiques : épluche-les et retire les pépins, prépare les douze grains à l'avance et commence avec les premiers coups de cloche, pas avec les quarts. Ensuite, trinque, mets des accessoires de fête et fais la fête jusqu'au petit matin, ou va te reposer, selon ton plan."
  faq:
    - p: "Quand ont lieu les Campanadas ?"
      r: "Dans la nuit du 31 décembre, à 00h00. Les douze coups de cloche de l'horloge marquent le passage à la nouvelle année."
    - p: "Pourquoi mange-t-on douze raisins ?"
      r: "C'est une tradition qui consiste à manger un grain de raisin à chaque coup de cloche pour accueillir l'année avec de la chance. Elle se pratique dans toute l'Espagne."
    - p: "Puis-je aller à la Puerta del Sol ?"
      r: "Oui, mais l'accès a généralement une capacité limitée et des contrôles de sécurité. Consulte les conditions de la mairie de Madrid et arrive en avance."
    - p: "Quelles chaînes les retransmettent ?"
      r: "Plusieurs chaînes de télévision diffusent les campanadas en direct depuis la Puerta del Sol. Consulte la programmation."
    - p: "Comment préparer les raisins ?"
      r: "Épluche les raisins et retire les pépins, aie-en douze de prêts et commence avec les campanadas, pas avec les quarts qui les précèdent."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, à la maison ou lors d'un événement tranquille. Avec les jeunes enfants, les raisins peuvent être préparés épluchés, sans pépins ou coupés pour éviter les étouffements."
perseidas:
  texto:
    - "Les Perséides, connues en Espagne sous le nom de Larmes de saint Laurent, sont l'une des pluies d'étoiles filantes les plus faciles et les plus spectaculaires à observer depuis l'Espagne. Elles se produisent chaque année lorsque la Terre traverse la traînée de poussière de la comète Swift-Tuttle."
    - "L'activité dure de la mi-juillet à la fin août, et le maximum a généralement lieu entre le 11 et le 13 août. Par une nuit dégagée, sans Lune et sous un ciel sombre, on peut voir des dizaines de météores par heure. La phase de la Lune de chaque année joue beaucoup : avec la pleine Lune, on en voit bien moins."
    - "L'essentiel est de s'éloigner de la pollution lumineuse. Les réserves et destinations certifiées Starlight, comme Monfragüe, la Sierra Sur de Jaén ou Gúdar-Javalambre, sont un excellent choix, et beaucoup organisent des observations guidées. Pas besoin de télescope ni de jumelles : il suffit de s'allonger et de regarder le ciel ouvert."
    - "Laisse tes yeux s'habituer à l'obscurité pendant environ 20 à 30 minutes et évite de regarder ton téléphone. Apporte une couverture ou un transat, des vêtements chauds, même s'il fait chaud en journée, et quelque chose de chaud à boire. Les heures après minuit sont généralement les meilleures."
  mapa:
    titulo: "Où voir les Perséides"
    centro: [39.5, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Monfragüe (Cáceres)", lat: 39.83, lon: -6.05, desc: "Parc national et réserve Starlight, avec des observations guidées du ciel." }
      - { nombre: "Sierra Sur de Jaén", lat: 37.6, lon: -3.85, desc: "Réserve Starlight aux ciels très sombres, autour d'Alcalá la Real et de Castillo de Locubín." }
      - { nombre: "Gúdar-Javalambre (Teruel)", lat: 40.2, lon: -0.7, desc: "Réserve Starlight à plus de 1 500 m d'altitude, avec des ciels limpides et un observatoire astrophysique." }
  faq:
    - p: "Quand voit-on les Perséides ?"
      r: "L'activité va de la mi-juillet à la fin août, avec un maximum vers le 12 août, normalement entre le 11 et le 13. Les meilleures heures sont après minuit et jusqu'à l'aube."
    - p: "Où les voir le mieux en Espagne ?"
      r: "Dans n'importe quel endroit au ciel sombre et dégagé. Les destinations certifiées Starlight, comme Monfragüe, la Sierra Sur de Jaén ou Gúdar-Javalambre, offrent d'excellents ciels et des observations guidées."
    - p: "Faut-il un télescope ?"
      r: "Non. Ce sont des météores qui se déplacent vite et se voient mieux à l'œil nu. Les jumelles et les télescopes réduisent le champ de vision et n'aident pas."
    - p: "Dans quelle direction faut-il regarder ?"
      r: "Elles proviennent de la constellation de Persée, vers le nord-est, mais les météores apparaissent dans tout le ciel. Le mieux est de regarder vers le haut sans se fixer sur un point précis."
    - p: "La Lune a-t-elle une influence ?"
      r: "Beaucoup. Avec une pleine Lune ou une Lune très lumineuse, on voit bien moins de météores. Il vaut mieux consulter la phase lunaire de l'année avant de planifier la sortie."
    - p: "Que faut-il apporter ?"
      r: "Une couverture ou un transat, des vêtements chauds, une lampe de poche à lumière rouge (si tu en as besoin), quelque chose de chaud à boire et de la patience. Évite les lumières blanches, qui abîment la vision nocturne."
cerezos-jerte:
  texto:
    - "Pendant quelques semaines au printemps, la Vallée du Jerte, dans le nord de la province de Cáceres, se couvre de blanc avec la floraison de centaines de milliers de cerisiers. Les terrasses des versants semblent enneigées, et le spectacle se complète avec la Garganta de los Infiernos et les villages de pierre de la vallée."
    - "La floraison arrive généralement entre la fin mars et la mi-avril, même si la date exacte change chaque année selon l'hiver et les températures. Elle dure peu, entre une et deux semaines par zone, et avance ou retarde selon l'altitude : mieux vaut donc se renseigner sur l'état de la floraison avant de partir. C'est à cette époque que se célèbre la Fête du cerisier en fleurs (Fiesta del Cerezo en Flor)."
    - "C'est un plan très populaire, et les week-ends de floraison maximale, la circulation et le stationnement se compliquent. Si tu le peux, viens en semaine ou à la première heure, réserve ton hébergement à l'avance et arme-toi de patience sur les routes de la vallée. Les cerisiers sont des arbres cultivés qui ont un propriétaire : respecte les propriétés, ne coupe pas de branches et n'entre pas dans les terrasses fermées."
  mapa:
    titulo: "Où voir les cerisiers en fleurs"
    centro: [40.2, -5.77]
    zoom: 11
    puntos:
      - { nombre: "Garganta de los Infiernos", lat: 40.22, lon: -5.76, desc: "Réserve naturelle en tête de vallée, avec des sentiers et des vasques au bord de la rivière." }
      - { nombre: "Jerte", lat: 40.2147, lon: -5.7508, desc: "Village de pierre à l'entrée de la Garganta, avec un centre d'accueil des visiteurs et des cerisiers sur les terrasses." }
      - { nombre: "Navaconcejo", lat: 40.1747, lon: -5.7978, desc: "Village de la vallée entouré de cerisiers ; une bonne base pour voir la floraison." }
      - { nombre: "Cabezuela del Valle", lat: 40.1697, lon: -5.7014, desc: "Cerisiers sur les versants et rues de pierre, dans le tronçon médian de la vallée." }
  faq:
    - p: "Quand les cerisiers du Jerte fleurissent-ils ?"
      r: "Normalement entre la fin mars et la mi-avril, pendant une ou deux semaines dans chaque zone. La date change chaque année avec le climat : renseigne-toi donc sur l'état de la floraison avant d'y aller."
    - p: "Où voir les cerisiers en fleurs ?"
      r: "La Vallée du Jerte (Cáceres) est la plus connue, avec des villages comme Cabezuela del Valle, Navaconcejo ou Jerte, et des itinéraires comme celui de la Garganta de los Infiernos."
    - p: "Peut-on entrer dans les terrasses de cerisiers ?"
      r: "Ce sont des propriétés privées cultivées. Promène-toi sur les chemins et les belvédères balisés, n'entre pas dans les parcelles et ne coupe ni fleurs ni branches."
    - p: "Faut-il réserver son hébergement ?"
      r: "Oui, à l'avance, car les week-ends de floraison maximale tout est complet. Les villages voisins de La Vera ou Plasencia sont une alternative."
    - p: "Comment éviter la foule ?"
      r: "Viens en semaine, à la première heure ou en fin d'après-midi, et évite les week-ends de couleur maximale. Mieux vaut se garer dans les zones prévues et se déplacer à pied."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, les itinéraires faciles dans la vallée conviennent aux familles. Si ton enfant est allergique au pollen, apporte des médicaments, car au printemps la floraison est intense."
nieve:
  texto:
    - "Monter à la neige est l'un des grands plans d'hiver, que ce soit pour skier, se promener, faire de la luge ou simplement admirer la montagne blanche. L'Espagne compte des stations et des paysages enneigés dans la Sierra Nevada, les Pyrénées, la cordillère Cantabrique et le Système central."
    - "La saison va de décembre à mars, même si la neige dépend beaucoup de chaque hiver. Avant de partir, consulte l'état des pistes et des routes : il peut être nécessaire d'avoir des chaînes ou des pneus hiver, et les accès aux stations sont saturés les week-ends et lors des ponts. Consulte les informations de circulation avant et pendant le voyage."
    - "Pas besoin de skier. De nombreuses stations et vallées proposent des zones de luge, des itinéraires en raquettes, du ski de fond et des promenades dans la neige, et on peut louer les vêtements. Réserve le forfait et le matériel à l'avance pendant les périodes de forte affluence. Apporte des vêtements imperméables et en couches, des lunettes de soleil, de la crème solaire et des gants de rechange, car le soleil et le reflet sur la neige sont trompeurs."
  mapa:
    titulo: "Où monter à la neige"
    centro: [40.5, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Sierra Nevada (Granada)", lat: 37.09, lon: -3.4, desc: "La station la plus méridionale d'Europe, avec des pistes de ski et des zones de promenade et de luge." }
      - { nombre: "Pirineo aragonés (Formigal)", lat: 42.78, lon: -0.37, desc: "Grand domaine skiable des Pyrénées, avec du ski de fond et des itinéraires en raquettes à proximité." }
      - { nombre: "Pirineo catalán (Baqueira Beret)", lat: 42.7, lon: 0.93, desc: "L'une des plus grandes stations des Pyrénées, dans le Val d'Aran." }
      - { nombre: "Cordillera Cantábrica (San Isidro)", lat: 43.05, lon: -5.37, desc: "Station entre León et les Asturies, avec un paysage de haute montagne cantabrique." }
      - { nombre: "Sistema Central (Navacerrada)", lat: 40.79, lon: -4.01, desc: "La neige la plus proche de Madrid, avec des pistes et des zones de luge ; les accès sont saturés le week-end." }
  faq:
    - p: "Quand y a-t-il de la neige en Espagne ?"
      r: "Normalement de décembre à mars, janvier et février étant les mois les plus fiables. Cela dépend beaucoup de chaque hiver et de l'altitude."
    - p: "Où monter à la neige ?"
      r: "La Sierra Nevada (Grenade), les Pyrénées (Huesca, Lleida, Navarre), la cordillère Cantabrique, le Système central (Madrid, Ségovie) ou le Système ibérique offrent des stations et des itinéraires."
    - p: "Faut-il savoir skier ?"
      r: "Non. Il y a des luges, des itinéraires en raquettes, du ski de fond, des zones de neige pour les enfants et des promenades. Si tu veux skier, de nombreuses écoles proposent des cours d'initiation."
    - p: "Ai-je besoin de chaînes ?"
      r: "Cela dépend de la route et du jour. Consulte les informations de circulation et emporte des chaînes ou des pneus hiver. Parfois, il est obligatoire d'en avoir et la route est fermée sans elles."
    - p: "Faut-il réserver ?"
      r: "Pendant les périodes de forte affluence (ponts, Noël, week-ends de neige), il vaut mieux réserver le forfait, la location et l'hébergement. Acheter en ligne est généralement moins cher et plus rapide."
    - p: "Quels vêtements apporter ?"
      r: "Des vêtements imperméables et en couches, des gants et un bonnet, des lunettes de soleil ou de ski, une protection solaire et des chaussures à bonne semelle. Des vêtements secs de rechange pour le trajet du retour ne sont jamais de trop."
festival-san-sebastian:
  texto:
    - "Le Festival de Cinéma de Saint-Sébastien, connu sous le nom de Zinemaldia, est l'un des grands festivals de cinéma d'Espagne et d'Europe. Il se tient en septembre à Donostia-San Sebastián, avec des avant-premières internationales, des stars sur le tapis rouge et des projections ouvertes au public."
    - "La programmation comprend la sélection officielle en compétition, qui se dispute la Coquille d'or (Concha de Oro), ainsi que des sections parallèles, des rétrospectives et des hommages, comme le Prix Donostia pour l'ensemble d'une carrière. Les projections sont réparties entre plusieurs cinémas et lieux de la ville, dont le Kursaal et le Teatro Victoria Eugenia, et une grande partie est ouverte à tous les spectateurs."
    - "Consulte le site officiel pour le programme, les horaires et la vente des billets, qui sont généralement mis en vente quelques jours avant les séances et partent vite. Arrive tôt dans les files d'attente, regarde les horaires pour enchaîner les séances et profites-en pour te promener en ville et goûter les pintxos. En septembre, il peut pleuvoir : prends un parapluie."
  faq:
    - p: "Quand a lieu le Festival de Cinéma de Saint-Sébastien ?"
      r: "En septembre, pendant environ neuf jours. Les dates exactes sont annoncées chaque année."
    - p: "N'importe qui peut-il y aller ?"
      r: "Oui. Outre les séances réservées aux professionnels et à la presse, il y a de nombreuses projections ouvertes au public sur billet."
    - p: "Où acheter les billets ?"
      r: "Sur les canaux officiels du festival. Ils se vendent peu de temps à l'avance et les séances les plus populaires affichent complet."
    - p: "Qu'est-ce que la Coquille d'or ?"
      r: "C'est le prix principal du festival, décerné au meilleur film de la sélection officielle."
    - p: "Peut-on voir les stars ?"
      r: "Sur le tapis rouge du Teatro Victoria Eugenia, il y a généralement du public. Consulte les horaires et arrive tôt."
    - p: "Que faire d'autre à Saint-Sébastien ?"
      r: "Se promener le long de la baie de La Concha, goûter les pintxos dans la Parte Vieja et visiter le mont Igueldo."
semana-santa-sevilla:
  texto:
    - "La Semaine sainte de Séville est probablement la plus célèbre d'Espagne. Pendant huit jours, une soixantaine de confréries parcourent la ville avec leurs pasos du Christ et de la Vierge, accompagnées de nazarenos, de fanfares et de milliers de personnes dans les rues."
    - "Toutes les confréries passent par la Carrera Oficial, qui va de la Campana à la cathédrale. La nuit du Jeudi au Vendredi saints est la Madrugá, la plus intense en émotion et en affluence, avec des confréries comme El Silencio, El Gran Poder, La Macarena, Los Gitanos et La Esperanza de Triana."
    - "C'est une fête massive : les rues du centre se remplissent et les cortèges mettent des heures à passer. Télécharge le programme officiel, choisis les confréries que tu veux voir et arrive en avance. Réserve ton hébergement des mois à l'avance, utilise les transports en commun et sois patient face aux rues coupées. Et n'oublie pas : c'est un acte religieux, alors respecte le silence et les nazarenos."
  faq:
    - p: "Quand a lieu la Semaine sainte de Séville ?"
      r: "Du dimanche des Rameaux au dimanche de la Résurrection, qui change chaque année entre mars et avril. Consulte le calendrier officiel pour les dates exactes."
    - p: "Qu'est-ce que la Madrugá ?"
      r: "C'est la nuit entre le Jeudi saint et le Vendredi saint. Plusieurs des confréries les plus emblématiques sortent à ces heures-là, et c'est le moment de plus grande affluence et de plus forte émotion."
    - p: "Où voir les processions ?"
      r: "Dans la Carrera Oficial (de la Campana à la cathédrale), il y a beaucoup d'ambiance mais aussi beaucoup de monde. D'autres zones du centre ou des quartiers, comme Triana, permettent de les voir plus tranquillement."
    - p: "Faut-il réserver ?"
      r: "Pas pour voir les processions depuis la rue, mais oui pour l'hébergement et les restaurants, qui affichent complet des mois à l'avance."
    - p: "Comment consulter les horaires ?"
      r: "Le Consejo de Hermandades y Cofradías publie le programme officiel avec les itinéraires et les horaires de chaque confrérie. Il existe aussi des applications et des sites avec suivi en temps réel."
    - p: "Que faut-il apporter ou prendre en compte ?"
      r: "Des chaussures confortables, des vêtements en couches et de la patience. Respecte le silence, ne traverse pas entre les cortèges et évite le flash près des pasos."
fallas:
  texto:
    - "Les Fallas sont les fêtes de Valence en l'honneur de saint Joseph, du 15 au 19 mars. Inscrites au patrimoine culturel immatériel de l'humanité par l'UNESCO, elles mêlent monuments en carton et en bois, pyrotechnie, musique, poudre et beaucoup de vie dans la rue."
    - "Les fallas sont d'énormes monuments satiriques plantés dans les rues le 15. Tu peux les parcourir à pied, et les plus importantes se disputent des prix. Chaque jour à 14h00, la mascletà, une symphonie de poudre sur la place de l'Hôtel de Ville, est un rendez-vous incontournable. Les 17 et 18 a lieu l'Offrande de fleurs à la Vierge des Délaissés."
    - "La fin arrive la nuit du 19 mars avec la cremà : les fallas brûlent, en commençant par les enfantines et en terminant par la grande, à minuit. Réserve ton hébergement des mois à l'avance, utilise les transports en commun et arrive tôt pour avoir une place à la mascletà. Fais attention aux pétards dans la rue et aux jeunes enfants."
  faq:
    - p: "Quand ont lieu les Fallas ?"
      r: "Du 15 au 19 mars chaque année. La plantà a lieu le 15 et la cremà la nuit du 19."
    - p: "Qu'est-ce que la mascletà ?"
      r: "C'est un spectacle de poudre qui joue sur le son et la puissance plus que sur les couleurs. Elle est tirée chaque jour à 14h00 sur la place de l'Hôtel de Ville et on la ressent dans tout le corps."
    - p: "Qu'est-ce que la cremà ?"
      r: "C'est l'incendie des fallas la nuit du 19 mars, avec la combustion finale de la falla municipale à minuit."
    - p: "Comment se déplacer à Valence pendant les Fallas ?"
      r: "À pied et en transports en commun. Il y a des coupures de circulation et se garer est presque impossible. Le métro renforce son service."
    - p: "Que mange-t-on ?"
      r: "Des beignets de potiron avec du chocolat, de la paella et des sandwichs de rue. Les beignets sont la saveur typique de ces fêtes."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Oui, il y a des fallas enfantines et des activités, mais le bruit des pétards et la foule peuvent être éprouvants pour les plus petits."
semana-santa:
  texto:
    - "La Semaine sainte est la semaine qui précède le dimanche de la Résurrection, du dimanche des Rameaux au dimanche de Pâques, et c'est l'une des célébrations les plus intenses et les plus visitées d'Espagne. Confréries et hermandades sortent dans la rue leurs pasos et leurs images lors de processions qui mêlent foi, art, musique et tradition."
    - "Chaque ville a son propre style. À Séville et à Málaga, ce sont les grands tronos et les dais qui se démarquent ; à Valladolid, Zamora ou Salamanque, les processions sont plus sobres, avec une imagerie castillane ; et dans des lieux comme Cuenca ou Murcie, il y a des coutumes très particulières. Beaucoup sont des Fêtes d'intérêt touristique international."
    - "Comme les dates dépendent de Pâques, elles changent chaque année, entre mars et avril. Si tu comptes voyager, réserve ton hébergement très longtemps à l'avance et consulte les itinéraires et horaires officiels de chaque confrérie, publiés quelques semaines avant. Les processions sont des actes religieux : respecte le silence, ne traverse pas entre les cortèges et évite les flashs au passage des pasos."
  faq:
    - p: "Quand a lieu la Semaine sainte ?"
      r: "C'est la semaine qui précède le dimanche de la Résurrection, dont la date change chaque année entre fin mars et fin avril. Elle va du dimanche des Rameaux au dimanche de Pâques."
    - p: "Où voir les plus belles processions ?"
      r: "Séville, Málaga, Valladolid, Zamora, Salamanque, Cuenca, Murcie et Carthagène sont parmi les plus connues, chacune avec un style très différent. Beaucoup sont des Fêtes d'intérêt touristique international."
    - p: "Faut-il payer pour voir les processions ?"
      r: "Non. On les voit gratuitement depuis la rue. Dans certaines villes, il y a des chaises payantes sur la Carrera Oficial ou sur certains tronçons."
    - p: "Quels jours y a-t-il le plus de processions ?"
      r: "Le Jeudi saint et le Vendredi saint sont généralement les jours de plus grande affluence, et les nuits les plus animées sont celles qui séparent les deux, dans des villes comme Séville. Le dimanche des Rameaux et le Samedi saint ont aussi leurs processions."
    - p: "Comment m'organiser pour les voir ?"
      r: "Consulte le programme officiel de chaque confrérie, avec ses horaires et ses itinéraires, arrive en avance pour trouver une bonne place et arme-toi de patience : les cortèges avancent lentement et les rues sont fermées à la circulation."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Oui, mais avec précaution : il y a beaucoup de monde et de longues heures d'attente. Choisis des processions de l'après-midi, trouve un endroit avec de l'espace et explique-leur qu'il s'agit d'un acte de respect."
feria-abril:
  texto:
    - "La Feria de Abril de Séville est une semaine de fête avec des casetas, des sevillanas, des chevaux et des calèches, et des robes de flamenca. Elle se déroule au Real de la Feria, dans le quartier de Los Remedios, environ deux semaines après la Semaine sainte."
    - "La feria s'ouvre avec l'Alumbrado, le lundi soir, quand s'allument les milliers d'ampoules de la façade monumentale. Pendant la semaine, dès midi, il y a un défilé de chevaux et de calèches ; ensuite, les casetas se remplissent de musique, de danse, de nourriture et de boissons : rebujito, fino, jambon et poisson frit. Le dimanche, la fête se clôt par un feu d'artifice."
    - "Une chose à savoir : la plupart des casetas sont privées et seuls y entrent ceux qui ont une invitation ou qui sont membres. Il existe aussi des casetas publiques et certaines de la mairie, ouvertes à tous, et on peut parcourir librement les rues et le Real. On s'habille en général avec élégance : robe de flamenca pour elles, traje corto ou costume pour eux."
  faq:
    - p: "Quand a lieu la Feria de Abril ?"
      r: "Elle commence normalement deux semaines après le dimanche de la Résurrection, entre avril et mai. Elle dure une semaine, avec l'Alumbrado le lundi soir."
    - p: "Puis-je entrer dans n'importe quelle caseta ?"
      r: "Non. La plupart sont privées et on n'y entre qu'avec une invitation ou en étant membre. Il y a des casetas publiques et de la mairie ouvertes à tout le monde."
    - p: "Combien coûte l'entrée à la feria ?"
      r: "L'entrée dans l'enceinte est gratuite. Tu paies ce que tu consommes, et les attractions de la calle del Infierno sont payantes."
    - p: "Que faut-il porter ?"
      r: "Beaucoup de visiteurs portent une robe de flamenca ou un traje corto, mais ce n'est pas obligatoire. Le plus important, ce sont des chaussures confortables, car on marche beaucoup."
    - p: "Comment s'y rendre ?"
      r: "En métro, en tramway ou en bus. Évite de venir en voiture : se garer est presque impossible et les abords sont fermés à la circulation."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "En journée, oui, avec le défilé de chevaux et des casetas familiales. La calle del Infierno propose des attractions. Le soir, il y a plus de monde et plus de bruit."
san-fermin:
  texto:
    - "Les Sanfermines sont les fêtes de Pampelune, du 6 au 14 juillet, et l'une des célébrations les plus connues au monde. Elles commencent par le chupinazo sur la place de l'Hôtel de Ville, à midi le 6 juillet, et se terminent à minuit le 14 avec le Pobre de mí."
    - "Le grand symbole, ce sont les encierros (lâchers de taureaux) : chaque matin, à huit heures, les taureaux courent sur un parcours d'environ 850 mètres depuis le corral de Santo Domingo jusqu'aux arènes. Mais les Sanfermines, c'est bien plus que cela : procession de saint Firmin le 7 juillet, géants et grosses têtes, concerts, feux d'artifice, tenue blanche avec foulard rouge et une ambiance de rue de jour comme de nuit."
    - "Courir l'encierro est dangereux et obéit à des règles : il faut être majeur, ne pas avoir bu d'alcool et respecter les consignes de l'organisation. Si tu préfères le voir, tu peux le faire à la télévision ou depuis un point aménagé, qui se remplit très tôt. Réserve ton hébergement des mois à l'avance, car les prix grimpent et la ville se remplit."
  faq:
    - p: "Quand ont lieu les Sanfermines ?"
      r: "Du 6 au 14 juillet chaque année. Elles débutent avec le chupinazo le 6 à midi et se terminent avec le Pobre de mí à minuit le 14."
    - p: "À quelle heure ont lieu les encierros ?"
      r: "Chaque matin à 8h00, du 7 au 14 juillet. Il ne dure que quelques minutes."
    - p: "Comment voir un encierro ?"
      r: "À la télévision, ou en direct depuis des zones aménagées, qui se remplissent très tôt. Sur certains balcons, il y a des places payantes. Les points avec vue sur le parcours sont pris dès avant l'aube."
    - p: "N'importe qui peut-il courir ?"
      r: "Non. Il faut être majeur, ne pas être sous l'effet de l'alcool ou d'autres substances, et respecter les règles de l'organisation. C'est une activité dangereuse et il y a des blessés chaque année."
    - p: "Quels vêtements porter ?"
      r: "Traditionnellement, des vêtements blancs avec un foulard rouge autour du cou et une ceinture rouge. Des chaussures confortables et fermées, et des vêtements de rechange, car tu seras presque sûrement tâché."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "L'ambiance de jour est familiale, avec géants, grosses têtes et activités pour enfants. La nuit, il y a beaucoup plus de monde. Il vaut mieux éviter les encierros et les zones les plus bondées."
tomatina:
  texto:
    - "La Tomatina est la plus grande bataille de tomates du monde. Elle a lieu à Buñol, un village de la province de Valence, le dernier mercredi d'août, et pendant environ une heure, des milliers de personnes se lancent des tomates mûres jusqu'à ce que les rues soient teintes en rouge."
    - "Pour participer, il te faut un billet. La mairie limite la capacité et vend les tickets à l'avance, il est donc préférable de les acheter tôt sur les canaux officiels et de se méfier de la revente. La fête commence avec le palo jabón, un mât graissé avec un jambon au sommet, et la bataille démarre quand une fusée est tirée vers 11 heures du matin."
    - "Mets de vieux vêtements et des chaussures que tu ne regretteras pas de perdre, des lunettes de natation pour protéger tes yeux et des gants. Écrase la tomate avant de la lancer pour ne pas faire mal, et ne jette rien d'autre que des tomates. N'apporte ni objets de valeur ni appareils photo, et pars tôt de Valence, par exemple en train ou dans les bus organisés pour ce jour-là."
  faq:
    - p: "Quand a lieu la Tomatina ?"
      r: "Le dernier mercredi d'août, à Buñol (Valence). La bataille dure environ une heure, à partir de 11 heures du matin."
    - p: "Faut-il un billet ?"
      r: "Oui. La capacité est limitée et les billets s'achètent à l'avance via les canaux officiels. Évite d'acheter à des revendeurs."
    - p: "Comment aller à Buñol ?"
      r: "Depuis Valence, en train de banlieue (Cercanías) ou en bus. Il vaut mieux partir tôt, car le jour de la fête il y a énormément de monde."
    - p: "Quels vêtements porter ?"
      r: "De vieux vêtements et des chaussures que tu ne regretteras pas de perdre. Beaucoup de participants utilisent des lunettes de natation pour protéger leurs yeux et des gants."
    - p: "Quelles sont les règles ?"
      r: "Écrase la tomate avant de la lancer, ne lance rien d'autre que des tomates, n'apporte ni objets en verre ni objets de valeur et suis les consignes de l'organisation."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Il y a un âge minimum pour participer et la fête est très fréquentée. Consulte les conditions officielles avant d'acheter des billets."
san-juan:
  texto:
    - "La nuit de la Saint-Jean, la veille du 24 juin, est l'une des célébrations les plus anciennes liées au solstice d'été. Dans toute l'Espagne, on allume des feux de joie, on fait des rituels pour formuler des vœux et on organise des fêtes sur les plages, les places et dans les montagnes."
    - "Parmi les plus connues, celles de La Corogne, avec des feux sur les plages de Riazor et d'El Orzán, les Hogueras d'Alicante, Fête d'intérêt touristique international, la Revetlla de Sant Joan en Catalogne avec ses pétards et sa coca de Sant Joan, et les fêtes du feu du solstice dans les Pyrénées, reconnues par l'UNESCO."
    - "La coutume veut qu'on saute par-dessus le feu, qu'on se baigne à minuit ou qu'on écrive un vœu sur un papier pour le brûler. Fais-le en toute sécurité : n'utilise que les feux autorisés, n'allume pas de feu de ton côté dans les zones à risque, surveille les enfants avec les pétards et sois très prudent avec la baignade nocturne. Et ne laisse pas de déchets sur la plage."
  faq:
    - p: "Quand a lieu la nuit de la Saint-Jean ?"
      r: "La nuit du 23 au 24 juin, le 24 étant férié dans certaines communautés autonomes."
    - p: "Où voir les feux de joie ?"
      r: "La Corogne, Alicante, Barcelone, Cadix et de nombreuses plages du littoral organisent des célébrations très populaires. Consulte le programme de chaque mairie."
    - p: "Peut-on allumer des feux ?"
      r: "Uniquement là où c'est autorisé. Sur de nombreuses plages et dans de nombreuses zones forestières, il est interdit d'allumer un feu de son propre chef, avec un risque d'amende et d'incendie."
    - p: "Quels rituels pratique-t-on ?"
      r: "Sauter par-dessus le feu, faire des vœux, écrire sur un papier ce que tu veux laisser derrière toi pour le brûler, et se baigner à minuit. Chaque région a ses coutumes."
    - p: "Est-il sûr de se baigner la nuit ?"
      r: "Il y a un risque, surtout avec l'alcool et peu de visibilité. Baigne-toi uniquement sur des plages surveillées, accompagné et sans t'éloigner du bord."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Oui, il y a beaucoup d'activités familiales, mais il faut surveiller le feu et les pétards, et éviter les heures de plus grande affluence."
batalla-vino:
  texto:
    - "La Batalla del Vino de Haro est une fête unique : chaque 29 juin, des milliers de personnes se lancent du vin rouge aux Riscos de Bilibio, à quelques kilomètres de Haro, en La Rioja. C'est une célébration de la Saint-Pierre qui mêle tradition religieuse, vin et beaucoup d'humour."
    - "La journée commence par une procession depuis le village jusqu'aux Riscos de Bilibio et une messe à l'ermitage de San Felices. Ensuite, la bataille commence, avec des seaux, des pistolets, des gourdes de vin et des arrosoirs, et des milliers de litres de vin sont vidés. Presque tout le monde s'habille en blanc et porte un foulard violet."
    - "Mets des vêtements blancs que tu ne crains pas d'abîmer, des chaussures confortables qui peuvent être mouillées et des lunettes pour protéger tes yeux. N'emporte ni objets de valeur ni appareils photo qui pourraient être tachés, et garde à l'esprit que la fête est très fréquentée. Réserve ton hébergement et ton transport à l'avance et bois avec modération."
  faq:
    - p: "Quand a lieu la Batalla del Vino ?"
      r: "Chaque 29 juin, jour de la Saint-Pierre, aux Riscos de Bilibio, près de Haro (La Rioja)."
    - p: "Quels vêtements porter ?"
      r: "Des vêtements blancs que tu ne crains pas d'abîmer et des chaussures confortables. De nombreux participants utilisent des lunettes de natation et un foulard violet."
    - p: "Comment s'y rendre ?"
      r: "Depuis Haro, la plupart des gens y vont à pied en procession ou en transport organisé. Évite de prendre la voiture, car le stationnement est compliqué."
    - p: "Faut-il un billet ?"
      r: "En général, c'est une fête populaire en accès libre, mais il vaut mieux consulter les conditions et le programme de la mairie de Haro."
    - p: "Est-ce sûr ?"
      r: "C'est une fête très fréquentée et il y a du vin, donc il faut être prudent, protéger ses yeux et ne pas y aller seul."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Elle est très fréquentée et on y est trempé, donc elle n'est généralement pas recommandée pour les jeunes enfants."
romeria-rocio:
  texto:
    - "La Romería del Rocío est l'un des pèlerinages les plus massifs d'Espagne. Des centaines de milliers de personnes voyagent à pied, à cheval et en charrettes, depuis différents points d'Andalousie, jusqu'au hameau d'El Rocío, à Almonte (Huelva), à la Pentecôte."
    - "Les pèlerins, organisés en confréries, parcourent pendant des jours les chemins de Doñana, entre chants, prières, danses et convivialité. Le point culminant arrive à l'aube du lundi de Pentecôte, quand les habitants d'Almonte franchissent la grille et sortent la Vierge du Rocío en procession."
    - "Si tu veux le vivre sans être pèlerin, tu peux visiter le hameau et voir passer les confréries et les charrettes. Les rues sont en sable et il y a beaucoup de monde, la chaleur est forte et les hébergements et les places de stationnement sont vite complets. Prends de l'eau, des chaussures confortables et beaucoup de patience, et respecte le caractère religieux de la romería ainsi que l'environnement naturel de Doñana."
  faq:
    - p: "Quand a lieu la Romería del Rocío ?"
      r: "À la Pentecôte, 50 jours après le dimanche de Pâques, normalement entre mai et juin. Le jour principal est le lundi."
    - p: "Où a-t-elle lieu ?"
      r: "Dans le hameau d'El Rocío, à Almonte (Huelva), au bord du parc national de Doñana."
    - p: "Qu'est-ce que le salto de la reja ?"
      r: "C'est le moment où les habitants d'Almonte franchissent la grille qui protège la Vierge pour la sortir en procession, à l'aube du lundi de Pentecôte."
    - p: "Peut-on y aller sans être pèlerin ?"
      r: "Oui, mais l'accès est compliqué : il y a beaucoup de monde, peu de places de stationnement et des rues en sable. Renseigne-toi à l'avance sur la façon d'y aller et sur d'éventuelles restrictions de circulation."
    - p: "Que faut-il emporter ?"
      r: "De l'eau, un chapeau, de la crème solaire, des chaussures confortables et des vêtements adaptés à la chaleur de la journée et à la fraîcheur de la nuit. Respecte l'environnement naturel et ne laisse pas de déchets."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Avec prudence : il fait très chaud, il y a beaucoup de monde et les trajets sont longs. Mieux vaut visiter le hameau aux heures de moindre affluence."
feria-malaga:
  texto:
    - "La Feria de Málaga, à la mi-août, est l'une des foires les plus animées du sud : une semaine de musique, de danse, de casetas, de feux d'artifice et de vin doux. Elle se déroule sur deux sites : la Feria del Centro, de jour, et la Feria de Cortijo de Torres, de nuit."
    - "Pendant la journée, le centre historique se remplit de peñas, de musique, de fandangos verdiales et de gens habillés en gitane ou en tenue traditionnelle courte. La nuit, l'enceinte de Cortijo de Torres rassemble casetas, attractions, concerts et une ambiance du tonnerre. Il y a des activités pour tous les publics, et beaucoup de pescaíto frito et de vin de Málaga."
    - "Va au centre le jour et à l'enceinte la nuit. Évite la voiture et utilise les bus ou le transport public de la feria, car la circulation et le stationnement sont compliqués. Prends des chaussures confortables, des vêtements légers et de la patience, et réserve ton hébergement à l'avance."
  faq:
    - p: "Quand a lieu la Feria de Málaga ?"
      r: "À la mi-août, pendant une semaine. Les dates exactes changent chaque année."
    - p: "Qu'est-ce que la Feria del Centro ?"
      r: "La partie diurne de la feria, dans le centre historique, avec de la musique, de la danse et une ambiance populaire."
    - p: "Qu'est-ce que Cortijo de Torres ?"
      r: "L'enceinte où se déroule la feria de nuit, avec des casetas, des concerts et des attractions."
    - p: "Comment aller à Cortijo de Torres ?"
      r: "En bus et avec des services spéciaux de la feria. Évite la voiture, car le stationnement est difficile."
    - p: "Que mange-t-on et que boit-on ?"
      r: "Du pescaíto frito, des espetos, du jambon et du vin doux de Málaga, entre autres."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "De jour et dans le centre, oui. La nuit, il y a beaucoup de monde et de bruit."
fiesta-santiago-apostol:
  texto:
    - "Les Fiestas del Apóstol Santiago célèbrent le jour du saint patron de l'Espagne et de la Galice, le 25 juillet, qui est aussi la Fête nationale de la Galice. Elles ont lieu à Saint-Jacques-de-Compostelle, pendant une semaine d'actes religieux, de concerts, d'activités populaires et de grande animation."
    - "Deux moments se distinguent : la veille, la nuit du 24 juillet, avec le spectacle de feux d'artifice devant la façade de l'Obradoiro de la cathédrale, et le 25 juillet, avec l'Offrande nationale à l'Apôtre dans la cathédrale. Quand le 25 juillet tombe un dimanche, on célèbre l'Année sainte compostellane, avec encore plus d'afflux de pèlerins."
    - "Saint-Jacques se remplit de visiteurs, de pèlerins et de touristes à ces dates. Réserve ton hébergement à l'avance, consulte le programme officiel et arrive tôt sur la place de l'Obradoiro si tu veux voir les feux d'artifice. Prends des chaussures confortables et un imperméable, car en Galice le temps change vite."
  faq:
    - p: "Quand ont lieu les Fiestas del Apóstol ?"
      r: "Autour du 25 juillet, avec la veille, le 24, comme nuit de feux d'artifice."
    - p: "Que sont les feux d'artifice de l'Apôtre ?"
      r: "Un spectacle pyrotechnique qui a lieu la nuit du 24 juillet devant la façade de l'Obradoiro de la cathédrale."
    - p: "Qu'est-ce que l'Offrande nationale ?"
      r: "Un acte religieux et officiel qui a lieu le 25 juillet dans la cathédrale, avec une offrande à l'Apôtre saint Jacques."
    - p: "Qu'est-ce que l'Année sainte ?"
      r: "Une année jubilaire compostellane célébrée quand le 25 juillet tombe un dimanche. Elle attire beaucoup plus de pèlerins."
    - p: "Faut-il réserver son hébergement ?"
      r: "Oui, très longtemps à l'avance, car Saint-Jacques est pleine à ces dates."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Oui, il y a des activités familiales, mais les feux d'artifice et les foules de l'Obradoiro sont très fréquentés."
calcotada:
  texto:
    - "La calçotada est un repas typique de Catalogne, surtout du Camp de Tarragona et de l'Alt Camp : des calçots (oignons tendres) grillés à la braise, épluchés à la main et trempés dans la sauce romesco. C'est un repas de fête, avec bavoir, bonne compagnie et longue digestion à table."
    - "La saison commence vers décembre et dure jusqu'en avril, avec son point culminant entre janvier et mars. Valls, dans l'Alt Camp, est la capitale du calçot et organise fin janvier une grande fête, avec concours et repas populaire. En dehors de la Catalogne, il y a aussi des calçotadas dans d'autres régions d'Espagne."
    - "On les mange généralement avec de la viande grillée, de la butifarra, des haricots blancs et du vin ou du cava. Réserve à l'avance, surtout le week-end, car en pleine saison tout se remplit. On mange avec les mains : on attrape le calçot par la base, on tire sur la feuille extérieure, on le trempe dans le romesco et on mange la partie tendre du haut. Ça tache, donc le bavoir n'est pas exagéré."
  mapa:
    titulo: "Où aller à une calçotada"
    centro: [41.22, 1.25]
    zoom: 10
    puntos:
      - { nombre: "Valls (Alt Camp)", lat: 41.2872, lon: 1.2507, desc: "Capitale du calçot : fin janvier, elle célèbre sa grande fête, avec concours et repas populaire." }
      - { nombre: "Camp de Tarragona", lat: 41.12, lon: 1.2, desc: "Zone d'origine du calçot, avec des masías et des restaurants qui préparent des calçotadas en saison." }
      - { nombre: "Alt Camp", lat: 41.36, lon: 1.32, desc: "Comarque intérieure du calçot, avec des calçotadas dans les villages et les masías ; mieux vaut réserver." }
  faq:
    - p: "Qu'est-ce qu'un calçot ?"
      r: "C'est une variété d'oignon tendre typique de Catalogne. On le grille à la braise jusqu'à ce que la couche extérieure devienne noire, on l'enveloppe pour qu'il cuise dans sa propre vapeur et on le mange avec de la sauce romesco."
    - p: "Quand est la saison des calçots ?"
      r: "De décembre à avril environ, avec un pic entre janvier et mars."
    - p: "Où aller à une calçotada ?"
      r: "Le Camp de Tarragona et l'Alt Camp, avec Valls pour capitale, sont les zones de référence, mais il y a des restaurants et des masías qui proposent des calçotadas dans toute la Catalogne."
    - p: "Faut-il réserver ?"
      r: "Oui, à l'avance, surtout le week-end et en janvier et février. Beaucoup d'endroits ne servent la calçotada que sur commande."
    - p: "Comment mange-t-on les calçots ?"
      r: "Avec les mains : on les attrape par la base, on tire vers le haut pour retirer la couche brûlée, on les trempe dans le romesco et on mange la partie tendre. On porte généralement un bavoir."
    - p: "Que comprend aussi le menu ?"
      r: "Normalement de la viande grillée (agneau, butifarra), des haricots blancs, du pain à la tomate, un dessert et du vin ou du cava. On paie un menu fixe par personne."
carnaval-cadiz:
  texto:
    - "Le Carnaval de Cadix est l'un des plus célèbres et des plus différents d'Espagne. Son âme, c'est la satire : chirigotas, comparsas, chœurs et quatuors qui chantent des coplas pleines d'humour et de critique sur l'actualité, et qui remplissent les rues et les théâtres pendant des semaines."
    - "Le Concurso de Agrupaciones du Gran Teatro Falla, en février, est la grande vitrine des coplas. Dans la rue, l'ambiance de déguisements, de musique et de copla se vit surtout le week-end du Carnaval, avec des défilés, une cabalgata et des groupes de rue qui chantent sur les places et aux coins des rues."
    - "Les billets du Teatro Falla s'épuisent très vite. Le meilleur du Carnaval de Cadix se trouve dans la rue, sans besoin de billet : déguise-toi, suis les groupes et laisse les coplas te surprendre. Réserve ton hébergement à l'avance et prépare-toi à beaucoup de monde."
  faq:
    - p: "Quand a lieu le Carnaval de Cadix ?"
      r: "Il se célèbre avant le Carême, entre février et mars selon l'année. La date dépend de Pâques."
    - p: "Que sont les chirigotas ?"
      r: "Ce sont des groupes qui chantent des coplas satiriques et humoristiques sur l'actualité, avec des déguisements collectifs. C'est le genre le plus populaire du carnaval de Cadix."
    - p: "Faut-il un billet ?"
      r: "Pour le Concurso du Gran Teatro Falla, oui, et ils s'épuisent vite. Le Carnaval de rue est gratuit."
    - p: "Où voir l'ambiance de rue ?"
      r: "Dans le centre historique de Cadix : les rues et les places se remplissent de groupes et de gens déguisés, surtout le week-end."
    - p: "Faut-il se déguiser ?"
      r: "Ce n'est pas obligatoire, mais énormément de gens le font et l'ambiance est meilleure si tu t'y joins. Le plus typique, ce sont les déguisements pleins d'humour et de critique."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Oui, il y a des activités et une cabalgata en famille. Les soirs sont plus bondés."
sant-jordi:
  texto:
    - "Le 23 avril, on célèbre la Journée du livre et la Sant Jordi, et les rues se remplissent de stands de livres et de roses. En Catalogne, la tradition est d'offrir une rose et un livre, et c'est l'une des fêtes les plus aimées de Barcelone, avec beaucoup de monde dans la rue."
    - "À Barcelone, les stands de livres et de roses occupent les Ramblas, le Paseo de Gracia et presque tous les quartiers, et de nombreux écrivains dédicacent leurs ouvrages. La Journée internationale du livre est aussi célébrée dans toute l'Espagne, avec des dédicaces, des lectures et des réductions dans les librairies, et en Aragon, c'est le Día de Aragón."
    - "Si tu veux te faire dédicacer un livre, arrive tôt : les files d'attente sont longues. Va-y le matin ou en fin d'après-midi, quand il y a moins de monde, et consulte la liste des auteurs et les horaires dans les librairies et chez les éditeurs. Et n'oublie pas : il n'est pas nécessaire d'être catalan pour offrir une rose ou un livre."
  faq:
    - p: "Quand a lieu la Sant Jordi ?"
      r: "Chaque 23 avril. Elle coïncide avec la Journée du livre."
    - p: "Que s'offre-t-on ?"
      r: "Traditionnellement, l'homme offre une rose et la femme un livre. Aujourd'hui, on offre les deux entre toutes sortes de personnes."
    - p: "Où aller à Barcelone ?"
      r: "Les Ramblas, le Paseo de Gracia et les rues du centre se remplissent de stands. Il y en a dans presque tous les quartiers."
    - p: "Y a-t-il des dédicaces d'auteurs ?"
      r: "Oui, de nombreux auteurs dédicacent des livres sur les stands, dans les librairies et lors des salons. Arrive tôt pour éviter les files."
    - p: "Est-ce célébré en dehors de la Catalogne ?"
      r: "Oui, la Journée du livre est célébrée dans toute l'Espagne et dans le monde, avec des activités dans les librairies et les bibliothèques."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Oui, il y a des heures du conte et des activités pour enfants. Attention à la foule dans le centre de Barcelone."
pilar:
  texto:
    - "Les Fiestas del Pilar sont les fêtes patronales de Saragosse, en l'honneur de la Vierge du Pilar, et se célèbrent autour du 12 octobre, qui est aussi jour férié national. Pendant une semaine, la ville se remplit de concerts, de défilés, d'événements populaires et de beaucoup d'ambiance dans la rue."
    - "Le moment central est l'Ofrenda de Flores, le 12 octobre, quand des milliers de personnes, beaucoup en costume régional aragonais, défilent dans le centre jusqu'à la place du Pilar pour déposer leurs fleurs devant la Vierge et former un grand manteau floral. Le lendemain, le 13 octobre, a lieu l'Ofrenda de Frutos."
    - "Outre l'offrande, il y a des géants et des grosses têtes, des concerts sur différentes scènes, des spectacles pyrotechniques et des activités culturelles et sportives. Consulte le programme officiel de la mairie de Saragosse. Réserve ton hébergement à l'avance, car c'est une fête très populaire et le centre se remplit. Et pour l'offrande, arrive tôt si tu veux voir le défilé."
  faq:
    - p: "Quand ont lieu les Fiestas del Pilar ?"
      r: "Autour du 12 octobre. Elles durent environ une semaine, avec le 12 comme journée principale."
    - p: "Qu'est-ce que l'Ofrenda de Flores ?"
      r: "C'est le défilé où des milliers de personnes, beaucoup en costume régional, apportent des fleurs à la Vierge du Pilar pour former un grand manteau floral. Elle a lieu le 12 octobre."
    - p: "Faut-il réserver ?"
      r: "Pas pour voir l'offrande. Mais oui pour l'hébergement, car Saragosse se remplit pendant les fêtes."
    - p: "Que peut-on faire d'autre ?"
      r: "Des concerts, des géants et des grosses têtes, des feux d'artifice, des foires gastronomiques et des activités pour enfants. Le programme officiel est publié par la mairie."
    - p: "Est-ce gratuit ?"
      r: "La plupart des événements sont gratuits, mais certains concerts et spectacles sont payants."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Oui, il y a beaucoup d'activités pour enfants et le défilé des géants et des grosses têtes leur plaît souvent. Attention à la foule le 12."
semana-santa-malaga:
  texto:
    - "La Semaine sainte de Málaga se distingue par ses tronos de grande taille, portés à bras par des centaines de porteurs à travers le centre de la ville. Déclarée Fête d'intérêt touristique international, chaque procession est un spectacle de musique, de fleurs, d'encens et d'émotion populaire."
    - "Les confréries sortent de leurs églises et de leurs quartiers et se dirigent vers la Carrera Oficial, sur l'Alameda et la calle Larios, où se trouvent une tribune et des chaises. Un rendez-vous très attendu est celui du Jeudi saint, avec la Légion qui accompagne le Christ de la Bonne Mort, même si chaque jour a ses propres processions et chaque quartier son ambiance."
    - "Consulte le programme officiel de l'Agrupación de Cofradías avec les horaires et les itinéraires. Les rues du centre se remplissent et les défilés sont lents, alors arrive en avance et choisis un emplacement. Réserve ton hébergement à l'avance et, si tu peux, va aussi voir les processions des quartiers, plus tranquilles."
  faq:
    - p: "Quand a lieu la Semaine sainte de Málaga ?"
      r: "Du dimanche des Rameaux au dimanche de Pâques, entre mars et avril selon l'année. Il y a aussi des événements préliminaires dès le Vendredi des Douleurs."
    - p: "Qu'est-ce qui la rend différente ?"
      r: "Les tronos sont grands et portés à bras, et l'ambiance mêle foi, musique et tradition populaire. La Légion et les fanfares y jouent un rôle important."
    - p: "Où voir les processions ?"
      r: "Sur la Carrera Oficial (Alameda, calle Larios et plaza de la Constitución), avec plus d'ambiance et plus de monde. Les processions des quartiers sont une alternative plus tranquille."
    - p: "Faut-il payer ?"
      r: "Voir les processions depuis la rue est gratuit. Il y a des chaises et des tribunes payantes sur la Carrera Oficial."
    - p: "Comment consulter les horaires ?"
      r: "L'Agrupación de Cofradías publie le programme officiel avec les itinéraires et les horaires de chaque confrérie."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Oui, avec précaution : il y a beaucoup de monde et de longues attentes. Choisis des processions de l'après-midi et un endroit avec de l'espace."
festival-jerez:
  texto:
    - "Le Festival de Jerez est l'un des grands rendez-vous du flamenco dans le monde. Il se tient fin février et début mars à Jerez de la Frontera, la ville où est né cet art, avec des spectacles, des cours et des rencontres pendant deux semaines."
    - "Le programme comprend des spectacles de danse, de chant et de guitare d'artistes confirmés et de nouveaux talents, au Teatro Villamarta et dans d'autres lieux de la ville. Il y a aussi des cours de flamenco ouverts aux amateurs et aux professionnels, ainsi que des activités dans les peñas et les tablaos qui permettent de découvrir de près l'ambiance flamenca de Jerez."
    - "Consulte le site officiel pour le programme et l'achat des billets, qui se vendent à l'avance. Profites-en pour visiter les peñas flamencas et les bodegas de la ville, et pour goûter à la gastronomie de Jerez. Les soirées de février sont fraîches, alors emporte des vêtements chauds."
  faq:
    - p: "Quand a lieu le Festival de Jerez ?"
      r: "Fin février et début mars, pendant environ deux semaines. Les dates exactes sont annoncées chaque année."
    - p: "Où a-t-il lieu ?"
      r: "À Jerez de la Frontera, surtout au Teatro Villamarta et dans d'autres lieux de la ville."
    - p: "Que propose-t-il en plus des spectacles ?"
      r: "Des cours de flamenco, des rencontres et des activités dans les peñas et les tablaos."
    - p: "Où acheter les billets ?"
      r: "Sur les canaux officiels du festival. Ils se vendent à l'avance et les spectacles les plus demandés affichent complet."
    - p: "Puis-je m'inscrire à un cours ?"
      r: "Oui, il y a des cours pour amateurs et professionnels. Consulte les modalités d'inscription sur le site officiel."
    - p: "Que faire d'autre à Jerez ?"
      r: "Visiter les bodegas, les peñas flamencas, le Real Alcázar et goûter à la gastronomie locale."
sonar-festival-internacional-musica-avanzada-barcelona:
  texto:
    - "Sónar est l'un des grands festivals de musique électronique et de créativité numérique d'Europe. Il se tient à Barcelone en juin, pendant trois jours, et associe concerts et sets de DJ à des expositions, des conférences et des propositions d'art et de technologie."
    - "Le festival se divise en deux programmes : Sónar de Día, avec des scènes en plein air, des sets et des activités, et Sónar de Noche, avec de grands sets et concerts dans un autre site, jusqu'au petit matin. Il comprend aussi un espace professionnel consacré à la créativité et à la technologie."
    - "Les billets se vendent à l'avance, à la journée ou en pass complet, et l'affiche est annoncée des mois avant. Achète uniquement sur les canaux officiels et consulte les conditions d'accès et les objets autorisés. Prévois des chaussures confortables, une protection solaire pour la journée, des bouchons d'oreilles et de l'eau, et organise à l'avance ton transport de retour après la session de nuit."
  faq:
    - p: "Quand a lieu Sónar ?"
      r: "En juin, pendant trois jours. Les dates exactes sont annoncées chaque année."
    - p: "Où a-t-il lieu ?"
      r: "À Barcelone, sur deux sites : un pour Sónar de Día et un autre pour Sónar de Noche."
    - p: "Quelle est la différence entre Sónar de Día et Sónar de Noche ?"
      r: "De jour, des scènes en plein air et des activités ; de nuit, des sets et des concerts de grand format jusqu'au petit matin."
    - p: "Où acheter les billets ?"
      r: "Sur les canaux officiels du festival. Il y a des billets à la journée et des pass complets. Méfie-toi des reventes."
    - p: "Que faut-il emporter ?"
      r: "Des chaussures confortables, une protection solaire et une casquette de jour, des bouchons d'oreilles et de l'eau. Vérifie les objets autorisés avant d'y aller."
    - p: "Comment rentrer ?"
      r: "Organise ton transport à l'avance : après la session de nuit, le métro peut être fermé et la demande de taxis est très forte."
bilbao-bbk-live:
  texto:
    - "Le Bilbao BBK Live est un festival de musique qui se tient en juillet sur les pentes du mont Kobetas, avec vue sur la ville de Bilbao. Pendant trois jours, il réunit des artistes de pop, rock, indie et électronique dans un cadre naturel très particulier."
    - "Le site, en plein air et en pente, compte plusieurs scènes ainsi qu'un espace restauration et détente. L'affiche est annoncée des mois à l'avance et les billets se vendent à l'avance, à la journée ou en pass complet. C'est un festival très lié à la ville : on y accède en transports en commun et par des navettes spéciales depuis le centre."
    - "Consulte sur le site officiel les conditions d'accès, les objets autorisés et les horaires. Prévois des chaussures confortables, des vêtements chauds et un imperméable, car à Bilbao le temps peut changer vite, ainsi qu'une protection solaire s'il fait beau. Réserve ton hébergement à l'avance, car la ville est pleine ces jours-là."
  faq:
    - p: "Quand a lieu le Bilbao BBK Live ?"
      r: "En juillet, pendant trois jours. Les dates exactes sont annoncées chaque année."
    - p: "Où a-t-il lieu ?"
      r: "Sur les pentes du mont Kobetas, à Bilbao, avec vue sur la ville."
    - p: "Comment accéder au site ?"
      r: "En transports en commun et par des navettes spéciales organisées depuis le centre. Consulte le site officiel pour les détails."
    - p: "Où acheter les billets ?"
      r: "Sur les canaux officiels du festival, à la journée ou en pass complet. Évite les reventes."
    - p: "Quels vêtements emporter ?"
      r: "Des chaussures confortables, des vêtements chauds, un imperméable et une protection solaire. À Bilbao, le temps peut changer vite."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Cela dépend de l'affiche et des horaires. Consulte les conditions d'accès des mineurs sur le site officiel."
fib-festival-internacional-benicassim:
  texto:
    - "Le FIB, Festival International de Benicàssim, est l'un des festivals les plus anciens et les plus connus d'Espagne. Il se tient en juillet à Benicàssim, sur la côte de Castellón, et associe concerts, plage, camping et ambiance de vacances."
    - "Pendant quatre jours, plusieurs scènes réunissent des artistes de rock, indie, pop et électronique, avec des sets jusqu'au petit matin. La proximité de la mer est l'un de ses grands atouts : beaucoup de festivaliers profitent de la matinée pour se baigner et se reposer avant les concerts de l'après-midi et de la nuit."
    - "Les billets se vendent à l'avance, à la journée ou en pass, et il peut y avoir des formules avec camping. Achète uniquement sur les canaux officiels et vérifie les conditions d'accès. En juillet, il fait très chaud : emporte une protection solaire, une casquette, de l'eau et des chaussures confortables, et réserve ton hébergement à l'avance si tu ne comptes pas camper."
  faq:
    - p: "Quand a lieu le FIB ?"
      r: "En juillet, pendant quatre jours. Les dates exactes sont annoncées chaque année."
    - p: "Où a-t-il lieu ?"
      r: "À Benicàssim, sur la côte de Castellón."
    - p: "Y a-t-il un camping ?"
      r: "Il y a généralement des formules avec camping. Consulte les conditions sur le site officiel."
    - p: "Comment acheter les billets ?"
      r: "Sur les canaux officiels du festival, à la journée ou en pass complet. Évite les reventes."
    - p: "Que faut-il emporter ?"
      r: "Une protection solaire, une casquette, de l'eau, des chaussures confortables et un maillot de bain, car la mer est toute proche."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Cela dépend de l'affiche et des horaires. Consulte les conditions d'accès des mineurs sur le site officiel."
festival-internacional-cine-fantastico-cataluna-sitges:
  texto:
    - "Le Festival de Sitges est le grand festival de cinéma fantastique et d'horreur d'Espagne et l'un des plus importants au monde dans son genre. Il se tient en octobre à Sitges, une station balnéaire proche de Barcelone, pendant environ onze jours."
    - "La programmation comprend des avant-premières de films d'horreur, de science-fiction, de fantasy et de thriller, des rétrospectives, des hommages et des rencontres avec des réalisateurs et des acteurs. Il y a des sections en compétition et des sections parallèles, ainsi qu'une ambiance festive parmi les passionnés, avec des déguisements et des activités dans la rue."
    - "Sitges se trouve à environ 35 kilomètres de Barcelone et on y va en train de Rodalies, ce qui permet de faire l'aller-retour dans la journée. Consulte le programme et achète tes billets à l'avance, car les séances populaires affichent complet. Réserve ton hébergement à l'avance si tu veux rester, car la ville est pleine pendant le festival."
  faq:
    - p: "Quand a lieu le Festival de Sitges ?"
      r: "En octobre, pendant environ onze jours. Les dates exactes sont annoncées chaque année."
    - p: "Quel type de cinéma est projeté ?"
      r: "Du cinéma fantastique, d'horreur, de science-fiction, de fantasy et de thriller, avec des avant-premières et des rétrospectives."
    - p: "Comment venir depuis Barcelone ?"
      r: "En train de Rodalies depuis Barcelone, en 35 à 45 minutes environ. Il y a aussi des bus et la voiture, mais se garer est difficile pendant le festival."
    - p: "Où acheter les billets ?"
      r: "Sur les canaux officiels du festival. Les séances avec invités et les avant-premières affichent complet."
    - p: "Faut-il venir déguisé ?"
      r: "Ce n'est pas obligatoire, mais l'ambiance est très festive et beaucoup de passionnés le font."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Cela dépend des films : beaucoup sont pour adultes. Consulte la classification par âge de chaque séance."
fiesta-piraguas-descenso-internacional-sella:
  texto:
    - "Le Descenso Internacional del Sella est l'une des fêtes les plus populaires des Asturies et l'une des plus connues d'Espagne. Chaque août, des milliers de kayakistes descendent la rivière Sella entre Arriondas et Ribadesella, pendant que des milliers de personnes la vivent depuis les berges, avec de quoi manger, de quoi boire et beaucoup d'ambiance."
    - "C'est une fête d'intérêt touristique international qui mêle compétition sportive, tradition et fête populaire. Les participants parcourent une vingtaine de kilomètres sur la rivière, et le parcours se suit depuis plusieurs points et depuis les berges, avec des pique-niques et de la musique tout au long du trajet."
    - "Si tu veux voir la descente, choisis un point bien accessible, arrive tôt et garde en tête que la circulation devient compliquée et qu'Arriondas et Ribadesella se remplissent de monde. Pour participer, il faut s'inscrire à l'avance. Emporte de l'eau, de la crème solaire et des chaussures confortables."
  faq:
    - p: "Quand a lieu le Descenso del Sella ?"
      r: "Normalement le premier samedi d'août. Consulte la date exacte chaque année."
    - p: "Où se déroule-t-il ?"
      r: "Sur la rivière Sella, entre Arriondas et Ribadesella, dans les Asturies."
    - p: "Comment le voir ?"
      r: "Depuis les berges, avec un pique-nique et une ambiance de fête, ou depuis des points aménagés. L'arrivée se trouve à Ribadesella."
    - p: "Peut-on participer ?"
      r: "Oui, mais il faut s'inscrire à l'avance et respecter les conditions de l'organisation."
    - p: "Comment s'y rendre ?"
      r: "En prenant de l'avance : la circulation est compliquée. Pense aux transports organisés et aux parkings aménagés."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Oui, l'ambiance des berges est familiale, mais il y a beaucoup de monde et il fait chaud. Emporte de l'eau et de la crème solaire."
festival-womad-caceres:
  texto:
    - "WOMAD Cáceres est un festival de musiques du monde qui transforme les places de la ville monumentale en scènes en plein air. Il a lieu en mai et réunit des concerts d'artistes de différents pays, des ateliers, des activités pour enfants et de la gastronomie."
    - "Le cadre fait partie de son charme : places médiévales, palais et rues de pierre d'une ville classée au patrimoine mondial de l'humanité. Beaucoup de concerts ont lieu sur des places ouvertes, et le festival propose aussi des activités culturelles et de loisirs pour tous les âges."
    - "Consulte le site officiel pour le programme, les places et les horaires, et pour savoir quels concerts sont en accès libre et lesquels nécessitent un billet ou un pass. Prévois des chaussures confortables, car les rues sont pavées, et des vêtements à superposer. Réserve ton hébergement à l'avance : Cáceres se remplit pendant le festival."
  faq:
    - p: "Quand a lieu WOMAD Cáceres ?"
      r: "En mai, pendant quelques jours. Les dates exactes sont annoncées chaque année."
    - p: "Quel type de musique y entend-on ?"
      r: "Des musiques du monde : folklore, fusion, ethno et musique traditionnelle de différents pays."
    - p: "Où ont lieu les concerts ?"
      r: "Sur des places et dans des espaces de la ville monumentale de Cáceres. Consulte le programme."
    - p: "Tous les concerts sont-ils gratuits ?"
      r: "Cela dépend de l'édition. Certains concerts sont en accès libre et d'autres sur billet ou avec un pass. Consulte le site officiel."
    - p: "Qu'est-ce qu'il vaut mieux emporter ?"
      r: "Des chaussures confortables, car les rues sont pavées, et des vêtements à superposer."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Oui, le festival propose en général des ateliers et des activités pour les enfants. Consulte le programme."
fiestas-vendimia-riojana:
  texto:
    - "Les Fiestas de San Mateo et de la Vendimia Riojana sont les grandes fêtes de Logroño et l'une des meilleures façons de vivre les vendanges en Rioja. Elles ont lieu en septembre, pendant une semaine, avec des cérémonies traditionnelles liées au vin et beaucoup d'ambiance dans la rue."
    - "L'un des moments les plus emblématiques est le foulage du raisin et l'offrande du premier moût à la Vierge de Valvanera, patronne de La Rioja. Pendant la semaine, il y a aussi des concerts, des défilés, des activités populaires, des dégustations et des spectacles pour tous les publics, et la ville se remplit de visiteurs."
    - "Profites-en pour goûter les pinchos de la calle Laurel et des alentours, et pour visiter une bodega de la région, car beaucoup organisent des dégustations et des visites pendant les vendanges. Consulte le programme officiel de la mairie, réserve ton hébergement à l'avance et, si tu vas dans une bodega, réserve aussi à l'avance."
  faq:
    - p: "Quand ont lieu les Fiestas de San Mateo ?"
      r: "Autour du 21 septembre, pendant une semaine. Les dates exactes sont annoncées chaque année."
    - p: "Qu'est-ce que le foulage du raisin ?"
      r: "C'est un acte symbolique des vendanges au cours duquel on foule du raisin et où commence l'offrande du premier moût à la Vierge de Valvanera, patronne de La Rioja."
    - p: "Que peut-on faire d'autre ?"
      r: "Des concerts, des événements populaires, des dégustations et des visites de bodegas. Consulte le programme officiel."
    - p: "Où manger ?"
      r: "Dans la calle Laurel et aux alentours, il y a de nombreux bars à pinchos, l'un des grands attraits de Logroño."
    - p: "Peut-on visiter des bodegas ?"
      r: "Oui, beaucoup organisent des visites et des dégustations. Il vaut mieux réserver à l'avance, surtout à l'époque des vendanges."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Oui, il y a des activités familiales pendant les fêtes. Consulte le programme."
fiesta-marisco:
  texto:
    - "La Fiesta del Marisco de O Grove est l'un des grands rendez-vous gastronomiques de la Galice. Elle a lieu en octobre, pendant quelques jours, et réunit des milliers de visiteurs autour des fruits de mer des rías galiciennes, avec des stands, des dégustations et des spectacles."
    - "O Grove, dans la ría d'Arousa, est célèbre pour ses fruits de mer : huîtres, moules, palourdes, coques, pétoncles, coquilles Saint-Jacques ou araignée de mer, entre autres. Pendant la fête, producteurs et restaurants proposent leurs produits sur le site, et il y a aussi des activités culturelles et musicales."
    - "Consulte le programme officiel de la mairie pour les dates et les horaires. Arrive tôt, surtout le week-end, et viens en semaine si tu veux éviter la foule. Si tu es allergique aux fruits de mer ou si tu es enceinte, renseigne-toi avant sur ce que tu peux manger. Réserve ton hébergement à l'avance : la région se remplit."
  faq:
    - p: "Quand a lieu la Fiesta del Marisco de O Grove ?"
      r: "En octobre, pendant quelques jours. Les dates exactes sont annoncées chaque année."
    - p: "Quels fruits de mer peut-on goûter ?"
      r: "Huîtres, moules, palourdes, coques, pétoncles, coquilles Saint-Jacques ou araignée de mer, selon la saison et l'offre de chaque stand."
    - p: "Faut-il payer l'entrée ?"
      r: "Consulte le programme officiel de la mairie, qui détaille les conditions d'accès et les dégustations."
    - p: "Quel est le meilleur moment pour y aller ?"
      r: "En semaine et tôt, pour éviter la foule. Le week-end, il y a énormément de monde."
    - p: "Que faire d'autre à O Grove ?"
      r: "Visiter l'île de A Toxa, les plages de la péninsule et faire une balade en bateau sur la ría."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Oui, mais il vaut mieux venir tôt et éviter les heures de grande affluence."
maraton-malaga:
  texto:
    - "Le Marathon de Málaga est l'une des grandes épreuves d'athlétisme populaire d'Espagne, avec des distances de marathon et de semi-marathon qui parcourent la ville début décembre. Le climat doux de Málaga à cette période et un parcours rapide le long du front de mer le rendent très attractif pour les coureurs."
    - "La course réunit des milliers de participants de tous niveaux, des coureurs professionnels aux amateurs en quête de leur record personnel, et c'est aussi un plan pour les spectateurs, qui encouragent depuis la rue. Le parcours traverse des quartiers du centre et du littoral de la ville."
    - "Si tu veux courir, inscris-toi à l'avance sur le site officiel et consulte les conditions de participation. Si tu veux encourager, choisis un point du parcours sur le front de mer ou dans le centre et garde en tête qu'il y aura des coupures de circulation. Emporte des vêtements confortables, de l'eau et de la patience."
  faq:
    - p: "Quand a lieu le Marathon de Málaga ?"
      r: "Début décembre, normalement un dimanche. Les dates exactes sont annoncées chaque année."
    - p: "Quelles distances propose-t-on ?"
      r: "Marathon et semi-marathon. Consulte le site officiel pour savoir s'il y a d'autres épreuves."
    - p: "Comment s'inscrire ?"
      r: "Sur le site officiel de l'épreuve, à l'avance. Consulte les conditions de participation et les délais."
    - p: "Où voir la course ?"
      r: "Sur le parcours, surtout sur le front de mer et dans le centre. Consulte le plan officiel."
    - p: "Y a-t-il des coupures de circulation ?"
      r: "Oui. Consulte les coupures et les horaires sur le site officiel et auprès de la mairie."
    - p: "Quel temps fait-il en décembre à Málaga ?"
      r: "En général doux, même s'il peut y avoir de la pluie ou du vent. Prévois des vêtements à superposer."
magostos:
  texto:
    - "Le magosto est la grande fête de la châtaigne : un feu de joie, des châtaignes grillées, du vin nouveau et beaucoup de monde autour. Il se célèbre surtout en Galice, dans les Asturies (où il s'appelle amagüestu) et à El Bierzo, et son grand jour tombe autour de la Saint-Martin, le 11 novembre."
    - "Il y a des magostos en famille, de quartier, de village et d'associations, et de nombreuses mairies les organisent ouverts à tout le monde, parfois avec de la musique, de la danse et des jeux traditionnels. Dans d'autres zones de l'intérieur, comme le Valle del Jerte en Estrémadure, il existe une tradition similaire autour de la Toussaint, que l'on appelle calbotá."
    - "Pour en trouver un, consulte l'agenda de la mairie ou de l'association de voisins de la zone quelques jours avant : les dates changent chaque année et beaucoup sont annoncés au dernier moment. Prends des vêtements chauds, car on est en plein air, et n'attends rien de sophistiqué : tout le charme tient au feu de joie et aux châtaignes mangées bien chaudes, en bonne compagnie."
  mapa:
    titulo: "Où se célèbrent les magostos"
    centro: [41.8, -6.2]
    zoom: 6
    puntos:
      - { nombre: "Galice (Ourense et Lugo)", lat: 42.4, lon: -7.6, desc: "Berceau du magosto : on le célèbre dans les villages, les quartiers et les écoles, avec la grande date autour de la Saint-Martin." }
      - { nombre: "Asturies", lat: 43.3, lon: -5.8, desc: "Ici, on l'appelle amagüestu et on l'accompagne de cidre nouveau." }
      - { nombre: "El Bierzo (León)", lat: 42.55, lon: -6.6, desc: "Des magostos dans de nombreux villages de la comarque, en pleine châtaigneraie." }
      - { nombre: "Valle del Jerte (Cáceres)", lat: 40.2, lon: -5.8, desc: "Sa version est la calbotá, autour de la Toussaint." }
  faq:
    - p: "Qu'est-ce qu'un magosto ?"
      r: "C'est une fête traditionnelle d'automne où l'on fait griller des châtaignes sur un feu de joie et où on les mange avec du vin nouveau, du cidre ou du moût. Elle est typique de la Galice, des Asturies et d'El Bierzo, même s'il existe des célébrations similaires ailleurs."
    - p: "Quand a-t-il lieu ?"
      r: "Surtout en novembre, avec la Saint-Martin, le 11 novembre, comme date de référence. Beaucoup de villages le célèbrent le week-end le plus proche, et il y a aussi des magostos fin octobre."
    - p: "Où aller à un magosto ?"
      r: "En Galice, dans les Asturies et à El Bierzo, il y a des magostos dans énormément de villages et de quartiers. Le plus fiable est de consulter l'agenda de la mairie ou de la zone quelques jours avant."
    - p: "Faut-il payer ou réserver ?"
      r: "Cela dépend. Beaucoup de magostos populaires sont gratuits ou demandent une petite participation, et d'autres, organisés par des restaurants ou des caves, exigent une réservation. Renseigne-toi auprès de l'organisateur."
    - p: "Puis-je faire un magosto chez moi ?"
      r: "Oui. Fais une entaille dans la peau de chaque châtaigne, fais-les griller à la poêle ou au four et enveloppe-les dans un torchon quelques minutes avant de les éplucher. Accompagne-les de vin ou de cidre, si tu en as envie."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, l'ambiance est généralement très familiale. Il faut simplement surveiller le feu et s'assurer que les châtaignes sont tièdes avant de les manger."
piscinas-naturales:
  imagen_alt: "Vasque d'eau verte et transparente entre des rochers de granit avec une baigneuse dans une gorge de montagne"
  texto:
    - "Des vasques d'eau cristalline entre des rochers de granit, de petites cascades et des gorges fraîches en plein été : les piscines naturelles sont l'une des meilleures façons d'échapper à la chaleur sans aller sur la côte. C'est de l'eau de rivière ou de ruisseau de montagne, sans chlore ni maître-nageur, ce qui les rend aussi spéciales que fragiles."
    - "Les zones les plus connues se trouvent dans le nord de Cáceres et dans le Système central : La Vera, le Valle del Jerte (avec ses fameux Pilones), Las Hurdes et la sierra de Gredos, dans la province d'Ávila. Il y en a aussi énormément en Galice, dans les Asturies, en Cantabrie, en Castille-et-León, dans les Pyrénées et à la Sierra Nevada, et l'eau est souvent froide même en août."
    - "Entre dans l'eau doucement, surtout si tu as passé des heures au soleil, car le changement de température peut provoquer une hydrocution. Ne saute pas sans connaître le fond, fais attention aux rochers glissants et ne te baigne pas après de fortes pluies ni quand le débit est élevé. Dans les vasques, il n'y a pas de surveillance : va toujours accompagné et fais particulièrement attention aux enfants."
    - "Certaines vasques, en raison de leur fragilité ou de leur fréquentation, ont une capacité limitée, une réservation préalable ou des accès réglementés en été, et les week-ends d'août elles se remplissent vite. Consulte avant le site de la mairie ou de l'espace naturel et arrive tôt. Prends des chaussures qui accrochent dans l'eau, n'utilise ni savon ni crème dans la vasque et emporte tous tes déchets."
  faq:
    - p: "Où y a-t-il des piscines naturelles en Espagne ?"
      r: "Les zones les plus connues sont La Vera et le Valle del Jerte (Cáceres), Las Hurdes, la sierra de Gredos (Ávila) et le Système central, ainsi que de nombreuses vasques en Galice, dans les Asturies, en Cantabrie, dans les Pyrénées et à la Sierra Nevada."
    - p: "Quand aller dans une piscine naturelle ?"
      r: "De juin à septembre, juillet et août étant les mois les plus fréquentés. Si tu veux de la tranquillité, va-y en semaine et arrive tôt. Dans celles qui dépendent de la fonte des neiges ou de la pluie, le débit baisse en fin d'été."
    - p: "Faut-il réserver ou payer ?"
      r: "Elles sont presque toujours gratuites, mais certaines ont une capacité limitée, un accès réglementé ou un parking payant en haute saison. Consulte le site de la mairie ou de l'espace naturel avant d'y aller."
    - p: "Y a-t-il des maîtres-nageurs ?"
      r: "Pas dans la plupart des vasques et des gorges, qui sont de l'eau de rivière sans surveillance. Va accompagné, ne laisse pas les enfants sans surveillance et évite de te baigner par mauvais temps ou si le débit a augmenté."
    - p: "Que faut-il emporter ?"
      r: "Des chaussures qui accrochent dans l'eau (sandales de rivière ou chaussons aquatiques), une serviette, de l'eau, quelque chose à manger, de la crème solaire et un sac pour tes déchets. N'utilise ni savon ni crème dans la vasque."
    - p: "Peut-on y aller avec des enfants ou un chien ?"
      r: "Avec des enfants, mieux vaut choisir des vasques peu profondes et faciles d'accès, et toujours avec un adulte dans l'eau. Avec un chien, cela dépend de l'espace : dans certains, c'est interdit ou il doit être tenu en laisse, alors vérifie la réglementation locale."
almendros:
  texto:
    - "Les amandiers sont les premiers arbres à fleurir en Espagne. À la fin de l'hiver, quand il fait encore froid, les versants se couvrent de fleurs blanches et roses, et l'on peut s'y promener sous une lumière particulièrement belle."
    - "La floraison va généralement de fin janvier à mars, selon la zone et l'année, et le pic arrive plus tôt dans le sud et sur les îles. Majorque, l'Axarquía de Málaga, Tenerife et la zone de Carthagène sont des destinations connues, et à plusieurs endroits il y a des sentiers balisés et des fêtes dédiées, comme celle de l'amandier en fleur à Tenerife."
    - "Comme les fleurs durent peu et dépendent du temps, il vaut mieux vérifier l'état de la floraison quelques jours avant. Les amandiers sont des cultures qui ont un propriétaire : promène-toi sur les chemins publics, ne coupe pas de branches, ne cueille pas de fleurs et n'entre pas dans les propriétés closes. Si tu es allergique au pollen, prends tes médicaments, car il y en a beaucoup à cette époque."
  mapa:
    titulo: "Où voir les amandiers en fleur"
    centro: [37.5, -6.0]
    zoom: 5
    puntos:
      - { nombre: "Majorque", lat: 39.65, lon: 2.95, desc: "Le Pla de Mallorca et les versants de l'intérieur se couvrent d'amandiers blancs et roses." }
      - { nombre: "L'Axarquía (Málaga)", lat: 36.85, lon: -4.3, desc: "Comarque de Málaga avec des amandiers en fleur dès fin janvier." }
      - { nombre: "Campo de Cartagena (Murcie)", lat: 37.65, lon: -1.0, desc: "Floraison précoce dans le campo de Cartagena, avec des sentiers entre les amandiers." }
      - { nombre: "Tenerife", lat: 28.3, lon: -16.8, desc: "Des amandiers en fleur dans l'ouest de l'île, avec la fête de l'amandier en fleur." }
  faq:
    - p: "Quand les amandiers fleurissent-ils ?"
      r: "Entre fin janvier et mars, selon la zone et l'année. Dans le sud, aux Baléares et aux Canaries, elle est souvent plus précoce."
    - p: "Où voir des amandiers en fleur ?"
      r: "Majorque, l'Axarquía (Málaga), Tenerife, la zone de Carthagène et d'autres zones de culture du sud et de l'est de la péninsule sont des destinations habituelles."
    - p: "Peut-on cueillir des fleurs ou des amandes ?"
      r: "Non. Ce sont des cultures privées, même si cela ressemble à de la campagne ouverte. Profite-en depuis les chemins et respecte les propriétés."
    - p: "Combien de temps dure la floraison ?"
      r: "Très peu, entre une et deux semaines par zone, et elle peut être écourtée par le vent ou la pluie. Vérifie l'état de la floraison avant de voyager."
    - p: "Que faut-il emporter ?"
      r: "Des chaussures de balade, des vêtements chauds en plusieurs couches, un appareil photo et, si tu es allergique, des antihistaminiques. C'est un bon plan pour faire des photos à l'aube ou au coucher du soleil."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, les petites balades entre les amandiers conviennent aux familles, et c'est un bon moment pour leur montrer comment les cultures changent au fil des saisons."
lavanda-brihuega:
  texto:
    - "Début juillet, les champs de lavande de Brihuega, dans la province de Guadalajara, se teintent de violet. C'est l'un des paysages d'été les plus photogéniques d'Espagne et, contrairement à la Provence française, on y arrive en deux heures depuis Madrid."
    - "La floraison va généralement de fin juin à la mi-juillet, avec un pic durant la première quinzaine de juillet, même si cela dépend de l'année. Pendant ces semaines se tient le Festival de la Lavande, avec des activités, un marché et de la musique à Brihuega, et c'est le moment de plus forte affluence."
    - "Pour en profiter sans stress, va-y tôt le matin ou au coucher du soleil, quand la chaleur est moindre et la lumière plus belle. Les champs de lavande sont des cultures qui ont un propriétaire : respecte les limites et les zones aménagées pour les photos et la promenade, qui sont parfois payantes. Prends un chapeau, de la crème solaire et de l'eau, et sache qu'il y a beaucoup d'abeilles."
  mapa:
    titulo: "Où se trouvent les champs de lavande"
    centro: [40.76, -2.87]
    zoom: 11
    puntos:
      - { nombre: "Brihuega (Guadalajara)", lat: 40.7625, lon: -2.8728, desc: "Les champs de lavande entourent la localité ; le Festival de la Lavande s'y tient pendant la floraison." }
  faq:
    - p: "Quand la lavande fleurit-elle à Brihuega ?"
      r: "De fin juin à la mi-juillet, avec un maximum durant la première quinzaine de juillet. Cela varie chaque année selon le climat."
    - p: "Où sont les champs de lavande ?"
      r: "Aux alentours de Brihuega (Guadalajara), avec des accès balisés depuis le village. Il y a des zones de promenade et des belvédères."
    - p: "Quelle est la meilleure heure pour y aller ?"
      r: "Tôt le matin ou au coucher du soleil, quand il fait moins chaud, qu'il y a moins de monde et que la lumière est plus belle."
    - p: "Faut-il payer ?"
      r: "Certaines zones aménagées pour la promenade et les photos demandent une petite entrée. Renseigne-toi sur les conditions avant d'y aller, et n'entre pas dans des champs non autorisés."
    - p: "Que faut-il emporter ?"
      r: "Un chapeau, de la crème solaire, de l'eau et des chaussures confortables. Il y a beaucoup d'abeilles, il vaut donc mieux ne pas les déranger."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, mais avec la chaleur et les abeilles : surveille les plus petits, évite les heures du milieu de journée et emporte de l'eau."
halloween-difuntos:
  texto:
    - "Le 31 octobre et le 1er novembre, deux traditions très différentes coexistent en Espagne : Halloween, avec ses déguisements, ses parcours de l'horreur et ses fêtes pour enfants, et la Toussaint, un jour de souvenir des défunts, avec des visites au cimetière et des douceurs propres à cette date."
    - "Halloween prend de plus en plus de place, surtout chez les jeunes et les enfants, avec des fêtes à thème, des maisons hantées et des parcs d'attractions décorés. Le 1er novembre, en revanche, est un jour férié et traditionnel : on visite les cimetières avec des fleurs, on mange des huesos de santo et des buñuelos de viento et, en Catalogne, des panellets et des châtaignes lors de la castañada."
    - "Dans de nombreux théâtres, on joue ces jours-ci Don Juan Tenorio, de Zorrilla, une tradition des 1er et 2 novembre. Consulte l'affiche des spectacles et les programmes de la mairie, et si tu y vas avec des enfants, choisis des fêtes adaptées et célèbre aussi la partie traditionnelle."
  faq:
    - p: "Que célèbre-t-on le 1er novembre ?"
      r: "La Toussaint, jour férié dans toute l'Espagne, où l'on se souvient des défunts et où l'on visite les cimetières avec des fleurs."
    - p: "Quelles douceurs mange-t-on ?"
      r: "Des huesos de santo, des buñuelos de viento et, en Catalogne, des panellets et des châtaignes lors de la castañada."
    - p: "Qu'est-ce que la castañada ?"
      r: "Une fête traditionnelle catalane de la Toussaint où l'on mange des châtaignes, des panellets et des patates douces."
    - p: "Que faire à Halloween ?"
      r: "Des fêtes costumées, des parcours de l'horreur, des maisons hantées et des circuits mystère. De nombreux parcs d'attractions et mairies organisent des activités."
    - p: "Qu'est-ce que Don Juan Tenorio ?"
      r: "Une pièce de théâtre de José Zorrilla que l'on joue traditionnellement à cette période dans de nombreux théâtres."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, il y a beaucoup d'activités pour enfants à Halloween. Si tu vas dans un cimetière, il vaut mieux leur expliquer le sens paisible de la visite."
playas-fluviales:
  texto:
    - "Une plage fluviale est une zone de baignade aménagée sur une rivière, un lac de barrage ou un lac, avec du sable ou de l'herbe, des accès signalisés et, souvent, des services comme un parking, une buvette, des toilettes ou un maître-nageur. C'est une façon très pratique de passer la journée dans l'eau sans aller sur la côte, idéale pour les familles et pour ceux qui vivent à l'intérieur des terres."
    - "On en trouve dans presque toutes les communautés : l'Estrémadure, la Castille-et-León, la Castille-La Manche, la Galice, l'Aragon, Madrid ou les Asturies ont des zones de baignade très populaires, et le réservoir de San Juan, à Madrid, est un classique. La saison va de juin à septembre, avec juillet et août comme période de plus forte affluence."
    - "Même si elles ressemblent à une plage, il s'agit toujours d'eau douce, avec des courants, des fonds irréguliers et, dans les réservoirs, des niveaux qui changent. Baigne-toi uniquement dans la zone signalisée, ne t'éloigne pas du bord avec des enfants et respecte les drapeaux et les avis. En été, il peut y avoir des fermetures ponctuelles pour cause de qualité de l'eau, par exemple à cause de la prolifération d'algues, alors mieux vaut vérifier."
    - "Avant de partir, consulte le site de la mairie et les informations sanitaires sur les zones de baignade, publiées dans le système Náyade du ministère de la Santé. Emporte un parasol, des chaussures d'eau car le fond est souvent fait de pierres ou de vase, de l'eau et de la crème solaire, et arrive tôt le week-end : les plus connues se remplissent."
  faq:
    - p: "Qu'est-ce qu'une plage fluviale ?"
      r: "C'est une zone de baignade signalisée sur une rivière, un lac de barrage ou un lac, avec du sable ou de l'herbe et, souvent, des services comme un parking, une buvette, des toilettes et un maître-nageur. C'est de l'eau douce, pas de l'eau salée."
    - p: "Quand aller à une plage fluviale ?"
      r: "De juin à septembre. En juillet et en août, il y a plus d'ambiance et aussi plus de monde ; si tu veux de la tranquillité, vas-y en semaine ou à la première heure."
    - p: "Comment savoir si l'eau est sûre pour se baigner ?"
      r: "La qualité de l'eau des zones de baignade officielles est publiée dans le système Náyade du ministère de la Santé, et il y a généralement des panneaux sur la plage elle-même. En été, il peut y avoir des fermetures ponctuelles, par exemple à cause des algues, alors mieux vaut vérifier avant."
    - p: "Y a-t-il des maîtres-nageurs ?"
      r: "Dans beaucoup de plages oui, en haute saison, mais pas dans toutes. S'il n'y en a pas, redouble de prudence avec les enfants, baigne-toi uniquement dans la zone signalisée et ne t'éloigne pas du bord."
    - p: "Que faut-il emporter ?"
      r: "Un parasol, de la crème solaire, de l'eau, des chaussures d'eau (le fond est souvent fait de pierres ou de vase) et un sac pour tes déchets. Beaucoup ont une buvette, mais pas toujours."
    - p: "Peut-on y aller avec des enfants ou avec un chien ?"
      r: "Avec des enfants, c'est un plan très pratique, mais toujours sous surveillance dans l'eau. Avec un chien, cela dépend de la plage : certaines l'interdisent ou ont une zone précise, alors consulte la réglementation locale."
verbenas:
  texto:
    - "Entre juillet et septembre, presque chaque village d'Espagne célèbre ses fêtes patronales. Ce sont des semaines de verbenas avec orchestre, de peñas, de processions, de concerts, de repas populaires et d'animations pour les plus petits, et un plan très bon marché pour découvrir la vie d'un village de l'intérieur."
    - "Août concentre la plupart des fêtes, surtout autour du 15, jour de l'Assomption, même s'il y en a pratiquement à toutes les dates de l'été. Chaque communauté a son style : en Castille-et-León et en Castille-La Manche, les peñas et les fêtes taurines populaires sont courantes, en Galice les romerías, et dans le nord les concours et la musique traditionnelle."
    - "Le plus utile avant d'y aller est de consulter le programme sur le site de la mairie ou sur ses réseaux. Normalement, les verbenas commencent tard, souvent après minuit, et sont généralement en entrée libre. Si tu viens de loin, pense au stationnement et au transport pour le retour, et respecte le repos des habitants."
  faq:
    - p: "Quand ont lieu les fêtes des villages ?"
      r: "Surtout de juillet à septembre, avec août comme mois le plus fort. Chaque village a sa date, normalement liée à son saint patron, et les programmes sont généralement publiés quelques semaines avant."
    - p: "Comment trouver les fêtes d'un village ?"
      r: "Le plus fiable est le site ou les réseaux de la mairie, où le programme complet est publié. Tu peux aussi consulter l'agenda de sinplanes par province."
    - p: "Les verbenas sont-elles gratuites ?"
      r: "Presque toujours oui : l'entrée aux verbenas et à la plupart des événements populaires est libre. Certains repas populaires ou spectacles précis peuvent nécessiter un ticket."
    - p: "À quelle heure commencent-elles ?"
      r: "Les verbenas avec orchestre commencent généralement tard et se prolongent jusqu'au petit matin. Les animations pour enfants, les processions et les repas populaires sont programmés en journée."
    - p: "Qu'est-ce qu'il vaut mieux emporter ?"
      r: "Des vêtements confortables, de quoi te couvrir pour la nuit, des chaussures qui tiennent le coup si tu vas danser ou dans les peñas, et des espèces, car certains bars et stands n'acceptent pas la carte."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, la plupart des fêtes proposent des activités pour enfants pendant la journée. La nuit, l'ambiance est plutôt adulte, et il faut tenir compte du bruit et de l'heure."
matanza:
  texto:
    - "La matanza est une tradition rurale très enracinée en Castille-et-León, en Estrémadure et dans d'autres régions d'Espagne : la préparation artisanale de chorizos, de boudins, de jambons et d'autres charcuteries en hiver. Aujourd'hui, beaucoup de villages la célèbrent comme une fête gastronomique, avec des démonstrations, des dégustations et un repas populaire."
    - "Elle se célèbre normalement entre décembre et février, quand il fait le froid nécessaire pour affiner les charcuteries. Pendant ces journées, on peut goûter des produits typiques comme le chorizo, le boudin, le farinato, les patatas meneás, les jijas ou les soupes à l'ail, et voir de près comment se faisait ce travail familial et de voisinage."
    - "Pour y aller, consulte le programme de la mairie ou de l'association organisatrice : beaucoup de journées sont gratuites et d'autres demandent de réserver une place ou d'acheter un ticket de dégustation. Certaines démonstrations comprennent des scènes qui peuvent être dures pour les personnes sensibles ou pour les enfants, alors mieux vaut se renseigner avant d'y assister."
  mapa:
    titulo: "Où aller à une fête de la matanza"
    centro: [40.2, -5.8]
    zoom: 7
    puntos:
      - { nombre: "Guijuelo et sierra de Béjar (Salamanque)", lat: 40.56, lon: -5.67, desc: "Terre de charcuteries et de jambon ibérique, avec des journées de matanza dans les villages de la région en hiver." }
      - { nombre: "Zamora (Sayago et Aliste)", lat: 41.5, lon: -6.2, desc: "Régions de Zamora où la matanza artisanale se maintient et se célèbre lors de fêtes locales." }
      - { nombre: "Montánchez (Cáceres)", lat: 39.21, lon: -6.15, desc: "Sierra d'Estrémadure de jambons et de chorizos, avec des journées de matanza traditionnelle en hiver." }
  faq:
    - p: "Qu'est-ce que la matanza ?"
      r: "C'est la préparation traditionnelle de charcuteries et d'autres produits du porc en hiver. C'était un travail familial et de voisinage, et aujourd'hui on le retrouve lors de fêtes avec démonstrations et dégustations."
    - p: "Quand a-t-elle lieu ?"
      r: "Normalement de décembre à février, même si les dates changent d'un village à l'autre. Consulte le programme de chaque localité."
    - p: "Où y a-t-il des fêtes de la matanza ?"
      r: "Surtout en Castille-et-León et en Estrémadure, et aussi dans d'autres zones rurales. Cherche dans l'agenda de la mairie ou dans celui de sinplanes par province."
    - p: "Que peut-on goûter ?"
      r: "Du chorizo, du boudin, du farinato, des patatas meneás, des jijas, des soupes à l'ail et des produits du porc, selon la région. Beaucoup de journées comprennent un menu de dégustation."
    - p: "Est-ce gratuit ?"
      r: "Cela dépend. Certaines journées sont gratuites et d'autres demandent d'acheter un ticket ou de réserver une place pour les dégustations."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Parfois. Certaines démonstrations peuvent être dures pour les plus petits, alors mieux vaut demander avant ce qu'elles comprennent. Beaucoup de fêtes proposent aussi des activités pour enfants."
flores-primavera:
  texto:
    - "En avril et en mai, les champs, les dehesas et les versants de moyenne montagne se couvrent de fleurs. Coquelicots, cistes, marguerites, narcisses et autres espèces colorent des paysages qui, pendant quelques semaines, semblent tout autres. C'est un plan simple, bon marché et très photogénique."
    - "Le meilleur moment dépend de la zone, de l'altitude et de la quantité de pluie tombée en hiver : un bon printemps donne des champs particulièrement spectaculaires. Dans la dehesa d'Estrémadure et d'Andalousie, dans les campagnes de Castille et dans les prairies de montagne, il y a des itinéraires faciles pour en profiter. En altitude, la floraison est retardée jusqu'en mai et juin."
    - "Choisis des sentiers balisés, et plutôt en semaine. Ne cueille pas les fleurs, ne piétine pas les cultures et ne quitte pas les chemins : beaucoup de champs sont des semis ou des pâturages. Si tu es allergique au pollen, emporte tes médicaments, et inspecte tes vêtements au retour, car au printemps il y a des tiques dans certains terrains."
  mapa:
    titulo: "Où voir des champs de fleurs"
    centro: [40.0, -4.5]
    zoom: 6
    puntos:
      - { nombre: "Dehesa d'Estrémadure (Cáceres)", lat: 39.3, lon: -6.9, desc: "Dehesas de chênes verts et de chênes-lièges avec des prairies fleuries, du côté de la Sierra de San Pedro et de Monfragüe." }
      - { nombre: "Dehesa d'Andalousie (Séville)", lat: 37.95, lon: -5.8, desc: "Sierra Norte de Séville, avec des dehesas, des cistaies et des itinéraires faciles." }
      - { nombre: "Campagnes de Castille (Palencia)", lat: 42.1, lon: -4.8, desc: "Tierra de Campos et les paramos castillans, avec des coquelicots parmi les cultures." }
      - { nombre: "Prairies de montagne (Picos de Europa)", lat: 43.2, lon: -4.85, desc: "Prairies avec des narcisses et d'autres fleurs, avec une floraison plus tardive, jusqu'en mai et juin." }
  faq:
    - p: "Quelle est la meilleure période pour voir des fleurs ?"
      r: "Entre avril et mai dans la majeure partie de l'Espagne. En montagne, elle est décalée à juin, et dans le sud et sur les îles, elle peut commencer en mars."
    - p: "Où voir des champs de fleurs ?"
      r: "Les dehesas d'Estrémadure et d'Andalousie, les campagnes de Castille, les prairies de montagne et les parcs naturels sont de bons endroits. Cherche des itinéraires balisés."
    - p: "Peut-on cueillir des fleurs ?"
      r: "Mieux vaut ne pas le faire. Beaucoup sont protégées et, dans les champs cultivés, tu abîmes les semis. Profites-en et prends des photos."
    - p: "Que faut-il emporter ?"
      r: "Des chaussures confortables, des vêtements en couches, un chapeau, de la crème solaire, de l'eau et, si tu es allergique, des médicaments. Inspecte tes vêtements au retour au cas où il y aurait des tiques."
    - p: "Y a-t-il un risque d'allergie ?"
      r: "Oui, au printemps le pollen est intense. Si tu es allergique, consulte ton médecin et évite les heures du milieu de la journée et les jours de vent."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, avec des itinéraires courts et plats. Apprends-leur à ne pas cueillir de fleurs ni à entrer dans les champs cultivés."
museos-gratis:
  texto:
    - "Beaucoup de musées d'Espagne ont des horaires ou des jours d'entrée gratuite, et en profiter est l'une des meilleures façons de faire une sortie culturelle sans dépenser. Avec un peu d'organisation, tu peux découvrir des collections de premier plan presque sans frais."
    - "Les musées d'État sont généralement gratuits le samedi après-midi et le dimanche, et certains ont des horaires gratuits en semaine. Les grands musées nationaux ont leurs propres horaires et conditions. De plus, il y a des dates spéciales comme la Journée internationale des musées, le 18 mai, ou la Nuit des musées, avec entrée gratuite ou activités spéciales."
    - "Les horaires et les conditions changent, alors consulte toujours le site de chaque musée avant d'y aller. Dans beaucoup de cas, il faut retirer un billet gratuit, et les créneaux de gratuité sont les plus fréquentés, alors arrive tôt ou arme-toi de patience pour les files d'attente. Les mineurs, les étudiants, les retraités et d'autres catégories ont presque toujours l'entrée gratuite ou à tarif réduit."
  faq:
    - p: "Quand l'entrée d'un musée est-elle gratuite ?"
      r: "Cela dépend de chaque musée. Les musées d'État sont généralement gratuits le samedi après-midi et le dimanche, et beaucoup ont des horaires gratuits en semaine. Consulte toujours leur site."
    - p: "Qu'est-ce que la Journée internationale des musées ?"
      r: "Elle a lieu le 18 mai et beaucoup de musées ouvrent gratuitement ou avec des activités spéciales. C'est une bonne occasion de visiter des collections."
    - p: "Faut-il réserver son billet ?"
      r: "Parfois oui. Pendant les horaires gratuits, beaucoup de musées demandent de retirer ou de réserver un billet gratuit, et il y a de la queue."
    - p: "Qui a toujours l'entrée gratuite ?"
      r: "Dans beaucoup de musées, les moins de 18 ans, certains étudiants et retraités, les personnes au chômage ou en situation de handicap et d'autres catégories. Consulte les conditions de chaque musée."
    - p: "Comment éviter les files d'attente ?"
      r: "Va-y en semaine, au début du créneau gratuit, et réserve si c'est possible. Le week-end, c'est très fréquenté."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, beaucoup de musées proposent des visites et des ateliers en famille, et l'entrée pour les mineurs est généralement gratuite."
belenes:
  texto:
    - "La crèche de Noël est l'une des traditions les plus aimées de la période des fêtes : figurines, paysages et scènes qui représentent la naissance de Jésus, parfois avec des installations immenses et très détaillées. Aller voir des crèches est un plan tranquille, à faire en famille, que l'on peut combiner avec une balade dans le centre-ville."
    - "En décembre et jusqu'à l'Épiphanie, les mairies, les églises, les musées, les associations de crèches et d'autres organismes ouvrent des expositions de crèches, souvent gratuites. Certaines sont particulièrement célèbres, comme la crèche du Museo Salzillo à Murcie, la crèche de la place Sant Jaume à Barcelone ou le Belén de Tirisiti d'Alcoy."
    - "Outre les crèches exposées, de nombreux villages organisent des crèches vivantes, où les habitants jouent des scènes et des métiers de l'époque. Elles ont lieu surtout en décembre et début janvier. Renseigne-toi sur les dates et les horaires auprès de la mairie, car elles sont souvent ponctuelles, et couvre-toi bien si elles se déroulent en plein air."
  faq:
    - p: "Quand peut-on voir des crèches ?"
      r: "Du début décembre jusqu'à l'Épiphanie, même si certaines restent en place jusqu'en février. Les crèches vivantes se concentrent en décembre et début janvier."
    - p: "Où voir des crèches ?"
      r: "Dans les mairies, les églises, les musées et les associations de crèches. Beaucoup de villes ont une crèche municipale sur une place du centre."
    - p: "Qu'est-ce qu'une crèche vivante ?"
      r: "C'est une représentation de la Nativité où des habitants jouent des scènes et des métiers. Elle a généralement lieu en plein air, à une date précise, et elle est très populaire dans les villages."
    - p: "Faut-il payer ?"
      r: "La plupart des expositions de crèches sont gratuites. Certaines crèches de musée ou de grand format peuvent demander un droit d'entrée."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, c'est l'un des plus appréciés. Ils adorent chercher les figurines et les détails, et certaines crèches ont du mouvement et du son."
    - p: "Combien de temps faut-il compter ?"
      r: "Une visite de crèche dure en général entre 20 minutes et une heure. Elle se combine bien avec un marché de Noël ou une balade pour voir les illuminations."
semana-santa-valladolid:
  texto:
    - "La Semaine sainte de Valladolid est sobre et intense, et se distingue par ses sculptures en bois polychrome, œuvres de grands sculpteurs castillans comme Gregorio Fernández et Juan de Juni. Elle est déclarée Fête d'intérêt touristique international et attire des visiteurs de toute l'Espagne."
    - "Les pasos parcourent les rues du centre avec leurs confréries, des fanfares et beaucoup de silence. Le Vendredi saint concentre deux rendez-vous très attendus : le Sermon des Sept Paroles sur la Plaza Mayor et la Procession générale de la Sainte Passion, où défilent les principaux pasos de la ville."
    - "Si tu veux aller plus loin, le Museo Nacional de Escultura, à Valladolid, conserve des œuvres des mêmes sculpteurs et constitue un bon complément. Consulte le programme officiel, arrive tôt pour trouver une bonne place et couvre-toi bien, car en Castille les soirées d'avril sont fraîches."
  faq:
    - p: "Quand a lieu la Semaine sainte de Valladolid ?"
      r: "Du dimanche des Rameaux au dimanche de Pâques, qui tombe entre mars et avril selon l'année."
    - p: "Qu'est-ce qui la rend spéciale ?"
      r: "Les sculptures castillanes en bois polychrome, avec des pasos d'une grande valeur artistique, et une ambiance sobre et silencieuse."
    - p: "Quelle procession ne faut-il pas manquer ?"
      r: "La Procession générale de la Sainte Passion, le Vendredi saint en fin de journée, qui réunit les principaux pasos. Le Sermon des Sept Paroles, le même jour sur la Plaza Mayor, est lui aussi très populaire."
    - p: "Où voir les pasos en dehors de la Semaine sainte ?"
      r: "Au Museo Nacional de Escultura de Valladolid, qui expose des œuvres de Gregorio Fernández et de Juan de Juni."
    - p: "Quels vêtements emporter ?"
      r: "Des vêtements chauds : à Valladolid, les fins de journée et les soirées de mars et d'avril sont fraîches, et on passe beaucoup de temps dans la rue."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Avec précaution : il y a beaucoup de monde et de longues attentes. Choisis des processions de l'après-midi et un endroit où il y a de la place."
semana-santa-salamanca:
  texto:
    - "La Semaine sainte de Salamanque se vit entre pierre dorée, avec des processions qui parcourent les rues et les places d'une ville classée au patrimoine mondial. Les confréries et les hermandades sortent des pasos d'une grande valeur artistique dans une ambiance recueillie et solennelle."
    - "De nombreuses processions passent par la Plaza Mayor et aux abords de la cathédrale, un décor difficile à égaler. L'un des rendez-vous les plus émouvants est la procession du Cristo Yacente, et chaque confrérie a son style et son parcours."
    - "L'affiche de la Semaine sainte 2027 met à l'honneur la Piedad de la confrérie dominicaine, Notre-Dame des Douleurs, une sculpture de Salvador Carmona. C'est la photographie « El brillo del dolor » (« L'éclat de la douleur »), de Pablo Julián Mateos, premier prix du XLIIe concours de photographie « Semana Santa Salmantina-Memorial Lorenzo Rodríguez Durán », qui montre le retour du pas à l'église du couvent de San Esteban. Le deuxième prix est allé à « Tres cruces » (« Trois croix »), de David Gómez Rollán, qui fera la couverture de la revue Christus. La fête est déclarée d'intérêt touristique international."
    - "Consulte le programme officiel des confréries avec les horaires et les itinéraires. Si tu comptes voir des processions le soir, couvre-toi bien : à Salamanque, les nuits d'avril sont froides. Réserve ton hébergement à l'avance, car la ville se remplit de visiteurs, et respecte le silence des cortèges."
  faq:
    - p: "Quand a lieu la Semaine sainte de Salamanque ?"
      r: "Du dimanche des Rameaux au dimanche de Pâques, entre mars et avril selon l'année."
    - p: "Où voir les processions ?"
      r: "Sur la Plaza Mayor et dans les rues du centre historique, surtout près de la cathédrale. Chaque confrérie a son itinéraire."
    - p: "Quelle procession est la plus émouvante ?"
      r: "Celle du Cristo Yacente est l'une des plus marquantes, dans une ambiance très sobre. Consulte le programme pour connaître le jour et l'heure exacts."
    - p: "Quelle image annonce la Semaine sainte de Salamanque 2027 ?"
      r: "La Piedad de la confrérie dominicaine (Notre-Dame des Douleurs), dans la photographie « El brillo del dolor » de Pablo Julián Mateos, lauréate du concours de photographie et affiche de 2027."
    - p: "Est-ce gratuit ?"
      r: "Oui, voir les processions depuis la rue est gratuit."
    - p: "Quels vêtements emporter ?"
      r: "Des vêtements chauds, car les nuits sont froides à Salamanque, et des chaussures confortables."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, avec précaution : il y a beaucoup de monde et de longues attentes."
semana-santa-caceres:
  texto:
    - "La Semaine sainte de Cáceres se déroule dans la ville monumentale, classée au patrimoine mondial, et le décor donne à chaque procession un charme particulier. Les pasos parcourent des places médiévales, des ruelles et des palais, entre murs de pierre et lanternes."
    - "Les confréries sortent de leurs églises de la vieille ville et d'autres quartiers, avec des processions sobres et très recueillies. Cette combinaison de patrimoine et de tradition fait de Cáceres une bonne destination pour ceux qui veulent vivre une Semaine sainte moins fréquentée que celles des grandes capitales."
    - "Consulte le programme officiel des confréries avec les horaires et les itinéraires, et réserve ton hébergement à l'avance. Promène-toi dans le centre ancien avec des chaussures confortables, car les rues sont pavées, et respecte le silence des processions."
  faq:
    - p: "Quand a lieu la Semaine sainte de Cáceres ?"
      r: "Du dimanche des Rameaux au dimanche de Pâques, entre mars et avril selon l'année."
    - p: "Où voir les processions ?"
      r: "Dans la ville monumentale, avec ses places et ses ruelles, et dans d'autres quartiers. Chaque confrérie a son itinéraire."
    - p: "Qu'est-ce qui la rend différente ?"
      r: "Le cadre monumental en pierre et une ambiance recueillie, avec moins de foule que dans les grandes capitales."
    - p: "Est-ce gratuit ?"
      r: "Oui, voir les processions depuis la rue est gratuit."
    - p: "Quelles chaussures emporter ?"
      r: "Des chaussures confortables, à bonne semelle : les rues du centre ancien sont pavées et il y a des pentes."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, avec précaution à cause des attentes et de la foule."
semana-santa-marinera-valencia:
  texto:
    - "La Semaine sainte marinera de Valence se déroule dans les quartiers de pêcheurs du Cabanyal, du Canyamelar et du Grau, au bord de la mer. Elle est déclarée Fête d'intérêt touristique international et possède un caractère très particulier, lié à la vie des pêcheurs et à la Méditerranée."
    - "Elle commence le Vendredi de la Douleur et se prolonge jusqu'au dimanche de Pâques, avec des processions qui parcourent les rues de ces quartiers, avec leurs fanfares, leurs confréries et leur ambiance populaire. La clôture a lieu avec la Procession de la Résurrection, le dimanche de Pâques, plus festive et pleine de couleurs."
    - "Consulte le programme officiel, avec les horaires et les itinéraires des processions, et combine la visite avec une promenade sur la plage et une paella face à la mer. Arrive en avance et évite la voiture, car certaines rues sont fermées à la circulation."
  faq:
    - p: "Quand a lieu la Semaine sainte marinera ?"
      r: "Du Vendredi de la Douleur au dimanche de Pâques, entre mars et avril selon l'année."
    - p: "Où a-t-elle lieu ?"
      r: "Dans les quartiers de pêcheurs de Valence : le Cabanyal, le Canyamelar et le Grau."
    - p: "Qu'est-ce qui la rend différente ?"
      r: "Son caractère marin et populaire, avec des processions au bord de la mer et une Résurrection finale festive."
    - p: "Comment s'y rendre ?"
      r: "En métro, en tramway ou en bus. Les rues proches sont fermées à la circulation pendant les processions."
    - p: "Est-ce gratuit ?"
      r: "Oui, voir les processions depuis la rue est gratuit."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, la Résurrection du dimanche est particulièrement festive et adaptée aux familles."
super-bowl:
  texto:
    - "Le Super Bowl est la finale de la NFL, la ligue de football américain, et l'un des événements sportifs les plus regardés au monde. Il a lieu le deuxième dimanche de février et, à cause du décalage horaire, il est diffusé en Espagne en pleine nuit, du dimanche au lundi."
    - "Outre le match, le Super Bowl est un vrai spectacle : la mi-temps avec un concert de grands artistes, les publicités les plus attendues et toute une tradition culinaire, avec les ailes de poulet, les nachos et les hamburgers. En Espagne, de nombreux bars sportifs et restaurants ouvrent pour le retransmettre, parfois avec des menus à thème."
    - "Si tu comptes le regarder en direct, prépare-toi à une longue nuit : le match se termine très tard dans la nuit et le lendemain, il y a du travail. Une alternative consiste à regarder les meilleurs moments le jour suivant. Consulte la programmation de la chaîne qui le diffuse et les dates de l'année."
  faq:
    - p: "Quand a lieu le Super Bowl ?"
      r: "Le deuxième dimanche de février. En Espagne, il est diffusé en pleine nuit, donc déjà le lundi."
    - p: "À quelle heure commence-t-il ?"
      r: "À l'heure de la côte est des États-Unis, ce qui correspond en Espagne à la nuit bien avancée. Le match dure environ trois heures et demie, mi-temps comprise."
    - p: "Où le regarder ?"
      r: "Chez soi ou dans des bars sportifs qui le retransmettent. Certains restaurants préparent des menus à thème."
    - p: "Que mange-t-on ?"
      r: "Traditionnellement, des ailes de poulet, des nachos, des hamburgers et de la bière, même si chaque établissement a sa propre carte."
    - p: "Faut-il s'y connaître en football américain ?"
      r: "Non. Beaucoup de spectateurs le regardent pour le spectacle de la mi-temps et les publicités."
    - p: "Est-ce un bon plan entre amis ?"
      r: "Oui, à la maison ou dans un bar. Mais attention, la nuit est longue."
goya:
  texto:
    - "La cérémonie des Premios Goya est la grande soirée du cinéma espagnol. L'Académie des arts et des sciences cinématographiques d'Espagne remet ses prix aux meilleurs films, réalisateurs, acteurs, scénaristes et techniciens de l'année, lors d'une cérémonie qui a lieu en février et qui est retransmise en direct."
    - "La cérémonie devient un véritable événement mondain : tapis rouge, robes, discours, numéros musicaux et humour. Les nommés sont annoncés plusieurs semaines à l'avance, et c'est le bon moment pour voir les films en compétition, qui sont souvent reprogrammés en salles ou mis en ligne sur les plateformes."
    - "Pour profiter de la cérémonie, consulte la programmation de la chaîne qui la diffuse et prévois du pop-corn. Certains cinémas et salles organisent des séances spéciales et des retransmissions sur grand écran. Si tu veux pimenter la soirée, fais un concours de pronostics entre amis pour deviner les gagnants."
  faq:
    - p: "Quand a lieu la cérémonie des Goya ?"
      r: "Normalement, un samedi de février. La date exacte et le lieu changent chaque année."
    - p: "Où est-elle diffusée ?"
      r: "En direct à la télévision et sur internet. Consulte la programmation de la chaîne qui la retransmet."
    - p: "Puis-je assister à la cérémonie ?"
      r: "C'est un événement sur invitation. Le plus courant est de la suivre en direct à la télévision."
    - p: "Comment me préparer ?"
      r: "Regarde d'abord les films nommés. Beaucoup sont reprogrammés en salles ou disponibles sur les plateformes."
    - p: "Y a-t-il un tapis rouge ouvert au public ?"
      r: "Lors de certaines éditions, des zones permettent au public de voir arriver les invités. Consulte les informations de l'organisation."
    - p: "Est-ce un bon plan entre amis ?"
      r: "Oui, beaucoup la vivent chez eux, dans un bar ou dans un cinéma à grand écran, concours de pronostics inclus."
oscars:
  texto:
    - "La soirée des Oscars est le grand rendez-vous du cinéma mondial. Elle se déroule au Dolby Theatre de Los Angeles, normalement un dimanche de mars et, à cause du décalage horaire, elle est diffusée en Espagne en pleine nuit."
    - "Les nommés sont annoncés plusieurs semaines à l'avance, et c'est le moment idéal pour voir les films nommés, qui sont généralement à l'affiche ou sur les plateformes. Beaucoup de gens organisent un concours de pronostics, un marathon de films ou une soirée cinéma entre amis, et certaines salles proposent des projections spéciales."
    - "Si tu comptes suivre la cérémonie en direct, prépare-toi à veiller tard : elle commence le soir et se termine très tard dans la nuit. Une autre option consiste à regarder les prix principaux le lendemain dans les résumés des médias. Consulte la programmation de la chaîne qui diffuse la cérémonie en Espagne."
  faq:
    - p: "Quand ont lieu les Oscars ?"
      r: "Un dimanche de mars, avec la cérémonie en soirée à Los Angeles. En Espagne, elle est diffusée en pleine nuit."
    - p: "Où sont-ils diffusés en Espagne ?"
      r: "En direct, à la télévision et sur les plateformes. La programmation change chaque année, alors consulte-la."
    - p: "À quelle heure commencent-ils ?"
      r: "À l'heure de Los Angeles. En Espagne, c'est en pleine nuit, et la cérémonie dure plusieurs heures."
    - p: "Comment me préparer ?"
      r: "Voir avant les films nommés, qui sont généralement à l'affiche ou sur les plateformes, et préparer un concours de pronostics pour deviner les gagnants."
    - p: "Puis-je y assister ?"
      r: "C'est un événement sur invitation. Le plus courant est de le suivre à la télévision."
    - p: "Est-ce un bon plan entre amis ?"
      r: "Oui, beaucoup de gens le vivent en groupe, avec pronostics et dîner-goûter. On peut aussi le regarder le lendemain en résumé."
eurovision:
  texto:
    - "La finale de l'Eurovision est l'une des soirées les plus regardées de l'année en Espagne. Le festival réunit des artistes de dizaines de pays qui s'affrontent avec une chanson en direct, dans des mises en scène spectaculaires, et des milliers de personnes la vivent en groupe, avec des pronostics et des fêtes à thème."
    - "La finale a lieu un samedi de mai, précédée de deux demi-finales la même semaine. L'Espagne fait partie des « Big Five » et passe directement en finale. Le gagnant est désigné par l'addition du vote des jurys professionnels de chaque pays et du télévote du public."
    - "Pour en profiter, organise une fête à la maison : un concours de pronostics pour deviner le gagnant, une note pour chaque chanson et de quoi grignoter. Certains bars et salles organisent des retransmissions sur grand écran. Consulte la programmation de la chaîne qui diffuse le festival et les dates de l'année."
  faq:
    - p: "Quand a lieu la finale de l'Eurovision ?"
      r: "Un samedi de mai, après deux demi-finales la même semaine. La date et la ville hôte changent chaque année."
    - p: "Comment fonctionne le vote ?"
      r: "Chaque pays attribue des points selon le vote d'un jury professionnel et le télévote du public. La chanson qui obtient le plus de points gagne."
    - p: "L'Espagne passe-t-elle directement en finale ?"
      r: "Oui, l'Espagne fait partie des pays qualifiés d'office pour la finale, les « Big Five », avec le pays organisateur."
    - p: "Où est-elle diffusée ?"
      r: "En direct à la télévision et sur internet. Consulte la programmation."
    - p: "Comment la vivre ?"
      r: "À la maison entre amis, avec un concours de pronostics et des notes, ou dans un bar ou une salle qui la retransmet sur grand écran."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, le spectacle est très visuel et familial, même s'il se termine tard."
final-champions:
  texto:
    - "La finale de la Ligue des champions est le grand rendez-vous du football de clubs en Europe et l'une des soirées sportives les plus regardées de l'année. Elle a lieu un samedi fin mai ou début juin et, quand une équipe espagnole joue, la ville s'emplit d'ambiance."
    - "Pour la regarder, de nombreux bars, restaurants et établissements organisent des retransmissions sur grands écrans, et certaines villes installent des écrans géants sur des places ou dans des enceintes si une équipe espagnole joue. En cas de fête, les places traditionnelles des équipes, comme Cibeles ou Neptuno à Madrid, se remplissent."
    - "Si tu veux la voir dans un bar, réserve à l'avance ou arrive tôt, car ils se remplissent. Si tu la regardes chez toi, organise une soirée entre amis. Consulte la programmation de la chaîne qui la diffuse et vérifie la date et l'heure, qui changent chaque année selon la ville hôte."
  faq:
    - p: "Quand a lieu la finale de la Ligue des champions ?"
      r: "Un samedi fin mai ou début juin. La date et la ville hôte changent chaque année."
    - p: "Où la regarder ?"
      r: "Chez soi, dans des bars et restaurants équipés d'un écran et, si une équipe espagnole joue, sur des écrans géants dans certaines villes."
    - p: "Faut-il réserver dans un bar ?"
      r: "Oui, ou bien arriver tôt. Les finales remplissent les établissements qui la retransmettent."
    - p: "Où fête-t-on les titres ?"
      r: "Chaque équipe a ses lieux traditionnels : par exemple, Cibeles à Madrid ou Canaletas et l'Arc de Triomphe à Barcelone. Consulte les informations officielles du club et de la mairie."
    - p: "Où est-elle diffusée ?"
      r: "Consulte la programmation de la chaîne qui la retransmet cette année-là."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "À la maison ou dans un établissement familial, oui. Dans la rue, il faut faire attention aux mouvements de foule."
terrazas-primavera:
  texto:
    - "Le vermut est bien plus qu'une boisson : c'est un rituel du week-end. Un vermut à la pression, une olive, un peu de siphon et une terrasse au soleil font un plan simple, bon marché et très espagnol, parfait avant le déjeuner."
    - "Les meilleures périodes pour les terrasses sont le printemps, avant les grosses chaleurs, et septembre, quand on est encore bien dehors. Barcelone, Madrid, Reus, Valence ou Séville ont de bons bars à vermut, et beaucoup de quartiers organisent des parcours et des concours avec tapas et vermut à prix serré."
    - "Le plus simple, c'est de sortir à midi, le week-end, et de faire la tournée des bars à pied. Réserve si vous êtes en groupe, car les terrasses au soleil se remplissent vite, et goûte le vermut de la maison, que chaque établissement élabore ou sélectionne à sa façon. Accompagne-le de pickles, d'anchois, de chips ou de coques."
  mapa:
    titulo: "Où aller en terrasse et boire un vermut"
    centro: [40.0, -3.0]
    zoom: 6
    puntos:
      - { nombre: "Barcelone", lat: 41.3874, lon: 2.1686, desc: "Ville de bars à vermut et de l'heure du vermut le week-end." }
      - { nombre: "Madrid", lat: 40.4168, lon: -3.7038, desc: "Vermut à la pression et terrasses au soleil dans de nombreux quartiers, avec des parcours de tapas." }
      - { nombre: "Reus (Tarragone)", lat: 41.1548, lon: 1.1078, desc: "Berceau du vermut catalan, avec des caves et des bars de tradition." }
      - { nombre: "Valence", lat: 39.4699, lon: -0.3763, desc: "Terrasses et bars à vermut toute l'année grâce au climat." }
      - { nombre: "Séville", lat: 37.3891, lon: -5.9845, desc: "Terrasses et bars à tapas avec vermut, idéaux avant les grosses chaleurs." }
  faq:
    - p: "Quel est le meilleur moment pour aller en terrasse ?"
      r: "Au printemps, entre avril et juin, et en septembre, quand il fait beau et que la chaleur n'est pas encore écrasante."
    - p: "Que commande-t-on avec le vermut ?"
      r: "Une olive, une orange ou une rondelle de citron et des glaçons, parfois un trait de siphon. On l'accompagne de pickles, de chips, de coques ou d'anchois."
    - p: "Où aller boire un vermut ?"
      r: "Barcelone, Madrid, Reus, Valence et Séville ont une longue tradition, mais presque toutes les villes ont leur bar à vermut."
    - p: "Faut-il réserver ?"
      r: "Le week-end et avec une terrasse au soleil, mieux vaut réserver ou arriver tôt, surtout en groupe."
    - p: "Combien ça coûte ?"
      r: "Cela dépend de la ville et de l'établissement. Un vermut à la pression est généralement abordable et beaucoup de parcours de tapas incluent le vermut à prix fixe."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "En terrasse, oui, avec des boissons sans alcool, et à midi. Mieux vaut éviter les heures de plus grande affluence."

premio-nadal:
  texto:
    - "Le Premio Nadal de roman est le prix littéraire le plus ancien d'Espagne, décerné depuis 1944. Il est annoncé chaque 6 janvier lors d'un dîner à Barcelone et c'est l'un des premiers rendez-vous du calendrier littéraire de l'année."
    - "Le soir du 6 janvier, le lauréat est annoncé, et dans les jours qui suivent le roman primé arrive en librairie. C'est une bonne excuse pour commencer l'année avec une nouvelle lecture et pour découvrir des auteurs et autrices qui, dans bien des cas, publient leur œuvre pour la première fois à grande échelle."
    - "Tu peux suivre l'annonce sur les réseaux de la maison d'édition et dans les médias. Si tu veux lire le roman lauréat, il est généralement en librairie quelques semaines plus tard. Tu peux aussi parcourir les titres des éditions précédentes, parmi lesquels figurent de nombreux classiques de la littérature en espagnol."
  faq:
    - p: "Quand est annoncé le Premio Nadal ?"
      r: "Chaque 6 janvier au soir, lors d'une cérémonie à Barcelone."
    - p: "Qu'est-ce que le Premio Nadal ?"
      r: "Le prix littéraire de roman le plus ancien d'Espagne, décerné depuis 1944. Il est attribué par la maison d'édition Destino."
    - p: "Puis-je assister à la cérémonie ?"
      r: "C'est un événement fermé, sur invitation. Le plus courant est de le suivre dans les médias et sur les réseaux sociaux."
    - p: "Quand le roman arrive-t-il en librairie ?"
      r: "Il est généralement disponible dans les semaines qui suivent l'annonce. Renseigne-toi auprès de ta librairie."
    - p: "Est-ce le seul grand prix littéraire de janvier ?"
      r: "Non, il y en a d'autres tout au long de l'année, comme le Planeta en octobre et le Cervantes en avril. Tous ont leur propre fiche sur sinplanes."

premio-cervantes:
  texto:
    - "Le Premio Cervantes est la distinction la plus importante des lettres espagnoles et récompense l'œuvre d'un auteur ou d'une autrice pour l'ensemble de sa carrière. Il est remis chaque 23 avril, Journée du livre, dans le Paraninfo de l'université d'Alcalá, à Alcalá de Henares, en présence du Roi."
    - "Le prix est doté de 125 000 euros et le lauréat est annoncé des mois avant la cérémonie. La cérémonie se déroule dans un édifice historique d'une ville inscrite au patrimoine mondial et berceau de Miguel de Cervantes, ce qui lui donne une valeur symbolique particulière."
    - "La cérémonie est solennelle et sur invitation, mais tu peux la suivre à la télévision ou sur internet. C'est un bon jour pour visiter Alcalá de Henares, parcourir son centre historique et la maison natale de Cervantes, et pour découvrir le lauréat de l'année. Consulte le programme des activités de la ville autour de la Journée du livre."
  faq:
    - p: "Quand le Premio Cervantes est-il remis ?"
      r: "Chaque 23 avril, Journée du livre."
    - p: "Où est-il remis ?"
      r: "Dans le Paraninfo de l'université d'Alcalá, à Alcalá de Henares (Madrid)."
    - p: "Qui remet le prix ?"
      r: "Traditionnellement, le Roi d'Espagne."
    - p: "Quelle est sa dotation ?"
      r: "Il est doté de 125 000 euros."
    - p: "Puis-je y assister ?"
      r: "La cérémonie est solennelle et sur invitation. On peut la suivre à la télévision et sur internet."
    - p: "Que voir d'autre à Alcalá de Henares ?"
      r: "Le centre historique, patrimoine mondial, et la maison natale de Cervantes, entre autres lieux."

feria-libro-madrid:
  texto:
    - "La Feria del Libro de Madrid (Foire du livre de Madrid) est l'un des rendez-vous culturels les plus populaires de la ville. Pendant environ deux semaines, fin mai et début juin, le parc du Retiro se remplit de stands de librairies et de maisons d'édition, avec des dédicaces d'auteurs chaque jour."
    - "L'allée centrale du Retiro se transforme en grande librairie en plein air, avec des nouveautés, des classiques, des livres pour enfants et des livres d'occasion. Beaucoup de stands proposent des remises, et chaque jour des auteurs dédicacent des exemplaires et présentent leurs livres. C'est un plan lecture, mais aussi un plan balade."
    - "L'entrée est gratuite. Le mieux est d'y aller en semaine, le matin ou en fin de journée, car le week-end il y a foule. Emporte une liste de livres, un peu d'espèces et des chaussures confortables. Si tu veux te faire dédicacer un livre, arrive tôt et consulte le programme des dédicaces de chaque jour."
  faq:
    - p: "Quand a lieu la Feria del Libro de Madrid ?"
      r: "Fin mai et début juin, pendant environ deux ou trois semaines. Les dates exactes changent chaque année."
    - p: "Où se déroule-t-elle ?"
      r: "Dans le parc du Retiro, à Madrid."
    - p: "Faut-il payer l'entrée ?"
      r: "Non, l'entrée est gratuite."
    - p: "Y a-t-il des remises ?"
      r: "Beaucoup de stands proposent des remises et des offres. Renseigne-toi sur les conditions auprès de chacun."
    - p: "Comment obtenir une dédicace ?"
      r: "Consulte le programme des dédicaces sur le site de la foire et arrive tôt au stand, car les files d'attente sont longues."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, il y a des livres pour enfants, des conteurs et des activités. Va-y en semaine pour éviter la foule."

premio-planeta:
  texto:
    - "Le Premio Planeta est l'un des prix littéraires les mieux dotés du monde en langue espagnole, avec un million d'euros pour le lauréat. Il est annoncé à la mi-octobre lors d'un gala à Barcelone et c'est l'un des grands événements éditoriaux de l'automne."
    - "Lors du gala, on annonce le roman lauréat et le finaliste, et la nouvelle est suivie en direct dans les médias et sur les réseaux. Dans les jours qui suivent, le roman primé arrive en librairie et se classe généralement parmi les livres les plus vendus de la campagne de Noël."
    - "Tu peux suivre l'annonce dans les médias et sur les réseaux de la maison d'édition. Si tu veux lire le roman, il est généralement disponible en librairie dès son annonce. C'est un bon moment pour faire connaissance avec les auteurs et autrices qui font partie de la grande littérature en espagnol."
  faq:
    - p: "Quand est annoncé le Premio Planeta ?"
      r: "À la mi-octobre, lors d'un gala à Barcelone."
    - p: "Quelle est la dotation du prix ?"
      r: "Le lauréat reçoit un million d'euros et le finaliste une somme moindre, ce qui en fait l'un des prix littéraires les mieux dotés du monde."
    - p: "Puis-je assister au gala ?"
      r: "C'est un événement sur invitation. On le suit dans les médias et sur les réseaux sociaux."
    - p: "Quand le roman arrive-t-il en librairie ?"
      r: "Il est généralement disponible après l'annonce. Renseigne-toi auprès de ta librairie."
    - p: "Est-ce la même chose que le Premio Nadal ?"
      r: "Non. Le Nadal est le plus ancien d'Espagne et est annoncé le 6 janvier, tandis que le Planeta est annoncé en octobre."
