castanas-otono:
  imagen_alt: "Sol d'une châtaigneraie en automne couvert de feuilles dorées et de bogues de châtaigne"
  texto:
    - "Quand octobre arrive, les châtaigneraies du nord et du centre de la péninsule se couvrent de bogues tombées parmi les feuilles. Aller ramasser des châtaignes est l'un des plans d'automne les plus simples et les plus gratifiants : une balade tranquille en forêt, un panier qui se remplit peu à peu et, au retour, quelque chose de délicieux à faire griller à la maison."
    - "La saison commence, selon l'altitude et l'année, vers la mi-octobre et se prolonge jusque bien avant dans novembre. Les meilleures châtaigneraies se trouvent généralement en montagne, dans des zones au climat humide : El Bierzo (León), le Valle del Genal (Málaga), la sierra de Francia (Salamanque), le Valle del Tiétar (Ávila), ainsi qu'une bonne partie de la Galice et des Asturies."
    - "Le plus important est de savoir à qui appartient la châtaigneraie. Beaucoup sont des propriétés privées, avec un propriétaire qui les entretient et en vend les fruits, et ramasser sans autorisation peut avoir des conséquences. Renseigne-toi au village, à la mairie ou dans une maison d'hôtes de la région : il est fréquent que quelqu'un t'indique où l'on peut ramasser ou te mette en contact avec un propriétaire."
    - "Prévois des chaussures fermées qui accrochent bien, des gants épais (les bogues piquent pour de bon), un panier ou un sac et des vêtements que tu ne crains pas de salir. Les châtaignes tombent toutes seules quand elles sont mûres : le plus courant est de ramasser celles qui sont au sol, sans gauler les arbres ni les abîmer. Les jours qui suivent la pluie et le vent sont généralement les plus généreux."
    - "Une fois à la maison, fais une entaille dans la peau de chaque châtaigne avant de la griller ou de la cuire, pour qu'elle n'éclate pas. Elles se conservent mieux dans un endroit frais ou au réfrigérateur, et il vaut mieux les consommer en quelques jours. Le final naturel de ce plan, c'est un magosto : châtaignes grillées, feu de joie et vin nouveau."
  mapa:
    titulo: "Où aller ramasser des châtaignes"
    centro: [40.0, -5.0]
    zoom: 6
    puntos:
      - { nombre: "El Bierzo (León)", lat: 42.55, lon: -6.6, desc: "Châtaigneraies centenaires de Las Médulas et des vallées voisines ; berceau du magosto." }
      - { nombre: "Valle del Genal (Málaga)", lat: 36.57, lon: -5.17, desc: "Serranía de Ronda : Igualeja, Pujerra, Genalguacil et Júzcar, avec des châtaigniers dans toute la vallée." }
      - { nombre: "Sierra de Francia (Salamanque)", lat: 40.485, lon: -6.108, desc: "Autour de La Alberca et de Miranda del Castañar, avec des châtaigneraies sur les versants." }
      - { nombre: "Valle del Tiétar (Ávila)", lat: 40.2, lon: -5.1, desc: "Arenas de San Pedro, Candeleda et Guisando, au pied de la sierra de Gredos." }
      - { nombre: "Sierra de Aracena (Huelva)", lat: 37.89, lon: -6.56, desc: "Les châtaigneraies de la province de Huelva, à Castaño del Robledo et Galaroza." }
  faq:
    - p: "Quand est la saison des châtaignes ?"
      r: "En Espagne, de la mi-octobre à la mi-novembre environ. Dans les zones basses elle commence plus tôt et dans les zones plus élevées elle est décalée de quelques jours. Pour viser juste, renseigne-toi sur la zone la semaine précédente : la récolte change d'une année à l'autre selon la pluie et la chaleur de l'été."
    - p: "Peut-on ramasser des châtaignes dans n'importe quelle forêt ?"
      r: "Pas toujours. Beaucoup de châtaigneraies sont des propriétés privées et, en forêt publique, chaque mairie ou communauté peut avoir ses propres règles. Renseigne-toi auprès de la mairie ou des habitants avant de ramasser, et n'entre pas dans les propriétés clôturées."
    - p: "Où aller ramasser des châtaignes ?"
      r: "Les destinations classiques sont El Bierzo (León), le Valle del Genal (Málaga), la sierra de Francia (Salamanque) et le Valle del Tiétar (Ávila), ainsi que la Galice, les Asturies et la région d'Aracena. Toutes ont de très vastes châtaigneraies et une grande tradition."
    - p: "Que faut-il emporter ?"
      r: "Des gants épais, des chaussures fermées, un panier ou un sac et des vêtements chauds que tu ne crains pas de salir. Les bogues s'ouvrent en les écrasant avec la semelle de la chaussure, sans besoin d'outils."
    - p: "Comment fait-on griller les châtaignes ?"
      r: "Fais une entaille dans la peau de chacune, mets-les dans une poêle à châtaignes percée, au four ou sur un gril, et laisse-les de 20 à 30 minutes jusqu'à ce que la peau s'ouvre. Enveloppe-les quelques minutes dans un torchon pour qu'elles continuent de cuire dans leur propre vapeur et s'épluchent mieux."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, mais avec précaution : les bogues piquent. Donne-leur des gants et apprends-leur à ne pas mettre la main sans regarder. Pour eux, c'est une activité qui mêle balade, jeu et récompense."
    - p: "Qu'est-ce qu'un magosto ?"
      r: "C'est la fête traditionnelle d'automne de la Galice, des Asturies et d'El Bierzo : on fait griller des châtaignes sur un feu de joie et on les mange avec du vin nouveau ou du cidre, surtout à la Saint-Martin, le 11 novembre."
setas:
  imagen_alt: "Mains cueillant un bolet en forêt, avec un panier en osier rempli de champignons"
  texto:
    - "Avec les premières pluies d'automne, les pinèdes, les chênaies et les châtaigneraies se remplissent de champignons, et partir à leur recherche devient l'un des plans les plus attendus de l'année. C'est une excuse parfaite pour passer la matinée en forêt, avec ou sans panier plein."
    - "La haute saison va d'octobre à novembre, même si elle dépend beaucoup de la pluie et des températures : après quelques semaines humides et sans gelées, la forêt se met en route. Des provinces comme Soria, les Pyrénées, León, Zamora, la sierra de Gredos ou la Catalogne sont des classiques, et dans beaucoup d'entre elles il existe des sentiers mycologiques et des journées organisées."
    - "Avant de partir, renseigne-toi sur la réglementation de la zone. Plusieurs communautés exigent un permis ou une autorisation de cueillette (en Castille-et-León, par exemple, fonctionne le système Micocyl), et il existe des limites de quantité, des zones interdites et des horaires. Les règles changent d'un endroit à l'autre, alors consulte le site de la mairie ou de la communauté autonome."
    - "Si tu n'as pas d'expérience, la règle d'or est de ne manger aucun champignon que tu n'as pas identifié avec certitude. Le plus sage pour commencer est de t'inscrire à une sortie guidée ou à une journée mycologique avec un expert, et d'emporter un guide de terrain. Cueille avec un panier en osier, qui laisse tomber les spores et permet au champignon de respirer, et coupe ou extrais avec soin sans ravager le terrain."
  mapa:
    titulo: "Où aller aux champignons"
    centro: [41.2, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Pinèdes de Soria", lat: 41.95, lon: -2.75, desc: "Vinuesa, Covaleda et Duruelo de la Sierra, avec Micocyl comme système de permis." }
      - { nombre: "Pyrénées (Val d'Aran)", lat: 42.7, lon: 0.8, desc: "Forêts humides de sapins et de hêtres dans les Pyrénées de Lleida." }
      - { nombre: "Montagne de León", lat: 42.95, lon: -5.1, desc: "Riaño, Babia et Luna, avec des chênaies de chênes tauzins et des hêtraies." }
      - { nombre: "Sanabria (Zamora)", lat: 42.1, lon: -6.7, desc: "Pinèdes et châtaigneraies autour du lac de Sanabria." }
      - { nombre: "Sierra de Gredos (Ávila)", lat: 40.3, lon: -5.2, desc: "Pinèdes et chênaies du Valle del Tiétar et du Barranco." }
      - { nombre: "Solsonès (Catalogne)", lat: 42.0, lon: 1.5, desc: "Pinèdes et forêts mixtes avec une grande tradition mycologique." }
  faq:
    - p: "Quand est la saison des champignons ?"
      r: "En Espagne, la saison principale va d'octobre à novembre, même si dans certaines zones elle se prolonge jusqu'en décembre ou commence en septembre. Elle dépend de la pluie, de l'altitude et de la température : après plusieurs semaines humides et sans gelées, la forêt se met en route."
    - p: "Où chercher des champignons ?"
      r: "Soria, les Pyrénées, les montagnes de León et de Zamora, la sierra de Gredos ou la Catalogne sont des destinations classiques. Le plus pratique est de demander à l'office de tourisme ou dans une maison d'hôtes de la région, où l'on connaît en général les parcours et la réglementation en vigueur."
    - p: "Faut-il un permis pour cueillir des champignons ?"
      r: "Dans beaucoup de zones, oui. Plusieurs communautés autonomes exigent un permis ou une autorisation de cueillette, et il peut y avoir des limites de quantité et des zones interdites. Renseigne-toi toujours avant de partir sur le site de la mairie ou de la communauté autonome."
    - p: "Comment savoir si un champignon est comestible ?"
      r: "Ne te fie pas aux astuces populaires : on ne peut manger un champignon que si on l'a identifié avec certitude. Dans le doute, ne le cueille pas. Une sortie guidée ou une journée mycologique est le moyen le plus sûr d'apprendre, et en cas d'intoxication il faut se rendre aux urgences ou appeler le 112."
    - p: "Que faut-il emporter ?"
      r: "Un panier en osier, un couteau, un guide d'identification, des chaussures de montagne, des vêtements chauds, de l'eau et de quoi manger. Évite les sacs en plastique, qui abîment les champignons et empêchent les spores de tomber."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, à condition qu'ils soient accompagnés et sachent qu'on ne touche ni ne mange rien sans qu'un adulte l'ait vérifié. Les plus petits adorent la recherche, mais il vaut mieux choisir des parcours simples et veiller à ce qu'ils ne portent pas les mains à la bouche."
hayedos:
  imagen_alt: "Sentier couvert de feuilles entre des hêtres aux couleurs de l'automne, avec un peu de brume au fond"
  texto:
    - "Pendant quelques semaines d'automne, les hêtraies passent du vert au jaune, à l'orange et au cuivré, et le sol se couvre de feuilles. C'est l'un des spectacles naturels les plus photogéniques d'Espagne et un plan parfait pour marcher sans se presser entre des troncs argentés."
    - "Le meilleur moment se situe généralement entre la mi-octobre et la mi-novembre, même si le pic de couleur change chaque année selon le froid, la pluie et le vent. Parmi les hêtraies les plus connues figurent la Selva de Irati (Navarre), le Hayedo de Montejo (Madrid), le Hayedo de la Tejera Negra (Guadalajara) et celui d'Otzarreta (Biscaye), ainsi que ceux de Cantabrie, des Asturies et des Pyrénées."
    - "Attention aux quotas : certaines hêtraies, comme celle de Montejo, limitent le nombre de visiteurs ou exigent une réservation ou un permis d'accès, surtout les week-ends de couleur maximale. Consulte d'abord le site de l'espace protégé et, si tu peux, vas-y en semaine : il y aura moins de monde et plus de silence."
    - "Prévois des chaussures confortables qui accrochent sur les feuilles mouillées, une couche chaude et un imperméable, car dans la hêtraie l'humidité est habituelle, et ne t'écarte pas des sentiers balisés. Les matins avec un peu de brume et la lumière basse de fin de journée sont les meilleurs moments pour photographier."
  mapa:
    titulo: "Où voir une hêtraie en automne"
    centro: [42.0, -2.5]
    zoom: 7
    puntos:
      - { nombre: "Selva de Irati (Navarre)", lat: 42.98, lon: -1.1, desc: "L'une des plus grandes hêtraies-sapinières d'Europe, entre Ochagavía et Orbaizeta." }
      - { nombre: "Hayedo de Montejo (Madrid)", lat: 41.12, lon: -3.5, desc: "La hêtraie la plus méridionale d'Europe ; accès avec quota et réservation." }
      - { nombre: "Hayedo de la Tejera Negra (Guadalajara)", lat: 41.15, lon: -3.15, desc: "Dans la sierra de Ayllón, près de Cantalojas, avec des sentiers balisés." }
      - { nombre: "Hayedo de Otzarreta (Biscaye)", lat: 43.03, lon: -2.78, desc: "Dans le parc naturel de Gorbeia, l'une des plus photographiées." }
      - { nombre: "Saja-Besaya (Cantabrie)", lat: 43.1, lon: -4.2, desc: "Vastes hêtraies dans le parc naturel, avec de beaux sentiers d'automne." }
      - { nombre: "Redes (Asturies)", lat: 43.17, lon: -5.3, desc: "Hêtraies de montagne dans le parc naturel de Redes." }
      - { nombre: "Selva de Oza (Huesca)", lat: 42.85, lon: -0.75, desc: "Hêtraies et sapinières des Pyrénées aragonaises, dans la vallée de Hecho." }
  faq:
    - p: "Quel est le meilleur moment pour voir une hêtraie en automne ?"
      r: "Entre la mi-octobre et la mi-novembre, avec un pic de couleur qui dure en général deux ou trois semaines. Il varie chaque année avec le froid et la pluie ; il vaut donc mieux consulter le bulletin de l'espace protégé ou les réseaux sociaux des centres d'accueil des visiteurs."
    - p: "Quelles sont les plus belles hêtraies d'Espagne ?"
      r: "La Selva de Irati (Navarre), le Hayedo de Montejo (Madrid), le Hayedo de la Tejera Negra (Guadalajara) et celui d'Otzarreta (Biscaye) sont les plus connues. Celles de Cantabrie, des Asturies et des Pyrénées sont aussi remarquables."
    - p: "Faut-il réserver ou demander un permis ?"
      r: "Pour certaines, oui. Le Hayedo de Montejo, par exemple, limite les visites et exige une autorisation, et dans d'autres espaces il y a des quotas ou des parkings qui se remplissent les week-ends de couleur maximale. Consulte le site de l'espace protégé avant d'y aller."
    - p: "Peut-on y aller avec des enfants ou un chien ?"
      r: "Les parcours courts et balisés conviennent aux enfants. Avec un chien, cela dépend de chaque espace : dans certains ils sont interdits ou doivent être tenus en laisse ; il vaut donc mieux vérifier avant."
    - p: "Quels vêtements et quelles chaussures prévoir ?"
      r: "Des chaussures confortables qui accrochent sur les feuilles mouillées, des vêtements chauds en couches et un imperméable, car l'humidité et la température chutent vite en forêt."
    - p: "Comment éviter la foule ?"
      r: "Va-y en semaine, tôt le matin ou en fin d'après-midi, et évite les ponts et les week-ends de couleur maximale. Une autre option consiste à choisir des hêtraies moins connues de la même région."
berrea:
  texto:
    - "À la fin de l'été, les cerfs mâles commencent à bramer pour attirer les femelles et défier leurs rivaux. Ce rugissement grave et puissant, qui résonne dans la montagne à l'aube et au crépuscule, c'est la berrea (le brame du cerf), l'un des spectacles de faune les plus impressionnants d'Espagne."
    - "La berrea se concentre entre septembre et octobre, avec son point culminant généralement à la fin septembre et au début octobre, même si cela varie selon la zone et l'année. Les lieux les plus connus sont le parc national de Cabañeros, le parc national de Monfragüe, la Sierra de Andújar, la Reserva Nacional de Riaño et la Sierra de la Culebra, entre autres."
    - "Le mieux est d'arriver avant l'aube ou un peu avant la tombée de la nuit, quand les cerfs sont les plus actifs, et d'écouter en silence depuis un point d'observation. Emporte des jumelles, des vêtements chauds et de couleurs discrètes, et n'utilise ni lampe torche ni flash. Les cerfs en rut sont imprévisibles : garde toujours tes distances et ne t'approche pas d'eux."
    - "Dans certains espaces, il y a des parcours guidés, des observatoires ou des accès réglementés pendant la berrea, et il vaut mieux réserver à l'avance. Consulte le site de l'espace protégé ou du centre d'accueil des visiteurs avant d'y aller."
  mapa:
    titulo: "Où écouter la berrea"
    centro: [40.0, -5.0]
    zoom: 6
    puntos:
      - { nombre: "Parc national de Cabañeros (Ciudad Real)", lat: 39.4, lon: -4.5, desc: "Rañas (plateaux herbeux) et forêt méditerranéenne avec de grandes populations de cerfs ; visites guidées pendant la berrea." }
      - { nombre: "Parc national de Monfragüe (Cáceres)", lat: 39.83, lon: -6.05, desc: "Dehesa et falaises avec plusieurs belvédères pour écouter à l'aube." }
      - { nombre: "Sierra de Andújar (Jaén)", lat: 38.25, lon: -4.0, desc: "L'un des meilleurs endroits du sud ; très fréquenté, il vaut mieux réserver." }
      - { nombre: "Reserva Nacional de Riaño (León)", lat: 42.98, lon: -5.0, desc: "Berrea de montagne, entre hêtraies et chênaies des Picos de Europa de León." }
      - { nombre: "Sierra de la Culebra (Zamora)", lat: 41.85, lon: -6.2, desc: "Vaste réserve de chasse avec beaucoup de cerfs et quelques loups." }
  faq:
    - p: "Quand a lieu la berrea du cerf ?"
      r: "Entre septembre et octobre. Le moment de plus forte activité est généralement la fin septembre et le début octobre, même si cela change selon la zone et l'année. Le mieux est de sortir à l'aube ou au crépuscule."
    - p: "Où voir la berrea ?"
      r: "Les lieux les plus connus sont Cabañeros, Monfragüe, la Sierra de Andújar, la Reserva Nacional de Riaño et la Sierra de la Culebra. Dans beaucoup d'entre eux, il y a des parcours guidés, des observatoires ou des points d'écoute balisés."
    - p: "Que faut-il emporter ?"
      r: "Des jumelles, des vêtements chauds et de couleurs discrètes (verts, marrons, gris), des chaussures confortables et de quoi manger et boire. Aux heures de plus grande activité, il fait frais, même si la journée est chaude."
    - p: "Est-il dangereux de s'approcher des cerfs ?"
      r: "Oui. Les mâles en rut sont très agressifs et imprévisibles. Ne t'approche pas, ne les contourne pas, ne leur coupe pas le passage et garde la distance indiquée par les guides ou les panneaux."
    - p: "Faut-il réserver ?"
      r: "Dans certains espaces, oui, surtout pour les parcours guidés, les observatoires ou les accès réglementés en pleine berrea. Consulte le site de l'espace protégé ou du centre d'accueil des visiteurs avant d'y aller, car les places partent vite."
    - p: "Peut-on y aller avec des enfants ?"
      r: "Oui, c'est un très beau plan pour eux, mais il faut y aller en silence, tôt le matin et sans s'éloigner du groupe. Choisis des parcours simples, et de préférence avec un guide."
vendimia:
  texto:
    - "Septembre est le mois des vendanges dans une bonne partie de l'Espagne : les grappes mûres sont coupées à la main ou à la machine et les caves se remplissent d'une odeur de moût. Les vivre de près, entre vignobles et pressoirs, est l'un des plans de fin d'été les plus charmants, et il a beaucoup d'une fête."
    - "La date exacte change selon la zone, le cépage et l'année. Les raisins blancs et les variétés précoces se récoltent souvent dès la fin août, et les rouges les plus tardifs peuvent se prolonger jusqu'en octobre. Des régions comme La Rioja, la Ribera del Duero, Jerez, le Penedès, les Rías Baixas ou La Mancha organisent des visites, des dégustations et des activités liées aux vendanges."
    - "Beaucoup de caves proposent des expériences où tu peux couper des grappes, fouler le raisin ou voir comment la récolte arrive à la cave, généralement sur réservation préalable et payantes. Il y a aussi des fêtes consacrées aux vendanges, comme celles de Jerez ou celles de San Mateo à Logroño, avec foulage du raisin, offrandes du premier moût et dégustations."
    - "Si tu t'inscris à une expérience dans le vignoble, prévois des chaussures fermées et confortables, une casquette, de la crème solaire et des vêtements qui peuvent se tacher. Il vaut mieux y aller tôt le matin, quand il fait moins chaud et qu'on travaille plus tranquillement."
  mapa:
    titulo: "Où vivre les vendanges"
    centro: [40.0, -3.5]
    zoom: 6
    puntos:
      - { nombre: "La Rioja (Logroño)", lat: 42.4627, lon: -2.445, desc: "Rioja Alta et Rioja Baja, avec les fêtes de San Mateo à Logroño et de nombreuses caves ouvertes à la visite." }
      - { nombre: "Ribera del Duero (Burgos et Valladolid)", lat: 41.62, lon: -3.9, desc: "Vignobles de rouge le long du Duero, avec des caves ouvertes à la visite." }
      - { nombre: "Rías Baixas (Pontevedra)", lat: 42.51, lon: -8.81, desc: "Terre de l'albariño, avec des vendanges précoces et des caves autour de Cambados." }
      - { nombre: "Penedès (Barcelone)", lat: 41.3446, lon: 1.6988, desc: "Terre du cava et du vin, avec des caves et des expériences de vendanges autour de Vilafranca." }
      - { nombre: "La Mancha (Ciudad Real)", lat: 39.0, lon: -3.2, desc: "Le plus grand vignoble d'Espagne, avec des caves et des fêtes des vendanges dans ses villages." }
      - { nombre: "Jerez (Cadix)", lat: 36.6864, lon: -6.1377, desc: "Capitale du xérès, avec sa fête des vendanges et ses caves historiques." }
  faq:
    - p: "Quand ont lieu les vendanges en Espagne ?"
      r: "Cela dépend de la zone et du cépage, mais la période principale va de la fin août à octobre, avec septembre comme mois central. Les raisins blancs et précoces sont récoltés avant les rouges tardifs."
    - p: "Où vivre les vendanges ?"
      r: "Les destinations classiques sont La Rioja, la Ribera del Duero, Jerez, le Penedès, les Rías Baixas et La Mancha. Beaucoup de caves organisent des visites et des expériences à ces dates."
    - p: "Peut-on participer aux vendanges ?"
      r: "Oui, certaines caves proposent des expériences où tu peux couper des grappes, fouler le raisin ou voir l'arrivée de la récolte. Elles sont généralement payantes et sur réservation préalable ; renseigne-toi donc à l'avance."
    - p: "Y a-t-il des fêtes des vendanges ?"
      r: "Oui. Parmi les plus connues figurent les Fiestas de la Vendimia de Jerez et les Fiestas de San Mateo et des vendanges de La Rioja à Logroño, avec foulage du raisin, offrande du moût et dégustations."
    - p: "Que faut-il emporter ?"
      r: "Des chaussures fermées et confortables, une casquette, de la crème solaire et des vêtements qui peuvent se tacher. Il vaut mieux y aller tôt le matin, quand il fait moins chaud."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "En général, oui. Beaucoup de caves organisent des activités pour les familles, avec un foulage de raisin symbolique et du moût sans alcool. Demande lors de la réservation si les enfants sont admis."
mercadillos-navidad:
  texto:
    - "Les marchés de Noël remplissent de chalets, de lumières et d'odeurs de douceurs les places de nombreuses villes. C'est un plan parfait pour se promener, acheter de l'artisanat et des décorations, et commencer à entrer dans l'ambiance de Noël."
    - "Certains sont des classiques : le marché de la Plaza Mayor de Madrid, la Fira de Santa Llúcia de Barcelone, près de la cathédrale, ou le marché de Santo Tomás de Bilbao, qui a lieu le 21 décembre. Bien d'autres villes installent le leur, avec des chalets d'artisanat, de douceurs, de crèches et des spectacles pour enfants."
    - "Ils ouvrent généralement à partir de la fin novembre et durent jusqu'à Nochebuena (le 24 décembre) ou jusqu'aux Rois mages. Le plus agréable est d'y aller en semaine ou en début d'après-midi, quand il y a moins de monde, et de prendre des espèces, car tous les chalets n'acceptent pas la carte. Couvre-toi bien : on passe beaucoup de temps en plein air."
  faq:
    - p: "Quand ouvrent les marchés de Noël ?"
      r: "La plupart ouvrent à partir de la fin novembre ou du début décembre et ferment à Nochebuena, même si certains durent jusqu'aux Rois mages. Renseigne-toi sur les dates de chaque ville."
    - p: "Quels sont les plus connus ?"
      r: "Celui de la Plaza Mayor de Madrid, la Fira de Santa Llúcia de Barcelone et le marché de Santo Tomás de Bilbao comptent parmi les plus traditionnels, même si presque chaque ville a le sien."
    - p: "Faut-il payer l'entrée ?"
      r: "Non. L'entrée est libre, et tu ne paies que ce que tu achètes ou certaines attractions, comme les patinoires ou les spectacles."
    - p: "Que peut-on acheter ?"
      r: "Des crèches et des santons, des décorations, des bougies, de l'artisanat, des douceurs de Noël, des turrones et des jouets, selon le marché."
    - p: "Quel est le meilleur moment pour y aller ?"
      r: "En semaine et en début d'après-midi, pour éviter la foule. Le week-end et les ponts, il y a énormément de monde."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, beaucoup proposent des chalets de jouets, des spectacles et la visite du Père Noël ou des Rois mages. Fais attention à la foule et ne perds pas les plus petits de vue."
luces-navidad:
  texto:
    - "Chaque année, les villes espagnoles rivalisent pour avoir les illuminations de Noël les plus spectaculaires. Des rues couvertes de lumières, de grands sapins, des spectacles de lumière et de musique et beaucoup de monde qui se promène font de la visite des illuminations un plan très simple et très festif."
    - "Vigo s'est fait connaître pour son déploiement, et Madrid, Málaga, Valence ou Barcelone organisent aussi des illuminations très visitées. L'allumage a généralement lieu à la fin novembre ou au début décembre, lors d'une cérémonie publique, et les lumières restent allumées jusqu'aux Rois mages."
    - "Le plus pratique est de se déplacer à pied ou en transports en commun, car les centres-villes se remplissent de monde et des rues sont fermées à la circulation, surtout le week-end et les jours d'allumage. Si tu veux éviter la foule, va-y en semaine, en début de soirée. Couvre-toi bien et mets des chaussures confortables, car on marche beaucoup."
  faq:
    - p: "Quand les lumières de Noël sont-elles allumées ?"
      r: "Normalement à la fin novembre ou début décembre, lors d'une cérémonie publique. Chaque ville a sa date, annoncée quelques semaines à l'avance."
    - p: "Jusqu'à quand restent-elles allumées ?"
      r: "En général jusqu'aux Rois mages, le 6 janvier, même si dans certaines villes elles restent quelques jours de plus."
    - p: "Quelles villes ont les plus belles illuminations ?"
      r: "Vigo, Madrid, Málaga, Valence et Barcelone comptent généralement parmi les plus visitées, même si beaucoup de villes moyennes ont des illuminations très soignées."
    - p: "Quel est le meilleur moment pour y aller ?"
      r: "En semaine et en début de soirée. Le week-end, les jours de pont et les jours d'allumage, il y a beaucoup de monde."
    - p: "Comment me déplacer ?"
      r: "À pied ou en transports en commun. Dans les zones les plus visitées, des rues sont fermées et il est compliqué de se garer."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, c'est très attrayant pour eux. Fais attention à la foule et fixe un point de rendez-vous au cas où vous seriez séparés."
cabalgata-reyes:
  texto:
    - "La Cabalgata de Reyes est l'un des grands plans en famille de Noël : l'après-midi du 5 janvier, les Rois mages parcourent les rues de presque toutes les villes et de tous les villages d'Espagne avec des chars, de la musique et une pluie de bonbons, avant la nuit où ils déposent les cadeaux."
    - "Les plus connues sont celles de Madrid, de Barcelone, où les Rois arrivent par le port, de Séville, avec l'une des plus anciennes d'Espagne, ou de Valence, mais chaque localité organise la sienne. Les chars partent généralement à la tombée du jour, et le parcours et l'horaire sont publiés sur le site ou les réseaux de la mairie quelques jours avant."
    - "Arrive en avance et choisis une bonne place : les trottoirs se remplissent une ou deux heures avant. Prends un grand sac pour les bonbons, des vêtements chauds et de la patience, et surveille les enfants pendant que les bonbons pleuvent. S'il pleut, vérifie si le défilé est maintenu ou annulé."
  faq:
    - p: "Quand a lieu la Cabalgata de Reyes ?"
      r: "Le 5 janvier dans l'après-midi, même si l'horaire et le parcours changent d'une localité à l'autre."
    - p: "Où voir la cabalgata ?"
      r: "Dans presque toutes les villes et tous les villages. Celles de Madrid, Barcelone, Séville et Valence sont parmi les plus grandes, mais chaque mairie publie le parcours."
    - p: "Est-ce gratuit ?"
      r: "Oui, voir la cabalgata depuis la rue est gratuit."
    - p: "Quand arriver pour avoir une place ?"
      r: "Une ou deux heures avant dans les grandes villes, et un peu moins dans les petits villages."
    - p: "Que faut-il emporter ?"
      r: "Des vêtements chauds, un sac pour les bonbons et de la patience. Dans les zones très fréquentées, prévois un point de rendez-vous au cas où vous seriez séparés."
    - p: "Que se passe-t-il s'il pleut ?"
      r: "Cela dépend de la ville. Certaines sont maintenues et d'autres sont reportées ou réduites. Consulte le site ou les réseaux de la mairie."
loteria-navidad:
  texto:
    - "Le tirage de la Lotería de Navidad, chaque 22 décembre, est l'un des rites les plus suivis de Noël en Espagne. Les enfants de San Ildefonso chantent les numéros et les prix sur leur mélodie inimitable, que l'on entend à la radio et à la télévision dans tout le pays."
    - "Le tirage a lieu depuis des années au Teatro Real de Madrid et dure plusieurs heures, dès le petit matin. Le prix le plus célèbre est El Gordo, mais il y a beaucoup de prix, et on joue en famille, entre amis ou au travail, souvent avec un numéro partagé."
    - "Tu peux le suivre à la télévision ou à la radio, ou consulter les résultats sur le site officiel de Loterías. L'accès au Teatro Real est limité, donc le plus courant est de le regarder depuis chez soi. Si tu as joué, garde bien ton billet (le « décimo ») et vérifie les délais pour toucher les prix."
  faq:
    - p: "Quand a lieu le tirage de Noël ?"
      r: "Le 22 décembre, dès le petit matin. Il dure plusieurs heures."
    - p: "Où a-t-il lieu ?"
      r: "Au Teatro Real de Madrid. L'accès du public est limité."
    - p: "Qui chante les numéros ?"
      r: "Les enfants du Colegio de San Ildefonso, qui les chantent avec les prix."
    - p: "Comment le suivre ?"
      r: "À la télévision, à la radio ou sur internet. Tu peux aussi vérifier les résultats sur le site officiel de Loterías."
    - p: "Quand faut-il toucher le prix ?"
      r: "Les prix doivent être encaissés dans un certain délai. Consulte les conditions et les délais sur le site officiel de Loterías."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, beaucoup adorent entendre chanter les numéros et l'ambiance de la matinée."
campanadas:
  texto:
    - "Les Campanadas de Nochevieja marquent le passage à la nouvelle année en Espagne avec une tradition unique : manger douze grains de raisin, un à chaque coup de cloche, pour accueillir la nouvelle année avec de la chance. Elles sont retransmises en direct depuis l'horloge de la Puerta del Sol de Madrid et sont suivies dans presque tous les foyers."
    - "Beaucoup de gens les regardent à la télévision, chez eux ou avec des amis et de la famille, et d'autres préfèrent se rendre sur une place. À la Puerta del Sol, l'accès a généralement une capacité limitée et des contrôles de sécurité ; renseigne-toi donc sur les conditions et arrive en avance. D'autres villes organisent leurs propres événements sur les places principales."
    - "Pour les raisins, quelques conseils pratiques : épluche-les et retire les pépins, prépare les douze grains à l'avance et commence avec les premiers coups de cloche, pas avec les quarts. Ensuite, trinque, mets des accessoires de fête et fais la fête jusqu'au petit matin, ou va te reposer, selon ton plan."
  faq:
    - p: "Quand ont lieu les Campanadas ?"
      r: "Dans la nuit du 31 décembre, à 00h00. Les douze coups de cloche de l'horloge marquent le passage à la nouvelle année."
    - p: "Pourquoi mange-t-on douze raisins ?"
      r: "C'est une tradition qui consiste à manger un grain de raisin à chaque coup de cloche pour accueillir l'année avec de la chance. Elle se pratique dans toute l'Espagne."
    - p: "Puis-je aller à la Puerta del Sol ?"
      r: "Oui, mais l'accès a généralement une capacité limitée et des contrôles de sécurité. Consulte les conditions de la mairie de Madrid et arrive en avance."
    - p: "Quelles chaînes les retransmettent ?"
      r: "Plusieurs chaînes de télévision diffusent les campanadas en direct depuis la Puerta del Sol. Consulte la programmation."
    - p: "Comment préparer les raisins ?"
      r: "Épluche les raisins et retire les pépins, aie-en douze de prêts et commence avec les campanadas, pas avec les quarts qui les précèdent."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, à la maison ou lors d'un événement tranquille. Avec les jeunes enfants, les raisins peuvent être préparés épluchés, sans pépins ou coupés pour éviter les étouffements."
perseidas:
  texto:
    - "Les Perséides, connues en Espagne sous le nom de Larmes de saint Laurent, sont l'une des pluies d'étoiles filantes les plus faciles et les plus spectaculaires à observer depuis l'Espagne. Elles se produisent chaque année lorsque la Terre traverse la traînée de poussière de la comète Swift-Tuttle."
    - "L'activité dure de la mi-juillet à la fin août, et le maximum a généralement lieu entre le 11 et le 13 août. Par une nuit dégagée, sans Lune et sous un ciel sombre, on peut voir des dizaines de météores par heure. La phase de la Lune de chaque année joue beaucoup : avec la pleine Lune, on en voit bien moins."
    - "L'essentiel est de s'éloigner de la pollution lumineuse. Les réserves et destinations certifiées Starlight, comme Monfragüe, la Sierra Sur de Jaén ou Gúdar-Javalambre, sont un excellent choix, et beaucoup organisent des observations guidées. Pas besoin de télescope ni de jumelles : il suffit de s'allonger et de regarder le ciel ouvert."
    - "Laisse tes yeux s'habituer à l'obscurité pendant environ 20 à 30 minutes et évite de regarder ton téléphone. Apporte une couverture ou un transat, des vêtements chauds, même s'il fait chaud en journée, et quelque chose de chaud à boire. Les heures après minuit sont généralement les meilleures."
  mapa:
    titulo: "Où voir les Perséides"
    centro: [39.5, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Monfragüe (Cáceres)", lat: 39.83, lon: -6.05, desc: "Parc national et réserve Starlight, avec des observations guidées du ciel." }
      - { nombre: "Sierra Sur de Jaén", lat: 37.6, lon: -3.85, desc: "Réserve Starlight aux ciels très sombres, autour d'Alcalá la Real et de Castillo de Locubín." }
      - { nombre: "Gúdar-Javalambre (Teruel)", lat: 40.2, lon: -0.7, desc: "Réserve Starlight à plus de 1 500 m d'altitude, avec des ciels limpides et un observatoire astrophysique." }
  faq:
    - p: "Quand voit-on les Perséides ?"
      r: "L'activité va de la mi-juillet à la fin août, avec un maximum vers le 12 août, normalement entre le 11 et le 13. Les meilleures heures sont après minuit et jusqu'à l'aube."
    - p: "Où les voir le mieux en Espagne ?"
      r: "Dans n'importe quel endroit au ciel sombre et dégagé. Les destinations certifiées Starlight, comme Monfragüe, la Sierra Sur de Jaén ou Gúdar-Javalambre, offrent d'excellents ciels et des observations guidées."
    - p: "Faut-il un télescope ?"
      r: "Non. Ce sont des météores qui se déplacent vite et se voient mieux à l'œil nu. Les jumelles et les télescopes réduisent le champ de vision et n'aident pas."
    - p: "Dans quelle direction faut-il regarder ?"
      r: "Elles proviennent de la constellation de Persée, vers le nord-est, mais les météores apparaissent dans tout le ciel. Le mieux est de regarder vers le haut sans se fixer sur un point précis."
    - p: "La Lune a-t-elle une influence ?"
      r: "Beaucoup. Avec une pleine Lune ou une Lune très lumineuse, on voit bien moins de météores. Il vaut mieux consulter la phase lunaire de l'année avant de planifier la sortie."
    - p: "Que faut-il apporter ?"
      r: "Une couverture ou un transat, des vêtements chauds, une lampe de poche à lumière rouge (si tu en as besoin), quelque chose de chaud à boire et de la patience. Évite les lumières blanches, qui abîment la vision nocturne."
cerezos-jerte:
  texto:
    - "Pendant quelques semaines au printemps, la Vallée du Jerte, dans le nord de la province de Cáceres, se couvre de blanc avec la floraison de centaines de milliers de cerisiers. Les terrasses des versants semblent enneigées, et le spectacle se complète avec la Garganta de los Infiernos et les villages de pierre de la vallée."
    - "La floraison arrive généralement entre la fin mars et la mi-avril, même si la date exacte change chaque année selon l'hiver et les températures. Elle dure peu, entre une et deux semaines par zone, et avance ou retarde selon l'altitude : mieux vaut donc se renseigner sur l'état de la floraison avant de partir. C'est à cette époque que se célèbre la Fête du cerisier en fleurs (Fiesta del Cerezo en Flor)."
    - "C'est un plan très populaire, et les week-ends de floraison maximale, la circulation et le stationnement se compliquent. Si tu le peux, viens en semaine ou à la première heure, réserve ton hébergement à l'avance et arme-toi de patience sur les routes de la vallée. Les cerisiers sont des arbres cultivés qui ont un propriétaire : respecte les propriétés, ne coupe pas de branches et n'entre pas dans les terrasses fermées."
  mapa:
    titulo: "Où voir les cerisiers en fleurs"
    centro: [40.2, -5.77]
    zoom: 11
    puntos:
      - { nombre: "Garganta de los Infiernos", lat: 40.22, lon: -5.76, desc: "Réserve naturelle en tête de vallée, avec des sentiers et des vasques au bord de la rivière." }
      - { nombre: "Jerte", lat: 40.2147, lon: -5.7508, desc: "Village de pierre à l'entrée de la Garganta, avec un centre d'accueil des visiteurs et des cerisiers sur les terrasses." }
      - { nombre: "Navaconcejo", lat: 40.1747, lon: -5.7978, desc: "Village de la vallée entouré de cerisiers ; une bonne base pour voir la floraison." }
      - { nombre: "Cabezuela del Valle", lat: 40.1697, lon: -5.7014, desc: "Cerisiers sur les versants et rues de pierre, dans le tronçon médian de la vallée." }
  faq:
    - p: "Quand les cerisiers du Jerte fleurissent-ils ?"
      r: "Normalement entre la fin mars et la mi-avril, pendant une ou deux semaines dans chaque zone. La date change chaque année avec le climat : renseigne-toi donc sur l'état de la floraison avant d'y aller."
    - p: "Où voir les cerisiers en fleurs ?"
      r: "La Vallée du Jerte (Cáceres) est la plus connue, avec des villages comme Cabezuela del Valle, Navaconcejo ou Jerte, et des itinéraires comme celui de la Garganta de los Infiernos."
    - p: "Peut-on entrer dans les terrasses de cerisiers ?"
      r: "Ce sont des propriétés privées cultivées. Promène-toi sur les chemins et les belvédères balisés, n'entre pas dans les parcelles et ne coupe ni fleurs ni branches."
    - p: "Faut-il réserver son hébergement ?"
      r: "Oui, à l'avance, car les week-ends de floraison maximale tout est complet. Les villages voisins de La Vera ou Plasencia sont une alternative."
    - p: "Comment éviter la foule ?"
      r: "Viens en semaine, à la première heure ou en fin d'après-midi, et évite les week-ends de couleur maximale. Mieux vaut se garer dans les zones prévues et se déplacer à pied."
    - p: "Est-ce un bon plan avec des enfants ?"
      r: "Oui, les itinéraires faciles dans la vallée conviennent aux familles. Si ton enfant est allergique au pollen, apporte des médicaments, car au printemps la floraison est intense."
nieve:
  texto:
    - "Monter à la neige est l'un des grands plans d'hiver, que ce soit pour skier, se promener, faire de la luge ou simplement admirer la montagne blanche. L'Espagne compte des stations et des paysages enneigés dans la Sierra Nevada, les Pyrénées, la cordillère Cantabrique et le Système central."
    - "La saison va de décembre à mars, même si la neige dépend beaucoup de chaque hiver. Avant de partir, consulte l'état des pistes et des routes : il peut être nécessaire d'avoir des chaînes ou des pneus hiver, et les accès aux stations sont saturés les week-ends et lors des ponts. Consulte les informations de circulation avant et pendant le voyage."
    - "Pas besoin de skier. De nombreuses stations et vallées proposent des zones de luge, des itinéraires en raquettes, du ski de fond et des promenades dans la neige, et on peut louer les vêtements. Réserve le forfait et le matériel à l'avance pendant les périodes de forte affluence. Apporte des vêtements imperméables et en couches, des lunettes de soleil, de la crème solaire et des gants de rechange, car le soleil et le reflet sur la neige sont trompeurs."
  mapa:
    titulo: "Où monter à la neige"
    centro: [40.5, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Sierra Nevada (Granada)", lat: 37.09, lon: -3.4, desc: "La station la plus méridionale d'Europe, avec des pistes de ski et des zones de promenade et de luge." }
      - { nombre: "Pirineo aragonés (Formigal)", lat: 42.78, lon: -0.37, desc: "Grand domaine skiable des Pyrénées, avec du ski de fond et des itinéraires en raquettes à proximité." }
      - { nombre: "Pirineo catalán (Baqueira Beret)", lat: 42.7, lon: 0.93, desc: "L'une des plus grandes stations des Pyrénées, dans le Val d'Aran." }
      - { nombre: "Cordillera Cantábrica (San Isidro)", lat: 43.05, lon: -5.37, desc: "Station entre León et les Asturies, avec un paysage de haute montagne cantabrique." }
      - { nombre: "Sistema Central (Navacerrada)", lat: 40.79, lon: -4.01, desc: "La neige la plus proche de Madrid, avec des pistes et des zones de luge ; les accès sont saturés le week-end." }
  faq:
    - p: "Quand y a-t-il de la neige en Espagne ?"
      r: "Normalement de décembre à mars, janvier et février étant les mois les plus fiables. Cela dépend beaucoup de chaque hiver et de l'altitude."
    - p: "Où monter à la neige ?"
      r: "La Sierra Nevada (Grenade), les Pyrénées (Huesca, Lleida, Navarre), la cordillère Cantabrique, le Système central (Madrid, Ségovie) ou le Système ibérique offrent des stations et des itinéraires."
    - p: "Faut-il savoir skier ?"
      r: "Non. Il y a des luges, des itinéraires en raquettes, du ski de fond, des zones de neige pour les enfants et des promenades. Si tu veux skier, de nombreuses écoles proposent des cours d'initiation."
    - p: "Ai-je besoin de chaînes ?"
      r: "Cela dépend de la route et du jour. Consulte les informations de circulation et emporte des chaînes ou des pneus hiver. Parfois, il est obligatoire d'en avoir et la route est fermée sans elles."
    - p: "Faut-il réserver ?"
      r: "Pendant les périodes de forte affluence (ponts, Noël, week-ends de neige), il vaut mieux réserver le forfait, la location et l'hébergement. Acheter en ligne est généralement moins cher et plus rapide."
    - p: "Quels vêtements apporter ?"
      r: "Des vêtements imperméables et en couches, des gants et un bonnet, des lunettes de soleil ou de ski, une protection solaire et des chaussures à bonne semelle. Des vêtements secs de rechange pour le trajet du retour ne sont jamais de trop."
festival-san-sebastian:
  texto:
    - "Le Festival de Cinéma de Saint-Sébastien, connu sous le nom de Zinemaldia, est l'un des grands festivals de cinéma d'Espagne et d'Europe. Il se tient en septembre à Donostia-San Sebastián, avec des avant-premières internationales, des stars sur le tapis rouge et des projections ouvertes au public."
    - "La programmation comprend la sélection officielle en compétition, qui se dispute la Coquille d'or (Concha de Oro), ainsi que des sections parallèles, des rétrospectives et des hommages, comme le Prix Donostia pour l'ensemble d'une carrière. Les projections sont réparties entre plusieurs cinémas et lieux de la ville, dont le Kursaal et le Teatro Victoria Eugenia, et une grande partie est ouverte à tous les spectateurs."
    - "Consulte le site officiel pour le programme, les horaires et la vente des billets, qui sont généralement mis en vente quelques jours avant les séances et partent vite. Arrive tôt dans les files d'attente, regarde les horaires pour enchaîner les séances et profites-en pour te promener en ville et goûter les pintxos. En septembre, il peut pleuvoir : prends un parapluie."
  faq:
    - p: "Quand a lieu le Festival de Cinéma de Saint-Sébastien ?"
      r: "En septembre, pendant environ neuf jours. Les dates exactes sont annoncées chaque année."
    - p: "N'importe qui peut-il y aller ?"
      r: "Oui. Outre les séances réservées aux professionnels et à la presse, il y a de nombreuses projections ouvertes au public sur billet."
    - p: "Où acheter les billets ?"
      r: "Sur les canaux officiels du festival. Ils se vendent peu de temps à l'avance et les séances les plus populaires affichent complet."
    - p: "Qu'est-ce que la Coquille d'or ?"
      r: "C'est le prix principal du festival, décerné au meilleur film de la sélection officielle."
    - p: "Peut-on voir les stars ?"
      r: "Sur le tapis rouge du Teatro Victoria Eugenia, il y a généralement du public. Consulte les horaires et arrive tôt."
    - p: "Que faire d'autre à Saint-Sébastien ?"
      r: "Se promener le long de la baie de La Concha, goûter les pintxos dans la Parte Vieja et visiter le mont Igueldo."
semana-santa-sevilla:
  texto:
    - "La Semaine sainte de Séville est probablement la plus célèbre d'Espagne. Pendant huit jours, une soixantaine de confréries parcourent la ville avec leurs pasos du Christ et de la Vierge, accompagnées de nazarenos, de fanfares et de milliers de personnes dans les rues."
    - "Toutes les confréries passent par la Carrera Oficial, qui va de la Campana à la cathédrale. La nuit du Jeudi au Vendredi saints est la Madrugá, la plus intense en émotion et en affluence, avec des confréries comme El Silencio, El Gran Poder, La Macarena, Los Gitanos et La Esperanza de Triana."
    - "C'est une fête massive : les rues du centre se remplissent et les cortèges mettent des heures à passer. Télécharge le programme officiel, choisis les confréries que tu veux voir et arrive en avance. Réserve ton hébergement des mois à l'avance, utilise les transports en commun et sois patient face aux rues coupées. Et n'oublie pas : c'est un acte religieux, alors respecte le silence et les nazarenos."
  faq:
    - p: "Quand a lieu la Semaine sainte de Séville ?"
      r: "Du dimanche des Rameaux au dimanche de la Résurrection, qui change chaque année entre mars et avril. Consulte le calendrier officiel pour les dates exactes."
    - p: "Qu'est-ce que la Madrugá ?"
      r: "C'est la nuit entre le Jeudi saint et le Vendredi saint. Plusieurs des confréries les plus emblématiques sortent à ces heures-là, et c'est le moment de plus grande affluence et de plus forte émotion."
    - p: "Où voir les processions ?"
      r: "Dans la Carrera Oficial (de la Campana à la cathédrale), il y a beaucoup d'ambiance mais aussi beaucoup de monde. D'autres zones du centre ou des quartiers, comme Triana, permettent de les voir plus tranquillement."
    - p: "Faut-il réserver ?"
      r: "Pas pour voir les processions depuis la rue, mais oui pour l'hébergement et les restaurants, qui affichent complet des mois à l'avance."
    - p: "Comment consulter les horaires ?"
      r: "Le Consejo de Hermandades y Cofradías publie le programme officiel avec les itinéraires et les horaires de chaque confrérie. Il existe aussi des applications et des sites avec suivi en temps réel."
    - p: "Que faut-il apporter ou prendre en compte ?"
      r: "Des chaussures confortables, des vêtements en couches et de la patience. Respecte le silence, ne traverse pas entre les cortèges et évite le flash près des pasos."
fallas:
  texto:
    - "Les Fallas sont les fêtes de Valence en l'honneur de saint Joseph, du 15 au 19 mars. Inscrites au patrimoine culturel immatériel de l'humanité par l'UNESCO, elles mêlent monuments en carton et en bois, pyrotechnie, musique, poudre et beaucoup de vie dans la rue."
    - "Les fallas sont d'énormes monuments satiriques plantés dans les rues le 15. Tu peux les parcourir à pied, et les plus importantes se disputent des prix. Chaque jour à 14h00, la mascletà, une symphonie de poudre sur la place de l'Hôtel de Ville, est un rendez-vous incontournable. Les 17 et 18 a lieu l'Offrande de fleurs à la Vierge des Délaissés."
    - "La fin arrive la nuit du 19 mars avec la cremà : les fallas brûlent, en commençant par les enfantines et en terminant par la grande, à minuit. Réserve ton hébergement des mois à l'avance, utilise les transports en commun et arrive tôt pour avoir une place à la mascletà. Fais attention aux pétards dans la rue et aux jeunes enfants."
  faq:
    - p: "Quand ont lieu les Fallas ?"
      r: "Du 15 au 19 mars chaque année. La plantà a lieu le 15 et la cremà la nuit du 19."
    - p: "Qu'est-ce que la mascletà ?"
      r: "C'est un spectacle de poudre qui joue sur le son et la puissance plus que sur les couleurs. Elle est tirée chaque jour à 14h00 sur la place de l'Hôtel de Ville et on la ressent dans tout le corps."
    - p: "Qu'est-ce que la cremà ?"
      r: "C'est l'incendie des fallas la nuit du 19 mars, avec la combustion finale de la falla municipale à minuit."
    - p: "Comment se déplacer à Valence pendant les Fallas ?"
      r: "À pied et en transports en commun. Il y a des coupures de circulation et se garer est presque impossible. Le métro renforce son service."
    - p: "Que mange-t-on ?"
      r: "Des beignets de potiron avec du chocolat, de la paella et des sandwichs de rue. Les beignets sont la saveur typique de ces fêtes."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Oui, il y a des fallas enfantines et des activités, mais le bruit des pétards et la foule peuvent être éprouvants pour les plus petits."
semana-santa:
  texto:
    - "La Semaine sainte est la semaine qui précède le dimanche de la Résurrection, du dimanche des Rameaux au dimanche de Pâques, et c'est l'une des célébrations les plus intenses et les plus visitées d'Espagne. Confréries et hermandades sortent dans la rue leurs pasos et leurs images lors de processions qui mêlent foi, art, musique et tradition."
    - "Chaque ville a son propre style. À Séville et à Málaga, ce sont les grands tronos et les dais qui se démarquent ; à Valladolid, Zamora ou Salamanque, les processions sont plus sobres, avec une imagerie castillane ; et dans des lieux comme Cuenca ou Murcie, il y a des coutumes très particulières. Beaucoup sont des Fêtes d'intérêt touristique international."
    - "Comme les dates dépendent de Pâques, elles changent chaque année, entre mars et avril. Si tu comptes voyager, réserve ton hébergement très longtemps à l'avance et consulte les itinéraires et horaires officiels de chaque confrérie, publiés quelques semaines avant. Les processions sont des actes religieux : respecte le silence, ne traverse pas entre les cortèges et évite les flashs au passage des pasos."
  faq:
    - p: "Quand a lieu la Semaine sainte ?"
      r: "C'est la semaine qui précède le dimanche de la Résurrection, dont la date change chaque année entre fin mars et fin avril. Elle va du dimanche des Rameaux au dimanche de Pâques."
    - p: "Où voir les plus belles processions ?"
      r: "Séville, Málaga, Valladolid, Zamora, Salamanque, Cuenca, Murcie et Carthagène sont parmi les plus connues, chacune avec un style très différent. Beaucoup sont des Fêtes d'intérêt touristique international."
    - p: "Faut-il payer pour voir les processions ?"
      r: "Non. On les voit gratuitement depuis la rue. Dans certaines villes, il y a des chaises payantes sur la Carrera Oficial ou sur certains tronçons."
    - p: "Quels jours y a-t-il le plus de processions ?"
      r: "Le Jeudi saint et le Vendredi saint sont généralement les jours de plus grande affluence, et les nuits les plus animées sont celles qui séparent les deux, dans des villes comme Séville. Le dimanche des Rameaux et le Samedi saint ont aussi leurs processions."
    - p: "Comment m'organiser pour les voir ?"
      r: "Consulte le programme officiel de chaque confrérie, avec ses horaires et ses itinéraires, arrive en avance pour trouver une bonne place et arme-toi de patience : les cortèges avancent lentement et les rues sont fermées à la circulation."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Oui, mais avec précaution : il y a beaucoup de monde et de longues heures d'attente. Choisis des processions de l'après-midi, trouve un endroit avec de l'espace et explique-leur qu'il s'agit d'un acte de respect."
feria-abril:
  texto:
    - "La Feria de Abril de Séville est une semaine de fête avec des casetas, des sevillanas, des chevaux et des calèches, et des robes de flamenca. Elle se déroule au Real de la Feria, dans le quartier de Los Remedios, environ deux semaines après la Semaine sainte."
    - "La feria s'ouvre avec l'Alumbrado, le lundi soir, quand s'allument les milliers d'ampoules de la façade monumentale. Pendant la semaine, dès midi, il y a un défilé de chevaux et de calèches ; ensuite, les casetas se remplissent de musique, de danse, de nourriture et de boissons : rebujito, fino, jambon et poisson frit. Le dimanche, la fête se clôt par un feu d'artifice."
    - "Une chose à savoir : la plupart des casetas sont privées et seuls y entrent ceux qui ont une invitation ou qui sont membres. Il existe aussi des casetas publiques et certaines de la mairie, ouvertes à tous, et on peut parcourir librement les rues et le Real. On s'habille en général avec élégance : robe de flamenca pour elles, traje corto ou costume pour eux."
  faq:
    - p: "Quand a lieu la Feria de Abril ?"
      r: "Elle commence normalement deux semaines après le dimanche de la Résurrection, entre avril et mai. Elle dure une semaine, avec l'Alumbrado le lundi soir."
    - p: "Puis-je entrer dans n'importe quelle caseta ?"
      r: "Non. La plupart sont privées et on n'y entre qu'avec une invitation ou en étant membre. Il y a des casetas publiques et de la mairie ouvertes à tout le monde."
    - p: "Combien coûte l'entrée à la feria ?"
      r: "L'entrée dans l'enceinte est gratuite. Tu paies ce que tu consommes, et les attractions de la calle del Infierno sont payantes."
    - p: "Que faut-il porter ?"
      r: "Beaucoup de visiteurs portent une robe de flamenca ou un traje corto, mais ce n'est pas obligatoire. Le plus important, ce sont des chaussures confortables, car on marche beaucoup."
    - p: "Comment s'y rendre ?"
      r: "En métro, en tramway ou en bus. Évite de venir en voiture : se garer est presque impossible et les abords sont fermés à la circulation."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "En journée, oui, avec le défilé de chevaux et des casetas familiales. La calle del Infierno propose des attractions. Le soir, il y a plus de monde et plus de bruit."
san-fermin:
  texto:
    - "Les Sanfermines sont les fêtes de Pampelune, du 6 au 14 juillet, et l'une des célébrations les plus connues au monde. Elles commencent par le chupinazo sur la place de l'Hôtel de Ville, à midi le 6 juillet, et se terminent à minuit le 14 avec le Pobre de mí."
    - "Le grand symbole, ce sont les encierros (lâchers de taureaux) : chaque matin, à huit heures, les taureaux courent sur un parcours d'environ 850 mètres depuis le corral de Santo Domingo jusqu'aux arènes. Mais les Sanfermines, c'est bien plus que cela : procession de saint Firmin le 7 juillet, géants et grosses têtes, concerts, feux d'artifice, tenue blanche avec foulard rouge et une ambiance de rue de jour comme de nuit."
    - "Courir l'encierro est dangereux et obéit à des règles : il faut être majeur, ne pas avoir bu d'alcool et respecter les consignes de l'organisation. Si tu préfères le voir, tu peux le faire à la télévision ou depuis un point aménagé, qui se remplit très tôt. Réserve ton hébergement des mois à l'avance, car les prix grimpent et la ville se remplit."
  faq:
    - p: "Quand ont lieu les Sanfermines ?"
      r: "Du 6 au 14 juillet chaque année. Elles débutent avec le chupinazo le 6 à midi et se terminent avec le Pobre de mí à minuit le 14."
    - p: "À quelle heure ont lieu les encierros ?"
      r: "Chaque matin à 8h00, du 7 au 14 juillet. Il ne dure que quelques minutes."
    - p: "Comment voir un encierro ?"
      r: "À la télévision, ou en direct depuis des zones aménagées, qui se remplissent très tôt. Sur certains balcons, il y a des places payantes. Les points avec vue sur le parcours sont pris dès avant l'aube."
    - p: "N'importe qui peut-il courir ?"
      r: "Non. Il faut être majeur, ne pas être sous l'effet de l'alcool ou d'autres substances, et respecter les règles de l'organisation. C'est une activité dangereuse et il y a des blessés chaque année."
    - p: "Quels vêtements porter ?"
      r: "Traditionnellement, des vêtements blancs avec un foulard rouge autour du cou et une ceinture rouge. Des chaussures confortables et fermées, et des vêtements de rechange, car tu seras presque sûrement tâché."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "L'ambiance de jour est familiale, avec géants, grosses têtes et activités pour enfants. La nuit, il y a beaucoup plus de monde. Il vaut mieux éviter les encierros et les zones les plus bondées."
tomatina:
  texto:
    - "La Tomatina est la plus grande bataille de tomates du monde. Elle a lieu à Buñol, un village de la province de Valence, le dernier mercredi d'août, et pendant environ une heure, des milliers de personnes se lancent des tomates mûres jusqu'à ce que les rues soient teintes en rouge."
    - "Pour participer, il te faut un billet. La mairie limite la capacité et vend les tickets à l'avance, il est donc préférable de les acheter tôt sur les canaux officiels et de se méfier de la revente. La fête commence avec le palo jabón, un mât graissé avec un jambon au sommet, et la bataille démarre quand une fusée est tirée vers 11 heures du matin."
    - "Mets de vieux vêtements et des chaussures que tu ne regretteras pas de perdre, des lunettes de natation pour protéger tes yeux et des gants. Écrase la tomate avant de la lancer pour ne pas faire mal, et ne jette rien d'autre que des tomates. N'apporte ni objets de valeur ni appareils photo, et pars tôt de Valence, par exemple en train ou dans les bus organisés pour ce jour-là."
  faq:
    - p: "Quand a lieu la Tomatina ?"
      r: "Le dernier mercredi d'août, à Buñol (Valence). La bataille dure environ une heure, à partir de 11 heures du matin."
    - p: "Faut-il un billet ?"
      r: "Oui. La capacité est limitée et les billets s'achètent à l'avance via les canaux officiels. Évite d'acheter à des revendeurs."
    - p: "Comment aller à Buñol ?"
      r: "Depuis Valence, en train de banlieue (Cercanías) ou en bus. Il vaut mieux partir tôt, car le jour de la fête il y a énormément de monde."
    - p: "Quels vêtements porter ?"
      r: "De vieux vêtements et des chaussures que tu ne regretteras pas de perdre. Beaucoup de participants utilisent des lunettes de natation pour protéger leurs yeux et des gants."
    - p: "Quelles sont les règles ?"
      r: "Écrase la tomate avant de la lancer, ne lance rien d'autre que des tomates, n'apporte ni objets en verre ni objets de valeur et suis les consignes de l'organisation."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Il y a un âge minimum pour participer et la fête est très fréquentée. Consulte les conditions officielles avant d'acheter des billets."
san-juan:
  texto:
    - "La nuit de la Saint-Jean, la veille du 24 juin, est l'une des célébrations les plus anciennes liées au solstice d'été. Dans toute l'Espagne, on allume des feux de joie, on fait des rituels pour formuler des vœux et on organise des fêtes sur les plages, les places et dans les montagnes."
    - "Parmi les plus connues, celles de La Corogne, avec des feux sur les plages de Riazor et d'El Orzán, les Hogueras d'Alicante, Fête d'intérêt touristique international, la Revetlla de Sant Joan en Catalogne avec ses pétards et sa coca de Sant Joan, et les fêtes du feu du solstice dans les Pyrénées, reconnues par l'UNESCO."
    - "La coutume veut qu'on saute par-dessus le feu, qu'on se baigne à minuit ou qu'on écrive un vœu sur un papier pour le brûler. Fais-le en toute sécurité : n'utilise que les feux autorisés, n'allume pas de feu de ton côté dans les zones à risque, surveille les enfants avec les pétards et sois très prudent avec la baignade nocturne. Et ne laisse pas de déchets sur la plage."
  faq:
    - p: "Quand a lieu la nuit de la Saint-Jean ?"
      r: "La nuit du 23 au 24 juin, le 24 étant férié dans certaines communautés autonomes."
    - p: "Où voir les feux de joie ?"
      r: "La Corogne, Alicante, Barcelone, Cadix et de nombreuses plages du littoral organisent des célébrations très populaires. Consulte le programme de chaque mairie."
    - p: "Peut-on allumer des feux ?"
      r: "Uniquement là où c'est autorisé. Sur de nombreuses plages et dans de nombreuses zones forestières, il est interdit d'allumer un feu de son propre chef, avec un risque d'amende et d'incendie."
    - p: "Quels rituels pratique-t-on ?"
      r: "Sauter par-dessus le feu, faire des vœux, écrire sur un papier ce que tu veux laisser derrière toi pour le brûler, et se baigner à minuit. Chaque région a ses coutumes."
    - p: "Est-il sûr de se baigner la nuit ?"
      r: "Il y a un risque, surtout avec l'alcool et peu de visibilité. Baigne-toi uniquement sur des plages surveillées, accompagné et sans t'éloigner du bord."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Oui, il y a beaucoup d'activités familiales, mais il faut surveiller le feu et les pétards, et éviter les heures de plus grande affluence."
batalla-vino:
  texto:
    - "La Batalla del Vino de Haro est une fête unique : chaque 29 juin, des milliers de personnes se lancent du vin rouge aux Riscos de Bilibio, à quelques kilomètres de Haro, en La Rioja. C'est une célébration de la Saint-Pierre qui mêle tradition religieuse, vin et beaucoup d'humour."
    - "La journée commence par une procession depuis le village jusqu'aux Riscos de Bilibio et une messe à l'ermitage de San Felices. Ensuite, la bataille commence, avec des seaux, des pistolets, des gourdes de vin et des arrosoirs, et des milliers de litres de vin sont vidés. Presque tout le monde s'habille en blanc et porte un foulard violet."
    - "Mets des vêtements blancs que tu ne crains pas d'abîmer, des chaussures confortables qui peuvent être mouillées et des lunettes pour protéger tes yeux. N'emporte ni objets de valeur ni appareils photo qui pourraient être tachés, et garde à l'esprit que la fête est très fréquentée. Réserve ton hébergement et ton transport à l'avance et bois avec modération."
  faq:
    - p: "Quand a lieu la Batalla del Vino ?"
      r: "Chaque 29 juin, jour de la Saint-Pierre, aux Riscos de Bilibio, près de Haro (La Rioja)."
    - p: "Quels vêtements porter ?"
      r: "Des vêtements blancs que tu ne crains pas d'abîmer et des chaussures confortables. De nombreux participants utilisent des lunettes de natation et un foulard violet."
    - p: "Comment s'y rendre ?"
      r: "Depuis Haro, la plupart des gens y vont à pied en procession ou en transport organisé. Évite de prendre la voiture, car le stationnement est compliqué."
    - p: "Faut-il un billet ?"
      r: "En général, c'est une fête populaire en accès libre, mais il vaut mieux consulter les conditions et le programme de la mairie de Haro."
    - p: "Est-ce sûr ?"
      r: "C'est une fête très fréquentée et il y a du vin, donc il faut être prudent, protéger ses yeux et ne pas y aller seul."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Elle est très fréquentée et on y est trempé, donc elle n'est généralement pas recommandée pour les jeunes enfants."
romeria-rocio:
  texto:
    - "La Romería del Rocío est l'un des pèlerinages les plus massifs d'Espagne. Des centaines de milliers de personnes voyagent à pied, à cheval et en charrettes, depuis différents points d'Andalousie, jusqu'au hameau d'El Rocío, à Almonte (Huelva), à la Pentecôte."
    - "Les pèlerins, organisés en confréries, parcourent pendant des jours les chemins de Doñana, entre chants, prières, danses et convivialité. Le point culminant arrive à l'aube du lundi de Pentecôte, quand les habitants d'Almonte franchissent la grille et sortent la Vierge du Rocío en procession."
    - "Si tu veux le vivre sans être pèlerin, tu peux visiter le hameau et voir passer les confréries et les charrettes. Les rues sont en sable et il y a beaucoup de monde, la chaleur est forte et les hébergements et les places de stationnement sont vite complets. Prends de l'eau, des chaussures confortables et beaucoup de patience, et respecte le caractère religieux de la romería ainsi que l'environnement naturel de Doñana."
  faq:
    - p: "Quand a lieu la Romería del Rocío ?"
      r: "À la Pentecôte, 50 jours après le dimanche de Pâques, normalement entre mai et juin. Le jour principal est le lundi."
    - p: "Où a-t-elle lieu ?"
      r: "Dans le hameau d'El Rocío, à Almonte (Huelva), au bord du parc national de Doñana."
    - p: "Qu'est-ce que le salto de la reja ?"
      r: "C'est le moment où les habitants d'Almonte franchissent la grille qui protège la Vierge pour la sortir en procession, à l'aube du lundi de Pentecôte."
    - p: "Peut-on y aller sans être pèlerin ?"
      r: "Oui, mais l'accès est compliqué : il y a beaucoup de monde, peu de places de stationnement et des rues en sable. Renseigne-toi à l'avance sur la façon d'y aller et sur d'éventuelles restrictions de circulation."
    - p: "Que faut-il emporter ?"
      r: "De l'eau, un chapeau, de la crème solaire, des chaussures confortables et des vêtements adaptés à la chaleur de la journée et à la fraîcheur de la nuit. Respecte l'environnement naturel et ne laisse pas de déchets."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Avec prudence : il fait très chaud, il y a beaucoup de monde et les trajets sont longs. Mieux vaut visiter le hameau aux heures de moindre affluence."
feria-malaga:
  texto:
    - "La Feria de Málaga, à la mi-août, est l'une des foires les plus animées du sud : une semaine de musique, de danse, de casetas, de feux d'artifice et de vin doux. Elle se déroule sur deux sites : la Feria del Centro, de jour, et la Feria de Cortijo de Torres, de nuit."
    - "Pendant la journée, le centre historique se remplit de peñas, de musique, de fandangos verdiales et de gens habillés en gitane ou en tenue traditionnelle courte. La nuit, l'enceinte de Cortijo de Torres rassemble casetas, attractions, concerts et une ambiance du tonnerre. Il y a des activités pour tous les publics, et beaucoup de pescaíto frito et de vin de Málaga."
    - "Va au centre le jour et à l'enceinte la nuit. Évite la voiture et utilise les bus ou le transport public de la feria, car la circulation et le stationnement sont compliqués. Prends des chaussures confortables, des vêtements légers et de la patience, et réserve ton hébergement à l'avance."
  faq:
    - p: "Quand a lieu la Feria de Málaga ?"
      r: "À la mi-août, pendant une semaine. Les dates exactes changent chaque année."
    - p: "Qu'est-ce que la Feria del Centro ?"
      r: "La partie diurne de la feria, dans le centre historique, avec de la musique, de la danse et une ambiance populaire."
    - p: "Qu'est-ce que Cortijo de Torres ?"
      r: "L'enceinte où se déroule la feria de nuit, avec des casetas, des concerts et des attractions."
    - p: "Comment aller à Cortijo de Torres ?"
      r: "En bus et avec des services spéciaux de la feria. Évite la voiture, car le stationnement est difficile."
    - p: "Que mange-t-on et que boit-on ?"
      r: "Du pescaíto frito, des espetos, du jambon et du vin doux de Málaga, entre autres."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "De jour et dans le centre, oui. La nuit, il y a beaucoup de monde et de bruit."
fiesta-santiago-apostol:
  texto:
    - "Les Fiestas del Apóstol Santiago célèbrent le jour du saint patron de l'Espagne et de la Galice, le 25 juillet, qui est aussi la Fête nationale de la Galice. Elles ont lieu à Saint-Jacques-de-Compostelle, pendant une semaine d'actes religieux, de concerts, d'activités populaires et de grande animation."
    - "Deux moments se distinguent : la veille, la nuit du 24 juillet, avec le spectacle de feux d'artifice devant la façade de l'Obradoiro de la cathédrale, et le 25 juillet, avec l'Offrande nationale à l'Apôtre dans la cathédrale. Quand le 25 juillet tombe un dimanche, on célèbre l'Année sainte compostellane, avec encore plus d'afflux de pèlerins."
    - "Saint-Jacques se remplit de visiteurs, de pèlerins et de touristes à ces dates. Réserve ton hébergement à l'avance, consulte le programme officiel et arrive tôt sur la place de l'Obradoiro si tu veux voir les feux d'artifice. Prends des chaussures confortables et un imperméable, car en Galice le temps change vite."
  faq:
    - p: "Quand ont lieu les Fiestas del Apóstol ?"
      r: "Autour du 25 juillet, avec la veille, le 24, comme nuit de feux d'artifice."
    - p: "Que sont les feux d'artifice de l'Apôtre ?"
      r: "Un spectacle pyrotechnique qui a lieu la nuit du 24 juillet devant la façade de l'Obradoiro de la cathédrale."
    - p: "Qu'est-ce que l'Offrande nationale ?"
      r: "Un acte religieux et officiel qui a lieu le 25 juillet dans la cathédrale, avec une offrande à l'Apôtre saint Jacques."
    - p: "Qu'est-ce que l'Année sainte ?"
      r: "Une année jubilaire compostellane célébrée quand le 25 juillet tombe un dimanche. Elle attire beaucoup plus de pèlerins."
    - p: "Faut-il réserver son hébergement ?"
      r: "Oui, très longtemps à l'avance, car Saint-Jacques est pleine à ces dates."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Oui, il y a des activités familiales, mais les feux d'artifice et les foules de l'Obradoiro sont très fréquentés."
