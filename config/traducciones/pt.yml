castanas-otono:
  imagen_alt: "Chão de um souto no outono coberto de folhas douradas e ouriços de castanha"
  texto:
    - "Quando chega outubro, os soutos do norte e do centro da península enchem-se de ouriços caídos entre as folhas. Ir apanhar castanhas é um dos programas de outono mais simples e mais gratificantes: um passeio tranquilo pelo monte, um cesto que se vai enchendo e, ao voltar, algo saboroso para assar em casa."
    - "A época começa, consoante a altitude e o ano, por meados de outubro e prolonga-se até bem entrado novembro. Os melhores soutos costumam estar em zonas de montanha com clima húmido: El Bierzo (León), o Valle del Genal (Málaga), a Sierra de Francia (Salamanca), o Valle del Tiétar (Ávila), além de boa parte da Galiza e das Astúrias."
    - "O mais importante é saber de quem é o souto. Muitos são propriedades privadas, com um dono que cuida delas e as vende, e apanhar castanhas nelas sem autorização pode ter consequências. Pergunta na aldeia, na câmara municipal ou numa casa rural da zona: é habitual que alguém te indique onde se pode apanhar ou te ponha em contacto com um proprietário."
    - "Leva calçado fechado que tenha boa aderência, luvas grossas (os ouriços picam a sério), um cesto ou um saco e roupa que não te importes de sujar. As castanhas caem sozinhas quando estão maduras: o normal é apanhar as do chão, sem varejar as árvores nem as danificar. Os dias seguintes à chuva e ao vento costumam ser os mais generosos."
    - "Já em casa, faz um corte na casca de cada castanha antes de a assar ou cozer, para que não rebentem. Conservam-se melhor num local fresco ou no frigorífico, e convém consumi-las em poucos dias. O remate natural deste programa é um magosto: castanhas assadas, fogueira e vinho novo."
  mapa:
    titulo: "Onde ir apanhar castanhas"
    centro: [40.0, -5.0]
    zoom: 6
    puntos:
      - { nombre: "El Bierzo (León)", lat: 42.55, lon: -6.6, desc: "Soutos centenários de Las Médulas e dos vales próximos; berço do magosto." }
      - { nombre: "Valle del Genal (Málaga)", lat: 36.57, lon: -5.17, desc: "Serranía de Ronda: Igualeja, Pujerra, Genalguacil e Júzcar, com castanheiros por todo o vale." }
      - { nombre: "Sierra de Francia (Salamanca)", lat: 40.485, lon: -6.108, desc: "Zona de La Alberca e Miranda del Castañar, com soutos nas encostas." }
      - { nombre: "Valle del Tiétar (Ávila)", lat: 40.2, lon: -5.1, desc: "Arenas de San Pedro, Candeleda e Guisando, aos pés de Gredos." }
      - { nombre: "Sierra de Aracena (Huelva)", lat: 37.89, lon: -6.56, desc: "Os soutos de Huelva, em Castaño del Robledo e Galaroza." }
  faq:
    - p: "Quando é a época das castanhas?"
      r: "Em Espanha, de meados de outubro a meados de novembro, aproximadamente. Nas zonas baixas começa mais cedo e nas mais altas atrasa-se alguns dias. Se quiseres acertar, pergunta pela zona na semana anterior: a colheita muda de um ano para o outro consoante a chuva e o calor do verão."
    - p: "Pode-se apanhar castanhas em qualquer monte?"
      r: "Nem sempre. Muitos soutos são propriedade privada e, em monte público, cada câmara municipal ou comunidade pode ter as suas próprias regras. Pergunta na câmara municipal ou aos vizinhos antes de apanhar e não entres em propriedades vedadas."
    - p: "Onde ir apanhar castanhas?"
      r: "Os destinos clássicos são El Bierzo (León), o Valle del Genal (Málaga), a Sierra de Francia (Salamanca) e o Valle del Tiétar (Ávila), além da Galiza, das Astúrias e da zona de Aracena. Todos têm soutos muito extensos e muita tradição."
    - p: "O que é preciso levar?"
      r: "Luvas grossas, calçado fechado, um cesto ou saco e roupa quente que não te importes de sujar. Os ouriços abrem-se pisando-os com a sola do sapato, sem necessidade de ferramentas."
    - p: "Como se assam as castanhas?"
      r: "Faz um corte na casca de cada uma, coloca-as numa frigideira própria com furos, no forno ou numa grelha, e deixa-as 20 a 30 minutos até a casca se abrir. Embrulha-as uns minutos num pano para que continuem a cozinhar com o seu próprio vapor e se descasquem melhor."
    - p: "É um bom programa com crianças?"
      r: "Sim, embora com cuidado: os ouriços picam. Dá-lhes luvas e ensina-as a não meter a mão sem olhar. Para elas, é uma atividade que mistura passeio, brincadeira e recompensa."
    - p: "O que é um magosto?"
      r: "É a festa tradicional de outono da Galiza, das Astúrias e de El Bierzo: assam-se castanhas numa fogueira e comem-se com vinho novo ou sidra, sobretudo por São Martinho, a 11 de novembro."
setas:
  imagen_alt: "Mãos a apanhar um boleto no bosque, com um cesto de vime cheio de cogumelos"
  texto:
    - "Com as primeiras chuvas de outono, os pinhais, carvalhais e soutos enchem-se de cogumelos, e sair à sua procura torna-se um dos programas mais esperados do ano. É a desculpa perfeita para passar a manhã no monte, com o cesto cheio ou não."
    - "A época forte vai de outubro a novembro, embora dependa muito da chuva e das temperaturas: depois de umas semanas húmidas e sem geadas, o monte arranca. Províncias como Soria, o Pirenéu, León, Zamora, a Sierra de Gredos ou a Catalunha são clássicos, e em muitas há percursos micológicos e jornadas organizadas."
    - "Antes de sair, informa-te sobre a regulamentação da zona. Várias comunidades exigem uma licença ou autorização de colheita (em Castela e Leão, por exemplo, funciona o sistema Micocyl), e existem limites de quantidade, zonas vedadas e horários. As regras mudam de um sítio para o outro, por isso consulta o site da câmara municipal ou da comunidade autónoma."
    - "Se não tens experiência, a regra de ouro é não comer nenhum cogumelo que não tenhas identificado com segurança. O mais sensato para começar é inscreveres-te numa saída guiada ou numa jornada micológica com um especialista, e levar um guia de campo. Apanha com um cesto de vime, que deixa cair os esporos e permite que o exemplar respire, e corta ou extrai com cuidado, sem devastar o terreno."
  mapa:
    titulo: "Onde ir apanhar cogumelos"
    centro: [41.2, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Pinhais de Soria", lat: 41.95, lon: -2.75, desc: "Vinuesa, Covaleda e Duruelo de la Sierra, com a Micocyl como sistema de licenças." }
      - { nombre: "Pirenéu (Valle de Arán)", lat: 42.7, lon: 0.8, desc: "Bosques húmidos de abeto e faia no Pirenéu de Lleida." }
      - { nombre: "Montanha de León", lat: 42.95, lon: -5.1, desc: "Riaño, Babia e Luna, com carvalhais e faiais." }
      - { nombre: "Sanabria (Zamora)", lat: 42.1, lon: -6.7, desc: "Pinhais e soutos em redor do lago de Sanabria." }
      - { nombre: "Sierra de Gredos (Ávila)", lat: 40.3, lon: -5.2, desc: "Pinhais e carvalhais do Valle del Tiétar e do Barranco." }
      - { nombre: "Solsonès (Catalunha)", lat: 42.0, lon: 1.5, desc: "Pinhais e bosques mistos com muita tradição micológica." }
  faq:
    - p: "Quando é a época dos cogumelos?"
      r: "Em Espanha, a época principal vai de outubro a novembro, embora em algumas zonas se prolongue até dezembro ou comece em setembro. Depende da chuva, da altitude e da temperatura: depois de várias semanas húmidas e sem geadas, o monte arranca."
    - p: "Onde procurar cogumelos?"
      r: "Soria, o Pirenéu, os montes de León e Zamora, a Sierra de Gredos ou a Catalunha são destinos clássicos. O mais prático é perguntar no posto de turismo ou numa casa rural da zona, onde costumam conhecer os percursos e a regulamentação em vigor."
    - p: "É preciso licença para apanhar cogumelos?"
      r: "Em muitas zonas, sim. Várias comunidades autónomas exigem uma licença ou autorização de colheita, e pode haver limites de quantidade e zonas vedadas. Informa-te sempre antes de sair no site da câmara municipal ou da comunidade autónoma."
    - p: "Como sei se um cogumelo é comestível?"
      r: "Não confies em truques populares: só se pode comer um cogumelo se o tiveres identificado com certeza. Se tiveres dúvidas, não o apanhes. Uma saída guiada ou uma jornada micológica é a forma mais segura de aprender e, em caso de intoxicação, é preciso ir às urgências ou ligar para o 112."
    - p: "O que é preciso levar?"
      r: "Um cesto de vime, um canivete, um guia de identificação, calçado de montanha, roupa quente, água e algo para comer. Evita os sacos de plástico, que estragam os cogumelos e não deixam cair os esporos."
    - p: "É um bom programa com crianças?"
      r: "Sim, desde que vão acompanhadas e saibam que não se toca nem se come nada sem que um adulto o verifique. Os mais pequenos gostam muito da busca, mas convém escolher percursos simples e ter atenção para que não levem as mãos à boca."
hayedos:
  imagen_alt: "Caminho coberto de folhas entre faias com as cores do outono e algum nevoeiro ao fundo"
  texto:
    - "Durante umas poucas semanas de outono, os faiais passam do verde ao amarelo, ao laranja e ao acobreado, e o chão cobre-se de folhas. É um dos espetáculos naturais mais fotogénicos de Espanha e um programa perfeito para caminhar sem pressa entre troncos prateados."
    - "O melhor momento costuma ser entre meados de outubro e meados de novembro, embora o pico de cor mude a cada ano consoante o frio, a chuva e o vento. Entre os faiais mais conhecidos estão a Selva de Irati (Navarra), o Hayedo de Montejo (Madrid), o Hayedo de la Tejera Negra (Guadalajara) e o de Otzarreta (Bizkaia), além dos da Cantábria, das Astúrias e do Pirenéu."
    - "Atenção às quotas: alguns faiais, como o de Montejo, limitam o número de visitantes ou exigem reserva ou autorização de acesso, sobretudo nos fins de semana de cor máxima. Consulta antes o site do espaço protegido e, se puderes, vai durante a semana: haverá menos gente e mais silêncio."
    - "Leva calçado confortável que tenha aderência em folhas molhadas, um casaco quente e um impermeável, porque no faial a humidade é habitual, e não saias dos trilhos sinalizados. As manhãs com algum nevoeiro e a luz baixa do fim da tarde são as melhores para fotografar."
  mapa:
    titulo: "Onde ver um faial no outono"
    centro: [42.0, -2.5]
    zoom: 7
    puntos:
      - { nombre: "Selva de Irati (Navarra)", lat: 42.98, lon: -1.1, desc: "Um dos maiores bosques de faias e abetos da Europa, entre Ochagavía e Orbaizeta." }
      - { nombre: "Hayedo de Montejo (Madrid)", lat: 41.12, lon: -3.5, desc: "O faial mais a sul da Europa; acesso com quota e reserva." }
      - { nombre: "Hayedo de la Tejera Negra (Guadalajara)", lat: 41.15, lon: -3.15, desc: "Na serra de Ayllón, junto a Cantalojas, com percursos sinalizados." }
      - { nombre: "Hayedo de Otzarreta (Bizkaia)", lat: 43.03, lon: -2.78, desc: "No Parque Natural de Gorbeia, um dos mais fotografados." }
      - { nombre: "Saja-Besaya (Cantábria)", lat: 43.1, lon: -4.2, desc: "Faiais extensos no Parque Natural, com bons percursos de outono." }
      - { nombre: "Redes (Astúrias)", lat: 43.17, lon: -5.3, desc: "Faiais de montanha no Parque Natural de Redes." }
      - { nombre: "Selva de Oza (Huesca)", lat: 42.85, lon: -0.75, desc: "Faiais e abetais do Pirenéu aragonês, no vale de Hecho." }
  faq:
    - p: "Quando é o melhor momento para ver um faial no outono?"
      r: "Entre meados de outubro e meados de novembro, com um pico de cor que costuma durar umas duas ou três semanas. Varia a cada ano com o frio e a chuva, por isso convém consultar o boletim do espaço protegido ou as redes sociais dos centros de visitantes."
    - p: "Quais são os melhores faiais de Espanha?"
      r: "A Selva de Irati (Navarra), o Hayedo de Montejo (Madrid), o Hayedo de la Tejera Negra (Guadalajara) e o de Otzarreta (Bizkaia) são os mais conhecidos. Destacam-se também os da Cantábria, das Astúrias e do Pirenéu."
    - p: "É preciso reservar ou pedir autorização?"
      r: "Em alguns, sim. O Hayedo de Montejo, por exemplo, limita as visitas e exige autorização e, noutros espaços, há quotas ou parques de estacionamento que enchem nos fins de semana de cor máxima. Consulta o site do espaço protegido antes de ir."
    - p: "Pode-se ir com crianças ou com cão?"
      r: "Os percursos curtos e sinalizados são adequados para crianças. Com cão depende de cada espaço: em alguns são proibidos ou têm de ir com trela, por isso convém verificar antes."
    - p: "Que roupa e calçado levar?"
      r: "Calçado confortável que tenha aderência em folhas molhadas, roupa quente em camadas e um impermeável, porque a humidade e a temperatura descem depressa no bosque."
    - p: "Como evitar as multidões?"
      r: "Vai durante a semana, logo de manhã cedo ou ao fim da tarde, e evita as pontes e os fins de semana de cor máxima. Uma alternativa é escolher faiais menos conhecidos da mesma zona."
berrea:
  texto:
    - "No final do verão, os veados machos começam a bramar para atrair as fêmeas e desafiar os rivais. Esse rugido grave e poderoso, que ecoa pelo monte ao amanhecer e ao entardecer, é a berrea (a brama do veado), um dos espetáculos de fauna mais impressionantes de Espanha."
    - "A berrea concentra-se entre setembro e outubro, com o momento alto normalmente no final de setembro e início de outubro, embora varie consoante a zona e o ano. Os locais mais conhecidos são o Parque Nacional de Cabañeros, o Parque Nacional de Monfragüe, a Sierra de Andújar, a Reserva Nacional de Riaño e a Sierra de la Culebra, entre outros."
    - "O melhor é chegar antes do amanhecer ou um pouco antes de anoitecer, quando os veados estão mais ativos, e escutar em silêncio a partir de um ponto de observação. Leva binóculos, roupa quente e de cores discretas, e não uses lanternas nem flash. Os veados no cio são imprevisíveis: mantém sempre a distância e não te aproximes deles."
    - "Em alguns espaços há percursos guiados, observatórios ou acessos regulados durante a berrea, e convém reservar com antecedência. Consulta o site do espaço protegido ou do centro de visitantes antes de ir."
  mapa:
    titulo: "Onde escutar a berrea"
    centro: [40.0, -5.0]
    zoom: 6
    puntos:
      - { nombre: "Parque Nacional de Cabañeros (Ciudad Real)", lat: 39.4, lon: -4.5, desc: "Rañas (planícies) e monte mediterrânico com grandes populações de veado; visitas guiadas durante a berrea." }
      - { nombre: "Parque Nacional de Monfragüe (Cáceres)", lat: 39.83, lon: -6.05, desc: "Montado e rochedos com vários miradouros para escutar ao amanhecer." }
      - { nombre: "Sierra de Andújar (Jaén)", lat: 38.25, lon: -4.0, desc: "Um dos melhores locais do sul; muito concorrido, convém reservar." }
      - { nombre: "Reserva Nacional de Riaño (León)", lat: 42.98, lon: -5.0, desc: "Berrea de montanha, entre faiais e carvalhais dos Picos de Europa leoneses." }
      - { nombre: "Sierra de la Culebra (Zamora)", lat: 41.85, lon: -6.2, desc: "Extensa reserva de caça com muito veado e algum lobo." }
  faq:
    - p: "Quando é a berrea do veado?"
      r: "Entre setembro e outubro. O momento de maior atividade costuma ser no final de setembro e início de outubro, embora mude consoante a zona e o ano. O melhor é sair ao amanhecer ou ao entardecer."
    - p: "Onde ver a berrea?"
      r: "Os locais mais conhecidos são Cabañeros, Monfragüe, a Sierra de Andújar, a Reserva Nacional de Riaño e a Sierra de la Culebra. Em muitos há percursos guiados, observatórios ou pontos de escuta sinalizados."
    - p: "O que é preciso levar?"
      r: "Binóculos, roupa quente e de cores discretas (verdes, castanhos, cinzentos), calçado confortável e algo para comer e beber. Nas horas de maior atividade está fresco, mesmo que o dia seja quente."
    - p: "É perigoso aproximar-se dos veados?"
      r: "Sim. Os machos no cio estão muito agressivos e são imprevisíveis. Não te aproximes, não os rodeies nem lhes cortes o caminho, e mantém a distância que indicarem os guias ou os cartazes."
    - p: "É preciso reservar?"
      r: "Em alguns espaços, sim, sobretudo para percursos guiados, observatórios ou acessos regulados em plena berrea. Consulta o site do espaço protegido ou do centro de visitantes antes de ir, porque as vagas esgotam."
    - p: "Pode-se ir com crianças?"
      r: "Sim, é um programa muito bonito para elas, mas é preciso ir em silêncio, a horas matinais e sem se afastar do grupo. Escolhe percursos simples e, de preferência, com um guia."
vendimia:
  texto:
    - "Setembro é o mês da vindima em boa parte de Espanha: os cachos maduros são cortados à mão ou à máquina e as adegas enchem-se de cheiro a mosto. Vivê-la de perto, entre vinhas e lagares, é um dos programas de fim de verão com mais encanto, e tem muito de festa."
    - "A data exata muda consoante a zona, a casta e o ano. As uvas brancas e as castas precoces costumam ser colhidas desde o final de agosto, e as tintas mais tardias podem prolongar-se até outubro. Regiões como La Rioja, a Ribera del Duero, Jerez, o Penedès, as Rías Baixas ou La Mancha organizam visitas, provas e atividades relacionadas."
    - "Muitas adegas oferecem experiências em que podes cortar cachos, pisar a uva ou ver como a colheita chega à adega, normalmente com reserva prévia e pagas. Há ainda festas dedicadas à vindima, como as de Jerez ou as de San Mateo em Logroño, com pisa da uva, oferendas do primeiro mosto e degustações."
    - "Se te inscreveres numa experiência na vinha, leva calçado fechado e confortável, boné, protetor solar e roupa que se possa manchar. É melhor ir logo de manhã cedo, quando está menos calor e se trabalha com mais tranquilidade."
  mapa:
    titulo: "Onde viver a vindima"
    centro: [40.0, -3.5]
    zoom: 6
    puntos:
      - { nombre: "La Rioja (Logroño)", lat: 42.4627, lon: -2.445, desc: "Rioja Alta e Rioja Baja, com as festas de San Mateo em Logroño e muitas adegas com visita." }
      - { nombre: "Ribera del Duero (Burgos e Valladolid)", lat: 41.62, lon: -3.9, desc: "Vinhas de tinto ao longo do Douro, com adegas abertas a visitas." }
      - { nombre: "Rías Baixas (Pontevedra)", lat: 42.51, lon: -8.81, desc: "Zona do alvarinho, com vindima precoce e adegas em redor de Cambados." }
      - { nombre: "Penedès (Barcelona)", lat: 41.3446, lon: 1.6988, desc: "Zona do cava e do vinho, com adegas e experiências de vindima em redor de Vilafranca." }
      - { nombre: "La Mancha (Ciudad Real)", lat: 39.0, lon: -3.2, desc: "A maior vinha de Espanha, com adegas e festas da vindima nas suas aldeias." }
      - { nombre: "Jerez (Cádiz)", lat: 36.6864, lon: -6.1377, desc: "Capital do vinho de Jerez, com a sua festa da vindima e adegas históricas." }
  faq:
    - p: "Quando é a vindima em Espanha?"
      r: "Depende da zona e da casta, mas a época principal vai do final de agosto a outubro, com setembro como mês central. As uvas brancas e precoces são colhidas antes das tintas tardias."
    - p: "Onde viver a vindima?"
      r: "Os destinos clássicos são La Rioja, a Ribera del Duero, Jerez, o Penedès, as Rías Baixas e La Mancha. Muitas adegas organizam visitas e experiências nessas datas."
    - p: "Pode-se participar na vindima?"
      r: "Sim, há adegas que oferecem experiências em que podes cortar cachos, pisar a uva ou ver a entrada da colheita. Costumam ser pagas e requerem reserva prévia, por isso informa-te com tempo."
    - p: "Há festas da vindima?"
      r: "Sim. Entre as mais conhecidas estão as Fiestas de la Vendimia de Jerez e as Fiestas de San Mateo e da vindima riojana em Logroño, com pisa da uva, oferenda do mosto e degustações."
    - p: "O que é preciso levar?"
      r: "Calçado fechado e confortável, boné, protetor solar e roupa que se possa manchar. É melhor ir logo de manhã cedo, quando está menos calor."
    - p: "É um bom programa com crianças?"
      r: "Em geral, sim. Muitas adegas organizam atividades para famílias, com pisa simbólica da uva e mosto sem álcool. Pergunta ao reservar se aceitam crianças."
mercadillos-navidad:
  texto:
    - "Os mercados de Natal enchem de barracas, luzes e cheiro a doces as praças de muitas cidades. São um programa perfeito para passear, comprar artesanato e enfeites e começar a entrar no ambiente natalício."
    - "Alguns são clássicos: o mercado da Plaza Mayor de Madrid, a Fira de Santa Llúcia de Barcelona, junto à catedral, ou o mercado de Santo Tomás de Bilbau, que se realiza a 21 de dezembro. Muitas outras cidades montam o seu, com barracas de artesanato, doces, presépios e espetáculos para crianças."
    - "Costumam abrir a partir do final de novembro e manter-se até à Consoada ou aos Reis. O mais agradável é ir durante a semana ou ao início da tarde, quando há menos gente, e levar dinheiro em numerário, porque nem todas as barracas aceitam cartão. Agasalha-te bem: passa-se muito tempo ao ar livre."
  faq:
    - p: "Quando abrem os mercados de Natal?"
      r: "A maioria abre a partir do final de novembro ou início de dezembro e fecha na Consoada, embora alguns se mantenham até aos Reis. Consulta as datas de cada cidade."
    - p: "Quais são os mais conhecidos?"
      r: "O da Plaza Mayor de Madrid, a Fira de Santa Llúcia de Barcelona e o mercado de Santo Tomás de Bilbau estão entre os mais tradicionais, embora quase todas as cidades tenham o seu."
    - p: "É preciso pagar entrada?"
      r: "Não. A entrada é livre e só pagas o que comprares ou atrações concretas, como pistas de gelo ou espetáculos."
    - p: "O que se pode comprar?"
      r: "Presépios e figuras, enfeites, velas, artesanato, doces de Natal, torrões e brinquedos, consoante o mercado."
    - p: "Quando é melhor ir?"
      r: "Durante a semana e ao início da tarde, para evitar aglomerações. Aos fins de semana e pontes enchem-se muito."
    - p: "É um bom programa com crianças?"
      r: "Sim, muitos incluem barracas de brinquedos, espetáculos e visitas do Pai Natal ou dos Reis Magos. Cuidado com as aglomerações e não percas de vista os mais pequenos."
luces-navidad:
  texto:
    - "Todos os anos, as cidades espanholas competem para ter a iluminação de Natal mais espetacular. Ruas cobertas de luzes, grandes árvores, espetáculos de luz e música e muita gente a passear fazem de ver as luzes um programa muito simples e muito natalício."
    - "Vigo tornou-se famosa pelo seu aparato, e Madrid, Málaga, Valência ou Barcelona também organizam iluminações muito visitadas. O acender das luzes costuma acontecer no final de novembro ou início de dezembro, com um ato público, e as luzes mantêm-se até aos Reis."
    - "O mais cómodo é ir a pé ou de transporte público, porque os centros enchem-se de gente e cortam-se ruas ao trânsito, sobretudo aos fins de semana e nos dias do acendimento. Se quiseres evitar multidões, vai durante a semana, ao início da noite. Agasalha-te e leva calçado confortável, porque se caminha muito."
  faq:
    - p: "Quando se acendem as luzes de Natal?"
      r: "Normalmente no final de novembro ou início de dezembro, com um ato público. Cada cidade tem a sua data, que é anunciada com semanas de antecedência."
    - p: "Até quando ficam acesas?"
      r: "Habitualmente até aos Reis, a 6 de janeiro, embora em algumas cidades se mantenham mais uns dias."
    - p: "Que cidades têm as melhores luzes?"
      r: "Vigo, Madrid, Málaga, Valência e Barcelona costumam estar entre as mais visitadas, embora muitas cidades médias tenham iluminações muito cuidadas."
    - p: "Quando é melhor ir?"
      r: "Durante a semana e ao início da noite. Aos fins de semana, pontes e nos dias do acendimento há muita aglomeração."
    - p: "Como me desloco?"
      r: "A pé ou de transporte público. Nas zonas mais visitadas cortam-se ruas e estacionar é complicado."
    - p: "É um bom programa com crianças?"
      r: "Sim, é muito atrativo para elas. Cuidado com as aglomerações e combinem um ponto de encontro, caso se separem."
cabalgata-reyes:
  texto:
    - "A Cabalgata de Reyes é um dos grandes programas de família do Natal: na tarde de 5 de janeiro, os Reis Magos percorrem as ruas de quase todas as cidades e aldeias de Espanha com carros alegóricos, música e chuva de rebuçados, antes da noite em que deixam as prendas."
    - "As mais conhecidas são as de Madrid, Barcelona, onde os Reis chegam pelo porto, Sevilha, com uma das mais antigas de Espanha, ou Valência, mas cada localidade organiza a sua. Os carros costumam sair ao entardecer, e o percurso e a hora são publicados no site ou nas redes da câmara municipal alguns dias antes."
    - "Chega com tempo e escolhe um bom lugar: os passeios enchem-se uma ou duas horas antes. Leva um saco grande para os rebuçados, roupa quente e paciência, e vigia as crianças enquanto caem os rebuçados. Se chover, verifica se se mantém ou se é cancelada."
  faq:
    - p: "Quando é a Cabalgata de Reyes?"
      r: "A 5 de janeiro à tarde, embora a hora e o percurso mudem em cada localidade."
    - p: "Onde ver a cabalgata?"
      r: "Em quase todas as cidades e aldeias. As de Madrid, Barcelona, Sevilha e Valência estão entre as maiores, mas cada câmara municipal publica o percurso."
    - p: "É gratuita?"
      r: "Sim, ver a cabalgata da rua é gratuito."
    - p: "Quando chegar para apanhar lugar?"
      r: "Uma ou duas horas antes nas cidades grandes, e um pouco menos em aldeias pequenas."
    - p: "O que é preciso levar?"
      r: "Roupa quente, um saco para os rebuçados e paciência. Nas zonas com muita gente, um ponto de encontro caso se separem."
    - p: "O que acontece se chover?"
      r: "Depende da cidade. Algumas mantêm-se e outras são adiadas ou reduzidas. Consulta o site ou as redes da câmara municipal."
loteria-navidad:
  texto:
    - "O Sorteio da Lotaria de Natal, todos os anos a 22 de dezembro, é um dos ritos mais seguidos do Natal em Espanha. Os meninos e meninas de San Ildefonso cantam os números e os prémios com a sua melodia inconfundível, que se ouve nas rádios e televisões de todo o país."
    - "O sorteio realiza-se há anos no Teatro Real de Madrid e dura várias horas, desde as primeiras horas da manhã. O prémio mais famoso é El Gordo, mas há muitos prémios, e joga-se em família, entre amigos ou no trabalho, muitas vezes com um número partilhado."
    - "Podes segui-lo pela televisão ou rádio, ou consultar os resultados no site oficial da Lotaria. O acesso ao Teatro Real é limitado, pelo que o habitual é vê-lo em casa. Se jogaste, guarda bem o bilhete (décimo) e verifica os prazos para receber os prémios."
  faq:
    - p: "Quando é o sorteio de Natal?"
      r: "A 22 de dezembro, desde as primeiras horas da manhã. Dura várias horas."
    - p: "Onde se realiza?"
      r: "No Teatro Real de Madrid. O acesso do público é limitado."
    - p: "Quem canta os números?"
      r: "Os meninos e meninas do Colégio de San Ildefonso, que os cantam juntamente com os prémios."
    - p: "Como acompanhar?"
      r: "Pela televisão, rádio ou internet. Também podes verificar os resultados no site oficial da Lotaria."
    - p: "Quando é preciso levantar o prémio?"
      r: "Os prémios têm um prazo para serem recebidos. Consulta as condições e os prazos no site oficial da Lotaria."
    - p: "É um bom programa com crianças?"
      r: "Sim, muitos adoram ouvir cantar os números e o ambiente da manhã."
campanadas:
  texto:
    - "As Campanadas de Nochevieja marcam a mudança de ano em Espanha com uma tradição única: comer doze uvas, uma a cada badalada, para receber o novo ano com sorte. São transmitidas em direto a partir do relógio da Puerta del Sol de Madrid e acompanhadas em quase todos os lares."
    - "Muita gente vê-las pela televisão, em casa ou com amigos e família, e outros preferem ir a uma praça. Na Puerta del Sol, o acesso costuma ter lotação limitada e controlos de segurança, por isso consulta as condições e chega com tempo. Outras cidades montam os seus próprios eventos nas praças principais."
    - "Para as uvas, alguns conselhos práticos: descasca-as e tira as grainhas, prepara as doze uvas com antecedência e começa com as primeiras badaladas, não com os quartos. Depois, brinde, cotillón e festa até de madrugada, ou ir descansar, conforme o plano."
  faq:
    - p: "Quando são as Campanadas?"
      r: "Na noite de 31 de dezembro, às 00:00. As doze badaladas do relógio marcam a mudança de ano."
    - p: "Porque se comem doze uvas?"
      r: "É uma tradição que consiste em comer uma uva a cada badalada para receber o ano com sorte. Faz-se em toda a Espanha."
    - p: "Posso ir à Puerta del Sol?"
      r: "Sim, mas o acesso costuma ter lotação limitada e controlos de segurança. Consulta as condições da Câmara Municipal de Madrid e chega com tempo."
    - p: "Que canais as transmitem?"
      r: "Vários canais de televisão emitem as campanadas em direto a partir da Puerta del Sol. Consulta a programação."
    - p: "Como preparar as uvas?"
      r: "Descasca as uvas e tira as grainhas, tem doze preparadas e começa com as badaladas, não com os quartos que as precedem."
    - p: "É um bom programa com crianças?"
      r: "Sim, em casa ou num evento tranquilo. Com crianças pequenas, as uvas podem preparar-se descascadas, sem grainhas ou cortadas para evitar engasgamentos."

san-juan:
  texto:
    - "A Noite de São João, a véspera de 24 de junho, é uma das celebrações mais antigas ligadas ao solstício de verão. Em toda a Espanha acendem-se fogueiras, fazem-se rituais para pedir desejos e celebram-se festas em praias, praças e montanhas."
    - "Algumas das mais conhecidas são as de A Corunha, com fogueiras nas praias de Riazor e do Orzán, as Hogueras de Alicante, Festa de Interesse Turístico Internacional, a Revetlla de Sant Joan na Catalunha, com petardos e coca de Sant Joan, e as festas do fogo do solstício nos Pirenéus, reconhecidas pela UNESCO."
    - "É costume saltar a fogueira, tomar banho à meia-noite ou escrever um desejo num papel e queimá-lo. Faz tudo em segurança: usa apenas as fogueiras autorizadas, não acendas fogo por tua conta em zonas de risco, vigia as crianças com os petardos e tem muito cuidado com o banho noturno. E não deixes lixo na praia."
  faq:
    - p: "Quando é a noite de São João?"
      r: "Na noite de 23 para 24 de junho, sendo o dia 24 feriado em algumas comunidades."
    - p: "Onde ver as fogueiras?"
      r: "A Corunha, Alicante, Barcelona, Cádis e muitas praias da costa têm celebrações muito populares. Consulta o programa de cada câmara municipal."
    - p: "Podem acender-se fogueiras?"
      r: "Só onde for autorizado. Em muitos areais e zonas florestais é proibido acender fogo por conta própria, e há risco de multa e de incêndio."
    - p: "Que rituais se fazem?"
      r: "Saltar a fogueira, pedir desejos, escrever e queimar um papel com aquilo que queres deixar para trás e tomar banho à meia-noite. Cada zona tem os seus costumes."
    - p: "É seguro tomar banho de noite?"
      r: "Há risco, sobretudo com álcool e pouca visibilidade. Toma banho apenas em praias vigiadas, acompanhado e sem te afastares da margem."
    - p: "É um bom programa com crianças?"
      r: "Sim, há muitas atividades familiares, mas convém vigiar o fogo e os petardos e evitar as horas de maior aglomeração."
batalla-vino:
  texto:
    - "A Batalla del Vino de Haro é uma festa única: todos os anos, a 29 de junho, milhares de pessoas atiram vinho tinto umas às outras nos Riscos de Bilibio, a poucos quilómetros de Haro, em La Rioja. É uma celebração de São Pedro que combina tradição religiosa, vinho e muito humor."
    - "O dia começa com uma procissão desde a vila até aos Riscos de Bilibio e uma missa na ermida de San Felices. Depois começa a batalha, com baldes, pistolas, botas de vinho e regadores, e esvaziam-se milhares de litros de vinho. Quase toda a gente se veste de branco e leva um lenço roxo."
    - "Leva roupa branca que não te importes de estragar, calçado confortável que se possa molhar e óculos para proteger os olhos. Não leves objetos de valor nem câmaras que possam sujar-se, e tem em conta que a festa é muito concorrida. Reserva alojamento e transporte com antecedência e bebe com moderação."
  faq:
    - p: "Quando é a Batalla del Vino?"
      r: "Todos os anos a 29 de junho, dia de São Pedro, nos Riscos de Bilibio, perto de Haro (La Rioja)."
    - p: "Que roupa levar?"
      r: "Roupa branca que não te importes de estragar e calçado confortável. Muitos participantes usam óculos de natação e lenço roxo."
    - p: "Como chegar?"
      r: "Desde Haro, a maioria das pessoas vai a pé em procissão ou em transporte organizado. Evita levar carro, porque estacionar é complicado."
    - p: "É preciso bilhete?"
      r: "Em geral é uma festa popular de acesso livre, mas convém consultar as condições e o programa da Câmara Municipal de Haro."
    - p: "É seguro?"
      r: "É uma festa muito concorrida e com vinho, por isso há que ter cuidado, proteger os olhos e não ir sozinho."
    - p: "É um bom programa com crianças?"
      r: "É muito concorrida e molhada, por isso não costuma recomendar-se para crianças pequenas."
romeria-rocio:
  texto:
    - "A Romería del Rocío é uma das peregrinações mais concorridas de Espanha. Centenas de milhares de pessoas viajam a pé, a cavalo e em carroças, desde vários pontos da Andaluzia, até à aldeia de El Rocío, em Almonte (Huelva), por altura do Pentecostes."
    - "Os romeiros, organizados em irmandades, percorrem durante dias os caminhos de Doñana, entre cantares, orações, danças e convívio. O ponto culminante chega na madrugada da segunda-feira de Pentecostes, quando os habitantes de Almonte saltam a grade e levam em procissão a Virgem do Rocío."
    - "Se quiseres vivê-la sem seres peregrino, podes visitar a aldeia e ver a passagem das irmandades e das carroças. As ruas são de areia e há muita gente, o calor é forte e os alojamentos e os lugares de estacionamento esgotam-se. Leva água, calçado confortável e muita paciência, e respeita o carácter religioso da romaria e o meio natural de Doñana."
  faq:
    - p: "Quando é a Romería del Rocío?"
      r: "Por altura do Pentecostes, 50 dias depois do Domingo de Páscoa, normalmente entre maio e junho. O dia principal é a segunda-feira."
    - p: "Onde se celebra?"
      r: "Na aldeia de El Rocío, em Almonte (Huelva), junto ao Parque Nacional de Doñana."
    - p: "O que é o salto da grade?"
      r: "É o momento em que os habitantes de Almonte saltam a grade que protege a Virgem para a levarem em procissão, na madrugada da segunda-feira de Pentecostes."
    - p: "Pode ir-se sem ser romeiro?"
      r: "Sim, mas o acesso é complicado: há muita gente, pouco estacionamento e ruas de areia. Informa-te com antecedência sobre como chegar e se há restrições de trânsito."
    - p: "O que é preciso levar?"
      r: "Água, chapéu, proteção solar, calçado confortável e roupa para o calor do dia e o fresco da noite. Respeita o meio natural e não deixes lixo."
    - p: "É um bom programa com crianças?"
      r: "Com cuidado: há muito calor, muita gente e percursos longos. É melhor visitar a aldeia nas horas de menos afluência."
feria-malaga:
  texto:
    - "A Feria de Málaga, em meados de agosto, é uma das feiras mais animadas do sul: uma semana de música, dança, casetas, fogo de artifício e vinho doce. Realiza-se em dois cenários: a Feria del Centro, de dia, e a Feria de Cortijo de Torres, de noite."
    - "Durante o dia, o centro histórico enche-se de peñas, música, fandangos verdiales e pessoas vestidas de cigana ou de traje curto. À noite, o recinto de Cortijo de Torres reúne casetas, diversões, concertos e muito ambiente. Há atividades para todos os públicos, e muito pescaíto frito e vinho de Málaga."
    - "Vai ao centro de dia e ao recinto de noite. Evita o carro e usa os autocarros ou o transporte público da feira, porque o trânsito e o estacionamento são complicados. Leva calçado confortável, roupa fresca e paciência, e reserva alojamento com antecedência."
  faq:
    - p: "Quando é a Feria de Málaga?"
      r: "Em meados de agosto, durante uma semana. As datas exatas mudam todos os anos."
    - p: "O que é a Feria del Centro?"
      r: "A parte diurna da feira, no centro histórico, com música, dança e ambiente popular."
    - p: "O que é Cortijo de Torres?"
      r: "O recinto da feira onde esta se celebra de noite, com casetas, concertos e diversões."
    - p: "Como chegar a Cortijo de Torres?"
      r: "Em autocarros e serviços especiais da feira. Evita o carro, porque estacionar é difícil."
    - p: "O que se come e se bebe?"
      r: "Pescaíto frito, espetos, presunto e vinho doce de Málaga, entre outras coisas."
    - p: "É um bom programa com crianças?"
      r: "De dia e no centro, sim. À noite há muita gente e muito ruído."
fiesta-santiago-apostol:
  texto:
    - "As Fiestas del Apóstol Santiago celebram o dia do padroeiro de Espanha e da Galiza, a 25 de julho, que é também o Dia Nacional da Galiza. Realizam-se em Santiago de Compostela, numa semana com atos religiosos, concertos, atividades populares e muito ambiente."
    - "Destacam-se dois momentos: a véspera, na noite de 24 de julho, com o espetáculo de fogo de artifício em frente à fachada do Obradoiro da catedral, e o dia 25 de julho, com a Ofrenda Nacional al Apóstol na catedral. Quando o dia 25 de julho cai a um domingo celebra-se o Ano Santo Compostelano, com ainda mais afluência de peregrinos."
    - "Santiago enche-se de visitantes, peregrinos e turistas durante essas datas. Reserva alojamento com antecedência, consulta o programa oficial e chega cedo à praça do Obradoiro se quiseres ver o fogo de artifício. Leva calçado confortável e um impermeável, porque na Galiza o tempo muda depressa."
  faq:
    - p: "Quando são as Fiestas del Apóstol?"
      r: "Por volta de 25 de julho, sendo a véspera, dia 24, a noite do fogo de artifício."
    - p: "O que é o fogo de artifício do Apóstolo?"
      r: "Um espetáculo pirotécnico que se realiza na noite de 24 de julho em frente à fachada do Obradoiro da catedral."
    - p: "O que é a Ofrenda Nacional?"
      r: "Um ato religioso e oficial que se celebra a 25 de julho na catedral, com uma oferenda ao Apóstolo Santiago."
    - p: "O que é o Ano Santo?"
      r: "Um ano jubilar compostelano que se celebra quando o dia 25 de julho cai a um domingo. Atrai muito mais peregrinos."
    - p: "É preciso reservar alojamento?"
      r: "Sim, com muita antecedência, porque Santiago se enche nessas datas."
    - p: "É um bom programa com crianças?"
      r: "Sim, há atividades familiares, mas o fogo de artifício e as aglomerações do Obradoiro são muito concorridos."
calcotada:
  texto:
    - "A calçotada é uma refeição típica da Catalunha, sobretudo do Camp de Tarragona e do Alt Camp: calçots (cebolinhos tenros) assados na brasa, descascados à mão e molhados em molho romesco. É uma refeição de celebração, com babete, boa companhia e uma longa conversa à mesa."
    - "A época começa por volta de dezembro e vai até abril, com o ponto alto entre janeiro e março. Valls, no Alt Camp, é a capital do calçot e organiza no final de janeiro uma grande festa, com concurso e refeição popular. Além de na Catalunha, também há calçotadas noutras zonas de Espanha."
    - "Costuma comer-se com carne grelhada, butifarra, feijão e vinho ou cava. Reserva com antecedência, sobretudo ao fim de semana, porque em época alta fica tudo cheio. Come-se com as mãos: pega-se no calçot pela base, puxa-se a folha exterior, molha-se no romesco e come-se a parte tenra de cima. Suja, por isso o babete não é exagero."
  mapa:
    titulo: "Onde ir a uma calçotada"
    centro: [41.22, 1.25]
    zoom: 10
    puntos:
      - { nombre: "Valls (Alt Camp)", lat: 41.2872, lon: 1.2507, desc: "Capital do calçot: no final de janeiro celebra a sua grande festa, com concurso e refeição popular." }
      - { nombre: "Camp de Tarragona", lat: 41.12, lon: 1.2, desc: "Zona de origem do calçot, com casas rurais e restaurantes que preparam calçotadas na época." }
      - { nombre: "Alt Camp", lat: 41.36, lon: 1.32, desc: "Comarca do interior do calçot, com calçotadas em aldeias e casas rurais; melhor com reserva." }
  faq:
    - p: "O que é um calçot?"
      r: "É uma variedade de cebolinho tenro típica da Catalunha. Assa-se na brasa até a camada exterior ficar preta, embrulha-se para cozer no seu próprio vapor e come-se com molho romesco."
    - p: "Quando é a época dos calçots?"
      r: "De dezembro a abril, aproximadamente, com o auge entre janeiro e março."
    - p: "Onde ir a uma calçotada?"
      r: "O Camp de Tarragona e o Alt Camp, com Valls como capital, são as zonas de referência, mas há restaurantes e casas rurais com calçotada em toda a Catalunha."
    - p: "É preciso reservar?"
      r: "Sim, com antecedência, sobretudo ao fim de semana e em janeiro e fevereiro. Muitos sítios só servem calçotada por encomenda."
    - p: "Como se comem os calçots?"
      r: "Com as mãos: pega-se pela base, puxa-se para cima para tirar a camada queimada, molha-se no romesco e come-se pela parte tenra. Costuma usar-se babete."
    - p: "O que mais inclui o menu?"
      r: "Normalmente carne grelhada (borrego, butifarra), feijão, pão com tomate, sobremesa e vinho ou cava. Cobra-se um menu fechado por pessoa."
carnaval-cadiz:
  texto:
    - "O Carnaval de Cádiz é um dos mais famosos e diferentes de Espanha. A sua alma é a sátira: chirigotas, comparsas, coros e quartetos que cantam coplas com humor e crítica sobre a atualidade, e que enchem as ruas e os teatros durante semanas."
    - "O Concurso de Agrupaciones do Gran Teatro Falla, em fevereiro, é a grande montra das coplas. Na rua, o ambiente de disfarces, música e copla vive-se sobretudo no fim de semana de Carnaval, com desfiles, cortejo e agrupamentos de rua que cantam em praças e esquinas."
    - "Os bilhetes do Teatro Falla esgotam muito depressa. O melhor do Carnaval de Cádiz está na rua, sem necessidade de bilhete: disfarça-te, segue as agrupaciones e deixa que as coplas te surpreendam. Reserva alojamento com antecedência e vai preparado para muita gente."
  faq:
    - p: "Quando é o Carnaval de Cádiz?"
      r: "Celebra-se antes da Quaresma, entre fevereiro e março, consoante o ano. A data depende da Páscoa."
    - p: "O que são as chirigotas?"
      r: "São agrupamentos que cantam coplas satíricas e humorísticas sobre a atualidade, com disfarces coletivos. É o género mais popular do carnaval gaditano."
    - p: "É preciso bilhete?"
      r: "Para o Concurso do Gran Teatro Falla sim, e esgotam depressa. O Carnaval de rua é gratuito."
    - p: "Onde ver o ambiente de rua?"
      r: "No centro histórico de Cádiz: ruas e praças enchem-se de agrupamentos e de gente disfarçada, sobretudo ao fim de semana."
    - p: "É preciso ir disfarçado?"
      r: "Não é obrigatório, mas muitíssima gente fá-lo e o ambiente é melhor se te juntares. O mais típico são os disfarces com humor e crítica."
    - p: "É um bom programa com crianças?"
      r: "Sim, há atividades e cortejo para famílias. As noites são mais sobrelotadas."
sant-jordi:
  texto:
    - "A 23 de abril celebram-se o Dia do Livro e Sant Jordi, e as ruas enchem-se de bancas de livros e de rosas. Na Catalunha, a tradição é oferecer uma rosa e um livro, e é uma das festas mais queridas de Barcelona, com muita gente na rua."
    - "Em Barcelona, as bancas de livros e rosas ocupam as Ramblas, o Paseo de Gracia e quase todos os bairros, e muitos escritores autografam exemplares. O Dia Internacional do Livro celebra-se também em toda a Espanha, com sessões de autógrafos, leituras e descontos nas livrarias, e em Aragão é o Dia de Aragão."
    - "Se queres um autógrafo, chega cedo: as filas são longas. Vai de manhã ou ao fim da tarde, quando há menos confusão, e consulta a lista de autores e os horários nas livrarias e editoras. E lembra-te: não é preciso ser da Catalunha para oferecer uma rosa ou um livro."
  faq:
    - p: "Quando é Sant Jordi?"
      r: "Todos os anos a 23 de abril. Coincide com o Dia do Livro."
    - p: "O que se oferece?"
      r: "Tradicionalmente, o homem oferece uma rosa e a mulher um livro. Hoje oferecem-se ambos entre todo o tipo de pessoas."
    - p: "Onde ir em Barcelona?"
      r: "As Ramblas, o Paseo de Gracia e as ruas do centro enchem-se de bancas. Há bancas em quase todos os bairros."
    - p: "Há sessões de autógrafos?"
      r: "Sim, muitos autores autografam livros em bancas, livrarias e feiras. Chega cedo para evitar filas."
    - p: "Celebra-se fora da Catalunha?"
      r: "Sim, o Dia do Livro celebra-se em toda a Espanha e no mundo, com atividades em livrarias e bibliotecas."
    - p: "É um bom programa com crianças?"
      r: "Sim, há contadores de histórias e atividades infantis. Cuidado com as aglomerações no centro de Barcelona."
pilar:
  texto:
    - "As Fiestas del Pilar são as festas maiores de Saragoça, em honra da Virgen del Pilar, e celebram-se por volta de 12 de outubro, que é também feriado nacional. Durante uma semana, a cidade enche-se de concertos, desfiles, atos populares e muito ambiente na rua."
    - "O momento central é a Ofrenda de Flores, a 12 de outubro, quando milhares de pessoas, muitas com trajes regionais aragoneses, desfilam pelo centro até à plaza del Pilar para depositar as suas flores diante da Virgem e formar um grande manto floral. No dia seguinte, 13 de outubro, celebra-se a Ofrenda de Frutos."
    - "Além da ofrenda, há gigantes e cabeçudos, concertos em vários palcos, espetáculos de pirotecnia e atos culturais e desportivos. Consulta o programa oficial da Câmara Municipal de Saragoça. Reserva alojamento com antecedência, porque é uma festa muito popular e o centro fica cheio. E, para a ofrenda, chega cedo se quiseres ver o desfile."
  faq:
    - p: "Quando são as Fiestas del Pilar?"
      r: "Por volta de 12 de outubro. Duram aproximadamente uma semana, com o dia 12 como jornada principal."
    - p: "O que é a Ofrenda de Flores?"
      r: "É o desfile em que milhares de pessoas, muitas com trajes regionais, levam flores à Virgen del Pilar para formar um grande manto floral. Celebra-se a 12 de outubro."
    - p: "É preciso reservar?"
      r: "Para ver a ofrenda não. Para o alojamento sim, porque Saragoça fica cheia durante as festas."
    - p: "O que mais se pode fazer?"
      r: "Concertos, gigantes e cabeçudos, espetáculos de fogo de artifício, feiras gastronómicas e atividades infantis. O programa oficial é publicado pela câmara municipal."
    - p: "É gratuito?"
      r: "A maioria dos atos é gratuita, mas alguns concertos e espetáculos têm bilhete."
    - p: "É um bom programa com crianças?"
      r: "Sim, há muitas atividades infantis e o desfile de gigantes e cabeçudos costuma encantá-las. Cuidado com as aglomerações no dia 12."
semana-santa-malaga:
  texto:
    - "A Semana Santa de Málaga distingue-se pelos seus tronos de grande tamanho, que desfilam aos ombros de centenas de carregadores pelo centro da cidade. Festa de Interesse Turístico Internacional, cada procissão é um espetáculo de música, flores, incenso e emoção popular."
    - "As cofradías saem dos seus templos e bairros e dirigem-se à Carrera Oficial, na Alameda e na calle Larios, onde há uma tribuna e cadeiras. Um encontro muito aguardado é o de Quinta-feira Santa, com a Legião a acompanhar o Cristo de la Buena Muerte, embora cada dia tenha as suas próprias procissões e cada bairro o seu ambiente."
    - "Consulta o programa oficial da Agrupación de Cofradías com os horários e os itinerários. As ruas do centro enchem-se e os desfiles são lentos, por isso chega com tempo e escolhe um sítio. Reserva alojamento com antecedência e, se puderes, vai também às procissões dos bairros, mais tranquilas."
  faq:
    - p: "Quando é a Semana Santa de Málaga?"
      r: "Do Domingo de Ramos ao Domingo de Páscoa, entre março e abril consoante o ano. Há também atos prévios desde a Sexta-feira de Dores."
    - p: "O que a torna diferente?"
      r: "Os tronos são grandes e levam-se aos ombros, e o ambiente mistura fé, música e tradição popular. A Legião e as bandas de música têm um papel importante."
    - p: "Onde ver as procissões?"
      r: "Na Carrera Oficial (Alameda, calle Larios e plaza de la Constitución), com mais ambiente e mais gente. As procissões dos bairros são uma alternativa mais tranquila."
    - p: "É preciso pagar?"
      r: "Ver as procissões da rua é gratuito. Há cadeiras e tribunas pagas na Carrera Oficial."
    - p: "Como consulto os horários?"
      r: "A Agrupación de Cofradías publica o programa oficial com os itinerários e os horários de cada cofradía."
    - p: "É um bom programa com crianças?"
      r: "Sim, com cuidado: há muita gente e esperas longas. Escolhe procissões de tarde e um sítio com espaço."
festival-jerez:
  texto:
    - "O Festival de Jerez é um dos grandes encontros do flamenco a nível mundial. Realiza-se no final de fevereiro e início de março em Jerez de la Frontera, a cidade onde nasceu esta arte, com espetáculos, cursos e encontros durante duas semanas."
    - "A programação inclui espetáculos de baile, cante e guitarra de artistas consagrados e de novos talentos, no Teatro Villamarta e noutros espaços da cidade. Além disso, há cursos de flamenco abertos a amadores e profissionais, e atividades em peñas e tablaos que permitem conhecer de perto o ambiente flamenco de Jerez."
    - "Consulta o site oficial para o programa e a compra de bilhetes, que se vendem com antecedência. Aproveita para visitar as peñas flamencas e as adegas da cidade, e para provar a gastronomia jerezana. As noites de fevereiro são frescas, por isso leva roupa quente."
  faq:
    - p: "Quando é o Festival de Jerez?"
      r: "No final de fevereiro e início de março, durante cerca de duas semanas. As datas exatas são anunciadas todos os anos."
    - p: "Onde se realiza?"
      r: "Em Jerez de la Frontera, sobretudo no Teatro Villamarta e noutros espaços da cidade."
    - p: "O que há para além dos espetáculos?"
      r: "Cursos de flamenco, encontros e atividades em peñas e tablaos."
    - p: "Onde compro os bilhetes?"
      r: "Nos canais oficiais do festival. Vendem-se com antecedência e os espetáculos mais procurados esgotam."
    - p: "Posso inscrever-me num curso?"
      r: "Sim, há cursos para amadores e profissionais. Consulta a inscrição no site oficial."
    - p: "O que mais fazer em Jerez?"
      r: "Visitar as adegas, as peñas flamencas, o Real Alcázar e provar a gastronomia local."
sonar-festival-internacional-musica-avanzada-barcelona:
  texto:
    - "O Sónar é um dos grandes festivais de música eletrónica e criatividade digital da Europa. Realiza-se em Barcelona, em junho, durante três dias, e combina concertos e sessões de DJ com exposições, palestras e propostas de arte e tecnologia."
    - "O festival divide-se em dois programas: o Sónar de Dia, com palcos ao ar livre, sessões e atividades, e o Sónar de Noite, com grandes sessões e concertos num recinto diferente, até de madrugada. Inclui também uma área profissional dedicada à criatividade e à tecnologia."
    - "Os bilhetes vendem-se com antecedência, por dia ou com passe completo, e o cartaz é anunciado meses antes. Compra apenas nos canais oficiais e consulta as condições de acesso e os objetos permitidos. Leva calçado confortável, proteção solar de dia, tampões para os ouvidos e água, e planeia com antecedência o transporte de regresso da sessão da noite."
  faq:
    - p: "Quando é o Sónar?"
      r: "Em junho, durante três dias. As datas exatas são anunciadas todos os anos."
    - p: "Onde se realiza?"
      r: "Em Barcelona, com dois recintos: um para o Sónar de Dia e outro para o Sónar de Noite."
    - p: "Que diferença há entre o Sónar de Dia e o de Noite?"
      r: "De dia, palcos ao ar livre e atividades; de noite, sessões e concertos de grande formato até de madrugada."
    - p: "Onde compro os bilhetes?"
      r: "Nos canais oficiais do festival. Há bilhetes por dia e passes completos. Desconfia das revendas."
    - p: "O que convém levar?"
      r: "Calçado confortável, proteção solar e chapéu de dia, tampões para os ouvidos e água. Verifica os objetos permitidos antes de ir."
    - p: "Como volto para casa?"
      r: "Planeia o transporte com antecedência: depois da sessão da noite, o metro pode estar fechado e há muita procura de táxis."
bilbao-bbk-live:
  texto:
    - "O Bilbao BBK Live é um festival de música que se realiza em julho nas encostas do monte Kobetas, com vistas para a cidade de Bilbau. Durante três dias, reúne artistas de pop, rock, indie e eletrónica num ambiente natural muito particular."
    - "O recinto, ao ar livre e em declive, tem vários palcos e uma zona de gastronomia e descanso. O cartaz é anunciado meses antes e os bilhetes vendem-se com antecedência, tanto por dia como em passe completo. É um festival muito ligado à cidade: chega-se de transporte público e com serviços especiais a partir do centro."
    - "Consulta no site oficial as condições de acesso, os objetos permitidos e os horários. Leva calçado confortável, roupa quente e impermeável, porque em Bilbau o tempo pode mudar depressa, e proteção solar se estiver sol. Reserva alojamento com tempo, porque a cidade enche-se nesses dias."
  faq:
    - p: "Quando é o Bilbao BBK Live?"
      r: "Em julho, durante três dias. As datas exatas são anunciadas todos os anos."
    - p: "Onde se realiza?"
      r: "Nas encostas do monte Kobetas, em Bilbau, com vistas para a cidade."
    - p: "Como chego ao recinto?"
      r: "De transporte público e em serviços especiais organizados a partir do centro. Consulta o site oficial para os detalhes."
    - p: "Onde compro os bilhetes?"
      r: "Nos canais oficiais do festival, por dia ou com passe completo. Evita as revendas."
    - p: "Que roupa levar?"
      r: "Calçado confortável, roupa quente, impermeável e proteção solar. Em Bilbau o tempo pode mudar depressa."
    - p: "É um bom programa com crianças?"
      r: "Depende do cartaz e do horário. Consulta as condições de acesso de menores no site oficial."
fib-festival-internacional-benicassim:
  texto:
    - "O FIB, Festival Internacional de Benicàssim, é um dos festivais mais veteranos e conhecidos de Espanha. Realiza-se em julho em Benicàssim, na costa de Castellón, e combina concertos com praia, campismo e um ambiente de férias."
    - "Durante quatro dias, vários palcos reúnem artistas de rock, indie, pop e eletrónica, com sessões até de madrugada. A proximidade do mar é um dos seus grandes atrativos: muitos festivaleiros aproveitam a manhã para tomar banho e descansar antes dos concertos da tarde e da noite."
    - "Os bilhetes vendem-se com antecedência, por dia ou com passe, e pode haver opções com campismo. Compra apenas nos canais oficiais e verifica as condições de acesso. Em julho faz muito calor: leva proteção solar, chapéu, água e calçado confortável, e reserva alojamento com tempo se não fores acampar."
  faq:
    - p: "Quando é o FIB?"
      r: "Em julho, durante quatro dias. As datas exatas são anunciadas todos os anos."
    - p: "Onde se realiza?"
      r: "Em Benicàssim, na costa de Castellón."
    - p: "Há campismo?"
      r: "Costuma haver opções de campismo. Consulta as condições no site oficial."
    - p: "Como compro os bilhetes?"
      r: "Nos canais oficiais do festival, por dia ou com passe completo. Evita as revendas."
    - p: "O que convém levar?"
      r: "Proteção solar, chapéu, água, calçado confortável e fato de banho, porque o mar fica perto."
    - p: "É um bom programa com crianças?"
      r: "Depende do cartaz e do horário. Consulta as condições de acesso de menores no site oficial."
festival-internacional-cine-fantastico-cataluna-sitges:
  texto:
    - "O Festival de Sitges é o grande festival de cinema fantástico e de terror de Espanha e um dos mais importantes do mundo no seu género. Realiza-se em outubro em Sitges, uma localidade costeira perto de Barcelona, durante cerca de onze dias."
    - "A programação inclui estreias de cinema de terror, ficção científica, fantasia e thriller, retrospetivas, homenagens e encontros com realizadores e atores. Há secções competitivas e paralelas, e um ambiente de festa entre os aficionados, com disfarces e atividades na rua."
    - "Sitges fica a cerca de 35 quilómetros de Barcelona e chega-se de comboio da Rodalies, o que permite ir e voltar no mesmo dia. Consulta o programa e compra os bilhetes com antecedência, porque as sessões mais populares esgotam. Reserva alojamento com tempo se quiseres ficar, já que a localidade se enche durante o festival."
  faq:
    - p: "Quando é o Festival de Sitges?"
      r: "Em outubro, durante cerca de onze dias. As datas exatas são anunciadas todos os anos."
    - p: "Que tipo de cinema é exibido?"
      r: "Cinema fantástico, de terror, ficção científica, fantasia e thriller, com estreias e retrospetivas."
    - p: "Como chegar a partir de Barcelona?"
      r: "De comboio da Rodalies a partir de Barcelona, em cerca de 35-45 minutos. Há também autocarros e carro, embora estacionar seja difícil durante o festival."
    - p: "Onde compro os bilhetes?"
      r: "Nos canais oficiais do festival. As sessões com convidados e as estreias esgotam."
    - p: "É preciso ir disfarçado?"
      r: "Não é obrigatório, mas há muito ambiente de festa e muitos aficionados fazem-no."
    - p: "É um bom programa com crianças?"
      r: "Depende dos filmes: muitos são para adultos. Consulta a classificação etária de cada sessão."
fiesta-piraguas-descenso-internacional-sella:
  texto:
    - "O Descenso Internacional do Sella é uma das festas mais populares das Astúrias e uma das mais conhecidas de Espanha. Todos os anos, em agosto, milhares de canoístas descem o rio Sella entre Arriondas e Ribadesella, enquanto milhares de pessoas o vivem a partir das margens, com comida, bebida e muito ambiente."
    - "É Festa de Interesse Turístico Internacional e mistura competição desportiva, tradição e festa popular. Os participantes percorrem cerca de vinte quilómetros pelo rio, e o percurso pode ver-se de vários pontos e das margens, com piqueniques e música ao longo do trajeto."
    - "Se queres ver o descenso, escolhe um ponto com bom acesso, chega cedo e tem em conta que o trânsito se complica e que Arriondas e Ribadesella ficam cheias de gente. Para participar, é preciso inscrever-se com antecedência. Leva água, protetor solar e calçado confortável."
  faq:
    - p: "Quando é o Descenso do Sella?"
      r: "Normalmente no primeiro sábado de agosto. Consulta a data exata todos os anos."
    - p: "Onde se realiza?"
      r: "No rio Sella, entre Arriondas e Ribadesella, nas Astúrias."
    - p: "Como ver o descenso?"
      r: "A partir das margens, com piquenique e ambiente de festa, ou em pontos preparados para o efeito. A chegada é em Ribadesella."
    - p: "Posso participar?"
      r: "Sim, mas é preciso inscrever-se com antecedência e cumprir os requisitos da organização."
    - p: "Como chegar?"
      r: "Com tempo: o trânsito complica-se. Pondera usar o transporte organizado e os parques de estacionamento habilitados."
    - p: "É um bom programa com crianças?"
      r: "Sim, o ambiente das margens é familiar, mas há muita gente e calor. Leva água e protetor solar."
festival-womad-caceres:
  texto:
    - "O WOMAD Cáceres é um festival de músicas do mundo que transforma as praças da cidade monumental em palcos ao ar livre. Realiza-se em maio e combina concertos de artistas de vários países, oficinas, atividades para crianças e gastronomia."
    - "O cenário é parte do seu encanto: praças medievais, palácios e ruas de pedra de uma cidade Património da Humanidade. Muitos dos concertos são em praças abertas, e o festival oferece ainda propostas culturais e de lazer para todas as idades."
    - "Consulta o site oficial para ver o programa, as praças e os horários, e para saber que concertos são de acesso livre e quais exigem bilhete ou passe. Leva calçado confortável, porque as ruas são empedradas, e roupa às camadas. Reserva alojamento com antecedência: Cáceres enche-se durante o festival."
  faq:
    - p: "Quando é o WOMAD Cáceres?"
      r: "Em maio, durante alguns dias. As datas exatas são anunciadas todos os anos."
    - p: "Que tipo de música há?"
      r: "Músicas do mundo: folclore, fusão, étnica e música tradicional de vários países."
    - p: "Onde se realizam os concertos?"
      r: "Em praças e espaços da cidade monumental de Cáceres. Consulta o programa."
    - p: "Todos os concertos são gratuitos?"
      r: "Depende da edição. Há concertos de acesso livre e outros com bilhete ou passe. Consulta o site oficial."
    - p: "O que convém levar?"
      r: "Calçado confortável, porque as ruas são empedradas, e roupa às camadas."
    - p: "É um bom programa com crianças?"
      r: "Sim, o festival costuma incluir oficinas e atividades para crianças. Consulta o programa."
fiestas-vendimia-riojana:
  texto:
    - "As Festas de San Mateo e da Vindima Riojana são as festas maiores de Logroño e uma das melhores formas de viver a vindima em La Rioja. Realizam-se em setembro, durante uma semana, com atos tradicionais ligados ao vinho e muito ambiente na rua."
    - "Um dos momentos mais emblemáticos é a pisa da uva e a oferenda do primeiro mosto à Virgem de Valvanera, padroeira de La Rioja. Ao longo da semana há também concertos, desfiles, atividades populares, degustações e espetáculos para todos os públicos, e a cidade enche-se de visitantes."
    - "Aproveita para provar os pinchos da rua Laurel e arredores, e para visitar alguma adega da zona, já que muitas organizam provas e visitas durante a vindima. Consulta o programa oficial da câmara municipal, reserva alojamento com antecedência e, se fores a uma adega, reserva também com tempo."
  faq:
    - p: "Quando são as Festas de San Mateo?"
      r: "Por volta de 21 de setembro, durante uma semana. As datas exatas são anunciadas todos os anos."
    - p: "O que é a pisa da uva?"
      r: "É um ato simbólico da vindima em que se pisa uva e se dá início à oferenda do primeiro mosto à Virgem de Valvanera, padroeira de La Rioja."
    - p: "O que mais se pode fazer?"
      r: "Concertos, atos populares, degustações e visitas a adegas. Consulta o programa oficial."
    - p: "Onde comer?"
      r: "Na rua Laurel e arredores há muitos bares de pinchos, uma das grandes atrações de Logroño."
    - p: "Podem visitar-se adegas?"
      r: "Sim, muitas organizam visitas e provas. Convém reservar com antecedência, sobretudo nas datas da vindima."
    - p: "É um bom programa com crianças?"
      r: "Sim, há atividades familiares durante as festas. Consulta o programa."
fiesta-marisco:
  texto:
    - "A Festa do Marisco de O Grove é um dos grandes eventos gastronómicos da Galiza. Realiza-se em outubro, durante alguns dias, e reúne milhares de visitantes em torno do marisco das rias galegas, com casetas, degustações e espetáculos."
    - "O Grove, na ria de Arousa, é famoso pelo seu marisco: ostras, mexilhões, amêijoas, berbigões, zamburiñas, vieiras ou santola, entre outros. Durante a festa, produtores e restaurantes oferecem os seus produtos no recinto, e há também atividades culturais e musicais."
    - "Consulta o programa oficial da câmara municipal para ver as datas e os horários. Chega cedo, sobretudo aos fins de semana, e vai durante a semana se quiseres evitar as enchentes. Se tens alergia ao marisco ou estás grávida, informa-te antes sobre o que podes comer. Reserva alojamento com antecedência: a zona enche-se."
  faq:
    - p: "Quando é a Festa do Marisco de O Grove?"
      r: "Em outubro, durante alguns dias. As datas exatas são anunciadas todos os anos."
    - p: "Que marisco se pode provar?"
      r: "Ostras, mexilhões, amêijoas, berbigões, zamburiñas, vieiras ou santola, consoante a época e a oferta de cada caseta."
    - p: "É preciso pagar entrada?"
      r: "Consulta o programa oficial da câmara municipal, que detalha as condições de acesso e as degustações."
    - p: "Quando é melhor ir?"
      r: "Durante a semana e logo de manhã, para evitar as enchentes. Aos fins de semana enche-se muito."
    - p: "O que mais fazer em O Grove?"
      r: "Visitar a ilha da Toxa, as praias da península e dar um passeio de barco pela ria."
    - p: "É um bom programa com crianças?"
      r: "Sim, embora convenha ir cedo e evitar as horas de maior afluência."
maraton-malaga:
  texto:
    - "A Maratona de Málaga é uma das grandes provas de atletismo popular de Espanha, com distâncias de maratona e meia maratona que percorrem a cidade no início de dezembro. O clima suave de Málaga nessa altura e um percurso rápido pelo passeio marítimo tornam-na muito atrativa para os corredores."
    - "A corrida reúne milhares de participantes de todos os níveis, desde corredores profissionais até amadores que procuram a sua marca pessoal, e é também um programa para os espectadores, que incentivam a partir da rua. O percurso atravessa zonas do centro e do litoral da cidade."
    - "Se queres correr, inscreve-te com antecedência no site oficial e consulta os requisitos de participação. Se queres incentivar, procura um ponto do percurso no passeio marítimo ou no centro e tem em conta que haverá cortes de trânsito. Leva roupa confortável, água e paciência."
  faq:
    - p: "Quando é a Maratona de Málaga?"
      r: "No início de dezembro, normalmente num domingo. As datas exatas são anunciadas todos os anos."
    - p: "Que distâncias há?"
      r: "Maratona e meia maratona. Consulta o site oficial para ver se há outras provas."
    - p: "Como me inscrevo?"
      r: "No site oficial da prova, com antecedência. Consulta os requisitos de participação e os prazos."
    - p: "Onde ver a corrida?"
      r: "No percurso, sobretudo no passeio marítimo e no centro. Consulta o mapa oficial."
    - p: "Há cortes de trânsito?"
      r: "Sim. Consulta os cortes e os horários no site oficial e na câmara municipal."
    - p: "Que tempo faz em dezembro em Málaga?"
      r: "Costuma ser ameno, embora possa haver chuva ou vento. Leva roupa às camadas."
magostos:
  texto:
    - "O magosto é a grande festa da castanha: uma fogueira, castanhas assadas, vinho novo e muita gente à volta. Celebra-se sobretudo na Galiza, nas Astúrias (onde se chama amagüestu) e em El Bierzo, e tem o seu dia grande por volta de São Martinho, a 11 de novembro."
    - "Há magostos familiares, de bairro, de aldeia e de associações, e muitas câmaras municipais organizam-nos abertos a toda a gente, por vezes com música, baile e jogos tradicionais. Noutras zonas do interior, como o Valle del Jerte, na Extremadura, existe uma tradição parecida por volta do Dia de Todos os Santos, conhecida como calbotá."
    - "Para encontrar um, consulta a agenda da câmara municipal ou da associação de moradores da zona uns dias antes: as datas mudam todos os anos e muitos anunciam-se com pouca antecedência. Leva roupa quente, porque se está ao ar livre, e não esperes nada de sofisticado: a graça está na fogueira e em comer as castanhas quentes, em boa companhia."
  mapa:
    titulo: "Onde se celebram os magostos"
    centro: [41.8, -6.2]
    zoom: 6
    puntos:
      - { nombre: "Galiza (Ourense e Lugo)", lat: 42.4, lon: -7.6, desc: "Berço do magosto: celebra-se em aldeias, bairros e escolas, com a data principal por volta de São Martinho." }
      - { nombre: "Astúrias", lat: 43.3, lon: -5.8, desc: "Aqui chama-se amagüestu e acompanha-se com sidra nova." }
      - { nombre: "El Bierzo (León)", lat: 42.55, lon: -6.6, desc: "Magostos em muitas aldeias da comarca, em pleno souto." }
      - { nombre: "Valle del Jerte (Cáceres)", lat: 40.2, lon: -5.8, desc: "A sua versão é a calbotá, por volta do Dia de Todos os Santos." }
  faq:
    - p: "O que é um magosto?"
      r: "É uma festa tradicional de outono em que se assam castanhas numa fogueira e se comem com vinho novo, sidra ou mosto. É típica da Galiza, das Astúrias e de El Bierzo, embora haja celebrações parecidas noutras zonas."
    - p: "Quando se celebra?"
      r: "Sobretudo em novembro, com o dia de São Martinho, 11 de novembro, como data de referência. Muitas terras celebram-no no fim de semana mais próximo, e também há magostos no final de outubro."
    - p: "Onde ir a um magosto?"
      r: "Na Galiza, nas Astúrias e em El Bierzo há magostos em muitíssimas aldeias e bairros. O mais fiável é consultar a agenda da câmara municipal ou da zona uns dias antes."
    - p: "É preciso pagar ou reservar?"
      r: "Depende. Muitos magostos populares são gratuitos ou pedem uma pequena contribuição, e outros, organizados por restaurantes ou adegas, exigem reserva. Pergunta ao organizador."
    - p: "Posso fazer um magosto em casa?"
      r: "Sim. Faz um corte na casca de cada castanha, assa-as numa frigideira ou no forno e embrulha-as num pano durante uns minutos antes de as descascar. Acompanha-as com vinho ou sidra, se te apetecer."
    - p: "É um bom programa com crianças?"
      r: "Sim, costuma ser um ambiente muito familiar. Só convém vigiar a fogueira e garantir que as castanhas estão mornas antes de as comer."
piscinas-naturales:
  imagen_alt: "Poça de água verde e transparente entre rochas de granito, com uma banhista numa garganta de montanha"
  texto:
    - "Poços de água cristalina entre rochas de granito, pequenas cascatas e gargantas frescas em pleno verão: as piscinas naturais são uma das melhores formas de fugir ao calor sem ir à costa. São água de rio ou de ribeiro de montanha, sem cloro nem nadador-salvador, e isso torna-as tão especiais como delicadas."
    - "As zonas mais conhecidas ficam no norte de Cáceres e no Sistema Central: La Vera, o Valle del Jerte (com os seus famosos Pilones), Las Hurdes e a serra de Gredos, em Ávila. Também há muitíssimas na Galiza, nas Astúrias, na Cantábria, em Castela e Leão, nos Pirenéus e na Sierra Nevada, e a água costuma ser fria mesmo em agosto."
    - "Entra na água com calma, sobretudo se vens de passar horas ao sol, porque a mudança de temperatura pode provocar uma congestão. Não saltes sem conhecer o fundo, tem cuidado com as rochas escorregadias e não tomes banho depois de chuvas fortes nem com o caudal alto. Nas poças não há vigilância, por isso vai sempre acompanhado e presta especial atenção às crianças."
    - "Algumas poças, pela sua fragilidade ou pela afluência, têm lotação limitada, reserva prévia ou acessos regulados no verão, e nos fins de semana de agosto enchem-se cedo. Consulta antes o site da câmara municipal ou do espaço natural e chega cedo. Leva calçado que agarre dentro de água, não uses sabão nem cremas na poça e leva contigo todo o teu lixo."
  faq:
    - p: "Onde há piscinas naturais em Espanha?"
      r: "As zonas mais conhecidas são La Vera e o Valle del Jerte (Cáceres), Las Hurdes, a serra de Gredos (Ávila) e o Sistema Central, além de muitas poças da Galiza, das Astúrias, da Cantábria, dos Pirenéus e da Sierra Nevada."
    - p: "Quando ir a uma piscina natural?"
      r: "De junho a setembro, sendo julho e agosto os meses de maior afluência. Se quiseres tranquilidade, vai durante a semana e chega cedo. Nas que dependem do degelo ou da chuva, o caudal baixa no final do verão."
    - p: "É necessário reservar ou pagar?"
      r: "Quase sempre são gratuitas, mas algumas têm lotação limitada, acesso regulado ou estacionamento pago na época alta. Consulta o site da câmara municipal ou do espaço natural antes de ir."
    - p: "Há nadadores-salvadores?"
      r: "Não na maioria das poças e gargantas, que são água de rio sem vigilância. Vai acompanhado, não deixes as crianças sem supervisão e evita tomar banho se estiver mau tempo ou se o caudal tiver subido."
    - p: "O que é preciso levar?"
      r: "Calçado que agarre na água (sandálias de rio ou sapatilhas de água), toalha, água, algo para comer, protetor solar e um saco para o teu lixo. Não uses sabão nem cremas na poça."
    - p: "Pode-se ir com crianças ou com cão?"
      r: "Com crianças, melhor em poças pouco profundas e de fácil acesso, e sempre com um adulto dentro de água. Com cão, depende do espaço: nalguns é proibido ou tem de ir preso, por isso verifica a regulamentação local."
almendros:
  texto:
    - "As amendoeiras são as primeiras árvores a florir em Espanha. No fim do inverno, quando ainda faz frio, as encostas cobrem-se de flores brancas e rosadas, e é possível passear entre elas com uma luz especialmente bonita."
    - "A floração costuma ir do final de janeiro a março, consoante a zona e o ano, e o pico antecipa-se no sul e nas ilhas. Maiorca, a Axarquía malaguenha, Tenerife e a zona de Cartagena são destinos conhecidos, e em vários locais há percursos sinalizados e festas dedicadas, como a da amendoeira em flor em Tenerife."
    - "Como as flores duram pouco e dependem do tempo, convém ver o estado da floração uns dias antes. As amendoeiras são culturas com dono: passeia por caminhos públicos, não cortes ramos nem apanhes flores e não entres em propriedades vedadas. Se tens alergia ao pólen, leva medicação, porque nesta altura há muito."
  mapa:
    titulo: "Onde ver as amendoeiras em flor"
    centro: [37.5, -6.0]
    zoom: 5
    puntos:
      - { nombre: "Maiorca", lat: 39.65, lon: 2.95, desc: "O Pla de Mallorca e as encostas do interior enchem-se de amendoeiras brancas e rosadas." }
      - { nombre: "La Axarquía (Málaga)", lat: 36.85, lon: -4.3, desc: "Comarca malaguenha com amendoeiras em flor desde finais de janeiro." }
      - { nombre: "Campo de Cartagena (Murcia)", lat: 37.65, lon: -1.0, desc: "Floração precoce no campo de Cartagena, com percursos entre amendoeiras." }
      - { nombre: "Tenerife", lat: 28.3, lon: -16.8, desc: "Amendoeiras em flor no oeste da ilha, com a festa da amendoeira em flor." }
  faq:
    - p: "Quando florescem as amendoeiras?"
      r: "Entre o final de janeiro e março, dependendo da zona e do ano. No sul, nas Baleares e nas Canárias costuma antecipar-se."
    - p: "Onde ver amendoeiras em flor?"
      r: "Maiorca, a Axarquía (Málaga), Tenerife, a zona de Cartagena e outras áreas de cultivo do sul e do leste da península são destinos habituais."
    - p: "Podem-se apanhar flores ou amêndoas?"
      r: "Não. São culturas privadas, mesmo que pareçam campo aberto. Desfruta delas a partir dos caminhos e respeita as propriedades."
    - p: "Quanto dura a floração?"
      r: "Muito pouco, entre uma e duas semanas por zona, e pode encurtar com vento ou chuva. Vê o estado da floração antes de viajar."
    - p: "O que é preciso levar?"
      r: "Calçado de passeio, roupa quente por camadas, máquina fotográfica e, se tiveres alergia, anti-histamínicos. É um bom programa para fotografar ao amanhecer ou ao entardecer."
    - p: "É um bom programa com crianças?"
      r: "Sim, os passeios curtos entre amendoeiras são adequados para famílias, e é um bom momento para mostrar como as culturas mudam ao longo das estações."
lavanda-brihuega:
  texto:
    - "No início de julho, os campos de lavanda de Brihuega, na província de Guadalajara, tingem-se de roxo. É uma das paisagens de verão mais fotogénicas de Espanha e, ao contrário da Provença francesa, chega-se lá em duas horas desde Madrid."
    - "A floração costuma ir do final de junho a meados de julho, com o pico na primeira quinzena de julho, embora dependa do ano. Durante essas semanas realiza-se o Festival da Lavanda, com atividades, mercado e música em Brihuega, e é o momento de maior afluência."
    - "Para desfrutar sem stress, vai logo de manhã ou ao entardecer, quando o calor é menor e a luz é mais bonita. Os campos de lavanda são culturas com dono: respeita os limites e as zonas preparadas para fotografias e passeio, que por vezes são pagas. Leva chapéu, protetor solar e água, e tem em conta que há muitas abelhas."
  mapa:
    titulo: "Onde estão os campos de lavanda"
    centro: [40.76, -2.87]
    zoom: 11
    puntos:
      - { nombre: "Brihuega (Guadalajara)", lat: 40.7625, lon: -2.8728, desc: "Os campos de lavanda rodeiam a localidade; o Festival da Lavanda realiza-se nela durante a floração." }
  faq:
    - p: "Quando floresce a lavanda em Brihuega?"
      r: "De finais de junho a meados de julho, com o máximo na primeira quinzena de julho. Varia todos os anos com o clima."
    - p: "Onde estão os campos de lavanda?"
      r: "Nos arredores de Brihuega (Guadalajara), com acessos sinalizados a partir da vila. Há zonas de passeio e miradouros."
    - p: "Qual é a melhor hora para ir?"
      r: "Logo de manhã ou ao entardecer, quando faz menos calor, há menos gente e a luz é mais bonita."
    - p: "É preciso pagar?"
      r: "Algumas zonas preparadas para o passeio e as fotografias pedem uma pequena entrada. Consulta as condições antes de ir e não entres em campos não autorizados."
    - p: "O que é preciso levar?"
      r: "Chapéu, protetor solar, água e calçado confortável. Há muitas abelhas, por isso convém não as incomodar."
    - p: "É um bom programa com crianças?"
      r: "Sim, mas com calor e com abelhas, por isso vigia os mais pequenos, evita as horas centrais e leva água."
halloween-difuntos:
  texto:
    - "A 31 de outubro e a 1 de novembro convivem em Espanha duas tradições muito diferentes: o Halloween, com disfarces, passagens do terror e festas infantis, e o Dia de Todos os Santos, um dia de recordação dos defuntos, com visitas ao cemitério e doces próprios."
    - "O Halloween tem cada vez mais presença, sobretudo entre os jovens e as crianças, com festas temáticas, casas do terror e parques de diversões decorados. O dia 1 de novembro, pelo contrário, é feriado e tradicional: visitam-se os cemitérios com flores, comem-se huesos de santo e buñuelos de viento e, na Catalunha, panellets e castanhas na castañada."
    - "Em muitos teatros representa-se nestes dias o Don Juan Tenorio, de Zorrilla, uma tradição de 1 e 2 de novembro. Consulta a programação e os programas da câmara municipal e, se fores com crianças, escolhe festas adaptadas e celebra também a parte tradicional."
  faq:
    - p: "O que se celebra a 1 de novembro?"
      r: "O Dia de Todos os Santos, feriado em toda a Espanha, em que se recordam os defuntos e se visitam os cemitérios com flores."
    - p: "Que doces se comem?"
      r: "Huesos de santo, buñuelos de viento e, na Catalunha, panellets e castanhas na castañada."
    - p: "O que é a castañada?"
      r: "Uma festa tradicional catalã do Dia de Todos os Santos em que se comem castanhas, panellets e batatas-doces."
    - p: "O que fazer no Halloween?"
      r: "Festas com disfarces, passagens do terror, casas assombradas e roteiros de mistério. Muitos parques de diversões e câmaras municipais organizam atividades."
    - p: "O que é o Don Juan Tenorio?"
      r: "Uma peça de teatro de José Zorrilla que se representa tradicionalmente nestas datas em muitos teatros."
    - p: "É um bom programa com crianças?"
      r: "Sim, há muitas atividades infantis para o Halloween. Se fores a um cemitério, convém explicar-lhes o sentido tranquilo da visita."
perseidas:
  texto:
    - "As Perseidas, conhecidas popularmente como as Lágrimas de São Lourenço, são uma das chuvas de estrelas mais fáceis e espetaculares de ver a partir de Espanha. Acontecem todos os anos, quando a Terra atravessa o rasto de poeira do cometa Swift-Tuttle."
    - "A atividade prolonga-se de meados de julho até finais de agosto, e o máximo costuma ocorrer entre 11 e 13 de agosto. Numa noite limpa e sem Lua, com céu escuro, podem chegar a ver-se dezenas de meteoros por hora. A fase da Lua de cada ano influencia muito: com Lua cheia veem-se bastantes menos."
    - "O importante é afastar-se da poluição luminosa. Reservas e destinos com certificação Starlight, como Monfragüe, a Sierra Sur de Jaén ou Gúdar-Javalambre, são uma ótima opção, e muitos organizam observações guiadas. Não é preciso telescópio nem binóculos: basta deitar-se e olhar para o céu aberto."
    - "Deixa que os olhos se habituem à escuridão durante uns 20 ou 30 minutos e evita olhar para o telemóvel. Leva uma manta ou uma espreguiçadeira, roupa quente, mesmo que faça calor durante o dia, e algo quente para beber. As horas depois da meia-noite costumam ser as melhores."
  mapa:
    titulo: "Onde ver as Perseidas"
    centro: [39.5, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Monfragüe (Cáceres)", lat: 39.83, lon: -6.05, desc: "Parque Nacional e Reserva Starlight, com observações guiadas do céu." }
      - { nombre: "Sierra Sur de Jaén", lat: 37.6, lon: -3.85, desc: "Reserva Starlight com céus muito escuros, em redor de Alcalá la Real e Castillo de Locubín." }
      - { nombre: "Gúdar-Javalambre (Teruel)", lat: 40.2, lon: -0.7, desc: "Reserva Starlight a mais de 1.500 m de altitude, com céus limpos e observatório astrofísico." }
  faq:
    - p: "Quando se veem as Perseidas?"
      r: "A atividade vai de meados de julho a finais de agosto, com o máximo por volta de 12 de agosto, normalmente entre os dias 11 e 13. As melhores horas são depois da meia-noite e até ao amanhecer."
    - p: "Onde vê-las melhor em Espanha?"
      r: "Em qualquer lugar com céu escuro e limpo. Destinos com certificação Starlight, como Monfragüe, a Sierra Sur de Jaén ou Gúdar-Javalambre, oferecem céus excelentes e observações guiadas."
    - p: "É preciso telescópio?"
      r: "Não. São meteoros de movimento rápido e veem-se melhor a olho nu. Os binóculos e os telescópios reduzem o campo de visão e não ajudam."
    - p: "Para onde é que se deve olhar?"
      r: "Têm origem na constelação de Perseu, para nordeste, mas os meteoros aparecem por todo o céu. O melhor é olhar para cima sem fixar um ponto concreto."
    - p: "A Lua influencia?"
      r: "Muito. Com Lua cheia ou muito luminosa veem-se muito menos meteoros. Convém consultar a fase da Lua desse ano antes de planear a saída."
    - p: "O que é preciso levar?"
      r: "Uma manta ou espreguiçadeira, roupa quente, uma lanterna de luz vermelha (se precisares), algo quente para beber e paciência. Evita as luzes brancas, que estragam a visão noturna."
cerezos-jerte:
  texto:
    - "Durante umas semanas da primavera, o Valle del Jerte, no norte de Cáceres, cobre-se de branco com a floração de centenas de milhares de cerejeiras. Os socalcos das encostas parecem nevados, e o espetáculo completa-se com a Garganta de los Infiernos e as aldeias de pedra do vale."
    - "A floração costuma chegar entre finais de março e meados de abril, embora a data exata mude todos os anos consoante o inverno e as temperaturas. Dura pouco, entre uma e duas semanas por zona, e adianta-se ou atrasa-se consoante a altitude, pelo que convém consultar o estado da floração antes de viajar. Nessa altura celebra-se a Fiesta del Cerezo en Flor."
    - "É um programa muito popular e, nos fins de semana de floração máxima, o trânsito e o estacionamento complicam-se. Se puderes, vai durante a semana ou logo de manhã cedo, reserva alojamento com tempo e tem paciência nas estradas do vale. As cerejeiras são árvores de cultivo com dono: respeita as propriedades, não cortes ramos nem entres nos socalcos vedados."
  mapa:
    titulo: "Onde ver as cerejeiras em flor"
    centro: [40.2, -5.77]
    zoom: 11
    puntos:
      - { nombre: "Garganta de los Infiernos", lat: 40.22, lon: -5.76, desc: "Reserva natural na cabeceira do vale, com trilhos e poços junto ao rio." }
      - { nombre: "Jerte", lat: 40.2147, lon: -5.7508, desc: "Aldeia de pedra à entrada da Garganta, com centro de visitantes e cerejeiras nos socalcos." }
      - { nombre: "Navaconcejo", lat: 40.1747, lon: -5.7978, desc: "Aldeia do vale rodeada de cerejeiras; boa base para ver a floração." }
      - { nombre: "Cabezuela del Valle", lat: 40.1697, lon: -5.7014, desc: "Cerejeiras nas encostas e ruas de pedra, no troço médio do vale." }
  faq:
    - p: "Quando florescem as cerejeiras do Jerte?"
      r: "Normalmente entre finais de março e meados de abril, durante uma ou duas semanas em cada zona. A data muda todos os anos com o clima, por isso vê o estado da floração antes de ir."
    - p: "Onde ver as cerejeiras em flor?"
      r: "O Valle del Jerte (Cáceres) é o mais conhecido, com aldeias como Cabezuela del Valle, Navaconcejo ou Jerte, e percursos como o da Garganta de los Infiernos."
    - p: "Pode-se entrar nos socalcos?"
      r: "São propriedades privadas de cultivo. Passeia por caminhos e miradouros sinalizados e não entres nas parcelas nem cortes flores ou ramos."
    - p: "É preciso reservar alojamento?"
      r: "Sim, com antecedência, porque nos fins de semana de floração máxima fica tudo cheio. As aldeias vizinhas de La Vera ou Plasencia são uma alternativa."
    - p: "Como evito as aglomerações?"
      r: "Vai durante a semana, logo de manhã cedo ou ao fim da tarde, e evita os fins de semana de cor máxima. É melhor estacionar nas zonas destinadas a isso e deslocar-se a pé."
    - p: "É um bom programa com crianças?"
      r: "Sim, os percursos suaves pelo vale são adequados para famílias. Se o teu filho tiver alergia ao pólen, leva medicação, porque na primavera a floração é intensa."
nieve:
  texto:
    - "Subir à neve é um dos grandes programas de inverno, tanto para esquiar como para passear, andar de trenó ou simplesmente ver a montanha branca. Espanha tem estações e paisagens nevadas na Sierra Nevada, nos Pirenéus, na Cordilheira Cantábrica e no Sistema Central."
    - "A temporada vai de dezembro a março, embora a neve dependa muito de cada inverno. Antes de sair, consulta o estado das pistas e das estradas: podem ser necessárias correntes ou pneus de inverno, e os acessos às estações ficam saturados nos fins de semana e nas pontes. Vê a informação de trânsito antes e durante a viagem."
    - "Não é preciso esquiar. Muitas estações e vales oferecem zonas de trenó, percursos com raquetes de neve, esqui de fundo e passeios pela neve, e a roupa pode alugar-se. Reserva o forfait e o material com antecedência nas datas de maior procura. Leva roupa impermeável e em camadas, óculos de sol, protetor solar e luvas de reserva, porque o sol e o reflexo na neve enganam."
  mapa:
    titulo: "Onde subir à neve"
    centro: [40.5, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Sierra Nevada (Granada)", lat: 37.09, lon: -3.4, desc: "A estação mais a sul da Europa, com pistas de esqui e zonas de passeio e trenó." }
      - { nombre: "Pirineo aragonés (Formigal)", lat: 42.78, lon: -0.37, desc: "Grande domínio esquiável dos Pirenéus, com esqui de fundo e percursos com raquetes de neve nas proximidades." }
      - { nombre: "Pirineo catalán (Baqueira Beret)", lat: 42.7, lon: 0.93, desc: "Uma das maiores estações dos Pirenéus, no Valle de Arán." }
      - { nombre: "Cordillera Cantábrica (San Isidro)", lat: 43.05, lon: -5.37, desc: "Estação entre León e as Astúrias, com paisagem de alta montanha cantábrica." }
      - { nombre: "Sistema Central (Navacerrada)", lat: 40.79, lon: -4.01, desc: "A neve mais próxima de Madrid, com pistas e zonas de trenó; os acessos ficam saturados nos fins de semana." }
  faq:
    - p: "Quando há neve em Espanha?"
      r: "Normalmente de dezembro a março, com janeiro e fevereiro como os meses mais fiáveis. Depende muito de cada inverno e da altitude."
    - p: "Onde subir à neve?"
      r: "A Sierra Nevada (Granada), os Pirenéus (Huesca, Lleida, Navarra), a Cordilheira Cantábrica, o Sistema Central (Madrid, Segóvia) ou o Sistema Ibérico oferecem estações e percursos."
    - p: "É preciso saber esquiar?"
      r: "Não. Há trenós, percursos com raquetes de neve, esqui de fundo, zonas de neve para crianças e passeios. Se quiseres esquiar, muitas escolas oferecem aulas de iniciação."
    - p: "Preciso de correntes?"
      r: "Depende da estrada e do dia. Consulta a informação de trânsito e leva correntes ou pneus de inverno. Por vezes é obrigatório levá-las e a estrada fecha sem elas."
    - p: "É preciso reservar?"
      r: "Em datas de maior procura (pontes, Natal, fins de semana de neve) convém reservar forfait, aluguer e alojamento. Comprar online costuma ser mais barato e rápido."
    - p: "Que roupa levar?"
      r: "Roupa impermeável e em camadas, luvas e gorro, óculos de sol ou de esqui, proteção solar e calçado com boa sola. Uma muda de roupa seca para a viagem de regresso nunca está a mais."
fallas:
  texto:
    - "As Fallas são as festas de Valência em honra de São José, de 15 a 19 de março. Declaradas Património Cultural Imaterial da Humanidade pela UNESCO, combinam monumentos de cartão e madeira, pirotecnia, música, pólvora e muita vida na rua."
    - "As fallas são enormes monumentos satíricos que se plantam nas ruas no dia 15. Podem percorrer-se a pé, e as mais importantes competem por prémios. Todos os dias às 14:00, a mascletà, uma sinfonia de pólvora na praça da Câmara Municipal, é um encontro imprescindível. A 17 e 18 realiza-se a Ofrenda de Flores à Virgen de los Desamparados."
    - "O final chega na noite de 19 de março com a cremà: as fallas ardem, começando pelas infantis e terminando pela grande, à meia-noite. Reserva alojamento com meses de antecedência, usa os transportes públicos e vai com tempo para arranjar lugar na mascletà. Tem cuidado com os petardos na rua e com as crianças pequenas."
  faq:
    - p: "Quando são as Fallas?"
      r: "De 15 a 19 de março todos os anos. A plantà é no dia 15 e a cremà, na noite de 19."
    - p: "O que é a mascletà?"
      r: "É um espetáculo de pólvora que se centra no som e na potência mais do que nas cores. Dispara-se todos os dias às 14:00 na praça da Câmara Municipal e sente-se no corpo."
    - p: "O que é a cremà?"
      r: "É a queima das fallas na noite de 19 de março, com a queima final da falla municipal à meia-noite."
    - p: "Como me deslocar por Valência durante as Fallas?"
      r: "A pé e de transportes públicos. Há cortes de trânsito e o estacionamento é quase impossível. O metro reforça o serviço."
    - p: "O que se come?"
      r: "Buñuelos de abóbora com chocolate, paelha e sandes de rua. Os buñuelos são o sabor típico destas festas."
    - p: "É um bom programa com crianças?"
      r: "Sim, há fallas infantis e atividades, mas o ruído dos petardos e as aglomerações podem sufocar os mais pequenos."
semana-santa:
  texto:
    - "A Semana Santa é a semana anterior ao Domingo de Páscoa, do Domingo de Ramos ao Domingo de Páscoa, e é uma das celebrações mais profundas e visitadas de Espanha. Confrarias e irmandades levam para a rua os seus passos e imagens em procissões que misturam fé, arte, música e tradição."
    - "Cada cidade tem o seu próprio estilo. Em Sevilha e Málaga destacam-se os grandes tronos e palios, em Valladolid, Zamora ou Salamanca as procissões são mais sóbrias e de imaginária castelhana, e em locais como Cuenca ou Múrcia há costumes muito próprios. Muitas são Festas de Interesse Turístico Internacional."
    - "Como as datas dependem da Páscoa, mudam todos os anos, entre março e abril. Se pensas viajar, reserva alojamento com muita antecedência e consulta os itinerários e horários oficiais de cada confraria, que são publicados semanas antes. As procissões são atos religiosos: respeita o silêncio, não atravesses entre os cortejos e evita os flashes quando passam os passos."
  faq:
    - p: "Quando é a Semana Santa?"
      r: "É a semana anterior ao Domingo de Páscoa, que cai todos os anos numa data diferente entre finais de março e finais de abril. Vai do Domingo de Ramos ao Domingo de Páscoa."
    - p: "Onde ver as melhores procissões?"
      r: "Sevilha, Málaga, Valladolid, Zamora, Salamanca, Cuenca, Múrcia e Cartagena estão entre as mais conhecidas, cada uma com um estilo muito diferente. Muitas são Festas de Interesse Turístico Internacional."
    - p: "É preciso pagar para ver as procissões?"
      r: "Não. Veem-se gratuitamente da rua. Em algumas cidades há cadeiras pagas na carreira oficial ou em troços concretos."
    - p: "Que dias há mais procissões?"
      r: "Quinta-feira Santa e Sexta-feira Santa costumam ser os dias de maior afluência, e as noites de mais ambiente, a madrugada entre ambos em cidades como Sevilha. O Domingo de Ramos e o Sábado Santo também têm procissões."
    - p: "Como me organizo para as ver?"
      r: "Consulta o programa oficial de cada confraria, com os seus horários e itinerários, chega com tempo a um bom lugar e tem paciência: os cortejos avançam devagar e as ruas são cortadas ao trânsito."
    - p: "É um bom programa com crianças?"
      r: "Sim, mas com cuidado: há muita gente e muitas horas de espera. Escolhe procissões da tarde, procura um sítio com espaço e explica-lhes que é um ato de respeito."
feria-abril:
  texto:
    - "A Feria de Abril de Sevilha é uma semana de festa com casetas, sevillanas, cavalos e charretes, e trajes de flamenca. Celebra-se no Real de la Feria, no bairro de Los Remedios, cerca de duas semanas depois da Semana Santa."
    - "A feira arranca com o Alumbrado, na noite de segunda-feira, quando se acendem as milhares de lâmpadas do portal. Durante a semana, a partir do meio-dia, há um passeio de cavalos e carruagens; a partir daí, as casetas enchem-se de música, dança, comida e bebida: rebujito, fino, presunto e pescadinhas fritas. No domingo encerra-se com um castelo de fogo de artifício."
    - "Uma coisa que convém saber: a maioria das casetas é privada e só entra quem tem convite ou é sócio. Há também casetas públicas e algumas da câmara municipal, abertas a todos, e a rua e o Real podem percorrer-se livremente. É costume ir bem vestido: traje de flamenca para elas e traje curto ou fato para eles."
  faq:
    - p: "Quando é a Feria de Abril?"
      r: "Normalmente começa duas semanas depois do Domingo de Páscoa, entre abril e maio. Dura uma semana, com o Alumbrado na noite de segunda-feira."
    - p: "Posso entrar em qualquer caseta?"
      r: "Não. A maioria é privada e só se entra com convite ou sendo sócio. Há casetas públicas e da câmara municipal abertas a toda a gente."
    - p: "Quanto custa entrar na feira?"
      r: "A entrada no recinto é gratuita. Pagas o que consumires, e as atrações da calle del Infierno são pagas."
    - p: "O que é preciso vestir?"
      r: "Muitos visitantes vestem traje de flamenca ou traje curto, mas não é obrigatório. O mais importante é o calçado confortável, porque se caminha muito."
    - p: "Como chegar?"
      r: "De metro, elétrico ou autocarro. Evita levar o carro: o estacionamento é quase impossível e a zona é cortada ao trânsito."
    - p: "É um bom programa com crianças?"
      r: "De dia sim, com passeio de cavalos e casetas familiares. A calle del Infierno tem atrações. À noite há mais gente e mais ruído."
san-fermin:
  texto:
    - "Os Sanfermines são as festas de Pamplona, de 6 a 14 de julho, e uma das celebrações mais conhecidas do mundo. Começam com o chupinazo na praça da Câmara Municipal, ao meio-dia de 6 de julho, e terminam à meia-noite do dia 14 com o Pobre de mí."
    - "O grande símbolo são os encierros: todas as manhãs, às oito, os touros correm por um percurso de cerca de 850 metros desde o curral de Santo Domingo até à praça de touros. Mas os Sanfermines são muito mais: procissão de São Firmino a 7 de julho, gigantes e cabeçudos, concertos, fogo de artifício, roupa branca com lenço vermelho e um ambiente de rua de dia e de noite."
    - "Correr o encierro é perigoso e tem regras: é preciso ser maior de idade, não ter bebido álcool e respeitar as indicações da organização. Se preferires vê-lo, podes fazê-lo pela televisão ou a partir de algum ponto autorizado, que se ocupa muito cedo. Reserva alojamento com meses de antecedência, porque os preços sobem e a cidade enche-se."
  faq:
    - p: "Quando são os Sanfermines?"
      r: "De 6 a 14 de julho todos os anos. Começam com o chupinazo no dia 6 ao meio-dia e terminam com o Pobre de mí à meia-noite do dia 14."
    - p: "A que horas são os encierros?"
      r: "Todas as manhãs às 8:00, de 7 a 14 de julho. Duram apenas uns minutos."
    - p: "Como ver um encierro?"
      r: "Pela televisão, ou ao vivo a partir de zonas autorizadas, que se ocupam muito cedo. Nalgumas varandas há lugares pagos. Os pontos com vista para o percurso enchem-se desde antes do amanhecer."
    - p: "Pode correr qualquer pessoa?"
      r: "Não. É preciso ser maior de idade, não estar sob os efeitos do álcool ou de outras substâncias e obedecer às regras da organização. É uma atividade perigosa e há feridos todos os anos."
    - p: "Que roupa levar?"
      r: "Tradicionalmente, roupa branca com lenço vermelho ao pescoço e faixa vermelha. Calçado confortável e fechado, e uma muda de roupa, porque é quase certo que se suja."
    - p: "É um bom programa com crianças?"
      r: "O ambiente diurno é familiar, com gigantes, cabeçudos e atividades para crianças. À noite há mais multidões. Convém evitar os encierros e as zonas mais massificadas."
tomatina:
  texto:
    - "A Tomatina é a maior batalha de tomates do mundo. Celebra-se em Buñol, uma localidade da província de Valência, na última quarta-feira de agosto, e durante aproximadamente uma hora milhares de pessoas atiram-se tomates maduros até as ruas ficarem tingidas de vermelho."
    - "Para participar precisas de bilhete. A câmara municipal limita a lotação e vende os bilhetes antecipadamente, pelo que convém comprá-los com tempo nos canais oficiais e desconfiar de revendas. A festa começa com o palo jabón, um pau ensebado com um presunto no topo, e a batalha começa quando é disparado um foguete por volta das 11 da manhã."
    - "Leva roupa velha e calçado que não te importes de perder, óculos de natação para proteger os olhos e luvas. Esmaga o tomate antes de o atirar para não magoar ninguém, e não atires nada além de tomates. Não leves objetos de valor nem câmaras, e chega com tempo desde Valência, por exemplo de comboio ou nos autocarros organizados para esse dia."
  faq:
    - p: "Quando é a Tomatina?"
      r: "Na última quarta-feira de agosto, em Buñol (Valência). A batalha dura aproximadamente uma hora, a partir das 11 da manhã."
    - p: "É preciso bilhete?"
      r: "Sim. A lotação é limitada e os bilhetes compram-se com antecedência através dos canais oficiais. Evita comprar a revendedores."
    - p: "Como chegar a Buñol?"
      r: "A partir de Valência, de comboio de Cercanías ou de autocarro. Convém chegar com tempo, porque no dia da festa há muitíssima gente."
    - p: "Que roupa levar?"
      r: "Roupa velha e calçado que não te importes de perder. Muitos participantes usam óculos de natação para proteger os olhos e luvas."
    - p: "Que regras há?"
      r: "Esmaga o tomate antes de o atirar, não atires nada além de tomates, não leves objetos de vidro nem de valor e obedece às indicações da organização."
    - p: "É um bom programa com crianças?"
      r: "Há idade mínima para participar e a festa é multitudinária. Consulta as condições oficiais antes de comprar bilhetes."
festival-san-sebastian:
  texto:
    - "O Festival de Cinema de San Sebastián, conhecido como Zinemaldia, é um dos grandes festivais de cinema de Espanha e da Europa. Realiza-se em setembro em Donostia-San Sebastián, com estreias internacionais, estrelas no tapete vermelho e exibições abertas ao público."
    - "A programação inclui a secção oficial a concurso, que disputa a Concha de Ouro, além de secções paralelas, retrospetivas e homenagens, como o Prémio Donostia pela carreira. As exibições distribuem-se por vários cinemas e espaços da cidade, entre eles o Kursaal e o Teatro Victoria Eugenia, e grande parte está aberta a qualquer espetador."
    - "Consulta o site oficial para o programa, os horários e a venda de bilhetes, que costumam pôr-se à venda poucos dias antes das sessões e esgotam rapidamente. Chega cedo às filas, vê os horários para combinar sessões e aproveita para passear pela cidade e provar os pintxos. Em setembro pode chover: leva um guarda-chuva."
  faq:
    - p: "Quando é o Festival de Cinema de San Sebastián?"
      r: "Em setembro, durante cerca de nove dias. As datas exatas são anunciadas todos os anos."
    - p: "Pode ir qualquer pessoa?"
      r: "Sim. Além das sessões para profissionais e imprensa, há muitas exibições abertas ao público com bilhete."
    - p: "Onde compro os bilhetes?"
      r: "Nos canais oficiais do festival. Vendem-se com pouca antecedência e as sessões mais populares esgotam."
    - p: "O que é a Concha de Ouro?"
      r: "É o prémio principal do festival, atribuído ao melhor filme da secção oficial."
    - p: "É possível ver as estrelas?"
      r: "No tapete vermelho do Teatro Victoria Eugenia costuma haver público. Consulta os horários e chega cedo."
    - p: "O que mais fazer em San Sebastián?"
      r: "Passear pela baía de La Concha, provar os pintxos na Parte Vieja e visitar o Monte Igueldo."
semana-santa-sevilla:
  texto:
    - "A Semana Santa de Sevilha é provavelmente a mais famosa de Espanha. Durante oito dias, cerca de sessenta irmandades percorrem a cidade com os seus passos de Cristo e da Virgem, acompanhadas de nazarenos, bandas de música e milhares de pessoas nas ruas."
    - "Todas as irmandades passam pela Carrera Oficial, que vai da Campana à Catedral. A noite entre a Quinta-feira e a Sexta-feira Santa é a Madrugá, a de maior emoção e afluência, com irmandades como o Silencio, o Gran Poder, a Macarena, os Gitanos e a Esperanza de Triana."
    - "É uma festa multitudinária: as ruas do centro enchem-se e os cortejos demoram horas a passar. Descarrega o programa oficial, escolhe as irmandades que queres ver e chega com tempo. Reserva alojamento com meses de antecedência, usa os transportes públicos e tem paciência com os cortes de ruas. E lembra-te: é um ato religioso, por isso respeita o silêncio e os nazarenos."
  faq:
    - p: "Quando é a Semana Santa de Sevilha?"
      r: "Do Domingo de Ramos ao Domingo de Páscoa, que muda todos os anos entre março e abril. Consulta o calendário oficial para as datas exatas."
    - p: "O que é a Madrugá?"
      r: "É a noite entre a Quinta-feira Santa e a Sexta-feira Santa. Várias das irmandades mais emblemáticas saem nessas horas e é o momento de maior afluência e emoção."
    - p: "Onde ver as procissões?"
      r: "Na Carrera Oficial (da Campana à Catedral) há muito ambiente mas também muita gente. Outras zonas do centro ou os bairros, como Triana, permitem vê-las com mais tranquilidade."
    - p: "É preciso reservar?"
      r: "Não para ver as procissões da rua, mas sim o alojamento e os restaurantes, que esgotam com meses de antecedência."
    - p: "Como consulto os horários?"
      r: "O Consejo de Hermandades y Cofradías publica o programa oficial com os itinerários e os horários de cada irmandade. Também há aplicações e sites com acompanhamento em tempo real."
    - p: "O que é preciso levar ou ter em conta?"
      r: "Calçado confortável, roupa em camadas e paciência. Respeita o silêncio, não atravesses entre os cortejos e evita o flash perto dos passos."
playas-fluviales:
  texto:
    - "Uma praia fluvial é uma zona de banhos preparada num rio, numa albufeira ou num lago, com areia ou relva, acessos sinalizados e, em muitos casos, serviços como estacionamento, quiosque, casas de banho ou nadador-salvador. É uma forma muito cómoda de passar o dia na água sem ir à costa, ideal para famílias e para quem vive no interior."
    - "Há-as em quase todas as comunidades: a Extremadura, Castela e Leão, Castela-A Mancha, a Galiza, Aragão, Madrid ou as Astúrias têm zonas de banho muito populares, e a albufeira de San Juan, em Madrid, é um clássico. A época vai de junho a setembro, com julho e agosto como momento de maior afluência."
    - "Embora pareçam uma praia, continuam a ser água doce, com correntes, fundos irregulares e, nas albufeiras, níveis que variam. Banha-te apenas na zona sinalizada, não te afastes da margem com crianças e respeita as bandeiras e os avisos. No verão pode haver encerramentos pontuais por causa da qualidade da água, por exemplo por proliferação de algas, pelo que convém verificar."
    - "Antes de ir, consulta o site da câmara municipal e a informação sanitária das zonas de banho, que é publicada no sistema Náyade do Ministério da Saúde. Leva guarda-sol, sapatos de água porque o fundo costuma ser de pedra ou lodo, água e protetor solar, e chega cedo ao fim de semana: as mais conhecidas enchem-se."
  faq:
    - p: "O que é uma praia fluvial?"
      r: "É uma zona de banhos sinalizada num rio, numa albufeira ou num lago, com areia ou relva e, muitas vezes, serviços como estacionamento, quiosque, casas de banho e nadador-salvador. É água doce, não salgada."
    - p: "Quando ir a uma praia fluvial?"
      r: "De junho a setembro. Em julho e agosto há mais ambiente e também mais gente, por isso, se quiseres sossego, vai durante a semana ou logo de manhã."
    - p: "Como sei se a água é segura para banhos?"
      r: "A qualidade da água das zonas de banho oficiais é publicada no sistema Náyade do Ministério da Saúde e costuma haver sinalização na própria praia. No verão pode haver encerramentos pontuais, por exemplo por causa de algas, pelo que convém verificar antes."
    - p: "Há nadadores-salvadores?"
      r: "Em muitas há, na época alta, mas não em todas. Se não houver, redobra os cuidados com as crianças, banha-te apenas na zona sinalizada e não te afastes da margem."
    - p: "O que é preciso levar?"
      r: "Guarda-sol, protetor solar, água, sapatos de água (o fundo costuma ser de pedra ou lodo) e um saco para o teu lixo. Muitas têm quiosque, mas nem sempre."
    - p: "Pode-se ir com crianças ou com cão?"
      r: "Com crianças é um programa muito cómodo, mas sempre com supervisão dentro de água. Com cão depende da praia: algumas proíbem-no ou têm uma área específica, por isso consulta a regulamentação local."
verbenas:
  texto:
    - "Entre julho e setembro, quase todas as aldeias de Espanha celebram as suas festas patronais. São semanas de verbenas com orquestra, peñas, procissões, concertos, refeições populares e atividades para os mais pequenos, e um programa muito barato para conhecer a vida de uma aldeia por dentro."
    - "Agosto concentra a maioria, sobretudo em torno do dia 15, dia da Assunção, embora haja festas em praticamente todas as datas do verão. Cada comunidade tem o seu estilo: em Castela e Leão e em Castela-A Mancha são habituais as peñas e os festejos taurinos populares, na Galiza as romarias e no norte os concursos e a música tradicional."
    - "O mais útil antes de ir é consultar o programa no site da câmara municipal ou nas suas redes sociais. Normalmente as verbenas começam tarde, muitas vezes depois da meia-noite, e costumam ter entrada livre. Se vais de fora, tem em conta o estacionamento e o transporte de regresso, e respeita o descanso dos vizinhos."
  faq:
    - p: "Quando são as festas das aldeias?"
      r: "Sobretudo de julho a setembro, com agosto como o mês mais forte. Cada aldeia tem a sua data, normalmente ligada ao seu santo padroeiro, e os programas costumam ser publicados algumas semanas antes."
    - p: "Como encontro as festas de uma aldeia?"
      r: "O mais fiável é o site ou as redes sociais da câmara municipal, onde se publica o programa completo. Também podes consultar a agenda do sinplanes por província."
    - p: "As verbenas são gratuitas?"
      r: "Quase sempre sim: a entrada nas verbenas e na maioria dos atos populares é livre. Algumas refeições populares ou espetáculos concretos podem exigir bilhete."
    - p: "A que horas começam?"
      r: "As verbenas com orquestra costumam começar tarde e prolongar-se até de madrugada. Os atos infantis, as procissões e as refeições populares são programados para o dia."
    - p: "O que convém levar?"
      r: "Roupa confortável, um casaco para a noite, calçado resistente se fores dançar ou às peñas e dinheiro em numerário, porque alguns bares e casetas não aceitam cartão."
    - p: "É um bom programa com crianças?"
      r: "Sim, a maioria das festas tem atividades infantis durante o dia. À noite o ambiente é mais de adultos, e convém ter em conta o ruído e a hora."
matanza:
  texto:
    - "A matança do porco é uma tradição rural muito enraizada em Castela e Leão, na Extremadura e noutras zonas de Espanha: a elaboração caseira de chouriços, morcelas, presuntos e outros enchidos no inverno. Hoje muitas aldeias celebram-na como festa gastronómica, com demonstrações, provas e refeição popular."
    - "Celebra-se normalmente entre dezembro e fevereiro, quando está o frio necessário para curar os enchidos. Nestas jornadas podem provar-se produtos típicos como chouriço, morcela, farinato, patatas meneás, jijas ou sopas de alho, e conhecer de perto como se fazia este trabalho familiar e de vizinhança."
    - "Para ir, consulta o programa da câmara municipal ou da associação organizadora: muitas jornadas são gratuitas e outras pedem reserva de lugar ou a compra de um bilhete de degustação. Algumas demonstrações incluem cenas que podem ser duras para os mais sensíveis ou para as crianças, pelo que convém informar-se antes de assistir."
  mapa:
    titulo: "Onde ir a uma festa da matança"
    centro: [40.2, -5.8]
    zoom: 7
    puntos:
      - { nombre: "Guijuelo e Sierra de Béjar (Salamanca)", lat: 40.56, lon: -5.67, desc: "Terra de enchidos e presunto ibérico, com jornadas de matança em aldeias da comarca no inverno." }
      - { nombre: "Zamora (Sayago e Aliste)", lat: 41.5, lon: -6.2, desc: "Comarcas zamoranas onde se mantém a matança caseira e se celebra em festas locais." }
      - { nombre: "Montánchez (Cáceres)", lat: 39.21, lon: -6.15, desc: "Serra extremenha de presuntos e chouriços, com jornadas de matança tradicional no inverno." }
  faq:
    - p: "O que é a matança?"
      r: "É a elaboração tradicional de enchidos e outros produtos do porco no inverno. Era um trabalho familiar e de vizinhança, e hoje recupera-se em festas com demonstrações e provas."
    - p: "Quando se celebra?"
      r: "Normalmente de dezembro a fevereiro, embora as datas mudem de uma aldeia para outra. Consulta o programa de cada localidade."
    - p: "Onde há festas da matança?"
      r: "Sobretudo em Castela e Leão e na Extremadura, e também noutras zonas rurais. Procura na agenda da câmara municipal ou na do sinplanes por província."
    - p: "O que se pode provar?"
      r: "Chouriço, morcela, farinato, patatas meneás, jijas, sopas de alho e produtos de porco, consoante a zona. Muitas jornadas incluem um menu de degustação."
    - p: "É gratuita?"
      r: "Depende. Algumas jornadas são gratuitas e outras exigem a compra de um bilhete ou a reserva de lugar para as degustações."
    - p: "É um bom programa com crianças?"
      r: "Às vezes. Algumas demonstrações podem ser duras para os mais pequenos, pelo que convém perguntar antes o que incluem. Muitas festas têm ainda atividades infantis."
flores-primavera:
  texto:
    - "Em abril e maio, os campos, as dehesas e as encostas de média montanha enchem-se de flores. Papoilas, estevas, margaridas, narcisos e outras espécies colorem paisagens que, durante algumas semanas, parecem outras. É um programa simples, barato e muito fotogénico."
    - "O melhor momento depende da zona, da altitude e de quanto choveu no inverno: uma boa primavera dá campos especialmente vistosos. Na dehesa extremenha e andaluza, nos campos de Castela e nos prados de montanha há percursos fáceis para os desfrutar. Nas zonas altas, a floração atrasa-se até maio e junho."
    - "Escolhe trilhos sinalizados e, de preferência, vai durante a semana. Não apanhes flores, não pises culturas nem saias dos caminhos: muitos campos são searas ou pastagens. Se tens alergia ao pólen, leva medicação e verifica a roupa ao voltar, porque na primavera há carraças em alguns terrenos."
  mapa:
    titulo: "Onde ver campos de flores"
    centro: [40.0, -4.5]
    zoom: 6
    puntos:
      - { nombre: "Dehesa extremenha (Cáceres)", lat: 39.3, lon: -6.9, desc: "Dehesas de azinheira e sobreiro com prados de flores, pela Sierra de San Pedro e Monfragüe." }
      - { nombre: "Dehesa andaluza (Sevilha)", lat: 37.95, lon: -5.8, desc: "Sierra Norte de Sevilha, com dehesas, estevais e percursos fáceis." }
      - { nombre: "Campos de Castela (Palencia)", lat: 42.1, lon: -4.8, desc: "Tierra de Campos e os páramos castelhanos, com papoilas entre as culturas." }
      - { nombre: "Prados de montanha (Picos de Europa)", lat: 43.2, lon: -4.85, desc: "Prados com narcisos e outras flores, com floração mais tardia, até maio e junho." }
  faq:
    - p: "Qual é a melhor época para ver flores?"
      r: "Entre abril e maio na maior parte de Espanha. Na montanha atrasa-se para junho, e no sul e nas ilhas pode começar em março."
    - p: "Onde ver campos de flores?"
      r: "As dehesas da Extremadura e da Andaluzia, os campos de Castela, os prados de montanha e os parques naturais são bons locais. Procura percursos sinalizados."
    - p: "Pode-se apanhar flores?"
      r: "Melhor não. Muitas estão protegidas e, nos campos de cultivo, prejudicas a sementeira. Desfruta delas e tira fotografias."
    - p: "O que é preciso levar?"
      r: "Calçado confortável, roupa por camadas, chapéu, protetor solar, água e, se tens alergia, medicação. Verifica a roupa ao voltar, por causa das carraças."
    - p: "Há risco de alergia?"
      r: "Sim, na primavera o pólen é intenso. Se és alérgico, consulta o teu médico e evita as horas centrais do dia e os dias de vento."
    - p: "É um bom programa com crianças?"
      r: "Sim, com percursos curtos e planos. Ensina-lhes a não apanhar flores nem entrar em campos cultivados."
museos-gratis:
  texto:
    - "Muitos museus de Espanha têm horários ou dias de entrada gratuita, e aproveitá-los é uma das melhores formas de fazer um programa cultural sem gastar. Com um pouco de planeamento, podes conhecer coleções de primeiro nível quase sem custo."
    - "Os museus de titularidade estatal costumam ser gratuitos aos sábados à tarde e aos domingos, e alguns têm horários gratuitos durante a semana. Os grandes museus nacionais têm os seus próprios horários e condições. Além disso, há datas especiais como o Dia Internacional dos Museus, a 18 de maio, ou a Noite dos Museus, com entrada gratuita ou atividades especiais."
    - "Os horários e as condições mudam, por isso consulta sempre o site de cada museu antes de ir. Em muitos casos é preciso levantar um bilhete gratuito, e os horários de gratuitidade são os mais concorridos, pelo que convém chegar cedo ou ter paciência com as filas. Os menores, os estudantes, os reformados e outros grupos têm quase sempre entrada gratuita ou reduzida."
  faq:
    - p: "Quando é gratuita a entrada num museu?"
      r: "Depende de cada museu. Os estatais costumam ser gratuitos aos sábados à tarde e aos domingos, e muitos têm horários gratuitos durante a semana. Consulta sempre o respetivo site."
    - p: "O que é o Dia Internacional dos Museus?"
      r: "Celebra-se a 18 de maio e muitos museus abrem gratuitamente ou com atividades especiais. É uma boa ocasião para visitar coleções."
    - p: "É preciso reservar bilhete?"
      r: "Às vezes sim. Nos horários gratuitos, muitos museus pedem que se levante ou reserve um bilhete gratuito, e há filas."
    - p: "Quem tem sempre entrada gratuita?"
      r: "Em muitos museus, os menores de 18 anos, alguns estudantes e reformados, pessoas desempregadas ou com deficiência e outros grupos. Vê as condições de cada museu."
    - p: "Como evito as filas?"
      r: "Vai durante a semana, logo no início do período gratuito e reserva, se for possível. Aos fins de semana enche muito."
    - p: "É um bom programa com crianças?"
      r: "Sim, muitos museus têm visitas e oficinas para famílias, e a entrada para menores costuma ser gratuita."
belenes:
  texto:
    - "O presépio é uma das tradições mais queridas do Natal: figuras, paisagens e cenas que representam o nascimento de Jesus, por vezes com montagens enormes e de grande detalhe. Ver presépios é um programa tranquilo, para fazer em família e que se pode combinar com um passeio pelo centro da cidade."
    - "Durante dezembro e até ao Dia de Reis, câmaras municipais, igrejas, museus, associações de presépios e outras entidades abrem exposições de presépios, muitas delas gratuitas. Alguns são especialmente conhecidos, como o presépio do Museu Salzillo, em Múrcia, o presépio da Plaza de Sant Jaume, em Barcelona, ou o Belén de Tirisiti, em Alcoy."
    - "Além dos presépios expostos, muitas localidades organizam presépios vivos, com habitantes que representam cenas e ofícios da época. Realizam-se sobretudo em dezembro e no início de janeiro. Consulta datas e horários na câmara municipal, porque costumam ser pontuais, e agasalha-te bem se forem ao ar livre."
  faq:
    - p: "Quando se podem ver presépios?"
      r: "Desde o início de dezembro até ao Dia de Reis, embora alguns se mantenham até fevereiro. Os presépios vivos concentram-se em dezembro e no início de janeiro."
    - p: "Onde ver presépios?"
      r: "Em câmaras municipais, igrejas, museus e associações de presépios. Muitas cidades têm um presépio municipal numa praça central."
    - p: "O que é um presépio vivo?"
      r: "É uma representação do nascimento de Jesus com habitantes que interpretam cenas e ofícios. Costuma realizar-se ao ar livre, numa data concreta, e é muito popular nas aldeias e vilas."
    - p: "Tem de se pagar?"
      r: "A maioria das exposições de presépios é gratuita. Alguns presépios de museu ou de grande formato podem cobrar entrada."
    - p: "É um bom programa com crianças?"
      r: "Sim, é dos mais apreciados. Adoram procurar figuras e pormenores, e alguns presépios têm movimento e som."
    - p: "Quanto tempo demora?"
      r: "Uma visita a um presépio costuma durar entre 20 minutos e uma hora. Combina bem com um mercado de Natal ou com um passeio pelas luzes."
semana-santa-valladolid:
  texto:
    - "A Semana Santa de Valladolid é sóbria e intensa, e destaca-se pela sua imaginária de madeira policromada, obra de grandes escultores castelhanos como Gregorio Fernández e Juan de Juni. É Festa de Interesse Turístico Internacional e atrai visitantes de toda a Espanha."
    - "Os pasos percorrem as ruas do centro com confrarias, bandas de música e muito silêncio. A Sexta-feira Santa concentra dois eventos muito aguardados: o Sermão das Sete Palavras na Plaza Mayor e a Procissão Geral da Sagrada Paixão, na qual desfilam os principais pasos da cidade."
    - "Se quiseres aprofundar, o Museu Nacional de Escultura, em Valladolid, guarda obras dos mesmos escultores e é um bom complemento. Consulta o programa oficial, chega cedo para apanhar um bom lugar e agasalha-te, porque em Castela as noites de abril são frescas."
  faq:
    - p: "Quando é a Semana Santa de Valladolid?"
      r: "Do Domingo de Ramos ao Domingo de Páscoa, que cai entre março e abril consoante o ano."
    - p: "O que a torna especial?"
      r: "A imaginária castelhana de madeira policromada, com pasos de grande valor artístico, e um ambiente sóbrio e silencioso."
    - p: "Que procissão não se deve perder?"
      r: "A Procissão Geral da Sagrada Paixão, na Sexta-feira Santa ao fim da tarde, que reúne os principais pasos. O Sermão das Sete Palavras, no mesmo dia na Plaza Mayor, também é muito popular."
    - p: "Onde ver os pasos fora da Semana Santa?"
      r: "No Museu Nacional de Escultura de Valladolid, com obras de Gregorio Fernández e Juan de Juni."
    - p: "Que roupa levar?"
      r: "Roupa quente: em Valladolid as tardes e as noites de março e abril são frescas, e passa-se muito tempo na rua."
    - p: "É um bom programa com crianças?"
      r: "Com cuidado: há muita gente e esperas longas. Escolhe procissões da tarde e um lugar com espaço."
semana-santa-salamanca:
  texto:
    - "A Semana Santa de Salamanca vive-se entre pedra dourada, com procissões que percorrem ruas e praças de uma cidade Património da Humanidade. As confrarias e irmandades levam à rua pasos de grande valor artístico num ambiente recolhido e solene."
    - "Muitas procissões passam pela Plaza Mayor e pelos arredores da Catedral, com um cenário difícil de igualar. Um dos momentos mais sentidos é a procissão do Cristo Yacente, e cada confraria tem o seu estilo e o seu percurso."
    - "O cartaz da Semana Santa de 2027 tem como protagonista a Piedad da Irmandade Dominicana, Nossa Senhora das Dores, uma talha de Salvador Carmona. É a fotografia «El brillo del dolor» («O brilho da dor»), de Pablo Julián Mateos, primeiro prémio do XLII Concurso de Fotografia «Semana Santa Salmantina-Memorial Lorenzo Rodríguez Durán», que retrata o regresso do andor à igreja do convento de San Esteban. O segundo prémio foi para «Tres cruces» («Três cruzes»), de David Gómez Rollán, que será a capa da revista Christus. A celebração é Festa de Interesse Turístico Internacional."
    - "Consulta o programa oficial das confrarias, com os horários e os itinerários. Se fores ver procissões à noite, agasalha-te: em Salamanca as noites de abril são frias. Reserva alojamento com antecedência, porque a cidade enche-se de visitantes, e respeita o silêncio dos cortejos."
  faq:
    - p: "Quando é a Semana Santa de Salamanca?"
      r: "Do Domingo de Ramos ao Domingo de Páscoa, entre março e abril consoante o ano."
    - p: "Onde ver as procissões?"
      r: "Na Plaza Mayor e nas ruas do centro histórico, sobretudo perto da Catedral. Cada confraria tem o seu itinerário."
    - p: "Qual é a procissão mais sentida?"
      r: "A do Cristo Yacente é uma das mais recordadas, com um ambiente muito sóbrio. Consulta o programa para saber o dia e a hora exatos."
    - p: "Que imagem anuncia a Semana Santa de Salamanca 2027?"
      r: "A Piedad da Irmandade Dominicana (Nossa Senhora das Dores), na fotografia «El brillo del dolor» de Pablo Julián Mateos, vencedora do concurso de fotografia e cartaz de 2027."
    - p: "É grátis?"
      r: "Sim, ver as procissões da rua é gratuito."
    - p: "Que roupa levar?"
      r: "Roupa quente, porque as noites são frias em Salamanca, e calçado confortável."
    - p: "É um bom programa com crianças?"
      r: "Sim, com precaução: há muita gente e esperas longas."
semana-santa-caceres:
  texto:
    - "A Semana Santa de Cáceres celebra-se na cidade monumental, Património da Humanidade, e o cenário dá a cada procissão um encanto especial. Os pasos percorrem praças medievais, vielas e palácios, entre muros de pedra e candeeiros."
    - "As confrarias saem dos seus templos da cidade velha e de outros bairros, com procissões sóbrias e de grande recolhimento. A combinação de património e tradição faz de Cáceres um bom destino para quem quer viver uma Semana Santa menos concorrida do que a das grandes capitais."
    - "Consulta o programa oficial das confrarias, com os horários e os itinerários, e reserva alojamento com antecedência. Caminha pelo centro histórico com calçado confortável, já que as ruas são empedradas, e respeita o silêncio das procissões."
  faq:
    - p: "Quando é a Semana Santa de Cáceres?"
      r: "Do Domingo de Ramos ao Domingo de Páscoa, entre março e abril consoante o ano."
    - p: "Onde ver as procissões?"
      r: "Na cidade monumental, com as suas praças e vielas, e noutros bairros. Cada confraria tem o seu itinerário."
    - p: "O que a torna diferente?"
      r: "O ambiente monumental de pedra e um ambiente recolhido, com menos massificação do que nas grandes capitais."
    - p: "É grátis?"
      r: "Sim, ver as procissões da rua é gratuito."
    - p: "Que calçado levar?"
      r: "Calçado confortável e com boa sola: as ruas do centro histórico são empedradas e há subidas."
    - p: "É um bom programa com crianças?"
      r: "Sim, com precaução por causa das esperas e das multidões."
semana-santa-marinera-valencia:
  texto:
    - "A Semana Santa Marinera de Valência celebra-se nos bairros marítimos do Cabanyal, do Canyamelar e do Grau, junto ao mar. É Festa de Interesse Turístico Internacional e tem um carácter muito próprio, ligado à vida dos pescadores e ao Mediterrâneo."
    - "Começa na Sexta-feira das Dores e prolonga-se até ao Domingo de Páscoa, com procissões que percorrem as ruas destes bairros, com as suas bandas, as suas confrarias e o seu ambiente popular. O encerramento chega com a Procissão da Ressurreição, no Domingo de Páscoa, mais festiva e cheia de cor."
    - "Consulta o programa oficial, com os horários e os itinerários das procissões, e combina a visita com um passeio pela praia e uma paella junto ao mar. Chega com tempo e evita o carro, porque algumas ruas são cortadas ao trânsito."
  faq:
    - p: "Quando é a Semana Santa Marinera?"
      r: "Desde a Sexta-feira das Dores até ao Domingo de Páscoa, entre março e abril consoante o ano."
    - p: "Onde se celebra?"
      r: "Nos bairros marítimos de Valência: o Cabanyal, o Canyamelar e o Grau."
    - p: "O que a torna diferente?"
      r: "O seu carácter marinheiro e popular, com procissões junto ao mar e uma Ressurreição final festiva."
    - p: "Como chegar?"
      r: "De metro, de elétrico ou de autocarro. As ruas próximas são cortadas ao trânsito durante as procissões."
    - p: "É grátis?"
      r: "Sim, ver as procissões da rua é gratuito."
    - p: "É um bom programa com crianças?"
      r: "Sim, a Ressurreição de domingo é especialmente festiva e adequada para famílias."
super-bowl:
  texto:
    - "A Super Bowl é a final da NFL, a liga de futebol americano, e um dos eventos desportivos mais vistos do mundo. Realiza-se no segundo domingo de fevereiro e, por causa da diferença horária, em Espanha é transmitida de madrugada, de domingo para segunda-feira."
    - "Além do jogo, a Super Bowl é um espetáculo: o intervalo com um concerto de grandes artistas, os anúncios publicitários mais esperados e toda uma tradição gastronómica, como as asinhas de frango, os nachos e os hambúrgueres. Em Espanha, muitos bares desportivos e restaurantes abrem para a ver, por vezes com menus temáticos."
    - "Se a vais ver em direto, prepara-te para uma noite longa: o jogo termina já bem dentro da madrugada e no dia seguinte há trabalho. Uma alternativa é ver os melhores momentos no dia seguinte. Consulta a programação do canal que a transmite e as datas desse ano."
  faq:
    - p: "Quando é a Super Bowl?"
      r: "No segundo domingo de fevereiro. Em Espanha é transmitida de madrugada, já na segunda-feira."
    - p: "A que horas começa?"
      r: "No horário da costa leste dos Estados Unidos, que em Espanha é já de madrugada. O jogo dura cerca de três horas e meia, com o intervalo."
    - p: "Onde a ver?"
      r: "Em casa ou em bares desportivos que a transmitam. Alguns restaurantes preparam menus temáticos."
    - p: "O que se come?"
      r: "Tradicionalmente, asinhas de frango, nachos, hambúrgueres e cerveja, embora cada estabelecimento tenha a sua própria ementa."
    - p: "É preciso saber de futebol americano?"
      r: "Não. Muitos espectadores veem-na pelo espetáculo do intervalo e pelos anúncios."
    - p: "É um bom programa com amigos?"
      r: "Sim, como programa em casa ou num bar. Isso sim, é uma noite longa."
goya:
  texto:
    - "A gala dos Prémios Goya é a grande noite do cinema espanhol. A Academia das Artes e das Ciências Cinematográficas de Espanha entrega os seus prémios aos melhores filmes, realizadores, atores, argumentistas e técnicos do ano, numa cerimónia que se realiza em fevereiro e é transmitida em direto."
    - "A gala torna-se um acontecimento social: tapete vermelho, vestidos, discursos, números musicais e humor. Os nomeados são anunciados semanas antes, e é um bom momento para ver os filmes que estão a concurso, que muitas vezes voltam às salas ou são publicados em plataformas."
    - "Para aproveitar a gala, consulta a programação do canal que a transmite e prepara-te com umas pipocas. Alguns cinemas e salas organizam sessões especiais e transmissões em ecrã grande. Se quiseres acrescentar um desafio, faz um bolão com os teus amigos para adivinhar os vencedores."
  faq:
    - p: "Quando é a gala dos Goya?"
      r: "Normalmente, num sábado de fevereiro. A data exata e o local mudam todos os anos."
    - p: "Onde é transmitida?"
      r: "Em direto na televisão e na internet. Consulta a programação do canal que a transmite."
    - p: "Posso assistir à gala?"
      r: "É um evento por convite. O habitual é segui-lo em direto pela televisão."
    - p: "Como me preparo?"
      r: "Vê antes os filmes nomeados. Muitos voltam a estar em cartaz nos cinemas ou estão disponíveis em plataformas."
    - p: "Há tapete vermelho aberto ao público?"
      r: "Em algumas edições há zonas para o público ver a chegada dos convidados. Consulta a informação da organização."
    - p: "É um bom programa com amigos?"
      r: "Sim, muita gente vive-a em casa ou num bar ou cinema com ecrã grande e bolão incluído."
oscars:
  texto:
    - "A Noite dos Óscares é o grande acontecimento do cinema mundial. Realiza-se no Dolby Theatre, em Los Angeles, normalmente num domingo de março e, por causa da diferença horária, em Espanha é transmitida de madrugada."
    - "Os candidatos são anunciados semanas antes, e é o momento ideal para ver os filmes nomeados, que costumam estar em cartaz ou em plataformas. Muita gente prepara um bolão, uma maratona de filmes ou uma noite de cinema com amigos, e algumas salas organizam projeções especiais."
    - "Se vais seguir a gala em direto, prepara-te para ficar acordado até tarde: começa à noite e termina já bem dentro da madrugada. Outra opção é ver os prémios principais no dia seguinte, nos resumos dos meios de comunicação. Consulta a programação do canal que transmite a gala em Espanha."
  faq:
    - p: "Quando são os Óscares?"
      r: "Num domingo de março, com a gala à noite em Los Angeles. Em Espanha é transmitida de madrugada."
    - p: "Onde são transmitidos em Espanha?"
      r: "Em direto, pela televisão e por plataformas. A programação muda todos os anos, por isso consulta-a."
    - p: "A que horas começa?"
      r: "No horário de Los Angeles. Em Espanha é de madrugada, e a cerimónia dura várias horas."
    - p: "Como me preparo?"
      r: "Ver antes os filmes nomeados, que costumam estar em cartaz ou em plataformas, e preparar um bolão para adivinhar os vencedores."
    - p: "Posso assistir?"
      r: "É um evento por convite. O habitual é segui-lo pela televisão."
    - p: "É um bom programa com amigos?"
      r: "Sim, muitas pessoas vivem-no em grupo, com bolão e lanche-jantar. Também se pode ver no dia seguinte, em resumo."
eurovision:
  texto:
    - "A final da Eurovisão é uma das noites com mais audiência do ano em Espanha. O festival reúne artistas de dezenas de países que competem com uma canção em direto, com encenações espetaculares, e milhares de pessoas vivem-no em grupo, com bolões e festas temáticas."
    - "A final é num sábado de maio, precedida de duas meias-finais na mesma semana. A Espanha faz parte dos chamados Big Five e passa diretamente à final. O vencedor é decidido pela soma do voto dos júris profissionais de cada país e do televoto do público."
    - "Para a aproveitar, organiza uma festa em casa: um bolão para adivinhar o vencedor, uma pontuação por canções e uns petiscos. Alguns bares e salas organizam transmissões em ecrã grande. Consulta a programação do canal que transmite o festival e as datas desse ano."
  faq:
    - p: "Quando é a final da Eurovisão?"
      r: "Num sábado de maio, depois de duas meias-finais na mesma semana. A data e a cidade anfitriã mudam todos os anos."
    - p: "Como funciona a votação?"
      r: "Cada país atribui pontos pelo voto de um júri profissional e pelo televoto do público. Ganha a canção com mais pontos."
    - p: "A Espanha passa diretamente à final?"
      r: "Sim, a Espanha está entre os países fixos da final, os chamados Big Five, juntamente com o país organizador."
    - p: "Onde é transmitida?"
      r: "Em direto na televisão e na internet. Consulta a programação."
    - p: "Como viver a Eurovisão?"
      r: "Em casa com amigos, com um bolão e pontuações, ou num bar ou sala que a transmita em ecrã grande."
    - p: "É um bom programa com crianças?"
      r: "Sim, o espetáculo é muito visual e familiar, embora termine tarde."
final-champions:
  texto:
    - "A final da Liga dos Campeões é o grande encontro do futebol de clubes na Europa e uma das noites desportivas mais vistas do ano. Realiza-se num sábado, no final de maio ou início de junho e, quando joga uma equipa espanhola, a cidade enche-se de ambiente."
    - "Para a ver, muitos bares, restaurantes e estabelecimentos organizam transmissões com ecrãs grandes, e algumas cidades instalam ecrãs gigantes em praças ou recintos se jogar uma equipa espanhola. Se houver celebração, as praças tradicionais das equipas, como Cibeles ou Neptuno, em Madrid, enchem-se."
    - "Se quiseres vê-la num bar, reserva com antecedência ou chega cedo, porque enchem. Se a vires em casa, organiza um encontro com amigos. Consulta a programação do canal que a transmite e confirma a data e a hora, que mudam todos os anos consoante o local."
  faq:
    - p: "Quando é a final da Liga dos Campeões?"
      r: "Num sábado, no final de maio ou início de junho. A data e a cidade anfitriã mudam todos os anos."
    - p: "Onde a ver?"
      r: "Em casa, em bares e restaurantes com ecrã e, se jogar uma equipa espanhola, em ecrãs gigantes em algumas cidades."
    - p: "É preciso reservar num bar?"
      r: "Sim, ou chegar cedo. As finais enchem os estabelecimentos que fazem transmissão."
    - p: "Onde se celebram os títulos?"
      r: "Cada equipa tem os seus locais tradicionais: por exemplo, Cibeles em Madrid ou Canaletas e o Arco do Triunfo em Barcelona. Consulta a informação oficial do clube e da câmara municipal."
    - p: "Onde é transmitida?"
      r: "Consulta a programação do canal que a transmite nesse ano."
    - p: "É um bom programa com crianças?"
      r: "Em casa ou num estabelecimento familiar, sim. Na rua, é preciso ter cuidado com as aglomerações."
terrazas-primavera:
  texto:
    - "O vermute é muito mais do que uma bebida: é um ritual de fim de semana. Um vermute de pressão, uma azeitona, um pouco de sifão e uma esplanada ao sol fazem um programa simples, barato e muito espanhol, perfeito para antes do almoço."
    - "As melhores épocas para as esplanadas são a primavera, antes do calor forte, e setembro, quando ainda se está bem ao ar livre. Barcelona, Madrid, Reus, Valência ou Sevilha têm bons bares de vermute, e muitos bairros organizam roteiros e concursos com petiscos e vermute a preço ajustado."
    - "O mais simples é sair ao meio-dia, ao fim de semana, e passear de bar em bar. Reserva se fores em grupo, porque as esplanadas ao sol enchem-se, e prova o vermute da casa, que cada estabelecimento elabora ou seleciona o seu. Acompanha-o com conservas em vinagre, anchovas, batatas fritas ou berbigões."
  mapa:
    titulo: "Onde ir de esplanadas e vermute"
    centro: [40.0, -3.0]
    zoom: 6
    puntos:
      - { nombre: "Barcelona", lat: 41.3874, lon: 2.1686, desc: "Cidade de bares de vermute e da hora do vermute ao fim de semana." }
      - { nombre: "Madrid", lat: 40.4168, lon: -3.7038, desc: "Vermute de pressão e esplanadas ao sol em muitos bairros, com roteiros de petiscos." }
      - { nombre: "Reus (Tarragona)", lat: 41.1548, lon: 1.1078, desc: "Berço do vermute catalão, com adegas e bares de tradição." }
      - { nombre: "Valência", lat: 39.4699, lon: -0.3763, desc: "Esplanadas e bares de vermute durante todo o ano graças ao clima." }
      - { nombre: "Sevilha", lat: 37.3891, lon: -5.9845, desc: "Esplanadas e bares de tapas com vermute, ideais antes do calor forte." }
  faq:
    - p: "Quando é melhor ir às esplanadas?"
      r: "Na primavera, entre abril e junho, e em setembro, quando está bom tempo e o calor ainda não aperta."
    - p: "O que se pede com o vermute?"
      r: "Azeitona, laranja ou rodela de limão e gelo, às vezes um fio de sifão. Acompanha-se com conservas em vinagre, batatas fritas, berbigões ou anchovas."
    - p: "Onde ir beber vermute?"
      r: "Barcelona, Madrid, Reus, Valência e Sevilha têm muita tradição, mas quase todas as cidades têm o seu bar de vermute."
    - p: "É preciso reservar?"
      r: "Ao fim de semana e com esplanada ao sol, convém reservar ou chegar cedo, sobretudo em grupo."
    - p: "Quanto custa?"
      r: "Depende da cidade e do estabelecimento. Um vermute de pressão costuma ser acessível e muitos roteiros de petiscos incluem vermute a preço fechado."
    - p: "É um bom programa com crianças?"
      r: "Nas esplanadas sim, com bebidas sem álcool e ao meio-dia. É melhor evitar as horas de maior aglomeração."
premio-nadal:
  texto:
    - "O Prémio Nadal de romance é o prémio literário mais antigo de Espanha, atribuído desde 1944. É anunciado todos os anos a 6 de janeiro num jantar em Barcelona e é um dos primeiros encontros do calendário literário do ano."
    - "Na noite de 6 de janeiro anuncia-se o vencedor e, nos dias seguintes, o romance premiado chega às livrarias. É uma boa desculpa para começar o ano com uma leitura nova e para descobrir autores e autoras que, em muitos casos, publicam a sua obra pela primeira vez em grande escala."
    - "Podes acompanhar o anúncio pelas redes da editora e pelos meios de comunicação. Se quiseres ler o romance vencedor, costuma estar nas livrarias umas semanas depois. Também podes rever títulos de edições anteriores, entre os quais há muitos clássicos da literatura em língua espanhola."
  faq:
    - p: "Quando é anunciado o Prémio Nadal?"
      r: "Todos os anos a 6 de janeiro à noite, num evento em Barcelona."
    - p: "O que é o Prémio Nadal?"
      r: "O prémio literário de romance mais antigo de Espanha, atribuído desde 1944. É concedido pela editora Destino."
    - p: "Posso assistir ao evento?"
      r: "É um evento fechado, por convite. O habitual é acompanhá-lo pelos meios de comunicação e pelas redes sociais."
    - p: "Quando chega o romance às livrarias?"
      r: "Costuma estar disponível nas semanas seguintes ao anúncio. Consulta a tua livraria."
    - p: "É o único prémio literário importante de janeiro?"
      r: "Não, ao longo do ano há outros, como o Planeta em outubro e o Cervantes em abril. Todos têm a sua própria ficha no sinplanes."
premio-cervantes:
  texto:
    - "O Prémio Cervantes é o galardão mais importante das letras em língua espanhola e distingue a obra de um autor ou autora pela sua trajetória. É entregue todos os anos a 23 de abril, Dia do Livro, no Paraninfo da Universidade de Alcalá, em Alcalá de Henares, com a presença do Rei."
    - "O prémio está dotado com 125.000 euros e o vencedor é anunciado meses antes da cerimónia. A cerimónia realiza-se num edifício histórico de uma cidade Património da Humanidade e berço de Miguel de Cervantes, o que lhe confere um valor simbólico especial."
    - "A cerimónia é solene e por convite, mas podes acompanhá-la pela televisão ou pela internet. É um bom dia para visitar Alcalá de Henares, percorrer o seu centro histórico e a casa onde nasceu Cervantes, e para descobrir o vencedor do ano. Consulta o programa de atividades da cidade em torno do Dia do Livro."
  faq:
    - p: "Quando é entregue o Prémio Cervantes?"
      r: "Todos os anos a 23 de abril, Dia do Livro."
    - p: "Onde é entregue?"
      r: "No Paraninfo da Universidade de Alcalá, em Alcalá de Henares (Madrid)."
    - p: "Quem entrega o prémio?"
      r: "Tradicionalmente, o Rei de Espanha."
    - p: "Qual é o valor do prémio?"
      r: "Está dotado com 125.000 euros."
    - p: "Posso assistir?"
      r: "A cerimónia é solene e por convite. Pode ser acompanhada pela televisão e pela internet."
    - p: "O que mais ver em Alcalá de Henares?"
      r: "O centro histórico, Património da Humanidade, e a casa onde nasceu Cervantes, entre outros locais."
feria-libro-madrid:
  texto:
    - "A Feira do Livro de Madrid é um dos eventos culturais mais populares da cidade. Durante cerca de duas semanas, no final de maio e início de junho, o Parque do Retiro enche-se de bancas de livrarias e editoras, com sessões de autógrafos de autores todos os dias."
    - "A alameda central do Retiro transforma-se numa grande livraria ao ar livre, com novidades, clássicos, livros infantis e livros em segunda mão. Muitas bancas têm descontos e, todos os dias, há autores a autografar exemplares e apresentações de livros. É um programa de leitura, mas também de passeio."
    - "A entrada é gratuita. O melhor é ir durante a semana, de manhã ou ao fim da tarde, porque ao fim de semana enche-se. Leva uma lista de livros, algum dinheiro em numerário e calçado confortável. Se quiseres que te autografem um livro, chega cedo e consulta o programa de autógrafos de cada dia."
  faq:
    - p: "Quando é a Feira do Livro de Madrid?"
      r: "No final de maio e início de junho, durante cerca de duas ou três semanas. As datas exatas mudam todos os anos."
    - p: "Onde se realiza?"
      r: "No Parque do Retiro, em Madrid."
    - p: "É preciso pagar entrada?"
      r: "Não, a entrada é gratuita."
    - p: "Há descontos?"
      r: "Muitas bancas oferecem descontos e promoções. Consulta as condições em cada uma."
    - p: "Como consigo um autógrafo?"
      r: "Consulta o programa de autógrafos no site da feira e chega cedo à banca, porque as filas são longas."
    - p: "É um bom programa com crianças?"
      r: "Sim, há livros infantis, contadores de histórias e atividades. Vai durante a semana para evitar as aglomerações."
premio-planeta:
  texto:
    - "O Prémio Planeta é um dos prémios literários mais bem dotados do mundo em língua espanhola, com um milhão de euros para o vencedor. É anunciado a meados de outubro numa gala em Barcelona e é um dos grandes acontecimentos editoriais do outono."
    - "Na gala são anunciados o romance vencedor e o finalista, e a notícia é acompanhada em direto pelos meios de comunicação e pelas redes. Nos dias seguintes, o romance premiado chega às livrarias e costuma figurar entre os livros mais vendidos da campanha de Natal."
    - "Podes acompanhar o anúncio pelos meios de comunicação e pelas redes da editora. Se quiseres ler o romance, costuma estar disponível nas livrarias assim que é anunciado. É um bom momento para conhecer os autores e autoras que fazem parte da grande literatura em língua espanhola."
  faq:
    - p: "Quando é anunciado o Prémio Planeta?"
      r: "A meados de outubro, numa gala em Barcelona."
    - p: "Qual é o valor do prémio?"
      r: "O vencedor recebe um milhão de euros e o finalista uma quantia menor, o que faz dele um dos prémios literários mais bem dotados do mundo."
    - p: "Posso assistir à gala?"
      r: "É um evento por convite. Acompanha-se pelos meios de comunicação e pelas redes sociais."
    - p: "Quando chega o romance às livrarias?"
      r: "Costuma estar disponível após o anúncio. Consulta a tua livraria."
    - p: "É o mesmo que o Prémio Nadal?"
      r: "Não. O Nadal é o mais antigo de Espanha e é anunciado a 6 de janeiro, enquanto o Planeta é anunciado em outubro."
