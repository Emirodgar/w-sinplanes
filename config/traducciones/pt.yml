castanas-otono:
  imagen_alt: "Chão de um souto no outono coberto de folhas douradas e ouriços de castanha"
  texto:
    - "Quando chega outubro, os soutos do norte e do centro da península enchem-se de ouriços caídos entre as folhas. Ir apanhar castanhas é um dos programas de outono mais simples e mais gratificantes: um passeio tranquilo pelo monte, um cesto que se vai enchendo e, ao voltar, algo saboroso para assar em casa."
    - "A época começa, consoante a altitude e o ano, por meados de outubro e prolonga-se até bem entrado novembro. Os melhores soutos costumam estar em zonas de montanha com clima húmido: El Bierzo (León), o Valle del Genal (Málaga), a Sierra de Francia (Salamanca), o Valle del Tiétar (Ávila), além de boa parte da Galiza e das Astúrias."
    - "O mais importante é saber de quem é o souto. Muitos são propriedades privadas, com um dono que cuida delas e as vende, e apanhar castanhas nelas sem autorização pode ter consequências. Pergunta na aldeia, na câmara municipal ou numa casa rural da zona: é habitual que alguém te indique onde se pode apanhar ou te ponha em contacto com um proprietário."
    - "Leva calçado fechado que tenha boa aderência, luvas grossas (os ouriços picam a sério), um cesto ou um saco e roupa que não te importes de sujar. As castanhas caem sozinhas quando estão maduras: o normal é apanhar as do chão, sem varejar as árvores nem as danificar. Os dias seguintes à chuva e ao vento costumam ser os mais generosos."
    - "Já em casa, faz um corte na casca de cada castanha antes de a assar ou cozer, para que não rebentem. Conservam-se melhor num local fresco ou no frigorífico, e convém consumi-las em poucos dias. O remate natural deste programa é um magosto: castanhas assadas, fogueira e vinho novo."
  mapa:
    titulo: "Onde ir apanhar castanhas"
    centro: [40.0, -5.0]
    zoom: 6
    puntos:
      - { nombre: "El Bierzo (León)", lat: 42.55, lon: -6.6, desc: "Soutos centenários de Las Médulas e dos vales próximos; berço do magosto." }
      - { nombre: "Valle del Genal (Málaga)", lat: 36.57, lon: -5.17, desc: "Serranía de Ronda: Igualeja, Pujerra, Genalguacil e Júzcar, com castanheiros por todo o vale." }
      - { nombre: "Sierra de Francia (Salamanca)", lat: 40.485, lon: -6.108, desc: "Zona de La Alberca e Miranda del Castañar, com soutos nas encostas." }
      - { nombre: "Valle del Tiétar (Ávila)", lat: 40.2, lon: -5.1, desc: "Arenas de San Pedro, Candeleda e Guisando, aos pés de Gredos." }
      - { nombre: "Sierra de Aracena (Huelva)", lat: 37.89, lon: -6.56, desc: "Os soutos de Huelva, em Castaño del Robledo e Galaroza." }
  faq:
    - p: "Quando é a época das castanhas?"
      r: "Em Espanha, de meados de outubro a meados de novembro, aproximadamente. Nas zonas baixas começa mais cedo e nas mais altas atrasa-se alguns dias. Se quiseres acertar, pergunta pela zona na semana anterior: a colheita muda de um ano para o outro consoante a chuva e o calor do verão."
    - p: "Pode-se apanhar castanhas em qualquer monte?"
      r: "Nem sempre. Muitos soutos são propriedade privada e, em monte público, cada câmara municipal ou comunidade pode ter as suas próprias regras. Pergunta na câmara municipal ou aos vizinhos antes de apanhar e não entres em propriedades vedadas."
    - p: "Onde ir apanhar castanhas?"
      r: "Os destinos clássicos são El Bierzo (León), o Valle del Genal (Málaga), a Sierra de Francia (Salamanca) e o Valle del Tiétar (Ávila), além da Galiza, das Astúrias e da zona de Aracena. Todos têm soutos muito extensos e muita tradição."
    - p: "O que é preciso levar?"
      r: "Luvas grossas, calçado fechado, um cesto ou saco e roupa quente que não te importes de sujar. Os ouriços abrem-se pisando-os com a sola do sapato, sem necessidade de ferramentas."
    - p: "Como se assam as castanhas?"
      r: "Faz um corte na casca de cada uma, coloca-as numa frigideira própria com furos, no forno ou numa grelha, e deixa-as 20 a 30 minutos até a casca se abrir. Embrulha-as uns minutos num pano para que continuem a cozinhar com o seu próprio vapor e se descasquem melhor."
    - p: "É um bom programa com crianças?"
      r: "Sim, embora com cuidado: os ouriços picam. Dá-lhes luvas e ensina-as a não meter a mão sem olhar. Para elas, é uma atividade que mistura passeio, brincadeira e recompensa."
    - p: "O que é um magosto?"
      r: "É a festa tradicional de outono da Galiza, das Astúrias e de El Bierzo: assam-se castanhas numa fogueira e comem-se com vinho novo ou sidra, sobretudo por São Martinho, a 11 de novembro."
setas:
  imagen_alt: "Mãos a apanhar um boleto no bosque, com um cesto de vime cheio de cogumelos"
  texto:
    - "Com as primeiras chuvas de outono, os pinhais, carvalhais e soutos enchem-se de cogumelos, e sair à sua procura torna-se um dos programas mais esperados do ano. É a desculpa perfeita para passar a manhã no monte, com o cesto cheio ou não."
    - "A época forte vai de outubro a novembro, embora dependa muito da chuva e das temperaturas: depois de umas semanas húmidas e sem geadas, o monte arranca. Províncias como Soria, o Pirenéu, León, Zamora, a Sierra de Gredos ou a Catalunha são clássicos, e em muitas há percursos micológicos e jornadas organizadas."
    - "Antes de sair, informa-te sobre a regulamentação da zona. Várias comunidades exigem uma licença ou autorização de colheita (em Castela e Leão, por exemplo, funciona o sistema Micocyl), e existem limites de quantidade, zonas vedadas e horários. As regras mudam de um sítio para o outro, por isso consulta o site da câmara municipal ou da comunidade autónoma."
    - "Se não tens experiência, a regra de ouro é não comer nenhum cogumelo que não tenhas identificado com segurança. O mais sensato para começar é inscreveres-te numa saída guiada ou numa jornada micológica com um especialista, e levar um guia de campo. Apanha com um cesto de vime, que deixa cair os esporos e permite que o exemplar respire, e corta ou extrai com cuidado, sem devastar o terreno."
  mapa:
    titulo: "Onde ir apanhar cogumelos"
    centro: [41.2, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Pinhais de Soria", lat: 41.95, lon: -2.75, desc: "Vinuesa, Covaleda e Duruelo de la Sierra, com a Micocyl como sistema de licenças." }
      - { nombre: "Pirenéu (Valle de Arán)", lat: 42.7, lon: 0.8, desc: "Bosques húmidos de abeto e faia no Pirenéu de Lleida." }
      - { nombre: "Montanha de León", lat: 42.95, lon: -5.1, desc: "Riaño, Babia e Luna, com carvalhais e faiais." }
      - { nombre: "Sanabria (Zamora)", lat: 42.1, lon: -6.7, desc: "Pinhais e soutos em redor do lago de Sanabria." }
      - { nombre: "Sierra de Gredos (Ávila)", lat: 40.3, lon: -5.2, desc: "Pinhais e carvalhais do Valle del Tiétar e do Barranco." }
      - { nombre: "Solsonès (Catalunha)", lat: 42.0, lon: 1.5, desc: "Pinhais e bosques mistos com muita tradição micológica." }
  faq:
    - p: "Quando é a época dos cogumelos?"
      r: "Em Espanha, a época principal vai de outubro a novembro, embora em algumas zonas se prolongue até dezembro ou comece em setembro. Depende da chuva, da altitude e da temperatura: depois de várias semanas húmidas e sem geadas, o monte arranca."
    - p: "Onde procurar cogumelos?"
      r: "Soria, o Pirenéu, os montes de León e Zamora, a Sierra de Gredos ou a Catalunha são destinos clássicos. O mais prático é perguntar no posto de turismo ou numa casa rural da zona, onde costumam conhecer os percursos e a regulamentação em vigor."
    - p: "É preciso licença para apanhar cogumelos?"
      r: "Em muitas zonas, sim. Várias comunidades autónomas exigem uma licença ou autorização de colheita, e pode haver limites de quantidade e zonas vedadas. Informa-te sempre antes de sair no site da câmara municipal ou da comunidade autónoma."
    - p: "Como sei se um cogumelo é comestível?"
      r: "Não confies em truques populares: só se pode comer um cogumelo se o tiveres identificado com certeza. Se tiveres dúvidas, não o apanhes. Uma saída guiada ou uma jornada micológica é a forma mais segura de aprender e, em caso de intoxicação, é preciso ir às urgências ou ligar para o 112."
    - p: "O que é preciso levar?"
      r: "Um cesto de vime, um canivete, um guia de identificação, calçado de montanha, roupa quente, água e algo para comer. Evita os sacos de plástico, que estragam os cogumelos e não deixam cair os esporos."
    - p: "É um bom programa com crianças?"
      r: "Sim, desde que vão acompanhadas e saibam que não se toca nem se come nada sem que um adulto o verifique. Os mais pequenos gostam muito da busca, mas convém escolher percursos simples e ter atenção para que não levem as mãos à boca."
hayedos:
  imagen_alt: "Caminho coberto de folhas entre faias com as cores do outono e algum nevoeiro ao fundo"
  texto:
    - "Durante umas poucas semanas de outono, os faiais passam do verde ao amarelo, ao laranja e ao acobreado, e o chão cobre-se de folhas. É um dos espetáculos naturais mais fotogénicos de Espanha e um programa perfeito para caminhar sem pressa entre troncos prateados."
    - "O melhor momento costuma ser entre meados de outubro e meados de novembro, embora o pico de cor mude a cada ano consoante o frio, a chuva e o vento. Entre os faiais mais conhecidos estão a Selva de Irati (Navarra), o Hayedo de Montejo (Madrid), o Hayedo de la Tejera Negra (Guadalajara) e o de Otzarreta (Bizkaia), além dos da Cantábria, das Astúrias e do Pirenéu."
    - "Atenção às quotas: alguns faiais, como o de Montejo, limitam o número de visitantes ou exigem reserva ou autorização de acesso, sobretudo nos fins de semana de cor máxima. Consulta antes o site do espaço protegido e, se puderes, vai durante a semana: haverá menos gente e mais silêncio."
    - "Leva calçado confortável que tenha aderência em folhas molhadas, um casaco quente e um impermeável, porque no faial a humidade é habitual, e não saias dos trilhos sinalizados. As manhãs com algum nevoeiro e a luz baixa do fim da tarde são as melhores para fotografar."
  mapa:
    titulo: "Onde ver um faial no outono"
    centro: [42.0, -2.5]
    zoom: 7
    puntos:
      - { nombre: "Selva de Irati (Navarra)", lat: 42.98, lon: -1.1, desc: "Um dos maiores bosques de faias e abetos da Europa, entre Ochagavía e Orbaizeta." }
      - { nombre: "Hayedo de Montejo (Madrid)", lat: 41.12, lon: -3.5, desc: "O faial mais a sul da Europa; acesso com quota e reserva." }
      - { nombre: "Hayedo de la Tejera Negra (Guadalajara)", lat: 41.15, lon: -3.15, desc: "Na serra de Ayllón, junto a Cantalojas, com percursos sinalizados." }
      - { nombre: "Hayedo de Otzarreta (Bizkaia)", lat: 43.03, lon: -2.78, desc: "No Parque Natural de Gorbeia, um dos mais fotografados." }
      - { nombre: "Saja-Besaya (Cantábria)", lat: 43.1, lon: -4.2, desc: "Faiais extensos no Parque Natural, com bons percursos de outono." }
      - { nombre: "Redes (Astúrias)", lat: 43.17, lon: -5.3, desc: "Faiais de montanha no Parque Natural de Redes." }
      - { nombre: "Selva de Oza (Huesca)", lat: 42.85, lon: -0.75, desc: "Faiais e abetais do Pirenéu aragonês, no vale de Hecho." }
  faq:
    - p: "Quando é o melhor momento para ver um faial no outono?"
      r: "Entre meados de outubro e meados de novembro, com um pico de cor que costuma durar umas duas ou três semanas. Varia a cada ano com o frio e a chuva, por isso convém consultar o boletim do espaço protegido ou as redes sociais dos centros de visitantes."
    - p: "Quais são os melhores faiais de Espanha?"
      r: "A Selva de Irati (Navarra), o Hayedo de Montejo (Madrid), o Hayedo de la Tejera Negra (Guadalajara) e o de Otzarreta (Bizkaia) são os mais conhecidos. Destacam-se também os da Cantábria, das Astúrias e do Pirenéu."
    - p: "É preciso reservar ou pedir autorização?"
      r: "Em alguns, sim. O Hayedo de Montejo, por exemplo, limita as visitas e exige autorização e, noutros espaços, há quotas ou parques de estacionamento que enchem nos fins de semana de cor máxima. Consulta o site do espaço protegido antes de ir."
    - p: "Pode-se ir com crianças ou com cão?"
      r: "Os percursos curtos e sinalizados são adequados para crianças. Com cão depende de cada espaço: em alguns são proibidos ou têm de ir com trela, por isso convém verificar antes."
    - p: "Que roupa e calçado levar?"
      r: "Calçado confortável que tenha aderência em folhas molhadas, roupa quente em camadas e um impermeável, porque a humidade e a temperatura descem depressa no bosque."
    - p: "Como evitar as multidões?"
      r: "Vai durante a semana, logo de manhã cedo ou ao fim da tarde, e evita as pontes e os fins de semana de cor máxima. Uma alternativa é escolher faiais menos conhecidos da mesma zona."
berrea:
  texto:
    - "No final do verão, os veados machos começam a bramar para atrair as fêmeas e desafiar os rivais. Esse rugido grave e poderoso, que ecoa pelo monte ao amanhecer e ao entardecer, é a berrea (a brama do veado), um dos espetáculos de fauna mais impressionantes de Espanha."
    - "A berrea concentra-se entre setembro e outubro, com o momento alto normalmente no final de setembro e início de outubro, embora varie consoante a zona e o ano. Os locais mais conhecidos são o Parque Nacional de Cabañeros, o Parque Nacional de Monfragüe, a Sierra de Andújar, a Reserva Nacional de Riaño e a Sierra de la Culebra, entre outros."
    - "O melhor é chegar antes do amanhecer ou um pouco antes de anoitecer, quando os veados estão mais ativos, e escutar em silêncio a partir de um ponto de observação. Leva binóculos, roupa quente e de cores discretas, e não uses lanternas nem flash. Os veados no cio são imprevisíveis: mantém sempre a distância e não te aproximes deles."
    - "Em alguns espaços há percursos guiados, observatórios ou acessos regulados durante a berrea, e convém reservar com antecedência. Consulta o site do espaço protegido ou do centro de visitantes antes de ir."
  mapa:
    titulo: "Onde escutar a berrea"
    centro: [40.0, -5.0]
    zoom: 6
    puntos:
      - { nombre: "Parque Nacional de Cabañeros (Ciudad Real)", lat: 39.4, lon: -4.5, desc: "Rañas (planícies) e monte mediterrânico com grandes populações de veado; visitas guiadas durante a berrea." }
      - { nombre: "Parque Nacional de Monfragüe (Cáceres)", lat: 39.83, lon: -6.05, desc: "Montado e rochedos com vários miradouros para escutar ao amanhecer." }
      - { nombre: "Sierra de Andújar (Jaén)", lat: 38.25, lon: -4.0, desc: "Um dos melhores locais do sul; muito concorrido, convém reservar." }
      - { nombre: "Reserva Nacional de Riaño (León)", lat: 42.98, lon: -5.0, desc: "Berrea de montanha, entre faiais e carvalhais dos Picos de Europa leoneses." }
      - { nombre: "Sierra de la Culebra (Zamora)", lat: 41.85, lon: -6.2, desc: "Extensa reserva de caça com muito veado e algum lobo." }
  faq:
    - p: "Quando é a berrea do veado?"
      r: "Entre setembro e outubro. O momento de maior atividade costuma ser no final de setembro e início de outubro, embora mude consoante a zona e o ano. O melhor é sair ao amanhecer ou ao entardecer."
    - p: "Onde ver a berrea?"
      r: "Os locais mais conhecidos são Cabañeros, Monfragüe, a Sierra de Andújar, a Reserva Nacional de Riaño e a Sierra de la Culebra. Em muitos há percursos guiados, observatórios ou pontos de escuta sinalizados."
    - p: "O que é preciso levar?"
      r: "Binóculos, roupa quente e de cores discretas (verdes, castanhos, cinzentos), calçado confortável e algo para comer e beber. Nas horas de maior atividade está fresco, mesmo que o dia seja quente."
    - p: "É perigoso aproximar-se dos veados?"
      r: "Sim. Os machos no cio estão muito agressivos e são imprevisíveis. Não te aproximes, não os rodeies nem lhes cortes o caminho, e mantém a distância que indicarem os guias ou os cartazes."
    - p: "É preciso reservar?"
      r: "Em alguns espaços, sim, sobretudo para percursos guiados, observatórios ou acessos regulados em plena berrea. Consulta o site do espaço protegido ou do centro de visitantes antes de ir, porque as vagas esgotam."
    - p: "Pode-se ir com crianças?"
      r: "Sim, é um programa muito bonito para elas, mas é preciso ir em silêncio, a horas matinais e sem se afastar do grupo. Escolhe percursos simples e, de preferência, com um guia."
vendimia:
  texto:
    - "Setembro é o mês da vindima em boa parte de Espanha: os cachos maduros são cortados à mão ou à máquina e as adegas enchem-se de cheiro a mosto. Vivê-la de perto, entre vinhas e lagares, é um dos programas de fim de verão com mais encanto, e tem muito de festa."
    - "A data exata muda consoante a zona, a casta e o ano. As uvas brancas e as castas precoces costumam ser colhidas desde o final de agosto, e as tintas mais tardias podem prolongar-se até outubro. Regiões como La Rioja, a Ribera del Duero, Jerez, o Penedès, as Rías Baixas ou La Mancha organizam visitas, provas e atividades relacionadas."
    - "Muitas adegas oferecem experiências em que podes cortar cachos, pisar a uva ou ver como a colheita chega à adega, normalmente com reserva prévia e pagas. Há ainda festas dedicadas à vindima, como as de Jerez ou as de San Mateo em Logroño, com pisa da uva, oferendas do primeiro mosto e degustações."
    - "Se te inscreveres numa experiência na vinha, leva calçado fechado e confortável, boné, protetor solar e roupa que se possa manchar. É melhor ir logo de manhã cedo, quando está menos calor e se trabalha com mais tranquilidade."
  mapa:
    titulo: "Onde viver a vindima"
    centro: [40.0, -3.5]
    zoom: 6
    puntos:
      - { nombre: "La Rioja (Logroño)", lat: 42.4627, lon: -2.445, desc: "Rioja Alta e Rioja Baja, com as festas de San Mateo em Logroño e muitas adegas com visita." }
      - { nombre: "Ribera del Duero (Burgos e Valladolid)", lat: 41.62, lon: -3.9, desc: "Vinhas de tinto ao longo do Douro, com adegas abertas a visitas." }
      - { nombre: "Rías Baixas (Pontevedra)", lat: 42.51, lon: -8.81, desc: "Zona do alvarinho, com vindima precoce e adegas em redor de Cambados." }
      - { nombre: "Penedès (Barcelona)", lat: 41.3446, lon: 1.6988, desc: "Zona do cava e do vinho, com adegas e experiências de vindima em redor de Vilafranca." }
      - { nombre: "La Mancha (Ciudad Real)", lat: 39.0, lon: -3.2, desc: "A maior vinha de Espanha, com adegas e festas da vindima nas suas aldeias." }
      - { nombre: "Jerez (Cádiz)", lat: 36.6864, lon: -6.1377, desc: "Capital do vinho de Jerez, com a sua festa da vindima e adegas históricas." }
  faq:
    - p: "Quando é a vindima em Espanha?"
      r: "Depende da zona e da casta, mas a época principal vai do final de agosto a outubro, com setembro como mês central. As uvas brancas e precoces são colhidas antes das tintas tardias."
    - p: "Onde viver a vindima?"
      r: "Os destinos clássicos são La Rioja, a Ribera del Duero, Jerez, o Penedès, as Rías Baixas e La Mancha. Muitas adegas organizam visitas e experiências nessas datas."
    - p: "Pode-se participar na vindima?"
      r: "Sim, há adegas que oferecem experiências em que podes cortar cachos, pisar a uva ou ver a entrada da colheita. Costumam ser pagas e requerem reserva prévia, por isso informa-te com tempo."
    - p: "Há festas da vindima?"
      r: "Sim. Entre as mais conhecidas estão as Fiestas de la Vendimia de Jerez e as Fiestas de San Mateo e da vindima riojana em Logroño, com pisa da uva, oferenda do mosto e degustações."
    - p: "O que é preciso levar?"
      r: "Calçado fechado e confortável, boné, protetor solar e roupa que se possa manchar. É melhor ir logo de manhã cedo, quando está menos calor."
    - p: "É um bom programa com crianças?"
      r: "Em geral, sim. Muitas adegas organizam atividades para famílias, com pisa simbólica da uva e mosto sem álcool. Pergunta ao reservar se aceitam crianças."
mercadillos-navidad:
  texto:
    - "Os mercados de Natal enchem de barracas, luzes e cheiro a doces as praças de muitas cidades. São um programa perfeito para passear, comprar artesanato e enfeites e começar a entrar no ambiente natalício."
    - "Alguns são clássicos: o mercado da Plaza Mayor de Madrid, a Fira de Santa Llúcia de Barcelona, junto à catedral, ou o mercado de Santo Tomás de Bilbau, que se realiza a 21 de dezembro. Muitas outras cidades montam o seu, com barracas de artesanato, doces, presépios e espetáculos para crianças."
    - "Costumam abrir a partir do final de novembro e manter-se até à Consoada ou aos Reis. O mais agradável é ir durante a semana ou ao início da tarde, quando há menos gente, e levar dinheiro em numerário, porque nem todas as barracas aceitam cartão. Agasalha-te bem: passa-se muito tempo ao ar livre."
  faq:
    - p: "Quando abrem os mercados de Natal?"
      r: "A maioria abre a partir do final de novembro ou início de dezembro e fecha na Consoada, embora alguns se mantenham até aos Reis. Consulta as datas de cada cidade."
    - p: "Quais são os mais conhecidos?"
      r: "O da Plaza Mayor de Madrid, a Fira de Santa Llúcia de Barcelona e o mercado de Santo Tomás de Bilbau estão entre os mais tradicionais, embora quase todas as cidades tenham o seu."
    - p: "É preciso pagar entrada?"
      r: "Não. A entrada é livre e só pagas o que comprares ou atrações concretas, como pistas de gelo ou espetáculos."
    - p: "O que se pode comprar?"
      r: "Presépios e figuras, enfeites, velas, artesanato, doces de Natal, torrões e brinquedos, consoante o mercado."
    - p: "Quando é melhor ir?"
      r: "Durante a semana e ao início da tarde, para evitar aglomerações. Aos fins de semana e pontes enchem-se muito."
    - p: "É um bom programa com crianças?"
      r: "Sim, muitos incluem barracas de brinquedos, espetáculos e visitas do Pai Natal ou dos Reis Magos. Cuidado com as aglomerações e não percas de vista os mais pequenos."
luces-navidad:
  texto:
    - "Todos os anos, as cidades espanholas competem para ter a iluminação de Natal mais espetacular. Ruas cobertas de luzes, grandes árvores, espetáculos de luz e música e muita gente a passear fazem de ver as luzes um programa muito simples e muito natalício."
    - "Vigo tornou-se famosa pelo seu aparato, e Madrid, Málaga, Valência ou Barcelona também organizam iluminações muito visitadas. O acender das luzes costuma acontecer no final de novembro ou início de dezembro, com um ato público, e as luzes mantêm-se até aos Reis."
    - "O mais cómodo é ir a pé ou de transporte público, porque os centros enchem-se de gente e cortam-se ruas ao trânsito, sobretudo aos fins de semana e nos dias do acendimento. Se quiseres evitar multidões, vai durante a semana, ao início da noite. Agasalha-te e leva calçado confortável, porque se caminha muito."
  faq:
    - p: "Quando se acendem as luzes de Natal?"
      r: "Normalmente no final de novembro ou início de dezembro, com um ato público. Cada cidade tem a sua data, que é anunciada com semanas de antecedência."
    - p: "Até quando ficam acesas?"
      r: "Habitualmente até aos Reis, a 6 de janeiro, embora em algumas cidades se mantenham mais uns dias."
    - p: "Que cidades têm as melhores luzes?"
      r: "Vigo, Madrid, Málaga, Valência e Barcelona costumam estar entre as mais visitadas, embora muitas cidades médias tenham iluminações muito cuidadas."
    - p: "Quando é melhor ir?"
      r: "Durante a semana e ao início da noite. Aos fins de semana, pontes e nos dias do acendimento há muita aglomeração."
    - p: "Como me desloco?"
      r: "A pé ou de transporte público. Nas zonas mais visitadas cortam-se ruas e estacionar é complicado."
    - p: "É um bom programa com crianças?"
      r: "Sim, é muito atrativo para elas. Cuidado com as aglomerações e combinem um ponto de encontro, caso se separem."
cabalgata-reyes:
  texto:
    - "A Cabalgata de Reyes é um dos grandes programas de família do Natal: na tarde de 5 de janeiro, os Reis Magos percorrem as ruas de quase todas as cidades e aldeias de Espanha com carros alegóricos, música e chuva de rebuçados, antes da noite em que deixam as prendas."
    - "As mais conhecidas são as de Madrid, Barcelona, onde os Reis chegam pelo porto, Sevilha, com uma das mais antigas de Espanha, ou Valência, mas cada localidade organiza a sua. Os carros costumam sair ao entardecer, e o percurso e a hora são publicados no site ou nas redes da câmara municipal alguns dias antes."
    - "Chega com tempo e escolhe um bom lugar: os passeios enchem-se uma ou duas horas antes. Leva um saco grande para os rebuçados, roupa quente e paciência, e vigia as crianças enquanto caem os rebuçados. Se chover, verifica se se mantém ou se é cancelada."
  faq:
    - p: "Quando é a Cabalgata de Reyes?"
      r: "A 5 de janeiro à tarde, embora a hora e o percurso mudem em cada localidade."
    - p: "Onde ver a cabalgata?"
      r: "Em quase todas as cidades e aldeias. As de Madrid, Barcelona, Sevilha e Valência estão entre as maiores, mas cada câmara municipal publica o percurso."
    - p: "É gratuita?"
      r: "Sim, ver a cabalgata da rua é gratuito."
    - p: "Quando chegar para apanhar lugar?"
      r: "Uma ou duas horas antes nas cidades grandes, e um pouco menos em aldeias pequenas."
    - p: "O que é preciso levar?"
      r: "Roupa quente, um saco para os rebuçados e paciência. Nas zonas com muita gente, um ponto de encontro caso se separem."
    - p: "O que acontece se chover?"
      r: "Depende da cidade. Algumas mantêm-se e outras são adiadas ou reduzidas. Consulta o site ou as redes da câmara municipal."
loteria-navidad:
  texto:
    - "O Sorteio da Lotaria de Natal, todos os anos a 22 de dezembro, é um dos ritos mais seguidos do Natal em Espanha. Os meninos e meninas de San Ildefonso cantam os números e os prémios com a sua melodia inconfundível, que se ouve nas rádios e televisões de todo o país."
    - "O sorteio realiza-se há anos no Teatro Real de Madrid e dura várias horas, desde as primeiras horas da manhã. O prémio mais famoso é El Gordo, mas há muitos prémios, e joga-se em família, entre amigos ou no trabalho, muitas vezes com um número partilhado."
    - "Podes segui-lo pela televisão ou rádio, ou consultar os resultados no site oficial da Lotaria. O acesso ao Teatro Real é limitado, pelo que o habitual é vê-lo em casa. Se jogaste, guarda bem o bilhete (décimo) e verifica os prazos para receber os prémios."
  faq:
    - p: "Quando é o sorteio de Natal?"
      r: "A 22 de dezembro, desde as primeiras horas da manhã. Dura várias horas."
    - p: "Onde se realiza?"
      r: "No Teatro Real de Madrid. O acesso do público é limitado."
    - p: "Quem canta os números?"
      r: "Os meninos e meninas do Colégio de San Ildefonso, que os cantam juntamente com os prémios."
    - p: "Como acompanhar?"
      r: "Pela televisão, rádio ou internet. Também podes verificar os resultados no site oficial da Lotaria."
    - p: "Quando é preciso levantar o prémio?"
      r: "Os prémios têm um prazo para serem recebidos. Consulta as condições e os prazos no site oficial da Lotaria."
    - p: "É um bom programa com crianças?"
      r: "Sim, muitos adoram ouvir cantar os números e o ambiente da manhã."
campanadas:
  texto:
    - "As Campanadas de Nochevieja marcam a mudança de ano em Espanha com uma tradição única: comer doze uvas, uma a cada badalada, para receber o novo ano com sorte. São transmitidas em direto a partir do relógio da Puerta del Sol de Madrid e acompanhadas em quase todos os lares."
    - "Muita gente vê-las pela televisão, em casa ou com amigos e família, e outros preferem ir a uma praça. Na Puerta del Sol, o acesso costuma ter lotação limitada e controlos de segurança, por isso consulta as condições e chega com tempo. Outras cidades montam os seus próprios eventos nas praças principais."
    - "Para as uvas, alguns conselhos práticos: descasca-as e tira as grainhas, prepara as doze uvas com antecedência e começa com as primeiras badaladas, não com os quartos. Depois, brinde, cotillón e festa até de madrugada, ou ir descansar, conforme o plano."
  faq:
    - p: "Quando são as Campanadas?"
      r: "Na noite de 31 de dezembro, às 00:00. As doze badaladas do relógio marcam a mudança de ano."
    - p: "Porque se comem doze uvas?"
      r: "É uma tradição que consiste em comer uma uva a cada badalada para receber o ano com sorte. Faz-se em toda a Espanha."
    - p: "Posso ir à Puerta del Sol?"
      r: "Sim, mas o acesso costuma ter lotação limitada e controlos de segurança. Consulta as condições da Câmara Municipal de Madrid e chega com tempo."
    - p: "Que canais as transmitem?"
      r: "Vários canais de televisão emitem as campanadas em direto a partir da Puerta del Sol. Consulta a programação."
    - p: "Como preparar as uvas?"
      r: "Descasca as uvas e tira as grainhas, tem doze preparadas e começa com as badaladas, não com os quartos que as precedem."
    - p: "É um bom programa com crianças?"
      r: "Sim, em casa ou num evento tranquilo. Com crianças pequenas, as uvas podem preparar-se descascadas, sem grainhas ou cortadas para evitar engasgamentos."

perseidas:
  texto:
    - "Die Perseiden, im Volksmund auch Laurentiustränen (Lágrimas de San Lorenzo) genannt, sind einer der am leichtesten und eindrucksvollsten zu beobachtenden Sternschnuppenschwärme in Spanien. Sie entstehen jedes Jahr, wenn die Erde durch die Staubspur des Kometen Swift-Tuttle fliegt."
    - "Die Aktivität dauert von Mitte Juli bis Ende August, das Maximum liegt meist zwischen dem 11. und 13. August. In einer klaren Nacht ohne Mond und mit dunklem Himmel können Dutzende Meteore pro Stunde zu sehen sein. Die Mondphase des jeweiligen Jahres spielt dabei eine große Rolle: Bei Vollmond sieht man deutlich weniger."
    - "Entscheidend ist, sich von der Lichtverschmutzung zu entfernen. Reservate und Ziele mit Starlight-Zertifizierung wie Monfragüe, die Sierra Sur de Jaén oder Gúdar-Javalambre sind eine hervorragende Wahl, und viele bieten geführte Beobachtungen an. Ein Teleskop oder Fernglas brauchst du nicht: Es genügt, sich hinzulegen und in den offenen Himmel zu schauen."
    - "Lass deine Augen etwa 20 bis 30 Minuten an die Dunkelheit gewöhnen und schau nicht aufs Handy. Nimm eine Decke oder Liege, warme Kleidung (auch wenn es tagsüber heiß ist) und etwas Warmes zu trinken mit. Die Stunden nach Mitternacht sind meist die besten."
  mapa:
    titulo: "Wo man die Perseiden sieht"
    centro: [39.5, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Monfragüe (Cáceres)", lat: 39.83, lon: -6.05, desc: "Nationalpark und Starlight-Reservat, mit geführten Himmelsbeobachtungen." }
      - { nombre: "Sierra Sur de Jaén", lat: 37.6, lon: -3.85, desc: "Starlight-Reservat mit sehr dunklem Himmel, rund um Alcalá la Real und Castillo de Locubín." }
      - { nombre: "Gúdar-Javalambre (Teruel)", lat: 40.2, lon: -0.7, desc: "Starlight-Reservat auf über 1.500 m Höhe, mit klarem Himmel und astrophysikalischem Observatorium." }
  faq:
    - p: "Wann sieht man die Perseiden?"
      r: "Die Aktivität reicht von Mitte Juli bis Ende August, mit dem Maximum um den 12. August, normalerweise zwischen dem 11. und 13. Die besten Stunden sind nach Mitternacht bis zum Morgengrauen."
    - p: "Wo sieht man sie in Spanien am besten?"
      r: "An jedem Ort mit dunklem, klarem Himmel. Ziele mit Starlight-Zertifizierung wie Monfragüe, die Sierra Sur de Jaén oder Gúdar-Javalambre bieten hervorragenden Himmel und geführte Beobachtungen."
    - p: "Braucht man ein Teleskop?"
      r: "Nein. Es sind sich schnell bewegende Meteore, die man mit bloßem Auge am besten sieht. Ferngläser und Teleskope verkleinern das Blickfeld und helfen nicht."
    - p: "In welche Richtung muss man schauen?"
      r: "Sie scheinen aus dem Sternbild Perseus im Nordosten zu kommen, aber die Meteore tauchen am ganzen Himmel auf. Am besten schaut man nach oben, ohne sich auf einen bestimmten Punkt zu fixieren."
    - p: "Spielt der Mond eine Rolle?"
      r: "Eine große. Bei Vollmond oder sehr hellem Mond sieht man viel weniger Meteore. Schau vor der Planung des Ausflugs am besten nach der Mondphase des jeweiligen Jahres."
    - p: "Was muss man mitnehmen?"
      r: "Eine Decke oder Liege, warme Kleidung, eine Taschenlampe mit Rotlicht (falls du eine brauchst), etwas Warmes zu trinken und Geduld. Vermeide weißes Licht, denn es beeinträchtigt das Nachtsehen."

cerezos-jerte:
  texto:
    - "Für einige Wochen im Frühling färbt sich das Valle del Jerte im Norden der Provinz Cáceres weiß, wenn Hunderttausende Kirschbäume blühen. Die Terrassen an den Hängen sehen aus wie verschneit, und die Garganta de los Infiernos sowie die Steindörfer des Tals runden das Schauspiel ab."
    - "Die Blüte kommt meist zwischen Ende März und Mitte April, doch der genaue Zeitpunkt ändert sich jedes Jahr je nach Winter und Temperaturen. Sie dauert nicht lange, pro Gebiet ein bis zwei Wochen, und verschiebt sich je nach Höhenlage nach vorn oder hinten. Informiere dich deshalb vor der Reise über den Stand der Blüte. In dieser Zeit findet das Kirschblütenfest (Fiesta del Cerezo en Flor) statt."
    - "Es ist ein sehr beliebter Plan, und an den Wochenenden der Hauptblüte werden Verkehr und Parkplatzsuche schwierig. Wenn du kannst, komm unter der Woche oder früh am Morgen, buche die Unterkunft rechtzeitig und hab Geduld auf den Straßen des Tals. Die Kirschbäume sind Nutzbäume mit Besitzern: Respektiere die Grundstücke, schneide keine Zweige ab und betritt keine abgesperrten Terrassen."
  mapa:
    titulo: "Wo man die Kirschblüte sieht"
    centro: [40.2, -5.77]
    zoom: 11
    puntos:
      - { nombre: "Garganta de los Infiernos", lat: 40.22, lon: -5.76, desc: "Naturreservat am Oberlauf des Tals, mit Wanderwegen und Badestellen am Fluss." }
      - { nombre: "Jerte", lat: 40.2147, lon: -5.7508, desc: "Steindorf am Eingang der Garganta, mit Besucherzentrum und Kirschbäumen auf den Terrassen." }
      - { nombre: "Navaconcejo", lat: 40.1747, lon: -5.7978, desc: "Dorf im Tal, von Kirschbäumen umgeben; gute Basis, um die Blüte zu sehen." }
      - { nombre: "Cabezuela del Valle", lat: 40.1697, lon: -5.7014, desc: "Kirschbäume an den Hängen und Steingassen, im mittleren Abschnitt des Tals." }
  faq:
    - p: "Wann blühen die Kirschbäume im Jerte?"
      r: "Normalerweise zwischen Ende März und Mitte April, in jedem Gebiet ein bis zwei Wochen lang. Der Zeitpunkt ändert sich jedes Jahr mit dem Wetter, schau also vor der Reise nach dem Stand der Blüte."
    - p: "Wo sieht man die Kirschblüte?"
      r: "Das Valle del Jerte (Cáceres) ist das bekannteste, mit Orten wie Cabezuela del Valle, Navaconcejo oder Jerte und Routen wie der durch die Garganta de los Infiernos."
    - p: "Darf man die Terrassen betreten?"
      r: "Es sind private Anbauflächen. Spaziere auf ausgeschilderten Wegen und Aussichtspunkten, betritt die Parzellen nicht und pflücke keine Blüten oder Zweige ab."
    - p: "Muss man die Unterkunft reservieren?"
      r: "Ja, rechtzeitig, denn an den Wochenenden der Hauptblüte ist alles ausgebucht. Die Nachbarorte in La Vera oder Plasencia sind eine Alternative."
    - p: "Wie vermeide ich Menschenmassen?"
      r: "Komm unter der Woche, früh am Morgen oder am späten Nachmittag und meide die Wochenenden mit der intensivsten Farbe. Am besten parkst du auf den dafür vorgesehenen Flächen und gehst zu Fuß."
    - p: "Ist das ein guter Plan mit Kindern?"
      r: "Ja, die leichten Routen durchs Tal sind für Familien geeignet. Wenn dein Kind eine Pollenallergie hat, nimm Medikamente mit, denn im Frühling ist die Blüte intensiv."

nieve:
  texto:
    - "In den Schnee zu fahren gehört zu den großen Winterplänen, sei es zum Skifahren, Spazieren, Rodeln oder einfach, um die weiße Bergwelt zu sehen. Spanien hat Skigebiete und verschneite Landschaften in der Sierra Nevada, den Pyrenäen, dem Kantabrischen Gebirge und dem Sistema Central."
    - "Die Saison geht von Dezember bis März, wobei der Schnee stark vom jeweiligen Winter abhängt. Informiere dich vor der Abfahrt über den Zustand der Pisten und Straßen: Es können Schneeketten oder Winterreifen nötig sein, und die Zufahrten zu den Skigebieten sind an Wochenenden und langen Wochenenden überlastet. Schau vor und während der Fahrt in die Verkehrsinformationen."
    - "Du musst nicht Ski fahren. Viele Skigebiete und Täler bieten Rodelbahnen, Schneeschuhrouten, Langlauf und Schneespaziergänge, und die Ausrüstung kann man leihen. Buche Skipass und Ausrüstung in den Hauptzeiten rechtzeitig. Nimm wasserdichte Kleidung im Zwiebellook, Sonnenbrille, Sonnencreme und Ersatzhandschuhe mit, denn Sonne und Schneereflexion täuschen."
  mapa:
    titulo: "Wohin in den Schnee"
    centro: [40.5, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Sierra Nevada (Granada)", lat: 37.09, lon: -3.4, desc: "Das südlichste Skigebiet Europas, mit Skipisten sowie Spazier- und Rodelbereichen." }
      - { nombre: "Aragonesische Pyrenäen (Formigal)", lat: 42.78, lon: -0.37, desc: "Großes Skigebiet der Pyrenäen, mit Langlauf und Schneeschuhrouten in der Nähe." }
      - { nombre: "Katalanische Pyrenäen (Baqueira Beret)", lat: 42.7, lon: 0.93, desc: "Eines der größten Skigebiete der Pyrenäen, im Valle de Arán." }
      - { nombre: "Kantabrisches Gebirge (San Isidro)", lat: 43.05, lon: -5.37, desc: "Skigebiet zwischen León und Asturien, mit der Hochgebirgslandschaft des Kantabrischen Gebirges." }
      - { nombre: "Sistema Central (Navacerrada)", lat: 40.79, lon: -4.01, desc: "Der Schnee, der Madrid am nächsten liegt, mit Pisten und Rodelbereichen; die Zufahrten sind an Wochenenden überlastet." }
  faq:
    - p: "Wann gibt es in Spanien Schnee?"
      r: "Normalerweise von Dezember bis März, wobei Januar und Februar die verlässlichsten Monate sind. Es hängt stark vom jeweiligen Winter und von der Höhenlage ab."
    - p: "Wohin geht man in den Schnee?"
      r: "Die Sierra Nevada (Granada), die Pyrenäen (Huesca, Lleida, Navarra), das Kantabrische Gebirge, das Sistema Central (Madrid, Segovia) oder das Iberische Randgebirge (Sistema Ibérico) bieten Skigebiete und Routen."
    - p: "Muss man Ski fahren können?"
      r: "Nein. Es gibt Rodeln, Schneeschuhrouten, Langlauf, Schneebereiche für Kinder und Spaziergänge. Wenn du Ski fahren möchtest, bieten viele Skischulen Anfängerkurse an."
    - p: "Brauche ich Schneeketten?"
      r: "Das hängt von der Straße und vom Tag ab. Schau in die Verkehrsinformationen und nimm Schneeketten oder Winterreifen mit. Manchmal ist die Mitführpflicht vorgeschrieben, und ohne sie wird die Straße gesperrt."
    - p: "Muss man reservieren?"
      r: "In den Hauptzeiten (lange Wochenenden, Weihnachten, Schneewochenenden) empfiehlt es sich, Skipass, Leihausrüstung und Unterkunft zu buchen. Online kaufen ist meist günstiger und schneller."
    - p: "Welche Kleidung soll man mitnehmen?"
      r: "Wasserdichte Kleidung im Zwiebellook, Handschuhe und Mütze, Sonnen- oder Skibrille, Sonnenschutz und Schuhe mit gutem Profil. Trockene Wechselkleidung für die Rückfahrt schadet nie."

festival-san-sebastian:
  texto:
    - "Das Filmfestival von San Sebastián, bekannt als Zinemaldia, ist eines der großen Filmfestivals Spaniens und Europas. Es findet im September in Donostia-San Sebastián statt, mit internationalen Premieren, Stars auf dem roten Teppich und öffentlichen Vorführungen."
    - "Das Programm umfasst die offizielle Wettbewerbssektion, in der um die Goldene Muschel (Concha de Oro) gekämpft wird, außerdem Nebenreihen, Retrospektiven und Ehrungen wie den Donostia-Preis für das Lebenswerk. Die Vorführungen verteilen sich auf mehrere Kinos und Orte der Stadt, darunter das Kursaal und das Teatro Victoria Eugenia, und ein großer Teil davon steht allen Zuschauern offen."
    - "Auf der offiziellen Website findest du Programm, Zeiten und den Kartenverkauf; die Tickets kommen meist nur wenige Tage vor den Vorstellungen in den Verkauf und sind schnell ausverkauft. Stell dich früh an, schau dir die Zeiten an, um Vorstellungen zu kombinieren, und nutze die Gelegenheit für einen Stadtspaziergang und ein paar Pintxos. Im September kann es regnen: Nimm einen Regenschirm mit."
  faq:
    - p: "Wann findet das Filmfestival von San Sebastián statt?"
      r: "Im September, etwa neun Tage lang. Die genauen Termine werden jedes Jahr bekannt gegeben."
    - p: "Kann jeder hingehen?"
      r: "Ja. Neben den Vorführungen für Fachleute und Presse gibt es viele öffentliche Vorführungen mit Eintrittskarte."
    - p: "Wo kaufe ich die Tickets?"
      r: "Über die offiziellen Kanäle des Festivals. Sie werden kurzfristig verkauft, und die beliebtesten Vorstellungen sind schnell ausverkauft."
    - p: "Was ist die Concha de Oro?"
      r: "Das ist der Hauptpreis des Festivals, der für den besten Film der offiziellen Sektion vergeben wird."
    - p: "Kann man die Stars sehen?"
      r: "Auf dem roten Teppich vor dem Teatro Victoria Eugenia ist meist Publikum. Schau dir die Zeiten an und komm früh."
    - p: "Was kann man in San Sebastián sonst noch machen?"
      r: "An der Bucht La Concha spazieren, in der Altstadt (Parte Vieja) Pintxos probieren und den Monte Igueldo besuchen."

semana-santa-sevilla:
  texto:
    - "Die Karwoche (Semana Santa) von Sevilla ist wahrscheinlich die berühmteste Spaniens. Acht Tage lang ziehen rund sechzig Bruderschaften (hermandades) mit ihren Christus- und Marienfiguren auf Prozessionsbühnen (pasos) durch die Stadt, begleitet von Büßern (nazarenos), Musikkapellen und Tausenden Menschen auf den Straßen."
    - "Alle Bruderschaften ziehen durch die Carrera Oficial, die von der Campana bis zur Kathedrale reicht. Die Nacht zwischen Gründonnerstag und Karfreitag ist die Madrugá, die gefühlvollste und am stärksten besuchte, mit Bruderschaften wie El Silencio, Gran Poder, La Macarena, Los Gitanos und La Esperanza de Triana."
    - "Es ist ein Massenfest: Die Straßen im Zentrum füllen sich, und die Umzüge brauchen Stunden, um vorbeizuziehen. Lade das offizielle Programm herunter, such dir die Bruderschaften aus, die du sehen möchtest, und komm rechtzeitig. Buche die Unterkunft Monate im Voraus, nutze öffentliche Verkehrsmittel und sei geduldig bei Straßensperrungen. Und denk daran: Es ist eine religiöse Handlung, also respektiere die Stille und die Büßer."
  faq:
    - p: "Wann ist die Karwoche in Sevilla?"
      r: "Vom Palmsonntag bis zum Ostersonntag, der sich jedes Jahr zwischen März und April verschiebt. Schau im offiziellen Kalender nach den genauen Terminen."
    - p: "Was ist die Madrugá?"
      r: "Das ist die Nacht zwischen Gründonnerstag und Karfreitag. In diesen Stunden ziehen mehrere der bekanntesten Bruderschaften aus, und es ist der Moment mit dem größten Andrang und den stärksten Gefühlen."
    - p: "Wo sieht man die Prozessionen?"
      r: "In der Carrera Oficial (von der Campana bis zur Kathedrale) ist viel los, aber es sind auch sehr viele Menschen da. In anderen Teilen des Zentrums oder in Vierteln wie Triana kann man sie in größerer Ruhe sehen."
    - p: "Muss man reservieren?"
      r: "Nicht, um die Prozessionen von der Straße aus zu sehen, aber sehr wohl Unterkunft und Restaurants, die Monate im Voraus ausgebucht sind."
    - p: "Wie finde ich die Zeiten?"
      r: "Der Consejo de Hermandades y Cofradías veröffentlicht das offizielle Programm mit den Routen und Zeiten jeder Bruderschaft. Außerdem gibt es Apps und Websites mit Echtzeitverfolgung."
    - p: "Was sollte man mitnehmen oder beachten?"
      r: "Bequeme Schuhe, Kleidung im Zwiebellook und Geduld. Respektiere die Stille, quere die Umzüge nicht und vermeide Blitzlicht in der Nähe der Prozessionsbühnen."
fallas:
  texto:
    - "Las Fallas sono la festa di Valencia in onore di San Giuseppe, dal 15 al 19 marzo. Dichiarate Patrimonio Culturale Immateriale dell'Umanità dall'UNESCO, uniscono monumenti di cartapesta e legno, pirotecnia, musica, polvere da sparo e tanta vita per strada."
    - "Le fallas sono enormi monumenti satirici che vengono eretti per le strade il giorno 15. Si possono visitare a piedi e le più importanti concorrono per dei premi. Ogni giorno alle 14:00 la mascletà, una sinfonia di polvere da sparo in plaza del Ayuntamiento, è un appuntamento imperdibile. Il 17 e il 18 si celebra l'Offerta di Fiori alla Virgen de los Desamparados."
    - "Il gran finale arriva la notte del 19 marzo con la cremà: le fallas vanno a fuoco, a cominciare da quelle infantili e finendo con quella grande, a mezzanotte. Prenota l'alloggio con mesi di anticipo, usa i mezzi pubblici e vai con anticipo per trovare posto alla mascletà. Fai attenzione ai petardi per strada e ai bambini piccoli."
  faq:
    - p: "Quando si tengono Las Fallas?"
      r: "Dal 15 al 19 marzo ogni anno. La plantà è il giorno 15 e la cremà la notte del 19."
    - p: "Cos'è la mascletà?"
      r: "È uno spettacolo di polvere da sparo che punta sul suono e sulla potenza più che sui colori. Si spara ogni giorno alle 14:00 in plaza del Ayuntamiento e lo si sente nel corpo."
    - p: "Cos'è la cremà?"
      r: "È il rogo delle fallas la notte del 19 marzo, con l'incendio finale della falla municipale a mezzanotte."
    - p: "Come spostarsi a Valencia durante Las Fallas?"
      r: "A piedi e con i mezzi pubblici. Ci sono chiusure al traffico e parcheggiare è quasi impossibile. La metropolitana potenzia il servizio."
    - p: "Cosa si mangia?"
      r: "Frittelle di zucca con cioccolata, paella e panini di strada. Le frittelle sono il sapore tipico di questa festa."
    - p: "È un buon programma con i bambini?"
      r: "Sì, ci sono fallas infantili e varie attività, ma il rumore dei petardi e la folla possono mettere a disagio i più piccoli."
semana-santa:
  texto:
    - "La Settimana Santa è la settimana che precede la Domenica di Resurrezione, dalla Domenica delle Palme alla Domenica di Pasqua, ed è una delle celebrazioni più sentite e visitate della Spagna. Confraternite e hermandades portano in strada i loro pasos e le loro immagini in processioni che uniscono fede, arte, musica e tradizione."
    - "Ogni città ha il suo stile. A Siviglia e Malaga spiccano i grandi troni e i baldacchini, a Valladolid, Zamora o Salamanca le processioni sono più sobrie e di scultura castigliana, e in luoghi come Cuenca o Murcia ci sono usanze molto particolari. Molte sono Feste di Interesse Turistico Internazionale."
    - "Poiché le date dipendono dalla Pasqua, cambiano ogni anno, tra marzo e aprile. Se pensi di viaggiare, prenota l'alloggio con largo anticipo e consulta gli itinerari e gli orari ufficiali di ogni confraternita, che vengono pubblicati settimane prima. Le processioni sono atti religiosi: rispetta il silenzio, non attraversare tra i cortei ed evita il flash al passaggio dei pasos."
  faq:
    - p: "Quando si tiene la Settimana Santa?"
      r: "È la settimana che precede la Domenica di Resurrezione, che cade ogni anno in una data diversa tra fine marzo e fine aprile. Va dalla Domenica delle Palme alla Domenica di Pasqua."
    - p: "Dove vedere le processioni più belle?"
      r: "Siviglia, Malaga, Valladolid, Zamora, Salamanca, Cuenca, Murcia e Cartagena sono tra le più conosciute, ciascuna con uno stile molto diverso. Molte sono Feste di Interesse Turistico Internazionale."
    - p: "Bisogna pagare per vedere le processioni?"
      r: "No. Si vedono gratis dalla strada. In alcune città ci sono sedie a pagamento sul percorso ufficiale o in tratti specifici."
    - p: "In quali giorni ci sono più processioni?"
      r: "Giovedì Santo e Venerdì Santo sono di solito i giorni di maggiore affluenza, e la nottata tra i due è quella con più atmosfera in città come Siviglia. Anche la Domenica delle Palme e il Sabato Santo hanno processioni."
    - p: "Come mi organizzo per vederle?"
      r: "Consulta il programma ufficiale di ogni confraternita, con orari e itinerari, arriva con anticipo per trovare un buon posto e abbi pazienza: i cortei avanzano lentamente e le strade vengono chiuse al traffico."
    - p: "È un buon programma con i bambini?"
      r: "Sì, ma con attenzione: c'è molta gente e molte ore di attesa. Scegli le processioni del pomeriggio, cerca un posto con spazio e spiega loro che è un atto di rispetto."
feria-abril:
  texto:
    - "La Feria de Abril di Siviglia è una settimana di festa con casetas, sevillanas, cavalli e carrozze, e abiti da flamenca. Si tiene nel Real de la Feria, nel quartiere di Los Remedios, circa due settimane dopo la Settimana Santa."
    - "La feria si apre con l'Alumbrado, la notte del lunedì, quando si accendono le migliaia di lampadine del portale d'ingresso. Durante la settimana, da mezzogiorno, c'è una sfilata di cavalli e carrozze; da quel momento le casetas si riempiono di musica, ballo, cibo e bevande: rebujito, fino, prosciutto e pescaíto frito. La domenica si chiude con uno spettacolo di fuochi d'artificio."
    - "Una cosa da sapere: la maggior parte delle casetas è privata e vi entra solo chi ha un invito o è socio. Ci sono anche casetas pubbliche e alcune del comune, aperte a tutti, e le strade e il Real si possono percorrere liberamente. Di solito ci si veste bene: abito da flamenca per le donne e traje corto o completo per gli uomini."
  faq:
    - p: "Quando si tiene la Feria de Abril?"
      r: "Di solito inizia due settimane dopo la Domenica di Resurrezione, tra aprile e maggio. Dura una settimana, con l'Alumbrado la notte del lunedì."
    - p: "Posso entrare in qualsiasi caseta?"
      r: "No. La maggior parte è privata e si entra solo con invito o essendo soci. Ci sono casetas pubbliche e del comune aperte a tutti."
    - p: "Quanto costa entrare alla feria?"
      r: "L'ingresso al recinto è gratuito. Si paga quello che si consuma, e le attrazioni della calle del Infierno sono a pagamento."
    - p: "Cosa bisogna indossare?"
      r: "Molti visitatori indossano l'abito da flamenca o il traje corto, ma non è obbligatorio. La cosa più importante sono le scarpe comode, perché si cammina molto."
    - p: "Come arrivare?"
      r: "In metropolitana, tram o autobus. Evita di andare in auto: parcheggiare è quasi impossibile e la zona viene chiusa al traffico."
    - p: "È un buon programma con i bambini?"
      r: "Di giorno sì, con la sfilata di cavalli e casetas per famiglie. La calle del Infierno ha le giostre. La sera c'è più gente e più rumore."
san-fermin:
  texto:
    - "I Sanfermines sono la festa di Pamplona, dal 6 al 14 luglio, e una delle celebrazioni più conosciute al mondo. Iniziano con il chupinazo in plaza del Ayuntamiento, a mezzogiorno del 6 luglio, e terminano a mezzanotte del 14 con il Pobre de mí."
    - "Il grande simbolo sono gli encierros, la corsa dei tori: ogni mattina, alle otto, i tori corrono lungo un percorso di circa 850 metri dal corral de Santo Domingo fino alla plaza de toros. Ma i Sanfermines sono molto di più: la processione di San Fermín il 7 luglio, giganti e cabezudos, concerti, fuochi d'artificio, abiti bianchi con fazzoletto rosso e un'atmosfera di strada di giorno e di notte."
    - "Correre l'encierro è pericoloso e ha delle regole: bisogna essere maggiorenni, non aver bevuto alcol e rispettare le indicazioni dell'organizzazione. Se preferisci guardarlo, puoi farlo in televisione o da qualche punto autorizzato, che si riempie molto presto. Prenota l'alloggio con mesi di anticipo, perché i prezzi salgono e la città si riempie."
  faq:
    - p: "Quando si tengono i Sanfermines?"
      r: "Dal 6 al 14 luglio ogni anno. Iniziano con il chupinazo il giorno 6 a mezzogiorno e terminano con il Pobre de mí a mezzanotte del 14."
    - p: "A che ora sono gli encierros?"
      r: "Ogni mattina alle 8:00 dal 7 al 14 luglio. Dura appena qualche minuto."
    - p: "Come vedere un encierro?"
      r: "In televisione, oppure dal vivo da zone autorizzate, che si riempiono molto presto. Su alcuni balconi ci sono posti a pagamento. I punti con vista sul percorso si riempiono già prima dell'alba."
    - p: "Può correre chiunque?"
      r: "No. Bisogna essere maggiorenni, non essere sotto l'effetto di alcol o altre sostanze e rispettare le regole dell'organizzazione. È un'attività pericolosa e ogni anno ci sono dei feriti."
    - p: "Come vestirsi?"
      r: "Tradizionalmente, abiti bianchi con fazzoletto rosso al collo e fascia rossa. Scarpe comode e chiuse e un cambio di vestiti, perché ci si sporca quasi sicuramente."
    - p: "È un buon programma con i bambini?"
      r: "L'atmosfera diurna è familiare, con giganti, cabezudos e attività per bambini. Di notte c'è più folla. Conviene evitare gli encierros e le zone più affollate."
tomatina:
  texto:
    - "La Tomatina è la più grande battaglia di pomodori del mondo. Si tiene a Buñol, un paese della provincia di Valencia, l'ultimo mercoledì di agosto, e per circa un'ora migliaia di persone si lanciano pomodori maturi finché le strade non si tingono di rosso."
    - "Per partecipare serve il biglietto. Il comune limita la capienza e vende i biglietti in anticipo, quindi conviene acquistarli per tempo sui canali ufficiali e diffidare dei rivenditori. La festa inizia con il palo jabón, un palo unto con un prosciutto in cima, e la battaglia comincia quando viene sparato un razzo verso le 11 del mattino."
    - "Porta vestiti vecchi e scarpe che non ti dispiaccia perdere, occhialini da nuoto per proteggere gli occhi e guanti. Schiaccia il pomodoro prima di lanciarlo per non far male e non lanciare nient'altro che pomodori. Non portare oggetti di valore né macchine fotografiche e parti da Valencia con anticipo, ad esempio in treno o con gli autobus organizzati per quel giorno."
  faq:
    - p: "Quando si tiene la Tomatina?"
      r: "L'ultimo mercoledì di agosto, a Buñol (Valencia). La battaglia dura circa un'ora, a partire dalle 11 del mattino."
    - p: "Serve il biglietto?"
      r: "Sì. La capienza è limitata e i biglietti si comprano in anticipo tramite i canali ufficiali. Evita di acquistare dai rivenditori."
    - p: "Come arrivare a Buñol?"
      r: "Da Valencia, in treno regionale (Cercanías) o in autobus. Conviene arrivare con anticipo, perché il giorno della festa c'è moltissima gente."
    - p: "Come vestirsi?"
      r: "Vestiti vecchi e scarpe che non ti dispiaccia perdere. Molti partecipanti usano occhialini da nuoto per proteggersi gli occhi e guanti."
    - p: "Quali sono le regole?"
      r: "Schiaccia il pomodoro prima di lanciarlo, non lanciare nient'altro che pomodori, non portare oggetti di vetro né di valore e segui le indicazioni dell'organizzazione."
    - p: "È un buon programma con i bambini?"
      r: "C'è un'età minima per partecipare e la festa è molto affollata. Consulta le condizioni ufficiali prima di acquistare i biglietti."
san-juan:
  texto:
    - "A Noite de São João, a véspera de 24 de junho, é uma das celebrações mais antigas ligadas ao solstício de verão. Em toda a Espanha acendem-se fogueiras, fazem-se rituais para pedir desejos e celebram-se festas em praias, praças e montanhas."
    - "Algumas das mais conhecidas são as de A Corunha, com fogueiras nas praias de Riazor e do Orzán, as Hogueras de Alicante, Festa de Interesse Turístico Internacional, a Revetlla de Sant Joan na Catalunha, com petardos e coca de Sant Joan, e as festas do fogo do solstício nos Pirenéus, reconhecidas pela UNESCO."
    - "É costume saltar a fogueira, tomar banho à meia-noite ou escrever um desejo num papel e queimá-lo. Faz tudo em segurança: usa apenas as fogueiras autorizadas, não acendas fogo por tua conta em zonas de risco, vigia as crianças com os petardos e tem muito cuidado com o banho noturno. E não deixes lixo na praia."
  faq:
    - p: "Quando é a noite de São João?"
      r: "Na noite de 23 para 24 de junho, sendo o dia 24 feriado em algumas comunidades."
    - p: "Onde ver as fogueiras?"
      r: "A Corunha, Alicante, Barcelona, Cádis e muitas praias da costa têm celebrações muito populares. Consulta o programa de cada câmara municipal."
    - p: "Podem acender-se fogueiras?"
      r: "Só onde for autorizado. Em muitos areais e zonas florestais é proibido acender fogo por conta própria, e há risco de multa e de incêndio."
    - p: "Que rituais se fazem?"
      r: "Saltar a fogueira, pedir desejos, escrever e queimar um papel com aquilo que queres deixar para trás e tomar banho à meia-noite. Cada zona tem os seus costumes."
    - p: "É seguro tomar banho de noite?"
      r: "Há risco, sobretudo com álcool e pouca visibilidade. Toma banho apenas em praias vigiadas, acompanhado e sem te afastares da margem."
    - p: "É um bom programa com crianças?"
      r: "Sim, há muitas atividades familiares, mas convém vigiar o fogo e os petardos e evitar as horas de maior aglomeração."
batalla-vino:
  texto:
    - "A Batalla del Vino de Haro é uma festa única: todos os anos, a 29 de junho, milhares de pessoas atiram vinho tinto umas às outras nos Riscos de Bilibio, a poucos quilómetros de Haro, em La Rioja. É uma celebração de São Pedro que combina tradição religiosa, vinho e muito humor."
    - "O dia começa com uma procissão desde a vila até aos Riscos de Bilibio e uma missa na ermida de San Felices. Depois começa a batalha, com baldes, pistolas, botas de vinho e regadores, e esvaziam-se milhares de litros de vinho. Quase toda a gente se veste de branco e leva um lenço roxo."
    - "Leva roupa branca que não te importes de estragar, calçado confortável que se possa molhar e óculos para proteger os olhos. Não leves objetos de valor nem câmaras que possam sujar-se, e tem em conta que a festa é muito concorrida. Reserva alojamento e transporte com antecedência e bebe com moderação."
  faq:
    - p: "Quando é a Batalla del Vino?"
      r: "Todos os anos a 29 de junho, dia de São Pedro, nos Riscos de Bilibio, perto de Haro (La Rioja)."
    - p: "Que roupa levar?"
      r: "Roupa branca que não te importes de estragar e calçado confortável. Muitos participantes usam óculos de natação e lenço roxo."
    - p: "Como chegar?"
      r: "Desde Haro, a maioria das pessoas vai a pé em procissão ou em transporte organizado. Evita levar carro, porque estacionar é complicado."
    - p: "É preciso bilhete?"
      r: "Em geral é uma festa popular de acesso livre, mas convém consultar as condições e o programa da Câmara Municipal de Haro."
    - p: "É seguro?"
      r: "É uma festa muito concorrida e com vinho, por isso há que ter cuidado, proteger os olhos e não ir sozinho."
    - p: "É um bom programa com crianças?"
      r: "É muito concorrida e molhada, por isso não costuma recomendar-se para crianças pequenas."
romeria-rocio:
  texto:
    - "A Romería del Rocío é uma das peregrinações mais concorridas de Espanha. Centenas de milhares de pessoas viajam a pé, a cavalo e em carroças, desde vários pontos da Andaluzia, até à aldeia de El Rocío, em Almonte (Huelva), por altura do Pentecostes."
    - "Os romeiros, organizados em irmandades, percorrem durante dias os caminhos de Doñana, entre cantares, orações, danças e convívio. O ponto culminante chega na madrugada da segunda-feira de Pentecostes, quando os habitantes de Almonte saltam a grade e levam em procissão a Virgem do Rocío."
    - "Se quiseres vivê-la sem seres peregrino, podes visitar a aldeia e ver a passagem das irmandades e das carroças. As ruas são de areia e há muita gente, o calor é forte e os alojamentos e os lugares de estacionamento esgotam-se. Leva água, calçado confortável e muita paciência, e respeita o carácter religioso da romaria e o meio natural de Doñana."
  faq:
    - p: "Quando é a Romería del Rocío?"
      r: "Por altura do Pentecostes, 50 dias depois do Domingo de Páscoa, normalmente entre maio e junho. O dia principal é a segunda-feira."
    - p: "Onde se celebra?"
      r: "Na aldeia de El Rocío, em Almonte (Huelva), junto ao Parque Nacional de Doñana."
    - p: "O que é o salto da grade?"
      r: "É o momento em que os habitantes de Almonte saltam a grade que protege a Virgem para a levarem em procissão, na madrugada da segunda-feira de Pentecostes."
    - p: "Pode ir-se sem ser romeiro?"
      r: "Sim, mas o acesso é complicado: há muita gente, pouco estacionamento e ruas de areia. Informa-te com antecedência sobre como chegar e se há restrições de trânsito."
    - p: "O que é preciso levar?"
      r: "Água, chapéu, proteção solar, calçado confortável e roupa para o calor do dia e o fresco da noite. Respeita o meio natural e não deixes lixo."
    - p: "É um bom programa com crianças?"
      r: "Com cuidado: há muito calor, muita gente e percursos longos. É melhor visitar a aldeia nas horas de menos afluência."
feria-malaga:
  texto:
    - "A Feria de Málaga, em meados de agosto, é uma das feiras mais animadas do sul: uma semana de música, dança, casetas, fogo de artifício e vinho doce. Realiza-se em dois cenários: a Feria del Centro, de dia, e a Feria de Cortijo de Torres, de noite."
    - "Durante o dia, o centro histórico enche-se de peñas, música, fandangos verdiales e pessoas vestidas de cigana ou de traje curto. À noite, o recinto de Cortijo de Torres reúne casetas, diversões, concertos e muito ambiente. Há atividades para todos os públicos, e muito pescaíto frito e vinho de Málaga."
    - "Vai ao centro de dia e ao recinto de noite. Evita o carro e usa os autocarros ou o transporte público da feira, porque o trânsito e o estacionamento são complicados. Leva calçado confortável, roupa fresca e paciência, e reserva alojamento com antecedência."
  faq:
    - p: "Quando é a Feria de Málaga?"
      r: "Em meados de agosto, durante uma semana. As datas exatas mudam todos os anos."
    - p: "O que é a Feria del Centro?"
      r: "A parte diurna da feira, no centro histórico, com música, dança e ambiente popular."
    - p: "O que é Cortijo de Torres?"
      r: "O recinto da feira onde esta se celebra de noite, com casetas, concertos e diversões."
    - p: "Como chegar a Cortijo de Torres?"
      r: "Em autocarros e serviços especiais da feira. Evita o carro, porque estacionar é difícil."
    - p: "O que se come e se bebe?"
      r: "Pescaíto frito, espetos, presunto e vinho doce de Málaga, entre outras coisas."
    - p: "É um bom programa com crianças?"
      r: "De dia e no centro, sim. À noite há muita gente e muito ruído."
fiesta-santiago-apostol:
  texto:
    - "As Fiestas del Apóstol Santiago celebram o dia do padroeiro de Espanha e da Galiza, a 25 de julho, que é também o Dia Nacional da Galiza. Realizam-se em Santiago de Compostela, numa semana com atos religiosos, concertos, atividades populares e muito ambiente."
    - "Destacam-se dois momentos: a véspera, na noite de 24 de julho, com o espetáculo de fogo de artifício em frente à fachada do Obradoiro da catedral, e o dia 25 de julho, com a Ofrenda Nacional al Apóstol na catedral. Quando o dia 25 de julho cai a um domingo celebra-se o Ano Santo Compostelano, com ainda mais afluência de peregrinos."
    - "Santiago enche-se de visitantes, peregrinos e turistas durante essas datas. Reserva alojamento com antecedência, consulta o programa oficial e chega cedo à praça do Obradoiro se quiseres ver o fogo de artifício. Leva calçado confortável e um impermeável, porque na Galiza o tempo muda depressa."
  faq:
    - p: "Quando são as Fiestas del Apóstol?"
      r: "Por volta de 25 de julho, sendo a véspera, dia 24, a noite do fogo de artifício."
    - p: "O que é o fogo de artifício do Apóstolo?"
      r: "Um espetáculo pirotécnico que se realiza na noite de 24 de julho em frente à fachada do Obradoiro da catedral."
    - p: "O que é a Ofrenda Nacional?"
      r: "Um ato religioso e oficial que se celebra a 25 de julho na catedral, com uma oferenda ao Apóstolo Santiago."
    - p: "O que é o Ano Santo?"
      r: "Um ano jubilar compostelano que se celebra quando o dia 25 de julho cai a um domingo. Atrai muito mais peregrinos."
    - p: "É preciso reservar alojamento?"
      r: "Sim, com muita antecedência, porque Santiago se enche nessas datas."
    - p: "É um bom programa com crianças?"
      r: "Sim, há atividades familiares, mas o fogo de artifício e as aglomerações do Obradoiro são muito concorridos."
calcotada:
  texto:
    - "A calçotada é uma refeição típica da Catalunha, sobretudo do Camp de Tarragona e do Alt Camp: calçots (cebolinhos tenros) assados na brasa, descascados à mão e molhados em molho romesco. É uma refeição de celebração, com babete, boa companhia e uma longa conversa à mesa."
    - "A época começa por volta de dezembro e vai até abril, com o ponto alto entre janeiro e março. Valls, no Alt Camp, é a capital do calçot e organiza no final de janeiro uma grande festa, com concurso e refeição popular. Além de na Catalunha, também há calçotadas noutras zonas de Espanha."
    - "Costuma comer-se com carne grelhada, butifarra, feijão e vinho ou cava. Reserva com antecedência, sobretudo ao fim de semana, porque em época alta fica tudo cheio. Come-se com as mãos: pega-se no calçot pela base, puxa-se a folha exterior, molha-se no romesco e come-se a parte tenra de cima. Suja, por isso o babete não é exagero."
  mapa:
    titulo: "Onde ir a uma calçotada"
    centro: [41.22, 1.25]
    zoom: 10
    puntos:
      - { nombre: "Valls (Alt Camp)", lat: 41.2872, lon: 1.2507, desc: "Capital do calçot: no final de janeiro celebra a sua grande festa, com concurso e refeição popular." }
      - { nombre: "Camp de Tarragona", lat: 41.12, lon: 1.2, desc: "Zona de origem do calçot, com casas rurais e restaurantes que preparam calçotadas na época." }
      - { nombre: "Alt Camp", lat: 41.36, lon: 1.32, desc: "Comarca do interior do calçot, com calçotadas em aldeias e casas rurais; melhor com reserva." }
  faq:
    - p: "O que é um calçot?"
      r: "É uma variedade de cebolinho tenro típica da Catalunha. Assa-se na brasa até a camada exterior ficar preta, embrulha-se para cozer no seu próprio vapor e come-se com molho romesco."
    - p: "Quando é a época dos calçots?"
      r: "De dezembro a abril, aproximadamente, com o auge entre janeiro e março."
    - p: "Onde ir a uma calçotada?"
      r: "O Camp de Tarragona e o Alt Camp, com Valls como capital, são as zonas de referência, mas há restaurantes e casas rurais com calçotada em toda a Catalunha."
    - p: "É preciso reservar?"
      r: "Sim, com antecedência, sobretudo ao fim de semana e em janeiro e fevereiro. Muitos sítios só servem calçotada por encomenda."
    - p: "Como se comem os calçots?"
      r: "Com as mãos: pega-se pela base, puxa-se para cima para tirar a camada queimada, molha-se no romesco e come-se pela parte tenra. Costuma usar-se babete."
    - p: "O que mais inclui o menu?"
      r: "Normalmente carne grelhada (borrego, butifarra), feijão, pão com tomate, sobremesa e vinho ou cava. Cobra-se um menu fechado por pessoa."
carnaval-cadiz:
  texto:
    - "O Carnaval de Cádiz é um dos mais famosos e diferentes de Espanha. A sua alma é a sátira: chirigotas, comparsas, coros e quartetos que cantam coplas com humor e crítica sobre a atualidade, e que enchem as ruas e os teatros durante semanas."
    - "O Concurso de Agrupaciones do Gran Teatro Falla, em fevereiro, é a grande montra das coplas. Na rua, o ambiente de disfarces, música e copla vive-se sobretudo no fim de semana de Carnaval, com desfiles, cortejo e agrupamentos de rua que cantam em praças e esquinas."
    - "Os bilhetes do Teatro Falla esgotam muito depressa. O melhor do Carnaval de Cádiz está na rua, sem necessidade de bilhete: disfarça-te, segue as agrupaciones e deixa que as coplas te surpreendam. Reserva alojamento com antecedência e vai preparado para muita gente."
  faq:
    - p: "Quando é o Carnaval de Cádiz?"
      r: "Celebra-se antes da Quaresma, entre fevereiro e março, consoante o ano. A data depende da Páscoa."
    - p: "O que são as chirigotas?"
      r: "São agrupamentos que cantam coplas satíricas e humorísticas sobre a atualidade, com disfarces coletivos. É o género mais popular do carnaval gaditano."
    - p: "É preciso bilhete?"
      r: "Para o Concurso do Gran Teatro Falla sim, e esgotam depressa. O Carnaval de rua é gratuito."
    - p: "Onde ver o ambiente de rua?"
      r: "No centro histórico de Cádiz: ruas e praças enchem-se de agrupamentos e de gente disfarçada, sobretudo ao fim de semana."
    - p: "É preciso ir disfarçado?"
      r: "Não é obrigatório, mas muitíssima gente fá-lo e o ambiente é melhor se te juntares. O mais típico são os disfarces com humor e crítica."
    - p: "É um bom programa com crianças?"
      r: "Sim, há atividades e cortejo para famílias. As noites são mais sobrelotadas."
sant-jordi:
  texto:
    - "A 23 de abril celebram-se o Dia do Livro e Sant Jordi, e as ruas enchem-se de bancas de livros e de rosas. Na Catalunha, a tradição é oferecer uma rosa e um livro, e é uma das festas mais queridas de Barcelona, com muita gente na rua."
    - "Em Barcelona, as bancas de livros e rosas ocupam as Ramblas, o Paseo de Gracia e quase todos os bairros, e muitos escritores autografam exemplares. O Dia Internacional do Livro celebra-se também em toda a Espanha, com sessões de autógrafos, leituras e descontos nas livrarias, e em Aragão é o Dia de Aragão."
    - "Se queres um autógrafo, chega cedo: as filas são longas. Vai de manhã ou ao fim da tarde, quando há menos confusão, e consulta a lista de autores e os horários nas livrarias e editoras. E lembra-te: não é preciso ser da Catalunha para oferecer uma rosa ou um livro."
  faq:
    - p: "Quando é Sant Jordi?"
      r: "Todos os anos a 23 de abril. Coincide com o Dia do Livro."
    - p: "O que se oferece?"
      r: "Tradicionalmente, o homem oferece uma rosa e a mulher um livro. Hoje oferecem-se ambos entre todo o tipo de pessoas."
    - p: "Onde ir em Barcelona?"
      r: "As Ramblas, o Paseo de Gracia e as ruas do centro enchem-se de bancas. Há bancas em quase todos os bairros."
    - p: "Há sessões de autógrafos?"
      r: "Sim, muitos autores autografam livros em bancas, livrarias e feiras. Chega cedo para evitar filas."
    - p: "Celebra-se fora da Catalunha?"
      r: "Sim, o Dia do Livro celebra-se em toda a Espanha e no mundo, com atividades em livrarias e bibliotecas."
    - p: "É um bom programa com crianças?"
      r: "Sim, há contadores de histórias e atividades infantis. Cuidado com as aglomerações no centro de Barcelona."
pilar:
  texto:
    - "As Fiestas del Pilar são as festas maiores de Saragoça, em honra da Virgen del Pilar, e celebram-se por volta de 12 de outubro, que é também feriado nacional. Durante uma semana, a cidade enche-se de concertos, desfiles, atos populares e muito ambiente na rua."
    - "O momento central é a Ofrenda de Flores, a 12 de outubro, quando milhares de pessoas, muitas com trajes regionais aragoneses, desfilam pelo centro até à plaza del Pilar para depositar as suas flores diante da Virgem e formar um grande manto floral. No dia seguinte, 13 de outubro, celebra-se a Ofrenda de Frutos."
    - "Além da ofrenda, há gigantes e cabeçudos, concertos em vários palcos, espetáculos de pirotecnia e atos culturais e desportivos. Consulta o programa oficial da Câmara Municipal de Saragoça. Reserva alojamento com antecedência, porque é uma festa muito popular e o centro fica cheio. E, para a ofrenda, chega cedo se quiseres ver o desfile."
  faq:
    - p: "Quando são as Fiestas del Pilar?"
      r: "Por volta de 12 de outubro. Duram aproximadamente uma semana, com o dia 12 como jornada principal."
    - p: "O que é a Ofrenda de Flores?"
      r: "É o desfile em que milhares de pessoas, muitas com trajes regionais, levam flores à Virgen del Pilar para formar um grande manto floral. Celebra-se a 12 de outubro."
    - p: "É preciso reservar?"
      r: "Para ver a ofrenda não. Para o alojamento sim, porque Saragoça fica cheia durante as festas."
    - p: "O que mais se pode fazer?"
      r: "Concertos, gigantes e cabeçudos, espetáculos de fogo de artifício, feiras gastronómicas e atividades infantis. O programa oficial é publicado pela câmara municipal."
    - p: "É gratuito?"
      r: "A maioria dos atos é gratuita, mas alguns concertos e espetáculos têm bilhete."
    - p: "É um bom programa com crianças?"
      r: "Sim, há muitas atividades infantis e o desfile de gigantes e cabeçudos costuma encantá-las. Cuidado com as aglomerações no dia 12."
semana-santa-malaga:
  texto:
    - "A Semana Santa de Málaga distingue-se pelos seus tronos de grande tamanho, que desfilam aos ombros de centenas de carregadores pelo centro da cidade. Festa de Interesse Turístico Internacional, cada procissão é um espetáculo de música, flores, incenso e emoção popular."
    - "As cofradías saem dos seus templos e bairros e dirigem-se à Carrera Oficial, na Alameda e na calle Larios, onde há uma tribuna e cadeiras. Um encontro muito aguardado é o de Quinta-feira Santa, com a Legião a acompanhar o Cristo de la Buena Muerte, embora cada dia tenha as suas próprias procissões e cada bairro o seu ambiente."
    - "Consulta o programa oficial da Agrupación de Cofradías com os horários e os itinerários. As ruas do centro enchem-se e os desfiles são lentos, por isso chega com tempo e escolhe um sítio. Reserva alojamento com antecedência e, se puderes, vai também às procissões dos bairros, mais tranquilas."
  faq:
    - p: "Quando é a Semana Santa de Málaga?"
      r: "Do Domingo de Ramos ao Domingo de Páscoa, entre março e abril consoante o ano. Há também atos prévios desde a Sexta-feira de Dores."
    - p: "O que a torna diferente?"
      r: "Os tronos são grandes e levam-se aos ombros, e o ambiente mistura fé, música e tradição popular. A Legião e as bandas de música têm um papel importante."
    - p: "Onde ver as procissões?"
      r: "Na Carrera Oficial (Alameda, calle Larios e plaza de la Constitución), com mais ambiente e mais gente. As procissões dos bairros são uma alternativa mais tranquila."
    - p: "É preciso pagar?"
      r: "Ver as procissões da rua é gratuito. Há cadeiras e tribunas pagas na Carrera Oficial."
    - p: "Como consulto os horários?"
      r: "A Agrupación de Cofradías publica o programa oficial com os itinerários e os horários de cada cofradía."
    - p: "É um bom programa com crianças?"
      r: "Sim, com cuidado: há muita gente e esperas longas. Escolhe procissões de tarde e um sítio com espaço."
