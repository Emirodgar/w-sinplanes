castanas-otono:
  imagen_alt: "Terreno di un castagneto in autunno coperto di foglie dorate e ricci di castagna"
  texto:
    - "Quando arriva ottobre, i castagneti del nord e del centro della penisola si riempiono di ricci caduti tra le foglie. Andare a raccogliere castagne è uno dei programmi autunnali più semplici e più gratificanti: una passeggiata tranquilla nel bosco, un cesto che si riempie piano piano e, una volta a casa, qualcosa di buono da arrostire."
    - "La stagione comincia, a seconda dell'altitudine e dell'anno, verso metà ottobre e si prolunga fino a novembre inoltrato. I migliori castagneti si trovano di solito in zone di montagna con clima umido: El Bierzo (León), la Valle del Genal (Málaga), la sierra de Francia (Salamanca), la Valle del Tiétar (Ávila), oltre a gran parte della Galizia e delle Asturie."
    - "La cosa più importante è sapere di chi è il castagneto. Molti sono proprietà private con un padrone che se ne prende cura e le vende, e raccogliere al loro interno senza permesso può avere conseguenze. Chiedi in paese, al comune o in una casa rurale della zona: di solito qualcuno ti indica dove si può raccogliere o ti mette in contatto con un proprietario."
    - "Porta scarpe chiuse che abbiano buona presa, guanti spessi (i ricci pungono davvero), un cesto o un sacco e vestiti che non ti dispiaccia sporcare. Le castagne cadono da sole quando sono mature: la cosa normale è raccogliere quelle da terra, senza bacchiare gli alberi né danneggiarli. I giorni successivi a pioggia e vento sono di solito i più generosi."
    - "Una volta a casa, incidi la buccia di ogni castagna prima di arrostirla o lessarla, così non scoppiano. Si conservano meglio in un luogo fresco o in frigorifero, ed è meglio consumarle in pochi giorni. Il finale naturale di questo programma è un magosto: castagne arrostite, falò e vino nuovo."
  mapa:
    titulo: "Dove andare a raccogliere castagne"
    centro: [40.0, -5.0]
    zoom: 6
    puntos:
      - { nombre: "El Bierzo (León)", lat: 42.55, lon: -6.6, desc: "Castagneti centenari di Las Médulas e delle valli vicine; culla del magosto." }
      - { nombre: "Valle del Genal (Málaga)", lat: 36.57, lon: -5.17, desc: "Serranía de Ronda: Igualeja, Pujerra, Genalguacil e Júzcar, con castagni in tutta la valle." }
      - { nombre: "Sierra de Francia (Salamanca)", lat: 40.485, lon: -6.108, desc: "Dintorni di La Alberca e Miranda del Castañar, con castagneti sui pendii." }
      - { nombre: "Valle del Tiétar (Ávila)", lat: 40.2, lon: -5.1, desc: "Arenas de San Pedro, Candeleda e Guisando, ai piedi della Sierra de Gredos." }
      - { nombre: "Sierra de Aracena (Huelva)", lat: 37.89, lon: -6.56, desc: "I castagneti della provincia di Huelva a Castaño del Robledo e Galaroza." }
  faq:
    - p: "Quando è la stagione delle castagne?"
      r: "In Spagna, più o meno da metà ottobre a metà novembre. Nelle zone basse comincia prima e in quelle più alte slitta di qualche giorno. Se vuoi azzeccare il momento giusto, informati sulla zona la settimana prima: il raccolto cambia da un anno all'altro a seconda della pioggia e del caldo estivo."
    - p: "Si possono raccogliere castagne in qualsiasi bosco?"
      r: "Non sempre. Molti castagneti sono proprietà privata e, nei boschi pubblici, ogni comune o comunità può avere le proprie norme. Chiedi al comune o ai vicini prima di raccogliere e non entrare in proprietà recintate."
    - p: "Dove andare a raccogliere castagne?"
      r: "Le mete classiche sono El Bierzo (León), la Valle del Genal (Málaga), la sierra de Francia (Salamanca) e la Valle del Tiétar (Ávila), oltre a Galizia, Asturie e la zona di Aracena. Tutte hanno castagneti molto estesi e una grande tradizione."
    - p: "Cosa bisogna portare?"
      r: "Guanti spessi, scarpe chiuse, un cesto o un sacco e abiti pesanti che non ti dispiaccia sporcare. I ricci si aprono schiacciandoli con la suola della scarpa, senza bisogno di attrezzi."
    - p: "Come si arrostiscono le castagne?"
      r: "Incidi la buccia di ciascuna, mettile in una padella forata, nel forno o su una griglia e lasciale da 20 a 30 minuti, finché la buccia si apre. Avvolgile per qualche minuto in un canovaccio perché continuino a cuocere con il proprio vapore e si sbucciano meglio."
    - p: "È un buon programma con i bambini?"
      r: "Sì, ma con attenzione: i ricci pungono. Dai loro dei guanti e insegna a non infilare la mano senza guardare. Per i bambini è un'attività che unisce passeggiata, gioco e ricompensa."
    - p: "Che cos'è un magosto?"
      r: "È la tradizionale festa d'autunno di Galizia, Asturie ed El Bierzo: si arrostiscono castagne su un falò e si mangiano con vino nuovo o sidro, soprattutto per San Martino, l'11 novembre."
setas:
  imagen_alt: "Mani che raccolgono un boleto nel bosco con un cesto di vimini pieno di funghi"
  texto:
    - "Con le prime piogge autunnali, pinete, querceti e castagneti si riempiono di funghi, e andare a cercarli diventa uno dei programmi più attesi dell'anno. È una scusa perfetta per passare la mattina nel bosco, con o senza il cesto pieno."
    - "La stagione principale va da ottobre a novembre, anche se dipende molto dalla pioggia e dalle temperature: dopo qualche settimana di umidità e senza gelate, il bosco si risveglia. Province come Soria, i Pirenei, León, Zamora, la Sierra de Gredos o la Catalogna sono dei classici, e in molte ci sono percorsi micologici e giornate organizzate."
    - "Prima di partire, informati sulla normativa della zona. Diverse comunità richiedono un permesso o un'autorizzazione di raccolta (in Castilla y León, per esempio, funziona il sistema Micocyl), e ci sono limiti di quantità, zone vietate e orari. Le norme cambiano da un posto all'altro, quindi consulta il sito del comune o della comunità autonoma."
    - "Se non hai esperienza, la regola d'oro è non mangiare nessun fungo che non hai identificato con sicurezza. La cosa più sensata per cominciare è iscriversi a un'uscita guidata o a una giornata micologica con un esperto, e portare una guida da campo. Raccogli con un cesto di vimini, che lascia cadere le spore e permette all'esemplare di respirare, e taglia o estrai con cura senza devastare il terreno."
  mapa:
    titulo: "Dove andare a funghi"
    centro: [41.2, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Pinares de Soria", lat: 41.95, lon: -2.75, desc: "Vinuesa, Covaleda e Duruelo de la Sierra, con Micocyl come sistema di permessi." }
      - { nombre: "Pirineo (Valle de Arán)", lat: 42.7, lon: 0.8, desc: "Boschi umidi di abete e faggio nei Pirenei di Lleida." }
      - { nombre: "Montaña de León", lat: 42.95, lon: -5.1, desc: "Riaño, Babia e Luna, con querceti di rovere e faggete." }
      - { nombre: "Sanabria (Zamora)", lat: 42.1, lon: -6.7, desc: "Pinete e castagneti intorno al lago di Sanabria." }
      - { nombre: "Sierra de Gredos (Ávila)", lat: 40.3, lon: -5.2, desc: "Pinete e querceti della Valle del Tiétar e del Barranco." }
      - { nombre: "Solsonès (Cataluña)", lat: 42.0, lon: 1.5, desc: "Pinete e boschi misti con una grande tradizione micologica." }
  faq:
    - p: "Quando è la stagione dei funghi?"
      r: "In Spagna, la stagione principale va da ottobre a novembre, anche se in alcune zone si prolunga fino a dicembre o inizia a settembre. Dipende da pioggia, altitudine e temperatura: dopo diverse settimane di umidità e senza gelate, il bosco si risveglia."
    - p: "Dove cercare funghi?"
      r: "Soria, i Pirenei, i monti di León e Zamora, la Sierra de Gredos o la Catalogna sono mete classiche. La cosa più pratica è chiedere all'ufficio del turismo o in una casa rurale della zona, dove di solito conoscono i percorsi e la normativa in vigore."
    - p: "Serve un permesso per raccogliere funghi?"
      r: "In molte zone sì. Diverse comunità autonome richiedono un permesso o un'autorizzazione di raccolta, e possono esserci limiti di quantità e zone vietate. Informati sempre prima di partire sul sito del comune o della comunità autonoma."
    - p: "Come faccio a sapere se un fungo è commestibile?"
      r: "Non fidarti dei trucchi popolari: un fungo si può mangiare solo se lo hai identificato con certezza. Se hai dubbi, non raccoglierlo. Un'uscita guidata o una giornata micologica è il modo più sicuro per imparare, e in caso di intossicazione bisogna andare al pronto soccorso o chiamare il 112."
    - p: "Cosa bisogna portare?"
      r: "Un cesto di vimini, un coltellino, una guida per il riconoscimento, scarpe da montagna, abiti pesanti, acqua e qualcosa da mangiare. Evita i sacchetti di plastica, che rovinano i funghi e non lasciano cadere le spore."
    - p: "È un buon programma con i bambini?"
      r: "Sì, purché siano accompagnati e sappiano che non si tocca né si mangia nulla senza che un adulto lo controlli. I più piccoli si divertono molto con la ricerca, ma conviene scegliere percorsi semplici e fare attenzione che non si portino le mani alla bocca."
hayedos:
  imagen_alt: "Sentiero coperto di foglie tra i faggi con i colori dell'autunno e un po' di nebbia sullo sfondo"
  texto:
    - "Per poche settimane in autunno, le faggete passano dal verde al giallo, all'arancione e al color rame, e il terreno si ricopre di foglie. È uno degli spettacoli naturali più fotogenici della Spagna e un programma perfetto per camminare senza fretta tra tronchi argentati."
    - "Il momento migliore va di solito da metà ottobre a metà novembre, anche se il picco di colore cambia ogni anno in base al freddo, alla pioggia e al vento. Tra le faggete più conosciute ci sono la Selva de Irati (Navarra), il Hayedo de Montejo (Madrid), il Hayedo de la Tejera Negra (Guadalajara) e quello di Otzarreta (Bizkaia), oltre a quelle di Cantabria, Asturie e Pirenei."
    - "Attenzione ai limiti di accesso: alcune faggete, come quella di Montejo, limitano il numero di visitatori o richiedono prenotazione o permesso di accesso, soprattutto nei fine settimana di massimo colore. Consulta prima il sito dell'area protetta e, se puoi, vai in settimana: ci sarà meno gente e più silenzio."
    - "Porta scarpe comode che abbiano presa sulle foglie bagnate, uno strato caldo e un k-way, perché nella faggeta l'umidità è frequente, e non uscire dai sentieri segnalati. Le mattine con un po' di nebbia e la luce bassa del tramonto sono le migliori per fotografare."
  mapa:
    titulo: "Dove vedere una faggeta in autunno"
    centro: [42.0, -2.5]
    zoom: 7
    puntos:
      - { nombre: "Selva de Irati (Navarra)", lat: 42.98, lon: -1.1, desc: "Una delle più grandi foreste di faggi e abeti d'Europa, tra Ochagavía e Orbaizeta." }
      - { nombre: "Hayedo de Montejo (Madrid)", lat: 41.12, lon: -3.5, desc: "La faggeta più meridionale d'Europa; accesso con limite di visitatori e prenotazione." }
      - { nombre: "Hayedo de la Tejera Negra (Guadalajara)", lat: 41.15, lon: -3.15, desc: "Nella sierra de Ayllón, vicino a Cantalojas, con percorsi segnalati." }
      - { nombre: "Hayedo de Otzarreta (Bizkaia)", lat: 43.03, lon: -2.78, desc: "Nel Parco Naturale del Gorbeia, una delle più fotografate." }
      - { nombre: "Saja-Besaya (Cantabria)", lat: 43.1, lon: -4.2, desc: "Faggete estese nel Parco Naturale, con ottimi percorsi autunnali." }
      - { nombre: "Redes (Asturias)", lat: 43.17, lon: -5.3, desc: "Faggete di montagna nel Parco Naturale di Redes." }
      - { nombre: "Selva de Oza (Huesca)", lat: 42.85, lon: -0.75, desc: "Faggete e abetaie dei Pirenei aragonesi, nella valle di Hecho." }
  faq:
    - p: "Qual è il momento migliore per vedere una faggeta in autunno?"
      r: "Tra metà ottobre e metà novembre, con un picco di colore che di solito dura due o tre settimane. Varia ogni anno con il freddo e la pioggia, quindi conviene guardare il bollettino dell'area protetta o i social dei centri visitatori."
    - p: "Quali sono le migliori faggete della Spagna?"
      r: "La Selva de Irati (Navarra), il Hayedo de Montejo (Madrid), il Hayedo de la Tejera Negra (Guadalajara) e quello di Otzarreta (Bizkaia) sono le più conosciute. Spiccano anche quelle di Cantabria, Asturie e Pirenei."
    - p: "Bisogna prenotare o chiedere un permesso?"
      r: "In alcune sì. Il Hayedo de Montejo, per esempio, limita le visite e richiede un'autorizzazione, e in altre aree ci sono limiti di accesso o parcheggi che si riempiono nei fine settimana di massimo colore. Consulta il sito dell'area protetta prima di andare."
    - p: "Si può andare con bambini o con il cane?"
      r: "I percorsi brevi e segnalati sono adatti ai bambini. Con il cane dipende da ogni area: in alcune sono vietati o devono stare al guinzaglio, quindi conviene verificarlo prima."
    - p: "Che abbigliamento e scarpe portare?"
      r: "Scarpe comode con buona presa sulle foglie bagnate, abiti pesanti a strati e un k-way, perché nel bosco umidità e temperatura scendono rapidamente."
    - p: "Come evitare la folla?"
      r: "Vai in settimana, la mattina presto o a fine pomeriggio, ed evita i ponti e i fine settimana di massimo colore. Un'alternativa è scegliere faggete meno conosciute della stessa zona."
berrea:
  texto:
    - "A fine estate i cervi maschi cominciano a bramire per attirare le femmine e sfidare i rivali. Quel ruggito grave e potente, che risuona nel bosco all'alba e al tramonto, è la berrea, il bramito del cervo, uno degli spettacoli faunistici più impressionanti della Spagna."
    - "La berrea si concentra tra settembre e ottobre, con il momento clou di solito a fine settembre e inizio ottobre, anche se varia a seconda della zona e dell'anno. I luoghi più conosciuti sono il Parco Nazionale di Cabañeros, il Parco Nazionale di Monfragüe, la Sierra de Andújar, la Riserva Nazionale di Riaño e la Sierra de la Culebra, tra gli altri."
    - "La cosa migliore è arrivare prima dell'alba o un po' prima del tramonto, quando i cervi sono più attivi, e ascoltare in silenzio da un punto di osservazione. Porta un binocolo, abiti caldi e di colori discreti, e non usare torce né flash. I cervi in calore sono imprevedibili: mantieni sempre la distanza e non avvicinarti."
    - "In alcune aree ci sono percorsi guidati, osservatori o accessi regolamentati durante la berrea, ed è meglio prenotare con anticipo. Consulta il sito dell'area protetta o del centro visitatori prima di andare."
  mapa:
    titulo: "Dove ascoltare la berrea"
    centro: [40.0, -5.0]
    zoom: 6
    puntos:
      - { nombre: "Parque Nacional de Cabañeros (Ciudad Real)", lat: 39.4, lon: -4.5, desc: "Praterie e macchia mediterranea con grandi popolazioni di cervi; visite guidate durante la berrea." }
      - { nombre: "Parque Nacional de Monfragüe (Cáceres)", lat: 39.83, lon: -6.05, desc: "Dehesa e pareti rocciose con vari punti panoramici per ascoltare all'alba." }
      - { nombre: "Sierra de Andújar (Jaén)", lat: 38.25, lon: -4.0, desc: "Uno dei posti migliori del sud; molto frequentato, conviene prenotare." }
      - { nombre: "Reserva Nacional de Riaño (León)", lat: 42.98, lon: -5.0, desc: "Berrea di montagna, tra faggete e querceti dei Picos de Europa leonesi." }
      - { nombre: "Sierra de la Culebra (Zamora)", lat: 41.85, lon: -6.2, desc: "Ampia riserva di caccia con molti cervi e qualche lupo." }
  faq:
    - p: "Quando è la berrea del cervo?"
      r: "Tra settembre e ottobre. Il momento di maggiore attività di solito è a fine settembre e inizio ottobre, anche se cambia a seconda della zona e dell'anno. La cosa migliore è uscire all'alba o al tramonto."
    - p: "Dove vedere la berrea?"
      r: "I luoghi più conosciuti sono Cabañeros, Monfragüe, la Sierra de Andújar, la Riserva Nazionale di Riaño e la Sierra de la Culebra. In molti ci sono percorsi guidati, osservatori o punti di ascolto segnalati."
    - p: "Cosa bisogna portare?"
      r: "Binocolo, abiti caldi e di colori discreti (verdi, marroni, grigi), scarpe comode e qualcosa da mangiare e da bere. Nelle ore di maggiore attività fa fresco, anche se la giornata è calda."
    - p: "È pericoloso avvicinarsi ai cervi?"
      r: "Sì. I maschi in calore sono molto aggressivi e imprevedibili. Non avvicinarti, non aggirarli né tagliare loro la strada e mantieni la distanza indicata dalle guide o dai cartelli."
    - p: "Bisogna prenotare?"
      r: "In alcune aree sì, soprattutto per percorsi guidati, osservatori o accessi regolamentati in piena berrea. Guarda il sito dell'area protetta o del centro visitatori prima di andare, perché i posti si esauriscono."
    - p: "Si può andare con i bambini?"
      r: "Sì, è un programma bellissimo per loro, ma bisogna andare in silenzio, di buon'ora e senza staccarsi dal gruppo. Scegli percorsi semplici e meglio con una guida."
vendimia:
  texto:
    - "Settembre è il mese della vendemmia in buona parte della Spagna: i grappoli maturi si tagliano a mano o a macchina e le cantine si riempiono di profumo di mosto. Viverla da vicino, tra vigneti e palmenti, è uno dei programmi di fine estate più affascinanti, e ha molto di festa."
    - "La data esatta cambia a seconda della zona, del vitigno e dell'anno. Le uve bianche e le varietà precoci si raccolgono di solito da fine agosto, mentre le rosse più tardive possono arrivare fino a ottobre. Regioni come La Rioja, la Ribera del Duero, Jerez, il Penedès, le Rías Baixas o La Mancha organizzano visite, degustazioni e attività collegate."
    - "Molte cantine offrono esperienze in cui puoi tagliare i grappoli, pigiare l'uva o vedere come arriva il raccolto in cantina, di solito con prenotazione e a pagamento. Ci sono inoltre feste dedicate alla vendemmia, come quelle di Jerez o quelle di San Mateo a Logroño, con pigiatura dell'uva, offerte del primo mosto e degustazioni."
    - "Se ti iscrivi a un'esperienza in vigneto, porta scarpe chiuse e comode, cappello, protezione solare e abiti che si possano sporcare. Meglio andare la mattina presto, quando fa meno caldo e si lavora con più calma."
  mapa:
    titulo: "Dove vivere la vendemmia"
    centro: [40.0, -3.5]
    zoom: 6
    puntos:
      - { nombre: "La Rioja (Logroño)", lat: 42.4627, lon: -2.445, desc: "Rioja Alta e Rioja Baja, con le feste di San Mateo a Logroño e molte cantine con visita." }
      - { nombre: "Ribera del Duero (Burgos y Valladolid)", lat: 41.62, lon: -3.9, desc: "Vigneti di rosso lungo il Duero, con cantine aperte alle visite." }
      - { nombre: "Rías Baixas (Pontevedra)", lat: 42.51, lon: -8.81, desc: "Zona dell'albariño, con vendemmia precoce e cantine intorno a Cambados." }
      - { nombre: "Penedès (Barcelona)", lat: 41.3446, lon: 1.6988, desc: "Zona del cava e del vino, con cantine ed esperienze di vendemmia intorno a Vilafranca." }
      - { nombre: "La Mancha (Ciudad Real)", lat: 39.0, lon: -3.2, desc: "Il più grande vigneto della Spagna, con cantine e feste della vendemmia nei suoi paesi." }
      - { nombre: "Jerez (Cádiz)", lat: 36.6864, lon: -6.1377, desc: "Capitale del vino di Jerez (sherry), con la sua festa della vendemmia e cantine storiche." }
  faq:
    - p: "Quando è la vendemmia in Spagna?"
      r: "Dipende dalla zona e dal vitigno, ma il periodo principale va da fine agosto a ottobre, con settembre come mese centrale. Le uve bianche e precoci si raccolgono prima delle rosse tardive."
    - p: "Dove vivere la vendemmia?"
      r: "Le mete classiche sono La Rioja, la Ribera del Duero, Jerez, il Penedès, le Rías Baixas e La Mancha. Molte cantine organizzano visite ed esperienze in quelle date."
    - p: "Si può partecipare alla vendemmia?"
      r: "Sì, ci sono cantine che offrono esperienze in cui puoi tagliare i grappoli, pigiare l'uva o vedere l'arrivo del raccolto. Di solito sono a pagamento e richiedono prenotazione, quindi informati per tempo."
    - p: "Ci sono feste della vendemmia?"
      r: "Sì. Tra le più conosciute ci sono le Fiestas de la Vendimia di Jerez e le Fiestas de San Mateo e della vendemmia riojana a Logroño, con pigiatura dell'uva, offerta del mosto e degustazioni."
    - p: "Cosa bisogna portare?"
      r: "Scarpe chiuse e comode, cappello, protezione solare e abiti che si possano sporcare. Meglio andare la mattina presto, quando fa meno caldo."
    - p: "È un buon programma con i bambini?"
      r: "In generale sì. Molte cantine organizzano attività per famiglie, con pigiatura simbolica dell'uva e mosto analcolico. Chiedi al momento della prenotazione se accettano bambini."
mercadillos-navidad:
  texto:
    - "I mercatini di Natale riempiono di bancarelle, luci e profumo di dolci le piazze di molte città. Sono un programma perfetto per passeggiare, comprare artigianato e decorazioni ed entrare nell'atmosfera natalizia."
    - "Alcuni sono dei classici: il mercatino della Plaza Mayor di Madrid, la Fira de Santa Llúcia di Barcellona, accanto alla cattedrale, o il mercato di Santo Tomás a Bilbao, che si tiene il 21 dicembre. Molte altre città allestiscono il loro, con bancarelle di artigianato, dolci, presepi e spettacoli per bambini."
    - "Di solito aprono da fine novembre e restano fino alla Vigilia di Natale o all'Epifania. Il momento più piacevole è durante la settimana o nel primo pomeriggio, quando c'è meno gente; porta contanti, perché non tutte le bancarelle accettano la carta. Copriti bene: si sta molto all'aperto."
  faq:
    - p: "Quando aprono i mercatini di Natale?"
      r: "La maggior parte apre da fine novembre o inizio dicembre e chiude alla Vigilia di Natale, anche se alcuni restano fino all'Epifania. Controlla le date di ogni città."
    - p: "Quali sono i più conosciuti?"
      r: "Quello della Plaza Mayor di Madrid, la Fira de Santa Llúcia di Barcellona e il mercato di Santo Tomás a Bilbao sono tra i più tradizionali, anche se quasi ogni città ha il suo."
    - p: "Bisogna pagare l'ingresso?"
      r: "No. L'ingresso è libero e paghi solo quello che compri o le attrazioni specifiche, come piste di pattinaggio o spettacoli."
    - p: "Che cosa si può comprare?"
      r: "Presepi e statuine, decorazioni, candele, artigianato, dolci natalizi, torrone e giocattoli, a seconda del mercato."
    - p: "Quando è meglio andare?"
      r: "Durante la settimana e nel primo pomeriggio, per evitare la folla. Nei fine settimana e nei ponti si riempiono molto."
    - p: "È un buon programma con i bambini?"
      r: "Sì, molti includono bancarelle di giocattoli, spettacoli e visite di Babbo Natale o dei Re Magi. Fai attenzione alla folla e non perdere di vista i più piccoli."
luces-navidad:
  texto:
    - "Ogni anno le città spagnole gareggiano per avere le luminarie di Natale più spettacolari. Strade coperte di luci, grandi alberi, spettacoli di luci e musica e tanta gente a passeggio fanno di una serata tra le luci un programma semplicissimo e molto natalizio."
    - "Vigo è diventata famosa per il suo allestimento, ma anche Madrid, Málaga, Valencia o Barcellona organizzano luminarie molto visitate. L'accensione avviene di solito a fine novembre o inizio dicembre, con una cerimonia pubblica, e le luci restano accese fino all'Epifania."
    - "La cosa più comoda è andare a piedi o con i mezzi pubblici, perché i centri si riempiono di gente e vengono chiuse strade al traffico, soprattutto nei fine settimana e nei giorni dell'accensione. Se vuoi evitare la folla, vai durante la settimana, nelle prime ore della sera. Copriti bene e porta scarpe comode, perché si cammina molto."
  faq:
    - p: "Quando si accendono le luci di Natale?"
      r: "Di solito a fine novembre o inizio dicembre, con una cerimonia pubblica. Ogni città ha la sua data, che viene annunciata con settimane di anticipo."
    - p: "Fino a quando restano accese?"
      r: "Di solito fino all'Epifania, il 6 gennaio, anche se in alcune città restano accese qualche giorno in più."
    - p: "Quali città hanno le luci più belle?"
      r: "Vigo, Madrid, Málaga, Valencia e Barcellona sono spesso tra le più visitate, anche se molte città medie hanno luminarie molto curate."
    - p: "Quando è meglio andare?"
      r: "Durante la settimana e nelle prime ore della sera. Nei fine settimana, nei ponti e nei giorni dell'accensione c'è molta folla."
    - p: "Come mi sposto?"
      r: "A piedi o con i mezzi pubblici. Nelle zone più visitate si chiudono strade e parcheggiare è complicato."
    - p: "È un buon programma con i bambini?"
      r: "Sì, è molto bello per loro. Fai attenzione alla folla e stabilite un punto d'incontro nel caso vi separiate."
cabalgata-reyes:
  texto:
    - "La Cabalgata de Reyes è uno dei grandi programmi per famiglie del Natale: il pomeriggio del 5 gennaio i Re Magi percorrono le strade di quasi tutte le città e i paesi della Spagna con carri, musica e una pioggia di caramelle, prima della notte in cui lasciano i regali."
    - "Le più conosciute sono quelle di Madrid, Barcellona, dove i Re arrivano dal porto, Siviglia, con una delle più antiche della Spagna, o Valencia, ma ogni località organizza la sua. I carri di solito partono al tramonto, e il percorso e l'orario vengono pubblicati sul sito web o sui social del comune pochi giorni prima."
    - "Arriva con anticipo e scegli un buon posto: i marciapiedi si riempiono una o due ore prima. Porta una borsa grande per le caramelle, vestiti caldi e pazienza, e tieni d'occhio i bambini mentre piovono le caramelle. Se piove, controlla se la cabalgata si svolge o viene sospesa."
  faq:
    - p: "Quando è la Cabalgata de Reyes?"
      r: "Il 5 gennaio nel pomeriggio, anche se l'orario e il percorso cambiano in ogni località."
    - p: "Dove vedere la cabalgata?"
      r: "In quasi tutte le città e i paesi. Quelle di Madrid, Barcellona, Siviglia e Valencia sono tra le più grandi, ma ogni comune pubblica il percorso."
    - p: "È gratuita?"
      r: "Sì, assistere alla cabalgata dalla strada è gratuito."
    - p: "Quando arrivare per trovare posto?"
      r: "Una o due ore prima nelle grandi città, e un po' meno nei paesi piccoli."
    - p: "Che cosa bisogna portare?"
      r: "Vestiti caldi, una borsa per le caramelle e pazienza. Nelle zone molto affollate, un punto d'incontro nel caso vi separiate."
    - p: "Che succede se piove?"
      r: "Dipende dalla città. Alcune si svolgono comunque, altre vengono rinviate o ridotte. Consulta il sito web o i social del comune."
loteria-navidad:
  texto:
    - "L'estrazione della Lotteria di Natale, ogni 22 dicembre, è uno dei riti più seguiti del Natale in Spagna. I bambini e le bambine di San Ildefonso cantano i numeri e i premi con la loro inconfondibile melodia, che si ascolta alla radio e in televisione in tutto il paese."
    - "L'estrazione si svolge da anni al Teatro Real di Madrid e dura diverse ore a partire dalla mattina presto. Il premio più famoso è El Gordo, ma i premi sono moltissimi e si gioca in famiglia, tra amici o al lavoro, spesso con un numero condiviso."
    - "Puoi seguirla in televisione o alla radio, oppure consultare i risultati sul sito ufficiale di Loterías. L'accesso al Teatro Real è limitato, quindi di solito la si guarda da casa. Se hai giocato, conserva bene il decimo e controlla i termini per riscuotere i premi."
  faq:
    - p: "Quando è l'estrazione di Natale?"
      r: "Il 22 dicembre, dalla mattina presto. Dura diverse ore."
    - p: "Dove si svolge?"
      r: "Al Teatro Real di Madrid. L'accesso del pubblico è limitato."
    - p: "Chi canta i numeri?"
      r: "I bambini e le bambine del Colegio de San Ildefonso, che li cantano insieme ai premi."
    - p: "Come seguirla?"
      r: "In televisione, alla radio o su internet. Puoi anche controllare i risultati sul sito ufficiale di Loterías."
    - p: "Entro quando bisogna riscuotere il premio?"
      r: "I premi hanno un termine per essere riscossi. Consulta le condizioni e i termini sul sito ufficiale di Loterías."
    - p: "È un buon programma con i bambini?"
      r: "Sì, a molti piace ascoltare il canto dei numeri e l'atmosfera della mattina."
campanadas:
  texto:
    - "Le Campanadas di Capodanno segnano il passaggio all'anno nuovo in Spagna con una tradizione unica: mangiare dodici acini d'uva, uno a ogni rintocco, per accogliere l'anno nuovo con fortuna. Vengono trasmesse in diretta dall'orologio della Puerta del Sol di Madrid e si seguono in quasi tutte le case."
    - "Molte persone le guardano in televisione, a casa o con amici e familiari, mentre altre preferiscono andare in una piazza. Alla Puerta del Sol l'accesso ha di solito una capienza limitata e controlli di sicurezza, quindi informati sulle condizioni e arriva con anticipo. Altre città organizzano i propri eventi nelle piazze principali."
    - "Per l'uva, alcuni consigli pratici: sbuccia gli acini e togli i semi, prepara le dodici uve in anticipo e comincia con i primi rintocchi, non con i quarti. Poi brindisi, cotillon e festa fino all'alba, oppure a riposare, a seconda del programma."
  faq:
    - p: "Quando sono le Campanadas?"
      r: "La notte del 31 dicembre, alle 00:00. I dodici rintocchi dell'orologio segnano il passaggio all'anno nuovo."
    - p: "Perché si mangiano dodici acini d'uva?"
      r: "È una tradizione che consiste nel mangiare un acino a ogni rintocco per accogliere l'anno con fortuna. Si fa in tutta la Spagna."
    - p: "Posso andare alla Puerta del Sol?"
      r: "Sì, ma l'accesso ha di solito una capienza limitata e controlli di sicurezza. Consulta le condizioni del Comune di Madrid e arriva con anticipo."
    - p: "Quali canali le trasmettono?"
      r: "Vari canali televisivi trasmettono le campanadas in diretta dalla Puerta del Sol. Controlla la programmazione."
    - p: "Come preparare l'uva?"
      r: "Sbuccia gli acini e togli i semi, tienine pronti dodici e comincia con i rintocchi, non con i quarti che li precedono."
    - p: "È un buon programma con i bambini?"
      r: "Sì, a casa o in un evento tranquillo. Con i bambini piccoli, l'uva si può preparare sbucciata, senza semi o tagliata per evitare il soffocamento."
perseidas:
  texto:
    - "Le Perseidi, note popolarmente come le Lacrime di San Lorenzo, sono uno degli sciami di stelle cadenti più facili e spettacolari da vedere dalla Spagna. Si verificano ogni anno quando la Terra attraversa la scia di polvere della cometa Swift-Tuttle."
    - "L'attività dura da metà luglio a fine agosto e il massimo si ha di solito tra l'11 e il 13 agosto. In una notte serena e senza Luna, con il cielo buio, si possono arrivare a vedere decine di meteore all'ora. La fase lunare di ogni anno influisce molto: con la Luna piena se ne vedono molte meno."
    - "L'importante è allontanarsi dall'inquinamento luminoso. Riserve e destinazioni con certificazione Starlight, come Monfragüe, la Sierra Sur de Jaén o Gúdar-Javalambre, sono un'ottima scelta, e molte organizzano osservazioni guidate. Non servono telescopio né binocolo: basta sdraiarsi e guardare il cielo aperto."
    - "Lascia che gli occhi si abituino al buio per circa 20 o 30 minuti ed evita di guardare il cellulare. Porta una coperta o un lettino, abiti caldi, anche se di giorno fa caldo, e qualcosa di caldo da bere. Le ore dopo mezzanotte sono di solito le migliori."
  mapa:
    titulo: "Dove vedere le Perseidi"
    centro: [39.5, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Monfragüe (Cáceres)", lat: 39.83, lon: -6.05, desc: "Parco Nazionale e Riserva Starlight, con osservazioni guidate del cielo." }
      - { nombre: "Sierra Sur de Jaén", lat: 37.6, lon: -3.85, desc: "Riserva Starlight con cieli molto bui, nei dintorni di Alcalá la Real e Castillo de Locubín." }
      - { nombre: "Gúdar-Javalambre (Teruel)", lat: 40.2, lon: -0.7, desc: "Riserva Starlight a oltre 1.500 m di altitudine, con cieli limpidi e osservatorio astrofisico." }
  faq:
    - p: "Quando si vedono le Perseidi?"
      r: "L'attività va da metà luglio a fine agosto, con il massimo verso il 12 agosto, di solito tra l'11 e il 13. Le ore migliori sono dopo mezzanotte e fino all'alba."
    - p: "Dove vederle meglio in Spagna?"
      r: "In qualsiasi luogo con cielo buio e sereno. Destinazioni con certificazione Starlight, come Monfragüe, la Sierra Sur de Jaén o Gúdar-Javalambre, offrono cieli eccellenti e osservazioni guidate."
    - p: "Serve un telescopio?"
      r: "No. Sono meteore dal movimento rapido e si vedono meglio a occhio nudo. Binocoli e telescopi riducono il campo visivo e non aiutano."
    - p: "In che direzione bisogna guardare?"
      r: "Hanno origine nella costellazione di Perseo, verso nord-est, ma le meteore compaiono in tutto il cielo. La cosa migliore è guardare in alto senza fissare un punto preciso."
    - p: "La Luna influisce?"
      r: "Molto. Con la Luna piena o molto luminosa si vedono molte meno meteore. Conviene controllare la fase lunare di quell'anno prima di pianificare l'uscita."
    - p: "Cosa bisogna portare?"
      r: "Una coperta o un lettino, abiti caldi, una torcia a luce rossa (se ti serve), qualcosa di caldo da bere e pazienza. Evita le luci bianche, che rovinano la visione notturna."
cerezos-jerte:
  texto:
    - "Per alcune settimane in primavera, la Valle del Jerte, nel nord di Cáceres, si copre di bianco con la fioritura di centinaia di migliaia di ciliegi. I terrazzamenti sui pendii sembrano innevati e lo spettacolo si completa con la Garganta de los Infiernos e i paesi di pietra della valle."
    - "La fioritura arriva di solito tra fine marzo e metà aprile, anche se la data esatta cambia ogni anno a seconda dell'inverno e delle temperature. Dura poco, tra una e due settimane per zona, e anticipa o ritarda a seconda dell'altitudine, quindi conviene controllare lo stato della fioritura prima di partire. In quel periodo si celebra la Fiesta del Cerezo en Flor."
    - "È un programma molto popolare e nei fine settimana di massima fioritura traffico e parcheggio si complicano. Se puoi, vai in settimana o di prima mattina, prenota l'alloggio con anticipo e abbi pazienza sulle strade della valle. I ciliegi sono alberi da coltivazione e hanno un proprietario: rispetta i terreni, non tagliare rami e non entrare nei terrazzamenti recintati."
  mapa:
    titulo: "Dove vedere i ciliegi in fiore"
    centro: [40.2, -5.77]
    zoom: 11
    puntos:
      - { nombre: "Garganta de los Infiernos", lat: 40.22, lon: -5.76, desc: "Riserva naturale in testa alla valle, con sentieri e pozze lungo il fiume." }
      - { nombre: "Jerte", lat: 40.2147, lon: -5.7508, desc: "Paese di pietra all'ingresso della Garganta, con centro visitatori e ciliegi nei terrazzamenti." }
      - { nombre: "Navaconcejo", lat: 40.1747, lon: -5.7978, desc: "Paese della valle circondato da ciliegi; una buona base per vedere la fioritura." }
      - { nombre: "Cabezuela del Valle", lat: 40.1697, lon: -5.7014, desc: "Ciliegi sui pendii e vie di pietra, nel tratto medio della valle." }
  faq:
    - p: "Quando fioriscono i ciliegi del Jerte?"
      r: "Di solito tra fine marzo e metà aprile, per una o due settimane in ogni zona. La data cambia ogni anno con il clima, quindi controlla lo stato della fioritura prima di andare."
    - p: "Dove vedere i ciliegi in fiore?"
      r: "La Valle del Jerte (Cáceres) è la più conosciuta, con paesi come Cabezuela del Valle, Navaconcejo o Jerte, e percorsi come quello della Garganta de los Infiernos."
    - p: "Si può entrare nei terrazzamenti?"
      r: "Sono terreni agricoli privati. Passeggia lungo sentieri e belvedere segnalati e non entrare nelle parcelle né tagliare fiori o rami."
    - p: "Bisogna prenotare l'alloggio?"
      r: "Sì, con anticipo, perché nei fine settimana di massima fioritura si riempie tutto. I paesi vicini della Vera o Plasencia sono un'alternativa."
    - p: "Come evito la folla?"
      r: "Vai in settimana, di prima mattina o a fine pomeriggio, ed evita i fine settimana di massimo colore. Meglio parcheggiare nelle zone apposite e spostarsi a piedi."
    - p: "È un buon programma con i bambini?"
      r: "Sì, i percorsi facili lungo la valle sono adatti alle famiglie. Se tuo figlio è allergico al polline, porta i medicinali, perché in primavera la fioritura è intensa."
nieve:
  texto:
    - "Andare sulla neve è uno dei grandi programmi invernali, sia per sciare sia per passeggiare, andare in slittino o semplicemente vedere la montagna bianca. La Spagna ha stazioni e paesaggi innevati in Sierra Nevada, nei Pirenei, nella Cordigliera Cantabrica e nel Sistema Centrale."
    - "La stagione va da dicembre a marzo, anche se la neve dipende molto da ogni inverno. Prima di partire, controlla lo stato delle piste e delle strade: possono servire catene o pneumatici invernali, e gli accessi alle stazioni si congestionano nei fine settimana e nei ponti. Consulta le informazioni sul traffico prima e durante il viaggio."
    - "Non serve saper sciare. Molte stazioni e valli offrono zone per lo slittino, percorsi con le ciaspole, sci di fondo e passeggiate sulla neve, e l'abbigliamento si può noleggiare. Prenota lo skipass e l'attrezzatura con anticipo nelle date di punta. Porta abiti impermeabili e a strati, occhiali da sole, crema solare e guanti di ricambio, perché il sole e il riflesso sulla neve ingannano."
  mapa:
    titulo: "Dove andare sulla neve"
    centro: [40.5, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Sierra Nevada (Granada)", lat: 37.09, lon: -3.4, desc: "La stazione più meridionale d'Europa, con piste da sci e zone per passeggiate e slittino." }
      - { nombre: "Pirineo aragonés (Formigal)", lat: 42.78, lon: -0.37, desc: "Ampio comprensorio sciistico dei Pirenei, con sci di fondo e percorsi con le ciaspole nelle vicinanze." }
      - { nombre: "Pirineo catalán (Baqueira Beret)", lat: 42.7, lon: 0.93, desc: "Una delle stazioni più grandi dei Pirenei, nella Val d'Aran." }
      - { nombre: "Cordillera Cantábrica (San Isidro)", lat: 43.05, lon: -5.37, desc: "Stazione tra León e Asturie, con paesaggio di alta montagna cantabrica." }
      - { nombre: "Sistema Central (Navacerrada)", lat: 40.79, lon: -4.01, desc: "La neve più vicina a Madrid, con piste e zone per lo slittino; gli accessi si congestionano nei fine settimana." }
  faq:
    - p: "Quando c'è la neve in Spagna?"
      r: "Di solito da dicembre a marzo, con gennaio e febbraio come mesi più affidabili. Dipende molto da ogni inverno e dall'altitudine."
    - p: "Dove andare sulla neve?"
      r: "Sierra Nevada (Granada), i Pirenei (Huesca, Lleida, Navarra), la Cordigliera Cantabrica, il Sistema Centrale (Madrid, Segovia) o il Sistema Iberico offrono stazioni e percorsi."
    - p: "Bisogna saper sciare?"
      r: "No. Ci sono slittini, percorsi con le ciaspole, sci di fondo, zone di neve per bambini e passeggiate. Se vuoi sciare, molte scuole offrono lezioni di iniziazione."
    - p: "Mi servono le catene?"
      r: "Dipende dalla strada e dal giorno. Consulta le informazioni sul traffico e porta catene o pneumatici invernali. A volte è obbligatorio averle e senza la strada viene chiusa."
    - p: "Bisogna prenotare?"
      r: "Nelle date di punta (ponti, Natale, fine settimana con neve) conviene prenotare skipass, noleggio e alloggio. Acquistare online di solito costa meno ed è più rapido."
    - p: "Che abbigliamento portare?"
      r: "Abiti impermeabili e a strati, guanti e berretto, occhiali da sole o da sci, protezione solare e calzature con buona suola. Un cambio di abiti asciutti per il viaggio di ritorno non guasta mai."
festival-san-sebastian:
  texto:
    - "Il Festival del Cinema di San Sebastián, noto come Zinemaldia, è uno dei grandi festival cinematografici della Spagna e dell'Europa. Si tiene a settembre a Donostia-San Sebastián, con anteprime internazionali, star sul tappeto rosso e proiezioni aperte al pubblico."
    - "La programmazione comprende la sezione ufficiale in concorso, che si contende la Concha de Oro, oltre a sezioni parallele, retrospettive e omaggi, come il Premio Donostia alla carriera. Le proiezioni sono distribuite tra vari cinema e spazi della città, tra cui il Kursaal e il Teatro Victoria Eugenia, e buona parte è aperta a qualsiasi spettatore."
    - "Consulta il sito ufficiale per il programma, gli orari e la vendita dei biglietti, che di solito si mettono in vendita pochi giorni prima delle proiezioni e vanno a ruba. Arriva presto alle code, guarda gli orari per combinare più proiezioni e approfitta per passeggiare in città e assaggiare i pintxos. A settembre può piovere: porta un ombrello."
  faq:
    - p: "Quando si tiene il Festival del Cinema di San Sebastián?"
      r: "A settembre, per circa nove giorni. Le date esatte vengono annunciate ogni anno."
    - p: "Può andarci chiunque?"
      r: "Sì. Oltre alle proiezioni per professionisti e stampa, ci sono molte proiezioni aperte al pubblico con biglietto."
    - p: "Dove compro i biglietti?"
      r: "Sui canali ufficiali del festival. Si vendono con poco anticipo e le proiezioni più popolari vanno esaurite."
    - p: "Cos'è la Concha de Oro?"
      r: "È il premio principale del festival, assegnato al miglior film della sezione ufficiale."
    - p: "Si possono vedere le star?"
      r: "Sul tappeto rosso del Teatro Victoria Eugenia di solito c'è pubblico. Consulta gli orari e arriva presto."
    - p: "Cos'altro fare a San Sebastián?"
      r: "Passeggiare lungo la baia de La Concha, assaggiare i pintxos nella Parte Vieja e visitare il Monte Igueldo."
semana-santa-sevilla:
  texto:
    - "La Settimana Santa di Siviglia è probabilmente la più famosa della Spagna. Per otto giorni, una sessantina di confraternite percorre la città con i suoi pasos di Cristo e della Vergine, accompagnate da nazareni, bande musicali e migliaia di persone nelle strade."
    - "Tutte le confraternite passano per la Carrera Oficial, che va dalla Campana alla Cattedrale. La notte tra il Giovedì e il Venerdì Santo è la Madrugá, la più carica di emozione e di affluenza, con confraternite come il Silencio, il Gran Poder, la Macarena, los Gitanos e la Esperanza de Triana."
    - "È una festa multitudinaria: le strade del centro si riempiono e i cortei impiegano ore a passare. Scarica il programma ufficiale, scegli le confraternite che vuoi vedere e arriva con anticipo. Prenota l'alloggio con mesi di anticipo, usa i mezzi pubblici e sii paziente con le chiusure delle strade. E ricorda: è un atto religioso, quindi rispetta il silenzio e i nazareni."
  faq:
    - p: "Quando si tiene la Settimana Santa di Siviglia?"
      r: "Dalla Domenica delle Palme alla Domenica di Resurrezione, che cambia ogni anno tra marzo e aprile. Consulta il calendario ufficiale per le date esatte."
    - p: "Cos'è la Madrugá?"
      r: "È la notte tra il Giovedì Santo e il Venerdì Santo. In quelle ore escono varie tra le confraternite più emblematiche ed è il momento di massima affluenza ed emozione."
    - p: "Dove vedere le processioni?"
      r: "Nella Carrera Oficial (dalla Campana alla Cattedrale) c'è molta atmosfera ma anche molta gente. Altre zone del centro o i quartieri, come Triana, permettono di vederle con più tranquillità."
    - p: "Bisogna prenotare?"
      r: "Non per vedere le processioni dalla strada, ma sì per l'alloggio e i ristoranti, che si esauriscono con mesi di anticipo."
    - p: "Come consulto gli orari?"
      r: "Il Consejo de Hermandades y Cofradías pubblica il programma ufficiale con gli itinerari e gli orari di ogni confraternita. Ci sono anche app e siti con monitoraggio in tempo reale."
    - p: "Cosa bisogna portare o tenere presente?"
      r: "Scarpe comode, abiti a strati e pazienza. Rispetta il silenzio, non attraversare tra i cortei ed evita il flash vicino ai pasos."
fallas:
  texto:
    - "Las Fallas sono la festa di Valencia in onore di San Giuseppe, dal 15 al 19 marzo. Dichiarate Patrimonio Culturale Immateriale dell'Umanità dall'UNESCO, uniscono monumenti di cartapesta e legno, pirotecnia, musica, polvere da sparo e tanta vita per strada."
    - "Le fallas sono enormi monumenti satirici che vengono eretti per le strade il giorno 15. Si possono visitare a piedi e le più importanti concorrono per dei premi. Ogni giorno alle 14:00 la mascletà, una sinfonia di polvere da sparo in plaza del Ayuntamiento, è un appuntamento imperdibile. Il 17 e il 18 si celebra l'Offerta di Fiori alla Virgen de los Desamparados."
    - "Il gran finale arriva la notte del 19 marzo con la cremà: le fallas vanno a fuoco, a cominciare da quelle infantili e finendo con quella grande, a mezzanotte. Prenota l'alloggio con mesi di anticipo, usa i mezzi pubblici e vai con anticipo per trovare posto alla mascletà. Fai attenzione ai petardi per strada e ai bambini piccoli."
  faq:
    - p: "Quando si tengono Las Fallas?"
      r: "Dal 15 al 19 marzo ogni anno. La plantà è il giorno 15 e la cremà la notte del 19."
    - p: "Cos'è la mascletà?"
      r: "È uno spettacolo di polvere da sparo che punta sul suono e sulla potenza più che sui colori. Si spara ogni giorno alle 14:00 in plaza del Ayuntamiento e lo si sente nel corpo."
    - p: "Cos'è la cremà?"
      r: "È il rogo delle fallas la notte del 19 marzo, con l'incendio finale della falla municipale a mezzanotte."
    - p: "Come spostarsi a Valencia durante Las Fallas?"
      r: "A piedi e con i mezzi pubblici. Ci sono chiusure al traffico e parcheggiare è quasi impossibile. La metropolitana potenzia il servizio."
    - p: "Cosa si mangia?"
      r: "Frittelle di zucca con cioccolata, paella e panini di strada. Le frittelle sono il sapore tipico di questa festa."
    - p: "È un buon programma con i bambini?"
      r: "Sì, ci sono fallas infantili e varie attività, ma il rumore dei petardi e la folla possono mettere a disagio i più piccoli."
semana-santa:
  texto:
    - "La Settimana Santa è la settimana che precede la Domenica di Resurrezione, dalla Domenica delle Palme alla Domenica di Pasqua, ed è una delle celebrazioni più sentite e visitate della Spagna. Confraternite e hermandades portano in strada i loro pasos e le loro immagini in processioni che uniscono fede, arte, musica e tradizione."
    - "Ogni città ha il suo stile. A Siviglia e Malaga spiccano i grandi troni e i baldacchini, a Valladolid, Zamora o Salamanca le processioni sono più sobrie e di scultura castigliana, e in luoghi come Cuenca o Murcia ci sono usanze molto particolari. Molte sono Feste di Interesse Turistico Internazionale."
    - "Poiché le date dipendono dalla Pasqua, cambiano ogni anno, tra marzo e aprile. Se pensi di viaggiare, prenota l'alloggio con largo anticipo e consulta gli itinerari e gli orari ufficiali di ogni confraternita, che vengono pubblicati settimane prima. Le processioni sono atti religiosi: rispetta il silenzio, non attraversare tra i cortei ed evita il flash al passaggio dei pasos."
  faq:
    - p: "Quando si tiene la Settimana Santa?"
      r: "È la settimana che precede la Domenica di Resurrezione, che cade ogni anno in una data diversa tra fine marzo e fine aprile. Va dalla Domenica delle Palme alla Domenica di Pasqua."
    - p: "Dove vedere le processioni più belle?"
      r: "Siviglia, Malaga, Valladolid, Zamora, Salamanca, Cuenca, Murcia e Cartagena sono tra le più conosciute, ciascuna con uno stile molto diverso. Molte sono Feste di Interesse Turistico Internazionale."
    - p: "Bisogna pagare per vedere le processioni?"
      r: "No. Si vedono gratis dalla strada. In alcune città ci sono sedie a pagamento sul percorso ufficiale o in tratti specifici."
    - p: "In quali giorni ci sono più processioni?"
      r: "Giovedì Santo e Venerdì Santo sono di solito i giorni di maggiore affluenza, e la nottata tra i due è quella con più atmosfera in città come Siviglia. Anche la Domenica delle Palme e il Sabato Santo hanno processioni."
    - p: "Come mi organizzo per vederle?"
      r: "Consulta il programma ufficiale di ogni confraternita, con orari e itinerari, arriva con anticipo per trovare un buon posto e abbi pazienza: i cortei avanzano lentamente e le strade vengono chiuse al traffico."
    - p: "È un buon programma con i bambini?"
      r: "Sì, ma con attenzione: c'è molta gente e molte ore di attesa. Scegli le processioni del pomeriggio, cerca un posto con spazio e spiega loro che è un atto di rispetto."
feria-abril:
  texto:
    - "La Feria de Abril di Siviglia è una settimana di festa con casetas, sevillanas, cavalli e carrozze, e abiti da flamenca. Si tiene nel Real de la Feria, nel quartiere di Los Remedios, circa due settimane dopo la Settimana Santa."
    - "La feria si apre con l'Alumbrado, la notte del lunedì, quando si accendono le migliaia di lampadine del portale d'ingresso. Durante la settimana, da mezzogiorno, c'è una sfilata di cavalli e carrozze; da quel momento le casetas si riempiono di musica, ballo, cibo e bevande: rebujito, fino, prosciutto e pescaíto frito. La domenica si chiude con uno spettacolo di fuochi d'artificio."
    - "Una cosa da sapere: la maggior parte delle casetas è privata e vi entra solo chi ha un invito o è socio. Ci sono anche casetas pubbliche e alcune del comune, aperte a tutti, e le strade e il Real si possono percorrere liberamente. Di solito ci si veste bene: abito da flamenca per le donne e traje corto o completo per gli uomini."
  faq:
    - p: "Quando si tiene la Feria de Abril?"
      r: "Di solito inizia due settimane dopo la Domenica di Resurrezione, tra aprile e maggio. Dura una settimana, con l'Alumbrado la notte del lunedì."
    - p: "Posso entrare in qualsiasi caseta?"
      r: "No. La maggior parte è privata e si entra solo con invito o essendo soci. Ci sono casetas pubbliche e del comune aperte a tutti."
    - p: "Quanto costa entrare alla feria?"
      r: "L'ingresso al recinto è gratuito. Si paga quello che si consuma, e le attrazioni della calle del Infierno sono a pagamento."
    - p: "Cosa bisogna indossare?"
      r: "Molti visitatori indossano l'abito da flamenca o il traje corto, ma non è obbligatorio. La cosa più importante sono le scarpe comode, perché si cammina molto."
    - p: "Come arrivare?"
      r: "In metropolitana, tram o autobus. Evita di andare in auto: parcheggiare è quasi impossibile e la zona viene chiusa al traffico."
    - p: "È un buon programma con i bambini?"
      r: "Di giorno sì, con la sfilata di cavalli e casetas per famiglie. La calle del Infierno ha le giostre. La sera c'è più gente e più rumore."
san-fermin:
  texto:
    - "I Sanfermines sono la festa di Pamplona, dal 6 al 14 luglio, e una delle celebrazioni più conosciute al mondo. Iniziano con il chupinazo in plaza del Ayuntamiento, a mezzogiorno del 6 luglio, e terminano a mezzanotte del 14 con il Pobre de mí."
    - "Il grande simbolo sono gli encierros, la corsa dei tori: ogni mattina, alle otto, i tori corrono lungo un percorso di circa 850 metri dal corral de Santo Domingo fino alla plaza de toros. Ma i Sanfermines sono molto di più: la processione di San Fermín il 7 luglio, giganti e cabezudos, concerti, fuochi d'artificio, abiti bianchi con fazzoletto rosso e un'atmosfera di strada di giorno e di notte."
    - "Correre l'encierro è pericoloso e ha delle regole: bisogna essere maggiorenni, non aver bevuto alcol e rispettare le indicazioni dell'organizzazione. Se preferisci guardarlo, puoi farlo in televisione o da qualche punto autorizzato, che si riempie molto presto. Prenota l'alloggio con mesi di anticipo, perché i prezzi salgono e la città si riempie."
  faq:
    - p: "Quando si tengono i Sanfermines?"
      r: "Dal 6 al 14 luglio ogni anno. Iniziano con il chupinazo il giorno 6 a mezzogiorno e terminano con il Pobre de mí a mezzanotte del 14."
    - p: "A che ora sono gli encierros?"
      r: "Ogni mattina alle 8:00 dal 7 al 14 luglio. Dura appena qualche minuto."
    - p: "Come vedere un encierro?"
      r: "In televisione, oppure dal vivo da zone autorizzate, che si riempiono molto presto. Su alcuni balconi ci sono posti a pagamento. I punti con vista sul percorso si riempiono già prima dell'alba."
    - p: "Può correre chiunque?"
      r: "No. Bisogna essere maggiorenni, non essere sotto l'effetto di alcol o altre sostanze e rispettare le regole dell'organizzazione. È un'attività pericolosa e ogni anno ci sono dei feriti."
    - p: "Come vestirsi?"
      r: "Tradizionalmente, abiti bianchi con fazzoletto rosso al collo e fascia rossa. Scarpe comode e chiuse e un cambio di vestiti, perché ci si sporca quasi sicuramente."
    - p: "È un buon programma con i bambini?"
      r: "L'atmosfera diurna è familiare, con giganti, cabezudos e attività per bambini. Di notte c'è più folla. Conviene evitare gli encierros e le zone più affollate."
tomatina:
  texto:
    - "La Tomatina è la più grande battaglia di pomodori del mondo. Si tiene a Buñol, un paese della provincia di Valencia, l'ultimo mercoledì di agosto, e per circa un'ora migliaia di persone si lanciano pomodori maturi finché le strade non si tingono di rosso."
    - "Per partecipare serve il biglietto. Il comune limita la capienza e vende i biglietti in anticipo, quindi conviene acquistarli per tempo sui canali ufficiali e diffidare dei rivenditori. La festa inizia con il palo jabón, un palo unto con un prosciutto in cima, e la battaglia comincia quando viene sparato un razzo verso le 11 del mattino."
    - "Porta vestiti vecchi e scarpe che non ti dispiaccia perdere, occhialini da nuoto per proteggere gli occhi e guanti. Schiaccia il pomodoro prima di lanciarlo per non far male e non lanciare nient'altro che pomodori. Non portare oggetti di valore né macchine fotografiche e parti da Valencia con anticipo, ad esempio in treno o con gli autobus organizzati per quel giorno."
  faq:
    - p: "Quando si tiene la Tomatina?"
      r: "L'ultimo mercoledì di agosto, a Buñol (Valencia). La battaglia dura circa un'ora, a partire dalle 11 del mattino."
    - p: "Serve il biglietto?"
      r: "Sì. La capienza è limitata e i biglietti si comprano in anticipo tramite i canali ufficiali. Evita di acquistare dai rivenditori."
    - p: "Come arrivare a Buñol?"
      r: "Da Valencia, in treno regionale (Cercanías) o in autobus. Conviene arrivare con anticipo, perché il giorno della festa c'è moltissima gente."
    - p: "Come vestirsi?"
      r: "Vestiti vecchi e scarpe che non ti dispiaccia perdere. Molti partecipanti usano occhialini da nuoto per proteggersi gli occhi e guanti."
    - p: "Quali sono le regole?"
      r: "Schiaccia il pomodoro prima di lanciarlo, non lanciare nient'altro che pomodori, non portare oggetti di vetro né di valore e segui le indicazioni dell'organizzazione."
    - p: "È un buon programma con i bambini?"
      r: "C'è un'età minima per partecipare e la festa è molto affollata. Consulta le condizioni ufficiali prima di acquistare i biglietti."
san-juan:
  texto:
    - "La notte di San Giovanni, la vigilia del 24 giugno, è una delle celebrazioni più antiche legate al solstizio d'estate. In tutta la Spagna si accendono falò, si fanno rituali per esprimere desideri e si organizzano feste in spiaggia, in piazza e in montagna."
    - "Tra le più conosciute ci sono quelle di A Coruña, con i falò sulle spiagge di Riazor e dell'Orzán, le Hogueras di Alicante, Festa di Interesse Turistico Internazionale, la Revetlla de Sant Joan in Catalogna con petardi e coca de Sant Joan, e le feste del fuoco del solstizio sui Pirenei, riconosciute dall'UNESCO."
    - "Si usa saltare il falò, fare il bagno a mezzanotte o scrivere un desiderio su un foglietto e bruciarlo. Fallo in sicurezza: usa solo i falò autorizzati, non accendere fuochi per conto tuo nelle zone a rischio, tieni d'occhio i bambini con i petardi e fai molta attenzione al bagno notturno. E non lasciare rifiuti in spiaggia."
  faq:
    - p: "Quando si festeggia la notte di San Giovanni?"
      r: "La notte tra il 23 e il 24 giugno, con il 24 giugno festivo in alcune comunità autonome."
    - p: "Dove vedere i falò?"
      r: "A Coruña, Alicante, Barcellona, Cadice e molte spiagge della costa hanno celebrazioni molto popolari. Consulta il programma di ogni comune."
    - p: "Si possono accendere falò?"
      r: "Solo dove è autorizzato. In molte spiagge e zone boschive è vietato accendere fuochi per conto proprio, con rischio di multa e di incendio."
    - p: "Quali rituali si fanno?"
      r: "Saltare il falò, esprimere desideri, scrivere e bruciare un foglietto con ciò che vuoi lasciarti alle spalle e fare il bagno a mezzanotte. Ogni zona ha le sue usanze."
    - p: "È sicuro fare il bagno di notte?"
      r: "C'è un rischio, soprattutto con l'alcol e la scarsa visibilità. Fai il bagno solo in spiagge sorvegliate, in compagnia e senza allontanarti dalla riva."
    - p: "È un buon programma con i bambini?"
      r: "Sì, ci sono molte attività per famiglie, ma conviene sorvegliare il fuoco e i petardi ed evitare le ore di maggiore affollamento."
batalla-vino:
  texto:
    - "La Batalla del Vino di Haro è una festa unica: ogni 29 giugno migliaia di persone si lanciano vino rosso sui Riscos de Bilibio, a pochi chilometri da Haro, nella Rioja. È una celebrazione di San Pietro che unisce tradizione religiosa, vino e molto buonumore."
    - "La giornata inizia con una processione dal paese fino ai Riscos de Bilibio e una messa nell'eremo di San Felices. Poi comincia la battaglia, con secchi, pistole ad acqua, borracce di vino e annaffiatoi, e si svuotano migliaia di litri di vino. Quasi tutti vestono di bianco e portano un fazzoletto viola."
    - "Porta abiti bianchi che non ti dispiaccia rovinare, scarpe comode che possano bagnarsi e occhialini per proteggere gli occhi. Non portare oggetti di valore né macchine fotografiche che potrebbero macchiarsi, e tieni presente che la festa è molto affollata. Prenota alloggio e trasporto con anticipo e bevi con giudizio."
  faq:
    - p: "Quando si tiene la Batalla del Vino?"
      r: "Ogni 29 giugno, giorno di San Pietro, sui Riscos de Bilibio, vicino a Haro (La Rioja)."
    - p: "Che abiti portare?"
      r: "Abiti bianchi che non ti dispiaccia rovinare e scarpe comode. Molti partecipanti usano occhialini da nuoto e un fazzoletto viola."
    - p: "Come arrivare?"
      r: "Da Haro la maggior parte delle persone va a piedi in processione o con trasporti organizzati. Evita di andare in auto, perché parcheggiare è complicato."
    - p: "Serve il biglietto?"
      r: "In generale è una festa popolare a ingresso libero, ma conviene consultare le condizioni e il programma del Comune di Haro."
    - p: "È sicura?"
      r: "È una festa molto affollata e con il vino, quindi bisogna fare attenzione, proteggere gli occhi e non andare da soli."
    - p: "È un buon programma con i bambini?"
      r: "È molto affollata e bagnata, quindi di solito non è consigliata ai bambini piccoli."
romeria-rocio:
  texto:
    - "La Romería del Rocío è uno dei pellegrinaggi più affollati della Spagna. Centinaia di migliaia di persone viaggiano a piedi, a cavallo e su carretas da vari punti dell'Andalusia fino al villaggio di El Rocío, ad Almonte (Huelva), per la Pentecoste."
    - "I romeros, organizzati in hermandades, percorrono per giorni i sentieri di Doñana tra canti, preghiere, balli e convivialità. Il momento culminante arriva all'alba del lunedì di Pentecoste, quando gli abitanti di Almonte saltano la cancellata e portano in processione la Virgen del Rocío."
    - "Se vuoi viverla senza essere pellegrino, puoi visitare il villaggio e vedere il passaggio delle hermandades e delle carretas. Le strade sono di sabbia e c'è moltissima gente, il caldo è forte e alloggi e parcheggi si esauriscono. Porta acqua, scarpe comode e molta pazienza, e rispetta il carattere religioso della romería e l'ambiente naturale di Doñana."
  faq:
    - p: "Quando si tiene la Romería del Rocío?"
      r: "Per la Pentecoste, 50 giorni dopo la Domenica di Pasqua, di solito tra maggio e giugno. Il giorno principale è il lunedì."
    - p: "Dove si svolge?"
      r: "Nel villaggio di El Rocío, ad Almonte (Huelva), accanto al Parco Nazionale di Doñana."
    - p: "Che cos'è il salto de la reja?"
      r: "È il momento in cui gli abitanti di Almonte saltano la cancellata che protegge la Vergine per portarla in processione, all'alba del lunedì di Pentecoste."
    - p: "Si può andare senza essere romero?"
      r: "Sì, ma l'accesso è complicato: c'è molta gente, pochi parcheggi e strade di sabbia. Informati in anticipo su come arrivare e su eventuali restrizioni al traffico."
    - p: "Cosa bisogna portare?"
      r: "Acqua, cappello, protezione solare, scarpe comode e abiti adatti al caldo del giorno e al fresco della notte. Rispetta l'ambiente naturale e non lasciare rifiuti."
    - p: "È un buon programma con i bambini?"
      r: "Con cautela: c'è molto caldo, molta gente e tragitti lunghi. Meglio visitare il villaggio nelle ore di minore affluenza."
feria-malaga:
  texto:
    - "La Feria de Málaga, a metà agosto, è una delle fiere più vivaci del sud: una settimana di musica, balli, casetas, fuochi d'artificio e vino dolce. Si svolge in due scenari: la Feria del Centro, di giorno, e la Feria di Cortijo de Torres, di notte."
    - "Di giorno il centro storico si riempie di peñas, musica, fandangos verdiales e gente vestita da gitana o in abito corto tradizionale. Di notte il recinto di Cortijo de Torres riunisce casetas, giostre, concerti e tantissima atmosfera. Ci sono attività per tutti i pubblici, e molto pescaíto frito e vino di Málaga."
    - "Vai in centro di giorno e al recinto di sera. Evita l'auto e usa gli autobus o il trasporto pubblico della feria, perché traffico e parcheggio sono complicati. Porta scarpe comode, abiti freschi e pazienza, e prenota l'alloggio con anticipo."
  faq:
    - p: "Quando si tiene la Feria de Málaga?"
      r: "A metà agosto, per una settimana. Le date esatte cambiano ogni anno."
    - p: "Che cos'è la Feria del Centro?"
      r: "La parte diurna della feria, nel centro storico, con musica, balli e atmosfera popolare."
    - p: "Che cos'è Cortijo de Torres?"
      r: "Il recinto fieristico dove si svolge la feria di notte, con casetas, concerti e giostre."
    - p: "Come arrivare a Cortijo de Torres?"
      r: "Con gli autobus e i servizi speciali della feria. Evita l'auto, perché parcheggiare è difficile."
    - p: "Cosa si mangia e si beve?"
      r: "Pescaíto frito, espetos, prosciutto e vino dolce di Málaga, tra le altre cose."
    - p: "È un buon programma con i bambini?"
      r: "Di giorno e in centro, sì. Di notte c'è molta gente e molto rumore."
fiesta-santiago-apostol:
  texto:
    - "Le Fiestas del Apóstol Santiago celebrano il giorno del patrono della Spagna e della Galizia, il 25 luglio, che è anche la Festa Nazionale della Galizia. Si svolgono a Santiago de Compostela, in una settimana con eventi religiosi, concerti, attività popolari e tanta atmosfera."
    - "Due momenti spiccano: la vigilia, la notte del 24 luglio, con lo spettacolo di fuochi d'artificio davanti alla facciata dell'Obradoiro della cattedrale, e il 25 luglio, con l'Offerta Nazionale all'Apostolo nella cattedrale. Quando il 25 luglio cade di domenica si celebra l'Anno Santo Compostelano, con ancora più pellegrini."
    - "Santiago si riempie di visitatori, pellegrini e turisti in quelle date. Prenota l'alloggio con anticipo, consulta il programma ufficiale e arriva presto in plaza del Obradoiro se vuoi vedere i fuochi. Porta scarpe comode e un impermeabile, perché in Galizia il tempo cambia in fretta."
  faq:
    - p: "Quando sono le Fiestas del Apóstol?"
      r: "Intorno al 25 luglio, con la vigilia del 24 come notte dei fuochi d'artificio."
    - p: "Che cosa sono i fuochi dell'Apostolo?"
      r: "Uno spettacolo pirotecnico che si tiene la notte del 24 luglio davanti alla facciata dell'Obradoiro della cattedrale."
    - p: "Che cos'è l'Offerta Nazionale?"
      r: "Un atto religioso e ufficiale che si celebra il 25 luglio nella cattedrale, con un'offerta all'Apostolo Santiago."
    - p: "Che cos'è l'Anno Santo?"
      r: "Un anno giubilare compostelano che si celebra quando il 25 luglio cade di domenica. Attira molti più pellegrini."
    - p: "Bisogna prenotare l'alloggio?"
      r: "Sì, con largo anticipo, perché Santiago si riempie in quelle date."
    - p: "È un buon programma con i bambini?"
      r: "Sì, ci sono attività per famiglie, ma i fuochi e le calche dell'Obradoiro sono molto affollati."
calcotada:
  texto:
    - "La calçotada è un pasto tipico della Catalogna, soprattutto del Camp de Tarragona e dell'Alt Camp: calçots (cipollotti teneri) arrostiti alla brace, sbucciati con le mani e intinti nella salsa romesco. È un pasto di festa, con bavaglino, buona compagnia e un lungo dopopranzo a tavola."
    - "La stagione comincia verso dicembre e arriva fino ad aprile, con il periodo migliore tra gennaio e marzo. Valls, nell'Alt Camp, è la capitale del calçot e a fine gennaio organizza una grande festa, con gara e pranzo popolare. Oltre che in Catalogna, ci sono calçotade anche in altre zone della Spagna."
    - "Di solito si mangia con carne alla brace, butifarra, fagioli e vino o cava. Prenota con anticipo, soprattutto nel fine settimana, perché in stagione è tutto pieno. Si mangia con le mani: si afferra il calçot dalla base, si tira via la foglia esterna, lo si intinge nel romesco e si mangia la parte tenera in alto. Sporca, quindi il bavaglino non è affatto esagerato."
  mapa:
    titulo: "Dove andare a una calçotada"
    centro: [41.22, 1.25]
    zoom: 10
    puntos:
      - { nombre: "Valls (Alt Camp)", lat: 41.2872, lon: 1.2507, desc: "Capitale del calçot: a fine gennaio celebra la sua grande festa, con gara e pranzo popolare." }
      - { nombre: "Camp de Tarragona", lat: 41.12, lon: 1.2, desc: "Zona di origine del calçot, con masías e ristoranti che preparano calçotade in stagione." }
      - { nombre: "Alt Camp", lat: 41.36, lon: 1.32, desc: "Comarca dell'entroterra del calçot, con calçotade in paesi e masías; meglio con prenotazione." }
  faq:
    - p: "Che cos'è un calçot?"
      r: "È una varietà di cipollotto tenero tipica della Catalogna. Si arrostisce alla brace finché lo strato esterno diventa nero, si avvolge perché cuocia nel proprio vapore e si mangia con la salsa romesco."
    - p: "Quando è la stagione dei calçots?"
      r: "Da dicembre ad aprile circa, con il momento culminante tra gennaio e marzo."
    - p: "Dove andare a una calçotada?"
      r: "Il Camp de Tarragona e l'Alt Camp, con Valls come capitale, sono le zone di riferimento, ma ci sono ristoranti e masías con calçotada in tutta la Catalogna."
    - p: "Bisogna prenotare?"
      r: "Sì, con anticipo, soprattutto nel fine settimana e a gennaio e febbraio. Molti locali servono la calçotada solo su prenotazione."
    - p: "Come si mangiano i calçots?"
      r: "Con le mani: si afferrano dalla base, si tira verso l'alto per togliere lo strato bruciato, si intingono nel romesco e si mangia la parte tenera. Di solito si indossa un bavaglino."
    - p: "Che altro include il menu?"
      r: "Di solito carne alla brace (agnello, butifarra), fagioli, pane con pomodoro, dolce e vino o cava. Si paga un menu fisso a persona."
carnaval-cadiz:
  texto:
    - "Il Carnevale di Cadice è uno dei più famosi e particolari della Spagna. La sua anima è la satira: chirigotas, comparsas, cori e quartetti che cantano coplas con umorismo e critica sull'attualità, e che riempiono strade e teatri per settimane."
    - "Il Concurso de Agrupaciones del Gran Teatro Falla, a febbraio, è la grande vetrina delle coplas. In strada, l'atmosfera di costumi, musica e copla si vive soprattutto nel fine settimana di Carnevale, con sfilate, cavalcata e gruppi di strada che cantano in piazze e agli angoli."
    - "I biglietti del Teatro Falla vanno esauriti molto in fretta. Il meglio del Carnevale di Cadice è in strada, senza bisogno di biglietto: mettiti in costume, segui i gruppi e lasciati sorprendere dalle coplas. Prenota l'alloggio con anticipo e preparati a tanta gente."
  faq:
    - p: "Quando è il Carnevale di Cadice?"
      r: "Si celebra prima della Quaresima, tra febbraio e marzo, a seconda dell'anno. La data dipende dalla Pasqua."
    - p: "Che cosa sono le chirigotas?"
      r: "Sono gruppi che cantano coplas satiriche e umoristiche sull'attualità, con costumi collettivi. È il genere più popolare del carnevale gaditano."
    - p: "Serve il biglietto?"
      r: "Per il Concurso del Gran Teatro Falla sì, e si esauriscono presto. Il Carnevale di strada è gratuito."
    - p: "Dove vedere l'atmosfera di strada?"
      r: "Nel centro storico di Cadice: strade e piazze si riempiono di gruppi e di gente in costume, soprattutto nel fine settimana."
    - p: "Bisogna andare in costume?"
      r: "Non è obbligatorio, ma moltissime persone lo fanno e l'atmosfera è migliore se ti unisci. I più tipici sono i costumi con umorismo e critica."
    - p: "È un buon programma con i bambini?"
      r: "Sì, ci sono attività e una cavalcata per famiglie. Le sere sono più affollate."
sant-jordi:
  texto:
    - "Il 23 aprile si celebrano la Giornata del Libro e Sant Jordi, e le strade si riempiono di bancarelle di libri e di rose. In Catalogna la tradizione è regalare una rosa e un libro, ed è una delle feste più amate di Barcellona, con tanta gente in strada."
    - "A Barcellona, le bancarelle di libri e rose occupano Las Ramblas, il Paseo de Gracia e quasi tutti i quartieri, e molti scrittori firmano copie. In tutta la Spagna si celebra anche la Giornata Internazionale del Libro, con firme, letture e sconti nelle librerie, e in Aragona è il Día de Aragón."
    - "Se vuoi farti firmare un libro, arriva presto: le code sono lunghe. Vai la mattina o al tramonto, quando c'è meno confusione, e consulta l'elenco degli autori e gli orari presso librerie e case editrici. E ricorda: non serve essere catalani per regalare una rosa o un libro."
  faq:
    - p: "Quando è Sant Jordi?"
      r: "Ogni 23 aprile. Coincide con la Giornata del Libro."
    - p: "Che cosa si regala?"
      r: "Tradizionalmente, l'uomo regala una rosa e la donna un libro. Oggi si regalano entrambi tra persone di ogni tipo."
    - p: "Dove andare a Barcellona?"
      r: "Las Ramblas, il Paseo de Gracia e le strade del centro si riempiono di bancarelle. Ce ne sono in quasi tutti i quartieri."
    - p: "Ci sono firme di autori?"
      r: "Sì, molti autori firmano libri in bancarelle, librerie e fiere. Arriva presto per evitare le code."
    - p: "Si celebra anche fuori dalla Catalogna?"
      r: "Sì, la Giornata del Libro si celebra in tutta la Spagna e nel mondo, con attività in librerie e biblioteche."
    - p: "È un buon programma con i bambini?"
      r: "Sì, ci sono letture di fiabe e attività per bambini. Attenzione alla ressa nel centro di Barcellona."
pilar:
  texto:
    - "Le Fiestas del Pilar sono le feste patronali di Saragozza, in onore della Vergine del Pilar, e si celebrano intorno al 12 ottobre, che è anche festa nazionale. Per una settimana la città si riempie di concerti, sfilate, eventi popolari e tanta atmosfera in strada."
    - "Il momento centrale è l'Ofrenda de Flores, il 12 ottobre, quando migliaia di persone, molte in costume regionale aragonese, sfilano per il centro fino a plaza del Pilar per deporre i fiori davanti alla Vergine e formare un grande manto floreale. Il giorno dopo, il 13 ottobre, si celebra l'Ofrenda de Frutos."
    - "Oltre all'offerta, ci sono gigantes y cabezudos, concerti su vari palchi, spettacoli pirotecnici ed eventi culturali e sportivi. Consulta il programma ufficiale del Comune di Saragozza. Prenota l'alloggio con anticipo, perché è una festa molto popolare e il centro si riempie. E per l'offerta, arriva presto se vuoi vedere la sfilata."
  faq:
    - p: "Quando sono le Fiestas del Pilar?"
      r: "Intorno al 12 ottobre. Durano circa una settimana, con il giorno 12 come giornata principale."
    - p: "Che cos'è l'Ofrenda de Flores?"
      r: "È la sfilata in cui migliaia di persone, molte in costume regionale, portano fiori alla Vergine del Pilar per formare un grande manto floreale. Si celebra il 12 ottobre."
    - p: "Bisogna prenotare?"
      r: "Per vedere l'offerta no. L'alloggio sì, perché Saragozza si riempie durante le feste."
    - p: "Che altro si può fare?"
      r: "Concerti, gigantes y cabezudos, spettacoli di fuochi d'artificio, fiere gastronomiche e attività per bambini. Il programma ufficiale lo pubblica il comune."
    - p: "È gratis?"
      r: "La maggior parte degli eventi è gratuita, ma alcuni concerti e spettacoli hanno un biglietto."
    - p: "È un buon programma con i bambini?"
      r: "Sì, ci sono molte attività per bambini e la sfilata di gigantes y cabezudos di solito li entusiasma. Attenzione alla ressa il giorno 12."
semana-santa-malaga:
  texto:
    - "La Settimana Santa di Malaga si distingue per i suoi troni di grandi dimensioni, che sfilano a spalla di centinaia di portatori per il centro della città. Festa di Interesse Turistico Internazionale, ogni processione è uno spettacolo di musica, fiori, incenso ed emozione popolare."
    - "Le confraternite escono dalle loro chiese e dai loro quartieri e si dirigono alla Carrera Oficial, nella Alameda e in calle Larios, dove ci sono una tribuna e delle sedie. Un appuntamento molto atteso è quello del Giovedì Santo, con la Legione che accompagna il Cristo de la Buena Muerte, anche se ogni giorno ha le sue processioni e ogni quartiere la sua atmosfera."
    - "Consulta il programma ufficiale della Agrupación de Cofradías con orari e itinerari. Le strade del centro si riempiono e le sfilate sono lente, quindi arriva con anticipo e scegli un posto. Prenota l'alloggio con anticipo e, se puoi, vai anche alle processioni dei quartieri, più tranquille."
  faq:
    - p: "Quando è la Settimana Santa di Malaga?"
      r: "Dalla Domenica delle Palme alla Domenica di Resurrezione, tra marzo e aprile a seconda dell'anno. Ci sono anche eventi precedenti a partire dal Venerdì di Dolores."
    - p: "Che cosa la rende diversa?"
      r: "I troni sono grandi e si portano a spalla, e l'atmosfera mescola fede, musica e tradizione popolare. La Legione e le bande musicali hanno un ruolo importante."
    - p: "Dove vedere le processioni?"
      r: "Nella Carrera Oficial (Alameda, calle Larios e plaza de la Constitución), con più atmosfera e più gente. Le processioni dei quartieri sono un'alternativa più tranquilla."
    - p: "Bisogna pagare?"
      r: "Vedere le processioni dalla strada è gratis. Ci sono sedie e tribune a pagamento nella Carrera Oficial."
    - p: "Come consulto gli orari?"
      r: "L'Agrupación de Cofradías pubblica il programma ufficiale con gli itinerari e gli orari di ogni confraternita."
    - p: "È un buon programma con i bambini?"
      r: "Sì, con cautela: c'è molta gente e le attese sono lunghe. Scegli processioni pomeridiane e un posto con spazio."
festival-jerez:
  texto:
    - "Il Festival de Jerez è uno dei grandi appuntamenti del flamenco nel mondo. Si svolge tra fine febbraio e inizio marzo a Jerez de la Frontera, la città dove è nata quest'arte, con spettacoli, corsi e incontri per due settimane."
    - "Il programma comprende spettacoli di ballo, cante e chitarra di artisti affermati e di nuovi talenti, al Teatro Villamarta e in altri spazi della città. Ci sono inoltre corsi di flamenco aperti ad appassionati e professionisti, e attività nelle peñas e nei tablaos che permettono di conoscere da vicino l'atmosfera flamenca di Jerez."
    - "Consulta il sito ufficiale per il programma e l'acquisto dei biglietti, che si vendono in anticipo. Approfitta per visitare le peñas flamenche e le bodegas della città, e per assaggiare la gastronomia di Jerez. Le sere di febbraio sono fresche, quindi porta vestiti caldi."
  faq:
    - p: "Quando si svolge il Festival de Jerez?"
      r: "Tra fine febbraio e inizio marzo, per circa due settimane. Le date esatte vengono annunciate ogni anno."
    - p: "Dove si svolge?"
      r: "A Jerez de la Frontera, soprattutto al Teatro Villamarta e in altri spazi della città."
    - p: "Cosa c'è oltre agli spettacoli?"
      r: "Corsi di flamenco, incontri e attività nelle peñas e nei tablaos."
    - p: "Dove compro i biglietti?"
      r: "Sui canali ufficiali del festival. Si vendono in anticipo e gli spettacoli più richiesti vanno esauriti."
    - p: "Posso iscrivermi a un corso?"
      r: "Sì, ci sono corsi per appassionati e professionisti. Consulta le iscrizioni sul sito ufficiale."
    - p: "Cos'altro fare a Jerez?"
      r: "Visitare le bodegas, le peñas flamenche, il Real Alcázar e assaggiare la gastronomia locale."
sonar-festival-internacional-musica-avanzada-barcelona:
  texto:
    - "Sónar è uno dei grandi festival di musica elettronica e creatività digitale d'Europa. Si svolge a Barcellona a giugno, per tre giorni, e combina concerti e dj set con mostre, conferenze e proposte di arte e tecnologia."
    - "Il festival si divide in due programmi: Sónar de Día, con palchi all'aperto, sessioni e attività, e Sónar de Noche, con grandi sessioni e concerti in un altro recinto, fino all'alba. Comprende anche un'area professionale dedicata alla creatività e alla tecnologia."
    - "I biglietti si vendono in anticipo, per singolo giorno o con abbonamento completo, e il cartellone viene annunciato con mesi di anticipo. Acquista solo sui canali ufficiali e controlla le condizioni di accesso e gli oggetti consentiti. Porta scarpe comode, protezione solare di giorno, tappi per le orecchie e acqua, e pianifica in anticipo il trasporto per il ritorno dalla sessione notturna."
  faq:
    - p: "Quando si svolge Sónar?"
      r: "A giugno, per tre giorni. Le date esatte vengono annunciate ogni anno."
    - p: "Dove si svolge?"
      r: "A Barcellona, con due recinti: uno per Sónar de Día e uno per Sónar de Noche."
    - p: "Che differenza c'è tra Sónar de Día e de Noche?"
      r: "Di giorno, palchi all'aperto e attività; di notte, sessioni e concerti di grande formato fino all'alba."
    - p: "Dove compro i biglietti?"
      r: "Sui canali ufficiali del festival. Ci sono biglietti giornalieri e abbonamenti completi. Diffida dei rivenditori non ufficiali."
    - p: "Cosa conviene portare?"
      r: "Scarpe comode, protezione solare e cappellino di giorno, tappi per le orecchie e acqua. Controlla gli oggetti consentiti prima di andare."
    - p: "Come torno a casa?"
      r: "Pianifica il trasporto in anticipo: dopo la sessione notturna la metropolitana può essere chiusa e c'è molta richiesta di taxi."
bilbao-bbk-live:
  texto:
    - "Il Bilbao BBK Live è un festival di musica che si svolge a luglio sulle pendici del monte Kobetas, con vista sulla città di Bilbao. Per tre giorni riunisce artisti pop, rock, indie ed elettronici in un contesto naturale davvero particolare."
    - "Il recinto, all'aperto e in pendenza, ha vari palchi e un'area per mangiare e riposare. Il cartellone viene annunciato con mesi di anticipo e i biglietti si vendono in anticipo, sia per singolo giorno sia con abbonamento completo. È un festival molto legato alla città: ci si arriva con i mezzi pubblici e con servizi speciali dal centro."
    - "Consulta sul sito ufficiale le condizioni di accesso, gli oggetti consentiti e gli orari. Porta scarpe comode, vestiti caldi e impermeabile, perché a Bilbao il tempo può cambiare in fretta, e protezione solare se c'è il sole. Prenota l'alloggio per tempo, perché la città si riempie in quei giorni."
  faq:
    - p: "Quando si svolge il Bilbao BBK Live?"
      r: "A luglio, per tre giorni. Le date esatte vengono annunciate ogni anno."
    - p: "Dove si svolge?"
      r: "Sulle pendici del monte Kobetas, a Bilbao, con vista sulla città."
    - p: "Come arrivo al recinto?"
      r: "Con i mezzi pubblici e con servizi speciali organizzati dal centro. Consulta il sito ufficiale per i dettagli."
    - p: "Dove compro i biglietti?"
      r: "Sui canali ufficiali del festival, per singolo giorno o con abbonamento completo. Evita i rivenditori non ufficiali."
    - p: "Che abbigliamento portare?"
      r: "Scarpe comode, vestiti caldi, impermeabile e protezione solare. A Bilbao il tempo può cambiare in fretta."
    - p: "È un buon programma con i bambini?"
      r: "Dipende dal cartellone e dall'orario. Consulta le condizioni di accesso per i minori sul sito ufficiale."
fib-festival-internacional-benicassim:
  texto:
    - "Il FIB, Festival Internacional de Benicàssim, è uno dei festival più storici e conosciuti di Spagna. Si svolge a luglio a Benicàssim, sulla costa di Castellón, e combina concerti con spiaggia, campeggio e un'atmosfera da vacanza."
    - "Per quattro giorni, vari palchi riuniscono artisti rock, indie, pop ed elettronici, con sessioni fino all'alba. La vicinanza del mare è una delle sue grandi attrattive: molti partecipanti approfittano della mattina per fare il bagno e riposare prima dei concerti del pomeriggio e della sera."
    - "I biglietti si vendono in anticipo, per singolo giorno o con abbonamento, e possono esserci opzioni con campeggio. Acquista solo sui canali ufficiali e controlla le condizioni di accesso. A luglio fa molto caldo: porta protezione solare, cappellino, acqua e scarpe comode, e prenota l'alloggio per tempo se non pensi di campeggiare."
  faq:
    - p: "Quando si svolge il FIB?"
      r: "A luglio, per quattro giorni. Le date esatte vengono annunciate ogni anno."
    - p: "Dove si svolge?"
      r: "A Benicàssim, sulla costa di Castellón."
    - p: "C'è il campeggio?"
      r: "Di solito ci sono opzioni di campeggio. Consulta le condizioni sul sito ufficiale."
    - p: "Come compro i biglietti?"
      r: "Sui canali ufficiali del festival, per singolo giorno o con abbonamento completo. Evita i rivenditori non ufficiali."
    - p: "Cosa conviene portare?"
      r: "Protezione solare, cappellino, acqua, scarpe comode e costume da bagno, perché il mare è vicino."
    - p: "È un buon programma con i bambini?"
      r: "Dipende dal cartellone e dall'orario. Consulta le condizioni di accesso per i minori sul sito ufficiale."
festival-internacional-cine-fantastico-cataluna-sitges:
  texto:
    - "Il Festival di Sitges è il grande festival di cinema fantastico e horror della Spagna e uno dei più importanti al mondo nel suo genere. Si svolge a ottobre a Sitges, una località costiera vicina a Barcellona, per circa undici giorni."
    - "Il programma comprende anteprime di cinema horror, fantascienza, fantasy e thriller, retrospettive, omaggi e incontri con registi e attori. Ci sono sezioni in concorso e parallele, e un'atmosfera di festa tra gli appassionati, con travestimenti e attività per strada."
    - "Sitges si trova a circa 35 chilometri da Barcellona e si raggiunge con il treno di Rodalies, quindi si può andare e tornare in giornata. Consulta il programma e acquista i biglietti in anticipo, perché le proiezioni più popolari vanno esaurite. Prenota l'alloggio per tempo se vuoi fermarti, dato che la località si riempie durante il festival."
  faq:
    - p: "Quando si svolge il Festival di Sitges?"
      r: "A ottobre, per circa undici giorni. Le date esatte vengono annunciate ogni anno."
    - p: "Che tipo di cinema viene proiettato?"
      r: "Cinema fantastico, horror, fantascienza, fantasy e thriller, con anteprime e retrospettive."
    - p: "Come arrivare da Barcellona?"
      r: "In treno di Rodalies da Barcellona, in circa 35-45 minuti. Ci sono anche autobus e auto, anche se durante il festival parcheggiare è difficile."
    - p: "Dove compro i biglietti?"
      r: "Sui canali ufficiali del festival. Le proiezioni con ospiti e le anteprime vanno esaurite."
    - p: "Bisogna andare in costume?"
      r: "Non è obbligatorio, ma c'è molta atmosfera di festa e molti appassionati lo fanno."
    - p: "È un buon programma con i bambini?"
      r: "Dipende dai film: molti sono per adulti. Consulta la classificazione per età di ogni proiezione."
fiesta-piraguas-descenso-internacional-sella:
  texto:
    - "Il Descenso Internacional del Sella (la Discesa internazionale del Sella) è una delle feste più popolari delle Asturie e una delle più conosciute di Spagna. Ogni agosto, migliaia di canoisti scendono lungo il fiume Sella tra Arriondas e Ribadesella, mentre migliaia di persone lo vivono dalle rive, con cibo, bevande e tanta atmosfera."
    - "È una Festa di Interesse Turistico Internazionale e unisce gara sportiva, tradizione e festa popolare. I partecipanti percorrono circa venti chilometri lungo il fiume, e il percorso si può seguire da vari punti e dalle rive, con picnic e musica lungo il tragitto."
    - "Se vuoi assistere alla discesa, scegli un punto ben accessibile, arriva presto e tieni presente che il traffico si complica e che Arriondas e Ribadesella si riempiono di gente. Per partecipare bisogna iscriversi in anticipo. Porta acqua, crema solare e scarpe comode."
  faq:
    - p: "Quando si svolge il Descenso del Sella?"
      r: "Di solito il primo sabato di agosto. Controlla ogni anno la data esatta."
    - p: "Dove si svolge?"
      r: "Sul fiume Sella, tra Arriondas e Ribadesella, nelle Asturie."
    - p: "Come vederlo?"
      r: "Dalle rive, con picnic e atmosfera di festa, o da punti appositamente attrezzati. L'arrivo è a Ribadesella."
    - p: "Si può partecipare?"
      r: "Sì, ma bisogna iscriversi in anticipo e rispettare i requisiti dell'organizzazione."
    - p: "Come arrivare?"
      r: "Con largo anticipo: il traffico si complica. Valuta il trasporto organizzato e i parcheggi predisposti."
    - p: "È un buon programma con i bambini?"
      r: "Sì, l'atmosfera sulle rive è familiare, ma c'è molta gente e fa caldo. Porta acqua e crema solare."
festival-womad-caceres:
  texto:
    - "WOMAD Cáceres è un festival di musiche del mondo che trasforma le piazze della città monumentale in palchi all'aperto. Si svolge a maggio e combina concerti di artisti di vari paesi, laboratori, attività per bambini e gastronomia."
    - "La cornice è parte del suo fascino: piazze medievali, palazzi e vie di pietra di una città Patrimonio dell'Umanità. Molti concerti si tengono in piazze aperte, e il festival offre anche proposte culturali e di svago per tutte le età."
    - "Consulta il sito ufficiale per il programma, le piazze e gli orari, e per sapere quali concerti sono a ingresso libero e quali richiedono biglietto o abbonamento. Porta scarpe comode, perché le strade sono acciottolate, e vestiti a strati. Prenota l'alloggio per tempo: Cáceres si riempie durante il festival."
  faq:
    - p: "Quando si svolge WOMAD Cáceres?"
      r: "A maggio, per alcuni giorni. Le date esatte vengono annunciate ogni anno."
    - p: "Che tipo di musica c'è?"
      r: "Musiche del mondo: folclore, fusion, etno e musica tradizionale di vari paesi."
    - p: "Dove si tengono i concerti?"
      r: "In piazze e spazi della città monumentale di Cáceres. Consulta il programma."
    - p: "Tutti i concerti sono gratuiti?"
      r: "Dipende dall'edizione. Ci sono concerti a ingresso libero e altri con biglietto o abbonamento. Consulta il sito ufficiale."
    - p: "Cosa conviene portare?"
      r: "Scarpe comode, perché le strade sono acciottolate, e vestiti a strati."
    - p: "È un buon programma con i bambini?"
      r: "Sì, il festival di solito include laboratori e attività per bambini. Consulta il programma."
fiestas-vendimia-riojana:
  texto:
    - "Le Fiestas de San Mateo y de la Vendimia Riojana (Feste di San Matteo e della Vendemmia Riojana) sono le feste patronali di Logroño e uno dei modi migliori per vivere la vendemmia nella Rioja. Si svolgono a settembre, per una settimana, con eventi tradizionali legati al vino e tanta atmosfera per le strade."
    - "Uno dei momenti più emblematici è la pigiatura dell'uva e l'offerta del primo mosto alla Vergine di Valvanera, patrona della Rioja. Durante la settimana ci sono anche concerti, sfilate, attività popolari, degustazioni e spettacoli per tutti i pubblici, e la città si riempie di visitatori."
    - "Approfitta per assaggiare i pinchos della calle Laurel e dintorni, e per visitare qualche cantina della zona, dato che molte organizzano degustazioni e visite durante la vendemmia. Consulta il programma ufficiale del comune, prenota l'alloggio per tempo e, se vai in una cantina, prenota anche quella con anticipo."
  faq:
    - p: "Quando si svolgono le Feste di San Mateo?"
      r: "Intorno al 21 settembre, per una settimana. Le date esatte vengono annunciate ogni anno."
    - p: "Cos'è la pigiatura dell'uva?"
      r: "È un atto simbolico della vendemmia in cui si pigia l'uva e si dà inizio all'offerta del primo mosto alla Vergine di Valvanera, patrona della Rioja."
    - p: "Cos'altro si può fare?"
      r: "Concerti, eventi popolari, degustazioni e visite alle cantine. Consulta il programma ufficiale."
    - p: "Dove mangiare?"
      r: "Nella calle Laurel e dintorni ci sono molti bar di pinchos, una delle grandi attrazioni di Logroño."
    - p: "Si possono visitare le cantine?"
      r: "Sì, molte organizzano visite e degustazioni. Conviene prenotare in anticipo, soprattutto nei giorni della vendemmia."
    - p: "È un buon programma con i bambini?"
      r: "Sì, durante le feste ci sono attività per famiglie. Consulta il programma."
fiesta-marisco:
  texto:
    - "La Fiesta del Marisco (Festa dei Frutti di Mare) di O Grove è uno dei grandi appuntamenti gastronomici della Galizia. Si svolge a ottobre, per alcuni giorni, e riunisce migliaia di visitatori intorno ai frutti di mare delle rías galiziane, con casette, degustazioni e spettacoli."
    - "O Grove, nella ría de Arousa, è famosa per i suoi frutti di mare: ostriche, cozze, vongole, cuori (berberechos), zamburiñas, capesante o granchio reale (centollo), tra gli altri. Durante la festa, produttori e ristoranti offrono i loro prodotti nell'area della fiera, e ci sono anche attività culturali e musicali."
    - "Consulta il programma ufficiale del comune per date e orari. Arriva presto, soprattutto nei fine settimana, e vai durante la settimana se vuoi evitare la ressa. Se sei allergico ai frutti di mare o sei in gravidanza, informati prima su cosa puoi mangiare. Prenota l'alloggio per tempo: la zona si riempie."
  faq:
    - p: "Quando si svolge la Festa dei Frutti di Mare di O Grove?"
      r: "A ottobre, per alcuni giorni. Le date esatte vengono annunciate ogni anno."
    - p: "Quali frutti di mare si possono assaggiare?"
      r: "Ostriche, cozze, vongole, cuori, zamburiñas, capesante o granchio reale, a seconda della stagione e dell'offerta di ogni casetta."
    - p: "Bisogna pagare l'ingresso?"
      r: "Consulta il programma ufficiale del comune, che specifica le condizioni di accesso e le degustazioni."
    - p: "Quando è meglio andare?"
      r: "Durante la settimana e di buon'ora, per evitare la ressa. Nei fine settimana c'è moltissima gente."
    - p: "Cos'altro fare a O Grove?"
      r: "Visitare l'isola di A Toxa, le spiagge della penisola e fare un giro in barca nella ría."
    - p: "È un buon programma con i bambini?"
      r: "Sì, anche se conviene andare presto ed evitare le ore di maggiore affluenza."
maraton-malaga:
  texto:
    - "La Maratona di Málaga è una delle grandi gare di atletica popolare della Spagna, con distanze di maratona e mezza maratona che attraversano la città all'inizio di dicembre. Il clima mite di Málaga in quel periodo e un percorso veloce lungo il lungomare la rendono molto attraente per i corridori."
    - "La corsa riunisce migliaia di partecipanti di ogni livello, dai professionisti agli amatori in cerca del proprio record personale, ed è anche un programma per gli spettatori, che incitano dalla strada. Il percorso attraversa zone del centro e del litorale della città."
    - "Se vuoi correre, iscriviti in anticipo sul sito ufficiale e controlla i requisiti di partecipazione. Se vuoi fare il tifo, cerca un punto del percorso sul lungomare o in centro e tieni presente che ci saranno chiusure al traffico. Porta abiti comodi, acqua e pazienza."
  faq:
    - p: "Quando si svolge la Maratona di Málaga?"
      r: "All'inizio di dicembre, di solito di domenica. Le date esatte vengono annunciate ogni anno."
    - p: "Quali distanze ci sono?"
      r: "Maratona e mezza maratona. Consulta il sito ufficiale per eventuali altre gare."
    - p: "Come mi iscrivo?"
      r: "Sul sito ufficiale della gara, in anticipo. Consulta i requisiti di partecipazione e le scadenze."
    - p: "Dove vedere la corsa?"
      r: "Lungo il percorso, soprattutto sul lungomare e in centro. Consulta la mappa ufficiale."
    - p: "Ci sono chiusure al traffico?"
      r: "Sì. Consulta le chiusure e gli orari sul sito ufficiale e presso il comune."
    - p: "Che tempo fa a dicembre a Málaga?"
      r: "Di solito è mite, anche se possono esserci pioggia o vento. Porta abiti a strati."
magostos:
  texto:
    - "Il magosto è la grande festa della castagna: un falò, castagne arrostite, vino novello e tanta gente intorno. Si celebra soprattutto in Galizia, nelle Asturie (dove si chiama amagüestu) e a El Bierzo, e ha il suo giorno clou intorno a San Martino, l'11 novembre."
    - "Ci sono magosti di famiglia, di quartiere, di paese e di associazioni, e molti comuni li organizzano aperti a tutti, a volte con musica, balli e giochi tradizionali. In altre zone dell'interno, come la Valle del Jerte in Extremadura, esiste una tradizione simile legata a Ognissanti, che si chiama calbotá."
    - "Per trovarne uno, dai un'occhiata all'agenda del comune o della pro loco della zona qualche giorno prima: le date cambiano ogni anno e molti vengono annunciati con poco anticipo. Porta vestiti caldi, perché si sta all'aperto, e non aspettarti niente di sofisticato: il bello sta nel falò e nel mangiare le castagne calde, in compagnia."
  mapa:
    titulo: "Dove si celebrano i magosti"
    centro: [41.8, -6.2]
    zoom: 6
    puntos:
      - { nombre: "Galizia (Ourense e Lugo)", lat: 42.4, lon: -7.6, desc: "Culla del magosto: si celebra in paesi, quartieri e scuole, con la data principale intorno a San Martino." }
      - { nombre: "Asturie", lat: 43.3, lon: -5.8, desc: "Qui si chiama amagüestu e lo si accompagna con sidro novello." }
      - { nombre: "El Bierzo (León)", lat: 42.55, lon: -6.6, desc: "Magosti in molti paesi della comarca, in pieno castagneto." }
      - { nombre: "Valle del Jerte (Cáceres)", lat: 40.2, lon: -5.8, desc: "La sua versione è la calbotá, intorno a Ognissanti." }
  faq:
    - p: "Che cos'è un magosto?"
      r: "È una festa tradizionale d'autunno in cui si arrostiscono castagne su un falò e si mangiano con vino novello, sidro o mosto. È tipica di Galizia, Asturie e El Bierzo, anche se esistono celebrazioni simili in altre zone."
    - p: "Quando si celebra?"
      r: "Soprattutto a novembre, con il giorno di San Martino, l'11 novembre, come data di riferimento. Molti paesi lo festeggiano nel fine settimana più vicino, e ci sono magosti anche a fine ottobre."
    - p: "Dove andare a un magosto?"
      r: "In Galizia, nelle Asturie e a El Bierzo ci sono magosti in moltissimi paesi e quartieri. La cosa più affidabile è consultare l'agenda del comune o della zona qualche giorno prima."
    - p: "Bisogna pagare o prenotare?"
      r: "Dipende. Molti magosti popolari sono gratuiti o chiedono un piccolo contributo, mentre altri, organizzati da ristoranti o cantine, richiedono la prenotazione. Chiedi all'organizzatore."
    - p: "Posso fare un magosto a casa?"
      r: "Sì. Incidi la buccia di ogni castagna, arrostiscile in padella o nel forno e avvolgile in un canovaccio per qualche minuto prima di sbucciarle. Accompagnale con vino o sidro, se ti va."
    - p: "È un buon programma con i bambini?"
      r: "Sì, di solito l'atmosfera è molto familiare. Basta stare attenti al falò e far sì che le castagne siano tiepide prima di mangiarle."
piscinas-naturales:
  imagen_alt: "Pozza d'acqua verde e trasparente tra rocce di granito con una bagnante in una gola di montagna"
  texto:
    - "Pozze d'acqua cristallina tra rocce di granito, piccole cascate e gole fresche in pieno estate: le piscine naturali sono uno dei modi migliori per scappare dal caldo senza andare in costa. Sono acqua di fiume o di torrente di montagna, senza cloro né bagnino, e questo le rende tanto speciali quanto delicate."
    - "Le zone più conosciute si trovano nel nord di Cáceres e nel Sistema Centrale: La Vera, la Valle del Jerte (con i suoi famosi Pilones), Las Hurdes e la sierra de Gredos, ad Ávila. Ce ne sono moltissime anche in Galizia, Asturie, Cantabria, Castilla y León, nei Pirenei e in Sierra Nevada, e l'acqua è di solito fredda anche ad agosto."
    - "Entra in acqua con calma, soprattutto se vieni da ore passate al sole, perché lo sbalzo di temperatura può provocare un blocco della digestione. Non tuffarti senza conoscere il fondale, fai attenzione alle rocce scivolose e non fare il bagno dopo forti piogge o con la portata alta. Nelle pozze non c'è sorveglianza, quindi vai sempre in compagnia e presta particolare attenzione ai bambini."
    - "Alcune pozze, per la loro fragilità o per l'afflusso, hanno capienza limitata, prenotazione obbligatoria o accessi regolamentati in estate, e nei fine settimana di agosto si riempiono presto. Consulta prima il sito del comune o dell'area naturale e arriva presto. Porta calzature che aderiscano bene dentro l'acqua, non usare sapone né creme nella pozza e porta via tutta la tua spazzatura."
  faq:
    - p: "Dove ci sono piscine naturali in Spagna?"
      r: "Le zone più conosciute sono La Vera e la Valle del Jerte (Cáceres), Las Hurdes, la sierra de Gredos (Ávila) e il Sistema Centrale, oltre a molte pozze di Galizia, Asturie, Cantabria, Pirenei e Sierra Nevada."
    - p: "Quando andare in una piscina naturale?"
      r: "Da giugno a settembre, con luglio e agosto come mesi di maggiore affluenza. Se vuoi un po' di tranquillità, vai in settimana e arriva presto. In quelle che dipendono dal disgelo o dalla pioggia, la portata cala a fine estate."
    - p: "Bisogna prenotare o pagare?"
      r: "Quasi sempre sono gratuite, ma alcune hanno capienza limitata, accesso regolamentato o parcheggio a pagamento in alta stagione. Consulta il sito del comune o dell'area naturale prima di andare."
    - p: "Ci sono bagnini?"
      r: "Nella maggior parte delle pozze e delle gole no: sono acqua di fiume senza sorveglianza. Vai in compagnia, non lasciare i bambini senza supervisione ed evita di fare il bagno se il tempo è brutto o la portata è aumentata."
    - p: "Cosa bisogna portare?"
      r: "Calzature che aderiscano in acqua (sandali da fiume o scarpette), asciugamano, acqua, qualcosa da mangiare, protezione solare e un sacchetto per la tua spazzatura. Non usare sapone né creme nella pozza."
    - p: "Si può andare con bambini o con il cane?"
      r: "Con i bambini, meglio pozze poco profonde e di facile accesso, e sempre con un adulto in acqua. Con il cane dipende dall'area: in alcune è vietato o deve stare al guinzaglio, quindi controlla la normativa locale."
almendros:
  texto:
    - "I mandorli sono i primi alberi a fiorire in Spagna. A fine inverno, quando fa ancora freddo, i pendii si coprono di fiori bianchi e rosa, e si può passeggiare tra di essi con una luce particolarmente bella."
    - "La fioritura va di solito da fine gennaio a marzo, a seconda della zona e dell'anno, e il picco anticipa nel sud e nelle isole. Maiorca, l'Axarquía di Málaga, Tenerife e la zona di Cartagena sono mete conosciute, e in vari luoghi ci sono percorsi segnalati e feste dedicate, come quella del mandorlo in fiore a Tenerife."
    - "Poiché i fiori durano poco e dipendono dal tempo, conviene controllare lo stato della fioritura qualche giorno prima. I mandorli sono colture con un proprietario: cammina su sentieri pubblici, non tagliare rami né raccogliere fiori e non entrare in proprietà recintate. Se sei allergico al polline, porta i farmaci, perché in questo periodo ce n'è molto."
  mapa:
    titulo: "Dove vedere i mandorli in fiore"
    centro: [37.5, -6.0]
    zoom: 5
    puntos:
      - { nombre: "Maiorca", lat: 39.65, lon: 2.95, desc: "Il Pla de Mallorca e i pendii dell'interno si riempiono di mandorli bianchi e rosa." }
      - { nombre: "L'Axarquía (Málaga)", lat: 36.85, lon: -4.3, desc: "Comarca di Málaga con mandorli in fiore da fine gennaio." }
      - { nombre: "Campo de Cartagena (Murcia)", lat: 37.65, lon: -1.0, desc: "Fioritura precoce nel campo de Cartagena, con percorsi tra i mandorli." }
      - { nombre: "Tenerife", lat: 28.3, lon: -16.8, desc: "Mandorli in fiore nell'ovest dell'isola, con la festa del mandorlo in fiore." }
  faq:
    - p: "Quando fioriscono i mandorli?"
      r: "Tra fine gennaio e marzo, a seconda della zona e dell'anno. Nel sud e alle Baleari e alle Canarie di solito anticipa."
    - p: "Dove vedere i mandorli in fiore?"
      r: "Maiorca, l'Axarquía (Málaga), Tenerife, la zona di Cartagena e altre aree di coltivazione del sud e dell'est della penisola sono mete abituali."
    - p: "Si possono raccogliere fiori o mandorle?"
      r: "No. Sono coltivazioni private, anche se sembrano campagna aperta. Goditeli dai sentieri e rispetta le proprietà."
    - p: "Quanto dura la fioritura?"
      r: "Molto poco, tra una e due settimane per zona, e può accorciarsi con vento o pioggia. Controlla lo stato della fioritura prima di partire."
    - p: "Cosa bisogna portare?"
      r: "Scarpe da passeggio, vestiti caldi a strati, macchina fotografica e, se hai allergie, antistaminici. È un buon programma per fare foto all'alba o al tramonto."
    - p: "È un buon programma con i bambini?"
      r: "Sì, le passeggiate brevi tra i mandorli sono adatte alle famiglie, ed è un buon momento per mostrare come cambiano le colture con le stagioni."
lavanda-brihuega:
  texto:
    - "All'inizio di luglio, i campi di lavanda di Brihuega, in provincia di Guadalajara, si tingono di viola. È uno dei paesaggi estivi più fotogenici della Spagna e, a differenza della Provenza francese, ci si arriva in un paio d'ore da Madrid."
    - "La fioritura va di solito da fine giugno a metà luglio, con il picco nella prima quindicina di luglio, anche se dipende dall'anno. In quelle settimane si celebra il Festival della Lavanda, con attività, mercato e musica a Brihuega, ed è il momento di maggiore affluenza."
    - "Per goderti il posto senza ressa, vai la mattina presto o al tramonto, quando il caldo è minore e la luce è più bella. I campi di lavanda sono colture con un proprietario: rispetta i confini e le zone attrezzate per foto e passeggiate, che a volte sono a pagamento. Porta cappello, protezione solare e acqua, e tieni presente che ci sono molte api."
  mapa:
    titulo: "Dove si trovano i campi di lavanda"
    centro: [40.76, -2.87]
    zoom: 11
    puntos:
      - { nombre: "Brihuega (Guadalajara)", lat: 40.7625, lon: -2.8728, desc: "I campi di lavanda circondano il paese; il Festival della Lavanda vi si celebra durante la fioritura." }
  faq:
    - p: "Quando fiorisce la lavanda a Brihuega?"
      r: "Da fine giugno a metà luglio, con il massimo nella prima quindicina di luglio. Varia ogni anno a seconda del clima."
    - p: "Dove sono i campi di lavanda?"
      r: "Nei dintorni di Brihuega (Guadalajara), con accessi segnalati dal paese. Ci sono zone per passeggiare e punti panoramici."
    - p: "Qual è l'ora migliore per andare?"
      r: "La mattina presto o al tramonto, quando fa meno caldo, c'è meno gente e la luce è più bella."
    - p: "Bisogna pagare?"
      r: "Alcune zone attrezzate per passeggiate e foto chiedono un piccolo biglietto d'ingresso. Informati sulle condizioni prima di andare e non entrare in campi non autorizzati."
    - p: "Cosa bisogna portare?"
      r: "Cappello, protezione solare, acqua e scarpe comode. Ci sono molte api, quindi è meglio non disturbarle."
    - p: "È un buon programma con i bambini?"
      r: "Sì, ma con caldo e api, quindi tieni d'occhio i più piccoli, evita le ore centrali e porta acqua."
halloween-difuntos:
  texto:
    - "Il 31 ottobre e il 1° novembre in Spagna convivono due tradizioni molto diverse: Halloween, con costumi, percorsi dell'orrore e feste per bambini, e Ognissanti, un giorno di ricordo dei defunti, con visite al cimitero e dolci tipici."
    - "Halloween ha sempre più presenza, soprattutto tra i giovani e i bambini, con feste a tema, case degli orrori e parchi di divertimento decorati. Il 1° novembre, invece, è festivo e tradizionale: si visitano i cimiteri con i fiori, si mangiano huesos de santo e buñuelos de viento e, in Catalogna, panellets e castagne durante la castañada."
    - "In molti teatri in questi giorni si rappresenta Don Juan Tenorio, di Zorrilla, una tradizione dell'1 e del 2 novembre. Consulta il cartellone e i programmi del comune e, se vai con i bambini, scegli feste adatte a loro e celebra anche la parte tradizionale."
  faq:
    - p: "Che cosa si celebra il 1° novembre?"
      r: "Il Giorno di Ognissanti, festivo in tutta la Spagna, in cui si ricordano i defunti e si visitano i cimiteri con i fiori."
    - p: "Quali dolci si mangiano?"
      r: "Huesos de santo, buñuelos de viento e, in Catalogna, panellets e castagne durante la castañada."
    - p: "Che cos'è la castañada?"
      r: "Una festa tradizionale catalana di Ognissanti in cui si mangiano castagne, panellets e patate dolci."
    - p: "Cosa fare a Halloween?"
      r: "Feste in maschera, percorsi dell'orrore, case stregate e itinerari del mistero. Molti parchi di divertimento e comuni organizzano attività."
    - p: "Che cos'è Don Juan Tenorio?"
      r: "Un'opera teatrale di José Zorrilla che si rappresenta tradizionalmente in queste date in molti teatri."
    - p: "È un buon programma con i bambini?"
      r: "Sì, ci sono molte attività per bambini per Halloween. Se vai in un cimitero, conviene spiegare loro il senso tranquillo della visita."
