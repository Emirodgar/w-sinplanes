castanas-otono:
  imagen_alt: "Boden eines herbstlichen Kastanienhains, bedeckt mit goldenem Laub und Kastanienigeln"
  texto:
    - "Wenn der Oktober kommt, liegen in den Kastanienhainen im Norden und in der Mitte der Halbinsel überall Igel zwischen den Blättern. Kastanien sammeln gehört zu den einfachsten und dankbarsten Herbstplänen: ein gemütlicher Spaziergang durch den Wald, ein Korb, der sich langsam füllt, und zu Hause etwas Leckeres zum Rösten."
    - "Die Saison beginnt je nach Höhenlage und Jahr etwa Mitte Oktober und zieht sich bis weit in den November hinein. Die besten Kastanienhaine liegen meist in feuchten Berggebieten: El Bierzo (León), das Valle del Genal (Málaga), die Sierra de Francia (Salamanca), das Valle del Tiétar (Ávila) sowie ein großer Teil Galiciens und Asturiens."
    - "Am wichtigsten ist es zu wissen, wem der Kastanienhain gehört. Viele sind Privatgrundstücke, deren Besitzer sie pflegen und die Früchte verkaufen; ohne Erlaubnis dort zu sammeln, kann Folgen haben. Frag im Dorf, im Rathaus oder in einem Landhotel (casa rural) der Gegend nach: Meist sagt dir jemand, wo man sammeln darf, oder stellt den Kontakt zu einem Besitzer her."
    - "Nimm feste Schuhe mit gutem Halt, dicke Handschuhe (die Igel stechen wirklich), einen Korb oder Sack und Kleidung mit, die schmutzig werden darf. Reife Kastanien fallen von selbst: Üblich ist, nur die vom Boden aufzusammeln, ohne die Bäume abzuschlagen oder zu beschädigen. Die Tage nach Regen und Wind sind meist die ergiebigsten."
    - "Zu Hause ritzt du jede Kastanie in der Schale ein, bevor du sie röstest oder kochst, damit sie nicht platzen. Kühl oder im Kühlschrank halten sie sich besser, und du solltest sie innerhalb weniger Tage essen. Der natürliche Abschluss dieses Plans ist ein magosto: geröstete Kastanien, ein Feuer und neuer Wein."
  mapa:
    titulo: "Wohin zum Kastaniensammeln"
    centro: [40.0, -5.0]
    zoom: 6
    puntos:
      - { nombre: "El Bierzo (León)", lat: 42.55, lon: -6.6, desc: "Jahrhundertealte Kastanienhaine bei Las Médulas und in den umliegenden Tälern; Wiege des magosto." }
      - { nombre: "Valle del Genal (Málaga)", lat: 36.57, lon: -5.17, desc: "Serranía de Ronda: Igualeja, Pujerra, Genalguacil und Júzcar, mit Kastanienbäumen im ganzen Tal." }
      - { nombre: "Sierra de Francia (Salamanca)", lat: 40.485, lon: -6.108, desc: "Umgebung von La Alberca und Miranda del Castañar, mit Kastanienhainen an den Hängen." }
      - { nombre: "Valle del Tiétar (Ávila)", lat: 40.2, lon: -5.1, desc: "Arenas de San Pedro, Candeleda und Guisando, am Fuß der Sierra de Gredos." }
      - { nombre: "Sierra de Aracena (Huelva)", lat: 37.89, lon: -6.56, desc: "Die Kastanienhaine der Provinz Huelva bei Castaño del Robledo und Galaroza." }
  faq:
    - p: "Wann ist die Kastaniensaison?"
      r: "In Spanien ungefähr von Mitte Oktober bis Mitte November. In tieferen Lagen beginnt sie früher, in höheren verzögert sie sich um ein paar Tage. Wenn du den richtigen Zeitpunkt treffen willst, erkundige dich eine Woche vorher vor Ort: Die Ernte ändert sich von Jahr zu Jahr je nach Regen und Sommerhitze."
    - p: "Darf man in jedem Wald Kastanien sammeln?"
      r: "Nicht immer. Viele Kastanienhaine sind Privatbesitz, und in öffentlichen Wäldern kann jede Gemeinde ihre eigenen Regeln haben. Frag vor dem Sammeln im Rathaus oder bei den Anwohnern nach und betritt keine eingezäunten Grundstücke."
    - p: "Wohin zum Kastaniensammeln?"
      r: "Die klassischen Ziele sind El Bierzo (León), das Valle del Genal (Málaga), die Sierra de Francia (Salamanca) und das Valle del Tiétar (Ávila), außerdem Galicien, Asturien und die Gegend um Aracena. Überall gibt es sehr ausgedehnte Kastanienhaine und viel Tradition."
    - p: "Was muss man mitnehmen?"
      r: "Dicke Handschuhe, feste Schuhe, einen Korb oder Sack und warme Kleidung, die schmutzig werden darf. Die Igel öffnet man, indem man mit der Schuhsohle darauftritt, Werkzeug ist nicht nötig."
    - p: "Wie röstet man Kastanien?"
      r: "Ritz die Schale jeder Kastanie ein, röste sie in einer Lochpfanne, im Ofen oder auf einem Rost und lass sie 20 bis 30 Minuten, bis die Schale aufplatzt. Wickle sie danach ein paar Minuten in ein Tuch, damit sie im eigenen Dampf weitergaren und sich besser schälen lassen."
    - p: "Ist das ein guter Plan mit Kindern?"
      r: "Ja, aber mit Vorsicht: Die Igel stechen. Gib ihnen Handschuhe und bring ihnen bei, nicht blind hineinzugreifen. Für Kinder verbindet sich hier Spaziergang, Spiel und Belohnung."
    - p: "Was ist ein magosto?"
      r: "Das ist das traditionelle Herbstfest in Galicien, Asturien und El Bierzo: Man röstet Kastanien am Feuer und isst sie mit neuem Wein oder Apfelwein (Sidra), vor allem um den Martinstag, den 11. November."

setas:
  imagen_alt: "Hände pflücken einen Steinpilz im Wald, daneben ein Weidenkorb voller Pilze"
  texto:
    - "Mit den ersten Herbstregen füllen sich Kiefern-, Eichen- und Kastanienwälder mit Pilzen, und die Suche danach wird zu einem der meistersehnten Pläne des Jahres. Es ist die perfekte Ausrede, den Vormittag im Wald zu verbringen, mit oder ohne vollen Korb."
    - "Die Hauptsaison dauert von Oktober bis November, hängt aber stark von Regen und Temperaturen ab: Nach einigen feuchten Wochen ohne Frost geht es im Wald richtig los. Provinzen wie Soria, die Pyrenäen, León, Zamora, die Sierra de Gredos oder Katalonien sind Klassiker, und vielerorts gibt es pilzkundliche Routen und organisierte Pilztage."
    - "Informiere dich vor dem Aufbruch über die Vorschriften der Region. Mehrere autonome Gemeinschaften verlangen eine Sammelgenehmigung oder -erlaubnis (in Kastilien und León zum Beispiel funktioniert das System Micocyl), und es gibt Mengenbegrenzungen, Sperrgebiete und Zeitfenster. Die Regeln unterscheiden sich von Ort zu Ort, schau also auf der Website der Gemeinde oder der autonomen Gemeinschaft nach."
    - "Wenn du keine Erfahrung hast, gilt die goldene Regel: Iss keinen Pilz, den du nicht sicher bestimmt hast. Zum Einstieg ist es am vernünftigsten, an einer geführten Tour oder einem Pilztag mit einem Experten teilzunehmen und einen Feldführer dabeizuhaben. Sammle in einem Weidenkorb, durch den die Sporen herausfallen und in dem die Pilze atmen können, und schneide oder ziehe sie vorsichtig heraus, ohne den Boden zu verwüsten."
  mapa:
    titulo: "Wohin zum Pilzesammeln"
    centro: [41.2, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Pinares de Soria", lat: 41.95, lon: -2.75, desc: "Vinuesa, Covaleda und Duruelo de la Sierra, mit Micocyl als Genehmigungssystem." }
      - { nombre: "Pirineo (Valle de Arán)", lat: 42.7, lon: 0.8, desc: "Feuchte Tannen- und Buchenwälder in den Pyrenäen der Provinz Lleida." }
      - { nombre: "Montaña de León", lat: 42.95, lon: -5.1, desc: "Riaño, Babia und Luna, mit Eichenwäldern und Buchenwäldern." }
      - { nombre: "Sanabria (Zamora)", lat: 42.1, lon: -6.7, desc: "Kiefern- und Kastanienwälder rund um den See von Sanabria." }
      - { nombre: "Sierra de Gredos (Ávila)", lat: 40.3, lon: -5.2, desc: "Kiefern- und Eichenwälder im Valle del Tiétar und im Barranco." }
      - { nombre: "Solsonès (Cataluña)", lat: 42.0, lon: 1.5, desc: "Kiefern- und Mischwälder mit großer pilzkundlicher Tradition." }
  faq:
    - p: "Wann ist die Pilzsaison?"
      r: "In Spanien dauert die Hauptsaison von Oktober bis November, in manchen Gegenden reicht sie bis in den Dezember oder beginnt schon im September. Sie hängt von Regen, Höhenlage und Temperatur ab: Nach mehreren feuchten Wochen ohne Frost geht es im Wald los."
    - p: "Wo kann man Pilze suchen?"
      r: "Soria, die Pyrenäen, die Wälder von León und Zamora, die Sierra de Gredos oder Katalonien sind klassische Ziele. Am praktischsten ist es, im Tourismusbüro oder in einem Landhotel (casa rural) der Gegend nachzufragen, wo man die Routen und die geltenden Vorschriften meist kennt."
    - p: "Braucht man eine Genehmigung zum Pilzesammeln?"
      r: "In vielen Gegenden ja. Mehrere autonome Gemeinschaften verlangen eine Sammelgenehmigung oder -erlaubnis, und es kann Mengenbegrenzungen und Sperrgebiete geben. Informiere dich vor dem Aufbruch immer auf der Website der Gemeinde oder der autonomen Gemeinschaft."
    - p: "Woher weiß ich, ob ein Pilz essbar ist?"
      r: "Verlass dich nicht auf Volksweisheiten: Ein Pilz darf nur gegessen werden, wenn du ihn sicher bestimmt hast. Im Zweifel lass ihn stehen. Eine geführte Tour oder ein Pilztag ist der sicherste Weg zu lernen, und bei einer Vergiftung musst du in die Notaufnahme gehen oder den Notruf 112 wählen."
    - p: "Was muss man mitnehmen?"
      r: "Einen Weidenkorb, ein Taschenmesser, ein Bestimmungsbuch, Wanderschuhe, warme Kleidung, Wasser und etwas zu essen. Vermeide Plastiktüten, denn sie verderben die Pilze und lassen die Sporen nicht herausfallen."
    - p: "Ist das ein guter Plan mit Kindern?"
      r: "Ja, solange sie begleitet werden und wissen, dass nichts angefasst oder gegessen wird, ohne dass ein Erwachsener es geprüft hat. Die Kleinen haben viel Spaß an der Suche, aber wähle einfache Strecken und achte darauf, dass sie die Hände nicht in den Mund stecken."

hayedos:
  imagen_alt: "Weg voller Laub zwischen Buchen in Herbstfarben, im Hintergrund etwas Nebel"
  texto:
    - "Einige wenige Wochen im Herbst lang färben sich die Buchenwälder von Grün zu Gelb, Orange und Kupfer, und der Boden bedeckt sich mit Laub. Es ist eines der fotogensten Naturschauspiele Spaniens und ein perfekter Plan, um ohne Eile zwischen silbrigen Stämmen zu wandern."
    - "Die beste Zeit ist meist zwischen Mitte Oktober und Mitte November, auch wenn der Höhepunkt der Farben jedes Jahr je nach Kälte, Regen und Wind variiert. Zu den bekanntesten Buchenwäldern zählen die Selva de Irati (Navarra), der Hayedo de Montejo (Madrid), der Hayedo de la Tejera Negra (Guadalajara) und der von Otzarreta (Bizkaia), dazu die in Kantabrien, Asturien und den Pyrenäen."
    - "Vorsicht bei den Besucherkontingenten: Einige Buchenwälder, etwa der von Montejo, begrenzen die Besucherzahl oder verlangen eine Reservierung bzw. Zugangsgenehmigung, vor allem an den Wochenenden mit der intensivsten Färbung. Schau vorher auf der Website des Schutzgebiets nach, und wenn du kannst, komm unter der Woche: Es sind weniger Leute da und es ist ruhiger."
    - "Nimm bequeme Schuhe mit, die auf nassem Laub Halt geben, eine warme Schicht und eine Regenjacke, denn im Buchenwald ist es meist feucht, und bleib auf den markierten Wegen. Morgens mit etwas Nebel und im tiefen Licht des Spätnachmittags lässt es sich am besten fotografieren."
  mapa:
    titulo: "Wo man im Herbst einen Buchenwald sieht"
    centro: [42.0, -2.5]
    zoom: 7
    puntos:
      - { nombre: "Selva de Irati (Navarra)", lat: 42.98, lon: -1.1, desc: "Einer der größten Buchen-Tannen-Wälder Europas, zwischen Ochagavía und Orbaizeta." }
      - { nombre: "Hayedo de Montejo (Madrid)", lat: 41.12, lon: -3.5, desc: "Der südlichste Buchenwald Europas; Zugang nur mit Kontingent und Reservierung." }
      - { nombre: "Hayedo de la Tejera Negra (Guadalajara)", lat: 41.15, lon: -3.15, desc: "In der Sierra de Ayllón, bei Cantalojas, mit markierten Routen." }
      - { nombre: "Hayedo de Otzarreta (Bizkaia)", lat: 43.03, lon: -2.78, desc: "Im Naturpark Gorbeia, einer der meistfotografierten." }
      - { nombre: "Saja-Besaya (Cantabria)", lat: 43.1, lon: -4.2, desc: "Ausgedehnte Buchenwälder im Naturpark, mit guten Herbstrouten." }
      - { nombre: "Redes (Asturias)", lat: 43.17, lon: -5.3, desc: "Buchenwälder im Gebirge des Naturparks Redes." }
      - { nombre: "Selva de Oza (Huesca)", lat: 42.85, lon: -0.75, desc: "Buchen- und Tannenwälder der aragonesischen Pyrenäen, im Tal von Hecho." }
  faq:
    - p: "Wann ist die beste Zeit, im Herbst einen Buchenwald zu sehen?"
      r: "Zwischen Mitte Oktober und Mitte November, wobei der Farbhöhepunkt meist etwa zwei bis drei Wochen dauert. Er ändert sich jedes Jahr mit Kälte und Regen, daher lohnt ein Blick auf den Bericht des Schutzgebiets oder die Social-Media-Kanäle der Besucherzentren."
    - p: "Welche sind die besten Buchenwälder Spaniens?"
      r: "Die Selva de Irati (Navarra), der Hayedo de Montejo (Madrid), der Hayedo de la Tejera Negra (Guadalajara) und der von Otzarreta (Bizkaia) sind die bekanntesten. Auch die in Kantabrien, Asturien und den Pyrenäen sind sehenswert."
    - p: "Muss man reservieren oder eine Genehmigung einholen?"
      r: "Bei manchen ja. Der Hayedo de Montejo zum Beispiel begrenzt die Besuche und verlangt eine Genehmigung, und in anderen Gebieten gibt es Kontingente oder Parkplätze, die sich an den Wochenenden mit der intensivsten Färbung füllen. Schau vor dem Besuch auf der Website des Schutzgebiets nach."
    - p: "Kann man mit Kindern oder Hund hin?"
      r: "Kurze, markierte Strecken sind für Kinder geeignet. Mit Hund hängt es vom jeweiligen Gebiet ab: In manchen sind Hunde verboten oder müssen angeleint sein, prüfe das also vorher."
    - p: "Welche Kleidung und Schuhe soll ich mitnehmen?"
      r: "Bequeme Schuhe, die auf nassem Laub Halt geben, warme Kleidung im Zwiebellook und eine Regenjacke, denn im Wald werden Feuchtigkeit und Kälte schnell spürbar."
    - p: "Wie vermeidet man Menschenmassen?"
      r: "Komm unter der Woche, frühmorgens oder am späten Nachmittag und meide Brückentage und die Wochenenden mit der intensivsten Färbung. Eine Alternative sind weniger bekannte Buchenwälder in derselben Gegend."

berrea:
  texto:
    - "Ende des Sommers beginnen die Hirschbullen zu röhren, um die Weibchen anzulocken und ihre Rivalen herauszufordern. Dieses tiefe, kraftvolle Röhren, das im Morgengrauen und in der Abenddämmerung durch den Wald hallt, ist die berrea, eines der eindrucksvollsten Tierschauspiele Spaniens."
    - "Die Hirschbrunft (berrea) konzentriert sich auf September und Oktober, mit dem Höhepunkt meist Ende September und Anfang Oktober, je nach Gebiet und Jahr. Die bekanntesten Orte sind der Nationalpark Cabañeros, der Nationalpark Monfragüe, die Sierra de Andújar, das Nationale Reservat Riaño und die Sierra de la Culebra, unter anderen."
    - "Am besten kommst du vor Sonnenaufgang oder eine Weile vor Einbruch der Dunkelheit, wenn die Hirsche am aktivsten sind, und lauschst still von einem Beobachtungspunkt aus. Nimm ein Fernglas, warme Kleidung in unauffälligen Farben mit und verzichte auf Taschenlampen und Blitz. Brunftige Hirsche sind unberechenbar: Halte immer Abstand und nähere dich ihnen nicht."
    - "In manchen Gebieten gibt es während der Brunft geführte Routen, Beobachtungshütten oder geregelten Zugang, und es empfiehlt sich, rechtzeitig zu reservieren. Schau vorher auf der Website des Schutzgebiets oder des Besucherzentrums nach."
  mapa:
    titulo: "Wo man die Hirschbrunft hören kann"
    centro: [40.0, -5.0]
    zoom: 6
    puntos:
      - { nombre: "Parque Nacional de Cabañeros (Ciudad Real)", lat: 39.4, lon: -4.5, desc: "Weideflächen (rañas) und mediterraner Wald mit großen Hirschbeständen; geführte Touren während der Brunft." }
      - { nombre: "Parque Nacional de Monfragüe (Cáceres)", lat: 39.83, lon: -6.05, desc: "Dehesa und Felsen mit mehreren Aussichtspunkten, um im Morgengrauen zu lauschen." }
      - { nombre: "Sierra de Andújar (Jaén)", lat: 38.25, lon: -4.0, desc: "Einer der besten Orte im Süden; sehr gut besucht, Reservierung empfohlen." }
      - { nombre: "Reserva Nacional de Riaño (León)", lat: 42.98, lon: -5.0, desc: "Brunft im Gebirge, zwischen Buchen- und Eichenwäldern der Picos de Europa in León." }
      - { nombre: "Sierra de la Culebra (Zamora)", lat: 41.85, lon: -6.2, desc: "Ausgedehntes Jagdreservat mit vielen Hirschen und ab und zu einem Wolf." }
  faq:
    - p: "Wann ist die Hirschbrunft?"
      r: "Zwischen September und Oktober. Die höchste Aktivität herrscht meist Ende September und Anfang Oktober, wobei sie je nach Gebiet und Jahr variiert. Am besten gehst du im Morgengrauen oder in der Abenddämmerung los."
    - p: "Wo kann man die Hirschbrunft erleben?"
      r: "Die bekanntesten Orte sind Cabañeros, Monfragüe, die Sierra de Andújar, das Nationale Reservat Riaño und die Sierra de la Culebra. In vielen gibt es geführte Routen, Beobachtungshütten oder markierte Lauschpunkte."
    - p: "Was muss man mitnehmen?"
      r: "Ein Fernglas, warme Kleidung in unauffälligen Farben (Grün, Braun, Grau), bequeme Schuhe und etwas zu essen und zu trinken. In den Stunden mit der meisten Aktivität ist es kühl, auch wenn der Tag heiß wird."
    - p: "Ist es gefährlich, sich den Hirschen zu nähern?"
      r: "Ja. Brunftige Hirsche sind sehr aggressiv und unberechenbar. Geh nicht näher heran, umkreise sie nicht, versperre ihnen nicht den Weg und halte den Abstand ein, den die Guides oder die Schilder vorgeben."
    - p: "Muss man reservieren?"
      r: "In manchen Gebieten ja, vor allem für geführte Routen, Beobachtungshütten oder geregelten Zugang mitten in der Brunft. Schau vor dem Besuch auf der Website des Schutzgebiets oder des Besucherzentrums nach, denn die Plätze sind schnell vergeben."
    - p: "Kann man mit Kindern hin?"
      r: "Ja, für Kinder ist es ein sehr schöner Plan, aber man muss leise sein, früh am Tag gehen und die Gruppe nicht verlassen. Wähle einfache Routen, am besten mit Guide."

vendimia:
  texto:
    - "Der September ist in einem großen Teil Spaniens der Monat der Weinlese (vendimia): Die reifen Trauben werden von Hand oder mit der Maschine geschnitten, und die Weingüter duften nach Most. Sie aus der Nähe zu erleben, zwischen Weinbergen und Kelterbottichen, ist einer der charmantesten Pläne zum Spätsommer und hat viel von einem Fest."
    - "Der genaue Zeitpunkt hängt von Gebiet, Rebsorte und Jahr ab. Weiße und frühe Sorten werden meist ab Ende August gelesen, späte Rotweinsorten können sich bis in den Oktober ziehen. Regionen wie La Rioja, Ribera del Duero, Jerez, Penedès, Rías Baixas oder La Mancha bieten Besichtigungen, Verkostungen und weitere Aktivitäten rund um die Lese an."
    - "Viele Weingüter bieten Erlebnisse an, bei denen du Trauben schneiden, Trauben treten oder zusehen kannst, wie die Ernte im Weingut ankommt, in der Regel nach vorheriger Reservierung und gegen Bezahlung. Außerdem gibt es Weinlesefeste wie die in Jerez oder die Fiestas de San Mateo in Logroño, mit Traubentreten, Opfergabe des ersten Mosts und Verkostungen."
    - "Wenn du ein Erlebnis im Weinberg buchst, nimm bequeme, geschlossene Schuhe, eine Mütze, Sonnenschutz und Kleidung mit, die schmutzig werden darf. Am besten gehst du früh am Morgen, wenn es weniger heiß ist und ruhiger gearbeitet wird."
  mapa:
    titulo: "Wo man die Weinlese erleben kann"
    centro: [40.0, -3.5]
    zoom: 6
    puntos:
      - { nombre: "La Rioja (Logroño)", lat: 42.4627, lon: -2.445, desc: "Rioja Alta und Rioja Baja, mit den Fiestas de San Mateo in Logroño und vielen Weingütern mit Besichtigung." }
      - { nombre: "Ribera del Duero (Burgos y Valladolid)", lat: 41.62, lon: -3.9, desc: "Rotweinberge entlang des Duero, mit Weingütern, die Besichtigungen anbieten." }
      - { nombre: "Rías Baixas (Pontevedra)", lat: 42.51, lon: -8.81, desc: "Albariño-Gebiet mit früher Lese und Weingütern rund um Cambados." }
      - { nombre: "Penedès (Barcelona)", lat: 41.3446, lon: 1.6988, desc: "Cava- und Weingebiet, mit Weingütern und Leseerlebnissen rund um Vilafranca." }
      - { nombre: "La Mancha (Ciudad Real)", lat: 39.0, lon: -3.2, desc: "Das größte Weinbaugebiet Spaniens, mit Weingütern und Weinlesefesten in den Dörfern." }
      - { nombre: "Jerez (Cádiz)", lat: 36.6864, lon: -6.1377, desc: "Hauptstadt des Sherrys (vino de jerez), mit ihrem Weinlesefest und historischen Bodegas." }
  faq:
    - p: "Wann ist die Weinlese in Spanien?"
      r: "Das hängt von Gebiet und Rebsorte ab, aber die Hauptzeit reicht von Ende August bis Oktober, mit dem September als zentralem Monat. Weiße und frühe Trauben werden vor den späten roten gelesen."
    - p: "Wo kann man die Weinlese erleben?"
      r: "Die klassischen Ziele sind La Rioja, Ribera del Duero, Jerez, Penedès, Rías Baixas und La Mancha. Viele Weingüter bieten in dieser Zeit Besichtigungen und Erlebnisse an."
    - p: "Kann man bei der Weinlese mitmachen?"
      r: "Ja, manche Weingüter bieten Erlebnisse an, bei denen du Trauben schneiden, Trauben treten oder die Anlieferung der Ernte miterleben kannst. Sie sind meist kostenpflichtig und erfordern eine vorherige Reservierung, informiere dich also rechtzeitig."
    - p: "Gibt es Weinlesefeste?"
      r: "Ja. Zu den bekanntesten zählen die Fiestas de la Vendimia in Jerez sowie die Fiestas de San Mateo und das Weinlesefest der Rioja in Logroño, mit Traubentreten, Mostopfergabe und Verkostungen."
    - p: "Was muss man mitnehmen?"
      r: "Bequeme, geschlossene Schuhe, eine Mütze, Sonnenschutz und Kleidung, die schmutzig werden darf. Am besten gehst du früh am Morgen, wenn es weniger heiß ist."
    - p: "Ist das ein guter Plan mit Kindern?"
      r: "Im Allgemeinen ja. Viele Weingüter bieten Familienaktivitäten an, mit symbolischem Traubentreten und alkoholfreiem Most. Frag bei der Reservierung nach, ob Kinder zugelassen sind."
mercadillos-navidad:
  texto:
    - "Weihnachtsmärkte füllen die Plätze vieler Städte mit Buden, Lichtern und dem Duft von Süßem. Sie sind ein perfekter Plan, um zu bummeln, Kunsthandwerk und Christbaumschmuck zu kaufen und sich langsam auf die Weihnachtszeit einzustimmen."
    - "Einige sind Klassiker: der Markt an der Plaza Mayor in Madrid, die Fira de Santa Llúcia in Barcelona neben der Kathedrale oder der Markt von Santo Tomás in Bilbao, der am 21. Dezember stattfindet. Viele weitere Städte veranstalten ihren eigenen, mit Buden für Kunsthandwerk, Süßigkeiten und Krippen sowie Shows für Kinder."
    - "Meist öffnen sie ab Ende November und bleiben bis Heiligabend oder bis zum Dreikönigstag geöffnet. Am angenehmsten ist es, unter der Woche oder am frühen Nachmittag zu gehen, wenn weniger los ist, und Bargeld mitzunehmen, denn nicht alle Buden akzeptieren Karten. Zieh dich warm an: Du bist viel an der frischen Luft."
  faq:
    - p: "Wann öffnen die Weihnachtsmärkte?"
      r: "Die meisten öffnen Ende November oder Anfang Dezember und schließen an Heiligabend, einige bleiben aber bis zum Dreikönigstag geöffnet. Informiere dich über die Termine der jeweiligen Stadt."
    - p: "Welche sind die bekanntesten?"
      r: "Der Markt an der Plaza Mayor in Madrid, die Fira de Santa Llúcia in Barcelona und der Markt von Santo Tomás in Bilbao gehören zu den traditionellsten, auch wenn fast jede Stadt ihren eigenen hat."
    - p: "Muss man Eintritt zahlen?"
      r: "Nein. Der Eintritt ist frei, und du zahlst nur für das, was du kaufst, oder für einzelne Attraktionen wie Eisbahnen oder Shows."
    - p: "Was kann man kaufen?"
      r: "Krippen und Figuren, Schmuck, Kerzen, Kunsthandwerk, weihnachtliche Süßigkeiten, Turrón und Spielzeug, je nach Markt."
    - p: "Wann geht man am besten hin?"
      r: "Unter der Woche und am frühen Nachmittag, um das Gedränge zu vermeiden. An Wochenenden und langen Wochenenden ist es sehr voll."
    - p: "Ist das ein guter Plan mit Kindern?"
      r: "Ja, viele haben Spielzeugbuden, Shows und Besuche vom Weihnachtsmann oder den Heiligen Drei Königen. Pass bei Gedränge auf und lass die Kleinen nicht aus den Augen."
luces-navidad:
  texto:
    - "Jedes Jahr wetteifern die spanischen Städte um die spektakulärste Weihnachtsbeleuchtung. Mit Lichtern überzogene Straßen, große Bäume, Licht- und Musikshows und viele Menschen, die flanieren, machen das Anschauen der Lichter zu einem ganz einfachen und sehr weihnachtlichen Plan."
    - "Vigo ist für seinen Aufwand berühmt geworden, doch auch Madrid, Málaga, Valencia und Barcelona veranstalten viel besuchte Beleuchtungen. Das Einschalten findet meist Ende November oder Anfang Dezember mit einer öffentlichen Veranstaltung statt, und die Lichter bleiben bis zum Dreikönigstag an."
    - "Am bequemsten ist es, zu Fuß oder mit den öffentlichen Verkehrsmitteln zu kommen, denn die Zentren füllen sich mit Menschen und Straßen werden für den Verkehr gesperrt, vor allem an Wochenenden und am Tag des Einschaltens. Willst du Menschenmassen meiden, geh unter der Woche am frühen Abend. Zieh dich warm an und trag bequeme Schuhe, denn man läuft viel."
  faq:
    - p: "Wann werden die Weihnachtslichter eingeschaltet?"
      r: "Normalerweise Ende November oder Anfang Dezember, mit einer öffentlichen Veranstaltung. Jede Stadt hat ihren eigenen Termin, der Wochen vorher bekannt gegeben wird."
    - p: "Bis wann sind sie an?"
      r: "In der Regel bis zum Dreikönigstag am 6. Januar, in manchen Städten bleiben sie ein paar Tage länger an."
    - p: "Welche Städte haben die schönsten Lichter?"
      r: "Vigo, Madrid, Málaga, Valencia und Barcelona gehören meist zu den meistbesuchten, aber auch viele mittelgroße Städte haben sehr liebevolle Beleuchtungen."
    - p: "Wann geht man am besten hin?"
      r: "Unter der Woche und am frühen Abend. An Wochenenden, langen Wochenenden und am Tag des Einschaltens ist viel Gedränge."
    - p: "Wie komme ich herum?"
      r: "Zu Fuß oder mit den öffentlichen Verkehrsmitteln. In den meistbesuchten Zonen werden Straßen gesperrt, und Parken ist schwierig."
    - p: "Ist das ein guter Plan mit Kindern?"
      r: "Ja, für sie ist es sehr reizvoll. Pass bei Gedränge auf und vereinbart einen Treffpunkt für den Fall, dass ihr euch verliert."
cabalgata-reyes:
  texto:
    - "Die Cabalgata de Reyes, der Umzug der Heiligen Drei Könige, ist eines der großen Familienerlebnisse der Weihnachtszeit: Am Nachmittag des 5. Januar ziehen die Heiligen Drei Könige mit Festwagen, Musik und einem Bonbonregen durch die Straßen fast aller Städte und Dörfer Spaniens, bevor sie in der Nacht die Geschenke bringen."
    - "Die bekanntesten sind die in Madrid, in Barcelona, wo die Könige über den Hafen ankommen, in Sevilla, mit einer der ältesten Spaniens, oder in Valencia, doch jeder Ort veranstaltet seinen eigenen. Die Festwagen starten meist bei Einbruch der Dämmerung, und Route und Uhrzeit werden wenige Tage vorher auf der Website oder in den sozialen Netzwerken der Stadtverwaltung veröffentlicht."
    - "Komm rechtzeitig und such dir einen guten Platz: Die Gehwege füllen sich ein bis zwei Stunden vorher. Nimm eine große Tüte für die Bonbons, warme Kleidung und Geduld mit und behalte die Kinder im Auge, während die Bonbons fliegen. Bei Regen informiere dich, ob der Umzug stattfindet oder abgesagt wird."
  faq:
    - p: "Wann ist die Cabalgata de Reyes?"
      r: "Am Nachmittag des 5. Januar, wobei Uhrzeit und Route in jedem Ort anders sind."
    - p: "Wo kann man den Umzug sehen?"
      r: "In fast allen Städten und Dörfern. Die in Madrid, Barcelona, Sevilla und Valencia gehören zu den größten, aber jede Stadtverwaltung veröffentlicht die Route."
    - p: "Ist das kostenlos?"
      r: "Ja, den Umzug von der Straße aus anzusehen ist kostenlos."
    - p: "Wann sollte man kommen, um einen Platz zu bekommen?"
      r: "In großen Städten ein bis zwei Stunden vorher, in kleinen Dörfern etwas weniger."
    - p: "Was muss man mitnehmen?"
      r: "Warme Kleidung, eine Tüte für die Bonbons und Geduld. In Bereichen mit viel Andrang einen Treffpunkt für den Fall, dass ihr euch verliert."
    - p: "Was passiert bei Regen?"
      r: "Das hängt von der Stadt ab. Manche Umzüge finden trotzdem statt, andere werden verschoben oder verkürzt. Schau auf der Website oder in den sozialen Netzwerken der Stadtverwaltung nach."
loteria-navidad:
  texto:
    - "Die Ziehung der Weihnachtslotterie am 22. Dezember ist einer der meistverfolgten Bräuche der Weihnachtszeit in Spanien. Die Kinder von San Ildefonso singen die Zahlen und die Gewinne mit ihrer unverwechselbaren Melodie, die im Radio und Fernsehen im ganzen Land zu hören ist."
    - "Die Ziehung findet seit Jahren im Teatro Real in Madrid statt und dauert ab den frühen Morgenstunden mehrere Stunden. Der berühmteste Preis ist El Gordo, doch es gibt viele Gewinne, und man spielt in der Familie, mit Freunden oder am Arbeitsplatz, oft mit einer gemeinsamen Nummer."
    - "Du kannst sie im Fernsehen oder im Radio verfolgen oder die Ergebnisse auf der offiziellen Website der Lotterie (Loterías) nachsehen. Der Zugang zum Teatro Real ist begrenzt, deshalb schaut man meist von zu Hause aus zu. Wenn du gespielt hast, bewahre den Los-Anteil (décimo) gut auf und prüfe die Fristen zum Einlösen der Gewinne."
  faq:
    - p: "Wann ist die Weihnachtsziehung?"
      r: "Am 22. Dezember, ab den frühen Morgenstunden. Sie dauert mehrere Stunden."
    - p: "Wo findet sie statt?"
      r: "Im Teatro Real in Madrid. Der Zugang für das Publikum ist begrenzt."
    - p: "Wer singt die Zahlen?"
      r: "Die Kinder des Colegio de San Ildefonso, die sie zusammen mit den Gewinnen singen."
    - p: "Wie kann man sie verfolgen?"
      r: "Im Fernsehen, im Radio oder im Internet. Du kannst die Ergebnisse auch auf der offiziellen Website der Lotterie (Loterías) prüfen."
    - p: "Wann muss man den Gewinn einlösen?"
      r: "Für das Einlösen der Gewinne gibt es eine Frist. Informiere dich über Bedingungen und Fristen auf der offiziellen Website der Lotterie (Loterías)."
    - p: "Ist das ein guter Plan mit Kindern?"
      r: "Ja, vielen gefällt es, die Zahlen singen zu hören, und die Stimmung am Vormittag."
campanadas:
  texto:
    - "Die Campanadas de Nochevieja, die Glockenschläge an Silvester, läuten in Spanien den Jahreswechsel mit einer einzigartigen Tradition ein: zwölf Trauben essen, eine zu jedem Glockenschlag, um das neue Jahr mit Glück zu begrüßen. Sie werden live von der Uhr an der Puerta del Sol in Madrid übertragen und fast in allen Haushalten verfolgt."
    - "Viele sehen sie im Fernsehen, zu Hause oder mit Freunden und Familie, andere gehen lieber auf einen Platz. An der Puerta del Sol ist der Zugang meist auf eine begrenzte Personenzahl beschränkt und mit Sicherheitskontrollen verbunden, informiere dich also über die Bedingungen und komm rechtzeitig. Andere Städte veranstalten eigene Feiern auf ihren Hauptplätzen."
    - "Für die Trauben ein paar praktische Tipps: Schäle sie und entferne die Kerne, bereite die zwölf Trauben vorher vor und fang mit den ersten Glockenschlägen an, nicht mit den Viertelstundenschlägen. Danach Anstoßen, Partyzubehör und Feiern bis in die Morgenstunden oder ab ins Bett, je nach Plan."
  faq:
    - p: "Wann sind die Campanadas?"
      r: "In der Nacht des 31. Dezember um 00:00 Uhr. Die zwölf Glockenschläge der Uhr markieren den Jahreswechsel."
    - p: "Warum isst man zwölf Trauben?"
      r: "Es ist eine Tradition, bei jedem Glockenschlag eine Traube zu essen, um das Jahr mit Glück zu begrüßen. Sie wird in ganz Spanien gepflegt."
    - p: "Kann ich zur Puerta del Sol gehen?"
      r: "Ja, aber der Zugang ist meist auf eine begrenzte Personenzahl beschränkt und mit Sicherheitskontrollen verbunden. Informiere dich über die Bedingungen der Stadtverwaltung von Madrid und komm rechtzeitig."
    - p: "Welche Sender übertragen sie?"
      r: "Mehrere Fernsehsender übertragen die Campanadas live von der Puerta del Sol. Schau ins Programm."
    - p: "Wie bereitet man die Trauben vor?"
      r: "Schäle die Trauben und entferne die Kerne, halte zwölf bereit und fang mit den Glockenschlägen an, nicht mit den Viertelstundenschlägen davor."
    - p: "Ist das ein guter Plan mit Kindern?"
      r: "Ja, zu Hause oder bei einer ruhigen Veranstaltung. Bei kleinen Kindern kann man die Trauben geschält, ohne Kerne oder in Stücke geschnitten vorbereiten, um Verschlucken zu vermeiden."

perseidas:
  texto:
    - "Die Perseiden, im Volksmund auch Laurentiustränen (Lágrimas de San Lorenzo) genannt, sind einer der am leichtesten und eindrucksvollsten zu beobachtenden Sternschnuppenschwärme in Spanien. Sie entstehen jedes Jahr, wenn die Erde durch die Staubspur des Kometen Swift-Tuttle fliegt."
    - "Die Aktivität dauert von Mitte Juli bis Ende August, das Maximum liegt meist zwischen dem 11. und 13. August. In einer klaren Nacht ohne Mond und mit dunklem Himmel können Dutzende Meteore pro Stunde zu sehen sein. Die Mondphase des jeweiligen Jahres spielt dabei eine große Rolle: Bei Vollmond sieht man deutlich weniger."
    - "Entscheidend ist, sich von der Lichtverschmutzung zu entfernen. Reservate und Ziele mit Starlight-Zertifizierung wie Monfragüe, die Sierra Sur de Jaén oder Gúdar-Javalambre sind eine hervorragende Wahl, und viele bieten geführte Beobachtungen an. Ein Teleskop oder Fernglas brauchst du nicht: Es genügt, sich hinzulegen und in den offenen Himmel zu schauen."
    - "Lass deine Augen etwa 20 bis 30 Minuten an die Dunkelheit gewöhnen und schau nicht aufs Handy. Nimm eine Decke oder Liege, warme Kleidung (auch wenn es tagsüber heiß ist) und etwas Warmes zu trinken mit. Die Stunden nach Mitternacht sind meist die besten."
  mapa:
    titulo: "Wo man die Perseiden sieht"
    centro: [39.5, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Monfragüe (Cáceres)", lat: 39.83, lon: -6.05, desc: "Nationalpark und Starlight-Reservat, mit geführten Himmelsbeobachtungen." }
      - { nombre: "Sierra Sur de Jaén", lat: 37.6, lon: -3.85, desc: "Starlight-Reservat mit sehr dunklem Himmel, rund um Alcalá la Real und Castillo de Locubín." }
      - { nombre: "Gúdar-Javalambre (Teruel)", lat: 40.2, lon: -0.7, desc: "Starlight-Reservat auf über 1.500 m Höhe, mit klarem Himmel und astrophysikalischem Observatorium." }
  faq:
    - p: "Wann sieht man die Perseiden?"
      r: "Die Aktivität reicht von Mitte Juli bis Ende August, mit dem Maximum um den 12. August, normalerweise zwischen dem 11. und 13. Die besten Stunden sind nach Mitternacht bis zum Morgengrauen."
    - p: "Wo sieht man sie in Spanien am besten?"
      r: "An jedem Ort mit dunklem, klarem Himmel. Ziele mit Starlight-Zertifizierung wie Monfragüe, die Sierra Sur de Jaén oder Gúdar-Javalambre bieten hervorragenden Himmel und geführte Beobachtungen."
    - p: "Braucht man ein Teleskop?"
      r: "Nein. Es sind sich schnell bewegende Meteore, die man mit bloßem Auge am besten sieht. Ferngläser und Teleskope verkleinern das Blickfeld und helfen nicht."
    - p: "In welche Richtung muss man schauen?"
      r: "Sie scheinen aus dem Sternbild Perseus im Nordosten zu kommen, aber die Meteore tauchen am ganzen Himmel auf. Am besten schaut man nach oben, ohne sich auf einen bestimmten Punkt zu fixieren."
    - p: "Spielt der Mond eine Rolle?"
      r: "Eine große. Bei Vollmond oder sehr hellem Mond sieht man viel weniger Meteore. Schau vor der Planung des Ausflugs am besten nach der Mondphase des jeweiligen Jahres."
    - p: "Was muss man mitnehmen?"
      r: "Eine Decke oder Liege, warme Kleidung, eine Taschenlampe mit Rotlicht (falls du eine brauchst), etwas Warmes zu trinken und Geduld. Vermeide weißes Licht, denn es beeinträchtigt das Nachtsehen."

cerezos-jerte:
  texto:
    - "Für einige Wochen im Frühling färbt sich das Valle del Jerte im Norden der Provinz Cáceres weiß, wenn Hunderttausende Kirschbäume blühen. Die Terrassen an den Hängen sehen aus wie verschneit, und die Garganta de los Infiernos sowie die Steindörfer des Tals runden das Schauspiel ab."
    - "Die Blüte kommt meist zwischen Ende März und Mitte April, doch der genaue Zeitpunkt ändert sich jedes Jahr je nach Winter und Temperaturen. Sie dauert nicht lange, pro Gebiet ein bis zwei Wochen, und verschiebt sich je nach Höhenlage nach vorn oder hinten. Informiere dich deshalb vor der Reise über den Stand der Blüte. In dieser Zeit findet das Kirschblütenfest (Fiesta del Cerezo en Flor) statt."
    - "Es ist ein sehr beliebter Plan, und an den Wochenenden der Hauptblüte werden Verkehr und Parkplatzsuche schwierig. Wenn du kannst, komm unter der Woche oder früh am Morgen, buche die Unterkunft rechtzeitig und hab Geduld auf den Straßen des Tals. Die Kirschbäume sind Nutzbäume mit Besitzern: Respektiere die Grundstücke, schneide keine Zweige ab und betritt keine abgesperrten Terrassen."
  mapa:
    titulo: "Wo man die Kirschblüte sieht"
    centro: [40.2, -5.77]
    zoom: 11
    puntos:
      - { nombre: "Garganta de los Infiernos", lat: 40.22, lon: -5.76, desc: "Naturreservat am Oberlauf des Tals, mit Wanderwegen und Badestellen am Fluss." }
      - { nombre: "Jerte", lat: 40.2147, lon: -5.7508, desc: "Steindorf am Eingang der Garganta, mit Besucherzentrum und Kirschbäumen auf den Terrassen." }
      - { nombre: "Navaconcejo", lat: 40.1747, lon: -5.7978, desc: "Dorf im Tal, von Kirschbäumen umgeben; gute Basis, um die Blüte zu sehen." }
      - { nombre: "Cabezuela del Valle", lat: 40.1697, lon: -5.7014, desc: "Kirschbäume an den Hängen und Steingassen, im mittleren Abschnitt des Tals." }
  faq:
    - p: "Wann blühen die Kirschbäume im Jerte?"
      r: "Normalerweise zwischen Ende März und Mitte April, in jedem Gebiet ein bis zwei Wochen lang. Der Zeitpunkt ändert sich jedes Jahr mit dem Wetter, schau also vor der Reise nach dem Stand der Blüte."
    - p: "Wo sieht man die Kirschblüte?"
      r: "Das Valle del Jerte (Cáceres) ist das bekannteste, mit Orten wie Cabezuela del Valle, Navaconcejo oder Jerte und Routen wie der durch die Garganta de los Infiernos."
    - p: "Darf man die Terrassen betreten?"
      r: "Es sind private Anbauflächen. Spaziere auf ausgeschilderten Wegen und Aussichtspunkten, betritt die Parzellen nicht und pflücke keine Blüten oder Zweige ab."
    - p: "Muss man die Unterkunft reservieren?"
      r: "Ja, rechtzeitig, denn an den Wochenenden der Hauptblüte ist alles ausgebucht. Die Nachbarorte in La Vera oder Plasencia sind eine Alternative."
    - p: "Wie vermeide ich Menschenmassen?"
      r: "Komm unter der Woche, früh am Morgen oder am späten Nachmittag und meide die Wochenenden mit der intensivsten Farbe. Am besten parkst du auf den dafür vorgesehenen Flächen und gehst zu Fuß."
    - p: "Ist das ein guter Plan mit Kindern?"
      r: "Ja, die leichten Routen durchs Tal sind für Familien geeignet. Wenn dein Kind eine Pollenallergie hat, nimm Medikamente mit, denn im Frühling ist die Blüte intensiv."

nieve:
  texto:
    - "In den Schnee zu fahren gehört zu den großen Winterplänen, sei es zum Skifahren, Spazieren, Rodeln oder einfach, um die weiße Bergwelt zu sehen. Spanien hat Skigebiete und verschneite Landschaften in der Sierra Nevada, den Pyrenäen, dem Kantabrischen Gebirge und dem Sistema Central."
    - "Die Saison geht von Dezember bis März, wobei der Schnee stark vom jeweiligen Winter abhängt. Informiere dich vor der Abfahrt über den Zustand der Pisten und Straßen: Es können Schneeketten oder Winterreifen nötig sein, und die Zufahrten zu den Skigebieten sind an Wochenenden und langen Wochenenden überlastet. Schau vor und während der Fahrt in die Verkehrsinformationen."
    - "Du musst nicht Ski fahren. Viele Skigebiete und Täler bieten Rodelbahnen, Schneeschuhrouten, Langlauf und Schneespaziergänge, und die Ausrüstung kann man leihen. Buche Skipass und Ausrüstung in den Hauptzeiten rechtzeitig. Nimm wasserdichte Kleidung im Zwiebellook, Sonnenbrille, Sonnencreme und Ersatzhandschuhe mit, denn Sonne und Schneereflexion täuschen."
  mapa:
    titulo: "Wohin in den Schnee"
    centro: [40.5, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Sierra Nevada (Granada)", lat: 37.09, lon: -3.4, desc: "Das südlichste Skigebiet Europas, mit Skipisten sowie Spazier- und Rodelbereichen." }
      - { nombre: "Aragonesische Pyrenäen (Formigal)", lat: 42.78, lon: -0.37, desc: "Großes Skigebiet der Pyrenäen, mit Langlauf und Schneeschuhrouten in der Nähe." }
      - { nombre: "Katalanische Pyrenäen (Baqueira Beret)", lat: 42.7, lon: 0.93, desc: "Eines der größten Skigebiete der Pyrenäen, im Valle de Arán." }
      - { nombre: "Kantabrisches Gebirge (San Isidro)", lat: 43.05, lon: -5.37, desc: "Skigebiet zwischen León und Asturien, mit der Hochgebirgslandschaft des Kantabrischen Gebirges." }
      - { nombre: "Sistema Central (Navacerrada)", lat: 40.79, lon: -4.01, desc: "Der Schnee, der Madrid am nächsten liegt, mit Pisten und Rodelbereichen; die Zufahrten sind an Wochenenden überlastet." }
  faq:
    - p: "Wann gibt es in Spanien Schnee?"
      r: "Normalerweise von Dezember bis März, wobei Januar und Februar die verlässlichsten Monate sind. Es hängt stark vom jeweiligen Winter und von der Höhenlage ab."
    - p: "Wohin geht man in den Schnee?"
      r: "Die Sierra Nevada (Granada), die Pyrenäen (Huesca, Lleida, Navarra), das Kantabrische Gebirge, das Sistema Central (Madrid, Segovia) oder das Iberische Randgebirge (Sistema Ibérico) bieten Skigebiete und Routen."
    - p: "Muss man Ski fahren können?"
      r: "Nein. Es gibt Rodeln, Schneeschuhrouten, Langlauf, Schneebereiche für Kinder und Spaziergänge. Wenn du Ski fahren möchtest, bieten viele Skischulen Anfängerkurse an."
    - p: "Brauche ich Schneeketten?"
      r: "Das hängt von der Straße und vom Tag ab. Schau in die Verkehrsinformationen und nimm Schneeketten oder Winterreifen mit. Manchmal ist die Mitführpflicht vorgeschrieben, und ohne sie wird die Straße gesperrt."
    - p: "Muss man reservieren?"
      r: "In den Hauptzeiten (lange Wochenenden, Weihnachten, Schneewochenenden) empfiehlt es sich, Skipass, Leihausrüstung und Unterkunft zu buchen. Online kaufen ist meist günstiger und schneller."
    - p: "Welche Kleidung soll man mitnehmen?"
      r: "Wasserdichte Kleidung im Zwiebellook, Handschuhe und Mütze, Sonnen- oder Skibrille, Sonnenschutz und Schuhe mit gutem Profil. Trockene Wechselkleidung für die Rückfahrt schadet nie."

festival-san-sebastian:
  texto:
    - "Das Filmfestival von San Sebastián, bekannt als Zinemaldia, ist eines der großen Filmfestivals Spaniens und Europas. Es findet im September in Donostia-San Sebastián statt, mit internationalen Premieren, Stars auf dem roten Teppich und öffentlichen Vorführungen."
    - "Das Programm umfasst die offizielle Wettbewerbssektion, in der um die Goldene Muschel (Concha de Oro) gekämpft wird, außerdem Nebenreihen, Retrospektiven und Ehrungen wie den Donostia-Preis für das Lebenswerk. Die Vorführungen verteilen sich auf mehrere Kinos und Orte der Stadt, darunter das Kursaal und das Teatro Victoria Eugenia, und ein großer Teil davon steht allen Zuschauern offen."
    - "Auf der offiziellen Website findest du Programm, Zeiten und den Kartenverkauf; die Tickets kommen meist nur wenige Tage vor den Vorstellungen in den Verkauf und sind schnell ausverkauft. Stell dich früh an, schau dir die Zeiten an, um Vorstellungen zu kombinieren, und nutze die Gelegenheit für einen Stadtspaziergang und ein paar Pintxos. Im September kann es regnen: Nimm einen Regenschirm mit."
  faq:
    - p: "Wann findet das Filmfestival von San Sebastián statt?"
      r: "Im September, etwa neun Tage lang. Die genauen Termine werden jedes Jahr bekannt gegeben."
    - p: "Kann jeder hingehen?"
      r: "Ja. Neben den Vorführungen für Fachleute und Presse gibt es viele öffentliche Vorführungen mit Eintrittskarte."
    - p: "Wo kaufe ich die Tickets?"
      r: "Über die offiziellen Kanäle des Festivals. Sie werden kurzfristig verkauft, und die beliebtesten Vorstellungen sind schnell ausverkauft."
    - p: "Was ist die Concha de Oro?"
      r: "Das ist der Hauptpreis des Festivals, der für den besten Film der offiziellen Sektion vergeben wird."
    - p: "Kann man die Stars sehen?"
      r: "Auf dem roten Teppich vor dem Teatro Victoria Eugenia ist meist Publikum. Schau dir die Zeiten an und komm früh."
    - p: "Was kann man in San Sebastián sonst noch machen?"
      r: "An der Bucht La Concha spazieren, in der Altstadt (Parte Vieja) Pintxos probieren und den Monte Igueldo besuchen."

semana-santa-sevilla:
  texto:
    - "Die Karwoche (Semana Santa) von Sevilla ist wahrscheinlich die berühmteste Spaniens. Acht Tage lang ziehen rund sechzig Bruderschaften (hermandades) mit ihren Christus- und Marienfiguren auf Prozessionsbühnen (pasos) durch die Stadt, begleitet von Büßern (nazarenos), Musikkapellen und Tausenden Menschen auf den Straßen."
    - "Alle Bruderschaften ziehen durch die Carrera Oficial, die von der Campana bis zur Kathedrale reicht. Die Nacht zwischen Gründonnerstag und Karfreitag ist die Madrugá, die gefühlvollste und am stärksten besuchte, mit Bruderschaften wie El Silencio, Gran Poder, La Macarena, Los Gitanos und La Esperanza de Triana."
    - "Es ist ein Massenfest: Die Straßen im Zentrum füllen sich, und die Umzüge brauchen Stunden, um vorbeizuziehen. Lade das offizielle Programm herunter, such dir die Bruderschaften aus, die du sehen möchtest, und komm rechtzeitig. Buche die Unterkunft Monate im Voraus, nutze öffentliche Verkehrsmittel und sei geduldig bei Straßensperrungen. Und denk daran: Es ist eine religiöse Handlung, also respektiere die Stille und die Büßer."
  faq:
    - p: "Wann ist die Karwoche in Sevilla?"
      r: "Vom Palmsonntag bis zum Ostersonntag, der sich jedes Jahr zwischen März und April verschiebt. Schau im offiziellen Kalender nach den genauen Terminen."
    - p: "Was ist die Madrugá?"
      r: "Das ist die Nacht zwischen Gründonnerstag und Karfreitag. In diesen Stunden ziehen mehrere der bekanntesten Bruderschaften aus, und es ist der Moment mit dem größten Andrang und den stärksten Gefühlen."
    - p: "Wo sieht man die Prozessionen?"
      r: "In der Carrera Oficial (von der Campana bis zur Kathedrale) ist viel los, aber es sind auch sehr viele Menschen da. In anderen Teilen des Zentrums oder in Vierteln wie Triana kann man sie in größerer Ruhe sehen."
    - p: "Muss man reservieren?"
      r: "Nicht, um die Prozessionen von der Straße aus zu sehen, aber sehr wohl Unterkunft und Restaurants, die Monate im Voraus ausgebucht sind."
    - p: "Wie finde ich die Zeiten?"
      r: "Der Consejo de Hermandades y Cofradías veröffentlicht das offizielle Programm mit den Routen und Zeiten jeder Bruderschaft. Außerdem gibt es Apps und Websites mit Echtzeitverfolgung."
    - p: "Was sollte man mitnehmen oder beachten?"
      r: "Bequeme Schuhe, Kleidung im Zwiebellook und Geduld. Respektiere die Stille, quere die Umzüge nicht und vermeide Blitzlicht in der Nähe der Prozessionsbühnen."

fallas:
  texto:
    - "Las Fallas sind das Fest von Valencia zu Ehren des heiligen Josef, vom 15. bis 19. März. Sie gehören zum immateriellen Kulturerbe der Menschheit der UNESCO und verbinden Monumente aus Pappe und Holz, Pyrotechnik, Musik, Schießpulver und jede Menge Leben auf der Straße."
    - "Die Fallas sind riesige satirische Monumente, die am 15. auf den Straßen aufgestellt werden. Man kann sie zu Fuß abgehen, und die wichtigsten treten um Preise an. Jeden Tag um 14:00 Uhr ist die Mascletà, eine Symphonie aus Schießpulver auf der Plaza del Ayuntamiento, ein absolutes Muss. Am 17. und 18. findet die Blumenopfergabe (Ofrenda de Flores) an die Virgen de los Desamparados statt."
    - "Das Finale kommt in der Nacht zum 19. März mit der Cremà: Die Fallas gehen in Flammen auf, zuerst die Kinder-Fallas und zum Schluss um Mitternacht die große. Buche die Unterkunft Monate im Voraus, nutze öffentliche Verkehrsmittel und komm rechtzeitig, um bei der Mascletà einen Platz zu ergattern. Pass auf die Knallkörper auf der Straße und auf kleine Kinder auf."
  faq:
    - p: "Wann sind die Fallas?"
      r: "Jedes Jahr vom 15. bis 19. März. Die Plantà ist am 15. und die Cremà in der Nacht zum 19."
    - p: "Was ist die Mascletà?"
      r: "Das ist ein Schießpulverspektakel, bei dem es mehr um Klang und Wucht geht als um Farben. Es wird jeden Tag um 14:00 Uhr auf der Plaza del Ayuntamiento gezündet, und man spürt es im ganzen Körper."
    - p: "Was ist die Cremà?"
      r: "Das ist das Verbrennen der Fallas in der Nacht zum 19. März, mit dem Verbrennen der städtischen Falla um Mitternacht als Höhepunkt."
    - p: "Wie komme ich während der Fallas in Valencia herum?"
      r: "Zu Fuß und mit öffentlichen Verkehrsmitteln. Es gibt Straßensperrungen, und Parkplätze zu finden ist fast unmöglich. Die Metro fährt mit verstärktem Angebot."
    - p: "Was isst man?"
      r: "Kürbis-Buñuelos mit Schokolade, Paella und Bocadillos von der Straße. Die Buñuelos sind der typische Geschmack dieser Tage."
    - p: "Ist es ein guter Plan mit Kindern?"
      r: "Ja, es gibt Kinder-Fallas und Aktivitäten, aber der Lärm der Knallkörper und das Gedränge können die Kleinen überfordern."

semana-santa:
  texto:
    - "Die Karwoche (Semana Santa) ist die Woche vor dem Ostersonntag, vom Palmsonntag bis zum Ostersonntag, und eines der tiefgründigsten und meistbesuchten Feste Spaniens. Bruderschaften (cofradías und hermandades) tragen ihre Prozessionsbühnen (pasos) und Heiligenfiguren in Prozessionen auf die Straße, die Glauben, Kunst, Musik und Tradition verbinden."
    - "Jede Stadt hat ihren eigenen Stil. In Sevilla und Málaga stechen die großen Tronos und Baldachine hervor, in Valladolid, Zamora oder Salamanca sind die Prozessionen nüchterner und von kastilischer Bildhauerkunst geprägt, und an Orten wie Cuenca oder Murcia gibt es ganz eigene Bräuche. Viele sind Feste von internationalem touristischem Interesse."
    - "Da die Termine vom Osterfest abhängen, ändern sie sich jedes Jahr, zwischen März und April. Wenn du reisen möchtest, buche die Unterkunft lange im Voraus und sieh dir die offiziellen Routen und Zeiten jeder Bruderschaft an, die Wochen vorher veröffentlicht werden. Die Prozessionen sind religiöse Handlungen: Respektiere die Stille, quere die Umzüge nicht und vermeide Blitzlicht, wenn die Prozessionsbühnen vorbeiziehen."
  faq:
    - p: "Wann ist die Karwoche?"
      r: "Es ist die Woche vor dem Ostersonntag, der jedes Jahr auf ein anderes Datum zwischen Ende März und Ende April fällt. Sie geht vom Palmsonntag bis zum Ostersonntag."
    - p: "Wo kann man die besten Prozessionen sehen?"
      r: "Sevilla, Málaga, Valladolid, Zamora, Salamanca, Cuenca, Murcia und Cartagena gehören zu den bekanntesten, jede mit einem ganz eigenen Stil. Viele sind Feste von internationalem touristischem Interesse."
    - p: "Muss man bezahlen, um die Prozessionen zu sehen?"
      r: "Nein. Man sieht sie kostenlos von der Straße aus. In einigen Städten gibt es kostenpflichtige Sitzplätze an der offiziellen Route oder auf bestimmten Abschnitten."
    - p: "An welchen Tagen gibt es die meisten Prozessionen?"
      r: "Gründonnerstag und Karfreitag sind meist die Tage mit dem größten Andrang, und die stimmungsvollsten Nächte sind die Madrugá zwischen beiden Tagen in Städten wie Sevilla. Auch am Palmsonntag und am Karsamstag gibt es Prozessionen."
    - p: "Wie organisiere ich mich, um sie zu sehen?"
      r: "Sieh dir das offizielle Programm jeder Bruderschaft mit Zeiten und Routen an, komm rechtzeitig zu einem guten Platz und sei geduldig: Die Umzüge kommen langsam voran, und die Straßen sind für den Verkehr gesperrt."
    - p: "Ist es ein guter Plan mit Kindern?"
      r: "Ja, aber mit Vorsicht: Es sind viele Menschen da, und man wartet viele Stunden. Wähle Prozessionen am Nachmittag, such dir einen Platz mit Raum und erkläre ihnen, dass es eine Handlung des Respekts ist."

feria-abril:
  texto:
    - "Die Feria de Abril von Sevilla ist eine Festwoche mit Casetas (Festzelten), Sevillanas, Pferden und Pferdekutschen sowie Flamenco-Kleidern. Sie findet auf dem Festgelände Real de la Feria im Stadtteil Los Remedios statt, etwa zwei Wochen nach der Karwoche."
    - "Die Feria beginnt mit dem Alumbrado in der Nacht zum Montag, wenn die Tausenden Glühbirnen des Eingangstors angehen. Während der Woche gibt es ab Mittag einen Umzug von Pferden und Kutschen; danach füllen sich die Casetas mit Musik, Tanz, Essen und Trinken: Rebujito, Fino, Schinken und frittierter Fisch (pescaíto frito). Am Sonntag endet das Fest mit einem Feuerwerk."
    - "Eines sollte man wissen: Die meisten Casetas sind privat, und nur wer eine Einladung hat oder Mitglied ist, kommt hinein. Es gibt auch öffentliche Casetas und einige der Stadtverwaltung, die für alle offen sind, und die Straßen und das Festgelände kann man frei erkunden. Man geht in der Regel gut gekleidet hin: Flamenco-Kleid für die Frauen und traje corto oder Anzug für die Männer."
  faq:
    - p: "Wann ist die Feria de Abril?"
      r: "Normalerweise beginnt sie zwei Wochen nach dem Ostersonntag, zwischen April und Mai. Sie dauert eine Woche, mit dem Alumbrado in der Nacht zum Montag."
    - p: "Kann ich in jede Caseta hinein?"
      r: "Nein. Die meisten sind privat, und man kommt nur mit Einladung oder als Mitglied hinein. Es gibt öffentliche Casetas und solche der Stadtverwaltung, die für alle offen sind."
    - p: "Was kostet der Eintritt zur Feria?"
      r: "Der Eintritt auf das Gelände ist kostenlos. Du zahlst, was du konsumierst, und die Fahrgeschäfte in der Calle del Infierno sind kostenpflichtig."
    - p: "Was soll man anziehen?"
      r: "Viele Besucher tragen ein Flamenco-Kleid oder traje corto, aber das ist keine Pflicht. Am wichtigsten sind bequeme Schuhe, denn man läuft viel."
    - p: "Wie komme ich hin?"
      r: "Mit Metro, Straßenbahn oder Bus. Verzichte aufs Auto: Parkplätze zu finden ist fast unmöglich, und die Umgebung ist für den Verkehr gesperrt."
    - p: "Ist es ein guter Plan mit Kindern?"
      r: "Tagsüber ja, mit dem Pferdeumzug und familienfreundlichen Casetas. In der Calle del Infierno gibt es Fahrgeschäfte. Abends sind mehr Menschen da, und es ist lauter."

san-fermin:
  texto:
    - "Die Sanfermines sind das Fest von Pamplona, vom 6. bis 14. Juli, und eines der bekanntesten Feste der Welt. Sie beginnen mit dem Chupinazo auf der Plaza del Ayuntamiento am Mittag des 6. Juli und enden um Mitternacht des 14. mit dem Pobre de mí."
    - "Das große Symbol sind die Stierläufe (encierros): Jeden Morgen um acht Uhr rennen die Stiere auf einer Strecke von etwa 850 Metern vom Corral de Santo Domingo bis zur Stierkampfarena. Aber die Sanfermines sind viel mehr: die Prozession zu Ehren von San Fermín am 7. Juli, Riesen und Cabezudos (Großkopf-Figuren), Konzerte, Feuerwerke, weiße Kleidung mit rotem Halstuch und eine Straßenstimmung bei Tag und bei Nacht."
    - "Den Encierro mitzulaufen ist gefährlich und unterliegt Regeln: Man muss volljährig sein, darf keinen Alkohol getrunken haben und muss den Anweisungen der Organisation folgen. Wenn du ihn lieber ansehen möchtest, kannst du das im Fernsehen tun oder von einem dafür vorgesehenen Punkt aus, die sehr früh voll sind. Buche die Unterkunft Monate im Voraus, denn die Preise steigen und die Stadt füllt sich."
  faq:
    - p: "Wann sind die Sanfermines?"
      r: "Jedes Jahr vom 6. bis 14. Juli. Sie beginnen mit dem Chupinazo am 6. mittags und enden mit dem Pobre de mí um Mitternacht des 14."
    - p: "Um wie viel Uhr sind die Stierläufe?"
      r: "Jeden Morgen um 8:00 Uhr vom 7. bis zum 14. Juli. Er dauert nur wenige Minuten."
    - p: "Wie kann man einen Encierro ansehen?"
      r: "Im Fernsehen oder live von dafür vorgesehenen Bereichen aus, die sich sehr früh füllen. Auf einigen Balkonen gibt es kostenpflichtige Plätze. Die Punkte mit Sicht auf die Strecke sind schon vor Sonnenaufgang voll."
    - p: "Darf jeder mitlaufen?"
      r: "Nein. Man muss volljährig sein, darf nicht unter dem Einfluss von Alkohol oder anderen Substanzen stehen und muss den Regeln der Organisation folgen. Es ist eine gefährliche Aktivität, und jedes Jahr gibt es Verletzte."
    - p: "Was soll man anziehen?"
      r: "Traditionell weiße Kleidung mit rotem Halstuch und roter Schärpe. Bequeme, geschlossene Schuhe und Wechselkleidung, denn sie wird mit ziemlicher Sicherheit schmutzig."
    - p: "Ist es ein guter Plan mit Kindern?"
      r: "Die Stimmung am Tag ist familiär, mit Riesen, Cabezudos und Aktivitäten für Kinder. Abends ist es voller. Man sollte die Stierläufe und die überfülltesten Bereiche meiden."

tomatina:
  texto:
    - "La Tomatina ist die größte Tomatenschlacht der Welt. Sie findet in Buñol statt, einem Ort in der Provinz Valencia, am letzten Mittwoch im August, und etwa eine Stunde lang bewerfen sich Tausende Menschen mit reifen Tomaten, bis die Straßen rot gefärbt sind."
    - "Um teilzunehmen, brauchst du ein Ticket. Die Stadtverwaltung begrenzt die Teilnehmerzahl und verkauft die Tickets im Vorverkauf, deshalb solltest du sie rechtzeitig über die offiziellen Kanäle kaufen und dich vor Wiederverkäufern in Acht nehmen. Das Fest beginnt mit dem Palo Jabón, einer eingefetteten Stange mit einem Schinken an der Spitze, und die Schlacht beginnt, wenn gegen 11 Uhr morgens eine Rakete abgefeuert wird."
    - "Zieh alte Kleidung und Schuhe an, die du notfalls verlieren kannst, und nimm eine Schwimmbrille zum Schutz der Augen und Handschuhe mit. Zerdrücke die Tomate, bevor du sie wirfst, damit niemand verletzt wird, und wirf nichts außer Tomaten. Nimm keine Wertsachen und keine Kameras mit und reise rechtzeitig von Valencia an, zum Beispiel mit dem Zug oder den Bussen, die für diesen Tag organisiert werden."
  faq:
    - p: "Wann ist die Tomatina?"
      r: "Am letzten Mittwoch im August in Buñol (Valencia). Die Schlacht dauert etwa eine Stunde, ab 11 Uhr morgens."
    - p: "Braucht man ein Ticket?"
      r: "Ja. Die Teilnehmerzahl ist begrenzt, und die Tickets werden im Voraus über die offiziellen Kanäle gekauft. Kaufe nicht bei Wiederverkäufern."
    - p: "Wie komme ich nach Buñol?"
      r: "Von Valencia aus mit dem Cercanías-Zug oder dem Bus. Man sollte rechtzeitig ankommen, denn am Tag des Festes sind sehr viele Menschen da."
    - p: "Was soll man anziehen?"
      r: "Alte Kleidung und Schuhe, die du notfalls verlieren kannst. Viele Teilnehmer tragen eine Schwimmbrille zum Schutz der Augen und Handschuhe."
    - p: "Welche Regeln gibt es?"
      r: "Zerdrücke die Tomate, bevor du sie wirfst, wirf nichts außer Tomaten, bring keine Glas- oder Wertgegenstände mit und folge den Anweisungen der Organisation."
    - p: "Ist es ein guter Plan mit Kindern?"
      r: "Es gibt ein Mindestalter für die Teilnahme, und das Fest ist sehr überlaufen. Sieh dir die offiziellen Bedingungen an, bevor du Tickets kaufst."
