castanas-otono:
  imagen_alt: "Chestnut grove floor in autumn covered in golden leaves and chestnut burrs"
  texto:
    - "When October arrives, the chestnut groves of northern and central Spain fill up with burrs fallen among the leaves. Going out to pick chestnuts is one of the simplest and most rewarding autumn plans: a quiet walk in the countryside, a basket slowly filling up and, back home, something tasty to roast."
    - "Depending on altitude and the year, the season starts around mid-October and runs well into November. The best chestnut groves tend to be in mountain areas with a damp climate: El Bierzo (León), the Genal Valley (Málaga), the Sierra de Francia (Salamanca), the Tiétar Valley (Ávila), as well as much of Galicia and Asturias."
    - "The most important thing is to know who owns the grove. Many are private estates whose owners look after them and sell the harvest, and picking on them without permission can have consequences. Ask in the village, at the town hall or at a country guesthouse in the area: someone will usually tell you where you can pick or put you in touch with an owner."
    - "Bring sturdy closed shoes with good grip, thick gloves (the burrs really do prick), a basket or a sack and clothes you don't mind getting dirty. Chestnuts fall on their own when they are ripe: the usual way is to gather the ones on the ground, without beating the trees or damaging them. The days after rain and wind tend to be the most generous."
    - "Once home, cut a slit in the skin of each chestnut before roasting or boiling it so they don't burst. They keep best in a cool place or in the fridge, and are best eaten within a few days. The natural finale to this plan is a magosto: roasted chestnuts, a bonfire and new wine."
  mapa:
    titulo: "Where to go chestnut picking"
    centro: [40.0, -5.0]
    zoom: 6
    puntos:
      - { nombre: "El Bierzo (León)", lat: 42.55, lon: -6.6, desc: "Centuries-old chestnut groves around Las Médulas and the nearby valleys; the home of the magosto." }
      - { nombre: "Genal Valley (Málaga)", lat: 36.57, lon: -5.17, desc: "Serranía de Ronda: Igualeja, Pujerra, Genalguacil and Júzcar, with chestnut trees all over the valley." }
      - { nombre: "Sierra de Francia (Salamanca)", lat: 40.485, lon: -6.108, desc: "Around La Alberca and Miranda del Castañar, with chestnut groves on the hillsides." }
      - { nombre: "Tiétar Valley (Ávila)", lat: 40.2, lon: -5.1, desc: "Arenas de San Pedro, Candeleda and Guisando, at the foot of the Sierra de Gredos." }
      - { nombre: "Sierra de Aracena (Huelva)", lat: 37.89, lon: -6.56, desc: "The chestnut groves of Huelva, at Castaño del Robledo and Galaroza." }
  faq:
    - p: "When is chestnut season?"
      r: "In Spain, roughly from mid-October to mid-November. It starts earlier in lower areas and a few days later in higher ones. To time it right, ask about the area the week before: the harvest changes from year to year depending on the rain and the summer heat."
    - p: "Can you pick chestnuts in any forest?"
      r: "Not always. Many chestnut groves are private property and, in public forests, each town hall or regional government may have its own rules. Ask at the town hall or the locals before picking, and don't enter fenced estates."
    - p: "Where can I go chestnut picking?"
      r: "The classic destinations are El Bierzo (León), the Genal Valley (Málaga), the Sierra de Francia (Salamanca) and the Tiétar Valley (Ávila), as well as Galicia, Asturias and the Aracena area. They all have very extensive chestnut groves and a strong tradition."
    - p: "What should I bring?"
      r: "Thick gloves, closed shoes, a basket or sack and warm clothes you don't mind getting dirty. The burrs can be opened by stepping on them with the sole of your shoe, no tools needed."
    - p: "How do you roast chestnuts?"
      r: "Cut a slit in the skin of each one, put them in a perforated chestnut pan, in the oven or on a grill, and leave them for 20 to 30 minutes until the skin splits open. Wrap them in a cloth for a few minutes so they keep cooking in their own steam and are easier to peel."
    - p: "Is it a good plan with kids?"
      r: "Yes, though take care: the burrs prick. Give them gloves and teach them not to put their hand in without looking. For them it's an activity that combines a walk, play and a reward."
    - p: "What is a magosto?"
      r: "It is the traditional autumn festival of Galicia, Asturias and El Bierzo: chestnuts are roasted on a bonfire and eaten with new wine or cider, especially around Saint Martin's Day, on 11 November."

setas:
  imagen_alt: "Hands picking a bolete in the forest next to a wicker basket full of mushrooms"
  texto:
    - "With the first autumn rains, pine, oak and chestnut woods fill up with mushrooms, and going out to look for them becomes one of the most eagerly awaited plans of the year. It's a perfect excuse to spend the morning in the countryside, whether or not you come back with a full basket."
    - "The main season runs from October to November, although it depends a lot on rainfall and temperatures: after a few damp, frost-free weeks, the forest bursts into life. Provinces such as Soria, the Pyrenees, León, Zamora, the Sierra de Gredos or Catalonia are classics, and many of them have mushroom trails and organised events."
    - "Before heading out, find out about the local regulations. Several regions require a permit or foraging authorisation (in Castilla y León, for example, the Micocyl system is used), and there are quantity limits, closed areas and time restrictions. Rules vary from place to place, so check the website of the town hall or the regional government."
    - "If you have no experience, the golden rule is not to eat any mushroom you haven't identified with certainty. The most sensible way to start is to join a guided outing or a mushroom day with an expert, and to carry a field guide. Pick with a wicker basket, which lets the spores fall and lets the mushrooms breathe, and cut or remove them carefully without tearing up the ground."
  mapa:
    titulo: "Where to go mushroom foraging"
    centro: [41.2, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Pine forests of Soria", lat: 41.95, lon: -2.75, desc: "Vinuesa, Covaleda and Duruelo de la Sierra, with Micocyl as the permit system." }
      - { nombre: "Pyrenees (Aran Valley)", lat: 42.7, lon: 0.8, desc: "Damp fir and beech forests in the Pyrenees of Lleida." }
      - { nombre: "León mountains", lat: 42.95, lon: -5.1, desc: "Riaño, Babia and Luna, with Pyrenean oak woods and beech forests." }
      - { nombre: "Sanabria (Zamora)", lat: 42.1, lon: -6.7, desc: "Pine and chestnut woods around Lake Sanabria." }
      - { nombre: "Sierra de Gredos (Ávila)", lat: 40.3, lon: -5.2, desc: "Pine and oak woods in the Tiétar Valley and the Barranco." }
      - { nombre: "Solsonès (Catalonia)", lat: 42.0, lon: 1.5, desc: "Pine and mixed forests with a strong mushroom-hunting tradition." }
  faq:
    - p: "When is mushroom season?"
      r: "In Spain, the main season runs from October to November, although in some areas it lasts until December or starts in September. It depends on rain, altitude and temperature: after several damp, frost-free weeks, the forest bursts into life."
    - p: "Where can I look for mushrooms?"
      r: "Soria, the Pyrenees, the mountains of León and Zamora, the Sierra de Gredos or Catalonia are classic destinations. The most practical thing is to ask at the tourist office or at a country guesthouse in the area, where they usually know the trails and the current rules."
    - p: "Do I need a permit to pick mushrooms?"
      r: "In many areas, yes. Several regional governments require a permit or foraging authorisation, and there may be quantity limits and closed areas. Always check before heading out on the website of the town hall or the regional government."
    - p: "How do I know if a mushroom is edible?"
      r: "Don't trust popular tricks: you can only eat a mushroom if you have identified it with certainty. If in doubt, don't pick it. A guided outing or a mushroom day is the safest way to learn, and in case of poisoning you must go to the emergency room or call 112."
    - p: "What should I bring?"
      r: "A wicker basket, a pocket knife, an identification guide, hiking shoes, warm clothes, water and something to eat. Avoid plastic bags, which spoil the mushrooms and don't let the spores fall."
    - p: "Is it a good plan with kids?"
      r: "Yes, as long as they are accompanied and know that nothing is touched or eaten without an adult checking it. Younger children enjoy the search a lot, but it's best to choose easy routes and make sure they don't put their hands in their mouths."

hayedos:
  imagen_alt: "Path covered in leaves among beech trees in autumn colours with some mist in the background"
  texto:
    - "For a few weeks in autumn, beech forests turn from green to yellow, orange and copper, and the ground is covered in leaves. It is one of the most photogenic natural spectacles in Spain and a perfect plan for walking unhurriedly among silvery trunks."
    - "The best time is usually between mid-October and mid-November, although the peak of colour changes every year depending on the cold, the rain and the wind. Among the best-known beech forests are the Selva de Irati (Navarre), the Hayedo de Montejo (Madrid), the Hayedo de la Tejera Negra (Guadalajara) and Otzarreta (Bizkaia), as well as those of Cantabria, Asturias and the Pyrenees."
    - "Watch out for visitor quotas: some beech forests, such as Montejo, limit the number of visitors or require a reservation or an access permit, especially at weekends of peak colour. Check the protected area's website beforehand, and if you can, go on a weekday: there will be fewer people and more silence."
    - "Bring comfortable shoes that grip on wet leaves, a warm layer and a rain jacket, since damp is common in the beech forest, and stay on the marked trails. Mornings with some mist and the low light of late afternoon are the best for photography."
  mapa:
    titulo: "Where to see a beech forest in autumn"
    centro: [42.0, -2.5]
    zoom: 7
    puntos:
      - { nombre: "Selva de Irati (Navarre)", lat: 42.98, lon: -1.1, desc: "One of the largest beech and fir forests in Europe, between Ochagavía and Orbaizeta." }
      - { nombre: "Hayedo de Montejo (Madrid)", lat: 41.12, lon: -3.5, desc: "The southernmost beech forest in Europe; access with a quota and reservation." }
      - { nombre: "Hayedo de la Tejera Negra (Guadalajara)", lat: 41.15, lon: -3.15, desc: "In the Sierra de Ayllón, near Cantalojas, with marked trails." }
      - { nombre: "Hayedo de Otzarreta (Bizkaia)", lat: 43.03, lon: -2.78, desc: "In the Gorbeia Natural Park, one of the most photographed." }
      - { nombre: "Saja-Besaya (Cantabria)", lat: 43.1, lon: -4.2, desc: "Extensive beech forests in the Natural Park, with good autumn trails." }
      - { nombre: "Redes (Asturias)", lat: 43.17, lon: -5.3, desc: "Mountain beech forests in the Redes Natural Park." }
      - { nombre: "Selva de Oza (Huesca)", lat: 42.85, lon: -0.75, desc: "Beech and fir forests of the Aragonese Pyrenees, in the Hecho Valley." }
  faq:
    - p: "When is the best time to see a beech forest in autumn?"
      r: "Between mid-October and mid-November, with a colour peak that usually lasts about two or three weeks. It varies each year with the cold and the rain, so it's worth checking the protected area's updates or the visitor centres' social media."
    - p: "What are the best beech forests in Spain?"
      r: "The Selva de Irati (Navarre), the Hayedo de Montejo (Madrid), the Hayedo de la Tejera Negra (Guadalajara) and Otzarreta (Bizkaia) are the best known. Those of Cantabria, Asturias and the Pyrenees also stand out."
    - p: "Do I need to book or ask for a permit?"
      r: "In some, yes. The Hayedo de Montejo, for example, limits visits and requires authorisation, and in other areas there are quotas or car parks that fill up at weekends of peak colour. Check the protected area's website before going."
    - p: "Can I go with kids or with a dog?"
      r: "Short, marked routes are suitable for children. With a dog it depends on each area: in some they are banned or must be kept on a lead, so check beforehand."
    - p: "What clothes and shoes should I bring?"
      r: "Comfortable shoes that grip on wet leaves, warm clothing in layers and a rain jacket, because humidity and temperature drop quickly in the forest."
    - p: "How can I avoid the crowds?"
      r: "Go on a weekday, first thing in the morning or late in the afternoon, and avoid long weekends and weekends of peak colour. Another option is to pick less well-known beech forests in the same area."

berrea:
  texto:
    - "At the end of summer, male red deer start to bellow to attract females and challenge their rivals. That deep, powerful roar echoing across the countryside at dawn and dusk is the berrea, the red deer rut, one of the most impressive wildlife spectacles in Spain."
    - "The rut is concentrated between September and October, with the peak normally at the end of September and the beginning of October, although it varies by area and year. The best-known places are Cabañeros National Park, Monfragüe National Park, the Sierra de Andújar, the Riaño National Reserve and the Sierra de la Culebra, among others."
    - "The best approach is to arrive before sunrise or a little before nightfall, when the deer are most active, and listen quietly from an observation point. Bring binoculars and warm clothes in muted colours, and don't use torches or flash. Deer in rut are unpredictable: always keep your distance and don't approach them."
    - "In some areas there are guided routes, observatories or regulated access during the rut, and it is best to book in advance. Check the protected area's or visitor centre's website before going."
  mapa:
    titulo: "Where to hear the red deer rut"
    centro: [40.0, -5.0]
    zoom: 6
    puntos:
      - { nombre: "Cabañeros National Park (Ciudad Real)", lat: 39.4, lon: -4.5, desc: "Rañas (open grassy plains) and Mediterranean scrub with large deer populations; guided visits during the rut." }
      - { nombre: "Monfragüe National Park (Cáceres)", lat: 39.83, lon: -6.05, desc: "Dehesa (open oak pasture) and rocky crags with several viewpoints for listening at dawn." }
      - { nombre: "Sierra de Andújar (Jaén)", lat: 38.25, lon: -4.0, desc: "One of the best places in the south; very busy, so booking is advisable." }
      - { nombre: "Riaño National Reserve (León)", lat: 42.98, lon: -5.0, desc: "Mountain rut, among beech forests and Pyrenean oak woods in the León side of the Picos de Europa." }
      - { nombre: "Sierra de la Culebra (Zamora)", lat: 41.85, lon: -6.2, desc: "Vast game reserve with plenty of deer and the odd wolf." }
  faq:
    - p: "When is the red deer rut?"
      r: "Between September and October. The time of greatest activity is usually the end of September and the beginning of October, although it changes depending on the area and the year. It's best to go out at dawn or dusk."
    - p: "Where can I see the rut?"
      r: "The best-known places are Cabañeros, Monfragüe, the Sierra de Andújar, the Riaño National Reserve and the Sierra de la Culebra. Many have guided routes, observatories or marked listening points."
    - p: "What should I bring?"
      r: "Binoculars, warm clothing in muted colours (greens, browns, greys), comfortable shoes and something to eat and drink. It's chilly during the busiest hours, even if the day is hot."
    - p: "Is it dangerous to approach the deer?"
      r: "Yes. Males in rut are very aggressive and unpredictable. Don't approach them, don't circle around them or block their path, and keep the distance indicated by the guides or the signs."
    - p: "Do I need to book?"
      r: "In some areas, yes, especially for guided routes, observatories or regulated access at the height of the rut. Check the protected area's or visitor centre's website before going, because places sell out."
    - p: "Can I go with kids?"
      r: "Yes, it's a lovely plan for them, but you have to go quietly, at early hours and without leaving the group. Choose easy routes, ideally with a guide."

vendimia:
  texto:
    - "September is grape harvest month in much of Spain: ripe bunches are cut by hand or by machine and the wineries fill with the smell of must. Experiencing it up close, among vineyards and wine presses, is one of the most charming end-of-summer plans, and it has a lot of festival spirit."
    - "The exact date changes depending on the area, the variety and the year. White grapes and early varieties are usually picked from the end of August, and later red varieties can run into October. Regions such as La Rioja, Ribera del Duero, Jerez, Penedès, Rías Baixas or La Mancha organise visits, tastings and related activities."
    - "Many wineries offer experiences in which you can cut bunches, stomp the grapes or see how the harvest arrives at the winery, usually by prior reservation and for a fee. There are also festivals dedicated to the grape harvest, such as those in Jerez or the San Mateo festivities in Logroño, with grape stomping, offerings of the first must and tastings."
    - "If you sign up for a vineyard experience, bring comfortable closed shoes, a cap, sunscreen and clothes that can get stained. It's best to go first thing in the morning, when it's cooler and the work is done more calmly."
  mapa:
    titulo: "Where to experience the grape harvest"
    centro: [40.0, -3.5]
    zoom: 6
    puntos:
      - { nombre: "La Rioja (Logroño)", lat: 42.4627, lon: -2.445, desc: "Rioja Alta and Rioja Baja, with the San Mateo festivities in Logroño and many wineries offering visits." }
      - { nombre: "Ribera del Duero (Burgos and Valladolid)", lat: 41.62, lon: -3.9, desc: "Red wine vineyards along the Duero river, with wineries open to visitors." }
      - { nombre: "Rías Baixas (Pontevedra)", lat: 42.51, lon: -8.81, desc: "Albariño country, with an early harvest and wineries around Cambados." }
      - { nombre: "Penedès (Barcelona)", lat: 41.3446, lon: 1.6988, desc: "Cava and wine country, with wineries and harvest experiences around Vilafranca." }
      - { nombre: "La Mancha (Ciudad Real)", lat: 39.0, lon: -3.2, desc: "Spain's largest vineyard, with wineries and harvest festivals in its villages." }
      - { nombre: "Jerez (Cádiz)", lat: 36.6864, lon: -6.1377, desc: "Capital of sherry wine, with its harvest festival and historic wineries." }
  faq:
    - p: "When is the grape harvest in Spain?"
      r: "It depends on the area and the variety, but the main period runs from the end of August to October, with September as the central month. White and early grapes are picked before the late reds."
    - p: "Where can I experience the grape harvest?"
      r: "The classic destinations are La Rioja, Ribera del Duero, Jerez, Penedès, Rías Baixas and La Mancha. Many wineries organise visits and experiences at that time."
    - p: "Can I take part in the grape harvest?"
      r: "Yes, some wineries offer experiences in which you can cut bunches, stomp the grapes or see the harvest come in. They are usually paid and require prior booking, so find out in advance."
    - p: "Are there grape harvest festivals?"
      r: "Yes. Among the best known are the Jerez Grape Harvest Festival and the San Mateo festivities and Rioja grape harvest celebrations in Logroño, with grape stomping, the offering of the must and tastings."
    - p: "What should I bring?"
      r: "Comfortable closed shoes, a cap, sunscreen and clothes that can get stained. It's best to go first thing in the morning, when it's cooler."
    - p: "Is it a good plan with kids?"
      r: "Generally, yes. Many wineries organise family activities, with symbolic grape stomping and alcohol-free grape juice. Ask when booking whether children are admitted."

mercadillos-navidad:
  texto:
    - "Christmas markets fill the squares of many cities with stalls, lights and the smell of sweets. They are a perfect plan for strolling, shopping for crafts and decorations, and getting into the Christmas spirit."
    - "Some are classics: the market in Madrid's Plaza Mayor, Barcelona's Fira de Santa Llúcia next to the cathedral, or Bilbao's Santo Tomás market, held on 21 December. Many other cities set up their own, with stalls selling crafts, sweets and nativity scenes, plus shows for children."
    - "They usually open from late November and stay open until Christmas Eve or Three Kings' Day. The nicest time to go is on a weekday or early in the afternoon, when it is less crowded, and bring cash, because not every stall accepts cards. Wrap up warm: you spend a lot of time outdoors."
  faq:
    - p: "When do the Christmas markets open?"
      r: "Most open from late November or early December and close on Christmas Eve, although some stay open until Three Kings' Day. Check the dates for each city."
    - p: "Which are the best known?"
      r: "The one in Madrid's Plaza Mayor, Barcelona's Fira de Santa Llúcia and Bilbao's Santo Tomás market are among the most traditional, although almost every city has its own."
    - p: "Do you have to pay to get in?"
      r: "No. Entry is free, and you only pay for what you buy or for specific attractions, such as ice rinks or shows."
    - p: "What can you buy?"
      r: "Nativity scenes and figurines, decorations, candles, crafts, Christmas sweets, turrón and toys, depending on the market."
    - p: "When is the best time to go?"
      r: "On weekdays and early in the afternoon, to avoid the crowds. Weekends and long weekends get very busy."
    - p: "Is it a good plan with kids?"
      r: "Yes, many have toy stalls, shows and visits from Santa Claus or the Three Kings. Watch out for the crowds and keep an eye on the little ones."

luces-navidad:
  texto:
    - "Every year, Spanish cities compete to have the most spectacular Christmas lights. Streets covered in lights, huge trees, light and music shows and lots of people strolling make seeing the lights a very simple and very festive plan."
    - "Vigo has become famous for its display, and Madrid, Málaga, Valencia and Barcelona also put on very popular light displays. The switch-on usually takes place in late November or early December, with a public event, and the lights stay on until Three Kings' Day."
    - "The easiest way is to go on foot or by public transport, because city centres fill up with people and streets are closed to traffic, especially at weekends and on switch-on days. If you want to avoid the crowds, go on a weekday, early in the evening. Wrap up warm and wear comfortable shoes, because there is a lot of walking."
  faq:
    - p: "When are the Christmas lights switched on?"
      r: "Usually in late November or early December, with a public event. Each city has its own date, which is announced weeks in advance."
    - p: "How long do they stay on?"
      r: "Usually until Three Kings' Day, on 6 January, although in some cities they stay on a few more days."
    - p: "Which cities have the best lights?"
      r: "Vigo, Madrid, Málaga, Valencia and Barcelona are usually among the most visited, although many mid-sized cities have very well-done displays."
    - p: "When is the best time to go?"
      r: "On weekdays and early in the evening. At weekends, on long weekends and on switch-on days it gets very crowded."
    - p: "How do I get around?"
      r: "On foot or by public transport. In the busiest areas streets are closed off and parking is difficult."
    - p: "Is it a good plan with kids?"
      r: "Yes, they love it. Watch out for the crowds and agree on a meeting point in case you get separated."

cabalgata-reyes:
  texto:
    - "The Three Kings Parade (Cabalgata de Reyes) is one of the great family plans of Christmas: on the evening of 5 January, the Three Wise Men travel through the streets of almost every city and town in Spain with floats, music and showers of sweets, before the night they leave the presents."
    - "The best known are those in Madrid, Barcelona, where the Kings arrive by the port, Seville, with one of the oldest in Spain, and Valencia, but every town organises its own. The floats usually set off at dusk, and the route and time are published on the town hall's website or social media a few days beforehand."
    - "Arrive early and pick a good spot: the pavements fill up one or two hours beforehand. Bring a big bag for the sweets, warm clothes and patience, and keep an eye on the children while the sweets are raining down. If it rains, check whether it is going ahead or being cancelled."
  faq:
    - p: "When is the Three Kings Parade?"
      r: "On the evening of 5 January, although the time and route change in each town."
    - p: "Where can I watch the parade?"
      r: "In almost every city and town. Those in Madrid, Barcelona, Seville and Valencia are among the biggest, but each town hall publishes its route."
    - p: "Is it free?"
      r: "Yes, watching the parade from the street is free."
    - p: "When should I arrive to get a spot?"
      r: "One or two hours beforehand in big cities, and a little less in small towns."
    - p: "What should I bring?"
      r: "Warm clothes, a bag for the sweets and patience. In crowded areas, a meeting point in case you get separated."
    - p: "What happens if it rains?"
      r: "It depends on the city. Some go ahead, while others are postponed or shortened. Check the town hall's website or social media."

loteria-navidad:
  texto:
    - "The Christmas Lottery draw (Sorteo de la Lotería de Navidad), held every 22 December, is one of the most widely followed rituals of Christmas in Spain. The children of San Ildefonso sing out the numbers and prizes in their unmistakable chant, which can be heard on radio and television across the country."
    - "For years the draw has been held at Madrid's Teatro Real and lasts several hours, starting first thing in the morning. The most famous prize is El Gordo, but there are many prizes, and people play with family, friends or colleagues, often with a shared number."
    - "You can follow it on television or radio, or check the results on the official Loterías website. Access to the Teatro Real is limited, so most people watch it from home. If you have played, keep your ticket (décimo) safe and check the deadlines for collecting prizes."
  faq:
    - p: "When is the Christmas draw?"
      r: "On 22 December, starting first thing in the morning. It lasts several hours."
    - p: "Where is it held?"
      r: "At the Teatro Real in Madrid. Public access is limited."
    - p: "Who sings the numbers?"
      r: "The children of the Colegio de San Ildefonso, who sing them along with the prizes."
    - p: "How can I follow it?"
      r: "On television, radio or online. You can also check the results on the official Loterías website."
    - p: "When do I have to claim the prize?"
      r: "Prizes have a deadline for being claimed. Check the conditions and deadlines on the official Loterías website."
    - p: "Is it a good plan with kids?"
      r: "Yes, many of them love hearing the numbers sung and the atmosphere of the morning."

campanadas:
  texto:
    - "The New Year's Eve chimes (Campanadas de Nochevieja) mark the change of year in Spain with a unique tradition: eating twelve grapes, one with each chime, to welcome the new year with good luck. They are broadcast live from the clock at Madrid's Puerta del Sol and are watched in almost every home."
    - "Many people watch them on television, at home or with friends and family, while others prefer to go to a square. At the Puerta del Sol, access usually has a limited capacity and security checks, so check the conditions and arrive early. Other cities hold their own events in their main squares."
    - "For the grapes, a few practical tips: peel them and remove the seeds, have the twelve grapes ready in advance and start with the first chimes, not with the quarter chimes. After that, a toast, party favours and a party until the early hours, or off to rest, depending on your plan."
  faq:
    - p: "When are the chimes?"
      r: "On the night of 31 December, at 00:00. The twelve chimes of the clock mark the change of year."
    - p: "Why do people eat twelve grapes?"
      r: "It is a tradition of eating one grape with each chime to welcome the year with good luck. It is done all over Spain."
    - p: "Can I go to the Puerta del Sol?"
      r: "Yes, but access usually has limited capacity and security checks. Check the conditions from Madrid City Council and arrive early."
    - p: "Which channels broadcast them?"
      r: "Several television channels broadcast the chimes live from the Puerta del Sol. Check the schedule."
    - p: "How do I prepare the grapes?"
      r: "Peel the grapes and remove the seeds, have twelve ready and start with the chimes, not with the quarter chimes that come before them."
    - p: "Is it a good plan with kids?"
      r: "Yes, at home or at a quiet event. With small children, the grapes can be prepared peeled, seedless or cut up to avoid choking."

perseidas:
  texto:
    - "The Perseids, popularly known as the Tears of Saint Lawrence, are one of the easiest and most spectacular meteor showers to see from Spain. They happen every year when the Earth passes through the dust trail left by comet Swift-Tuttle."
    - "Activity lasts from mid-July to late August, and the peak usually falls between 11 and 13 August. On a clear, moonless night with dark skies, you can see dozens of meteors an hour. The phase of the Moon each year makes a big difference: with a full Moon you see far fewer."
    - "The key is to get away from light pollution. Starlight-certified reserves and destinations, such as Monfragüe, Sierra Sur de Jaén or Gúdar-Javalambre, are a great choice, and many of them organise guided stargazing sessions. You don't need a telescope or binoculars: just lie down and look up at the open sky."
    - "Let your eyes adjust to the dark for about 20 or 30 minutes and avoid looking at your phone. Bring a blanket or a sun lounger, warm clothes even if it is hot during the day, and something hot to drink. The hours after midnight are usually the best."
  mapa:
    titulo: "Where to watch the Perseids"
    centro: [39.5, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Monfragüe (Cáceres)", lat: 39.83, lon: -6.05, desc: "National Park and Starlight Reserve, with guided stargazing sessions." }
      - { nombre: "Sierra Sur de Jaén", lat: 37.6, lon: -3.85, desc: "Starlight Reserve with very dark skies, around Alcalá la Real and Castillo de Locubín." }
      - { nombre: "Gúdar-Javalambre (Teruel)", lat: 40.2, lon: -0.7, desc: "Starlight Reserve at over 1,500 m above sea level, with clear skies and an astrophysical observatory." }
  faq:
    - p: "When can you see the Perseids?"
      r: "Activity runs from mid-July to late August, with the peak around 12 August, usually between the 11th and the 13th. The best hours are after midnight and until dawn."
    - p: "Where is the best place to see them in Spain?"
      r: "Anywhere with dark, clear skies. Starlight-certified destinations, such as Monfragüe, Sierra Sur de Jaén or Gúdar-Javalambre, offer excellent skies and guided stargazing sessions."
    - p: "Do I need a telescope?"
      r: "No. They are fast-moving meteors and are best seen with the naked eye. Binoculars and telescopes narrow your field of view and don't help."
    - p: "Which way should I look?"
      r: "They radiate from the constellation Perseus, to the northeast, but meteors appear all over the sky. The best approach is to look up without fixing on one particular spot."
    - p: "Does the Moon matter?"
      r: "A lot. With a full or very bright Moon you see far fewer meteors. Check the Moon phase for that year before planning your trip."
    - p: "What should I bring?"
      r: "A blanket or sun lounger, warm clothes, a red-light torch (if you need one), something hot to drink and patience. Avoid white lights, which ruin your night vision."

cerezos-jerte:
  texto:
    - "For a few weeks in spring, the Jerte Valley, in northern Cáceres, is covered in white by the blossom of hundreds of thousands of cherry trees. The terraced hillsides look snow-covered, and the show is completed by the Garganta de los Infiernos gorge and the valley's stone villages."
    - "The blossom usually arrives between late March and mid-April, although the exact date changes every year depending on the winter and the temperatures. It is short-lived, between one and two weeks in each area, and comes earlier or later depending on altitude, so it is worth checking the state of the blossom before you travel. The Cherry Blossom Festival (Fiesta del Cerezo en Flor) is held during this time."
    - "It is a very popular plan, and on the weekends of peak blossom traffic and parking get difficult. If you can, go on a weekday or first thing in the morning, book accommodation well in advance and be patient on the valley's roads. Cherry trees are cultivated crops with owners: respect the farms, don't cut branches and don't enter closed terraces."
  mapa:
    titulo: "Where to see the cherry blossom"
    centro: [40.2, -5.77]
    zoom: 11
    puntos:
      - { nombre: "Garganta de los Infiernos", lat: 40.22, lon: -5.76, desc: "Nature reserve at the head of the valley, with trails and natural pools along the river." }
      - { nombre: "Jerte", lat: 40.2147, lon: -5.7508, desc: "Stone village at the entrance to the Garganta, with a visitor centre and cherry trees on the terraces." }
      - { nombre: "Navaconcejo", lat: 40.1747, lon: -5.7978, desc: "Valley village surrounded by cherry trees; a good base for seeing the blossom." }
      - { nombre: "Cabezuela del Valle", lat: 40.1697, lon: -5.7014, desc: "Cherry trees on the hillsides and cobbled streets, in the middle stretch of the valley." }
  faq:
    - p: "When do the cherry trees in the Jerte Valley blossom?"
      r: "Usually between late March and mid-April, for one or two weeks in each area. The date changes every year with the weather, so check the state of the blossom before you go."
    - p: "Where can you see the cherry blossom?"
      r: "The Jerte Valley (Cáceres) is the best known, with villages such as Cabezuela del Valle, Navaconcejo or Jerte, and routes such as the one through the Garganta de los Infiernos."
    - p: "Can you go into the terraces?"
      r: "They are private farmland. Walk along the signposted paths and viewpoints, and don't enter the plots or cut flowers or branches."
    - p: "Do I need to book accommodation?"
      r: "Yes, well in advance, because everything fills up on the weekends of peak blossom. Nearby towns such as those in La Vera or Plasencia are an alternative."
    - p: "How do I avoid the crowds?"
      r: "Go on a weekday, first thing in the morning or late in the afternoon, and avoid the weekends of peak colour. It is best to park in the designated areas and get around on foot."
    - p: "Is it a good plan with kids?"
      r: "Yes, the gentle routes through the valley are suitable for families. If your child has a pollen allergy, bring medication, because the blossom is intense in spring."

nieve:
  texto:
    - "Heading to the snow is one of the great winter plans, whether to ski, walk, go sledging or simply see the mountains turn white. Spain has resorts and snowy landscapes in Sierra Nevada, the Pyrenees, the Cantabrian range and the Central System."
    - "The season runs from December to March, although snow depends a lot on each winter. Before setting out, check the state of the slopes and the roads: you may need snow chains or winter tyres, and access roads to the resorts get jammed at weekends and on long weekends. Check traffic information before and during the trip."
    - "You don't need to ski. Many resorts and valleys offer sledging areas, snowshoe routes, cross-country skiing and snow walks, and you can rent clothing. Book your lift pass and equipment in advance for peak dates. Bring waterproof clothing in layers, sunglasses, sun cream and spare gloves, because the sun and the glare off the snow can fool you."
  mapa:
    titulo: "Where to head to the snow"
    centro: [40.5, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Sierra Nevada (Granada)", lat: 37.09, lon: -3.4, desc: "The southernmost resort in Europe, with ski slopes and areas for walking and sledging." }
      - { nombre: "Aragonese Pyrenees (Formigal)", lat: 42.78, lon: -0.37, desc: "A large ski area in the Pyrenees, with cross-country skiing and snowshoe routes nearby." }
      - { nombre: "Catalan Pyrenees (Baqueira Beret)", lat: 42.7, lon: 0.93, desc: "One of the biggest resorts in the Pyrenees, in the Aran Valley." }
      - { nombre: "Cantabrian range (San Isidro)", lat: 43.05, lon: -5.37, desc: "Resort between León and Asturias, with Cantabrian high-mountain scenery." }
      - { nombre: "Central System (Navacerrada)", lat: 40.79, lon: -4.01, desc: "The closest snow to Madrid, with slopes and sledging areas; access roads get jammed at weekends." }
  faq:
    - p: "When is there snow in Spain?"
      r: "Usually from December to March, with January and February the most reliable months. It depends a lot on each winter and on altitude."
    - p: "Where can I go to the snow?"
      r: "Sierra Nevada (Granada), the Pyrenees (Huesca, Lleida, Navarre), the Cantabrian range, the Central System (Madrid, Segovia) or the Iberian System offer resorts and routes."
    - p: "Do I need to know how to ski?"
      r: "No. There are sledges, snowshoe routes, cross-country skiing, snow areas for children and walks. If you want to ski, many schools offer beginner lessons."
    - p: "Do I need snow chains?"
      r: "It depends on the road and the day. Check traffic information and carry chains or winter tyres. Sometimes carrying them is compulsory and the road is closed without them."
    - p: "Do I need to book?"
      r: "On peak dates (long weekends, Christmas, snowy weekends) it is wise to book your lift pass, rental and accommodation. Buying online is usually cheaper and quicker."
    - p: "What should I wear?"
      r: "Waterproof clothing in layers, gloves and a hat, sunglasses or ski goggles, sun protection and footwear with a good sole. A change of dry clothes for the journey back is always a good idea."

festival-san-sebastian:
  texto:
    - "The San Sebastián Film Festival, known as Zinemaldia, is one of the great film festivals of Spain and Europe. It takes place in September in Donostia-San Sebastián, with international premieres, stars on the red carpet and screenings open to the public."
    - "The programme includes the official competition section, which vies for the Golden Shell (Concha de Oro), as well as parallel sections, retrospectives and tributes, such as the Donostia Award for lifetime achievement. Screenings are spread across several cinemas and venues in the city, including the Kursaal and the Victoria Eugenia Theatre, and many of them are open to anyone."
    - "Check the official website for the programme, schedules and ticket sales, which usually go on sale only a few days before the screenings and sell out quickly. Get to the queues early, look at the schedules so you can combine screenings, and take the chance to stroll around the city and try the pintxos. It can rain in September: bring an umbrella."
  faq:
    - p: "When is the San Sebastián Film Festival?"
      r: "In September, for around nine days. The exact dates are announced each year."
    - p: "Can anyone go?"
      r: "Yes. Besides the sessions for industry professionals and press, there are many screenings open to the public with a ticket."
    - p: "Where do I buy tickets?"
      r: "Through the festival's official channels. They go on sale shortly beforehand and the most popular screenings sell out."
    - p: "What is the Golden Shell?"
      r: "It is the festival's main prize, awarded to the best film in the official section."
    - p: "Can you see the stars?"
      r: "There is usually a crowd at the red carpet outside the Victoria Eugenia Theatre. Check the schedules and arrive early."
    - p: "What else is there to do in San Sebastián?"
      r: "Stroll along La Concha bay, try pintxos in the Old Town and visit Mount Igueldo."

semana-santa-sevilla:
  texto:
    - "Seville's Holy Week (Semana Santa) is probably the most famous in Spain. For eight days, around sixty brotherhoods (hermandades) parade through the city with their floats of Christ and the Virgin, accompanied by hooded penitents (nazarenos), brass bands and thousands of people in the streets."
    - "All the brotherhoods pass through the Carrera Oficial, the official route that runs from La Campana to the Cathedral. The night between Maundy Thursday and Good Friday is the Madrugá, the most emotional and crowded of all, with brotherhoods such as El Silencio, El Gran Poder, La Macarena, Los Gitanos and La Esperanza de Triana."
    - "It is a huge event: the streets in the centre fill up and the processions take hours to pass. Download the official programme, choose the brotherhoods you want to see and arrive early. Book accommodation months in advance, use public transport and be patient with street closures. And remember: it is a religious act, so respect the silence and the penitents."
  faq:
    - p: "When is Holy Week in Seville?"
      r: "From Palm Sunday to Easter Sunday, which changes every year between March and April. Check the official calendar for the exact dates."
    - p: "What is the Madrugá?"
      r: "It is the night between Maundy Thursday and Good Friday. Several of the most emblematic brotherhoods set out during those hours, and it is the time of greatest crowds and emotion."
    - p: "Where can I watch the processions?"
      r: "The Carrera Oficial (from La Campana to the Cathedral) has a great atmosphere but also huge crowds. Other parts of the centre or neighbourhoods such as Triana let you watch them in more peace."
    - p: "Do I need to book?"
      r: "Not to watch the processions from the street, but you do for accommodation and restaurants, which sell out months in advance."
    - p: "How do I check the schedules?"
      r: "The Consejo de Hermandades y Cofradías publishes the official programme with the routes and times of each brotherhood. There are also apps and websites with real-time tracking."
    - p: "What should I bring or bear in mind?"
      r: "Comfortable shoes, layered clothing and patience. Respect the silence, don't cross between the processions and avoid using a flash near the floats."

fallas:
  texto:
    - "Las Fallas is Valencia's festival in honour of Saint Joseph, held from 15 to 19 March. Declared Intangible Cultural Heritage of Humanity by UNESCO, it combines cardboard and wood monuments, pyrotechnics, music, gunpowder and plenty of life on the streets."
    - "The fallas are huge satirical monuments that are set up in the streets on the 15th. You can tour them on foot, and the most important ones compete for prizes. Every day at 14:00, the mascletà, a symphony of gunpowder in the Town Hall square, is an unmissable event. On the 17th and 18th the Flower Offering to the Virgin of the Forsaken (Virgen de los Desamparados) takes place."
    - "The finale comes on the night of 19 March with the cremà: the fallas are set on fire, starting with the children's ones and ending with the main one at midnight. Book accommodation months in advance, use public transport and get there early to find a spot at the mascletà. Be careful with firecrackers in the street and with small children."
  faq:
    - p: "When are the Fallas?"
      r: "From 15 to 19 March every year. The plantà is on the 15th and the cremà on the night of the 19th."
    - p: "What is the mascletà?"
      r: "It is a gunpowder show that focuses on sound and power rather than colours. It is fired every day at 14:00 in the Town Hall square and you feel it in your body."
    - p: "What is the cremà?"
      r: "It is the burning of the fallas on the night of 19 March, with the final burning of the city's main falla at midnight."
    - p: "How do I get around Valencia during the Fallas?"
      r: "On foot and by public transport. There are road closures and parking is almost impossible. The metro runs a reinforced service."
    - p: "What is there to eat?"
      r: "Pumpkin fritters (buñuelos) with hot chocolate, paella and street sandwiches. The buñuelos are the typical flavour of these festivities."
    - p: "Is it a good plan with children?"
      r: "Yes, there are children's fallas and activities, but the noise of the firecrackers and the crowds can be overwhelming for little ones."

semana-santa:
  texto:
    - "Holy Week (Semana Santa) is the week before Easter Sunday, from Palm Sunday to Easter Sunday, and it is one of the most profound and most visited celebrations in Spain. Brotherhoods (cofradías and hermandades) bring their floats and images out onto the streets in processions that blend faith, art, music and tradition."
    - "Each city has its own style. In Seville and Málaga the large thrones and canopies stand out, in Valladolid, Zamora or Salamanca the processions are more sober and feature Castilian religious sculpture, and in places like Cuenca or Murcia there are very distinctive customs. Many are Festivals of International Tourist Interest."
    - "As the dates depend on Easter, they change every year, between March and April. If you plan to travel, book accommodation well in advance and check the official routes and times of each brotherhood, which are published weeks beforehand. The processions are religious events: keep quiet, don't cross between the processions and avoid flash photography when the floats go by."
  faq:
    - p: "When is Holy Week?"
      r: "It is the week before Easter Sunday, which falls on a different date every year between late March and late April. It runs from Palm Sunday to Easter Sunday."
    - p: "Where can I see the best processions?"
      r: "Seville, Málaga, Valladolid, Zamora, Salamanca, Cuenca, Murcia and Cartagena are among the best known, each with a very different style. Many are Festivals of International Tourist Interest."
    - p: "Do I have to pay to watch the processions?"
      r: "No. You can watch them for free from the street. In some cities there are paid seats along the official route or at specific stretches."
    - p: "Which days have the most processions?"
      r: "Maundy Thursday and Good Friday are usually the busiest days, and the nights with the most atmosphere are the early hours between the two in cities like Seville. Palm Sunday and Holy Saturday also have processions."
    - p: "How do I plan to see them?"
      r: "Check each brotherhood's official programme, with its times and routes, get to a good spot early and be patient: the processions move slowly and streets are closed to traffic."
    - p: "Is it a good plan with children?"
      r: "Yes, but with care: there are big crowds and long waits. Choose afternoon processions, find a spot with room and explain to them that it is a moment of respect."

feria-abril:
  texto:
    - "The Seville April Fair (Feria de Abril) is a week of celebration with marquees (casetas), sevillanas dancing, horses and horse-drawn carriages, and flamenco dresses. It is held at the Real de la Feria fairground, in the Los Remedios district, about two weeks after Holy Week."
    - "The fair kicks off with the Alumbrado, on Monday night, when the thousands of light bulbs on the main gate are switched on. During the week, from midday, there is a parade of horses and carriages; after that, the casetas fill up with music, dancing, food and drink: rebujito, fino sherry, ham and fried fish (pescaíto frito). The fair closes on Sunday with a fireworks display."
    - "One thing worth knowing: most casetas are private and only people with an invitation or members can get in. There are also public casetas and some run by the city council, open to everyone, and you can walk freely along the streets and around the fairground. People usually dress up: a flamenco dress for women and a short jacket (traje corto) or a suit for men."
  faq:
    - p: "When is the April Fair?"
      r: "It normally starts two weeks after Easter Sunday, between April and May. It lasts a week, with the Alumbrado on Monday night."
    - p: "Can I enter any caseta?"
      r: "No. Most are private and you can only get in with an invitation or as a member. There are public casetas and council-run ones open to everyone."
    - p: "How much does it cost to enter the fair?"
      r: "Entry to the grounds is free. You pay for what you consume, and the rides on Calle del Infierno are paid."
    - p: "What should I wear?"
      r: "Many visitors wear a flamenco dress or traje corto, but it is not compulsory. The most important thing is comfortable footwear, because you walk a lot."
    - p: "How do I get there?"
      r: "By metro, tram or bus. Avoid taking a car: parking is almost impossible and the surrounding area is closed to traffic."
    - p: "Is it a good plan with children?"
      r: "During the day, yes, with the horse parade and family-friendly casetas. Calle del Infierno has rides. At night there are more people and more noise."

san-fermin:
  texto:
    - "San Fermín is Pamplona's festival, held from 6 to 14 July, and one of the best-known celebrations in the world. It begins with the chupinazo in the Town Hall square, at midday on 6 July, and ends at midnight on the 14th with the Pobre de mí."
    - "The great symbol is the encierros (running of the bulls): every morning at eight o'clock, the bulls run along a route of about 850 metres from the Santo Domingo corral to the bullring. But San Fermín is much more: the procession of San Fermín on 7 July, giants and big-heads (gigantes y cabezudos), concerts, fireworks, white clothing with a red scarf and a street atmosphere day and night."
    - "Running with the bulls is dangerous and has rules: you must be of legal age, must not have drunk alcohol and must follow the organisers' instructions. If you prefer to watch, you can do so on television or from an authorised spot, which fill up very early. Book accommodation months in advance, because prices go up and the city fills up."
  faq:
    - p: "When is San Fermín?"
      r: "From 6 to 14 July every year. It starts with the chupinazo on the 6th at midday and ends with the Pobre de mí at midnight on the 14th."
    - p: "What time are the bull runs?"
      r: "Every morning at 8:00, from 7 to 14 July. It lasts only a few minutes."
    - p: "How can I watch a bull run?"
      r: "On television, or live from authorised areas, which fill up very early. Some balconies have paid places. The spots with a view of the route fill up from before dawn."
    - p: "Can anyone run?"
      r: "No. You must be of legal age, not be under the influence of alcohol or other substances, and obey the organisers' rules. It is a dangerous activity and people are injured every year."
    - p: "What should I wear?"
      r: "Traditionally, white clothes with a red scarf around the neck and a red sash. Comfortable, closed shoes and a change of clothes, because you will almost certainly get dirty."
    - p: "Is it a good plan with children?"
      r: "The daytime atmosphere is family-friendly, with giants, big-heads and activities for children. At night it is more crowded. It is best to avoid the bull runs and the most packed areas."

tomatina:
  texto:
    - "La Tomatina is the world's biggest tomato fight. It takes place in Buñol, a town in the province of Valencia, on the last Wednesday of August, and for about an hour thousands of people throw ripe tomatoes at each other until the streets are stained red."
    - "To take part you need a ticket. The town council limits capacity and sells tickets in advance, so it is best to buy them early through the official channels and be wary of resellers. The festival begins with the palo jabón, a greased pole with a ham on top, and the battle starts when a rocket is fired at around 11 in the morning."
    - "Wear old clothes and shoes you don't mind losing, swimming goggles to protect your eyes, and gloves. Squash the tomato before throwing it so as not to hurt anyone, and throw nothing but tomatoes. Don't bring valuables or cameras, and allow plenty of time to get there from Valencia, for example by train or on the buses organised for that day."
  faq:
    - p: "When is La Tomatina?"
      r: "On the last Wednesday of August, in Buñol (Valencia). The battle lasts about an hour, starting at 11 in the morning."
    - p: "Do I need a ticket?"
      r: "Yes. Capacity is limited and tickets are bought in advance through the official channels. Avoid buying from resellers."
    - p: "How do I get to Buñol?"
      r: "From Valencia, by Cercanías commuter train or bus. It is best to arrive early, because there are huge crowds on the day of the festival."
    - p: "What should I wear?"
      r: "Old clothes and shoes you don't mind losing. Many participants wear swimming goggles to protect their eyes, and gloves."
    - p: "What are the rules?"
      r: "Squash the tomato before throwing it, throw nothing but tomatoes, don't bring glass or valuables and follow the organisers' instructions."
    - p: "Is it a good plan with children?"
      r: "There is a minimum age to take part and the festival is very crowded. Check the official conditions before buying tickets."

san-juan:
  texto:
    - "Saint John's Eve, the night before 24 June, is one of the oldest celebrations linked to the summer solstice. All over Spain bonfires are lit, people perform rituals to make wishes and there are parties on beaches, in squares and in the mountains."
    - "Some of the best known are in A Coruña, with bonfires on the Riazor and Orzán beaches; the Hogueras of Alicante, a Festival of International Tourist Interest; the Revetlla de Sant Joan in Catalonia, with firecrackers and the coca de Sant Joan; and the solstice fire festivals in the Pyrenees, recognised by UNESCO."
    - "It is customary to jump over the bonfire, take a midnight swim or write a wish on a piece of paper and burn it. Do it safely: use only authorised bonfires, don't light fires on your own in risk areas, keep an eye on children with firecrackers and be very careful with night swimming. And don't leave litter on the beach."
  faq:
    - p: "When is Saint John's Eve?"
      r: "On the night of 23 to 24 June, with the 24th a public holiday in some regions."
    - p: "Where can I see the bonfires?"
      r: "A Coruña, Alicante, Barcelona, Cádiz and many beaches along the coast have very popular celebrations. Check each town council's programme."
    - p: "Can I light a bonfire?"
      r: "Only where it is authorised. On many beaches and in forest areas it is forbidden to light fires on your own, and there is a risk of a fine and of starting a fire."
    - p: "What rituals are performed?"
      r: "Jumping over the bonfire, making wishes, writing what you want to leave behind on a piece of paper and burning it, and swimming at midnight. Each area has its own customs."
    - p: "Is it safe to swim at night?"
      r: "There is a risk, especially with alcohol and poor visibility. Swim only on beaches with lifeguards, with company and without going far from the shore."
    - p: "Is it a good plan with children?"
      r: "Yes, there are lots of family activities, but keep an eye on the fire and the firecrackers, and avoid the busiest hours."

batalla-vino:
  texto:
    - "The Haro Wine Battle (Batalla del Vino) is a one-of-a-kind festival: every 29 June, thousands of people throw red wine at each other at the Riscos de Bilibio, a few kilometres from Haro, in La Rioja. It is a celebration of Saint Peter that combines religious tradition, wine and plenty of good humour."
    - "The day begins with a procession from the town to the Riscos de Bilibio and a mass at the hermitage of San Felices. Then the battle starts, with buckets, water pistols, wineskins and watering cans, and thousands of litres of wine are emptied. Almost everyone dresses in white and wears a purple scarf."
    - "Wear white clothes you don't mind ruining, comfortable shoes that can get wet and goggles to protect your eyes. Don't bring valuables or cameras that could get stained, and bear in mind that the festival is very crowded. Book accommodation and transport in advance and drink responsibly."
  faq:
    - p: "When is the Wine Battle?"
      r: "Every 29 June, Saint Peter's Day, at the Riscos de Bilibio, near Haro (La Rioja)."
    - p: "What should I wear?"
      r: "White clothes you don't mind ruining and comfortable shoes. Many participants wear swimming goggles and a purple scarf."
    - p: "How do I get there?"
      r: "From Haro, most people go on foot in the procession or by organised transport. Avoid taking a car, because parking is difficult."
    - p: "Do I need a ticket?"
      r: "In general it is a popular festival with free access, but check the conditions and the programme from Haro Town Council."
    - p: "Is it safe?"
      r: "It is a very crowded festival with wine, so you need to be careful, protect your eyes and not go alone."
    - p: "Is it a good plan with children?"
      r: "It is very crowded and wet, so it is not usually recommended for small children."

romeria-rocio:
  texto:
    - "The Romería del Rocío is one of the biggest pilgrimages in Spain. Hundreds of thousands of people travel on foot, on horseback and in carts from different parts of Andalusia to the village of El Rocío, in Almonte (Huelva), at Pentecost."
    - "The pilgrims, organised in brotherhoods (hermandades), travel the paths of Doñana for days, amid singing, prayers, dancing and companionship. The high point comes in the early hours of Whit Monday, when the people of Almonte jump the fence and carry the Virgen del Rocío out in procession."
    - "If you want to experience it without being a pilgrim, you can visit the village and watch the brotherhoods and carts go by. The streets are sandy and there are lots of people, the heat is intense and accommodation and parking run out. Bring water, comfortable shoes and plenty of patience, and respect the religious nature of the pilgrimage and the natural surroundings of Doñana."
  faq:
    - p: "When is the Romería del Rocío?"
      r: "At Pentecost, 50 days after Easter Sunday, usually between May and June. The main day is the Monday."
    - p: "Where does it take place?"
      r: "In the village of El Rocío, in Almonte (Huelva), next to Doñana National Park."
    - p: "What is the salto de la reja?"
      r: "It is the moment when the people of Almonte jump the fence that protects the Virgin in order to carry her out in procession, in the early hours of Whit Monday."
    - p: "Can I go without being a pilgrim?"
      r: "Yes, but access is difficult: there are lots of people, little parking and sandy streets. Find out in advance how to get there and whether there are traffic restrictions."
    - p: "What should I bring?"
      r: "Water, a hat, sun protection, comfortable shoes and clothes for the heat of the day and the chill of the night. Respect the natural surroundings and don't leave litter."
    - p: "Is it a good plan with children?"
      r: "With care: it is very hot, very crowded and the journeys are long. It is better to visit the village at the quieter times."

feria-malaga:
  texto:
    - "The Málaga Fair (Feria de Málaga), in mid-August, is one of the liveliest fairs in the south: a week of music, dancing, casetas (fair marquees), fireworks and sweet wine. It takes place in two settings: the Feria del Centro, by day, and the Feria de Cortijo de Torres, by night."
    - "During the day, the historic centre fills with peñas (social clubs), music, fandangos verdiales and people dressed in flamenco dresses or traditional short jackets. At night, the Cortijo de Torres fairground brings together casetas, rides, concerts and a great atmosphere. There are activities for all ages, and plenty of pescaíto frito (fried fish) and Málaga wine."
    - "Go to the centre by day and to the fairground at night. Avoid the car and use buses or the fair's public transport, because traffic and parking are difficult. Bring comfortable shoes, light clothing and patience, and book accommodation in advance."
  faq:
    - p: "When is the Málaga Fair?"
      r: "In mid-August, for a week. The exact dates change every year."
    - p: "What is the Feria del Centro?"
      r: "The daytime part of the fair, in the historic centre, with music, dancing and a lively local atmosphere."
    - p: "What is Cortijo de Torres?"
      r: "The fairground where the fair is held at night, with casetas, concerts and rides."
    - p: "How do I get to Cortijo de Torres?"
      r: "By bus and special fair services. Avoid the car, because parking is difficult."
    - p: "What is there to eat and drink?"
      r: "Pescaíto frito, espetos (grilled sardine skewers), ham and sweet Málaga wine, among other things."
    - p: "Is it a good plan with children?"
      r: "By day and in the centre, yes. At night there are lots of people and noise."

fiesta-santiago-apostol:
  texto:
    - "The Feast of Saint James the Apostle celebrates the day of the patron saint of Spain and Galicia, 25 July, which is also Galicia's National Day. It takes place in Santiago de Compostela, over a week of religious ceremonies, concerts, popular activities and a great atmosphere."
    - "Two moments stand out: the eve, the night of 24 July, with the fireworks display in front of the Obradoiro façade of the cathedral, and 25 July, with the National Offering to the Apostle in the cathedral. When 25 July falls on a Sunday, the Compostelan Holy Year is celebrated, with even more pilgrims."
    - "Santiago fills with visitors, pilgrims and tourists around these dates. Book accommodation in advance, check the official programme and arrive early at the Obradoiro square if you want to see the fireworks. Bring comfortable shoes and a raincoat, because the weather changes quickly in Galicia."
  faq:
    - p: "When is the Feast of the Apostle?"
      r: "Around 25 July, with the eve of the 24th as the night of the fireworks."
    - p: "What are the Apostle's fireworks?"
      r: "A pyrotechnic show held on the night of 24 July in front of the Obradoiro façade of the cathedral."
    - p: "What is the National Offering?"
      r: "A religious and official ceremony held on 25 July in the cathedral, with an offering to Saint James the Apostle."
    - p: "What is the Holy Year?"
      r: "A Compostelan jubilee year held when 25 July falls on a Sunday. It attracts many more pilgrims."
    - p: "Do I need to book accommodation?"
      r: "Yes, well in advance, because Santiago fills up around these dates."
    - p: "Is it a good plan with children?"
      r: "Yes, there are family activities, but the fireworks and the crowds at the Obradoiro are very busy."
calcotada:
  texto:
    - "The calçotada is a typical meal from Catalonia, especially from the Camp de Tarragona and the Alt Camp: calçots (young spring onions) grilled over embers, peeled by hand and dipped in romesco sauce. It is a celebration meal, with a bib, good company and a long after-dinner chat at the table."
    - "The season starts around December and runs until April, with its peak between January and March. Valls, in the Alt Camp, is the capital of the calçot and holds a big festival at the end of January, with a contest and a public meal. Besides Catalonia, there are also calçotadas in other parts of Spain."
    - "It is usually eaten with grilled meat, butifarra sausage, beans and wine or cava. Book in advance, especially at weekends, because everything fills up in season. You eat it with your hands: you hold the calçot by the base, pull off the outer layer, dip it in romesco and eat the tender part at the top. It gets messy, so the bib is no exaggeration."
  mapa:
    titulo: "Where to go for a calçotada"
    centro: [41.22, 1.25]
    zoom: 10
    puntos:
      - { nombre: "Valls (Alt Camp)", lat: 41.2872, lon: 1.2507, desc: "Capital of the calçot: at the end of January it holds its big festival, with a contest and a public meal." }
      - { nombre: "Camp de Tarragona", lat: 41.12, lon: 1.2, desc: "The area where the calçot originated, with farmhouses and restaurants that serve calçotadas in season." }
      - { nombre: "Alt Camp", lat: 41.36, lon: 1.32, desc: "Inland calçot country, with calçotadas in villages and farmhouses; booking recommended." }
  faq:
    - p: "What is a calçot?"
      r: "It is a variety of young spring onion typical of Catalonia. It is grilled over embers until the outer layer turns black, wrapped up so it steams in its own heat, and eaten with romesco sauce."
    - p: "When is calçot season?"
      r: "Roughly from December to April, with the peak between January and March."
    - p: "Where can I go for a calçotada?"
      r: "The Camp de Tarragona and the Alt Camp, with Valls as the capital, are the main areas, but there are restaurants and farmhouses serving calçotadas all over Catalonia."
    - p: "Do I need to book?"
      r: "Yes, in advance, especially at weekends and in January and February. Many places only serve a calçotada by prior order."
    - p: "How do you eat calçots?"
      r: "With your hands: hold it by the base, pull upwards to remove the burnt layer, dip it in romesco and eat the tender part. You usually wear a bib."
    - p: "What else is on the menu?"
      r: "Usually grilled meat (lamb, butifarra), beans, bread with tomato, dessert and wine or cava. It is a set menu charged per person."
carnaval-cadiz:
  texto:
    - "The Cádiz Carnival is one of the most famous and distinctive in Spain. Its soul is satire: chirigotas, comparsas, choirs and cuartetos that sing coplas full of humour and criticism about current affairs, filling the streets and theatres for weeks."
    - "The Concurso de Agrupaciones at the Gran Teatro Falla, in February, is the great showcase for the coplas. On the streets, the atmosphere of costumes, music and copla is at its best over Carnival weekend, with parades, a cavalcade and street groups singing in squares and on corners."
    - "Tickets for the Teatro Falla sell out very fast. The best of the Cádiz Carnival is on the street, no ticket needed: put on a costume, follow the groups and let the coplas take you by surprise. Book accommodation in advance and be ready for big crowds."
  faq:
    - p: "When is the Cádiz Carnival?"
      r: "It is held before Lent, between February and March depending on the year. The date depends on Easter."
    - p: "What are chirigotas?"
      r: "They are groups that sing satirical, humorous coplas about current affairs, in group costumes. It is the most popular genre of the Cádiz carnival."
    - p: "Do I need a ticket?"
      r: "For the Gran Teatro Falla contest, yes, and they sell out quickly. The street Carnival is free."
    - p: "Where can I see the street atmosphere?"
      r: "In the historic centre of Cádiz: streets and squares fill with groups and people in costume, especially at the weekend."
    - p: "Do I have to wear a costume?"
      r: "It is not compulsory, but lots of people do and the atmosphere is better if you join in. The most typical costumes are funny and full of criticism."
    - p: "Is it a good plan with children?"
      r: "Yes, there are family activities and a cavalcade. The nights are more crowded."
sant-jordi:
  texto:
    - "On 23 April, World Book Day and Sant Jordi (Saint George's Day) are celebrated, and the streets fill with book and rose stalls. In Catalonia the tradition is to give a rose and a book, and it is one of the best-loved festivals in Barcelona, with crowds out on the streets."
    - "In Barcelona, book and rose stalls take over Las Ramblas, the Paseo de Gracia and almost every neighbourhood, and many writers sign copies. International Book Day is also celebrated across Spain, with signings, readings and discounts in bookshops, and in Aragon it is Aragon Day."
    - "If you want to get a book signed, arrive early: the queues are long. Go in the morning or in the late afternoon, when it is less crowded, and check the list of authors and schedules at bookshops and publishers. And remember: you don't need to be from Catalonia to give a rose or a book."
  faq:
    - p: "When is Sant Jordi?"
      r: "Every 23 April. It coincides with World Book Day."
    - p: "What do people give as gifts?"
      r: "Traditionally, men give a rose and women give a book. Today both are exchanged between all kinds of people."
    - p: "Where should I go in Barcelona?"
      r: "Las Ramblas, the Paseo de Gracia and the streets of the centre fill with stalls. There are stalls in almost every neighbourhood."
    - p: "Are there author signings?"
      r: "Yes, many authors sign books at stalls, bookshops and fairs. Arrive early to avoid queues."
    - p: "Is it celebrated outside Catalonia?"
      r: "Yes, Book Day is celebrated across Spain and around the world, with activities in bookshops and libraries."
    - p: "Is it a good plan with children?"
      r: "Yes, there are storytelling sessions and children's activities. Watch out for the crowds in central Barcelona."
pilar:
  texto:
    - "The Fiestas del Pilar are Zaragoza's main festivities, in honour of the Virgen del Pilar, and are held around 12 October, which is also a national holiday. For a week, the city fills with concerts, parades, community events and a lively street atmosphere."
    - "The central moment is the Ofrenda de Flores (Flower Offering) on 12 October, when thousands of people, many in traditional Aragonese dress, parade through the centre to the Plaza del Pilar to lay their flowers before the Virgin and form a great floral mantle. The next day, 13 October, the Ofrenda de Frutos (Fruit Offering) takes place."
    - "Besides the offering, there are giants and big-heads (gigantes y cabezudos), concerts on different stages, fireworks displays and cultural and sporting events. Check the official programme from Zaragoza City Council. Book accommodation in advance, because it is a very popular festival and the centre fills up. And for the offering, arrive early if you want to see the parade."
  faq:
    - p: "When are the Fiestas del Pilar?"
      r: "Around 12 October. They last roughly a week, with the 12th as the main day."
    - p: "What is the Ofrenda de Flores?"
      r: "It is the parade in which thousands of people, many in traditional dress, bring flowers to the Virgen del Pilar to form a great floral mantle. It takes place on 12 October."
    - p: "Do I need to book?"
      r: "Not to see the offering. But do book accommodation, because Zaragoza fills up during the festivities."
    - p: "What else can I do?"
      r: "Concerts, giants and big-heads, fireworks shows, food fairs and children's activities. The city council publishes the official programme."
    - p: "Is it free?"
      r: "Most events are free, but some concerts and shows require a ticket."
    - p: "Is it a good plan with children?"
      r: "Yes, there are lots of children's activities and they usually love the parade of giants and big-heads. Watch out for the crowds on the 12th."
semana-santa-malaga:
  texto:
    - "Málaga's Holy Week stands out for its enormous thrones, carried on the shoulders of hundreds of bearers through the city centre. A Festival of International Tourist Interest, each procession is a spectacle of music, flowers, incense and popular emotion."
    - "The brotherhoods (cofradías) set out from their churches and neighbourhoods and head for the Carrera Oficial, along the Alameda and calle Larios, where there is a grandstand and seating. One much-anticipated event is Holy Thursday, with the Legion accompanying the Cristo de la Buena Muerte, although each day has its own processions and each neighbourhood its own atmosphere."
    - "Check the official programme from the Agrupación de Cofradías for times and routes. The streets in the centre fill up and the processions are slow, so arrive in good time and pick a spot. Book accommodation in advance and, if you can, also go to the neighbourhood processions, which are quieter."
  faq:
    - p: "When is Málaga's Holy Week?"
      r: "From Palm Sunday to Easter Sunday, between March and April depending on the year. There are also events beforehand, from Viernes de Dolores (Friday of Sorrows)."
    - p: "What makes it different?"
      r: "The thrones are huge and carried on shoulders, and the atmosphere blends faith, music and popular tradition. The Legion and the marching bands play an important role."
    - p: "Where can I watch the processions?"
      r: "On the Carrera Oficial (Alameda, calle Larios and plaza de la Constitución), where there is more atmosphere and more people. The neighbourhood processions are a quieter alternative."
    - p: "Do I have to pay?"
      r: "Watching the processions from the street is free. There are paid seats and grandstands on the Carrera Oficial."
    - p: "How do I check the schedules?"
      r: "The Agrupación de Cofradías publishes the official programme with the routes and the times of each brotherhood."
    - p: "Is it a good plan with children?"
      r: "Yes, with care: there are lots of people and long waits. Choose afternoon processions and a spot with space."
festival-jerez:
  texto:
    - "The Jerez Festival is one of the great flamenco events in the world. It takes place in late February and early March in Jerez de la Frontera, the city where this art form was born, with shows, classes and gatherings over two weeks."
    - "The programme includes dance, singing and guitar performances by established artists and emerging talent, at the Teatro Villamarta and other venues around the city. There are also flamenco classes open to amateurs and professionals, and activities in peñas (flamenco clubs) and tablaos (flamenco venues) that let you experience Jerez's flamenco atmosphere up close."
    - "Check the official website for the programme and tickets, which go on sale well in advance. Take the chance to visit the city's flamenco peñas and wineries, and to try the local Jerez cuisine. February nights are cool, so bring warm clothes."
  faq:
    - p: "When is the Jerez Festival?"
      r: "In late February and early March, for about two weeks. The exact dates are announced each year."
    - p: "Where does it take place?"
      r: "In Jerez de la Frontera, mainly at the Teatro Villamarta and other venues around the city."
    - p: "What is there besides the shows?"
      r: "Flamenco classes, gatherings and activities in peñas and tablaos."
    - p: "Where do I buy tickets?"
      r: "Through the festival's official channels. They go on sale in advance and the most popular shows sell out."
    - p: "Can I sign up for a class?"
      r: "Yes, there are classes for amateurs and professionals. Check registration details on the official website."
    - p: "What else is there to do in Jerez?"
      r: "Visit the wineries, the flamenco peñas and the Real Alcázar, and try the local cuisine."
sonar-festival-internacional-musica-avanzada-barcelona:
  texto:
    - "Sónar is one of Europe's major festivals of electronic music and digital creativity. It takes place in Barcelona in June, over three days, and combines concerts and DJ sets with exhibitions, talks and art and technology projects."
    - "The festival is split into two programmes: Sónar by Day, with open-air stages, sets and activities, and Sónar by Night, with big sets and concerts at a different venue, running until the early hours. It also includes a professional area devoted to creativity and technology."
    - "Tickets go on sale in advance, by day or as a full pass, and the line-up is announced months ahead. Buy only through official channels and check the entry conditions and the items allowed. Bring comfortable shoes, sunscreen for the daytime, earplugs and water, and plan your journey back from the night session in advance."
  faq:
    - p: "When is Sónar?"
      r: "In June, over three days. The exact dates are announced each year."
    - p: "Where does it take place?"
      r: "In Barcelona, at two venues: one for Sónar by Day and another for Sónar by Night."
    - p: "What is the difference between Sónar by Day and by Night?"
      r: "By day, open-air stages and activities; by night, large-scale sets and concerts until the early hours."
    - p: "Where do I buy tickets?"
      r: "Through the festival's official channels. There are day tickets and full passes. Be wary of resellers."
    - p: "What should I bring?"
      r: "Comfortable shoes, sunscreen and a cap for the daytime, earplugs and water. Check the allowed items before you go."
    - p: "How do I get home?"
      r: "Plan your transport in advance: after the night session the metro may be closed and taxi demand is very high."
bilbao-bbk-live:
  texto:
    - "Bilbao BBK Live is a music festival held in July on the slopes of Mount Kobetas, with views over the city of Bilbao. Over three days, it brings together pop, rock, indie and electronic artists in a very distinctive natural setting."
    - "The open-air, sloping site has several stages and a food and chill-out area. The line-up is announced months ahead and tickets go on sale in advance, either by day or as a full pass. It is a festival closely tied to the city: you get there by public transport and special services from the centre."
    - "Check the official website for entry conditions, allowed items and schedules. Bring comfortable shoes, warm clothes and a raincoat, because the weather in Bilbao can change quickly, and sunscreen if it is sunny. Book accommodation early, as the city fills up on those days."
  faq:
    - p: "When is Bilbao BBK Live?"
      r: "In July, over three days. The exact dates are announced each year."
    - p: "Where does it take place?"
      r: "On the slopes of Mount Kobetas, in Bilbao, with views over the city."
    - p: "How do I get to the site?"
      r: "By public transport and special services organised from the centre. Check the official website for details."
    - p: "Where do I buy tickets?"
      r: "Through the festival's official channels, by day or as a full pass. Avoid resellers."
    - p: "What should I wear?"
      r: "Comfortable shoes, warm clothes, a raincoat and sunscreen. The weather in Bilbao can change quickly."
    - p: "Is it a good plan with children?"
      r: "It depends on the line-up and the time of day. Check the entry conditions for minors on the official website."
fib-festival-internacional-benicassim:
  texto:
    - "The FIB, Festival Internacional de Benicàssim, is one of the longest-running and best-known festivals in Spain. It takes place in July in Benicàssim, on the Castellón coast, and combines concerts with beach, camping and a holiday atmosphere."
    - "Over four days, several stages bring together rock, indie, pop and electronic artists, with sets running until the early hours. Being close to the sea is one of its big attractions: many attendees use the morning to swim and rest before the afternoon and evening concerts."
    - "Tickets go on sale in advance, by day or as a pass, and there may be options that include camping. Buy only through official channels and check the entry conditions. July is very hot: bring sunscreen, a cap, water and comfortable shoes, and book accommodation early if you are not camping."
  faq:
    - p: "When is the FIB?"
      r: "In July, over four days. The exact dates are announced each year."
    - p: "Where does it take place?"
      r: "In Benicàssim, on the Castellón coast."
    - p: "Is there camping?"
      r: "There are usually camping options. Check the conditions on the official website."
    - p: "How do I buy tickets?"
      r: "Through the festival's official channels, by day or as a full pass. Avoid resellers."
    - p: "What should I bring?"
      r: "Sunscreen, a cap, water, comfortable shoes and swimwear, because the sea is nearby."
    - p: "Is it a good plan with children?"
      r: "It depends on the line-up and the time of day. Check the entry conditions for minors on the official website."
festival-internacional-cine-fantastico-cataluna-sitges:
  texto:
    - "The Sitges Film Festival is Spain's big festival of fantasy and horror cinema and one of the most important in the world in its genre. It takes place in October in Sitges, a seaside town near Barcelona, over about eleven days."
    - "The programme includes premieres of horror, science fiction, fantasy and thriller films, retrospectives, tributes and meetings with directors and actors. There are competitive and parallel sections, and a festive atmosphere among fans, with costumes and activities in the street."
    - "Sitges is about 35 kilometres from Barcelona and can be reached by Rodalies train, so you can go and come back in a day. Check the programme and buy tickets in advance, because popular screenings sell out. Book accommodation early if you want to stay, as the town fills up during the festival."
  faq:
    - p: "When is the Sitges Film Festival?"
      r: "In October, for about eleven days. The exact dates are announced each year."
    - p: "What kind of films are shown?"
      r: "Fantasy, horror, science fiction and thriller films, with premieres and retrospectives."
    - p: "How do I get there from Barcelona?"
      r: "By Rodalies train from Barcelona, in about 35-45 minutes. There are also buses and car options, although parking is difficult during the festival."
    - p: "Where do I buy tickets?"
      r: "Through the festival's official channels. Screenings with guests and premieres sell out."
    - p: "Do I have to dress up?"
      r: "It is not compulsory, but there is a very festive atmosphere and many fans do."
    - p: "Is it a good plan with children?"
      r: "It depends on the films: many are for adults. Check the age rating of each screening."
magostos:
  texto:
    - "The magosto is the great chestnut festival: a bonfire, roasted chestnuts, new wine and plenty of people gathered around. It is celebrated mostly in Galicia, Asturias (where it is called amagüestu) and El Bierzo, and its big day falls around Saint Martin's Day, on 11 November."
    - "There are family magostos, neighbourhood ones, village ones and some run by associations, and many town halls organise them open to everyone, sometimes with music, dancing and traditional games. In other inland areas, such as the Valle del Jerte in Extremadura, there is a similar tradition around All Saints' Day, known as the calbotá."
    - "To find one, check the agenda of the town hall or the local neighbours' association a few days beforehand: dates change every year and many are announced at short notice. Bring warm clothes, as you will be outdoors, and don't expect anything fancy: the fun lies in the bonfire and in eating the chestnuts hot, in good company."
  mapa:
    titulo: "Where magostos are held"
    centro: [41.8, -6.2]
    zoom: 6
    puntos:
      - { nombre: "Galicia (Ourense and Lugo)", lat: 42.4, lon: -7.6, desc: "The birthplace of the magosto: it is held in villages, neighbourhoods and schools, with the big date around Saint Martin's Day." }
      - { nombre: "Asturias", lat: 43.3, lon: -5.8, desc: "Here it is called amagüestu and is accompanied by new cider." }
      - { nombre: "El Bierzo (León)", lat: 42.55, lon: -6.6, desc: "Magostos in many villages of the region, right in the chestnut groves." }
      - { nombre: "Valle del Jerte (Cáceres)", lat: 40.2, lon: -5.8, desc: "Its version is the calbotá, around All Saints' Day." }
  faq:
    - p: "What is a magosto?"
      r: "It is a traditional autumn festival in which chestnuts are roasted on a bonfire and eaten with new wine, cider or must. It is typical of Galicia, Asturias and El Bierzo, although there are similar celebrations in other areas."
    - p: "When is it held?"
      r: "Mostly in November, with Saint Martin's Day, on 11 November, as the reference date. Many villages hold it on the nearest weekend, and there are also magostos at the end of October."
    - p: "Where can I go to a magosto?"
      r: "In Galicia, Asturias and El Bierzo there are magostos in plenty of villages and neighbourhoods. The most reliable way is to check the agenda of the town hall or the area a few days beforehand."
    - p: "Do I have to pay or book?"
      r: "It depends. Many popular magostos are free or ask for a small contribution, while others, organised by restaurants or wineries, require a booking. Ask the organiser."
    - p: "Can I hold a magosto at home?"
      r: "Yes. Cut a slit in the skin of each chestnut, roast them in a pan or in the oven and wrap them in a cloth for a few minutes before peeling them. Serve them with wine or cider, if you fancy."
    - p: "Is it a good plan with kids?"
      r: "Yes, the atmosphere is usually very family-friendly. Just keep an eye on the bonfire and make sure the chestnuts have cooled a little before eating them."

piscinas-naturales:
  imagen_alt: "Clear green pool among granite rocks with a swimmer in a mountain gorge"
  texto:
    - "Crystal-clear pools among granite rocks, small waterfalls and cool gorges in the height of summer: natural pools are one of the best ways to escape the heat without going to the coast. They are river or mountain stream water, with no chlorine and no lifeguard, which makes them as special as they are delicate."
    - "The best-known areas are in northern Cáceres and the Sistema Central: La Vera, the Valle del Jerte (with its famous Pilones), Las Hurdes and the Sierra de Gredos, in Ávila. There are also plenty in Galicia, Asturias, Cantabria, Castilla y León, the Pyrenees and Sierra Nevada, and the water is usually cold even in August."
    - "Get into the water slowly, especially if you have spent hours in the sun, because the change in temperature can cause thermal shock. Don't jump in without knowing the depth, watch out for slippery rocks and don't swim after heavy rain or when the water level is high. There is no supervision at the pools, so always go with company and pay special attention to children."
    - "Some pools, because of their fragility or the number of visitors, have a limited capacity, advance booking or regulated access in summer, and they fill up early on August weekends. Check the website of the town hall or the nature reserve beforehand and arrive early. Wear shoes that grip in the water, don't use soap or creams in the pool and take all your rubbish with you."
  faq:
    - p: "Where are there natural pools in Spain?"
      r: "The best-known areas are La Vera and the Valle del Jerte (Cáceres), Las Hurdes, the Sierra de Gredos (Ávila) and the Sistema Central, as well as many pools in Galicia, Asturias, Cantabria, the Pyrenees and Sierra Nevada."
    - p: "When should I go to a natural pool?"
      r: "From June to September, with July and August being the busiest months. If you want some peace and quiet, go on a weekday and arrive early. In those that depend on snowmelt or rain, the water level drops at the end of summer."
    - p: "Do I need to book or pay?"
      r: "They are almost always free, but some have a limited capacity, regulated access or paid parking in high season. Check the website of the town hall or the nature reserve before going."
    - p: "Are there lifeguards?"
      r: "Not at most pools and gorges, which are unsupervised river water. Go with company, don't leave children unsupervised and avoid swimming if the weather is bad or the water level has risen."
    - p: "What should I bring?"
      r: "Shoes that grip in the water (river sandals or water shoes), a towel, water, something to eat, sun protection and a bag for your rubbish. Don't use soap or creams in the pool."
    - p: "Can I go with kids or a dog?"
      r: "With kids, choose shallow, easy-to-reach pools, and always with an adult in the water. With a dog, it depends on the area: in some it is forbidden or the dog must be on a lead, so check the local regulations."

almendros:
  texto:
    - "Almond trees are the first to blossom in Spain. At the end of winter, while it is still cold, the hillsides are covered in white and pink flowers, and you can walk among them in especially beautiful light."
    - "Blossom usually runs from late January to March, depending on the area and the year, and the peak comes earlier in the south and on the islands. Mallorca, the Axarquía in Málaga, Tenerife and the Cartagena area are well-known destinations, and in several places there are signposted trails and dedicated festivals, such as the almond blossom festival in Tenerife."
    - "As the flowers last only a short time and depend on the weather, it is worth checking the state of the blossom a few days beforehand. Almond trees are crops with owners: walk along public paths, don't cut branches or pick flowers and don't enter closed estates. If you are allergic to pollen, bring medication, because there is a lot of it at this time of year."
  mapa:
    titulo: "Where to see almond blossom"
    centro: [37.5, -6.0]
    zoom: 5
    puntos:
      - { nombre: "Mallorca", lat: 39.65, lon: 2.95, desc: "The Pla de Mallorca and the inland hillsides fill up with white and pink almond trees." }
      - { nombre: "La Axarquía (Málaga)", lat: 36.85, lon: -4.3, desc: "A region of Málaga with almond trees in blossom from late January." }
      - { nombre: "Campo de Cartagena (Murcia)", lat: 37.65, lon: -1.0, desc: "Early blossom in the Campo de Cartagena, with trails among the almond trees." }
      - { nombre: "Tenerife", lat: 28.3, lon: -16.8, desc: "Almond trees in blossom in the west of the island, with the almond blossom festival." }
  faq:
    - p: "When do almond trees blossom?"
      r: "Between late January and March, depending on the area and the year. In the south and in the Balearic and Canary Islands it usually comes earlier."
    - p: "Where can I see almond blossom?"
      r: "Mallorca, the Axarquía (Málaga), Tenerife, the Cartagena area and other farming areas in the south and east of the mainland are the usual destinations."
    - p: "Can I pick the flowers or almonds?"
      r: "No. They are private crops, even if they look like open countryside. Enjoy them from the paths and respect the estates."
    - p: "How long does the blossom last?"
      r: "Very little, between one and two weeks per area, and it can be cut short by wind or rain. Check the state of the blossom before travelling."
    - p: "What should I bring?"
      r: "Walking shoes, warm clothes in layers, a camera and, if you have allergies, antihistamines. It is a good plan for taking photos at sunrise or sunset."
    - p: "Is it a good plan with kids?"
      r: "Yes, short walks among the almond trees are suitable for families, and it is a good moment to show how crops change with the seasons."

lavanda-brihuega:
  texto:
    - "In early July, the lavender fields of Brihuega, in the province of Guadalajara, turn purple. It is one of the most photogenic summer landscapes in Spain and, unlike Provence in France, you can get there in a couple of hours from Madrid."
    - "Blooming usually runs from late June to mid-July, with the peak in the first half of July, although it depends on the year. During those weeks the Lavender Festival is held in Brihuega, with activities, a market and music, and it is the time of greatest crowds."
    - "To enjoy it without the hassle, go first thing in the morning or at sunset, when the heat is lower and the light is nicer. Lavender fields are crops with owners: respect the boundaries and the areas set up for photos and walks, which are sometimes charged for. Bring a hat, sun protection and water, and bear in mind that there are lots of bees."
  mapa:
    titulo: "Where the lavender fields are"
    centro: [40.76, -2.87]
    zoom: 11
    puntos:
      - { nombre: "Brihuega (Guadalajara)", lat: 40.7625, lon: -2.8728, desc: "The lavender fields surround the town; the Lavender Festival is held there during the bloom." }
  faq:
    - p: "When does lavender bloom in Brihuega?"
      r: "From late June to mid-July, with the peak in the first half of July. It varies every year with the weather."
    - p: "Where are the lavender fields?"
      r: "In the surroundings of Brihuega (Guadalajara), with signposted access from the town. There are walking areas and viewpoints."
    - p: "What is the best time of day to go?"
      r: "First thing in the morning or at sunset, when it is less hot, there are fewer people and the light is nicer."
    - p: "Do I have to pay?"
      r: "Some areas set up for walking and photos charge a small entrance fee. Check the conditions before going, and don't enter unauthorised fields."
    - p: "What should I bring?"
      r: "A hat, sun protection, water and comfortable shoes. There are lots of bees, so it is best not to disturb them."
    - p: "Is it a good plan with kids?"
      r: "Yes, but bear in mind the heat and the bees, so keep an eye on the little ones, avoid the middle of the day and bring water."

halloween-difuntos:
  texto:
    - "On 31 October and 1 November, two very different traditions live side by side in Spain: Halloween, with costumes, haunted houses and kids' parties, and All Saints' Day, a day to remember the dead, with visits to the cemetery and its own sweets."
    - "Halloween is increasingly present, especially among young people and children, with themed parties, haunted houses and decorated theme parks. On 1 November, by contrast, it is a traditional public holiday: people visit cemeteries with flowers, eat huesos de santo and buñuelos de viento and, in Catalonia, panellets and chestnuts at the castañada."
    - "In many theatres, Don Juan Tenorio, by Zorrilla, is staged around these days, a tradition for 1 and 2 November. Check the listings and the town hall programmes, and if you go with kids, choose age-appropriate parties and celebrate the traditional side too."
  faq:
    - p: "What is celebrated on 1 November?"
      r: "All Saints' Day (Día de Todos los Santos), a public holiday throughout Spain, when the dead are remembered and cemeteries are visited with flowers."
    - p: "What sweets are eaten?"
      r: "Huesos de santo, buñuelos de viento and, in Catalonia, panellets and chestnuts at the castañada."
    - p: "What is the castañada?"
      r: "A traditional Catalan All Saints' festival in which chestnuts, panellets and sweet potatoes are eaten."
    - p: "What can I do at Halloween?"
      r: "Costume parties, haunted houses, haunted attractions and mystery trails. Many theme parks and town halls organise activities."
    - p: "What is Don Juan Tenorio?"
      r: "A play by José Zorrilla traditionally staged around these dates in many theatres."
    - p: "Is it a good plan with kids?"
      r: "Yes, there are lots of children's activities for Halloween. If you go to a cemetery, it is worth explaining to them the calm meaning of the visit."
fiesta-piraguas-descenso-internacional-sella:
  texto:
    - "The International Sella Canoe Descent (Descenso Internacional del Sella) is one of the most popular festivals in Asturias and one of the best known in Spain. Every August, thousands of paddlers race down the Sella River between Arriondas and Ribadesella, while thousands of people enjoy it from the banks, with food, drink and a great atmosphere."
    - "It is a Festival of International Tourist Interest and mixes sporting competition, tradition and popular celebration. Participants cover about twenty kilometres along the river, and the route can be watched from several points and from the banks, with picnics and music all along the way."
    - "If you want to watch the descent, choose a spot with good access, arrive early and keep in mind that traffic gets difficult and that Arriondas and Ribadesella fill up with people. To take part, you need to sign up in advance. Bring water, sunscreen and comfortable shoes."
  faq:
    - p: "When is the Sella Descent?"
      r: "Usually on the first Saturday of August. Check the exact date each year."
    - p: "Where does it take place?"
      r: "On the Sella River, between Arriondas and Ribadesella, in Asturias."
    - p: "How can I watch it?"
      r: "From the riverbanks, with a picnic and a festive atmosphere, or from designated viewing points. The finish is in Ribadesella."
    - p: "Can I take part?"
      r: "Yes, but you must sign up in advance and meet the organisers' requirements."
    - p: "How do I get there?"
      r: "Allow plenty of time: traffic gets difficult. Consider the organised transport and the designated car parks."
    - p: "Is it a good plan with kids?"
      r: "Yes, the riverside atmosphere is family-friendly, but it is crowded and hot. Bring water and sunscreen."
festival-womad-caceres:
  texto:
    - "WOMAD Cáceres is a world-music festival that turns the squares of the monumental old town into open-air stages. It takes place in May and combines concerts by artists from different countries with workshops, activities for children and food."
    - "The setting is part of its charm: medieval squares, palaces and stone streets in a UNESCO World Heritage city. Many of the concerts are held in open squares, and the festival also offers cultural and leisure activities for all ages."
    - "Check the official website for the programme, the squares and the schedules, and to find out which concerts are free and which require a ticket or pass. Wear comfortable shoes, because the streets are cobbled, and dress in layers. Book accommodation in advance: Cáceres fills up during the festival."
  faq:
    - p: "When is WOMAD Cáceres?"
      r: "In May, over a few days. The exact dates are announced each year."
    - p: "What kind of music is there?"
      r: "World music: folk, fusion, ethnic and traditional music from different countries."
    - p: "Where are the concerts held?"
      r: "In squares and spaces of the monumental old town of Cáceres. Check the programme."
    - p: "Are all the concerts free?"
      r: "It depends on the edition. Some concerts are free to attend and others require a ticket or pass. Check the official website."
    - p: "What should I bring?"
      r: "Comfortable shoes, because the streets are cobbled, and clothes you can layer."
    - p: "Is it a good plan with kids?"
      r: "Yes, the festival usually includes workshops and activities for children. Check the programme."
fiestas-vendimia-riojana:
  texto:
    - "The San Mateo and Rioja Grape Harvest Festivities (Fiestas de San Mateo y de la Vendimia Riojana) are the main festivities of Logroño and one of the best ways to experience the grape harvest in La Rioja. They are held in September, over a week, with traditional events linked to wine and a lively street atmosphere."
    - "One of the most emblematic moments is the treading of the grapes and the offering of the first must to the Virgen de Valvanera, patron saint of La Rioja. Throughout the week there are also concerts, parades, popular activities, tastings and shows for all audiences, and the city fills up with visitors."
    - "Take the chance to try the pintxos on Calle Laurel and the surrounding streets, and to visit a winery in the area, since many organise tastings and visits during the harvest. Check the official programme from the town hall, book accommodation in advance and, if you plan to visit a winery, book that ahead too."
  faq:
    - p: "When are the San Mateo festivities?"
      r: "Around 21 September, for a week. The exact dates are announced each year."
    - p: "What is the grape treading?"
      r: "It is a symbolic harvest ceremony in which grapes are trodden and the offering of the first must to the Virgen de Valvanera, patron saint of La Rioja, begins."
    - p: "What else can I do?"
      r: "Concerts, popular events, tastings and winery visits. Check the official programme."
    - p: "Where should I eat?"
      r: "On Calle Laurel and the surrounding streets there are many pintxo bars, one of Logroño's great attractions."
    - p: "Can I visit wineries?"
      r: "Yes, many organise visits and tastings. It is best to book in advance, especially during the harvest."
    - p: "Is it a good plan with kids?"
      r: "Yes, there are family activities during the festivities. Check the programme."
fiesta-marisco:
  texto:
    - "The O Grove Seafood Festival (Fiesta del Marisco de O Grove) is one of the great food events in Galicia. It is held in October, over a few days, and brings thousands of visitors together around shellfish from the Galician rías, with stalls, tastings and shows."
    - "O Grove, on the Ría de Arousa, is famous for its seafood: oysters, mussels, clams, cockles, queen scallops, scallops and spider crab, among others. During the festival, producers and restaurants offer their products on the festival grounds, and there are also cultural and musical activities."
    - "Check the town hall's official programme for dates and times. Arrive early, especially at weekends, and go on a weekday if you want to avoid the crowds. If you are allergic to shellfish or pregnant, check beforehand what you can eat. Book accommodation in advance: the area fills up."
  faq:
    - p: "When is the O Grove Seafood Festival?"
      r: "In October, over a few days. The exact dates are announced each year."
    - p: "What shellfish can I try?"
      r: "Oysters, mussels, clams, cockles, queen scallops, scallops or spider crab, depending on the season and what each stall offers."
    - p: "Do I have to pay to get in?"
      r: "Check the town hall's official programme, which details the access conditions and the tastings."
    - p: "When is the best time to go?"
      r: "On weekdays and early in the day, to avoid the crowds. It gets very busy at weekends."
    - p: "What else is there to do in O Grove?"
      r: "Visit A Toxa island, the beaches of the peninsula and take a boat trip around the ría."
    - p: "Is it a good plan with kids?"
      r: "Yes, although it is best to go early and avoid the busiest hours."
maraton-malaga:
  texto:
    - "The Málaga Marathon is one of the great mass-participation athletics events in Spain, with marathon and half-marathon distances that run through the city in early December. Málaga's mild climate at that time of year and a fast course along the seafront promenade make it very appealing for runners."
    - "The race brings together thousands of participants of all levels, from professional runners to amateurs chasing a personal best, and it is also a plan for spectators, who cheer from the street. The route crosses parts of the city centre and the waterfront."
    - "If you want to run, sign up in advance on the official website and check the participation requirements. If you want to cheer, pick a spot along the route on the seafront promenade or in the centre and keep in mind that there will be road closures. Wear comfortable clothes and bring water and patience."
  faq:
    - p: "When is the Málaga Marathon?"
      r: "In early December, usually on a Sunday. The exact dates are announced each year."
    - p: "What distances are there?"
      r: "Marathon and half-marathon. Check the official website in case there are other races."
    - p: "How do I sign up?"
      r: "On the race's official website, in advance. Check the participation requirements and deadlines."
    - p: "Where can I watch the race?"
      r: "Along the route, especially on the seafront promenade and in the centre. Check the official map."
    - p: "Are there road closures?"
      r: "Yes. Check the closures and times on the official website and with the town hall."
    - p: "What is the weather like in Málaga in December?"
      r: "It is usually mild, although there can be rain or wind. Wear layers."
playas-fluviales:
  texto:
    - "A river beach (playa fluvial) is a bathing area set up on a river, a reservoir or a lake, with sand or grass, signposted access and, in many cases, services such as parking, a beach bar, toilets or a lifeguard. It is a very convenient way to spend the day in the water without going to the coast, ideal for families and for people who live inland."
    - "You will find them in almost every region: Extremadura, Castile and León, Castilla-La Mancha, Galicia, Aragon, Madrid and Asturias all have very popular bathing areas, and the San Juan reservoir, in Madrid, is a classic. The season runs from June to September, with July and August as the busiest time."
    - "Even if they look like a beach, they are still fresh water with currents, uneven bottoms and, in reservoirs, water levels that change. Swim only in the marked area, don't go far from the shore with children, and respect the flags and notices. In summer there can be occasional closures because of water quality, for example because of algae blooms, so it is worth checking."
    - "Before you go, check the town hall's website and the health information on bathing areas, which is published on the Ministry of Health's Náyade system. Bring a parasol, water shoes because the bottom is often stone or mud, water and sunscreen, and arrive early at weekends: the best-known ones fill up."
  faq:
    - p: "What is a river beach?"
      r: "It is a marked bathing area on a river, a reservoir or a lake, with sand or grass and, often, services such as parking, a beach bar, toilets and a lifeguard. It is fresh water, not salt water."
    - p: "When should I go to a river beach?"
      r: "From June to September. In July and August there is more atmosphere and also more people, so if you want some peace and quiet, go on a weekday or first thing in the morning."
    - p: "How do I know if the water is safe for swimming?"
      r: "The water quality of official bathing areas is published on the Ministry of Health's Náyade system, and there are usually signs at the beach itself. In summer there can be occasional closures, for example because of algae, so it is worth checking beforehand."
    - p: "Are there lifeguards?"
      r: "At many of them there are, during the high season, but not at all. If there aren't, take extra care with children, swim only in the marked area and don't go far from the shore."
    - p: "What should I bring?"
      r: "A parasol, sunscreen, water, water shoes (the bottom is often stone or mud) and a bag for your rubbish. Many have a beach bar, but not always."
    - p: "Can I go with children or a dog?"
      r: "With children it is a very easy plan, but always supervise them in the water. With a dog it depends on the beach: some ban them or have a specific area, so check the local rules."
verbenas:
  texto:
    - "Between July and September, almost every village in Spain celebrates its patron saint festivities (fiestas patronales). These are weeks of verbenas (open-air dances with a live band), peñas (friends' social clubs), processions, concerts, communal meals and activities for the little ones, and a very cheap way to see village life from the inside."
    - "August has most of them, especially around the 15th, the feast of the Assumption, although there are festivals on practically every date of the summer. Each region has its own style: in Castile and León and Castilla-La Mancha, peñas and popular bull-running events are common, in Galicia the romerías (pilgrimage festivals), and in the north contests and traditional music."
    - "The most useful thing before you go is to check the programme on the town hall's website or social media. Verbenas usually start late, often after midnight, and are normally free to enter. If you are coming from outside, bear in mind parking and the way back, and respect the neighbours' rest."
  faq:
    - p: "When are the village festivals?"
      r: "Mostly from July to September, with August as the busiest month. Each village has its own date, normally tied to its patron saint, and the programmes are usually published a few weeks beforehand."
    - p: "How do I find a village's festivals?"
      r: "The most reliable source is the town hall's website or social media, where the full programme is published. You can also check the sinplanes agenda by province."
    - p: "Are verbenas free?"
      r: "Almost always: entry to verbenas and to most popular events is free. Some communal meals or specific shows may need a ticket."
    - p: "What time do they start?"
      r: "Verbenas with a live band usually start late and go on until the early hours. Children's activities, processions and communal meals are scheduled during the day."
    - p: "What should I bring?"
      r: "Comfortable clothes, something warm for the night, shoes that can take it if you are going to dance or visit the peñas, and cash, because some bars and stalls don't take cards."
    - p: "Is it a good plan with kids?"
      r: "Yes, most festivals have children's activities during the day. At night the atmosphere is more adult, so consider the noise and the time."
matanza:
  texto:
    - "The matanza is a deeply rooted rural tradition in Castile and León, Extremadura and other parts of Spain: the home-made production of chorizos, black puddings (morcillas), hams and other cured sausages in winter. Today many villages celebrate it as a food festival, with demonstrations, tastings and communal meals."
    - "It is normally held between December and February, when it is cold enough to cure the sausages. During these events you can try typical products such as chorizo, morcilla, farinato, patatas meneás (mashed potatoes with paprika and bacon), jijas or garlic soup, and see up close how this family and neighbourhood job used to be done."
    - "To go, check the programme of the town hall or the organising association: many events are free and others ask you to book a place or buy a tasting ticket. Some demonstrations include scenes that can be hard for the more sensitive or for children, so it is best to find out before attending."
  mapa:
    titulo: "Where to go to a matanza festival"
    centro: [40.2, -5.8]
    zoom: 7
    puntos:
      - { nombre: "Guijuelo and the Sierra de Béjar (Salamanca)", lat: 40.56, lon: -5.67, desc: "Land of cured sausages and Iberian ham, with matanza events in villages of the area in winter." }
      - { nombre: "Zamora (Sayago and Aliste)", lat: 41.5, lon: -6.2, desc: "Areas of Zamora where the home matanza is still kept alive and celebrated at local festivals." }
      - { nombre: "Montánchez (Cáceres)", lat: 39.21, lon: -6.15, desc: "The Extremaduran mountains of hams and chorizos, with traditional matanza events in winter." }
  faq:
    - p: "What is the matanza?"
      r: "It is the traditional making of cured sausages and other pork products in winter. It was a family and neighbourhood job, and today it is revived at festivals with demonstrations and tastings."
    - p: "When is it held?"
      r: "Normally from December to February, although the dates vary from one village to another. Check each town's programme."
    - p: "Where are there matanza festivals?"
      r: "Mainly in Castile and León and Extremadura, and also in other rural areas. Look at the town hall's agenda or the sinplanes agenda by province."
    - p: "What can I try?"
      r: "Chorizo, morcilla, farinato, patatas meneás, jijas, garlic soup and pork products, depending on the area. Many events include a tasting menu."
    - p: "Is it free?"
      r: "It depends. Some events are free and others require buying a ticket or booking a place for the tastings."
    - p: "Is it a good plan with kids?"
      r: "Sometimes. Some demonstrations can be hard for the little ones, so it is best to ask beforehand what they include. Many festivals also have children's activities."
flores-primavera:
  texto:
    - "In April and May, the fields, the dehesas (open oak pastureland) and the mid-mountain slopes fill with flowers. Poppies, rockroses, daisies, daffodils and other species colour landscapes that, for a few weeks, look like a different place. It is a simple, cheap and very photogenic plan."
    - "The best time depends on the area and the altitude, and on how much it rained in winter: a good spring gives especially showy fields. In the dehesas of Extremadura and Andalusia, in the fields of Castile and in the mountain meadows there are easy routes to enjoy them. In high areas, flowering is delayed until May and June."
    - "Choose marked trails and, ideally, go on a weekday. Don't pick flowers, don't trample crops and don't leave the paths: many fields are sown land or pasture. If you have pollen allergies, bring medication, and check your clothes when you get back, because in spring there are ticks in some areas."
  mapa:
    titulo: "Where to see fields of flowers"
    centro: [40.0, -4.5]
    zoom: 6
    puntos:
      - { nombre: "Extremaduran dehesa (Cáceres)", lat: 39.3, lon: -6.9, desc: "Holm oak and cork oak dehesas with flower meadows, around the Sierra de San Pedro and Monfragüe." }
      - { nombre: "Andalusian dehesa (Seville)", lat: 37.95, lon: -5.8, desc: "The Sierra Norte de Sevilla, with dehesas, rockrose scrub and easy routes." }
      - { nombre: "Fields of Castile (Palencia)", lat: 42.1, lon: -4.8, desc: "Tierra de Campos and the Castilian moorland plateaus, with poppies among the crops." }
      - { nombre: "Mountain meadows (Picos de Europa)", lat: 43.2, lon: -4.85, desc: "Meadows with daffodils and other flowers, with later flowering, until May and June." }
  faq:
    - p: "When is the best time to see flowers?"
      r: "Between April and May in most of Spain. In the mountains it is delayed to June, and in the south and on the islands it can start in March."
    - p: "Where can I see fields of flowers?"
      r: "The dehesas of Extremadura and Andalusia, the fields of Castile, mountain meadows and natural parks are good places. Look for marked routes."
    - p: "Can I pick flowers?"
      r: "Better not. Many are protected and, in farmland, you damage the crop. Enjoy them and take photos."
    - p: "What should I bring?"
      r: "Comfortable shoes, layered clothing, a hat, sunscreen, water and, if you have allergies, medication. Check your clothes when you get back in case of ticks."
    - p: "Is there a risk of allergies?"
      r: "Yes, pollen is intense in spring. If you are allergic, talk to your doctor and avoid the middle of the day and windy days."
    - p: "Is it a good plan with kids?"
      r: "Yes, with short, flat routes. Teach them not to pick flowers or walk into cultivated fields."
museos-gratis:
  texto:
    - "Many museums in Spain have free entry hours or days, and making use of them is one of the best ways to enjoy a cultural plan without spending money. With a bit of planning, you can see world-class collections at almost no cost."
    - "State-owned museums are usually free on Saturday afternoons and on Sundays, and some have free hours during the week. The large national museums have their own hours and conditions. There are also special dates such as International Museum Day, on 18 May, or Museum Night, with free entry or special activities."
    - "Hours and conditions change, so always check each museum's website before you go. In many cases you need to pick up a free ticket, and the free hours are the busiest, so arrive early or be patient with the queues. Under-18s, students, retirees and other groups almost always get free or reduced entry."
  faq:
    - p: "When is it free to enter a museum?"
      r: "It depends on each museum. State museums are usually free on Saturday afternoons and on Sundays, and many have free hours during the week. Always check their website."
    - p: "What is International Museum Day?"
      r: "It is held on 18 May and many museums open for free or with special activities. It is a good opportunity to visit collections."
    - p: "Do I need to book a ticket?"
      r: "Sometimes. During free hours many museums ask you to pick up or reserve a free ticket, and there are queues."
    - p: "Who always gets free entry?"
      r: "At many museums, children under 18, some students and retirees, people who are unemployed or have a disability, and other groups. Check each museum's conditions."
    - p: "How do I avoid the queues?"
      r: "Go on a weekday, at the start of the free window, and book if you can. Weekends get very crowded."
    - p: "Is it a good plan with kids?"
      r: "Yes, many museums have family tours and workshops, and entry for children is usually free."
belenes:
  texto:
    - "The nativity scene is one of the best-loved Christmas traditions: figures, landscapes and scenes that depict the birth of Jesus, sometimes in enormous, highly detailed displays. Visiting nativity scenes is a quiet plan to enjoy with the family, and it combines well with a stroll through the city centre."
    - "From December until Epiphany (Three Kings' Day), town halls, churches, museums, nativity-scene associations and other organisations open nativity exhibitions, many of them free. Some are especially well known, such as the nativity scene at the Salzillo Museum in Murcia, the one in Plaça de Sant Jaume in Barcelona or the Belén de Tirisiti in Alcoy."
    - "Besides the nativity scenes on display, many villages stage living nativity scenes, with locals acting out scenes and trades of the time. They take place mostly in December and early January. Check dates and times with the town hall, because they are usually one-off events, and wrap up warm if they are outdoors."
  faq:
    - p: "When can you see nativity scenes?"
      r: "From early December until Epiphany (Three Kings' Day), although some stay up until February. Living nativity scenes are concentrated in December and early January."
    - p: "Where can you see nativity scenes?"
      r: "In town halls, churches, museums and nativity-scene associations. Many cities have a municipal nativity scene in a central square."
    - p: "What is a living nativity scene?"
      r: "It is a re-enactment of the Nativity in which locals act out scenes and trades. It is usually held outdoors, on a specific date, and is very popular in villages."
    - p: "Do you have to pay?"
      r: "Most nativity exhibitions are free. Some museum nativity scenes or very large ones may charge an entrance fee."
    - p: "Is it a good plan with kids?"
      r: "Yes, it is one of the most rewarding. They love hunting for figures and details, and some nativity scenes have movement and sound."
    - p: "How long does it take?"
      r: "A visit to a nativity scene usually lasts between 20 minutes and an hour. It combines well with a Christmas market or a walk to see the lights."
semana-santa-valladolid:
  texto:
    - "Holy Week in Valladolid is austere and intense, and stands out for its polychrome wooden sculpture, the work of great Castilian sculptors such as Gregorio Fernández and Juan de Juni. It is a Festival of International Tourist Interest and draws visitors from all over Spain."
    - "The floats (pasos) travel through the streets of the city centre with brotherhoods (cofradías), brass and drum bands and a great deal of silence. Good Friday brings two highly anticipated events: the Sermon of the Seven Words in the Plaza Mayor and the General Procession of the Sacred Passion, in which the city's main floats take part."
    - "If you want to go deeper, the National Museum of Sculpture in Valladolid holds works by the same sculptors and is a good complement. Check the official programme, get to a good spot early and wrap up warm, because April nights in Castile are chilly."
  faq:
    - p: "When is Holy Week in Valladolid?"
      r: "From Palm Sunday to Easter Sunday, which falls between March and April depending on the year."
    - p: "What makes it special?"
      r: "Castilian polychrome wooden sculpture, with floats of great artistic value, and a sober, silent atmosphere."
    - p: "Which procession should you not miss?"
      r: "The General Procession of the Sacred Passion, on Good Friday afternoon, which brings together the main floats. The Sermon of the Seven Words, held the same day in the Plaza Mayor, is also very popular."
    - p: "Where can you see the floats outside Holy Week?"
      r: "At the National Museum of Sculpture in Valladolid, with works by Gregorio Fernández and Juan de Juni."
    - p: "What should you wear?"
      r: "Warm clothes: in Valladolid, March and April afternoons and evenings are chilly, and you spend a lot of time outdoors."
    - p: "Is it a good plan with kids?"
      r: "With some care: there are big crowds and long waits. Choose afternoon processions and a spot with some room."
semana-santa-salamanca:
  texto:
    - "Holy Week in Salamanca is experienced amid golden stone, with processions winding through the streets and squares of a World Heritage city. The brotherhoods (cofradías and hermandades) bring out floats of great artistic value in a solemn, devout atmosphere."
    - "Many processions pass through the Plaza Mayor and around the Cathedral, in a setting that is hard to match. One of the most moving events is the Cristo Yacente procession, and each brotherhood has its own style and route."
    - "The poster for Holy Week 2027 features the Piedad of the Dominican Brotherhood, Our Lady of Sorrows, a carving by Salvador Carmona. It is the photograph “El brillo del dolor” (“The Glow of Sorrow”), by Pablo Julián Mateos, first prize in the 42nd “Semana Santa Salmantina-Memorial Lorenzo Rodríguez Durán” Photography Competition, which captures the float's return to the church of the San Esteban convent. Second prize went to “Tres cruces” (“Three Crosses”), by David Gómez Rollán, which will be the cover of Christus magazine. The celebration is a Festival of International Tourist Interest."
    - "Check the brotherhoods' official programme for times and routes. If you plan to watch processions at night, wrap up warm: April nights in Salamanca are cold. Book accommodation in advance, because the city fills up with visitors, and respect the silence of the processions."
  faq:
    - p: "When is Holy Week in Salamanca?"
      r: "From Palm Sunday to Easter Sunday, between March and April depending on the year."
    - p: "Where can you watch the processions?"
      r: "In the Plaza Mayor and the streets of the old town, especially near the Cathedral. Each brotherhood has its own route."
    - p: "Which procession is the most moving?"
      r: "The Cristo Yacente is one of the most memorable, with a very solemn atmosphere. Check the programme for the exact day and time."
    - p: "Which image announces Holy Week in Salamanca 2027?"
      r: "The Piedad of the Dominican Brotherhood (Our Lady of Sorrows), in the photograph “El brillo del dolor” by Pablo Julián Mateos, winner of the photography competition and the 2027 poster."
    - p: "Is it free?"
      r: "Yes, watching the processions from the street is free."
    - p: "What should you wear?"
      r: "Warm clothes, because nights in Salamanca are cold, and comfortable shoes."
    - p: "Is it a good plan with kids?"
      r: "Yes, with caution: there are big crowds and long waits."
semana-santa-caceres:
  texto:
    - "Holy Week in Cáceres takes place in the monumental old town, a World Heritage site, and the setting gives every procession a special charm. The floats travel through medieval squares, narrow lanes and palaces, between stone walls and lanterns."
    - "The brotherhoods (cofradías) set out from their churches in the old town and other neighbourhoods, in sober, deeply devout processions. The combination of heritage and tradition makes Cáceres a good destination for those who want to experience a Holy Week that is less crowded than those of the big cities."
    - "Check the brotherhoods' official programme for times and routes, and book accommodation in advance. Walk around the old town in comfortable shoes, as the streets are cobbled, and respect the silence of the processions."
  faq:
    - p: "When is Holy Week in Cáceres?"
      r: "From Palm Sunday to Easter Sunday, between March and April depending on the year."
    - p: "Where can you watch the processions?"
      r: "In the monumental old town, with its squares and lanes, and in other neighbourhoods. Each brotherhood has its own route."
    - p: "What makes it different?"
      r: "The monumental stone setting and a devout atmosphere, with fewer crowds than in the big cities."
    - p: "Is it free?"
      r: "Yes, watching the processions from the street is free."
    - p: "What shoes should you wear?"
      r: "Comfortable shoes with a good sole: the streets of the old town are cobbled and there are slopes."
    - p: "Is it a good plan with kids?"
      r: "Yes, with caution because of the waiting and the crowds."
semana-santa-marinera-valencia:
  texto:
    - "Valencia's Seafarers' Holy Week (Semana Santa Marinera) is held in the seafaring districts of El Cabanyal, El Canyamelar and El Grau, by the sea. It is a Festival of International Tourist Interest and has a character all its own, tied to the life of the fishermen and the Mediterranean."
    - "It begins on Friday of Sorrows and runs until Easter Sunday, with processions through the streets of these districts, with their bands, their brotherhoods (cofradías) and their popular atmosphere. The finale is the Resurrection Procession on Easter Sunday, more festive and full of colour."
    - "Check the official programme, with the times and routes of the processions, and combine your visit with a walk on the beach and a paella by the sea. Allow plenty of time and avoid driving, because some streets are closed to traffic."
  faq:
    - p: "When is the Seafarers' Holy Week?"
      r: "From Friday of Sorrows to Easter Sunday, between March and April depending on the year."
    - p: "Where does it take place?"
      r: "In Valencia's seafaring districts: El Cabanyal, El Canyamelar and El Grau."
    - p: "What makes it different?"
      r: "Its seafaring, popular character, with processions by the sea and a festive final Resurrection."
    - p: "How do you get there?"
      r: "By metro, tram or bus. Nearby streets are closed to traffic during the processions."
    - p: "Is it free?"
      r: "Yes, watching the processions from the street is free."
    - p: "Is it a good plan with kids?"
      r: "Yes, the Sunday Resurrection is especially festive and family-friendly."
super-bowl:
  texto:
    - "The Super Bowl is the final of the NFL, the American football league, and one of the most-watched sporting events in the world. It is held on the second Sunday of February and, because of the time difference, it airs in Spain in the early hours, from Sunday into Monday."
    - "Besides the game, the Super Bowl is a show in its own right: a halftime concert with big-name artists, the most eagerly awaited ads and a whole food tradition, with chicken wings, nachos and burgers. In Spain, many sports bars and restaurants open to show it, sometimes with themed menus."
    - "If you plan to watch it live, get ready for a long night: the game ends well into the early hours and there is work the next day. One alternative is to watch the highlights the following day. Check the schedule of the channel that broadcasts it and that year's dates."
  faq:
    - p: "When is the Super Bowl?"
      r: "On the second Sunday of February. In Spain it airs in the early hours, already on Monday."
    - p: "What time does it start?"
      r: "On US East Coast time, which in Spain means the middle of the night. The game lasts around three and a half hours including halftime."
    - p: "Where can I watch it?"
      r: "At home or in sports bars that show it. Some restaurants put on themed menus."
    - p: "What do people eat?"
      r: "Traditionally chicken wings, nachos, burgers and beer, although every venue has its own menu."
    - p: "Do I need to know about American football?"
      r: "No. Many viewers watch it for the halftime show and the ads."
    - p: "Is it a good plan with friends?"
      r: "Yes, either at home or in a bar. Just keep in mind that it is a long night."
goya:
  texto:
    - "The Goya Awards gala is the big night of Spanish cinema. The Academy of Cinematographic Arts and Sciences of Spain presents its awards to the year's best films, directors, actors, screenwriters and technicians, in a ceremony held in February and broadcast live."
    - "The gala becomes a social event: red carpet, dresses, speeches, musical numbers and humour. The nominees are announced weeks beforehand, and it is a good time to see the films in the running, which are often re-released in cinemas or put on streaming platforms."
    - "To enjoy the gala, check the schedule of the channel that broadcasts it and get some popcorn ready. Some cinemas and venues organise special screenings and big-screen broadcasts. If you want to add a challenge, set up a prediction pool with your friends to guess the winners."
  faq:
    - p: "When is the Goya gala?"
      r: "Usually on a Saturday in February. The exact date and venue change every year."
    - p: "Where is it broadcast?"
      r: "Live on television and online. Check the schedule of the channel that airs it."
    - p: "Can I attend the gala?"
      r: "It is an invitation-only event. The usual way to follow it is live on television."
    - p: "How do I get ready?"
      r: "Watch the nominated films beforehand. Many are re-released in cinemas or available on streaming platforms."
    - p: "Is there a red carpet open to the public?"
      r: "In some editions there are areas where the public can watch the guests arrive. Check the organisers' information."
    - p: "Is it a good plan with friends?"
      r: "Yes, many people enjoy it at home or in a bar or cinema with a big screen, prediction pool included."
oscars:
  texto:
    - "Oscars night is the big event of world cinema. It takes place at the Dolby Theatre in Los Angeles, normally on a Sunday in March and, because of the time difference, it airs in Spain in the early hours."
    - "The nominees are announced weeks beforehand, and it is the ideal time to watch the nominated films, which are usually in cinemas or on streaming platforms. Many people set up a prediction pool, a film marathon or a movie night with friends, and some venues organise special screenings."
    - "If you plan to follow the gala live, get ready to stay up late: it starts in the evening there and ends well into the early hours here. Another option is to catch the main awards the next day in the media roundups. Check the schedule of the channel that broadcasts the gala in Spain."
  faq:
    - p: "When are the Oscars?"
      r: "On a Sunday in March, with the gala held in the evening in Los Angeles. In Spain it airs in the early hours."
    - p: "Where are they broadcast in Spain?"
      r: "Live, on television and streaming platforms. The schedule changes every year, so check it."
    - p: "What time does it start?"
      r: "On Los Angeles time. In Spain that means the early hours, and the ceremony lasts several hours."
    - p: "How do I get ready?"
      r: "Watch the nominated films beforehand, as they are usually in cinemas or on streaming platforms, and set up a prediction pool to guess the winners."
    - p: "Can I attend?"
      r: "It is an invitation-only event. The usual way to follow it is on television."
    - p: "Is it a good plan with friends?"
      r: "Yes, many people enjoy it in a group, with a prediction pool and a snack-dinner. You can also watch a recap the next day."
eurovision:
  texto:
    - "The Eurovision final is one of the most-watched nights of the year in Spain. The festival brings together artists from dozens of countries who compete with a live song, with spectacular staging, and thousands of people enjoy it in groups with prediction pools and themed parties."
    - "The final takes place on a Saturday in May, preceded by two semi-finals in the same week. Spain is one of the so-called Big Five and goes straight to the final. The winner is decided by adding up the votes of each country's professional juries and the public televote."
    - "To enjoy it, throw a party at home: a prediction pool to guess the winner, a scorecard for the songs and some snacks. Some bars and venues organise big-screen broadcasts. Check the schedule of the channel that airs the festival and that year's dates."
  faq:
    - p: "When is the Eurovision final?"
      r: "On a Saturday in May, after two semi-finals in the same week. The date and host city change every year."
    - p: "How does the voting work?"
      r: "Each country awards points based on a professional jury vote and the public televote. The song with the most points wins."
    - p: "Does Spain go straight to the final?"
      r: "Yes, Spain is among the automatic finalists, the so-called Big Five, along with the host country."
    - p: "Where is it broadcast?"
      r: "Live on television and online. Check the schedule."
    - p: "How do I make the most of it?"
      r: "At home with friends, with a prediction pool and scorecards, or in a bar or venue that shows it on a big screen."
    - p: "Is it a good plan with kids?"
      r: "Yes, the show is very visual and family-friendly, although it finishes late."
final-champions:
  texto:
    - "The Champions League final is the big date of club football in Europe and one of the most-watched sporting nights of the year. It is held on a Saturday in late May or early June and, when a Spanish team plays, the city is filled with atmosphere."
    - "To watch it, many bars, restaurants and venues organise broadcasts on big screens, and some cities set up giant screens in squares or other sites if a Spanish team is playing. If there is a celebration, the teams' traditional squares, such as Cibeles or Neptuno in Madrid, fill up."
    - "If you want to watch it in a bar, book ahead or arrive early, because they fill up. If you watch it at home, organise a get-together with friends. Check the schedule of the channel that airs it and confirm the date and time, which change every year depending on the host city."
  faq:
    - p: "When is the Champions League final?"
      r: "On a Saturday in late May or early June. The date and host city change every year."
    - p: "Where can I watch it?"
      r: "At home, in bars and restaurants with a screen and, if a Spanish team plays, on giant screens in some cities."
    - p: "Do I need to book at a bar?"
      r: "Yes, or arrive early. Finals fill up the venues that show them."
    - p: "Where are the titles celebrated?"
      r: "Each team has its traditional places: for example, Cibeles in Madrid or Canaletas and the Arc de Triomf in Barcelona. Check the official information from the club and the city council."
    - p: "Where is it broadcast?"
      r: "Check the schedule of the channel that broadcasts it that year."
    - p: "Is it a good plan with kids?"
      r: "At home or in a family-friendly venue, yes. On the street, be careful with the crowds."
terrazas-primavera:
  texto:
    - "Vermouth is much more than a drink: it is a weekend ritual. A vermouth on tap, an olive, a splash of soda and a terrace in the sun make for a simple, cheap and very Spanish plan, perfect before lunch."
    - "The best times for terraces are spring, before the heat sets in, and September, when it is still pleasant to be outdoors. Barcelona, Madrid, Reus, Valencia and Seville all have good vermouth bars, and many neighbourhoods organise crawls and contests with tapas and vermouth at a set price."
    - "The easiest way is to head out at midday on a weekend and stroll from bar to bar. Book if you are going in a group, because sunny terraces fill up, and try the house vermouth, since each place makes or selects its own. Pair it with pickles, anchovies, crisps or cockles."
  mapa:
    titulo: "Where to go for terraces and vermouth"
    centro: [40.0, -3.0]
    zoom: 6
    puntos:
      - { nombre: "Barcelona", lat: 41.3874, lon: 2.1686, desc: "A city of vermouth bars and of the weekend vermouth hour." }
      - { nombre: "Madrid", lat: 40.4168, lon: -3.7038, desc: "Vermouth on tap and sunny terraces in many neighbourhoods, with tapas crawls." }
      - { nombre: "Reus (Tarragona)", lat: 41.1548, lon: 1.1078, desc: "The birthplace of Catalan vermouth, with traditional wineries and bars." }
      - { nombre: "Valencia", lat: 39.4699, lon: -0.3763, desc: "Terraces and vermouth bars all year round thanks to the climate." }
      - { nombre: "Seville", lat: 37.3891, lon: -5.9845, desc: "Terraces and tapas bars with vermouth, ideal before the heat sets in." }
  faq:
    - p: "When is the best time to go out for terraces?"
      r: "In spring, between April and June, and in September, when the weather is nice and the heat is not yet oppressive."
    - p: "What do you order with vermouth?"
      r: "An olive, an orange or lemon slice and ice, sometimes a splash of soda. It is served with pickles, crisps, cockles or anchovies."
    - p: "Where should I go for vermouth?"
      r: "Barcelona, Madrid, Reus, Valencia and Seville have a long tradition, but almost every city has its own vermouth bar."
    - p: "Do I need to book?"
      r: "At weekends and for a terrace in the sun, it is best to book or arrive early, especially in a group."
    - p: "How much does it cost?"
      r: "It depends on the city and the venue. A vermouth on tap is usually affordable, and many tapas crawls include vermouth at a fixed price."
    - p: "Is it a good plan with kids?"
      r: "On terraces, yes, with non-alcoholic drinks and at midday. It is better to avoid the busiest hours."
premio-nadal:
  texto:
    - "The Nadal Prize for fiction is Spain's oldest literary prize, awarded since 1944. It is announced every 6 January at a dinner in Barcelona and is one of the first dates in the year's literary calendar."
    - "The winner is announced on the night of 6 January, and in the following days the winning novel reaches the bookshops. It is a good excuse to start the year with a new read and to discover authors who, in many cases, are publishing their work on a large scale for the first time."
    - "You can follow the announcement on the publisher's social media and in the press. If you want to read the winning novel, it is usually in bookshops a few weeks later. You can also look back at titles from previous editions, which include many classics of Spanish-language literature."
  faq:
    - p: "When is the Nadal Prize announced?"
      r: "Every 6 January in the evening, at an event in Barcelona."
    - p: "What is the Nadal Prize?"
      r: "Spain's oldest literary prize for fiction, awarded since 1944. It is given by the publisher Destino."
    - p: "Can I attend the event?"
      r: "It is a private, invitation-only event. The usual way is to follow it through the press and social media."
    - p: "When does the novel reach the bookshops?"
      r: "It is usually available in the weeks after the announcement. Check with your bookshop."
    - p: "Is it the only major literary prize in January?"
      r: "No, there are others throughout the year, such as the Planeta in October and the Cervantes in April. They all have their own page on sinplanes."
premio-cervantes:
  texto:
    - "The Cervantes Prize is the most important award in Spanish-language literature and honours an author's body of work. It is presented every 23 April, Book Day, in the Paraninfo of the University of Alcalá, in Alcalá de Henares, in the presence of the King."
    - "The prize is worth 125,000 euros and the winner is announced months before the ceremony. The ceremony takes place in a historic building in a UNESCO World Heritage city that is the birthplace of Miguel de Cervantes, which gives it a special symbolic value."
    - "The ceremony is formal and by invitation only, but you can follow it on television or online. It is a good day to visit Alcalá de Henares, walk around its old town and Cervantes' birthplace, and to find out who this year's winner is. Check the city's programme of activities around Book Day."
  faq:
    - p: "When is the Cervantes Prize presented?"
      r: "Every 23 April, Book Day."
    - p: "Where is it presented?"
      r: "In the Paraninfo of the University of Alcalá, in Alcalá de Henares (Madrid)."
    - p: "Who presents the prize?"
      r: "Traditionally, the King of Spain."
    - p: "How much money is it worth?"
      r: "It is worth 125,000 euros."
    - p: "Can I attend?"
      r: "The ceremony is formal and by invitation only. It can be followed on television and online."
    - p: "What else is there to see in Alcalá de Henares?"
      r: "The old town, a UNESCO World Heritage site, and Cervantes' birthplace, among other places."
feria-libro-madrid:
  texto:
    - "The Madrid Book Fair is one of the city's most popular cultural events. For about two weeks, in late May and early June, Retiro Park fills with bookshop and publisher stalls, with author signings every day."
    - "The central avenue of Retiro becomes a huge open-air bookshop, with new releases, classics, children's books and second-hand books. Many stalls offer discounts, and every day there are authors signing copies and book presentations. It is a reading plan, but also a stroll."
    - "Admission is free. It is best to go on a weekday, in the morning or at dusk, because it gets crowded at weekends. Bring a list of books, some cash and comfortable shoes. If you want a book signed, arrive early and check each day's signing programme."
  faq:
    - p: "When is the Madrid Book Fair?"
      r: "In late May and early June, for about two or three weeks. The exact dates change every year."
    - p: "Where is it held?"
      r: "In Retiro Park, in Madrid."
    - p: "Do I have to pay to get in?"
      r: "No, admission is free."
    - p: "Are there discounts?"
      r: "Many stalls offer discounts and special deals. Check the terms at each one."
    - p: "How do I get a signature?"
      r: "Check the signing programme on the fair's website and arrive early at the stall, because the queues are long."
    - p: "Is it a good plan with kids?"
      r: "Yes, there are children's books, storytelling sessions and activities. Go on a weekday to avoid the crowds."
premio-planeta:
  texto:
    - "The Planeta Prize is one of the best-endowed literary prizes in the world in the Spanish language, with one million euros for the winner. It is announced in mid-October at a gala in Barcelona and is one of the big publishing events of the autumn."
    - "At the gala, the winning novel and the runner-up are announced, and the news is followed live in the press and on social media. In the following days, the winning novel reaches the bookshops and usually ranks among the best-selling books of the Christmas season."
    - "You can follow the announcement in the press and on the publisher's social media. If you want to read the novel, it is usually available in bookshops as soon as it is announced. It is a good time to get to know the authors who are part of the great literature in Spanish."
  faq:
    - p: "When is the Planeta Prize announced?"
      r: "In mid-October, at a gala in Barcelona."
    - p: "How much money is the prize worth?"
      r: "The winner receives one million euros and the runner-up a smaller amount, which makes it one of the best-endowed literary prizes in the world."
    - p: "Can I attend the gala?"
      r: "It is an invitation-only event. It is followed through the press and social media."
    - p: "When does the novel reach the bookshops?"
      r: "It is usually available after the announcement. Check with your bookshop."
    - p: "Is it the same as the Nadal Prize?"
      r: "No. The Nadal is Spain's oldest and is announced on 6 January, whereas the Planeta is announced in October."
seminci:
  texto:
    - "Seminci, the Valladolid International Film Week, is one of the oldest film festivals in Spain and one of the most devoted to auteur cinema. It takes place in October in Valladolid, with screenings spread across the whole city."
    - "The official competition section fights for the Espiga de Oro (Golden Ear of Wheat), and throughout the week there are parallel sections, retrospectives, tributes, Q&As with directors and films from all over the world. The Teatro Calderón is one of the main venues, and there are screenings in other cinemas around the city."
    - "Check the programme on the official website, which is published a few weeks beforehand, and buy your tickets early, because screenings with guests and premieres sell out. Many films are shown in the original language with subtitles. October evenings in Valladolid are cool, so bring a coat."
  faq:
    - p: "When is Seminci?"
      r: "In October, for about nine days. The exact dates are announced every year."
    - p: "What kind of films are shown?"
      r: "Mostly auteur cinema and films that have won awards at other festivals, from all over the world, plus retrospectives and tributes."
    - p: "What is the Espiga de Oro?"
      r: "It is the festival's main prize, awarded to the best film in the official section."
    - p: "Where do I buy tickets?"
      r: "Through the festival's official channels and at the cinema box offices. Premieres and screenings with guests sell out."
    - p: "Do the films have subtitles?"
      r: "Many are shown in the original language with subtitles. Check the listing for each screening."
    - p: "What else is there to do in Valladolid?"
      r: "Visit the National Sculpture Museum and the Plaza Mayor, and try the city's pinchos."
encendido-luces:
  texto:
    - "The Christmas lights switch-on is the event with which many cities launch their festive lighting. It is usually held in late November or early December, with a public ceremony, music and, sometimes, light shows and fireworks."
    - "Every city has its own date and format: in some it is done with a countdown in a square, in others with a parade or a concert. The lights stay on throughout the holidays, normally until Three Kings' Day. If you want to see the moment of the switch-on, check your town hall's programme."
    - "Switch-on events draw big crowds, so arrive early, pick a good spot and go on foot or by public transport. If you would rather see the lights in a more relaxed way, go on another day during the week. Wrap up warm and be patient with the crowds."
  faq:
    - p: "When are the Christmas lights switched on?"
      r: "Normally in late November or early December. Each city announces its date a few weeks beforehand."
    - p: "Is there a switch-on ceremony?"
      r: "In many cities there is, with music, a countdown and, sometimes, fireworks. Check your town hall's programme."
    - p: "How long do the lights stay on?"
      r: "Normally until Three Kings' Day, on 6 January."
    - p: "How do I get there?"
      r: "On foot or by public transport. The city centre is usually closed to traffic."
    - p: "When is the best time to go and see the lights?"
      r: "During the week and early in the evening. On switch-on day and at weekends it gets extremely crowded."
    - p: "Is it a good plan with kids?"
      r: "Yes, but be careful in the crowds. Agree on a meeting point in case you get separated."
festival-internacional-santander:
  texto:
    - "The Santander International Festival is one of the great events for classical music, dance and opera in Spain. It takes place in August, over several weeks, in theatres and unusual venues in Santander and other places in Cantabria."
    - "The programme brings together international-level orchestras, soloists, dance companies and opera groups, with concerts at the Palacio de Festivales and in historic spaces around the city. It is a perfect plan for anyone who wants to combine culture and summer on the Cantabrian coast."
    - "Check the official website for the full programme and ticket sales; tickets go on sale in advance. Some activities have affordable prices or are free. Bring a light jacket, because August nights in Santander are cool, and book your accommodation early."
  faq:
    - p: "When is the Santander International Festival?"
      r: "In August, over several weeks. Check the official website for the programme."
    - p: "What kind of shows are there?"
      r: "Classical music, dance and opera, with international artists and companies."
    - p: "Where are the concerts held?"
      r: "At the Palacio de Festivales and in other theatres and venues in Santander and Cantabria."
    - p: "Where do I buy tickets?"
      r: "Through the festival's official channels. They go on sale in advance and popular shows sell out."
    - p: "Are there free activities?"
      r: "Some editions include free or low-cost activities. Check the programme."
    - p: "Is it a good plan with kids?"
      r: "There are family shows and dance performances that younger children may enjoy. Check the programme."
festival-internacional-cine-gijon:
  texto:
    - "The Gijón International Film Festival (FICX) is one of the best-known independent and auteur film festivals in Spain. It takes place in November in Gijón, on the coast of Asturias, with a programme designed for people looking for something different in cinema."
    - "The festival includes an official competition section, parallel sections, retrospectives, tributes and activities for young people and families. Screenings are spread across several cinemas in the city, and the festival atmosphere blends with that of a seaside city full of cider houses."
    - "Check the official website for the programme, which is published a few weeks beforehand, and for ticket sales. Combine the screenings with a walk along the seafront promenade and a glass of cider in a cider house. In November it often rains in Asturias: bring an umbrella and a coat."
  faq:
    - p: "When is the Gijón Film Festival?"
      r: "In November, for about nine days. The exact dates are announced every year."
    - p: "What kind of films are shown?"
      r: "Auteur and independent cinema and new voices, with competitive and parallel sections."
    - p: "Where do I buy tickets?"
      r: "Through the festival's official channels and at the box offices. Popular screenings sell out."
    - p: "Are there activities for kids?"
      r: "There are usually sections and activities for young people and families. Check the programme."
    - p: "What else is there to do in Gijón?"
      r: "Stroll along San Lorenzo beach, visit the Cimavilla neighbourhood and try the cider and Asturian cuisine."
    - p: "What should I wear?"
      r: "A coat and an umbrella: in November, the weather in Asturias is damp and cool."
sevilla-festival-cine:
  texto:
    - "The Seville European Film Festival (SEFF) is one of the great events for European cinema in Spain. It takes place in November in Seville, over one week, with films from across the continent and screenings open to the public in the city's cinemas."
    - "The programme includes an official competition section, which competes for the Giraldillo de Oro (Golden Giraldillo), as well as parallel sections, retrospectives and tributes, and European films rarely seen in commercial cinemas. It is a great opportunity to discover auteur cinema and work from different countries."
    - "Check the official website for the programme, schedules and ticket sales; tickets go on sale in advance. Many films are shown in the original language with subtitles. Take the chance to stroll around Seville in autumn, when the weather is milder than in summer."
  faq:
    - p: "When is the Seville European Film Festival?"
      r: "In November, for around a week. The exact dates are announced every year."
    - p: "What is the Giraldillo de Oro?"
      r: "It is the festival's main prize, awarded to the best film in the official section."
    - p: "What kind of films are shown?"
      r: "European auteur cinema from different countries, with premieres and films rarely seen in commercial cinemas."
    - p: "Where do I buy tickets?"
      r: "Through the festival's official channels and at the cinema box offices. Screenings with guests sell out."
    - p: "Do the films have subtitles?"
      r: "Many are shown in the original language with subtitles. Check the listing for each screening."
    - p: "What else is there to do in Seville?"
      r: "Visit the Cathedral and the Giralda, stroll around the Santa Cruz neighbourhood and try the tapas."
festival-iberoamericano-cine-huelva:
  texto:
    - "The Huelva Ibero-American Film Festival is one of the oldest dedicated to cinema in Spanish and Portuguese. It takes place in November in Huelva, with screenings of films from Spain, Portugal and Latin America."
    - "The official competition section fights for the Colón de Oro (Golden Columbus), and there are parallel sections, retrospectives, tributes to figures from Ibero-American cinema and meetings with directors and actors. The Gran Teatro de Huelva is one of the festival's main venues."
    - "Check the programme on the official website, which is published a few weeks beforehand, and buy your tickets early. Take the chance to get to know Huelva, its coast and its food, with products such as Jabugo ham and white prawns."
  faq:
    - p: "When is the Huelva Ibero-American Film Festival?"
      r: "In November, for about nine days. The exact dates are announced every year."
    - p: "What films are shown?"
      r: "Films from Spain, Portugal and Latin America, in Spanish and Portuguese, with competitive and parallel sections."
    - p: "What is the Colón de Oro?"
      r: "It is the festival's main prize, awarded to the best film in the official section."
    - p: "Where do I buy tickets?"
      r: "Through the festival's official channels and at the box offices. Check the prices in the programme."
    - p: "Where does it take place?"
      r: "In Huelva, with screenings at the Gran Teatro and in other venues around the city."
    - p: "What else is there to do in Huelva?"
      r: "Visit the coast and the Reina Victoria neighbourhood, and try the white prawns and the local Iberian ham."
fiestas-vendimia-jerez:
  texto:
    - "The Jerez Grape Harvest Festival (Fiestas de la Vendimia de Jerez) celebrates the start of the picking of the grapes used to make Jerez wines. It takes place in September, for about ten days, with traditional ceremonies, cultural activities and a lively atmosphere in the streets."
    - "The two best-known moments are the grape treading, in the Plaza de la Asunción, and the blessing of the must, at the church of San Dionisio. There are also concerts, flamenco, tastings and activities for all audiences, with the whole city devoted to its wine."
    - "Take the chance to visit a winery, try fino, manzanilla and amontillado, and eat in the tapas bars of the area. Check the town hall's official programme and book winery visits in advance. September in Jerez is hot: bring water and sun protection."
  faq:
    - p: "When is the Jerez Grape Harvest Festival?"
      r: "In September, for about ten days. The exact dates are announced every year."
    - p: "What is the grape treading?"
      r: "It is the symbolic ceremony that opens the harvest, in which the grapes are trodden to produce the first must."
    - p: "What is the blessing of the must?"
      r: "It is a religious ceremony in which the must from the new harvest is blessed, at the church of San Dionisio."
    - p: "Can you visit wineries?"
      r: "Yes, many wineries offer visits and tastings. It is best to book in advance."
    - p: "What do people drink?"
      r: "Jerez wines, such as fino, manzanilla, amontillado, oloroso and Pedro Ximénez."
    - p: "Is it a good plan with kids?"
      r: "Yes, there are family activities, although September is hot: bring water and a cap."
