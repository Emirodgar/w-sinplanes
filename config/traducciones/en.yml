castanas-otono:
  imagen_alt: "Chestnut grove floor in autumn covered in golden leaves and chestnut burrs"
  texto:
    - "When October arrives, the chestnut groves of northern and central Spain fill up with burrs fallen among the leaves. Going out to pick chestnuts is one of the simplest and most rewarding autumn plans: a quiet walk in the countryside, a basket slowly filling up and, back home, something tasty to roast."
    - "Depending on altitude and the year, the season starts around mid-October and runs well into November. The best chestnut groves tend to be in mountain areas with a damp climate: El Bierzo (León), the Genal Valley (Málaga), the Sierra de Francia (Salamanca), the Tiétar Valley (Ávila), as well as much of Galicia and Asturias."
    - "The most important thing is to know who owns the grove. Many are private estates whose owners look after them and sell the harvest, and picking on them without permission can have consequences. Ask in the village, at the town hall or at a country guesthouse in the area: someone will usually tell you where you can pick or put you in touch with an owner."
    - "Bring sturdy closed shoes with good grip, thick gloves (the burrs really do prick), a basket or a sack and clothes you don't mind getting dirty. Chestnuts fall on their own when they are ripe: the usual way is to gather the ones on the ground, without beating the trees or damaging them. The days after rain and wind tend to be the most generous."
    - "Once home, cut a slit in the skin of each chestnut before roasting or boiling it so they don't burst. They keep best in a cool place or in the fridge, and are best eaten within a few days. The natural finale to this plan is a magosto: roasted chestnuts, a bonfire and new wine."
  mapa:
    titulo: "Where to go chestnut picking"
    centro: [40.0, -5.0]
    zoom: 6
    puntos:
      - { nombre: "El Bierzo (León)", lat: 42.55, lon: -6.6, desc: "Centuries-old chestnut groves around Las Médulas and the nearby valleys; the home of the magosto." }
      - { nombre: "Genal Valley (Málaga)", lat: 36.57, lon: -5.17, desc: "Serranía de Ronda: Igualeja, Pujerra, Genalguacil and Júzcar, with chestnut trees all over the valley." }
      - { nombre: "Sierra de Francia (Salamanca)", lat: 40.485, lon: -6.108, desc: "Around La Alberca and Miranda del Castañar, with chestnut groves on the hillsides." }
      - { nombre: "Tiétar Valley (Ávila)", lat: 40.2, lon: -5.1, desc: "Arenas de San Pedro, Candeleda and Guisando, at the foot of the Sierra de Gredos." }
      - { nombre: "Sierra de Aracena (Huelva)", lat: 37.89, lon: -6.56, desc: "The chestnut groves of Huelva, at Castaño del Robledo and Galaroza." }
  faq:
    - p: "When is chestnut season?"
      r: "In Spain, roughly from mid-October to mid-November. It starts earlier in lower areas and a few days later in higher ones. To time it right, ask about the area the week before: the harvest changes from year to year depending on the rain and the summer heat."
    - p: "Can you pick chestnuts in any forest?"
      r: "Not always. Many chestnut groves are private property and, in public forests, each town hall or regional government may have its own rules. Ask at the town hall or the locals before picking, and don't enter fenced estates."
    - p: "Where can I go chestnut picking?"
      r: "The classic destinations are El Bierzo (León), the Genal Valley (Málaga), the Sierra de Francia (Salamanca) and the Tiétar Valley (Ávila), as well as Galicia, Asturias and the Aracena area. They all have very extensive chestnut groves and a strong tradition."
    - p: "What should I bring?"
      r: "Thick gloves, closed shoes, a basket or sack and warm clothes you don't mind getting dirty. The burrs can be opened by stepping on them with the sole of your shoe, no tools needed."
    - p: "How do you roast chestnuts?"
      r: "Cut a slit in the skin of each one, put them in a perforated chestnut pan, in the oven or on a grill, and leave them for 20 to 30 minutes until the skin splits open. Wrap them in a cloth for a few minutes so they keep cooking in their own steam and are easier to peel."
    - p: "Is it a good plan with kids?"
      r: "Yes, though take care: the burrs prick. Give them gloves and teach them not to put their hand in without looking. For them it's an activity that combines a walk, play and a reward."
    - p: "What is a magosto?"
      r: "It is the traditional autumn festival of Galicia, Asturias and El Bierzo: chestnuts are roasted on a bonfire and eaten with new wine or cider, especially around Saint Martin's Day, on 11 November."

setas:
  imagen_alt: "Hands picking a bolete in the forest next to a wicker basket full of mushrooms"
  texto:
    - "With the first autumn rains, pine, oak and chestnut woods fill up with mushrooms, and going out to look for them becomes one of the most eagerly awaited plans of the year. It's a perfect excuse to spend the morning in the countryside, whether or not you come back with a full basket."
    - "The main season runs from October to November, although it depends a lot on rainfall and temperatures: after a few damp, frost-free weeks, the forest bursts into life. Provinces such as Soria, the Pyrenees, León, Zamora, the Sierra de Gredos or Catalonia are classics, and many of them have mushroom trails and organised events."
    - "Before heading out, find out about the local regulations. Several regions require a permit or foraging authorisation (in Castilla y León, for example, the Micocyl system is used), and there are quantity limits, closed areas and time restrictions. Rules vary from place to place, so check the website of the town hall or the regional government."
    - "If you have no experience, the golden rule is not to eat any mushroom you haven't identified with certainty. The most sensible way to start is to join a guided outing or a mushroom day with an expert, and to carry a field guide. Pick with a wicker basket, which lets the spores fall and lets the mushrooms breathe, and cut or remove them carefully without tearing up the ground."
  mapa:
    titulo: "Where to go mushroom foraging"
    centro: [41.2, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Pine forests of Soria", lat: 41.95, lon: -2.75, desc: "Vinuesa, Covaleda and Duruelo de la Sierra, with Micocyl as the permit system." }
      - { nombre: "Pyrenees (Aran Valley)", lat: 42.7, lon: 0.8, desc: "Damp fir and beech forests in the Pyrenees of Lleida." }
      - { nombre: "León mountains", lat: 42.95, lon: -5.1, desc: "Riaño, Babia and Luna, with Pyrenean oak woods and beech forests." }
      - { nombre: "Sanabria (Zamora)", lat: 42.1, lon: -6.7, desc: "Pine and chestnut woods around Lake Sanabria." }
      - { nombre: "Sierra de Gredos (Ávila)", lat: 40.3, lon: -5.2, desc: "Pine and oak woods in the Tiétar Valley and the Barranco." }
      - { nombre: "Solsonès (Catalonia)", lat: 42.0, lon: 1.5, desc: "Pine and mixed forests with a strong mushroom-hunting tradition." }
  faq:
    - p: "When is mushroom season?"
      r: "In Spain, the main season runs from October to November, although in some areas it lasts until December or starts in September. It depends on rain, altitude and temperature: after several damp, frost-free weeks, the forest bursts into life."
    - p: "Where can I look for mushrooms?"
      r: "Soria, the Pyrenees, the mountains of León and Zamora, the Sierra de Gredos or Catalonia are classic destinations. The most practical thing is to ask at the tourist office or at a country guesthouse in the area, where they usually know the trails and the current rules."
    - p: "Do I need a permit to pick mushrooms?"
      r: "In many areas, yes. Several regional governments require a permit or foraging authorisation, and there may be quantity limits and closed areas. Always check before heading out on the website of the town hall or the regional government."
    - p: "How do I know if a mushroom is edible?"
      r: "Don't trust popular tricks: you can only eat a mushroom if you have identified it with certainty. If in doubt, don't pick it. A guided outing or a mushroom day is the safest way to learn, and in case of poisoning you must go to the emergency room or call 112."
    - p: "What should I bring?"
      r: "A wicker basket, a pocket knife, an identification guide, hiking shoes, warm clothes, water and something to eat. Avoid plastic bags, which spoil the mushrooms and don't let the spores fall."
    - p: "Is it a good plan with kids?"
      r: "Yes, as long as they are accompanied and know that nothing is touched or eaten without an adult checking it. Younger children enjoy the search a lot, but it's best to choose easy routes and make sure they don't put their hands in their mouths."

hayedos:
  imagen_alt: "Path covered in leaves among beech trees in autumn colours with some mist in the background"
  texto:
    - "For a few weeks in autumn, beech forests turn from green to yellow, orange and copper, and the ground is covered in leaves. It is one of the most photogenic natural spectacles in Spain and a perfect plan for walking unhurriedly among silvery trunks."
    - "The best time is usually between mid-October and mid-November, although the peak of colour changes every year depending on the cold, the rain and the wind. Among the best-known beech forests are the Selva de Irati (Navarre), the Hayedo de Montejo (Madrid), the Hayedo de la Tejera Negra (Guadalajara) and Otzarreta (Bizkaia), as well as those of Cantabria, Asturias and the Pyrenees."
    - "Watch out for visitor quotas: some beech forests, such as Montejo, limit the number of visitors or require a reservation or an access permit, especially at weekends of peak colour. Check the protected area's website beforehand, and if you can, go on a weekday: there will be fewer people and more silence."
    - "Bring comfortable shoes that grip on wet leaves, a warm layer and a rain jacket, since damp is common in the beech forest, and stay on the marked trails. Mornings with some mist and the low light of late afternoon are the best for photography."
  mapa:
    titulo: "Where to see a beech forest in autumn"
    centro: [42.0, -2.5]
    zoom: 7
    puntos:
      - { nombre: "Selva de Irati (Navarre)", lat: 42.98, lon: -1.1, desc: "One of the largest beech and fir forests in Europe, between Ochagavía and Orbaizeta." }
      - { nombre: "Hayedo de Montejo (Madrid)", lat: 41.12, lon: -3.5, desc: "The southernmost beech forest in Europe; access with a quota and reservation." }
      - { nombre: "Hayedo de la Tejera Negra (Guadalajara)", lat: 41.15, lon: -3.15, desc: "In the Sierra de Ayllón, near Cantalojas, with marked trails." }
      - { nombre: "Hayedo de Otzarreta (Bizkaia)", lat: 43.03, lon: -2.78, desc: "In the Gorbeia Natural Park, one of the most photographed." }
      - { nombre: "Saja-Besaya (Cantabria)", lat: 43.1, lon: -4.2, desc: "Extensive beech forests in the Natural Park, with good autumn trails." }
      - { nombre: "Redes (Asturias)", lat: 43.17, lon: -5.3, desc: "Mountain beech forests in the Redes Natural Park." }
      - { nombre: "Selva de Oza (Huesca)", lat: 42.85, lon: -0.75, desc: "Beech and fir forests of the Aragonese Pyrenees, in the Hecho Valley." }
  faq:
    - p: "When is the best time to see a beech forest in autumn?"
      r: "Between mid-October and mid-November, with a colour peak that usually lasts about two or three weeks. It varies each year with the cold and the rain, so it's worth checking the protected area's updates or the visitor centres' social media."
    - p: "What are the best beech forests in Spain?"
      r: "The Selva de Irati (Navarre), the Hayedo de Montejo (Madrid), the Hayedo de la Tejera Negra (Guadalajara) and Otzarreta (Bizkaia) are the best known. Those of Cantabria, Asturias and the Pyrenees also stand out."
    - p: "Do I need to book or ask for a permit?"
      r: "In some, yes. The Hayedo de Montejo, for example, limits visits and requires authorisation, and in other areas there are quotas or car parks that fill up at weekends of peak colour. Check the protected area's website before going."
    - p: "Can I go with kids or with a dog?"
      r: "Short, marked routes are suitable for children. With a dog it depends on each area: in some they are banned or must be kept on a lead, so check beforehand."
    - p: "What clothes and shoes should I bring?"
      r: "Comfortable shoes that grip on wet leaves, warm clothing in layers and a rain jacket, because humidity and temperature drop quickly in the forest."
    - p: "How can I avoid the crowds?"
      r: "Go on a weekday, first thing in the morning or late in the afternoon, and avoid long weekends and weekends of peak colour. Another option is to pick less well-known beech forests in the same area."

berrea:
  texto:
    - "At the end of summer, male red deer start to bellow to attract females and challenge their rivals. That deep, powerful roar echoing across the countryside at dawn and dusk is the berrea, the red deer rut, one of the most impressive wildlife spectacles in Spain."
    - "The rut is concentrated between September and October, with the peak normally at the end of September and the beginning of October, although it varies by area and year. The best-known places are Cabañeros National Park, Monfragüe National Park, the Sierra de Andújar, the Riaño National Reserve and the Sierra de la Culebra, among others."
    - "The best approach is to arrive before sunrise or a little before nightfall, when the deer are most active, and listen quietly from an observation point. Bring binoculars and warm clothes in muted colours, and don't use torches or flash. Deer in rut are unpredictable: always keep your distance and don't approach them."
    - "In some areas there are guided routes, observatories or regulated access during the rut, and it is best to book in advance. Check the protected area's or visitor centre's website before going."
  mapa:
    titulo: "Where to hear the red deer rut"
    centro: [40.0, -5.0]
    zoom: 6
    puntos:
      - { nombre: "Cabañeros National Park (Ciudad Real)", lat: 39.4, lon: -4.5, desc: "Rañas (open grassy plains) and Mediterranean scrub with large deer populations; guided visits during the rut." }
      - { nombre: "Monfragüe National Park (Cáceres)", lat: 39.83, lon: -6.05, desc: "Dehesa (open oak pasture) and rocky crags with several viewpoints for listening at dawn." }
      - { nombre: "Sierra de Andújar (Jaén)", lat: 38.25, lon: -4.0, desc: "One of the best places in the south; very busy, so booking is advisable." }
      - { nombre: "Riaño National Reserve (León)", lat: 42.98, lon: -5.0, desc: "Mountain rut, among beech forests and Pyrenean oak woods in the León side of the Picos de Europa." }
      - { nombre: "Sierra de la Culebra (Zamora)", lat: 41.85, lon: -6.2, desc: "Vast game reserve with plenty of deer and the odd wolf." }
  faq:
    - p: "When is the red deer rut?"
      r: "Between September and October. The time of greatest activity is usually the end of September and the beginning of October, although it changes depending on the area and the year. It's best to go out at dawn or dusk."
    - p: "Where can I see the rut?"
      r: "The best-known places are Cabañeros, Monfragüe, the Sierra de Andújar, the Riaño National Reserve and the Sierra de la Culebra. Many have guided routes, observatories or marked listening points."
    - p: "What should I bring?"
      r: "Binoculars, warm clothing in muted colours (greens, browns, greys), comfortable shoes and something to eat and drink. It's chilly during the busiest hours, even if the day is hot."
    - p: "Is it dangerous to approach the deer?"
      r: "Yes. Males in rut are very aggressive and unpredictable. Don't approach them, don't circle around them or block their path, and keep the distance indicated by the guides or the signs."
    - p: "Do I need to book?"
      r: "In some areas, yes, especially for guided routes, observatories or regulated access at the height of the rut. Check the protected area's or visitor centre's website before going, because places sell out."
    - p: "Can I go with kids?"
      r: "Yes, it's a lovely plan for them, but you have to go quietly, at early hours and without leaving the group. Choose easy routes, ideally with a guide."

vendimia:
  texto:
    - "September is grape harvest month in much of Spain: ripe bunches are cut by hand or by machine and the wineries fill with the smell of must. Experiencing it up close, among vineyards and wine presses, is one of the most charming end-of-summer plans, and it has a lot of festival spirit."
    - "The exact date changes depending on the area, the variety and the year. White grapes and early varieties are usually picked from the end of August, and later red varieties can run into October. Regions such as La Rioja, Ribera del Duero, Jerez, Penedès, Rías Baixas or La Mancha organise visits, tastings and related activities."
    - "Many wineries offer experiences in which you can cut bunches, stomp the grapes or see how the harvest arrives at the winery, usually by prior reservation and for a fee. There are also festivals dedicated to the grape harvest, such as those in Jerez or the San Mateo festivities in Logroño, with grape stomping, offerings of the first must and tastings."
    - "If you sign up for a vineyard experience, bring comfortable closed shoes, a cap, sunscreen and clothes that can get stained. It's best to go first thing in the morning, when it's cooler and the work is done more calmly."
  mapa:
    titulo: "Where to experience the grape harvest"
    centro: [40.0, -3.5]
    zoom: 6
    puntos:
      - { nombre: "La Rioja (Logroño)", lat: 42.4627, lon: -2.445, desc: "Rioja Alta and Rioja Baja, with the San Mateo festivities in Logroño and many wineries offering visits." }
      - { nombre: "Ribera del Duero (Burgos and Valladolid)", lat: 41.62, lon: -3.9, desc: "Red wine vineyards along the Duero river, with wineries open to visitors." }
      - { nombre: "Rías Baixas (Pontevedra)", lat: 42.51, lon: -8.81, desc: "Albariño country, with an early harvest and wineries around Cambados." }
      - { nombre: "Penedès (Barcelona)", lat: 41.3446, lon: 1.6988, desc: "Cava and wine country, with wineries and harvest experiences around Vilafranca." }
      - { nombre: "La Mancha (Ciudad Real)", lat: 39.0, lon: -3.2, desc: "Spain's largest vineyard, with wineries and harvest festivals in its villages." }
      - { nombre: "Jerez (Cádiz)", lat: 36.6864, lon: -6.1377, desc: "Capital of sherry wine, with its harvest festival and historic wineries." }
  faq:
    - p: "When is the grape harvest in Spain?"
      r: "It depends on the area and the variety, but the main period runs from the end of August to October, with September as the central month. White and early grapes are picked before the late reds."
    - p: "Where can I experience the grape harvest?"
      r: "The classic destinations are La Rioja, Ribera del Duero, Jerez, Penedès, Rías Baixas and La Mancha. Many wineries organise visits and experiences at that time."
    - p: "Can I take part in the grape harvest?"
      r: "Yes, some wineries offer experiences in which you can cut bunches, stomp the grapes or see the harvest come in. They are usually paid and require prior booking, so find out in advance."
    - p: "Are there grape harvest festivals?"
      r: "Yes. Among the best known are the Jerez Grape Harvest Festival and the San Mateo festivities and Rioja grape harvest celebrations in Logroño, with grape stomping, the offering of the must and tastings."
    - p: "What should I bring?"
      r: "Comfortable closed shoes, a cap, sunscreen and clothes that can get stained. It's best to go first thing in the morning, when it's cooler."
    - p: "Is it a good plan with kids?"
      r: "Generally, yes. Many wineries organise family activities, with symbolic grape stomping and alcohol-free grape juice. Ask when booking whether children are admitted."

mercadillos-navidad:
  texto:
    - "Christmas markets fill the squares of many cities with stalls, lights and the smell of sweets. They are a perfect plan for strolling, shopping for crafts and decorations, and getting into the Christmas spirit."
    - "Some are classics: the market in Madrid's Plaza Mayor, Barcelona's Fira de Santa Llúcia next to the cathedral, or Bilbao's Santo Tomás market, held on 21 December. Many other cities set up their own, with stalls selling crafts, sweets and nativity scenes, plus shows for children."
    - "They usually open from late November and stay open until Christmas Eve or Three Kings' Day. The nicest time to go is on a weekday or early in the afternoon, when it is less crowded, and bring cash, because not every stall accepts cards. Wrap up warm: you spend a lot of time outdoors."
  faq:
    - p: "When do the Christmas markets open?"
      r: "Most open from late November or early December and close on Christmas Eve, although some stay open until Three Kings' Day. Check the dates for each city."
    - p: "Which are the best known?"
      r: "The one in Madrid's Plaza Mayor, Barcelona's Fira de Santa Llúcia and Bilbao's Santo Tomás market are among the most traditional, although almost every city has its own."
    - p: "Do you have to pay to get in?"
      r: "No. Entry is free, and you only pay for what you buy or for specific attractions, such as ice rinks or shows."
    - p: "What can you buy?"
      r: "Nativity scenes and figurines, decorations, candles, crafts, Christmas sweets, turrón and toys, depending on the market."
    - p: "When is the best time to go?"
      r: "On weekdays and early in the afternoon, to avoid the crowds. Weekends and long weekends get very busy."
    - p: "Is it a good plan with kids?"
      r: "Yes, many have toy stalls, shows and visits from Santa Claus or the Three Kings. Watch out for the crowds and keep an eye on the little ones."

luces-navidad:
  texto:
    - "Every year, Spanish cities compete to have the most spectacular Christmas lights. Streets covered in lights, huge trees, light and music shows and lots of people strolling make seeing the lights a very simple and very festive plan."
    - "Vigo has become famous for its display, and Madrid, Málaga, Valencia and Barcelona also put on very popular light displays. The switch-on usually takes place in late November or early December, with a public event, and the lights stay on until Three Kings' Day."
    - "The easiest way is to go on foot or by public transport, because city centres fill up with people and streets are closed to traffic, especially at weekends and on switch-on days. If you want to avoid the crowds, go on a weekday, early in the evening. Wrap up warm and wear comfortable shoes, because there is a lot of walking."
  faq:
    - p: "When are the Christmas lights switched on?"
      r: "Usually in late November or early December, with a public event. Each city has its own date, which is announced weeks in advance."
    - p: "How long do they stay on?"
      r: "Usually until Three Kings' Day, on 6 January, although in some cities they stay on a few more days."
    - p: "Which cities have the best lights?"
      r: "Vigo, Madrid, Málaga, Valencia and Barcelona are usually among the most visited, although many mid-sized cities have very well-done displays."
    - p: "When is the best time to go?"
      r: "On weekdays and early in the evening. At weekends, on long weekends and on switch-on days it gets very crowded."
    - p: "How do I get around?"
      r: "On foot or by public transport. In the busiest areas streets are closed off and parking is difficult."
    - p: "Is it a good plan with kids?"
      r: "Yes, they love it. Watch out for the crowds and agree on a meeting point in case you get separated."

cabalgata-reyes:
  texto:
    - "The Three Kings Parade (Cabalgata de Reyes) is one of the great family plans of Christmas: on the evening of 5 January, the Three Wise Men travel through the streets of almost every city and town in Spain with floats, music and showers of sweets, before the night they leave the presents."
    - "The best known are those in Madrid, Barcelona, where the Kings arrive by the port, Seville, with one of the oldest in Spain, and Valencia, but every town organises its own. The floats usually set off at dusk, and the route and time are published on the town hall's website or social media a few days beforehand."
    - "Arrive early and pick a good spot: the pavements fill up one or two hours beforehand. Bring a big bag for the sweets, warm clothes and patience, and keep an eye on the children while the sweets are raining down. If it rains, check whether it is going ahead or being cancelled."
  faq:
    - p: "When is the Three Kings Parade?"
      r: "On the evening of 5 January, although the time and route change in each town."
    - p: "Where can I watch the parade?"
      r: "In almost every city and town. Those in Madrid, Barcelona, Seville and Valencia are among the biggest, but each town hall publishes its route."
    - p: "Is it free?"
      r: "Yes, watching the parade from the street is free."
    - p: "When should I arrive to get a spot?"
      r: "One or two hours beforehand in big cities, and a little less in small towns."
    - p: "What should I bring?"
      r: "Warm clothes, a bag for the sweets and patience. In crowded areas, a meeting point in case you get separated."
    - p: "What happens if it rains?"
      r: "It depends on the city. Some go ahead, while others are postponed or shortened. Check the town hall's website or social media."

loteria-navidad:
  texto:
    - "The Christmas Lottery draw (Sorteo de la Lotería de Navidad), held every 22 December, is one of the most widely followed rituals of Christmas in Spain. The children of San Ildefonso sing out the numbers and prizes in their unmistakable chant, which can be heard on radio and television across the country."
    - "For years the draw has been held at Madrid's Teatro Real and lasts several hours, starting first thing in the morning. The most famous prize is El Gordo, but there are many prizes, and people play with family, friends or colleagues, often with a shared number."
    - "You can follow it on television or radio, or check the results on the official Loterías website. Access to the Teatro Real is limited, so most people watch it from home. If you have played, keep your ticket (décimo) safe and check the deadlines for collecting prizes."
  faq:
    - p: "When is the Christmas draw?"
      r: "On 22 December, starting first thing in the morning. It lasts several hours."
    - p: "Where is it held?"
      r: "At the Teatro Real in Madrid. Public access is limited."
    - p: "Who sings the numbers?"
      r: "The children of the Colegio de San Ildefonso, who sing them along with the prizes."
    - p: "How can I follow it?"
      r: "On television, radio or online. You can also check the results on the official Loterías website."
    - p: "When do I have to claim the prize?"
      r: "Prizes have a deadline for being claimed. Check the conditions and deadlines on the official Loterías website."
    - p: "Is it a good plan with kids?"
      r: "Yes, many of them love hearing the numbers sung and the atmosphere of the morning."

campanadas:
  texto:
    - "The New Year's Eve chimes (Campanadas de Nochevieja) mark the change of year in Spain with a unique tradition: eating twelve grapes, one with each chime, to welcome the new year with good luck. They are broadcast live from the clock at Madrid's Puerta del Sol and are watched in almost every home."
    - "Many people watch them on television, at home or with friends and family, while others prefer to go to a square. At the Puerta del Sol, access usually has a limited capacity and security checks, so check the conditions and arrive early. Other cities hold their own events in their main squares."
    - "For the grapes, a few practical tips: peel them and remove the seeds, have the twelve grapes ready in advance and start with the first chimes, not with the quarter chimes. After that, a toast, party favours and a party until the early hours, or off to rest, depending on your plan."
  faq:
    - p: "When are the chimes?"
      r: "On the night of 31 December, at 00:00. The twelve chimes of the clock mark the change of year."
    - p: "Why do people eat twelve grapes?"
      r: "It is a tradition of eating one grape with each chime to welcome the year with good luck. It is done all over Spain."
    - p: "Can I go to the Puerta del Sol?"
      r: "Yes, but access usually has limited capacity and security checks. Check the conditions from Madrid City Council and arrive early."
    - p: "Which channels broadcast them?"
      r: "Several television channels broadcast the chimes live from the Puerta del Sol. Check the schedule."
    - p: "How do I prepare the grapes?"
      r: "Peel the grapes and remove the seeds, have twelve ready and start with the chimes, not with the quarter chimes that come before them."
    - p: "Is it a good plan with kids?"
      r: "Yes, at home or at a quiet event. With small children, the grapes can be prepared peeled, seedless or cut up to avoid choking."

perseidas:
  texto:
    - "The Perseids, popularly known as the Tears of Saint Lawrence, are one of the easiest and most spectacular meteor showers to see from Spain. They happen every year when the Earth passes through the dust trail left by comet Swift-Tuttle."
    - "Activity lasts from mid-July to late August, and the peak usually falls between 11 and 13 August. On a clear, moonless night with dark skies, you can see dozens of meteors an hour. The phase of the Moon each year makes a big difference: with a full Moon you see far fewer."
    - "The key is to get away from light pollution. Starlight-certified reserves and destinations, such as Monfragüe, Sierra Sur de Jaén or Gúdar-Javalambre, are a great choice, and many of them organise guided stargazing sessions. You don't need a telescope or binoculars: just lie down and look up at the open sky."
    - "Let your eyes adjust to the dark for about 20 or 30 minutes and avoid looking at your phone. Bring a blanket or a sun lounger, warm clothes even if it is hot during the day, and something hot to drink. The hours after midnight are usually the best."
  mapa:
    titulo: "Where to watch the Perseids"
    centro: [39.5, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Monfragüe (Cáceres)", lat: 39.83, lon: -6.05, desc: "National Park and Starlight Reserve, with guided stargazing sessions." }
      - { nombre: "Sierra Sur de Jaén", lat: 37.6, lon: -3.85, desc: "Starlight Reserve with very dark skies, around Alcalá la Real and Castillo de Locubín." }
      - { nombre: "Gúdar-Javalambre (Teruel)", lat: 40.2, lon: -0.7, desc: "Starlight Reserve at over 1,500 m above sea level, with clear skies and an astrophysical observatory." }
  faq:
    - p: "When can you see the Perseids?"
      r: "Activity runs from mid-July to late August, with the peak around 12 August, usually between the 11th and the 13th. The best hours are after midnight and until dawn."
    - p: "Where is the best place to see them in Spain?"
      r: "Anywhere with dark, clear skies. Starlight-certified destinations, such as Monfragüe, Sierra Sur de Jaén or Gúdar-Javalambre, offer excellent skies and guided stargazing sessions."
    - p: "Do I need a telescope?"
      r: "No. They are fast-moving meteors and are best seen with the naked eye. Binoculars and telescopes narrow your field of view and don't help."
    - p: "Which way should I look?"
      r: "They radiate from the constellation Perseus, to the northeast, but meteors appear all over the sky. The best approach is to look up without fixing on one particular spot."
    - p: "Does the Moon matter?"
      r: "A lot. With a full or very bright Moon you see far fewer meteors. Check the Moon phase for that year before planning your trip."
    - p: "What should I bring?"
      r: "A blanket or sun lounger, warm clothes, a red-light torch (if you need one), something hot to drink and patience. Avoid white lights, which ruin your night vision."

cerezos-jerte:
  texto:
    - "For a few weeks in spring, the Jerte Valley, in northern Cáceres, is covered in white by the blossom of hundreds of thousands of cherry trees. The terraced hillsides look snow-covered, and the show is completed by the Garganta de los Infiernos gorge and the valley's stone villages."
    - "The blossom usually arrives between late March and mid-April, although the exact date changes every year depending on the winter and the temperatures. It is short-lived, between one and two weeks in each area, and comes earlier or later depending on altitude, so it is worth checking the state of the blossom before you travel. The Cherry Blossom Festival (Fiesta del Cerezo en Flor) is held during this time."
    - "It is a very popular plan, and on the weekends of peak blossom traffic and parking get difficult. If you can, go on a weekday or first thing in the morning, book accommodation well in advance and be patient on the valley's roads. Cherry trees are cultivated crops with owners: respect the farms, don't cut branches and don't enter closed terraces."
  mapa:
    titulo: "Where to see the cherry blossom"
    centro: [40.2, -5.77]
    zoom: 11
    puntos:
      - { nombre: "Garganta de los Infiernos", lat: 40.22, lon: -5.76, desc: "Nature reserve at the head of the valley, with trails and natural pools along the river." }
      - { nombre: "Jerte", lat: 40.2147, lon: -5.7508, desc: "Stone village at the entrance to the Garganta, with a visitor centre and cherry trees on the terraces." }
      - { nombre: "Navaconcejo", lat: 40.1747, lon: -5.7978, desc: "Valley village surrounded by cherry trees; a good base for seeing the blossom." }
      - { nombre: "Cabezuela del Valle", lat: 40.1697, lon: -5.7014, desc: "Cherry trees on the hillsides and cobbled streets, in the middle stretch of the valley." }
  faq:
    - p: "When do the cherry trees in the Jerte Valley blossom?"
      r: "Usually between late March and mid-April, for one or two weeks in each area. The date changes every year with the weather, so check the state of the blossom before you go."
    - p: "Where can you see the cherry blossom?"
      r: "The Jerte Valley (Cáceres) is the best known, with villages such as Cabezuela del Valle, Navaconcejo or Jerte, and routes such as the one through the Garganta de los Infiernos."
    - p: "Can you go into the terraces?"
      r: "They are private farmland. Walk along the signposted paths and viewpoints, and don't enter the plots or cut flowers or branches."
    - p: "Do I need to book accommodation?"
      r: "Yes, well in advance, because everything fills up on the weekends of peak blossom. Nearby towns such as those in La Vera or Plasencia are an alternative."
    - p: "How do I avoid the crowds?"
      r: "Go on a weekday, first thing in the morning or late in the afternoon, and avoid the weekends of peak colour. It is best to park in the designated areas and get around on foot."
    - p: "Is it a good plan with kids?"
      r: "Yes, the gentle routes through the valley are suitable for families. If your child has a pollen allergy, bring medication, because the blossom is intense in spring."

nieve:
  texto:
    - "Heading to the snow is one of the great winter plans, whether to ski, walk, go sledging or simply see the mountains turn white. Spain has resorts and snowy landscapes in Sierra Nevada, the Pyrenees, the Cantabrian range and the Central System."
    - "The season runs from December to March, although snow depends a lot on each winter. Before setting out, check the state of the slopes and the roads: you may need snow chains or winter tyres, and access roads to the resorts get jammed at weekends and on long weekends. Check traffic information before and during the trip."
    - "You don't need to ski. Many resorts and valleys offer sledging areas, snowshoe routes, cross-country skiing and snow walks, and you can rent clothing. Book your lift pass and equipment in advance for peak dates. Bring waterproof clothing in layers, sunglasses, sun cream and spare gloves, because the sun and the glare off the snow can fool you."
  mapa:
    titulo: "Where to head to the snow"
    centro: [40.5, -3.5]
    zoom: 6
    puntos:
      - { nombre: "Sierra Nevada (Granada)", lat: 37.09, lon: -3.4, desc: "The southernmost resort in Europe, with ski slopes and areas for walking and sledging." }
      - { nombre: "Aragonese Pyrenees (Formigal)", lat: 42.78, lon: -0.37, desc: "A large ski area in the Pyrenees, with cross-country skiing and snowshoe routes nearby." }
      - { nombre: "Catalan Pyrenees (Baqueira Beret)", lat: 42.7, lon: 0.93, desc: "One of the biggest resorts in the Pyrenees, in the Aran Valley." }
      - { nombre: "Cantabrian range (San Isidro)", lat: 43.05, lon: -5.37, desc: "Resort between León and Asturias, with Cantabrian high-mountain scenery." }
      - { nombre: "Central System (Navacerrada)", lat: 40.79, lon: -4.01, desc: "The closest snow to Madrid, with slopes and sledging areas; access roads get jammed at weekends." }
  faq:
    - p: "When is there snow in Spain?"
      r: "Usually from December to March, with January and February the most reliable months. It depends a lot on each winter and on altitude."
    - p: "Where can I go to the snow?"
      r: "Sierra Nevada (Granada), the Pyrenees (Huesca, Lleida, Navarre), the Cantabrian range, the Central System (Madrid, Segovia) or the Iberian System offer resorts and routes."
    - p: "Do I need to know how to ski?"
      r: "No. There are sledges, snowshoe routes, cross-country skiing, snow areas for children and walks. If you want to ski, many schools offer beginner lessons."
    - p: "Do I need snow chains?"
      r: "It depends on the road and the day. Check traffic information and carry chains or winter tyres. Sometimes carrying them is compulsory and the road is closed without them."
    - p: "Do I need to book?"
      r: "On peak dates (long weekends, Christmas, snowy weekends) it is wise to book your lift pass, rental and accommodation. Buying online is usually cheaper and quicker."
    - p: "What should I wear?"
      r: "Waterproof clothing in layers, gloves and a hat, sunglasses or ski goggles, sun protection and footwear with a good sole. A change of dry clothes for the journey back is always a good idea."

festival-san-sebastian:
  texto:
    - "The San Sebastián Film Festival, known as Zinemaldia, is one of the great film festivals of Spain and Europe. It takes place in September in Donostia-San Sebastián, with international premieres, stars on the red carpet and screenings open to the public."
    - "The programme includes the official competition section, which vies for the Golden Shell (Concha de Oro), as well as parallel sections, retrospectives and tributes, such as the Donostia Award for lifetime achievement. Screenings are spread across several cinemas and venues in the city, including the Kursaal and the Victoria Eugenia Theatre, and many of them are open to anyone."
    - "Check the official website for the programme, schedules and ticket sales, which usually go on sale only a few days before the screenings and sell out quickly. Get to the queues early, look at the schedules so you can combine screenings, and take the chance to stroll around the city and try the pintxos. It can rain in September: bring an umbrella."
  faq:
    - p: "When is the San Sebastián Film Festival?"
      r: "In September, for around nine days. The exact dates are announced each year."
    - p: "Can anyone go?"
      r: "Yes. Besides the sessions for industry professionals and press, there are many screenings open to the public with a ticket."
    - p: "Where do I buy tickets?"
      r: "Through the festival's official channels. They go on sale shortly beforehand and the most popular screenings sell out."
    - p: "What is the Golden Shell?"
      r: "It is the festival's main prize, awarded to the best film in the official section."
    - p: "Can you see the stars?"
      r: "There is usually a crowd at the red carpet outside the Victoria Eugenia Theatre. Check the schedules and arrive early."
    - p: "What else is there to do in San Sebastián?"
      r: "Stroll along La Concha bay, try pintxos in the Old Town and visit Mount Igueldo."

semana-santa-sevilla:
  texto:
    - "Seville's Holy Week (Semana Santa) is probably the most famous in Spain. For eight days, around sixty brotherhoods (hermandades) parade through the city with their floats of Christ and the Virgin, accompanied by hooded penitents (nazarenos), brass bands and thousands of people in the streets."
    - "All the brotherhoods pass through the Carrera Oficial, the official route that runs from La Campana to the Cathedral. The night between Maundy Thursday and Good Friday is the Madrugá, the most emotional and crowded of all, with brotherhoods such as El Silencio, El Gran Poder, La Macarena, Los Gitanos and La Esperanza de Triana."
    - "It is a huge event: the streets in the centre fill up and the processions take hours to pass. Download the official programme, choose the brotherhoods you want to see and arrive early. Book accommodation months in advance, use public transport and be patient with street closures. And remember: it is a religious act, so respect the silence and the penitents."
  faq:
    - p: "When is Holy Week in Seville?"
      r: "From Palm Sunday to Easter Sunday, which changes every year between March and April. Check the official calendar for the exact dates."
    - p: "What is the Madrugá?"
      r: "It is the night between Maundy Thursday and Good Friday. Several of the most emblematic brotherhoods set out during those hours, and it is the time of greatest crowds and emotion."
    - p: "Where can I watch the processions?"
      r: "The Carrera Oficial (from La Campana to the Cathedral) has a great atmosphere but also huge crowds. Other parts of the centre or neighbourhoods such as Triana let you watch them in more peace."
    - p: "Do I need to book?"
      r: "Not to watch the processions from the street, but you do for accommodation and restaurants, which sell out months in advance."
    - p: "How do I check the schedules?"
      r: "The Consejo de Hermandades y Cofradías publishes the official programme with the routes and times of each brotherhood. There are also apps and websites with real-time tracking."
    - p: "What should I bring or bear in mind?"
      r: "Comfortable shoes, layered clothing and patience. Respect the silence, don't cross between the processions and avoid using a flash near the floats."

fallas:
  texto:
    - "Las Fallas is Valencia's festival in honour of Saint Joseph, held from 15 to 19 March. Declared Intangible Cultural Heritage of Humanity by UNESCO, it combines cardboard and wood monuments, pyrotechnics, music, gunpowder and plenty of life on the streets."
    - "The fallas are huge satirical monuments that are set up in the streets on the 15th. You can tour them on foot, and the most important ones compete for prizes. Every day at 14:00, the mascletà, a symphony of gunpowder in the Town Hall square, is an unmissable event. On the 17th and 18th the Flower Offering to the Virgin of the Forsaken (Virgen de los Desamparados) takes place."
    - "The finale comes on the night of 19 March with the cremà: the fallas are set on fire, starting with the children's ones and ending with the main one at midnight. Book accommodation months in advance, use public transport and get there early to find a spot at the mascletà. Be careful with firecrackers in the street and with small children."
  faq:
    - p: "When are the Fallas?"
      r: "From 15 to 19 March every year. The plantà is on the 15th and the cremà on the night of the 19th."
    - p: "What is the mascletà?"
      r: "It is a gunpowder show that focuses on sound and power rather than colours. It is fired every day at 14:00 in the Town Hall square and you feel it in your body."
    - p: "What is the cremà?"
      r: "It is the burning of the fallas on the night of 19 March, with the final burning of the city's main falla at midnight."
    - p: "How do I get around Valencia during the Fallas?"
      r: "On foot and by public transport. There are road closures and parking is almost impossible. The metro runs a reinforced service."
    - p: "What is there to eat?"
      r: "Pumpkin fritters (buñuelos) with hot chocolate, paella and street sandwiches. The buñuelos are the typical flavour of these festivities."
    - p: "Is it a good plan with children?"
      r: "Yes, there are children's fallas and activities, but the noise of the firecrackers and the crowds can be overwhelming for little ones."

semana-santa:
  texto:
    - "Holy Week (Semana Santa) is the week before Easter Sunday, from Palm Sunday to Easter Sunday, and it is one of the most profound and most visited celebrations in Spain. Brotherhoods (cofradías and hermandades) bring their floats and images out onto the streets in processions that blend faith, art, music and tradition."
    - "Each city has its own style. In Seville and Málaga the large thrones and canopies stand out, in Valladolid, Zamora or Salamanca the processions are more sober and feature Castilian religious sculpture, and in places like Cuenca or Murcia there are very distinctive customs. Many are Festivals of International Tourist Interest."
    - "As the dates depend on Easter, they change every year, between March and April. If you plan to travel, book accommodation well in advance and check the official routes and times of each brotherhood, which are published weeks beforehand. The processions are religious events: keep quiet, don't cross between the processions and avoid flash photography when the floats go by."
  faq:
    - p: "When is Holy Week?"
      r: "It is the week before Easter Sunday, which falls on a different date every year between late March and late April. It runs from Palm Sunday to Easter Sunday."
    - p: "Where can I see the best processions?"
      r: "Seville, Málaga, Valladolid, Zamora, Salamanca, Cuenca, Murcia and Cartagena are among the best known, each with a very different style. Many are Festivals of International Tourist Interest."
    - p: "Do I have to pay to watch the processions?"
      r: "No. You can watch them for free from the street. In some cities there are paid seats along the official route or at specific stretches."
    - p: "Which days have the most processions?"
      r: "Maundy Thursday and Good Friday are usually the busiest days, and the nights with the most atmosphere are the early hours between the two in cities like Seville. Palm Sunday and Holy Saturday also have processions."
    - p: "How do I plan to see them?"
      r: "Check each brotherhood's official programme, with its times and routes, get to a good spot early and be patient: the processions move slowly and streets are closed to traffic."
    - p: "Is it a good plan with children?"
      r: "Yes, but with care: there are big crowds and long waits. Choose afternoon processions, find a spot with room and explain to them that it is a moment of respect."

feria-abril:
  texto:
    - "The Seville April Fair (Feria de Abril) is a week of celebration with marquees (casetas), sevillanas dancing, horses and horse-drawn carriages, and flamenco dresses. It is held at the Real de la Feria fairground, in the Los Remedios district, about two weeks after Holy Week."
    - "The fair kicks off with the Alumbrado, on Monday night, when the thousands of light bulbs on the main gate are switched on. During the week, from midday, there is a parade of horses and carriages; after that, the casetas fill up with music, dancing, food and drink: rebujito, fino sherry, ham and fried fish (pescaíto frito). The fair closes on Sunday with a fireworks display."
    - "One thing worth knowing: most casetas are private and only people with an invitation or members can get in. There are also public casetas and some run by the city council, open to everyone, and you can walk freely along the streets and around the fairground. People usually dress up: a flamenco dress for women and a short jacket (traje corto) or a suit for men."
  faq:
    - p: "When is the April Fair?"
      r: "It normally starts two weeks after Easter Sunday, between April and May. It lasts a week, with the Alumbrado on Monday night."
    - p: "Can I enter any caseta?"
      r: "No. Most are private and you can only get in with an invitation or as a member. There are public casetas and council-run ones open to everyone."
    - p: "How much does it cost to enter the fair?"
      r: "Entry to the grounds is free. You pay for what you consume, and the rides on Calle del Infierno are paid."
    - p: "What should I wear?"
      r: "Many visitors wear a flamenco dress or traje corto, but it is not compulsory. The most important thing is comfortable footwear, because you walk a lot."
    - p: "How do I get there?"
      r: "By metro, tram or bus. Avoid taking a car: parking is almost impossible and the surrounding area is closed to traffic."
    - p: "Is it a good plan with children?"
      r: "During the day, yes, with the horse parade and family-friendly casetas. Calle del Infierno has rides. At night there are more people and more noise."

san-fermin:
  texto:
    - "San Fermín is Pamplona's festival, held from 6 to 14 July, and one of the best-known celebrations in the world. It begins with the chupinazo in the Town Hall square, at midday on 6 July, and ends at midnight on the 14th with the Pobre de mí."
    - "The great symbol is the encierros (running of the bulls): every morning at eight o'clock, the bulls run along a route of about 850 metres from the Santo Domingo corral to the bullring. But San Fermín is much more: the procession of San Fermín on 7 July, giants and big-heads (gigantes y cabezudos), concerts, fireworks, white clothing with a red scarf and a street atmosphere day and night."
    - "Running with the bulls is dangerous and has rules: you must be of legal age, must not have drunk alcohol and must follow the organisers' instructions. If you prefer to watch, you can do so on television or from an authorised spot, which fill up very early. Book accommodation months in advance, because prices go up and the city fills up."
  faq:
    - p: "When is San Fermín?"
      r: "From 6 to 14 July every year. It starts with the chupinazo on the 6th at midday and ends with the Pobre de mí at midnight on the 14th."
    - p: "What time are the bull runs?"
      r: "Every morning at 8:00, from 7 to 14 July. It lasts only a few minutes."
    - p: "How can I watch a bull run?"
      r: "On television, or live from authorised areas, which fill up very early. Some balconies have paid places. The spots with a view of the route fill up from before dawn."
    - p: "Can anyone run?"
      r: "No. You must be of legal age, not be under the influence of alcohol or other substances, and obey the organisers' rules. It is a dangerous activity and people are injured every year."
    - p: "What should I wear?"
      r: "Traditionally, white clothes with a red scarf around the neck and a red sash. Comfortable, closed shoes and a change of clothes, because you will almost certainly get dirty."
    - p: "Is it a good plan with children?"
      r: "The daytime atmosphere is family-friendly, with giants, big-heads and activities for children. At night it is more crowded. It is best to avoid the bull runs and the most packed areas."

tomatina:
  texto:
    - "La Tomatina is the world's biggest tomato fight. It takes place in Buñol, a town in the province of Valencia, on the last Wednesday of August, and for about an hour thousands of people throw ripe tomatoes at each other until the streets are stained red."
    - "To take part you need a ticket. The town council limits capacity and sells tickets in advance, so it is best to buy them early through the official channels and be wary of resellers. The festival begins with the palo jabón, a greased pole with a ham on top, and the battle starts when a rocket is fired at around 11 in the morning."
    - "Wear old clothes and shoes you don't mind losing, swimming goggles to protect your eyes, and gloves. Squash the tomato before throwing it so as not to hurt anyone, and throw nothing but tomatoes. Don't bring valuables or cameras, and allow plenty of time to get there from Valencia, for example by train or on the buses organised for that day."
  faq:
    - p: "When is La Tomatina?"
      r: "On the last Wednesday of August, in Buñol (Valencia). The battle lasts about an hour, starting at 11 in the morning."
    - p: "Do I need a ticket?"
      r: "Yes. Capacity is limited and tickets are bought in advance through the official channels. Avoid buying from resellers."
    - p: "How do I get to Buñol?"
      r: "From Valencia, by Cercanías commuter train or bus. It is best to arrive early, because there are huge crowds on the day of the festival."
    - p: "What should I wear?"
      r: "Old clothes and shoes you don't mind losing. Many participants wear swimming goggles to protect their eyes, and gloves."
    - p: "What are the rules?"
      r: "Squash the tomato before throwing it, throw nothing but tomatoes, don't bring glass or valuables and follow the organisers' instructions."
    - p: "Is it a good plan with children?"
      r: "There is a minimum age to take part and the festival is very crowded. Check the official conditions before buying tickets."
