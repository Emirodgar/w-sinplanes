  - id: nautilus-live
    titulo:
      es: "Nautilus Live: exploración de las profundidades marinas en directo"
      en: "Nautilus Live: deep-sea exploration, live"
      fr: "Nautilus Live : l’exploration des abysses en direct"
      de: "Nautilus Live: Tiefseeforschung live"
      it: "Nautilus Live: l’esplorazione degli abissi in diretta"
      pt: "Nautilus Live: exploração das profundezas do mar em direto"
    fuente: Ocean Exploration Trust
    enlace: https://nautiluslive.org/
    descripcion:
      es: "Imágenes en directo, las 24 horas, del fondo del océano, captadas por los vehículos submarinos del buque de investigación E/V Nautilus y comentadas por su equipo científico."
      en: "Round-the-clock live footage of the ocean floor, filmed by the underwater vehicles of the research vessel E/V Nautilus and narrated by its science team."
      fr: "Des images en direct, 24 heures sur 24, des fonds océaniques, filmées par les véhicules sous-marins du navire de recherche E/V Nautilus et commentées par son équipe scientifique."
      de: "Rund um die Uhr Live-Bilder vom Meeresboden, aufgenommen von den Unterwasserfahrzeugen des Forschungsschiffs E/V Nautilus und vom Wissenschaftsteam kommentiert."
      it: "Immagini in diretta, 24 ore su 24, dei fondali oceanici, riprese dai veicoli sottomarini della nave da ricerca E/V Nautilus e commentate dal suo team scientifico."
      pt: "Imagens em direto, 24 horas por dia, do fundo do oceano, captadas pelos veículos submarinos do navio de investigação E/V Nautilus e comentadas pela sua equipa científica."
    detalle:
      es:
        - "Nautilus Live es el programa de exploración de las profundidades marinas del Ocean Exploration Trust (OET), que opera a bordo del buque de investigación E/V Nautilus. Lo más especial es que emite por internet, a todas horas, lo que ocurre en la expedición: el fondo del océano, las inmersiones y la vida a bordo, con la narración en directo de la tripulación científica."
        - "Cualquiera puede ver el vídeo y los datos en tiempo real de los vehículos operados de forma remota (ROV) mientras exploran zonas del lecho marino que nadie había visto antes. Es una ventana abierta a una parte del planeta que casi no conocemos."
        - "El OET lo fundó en 2007 el explorador Robert Ballard, famoso por haber encontrado el Titanic. Entre sus objetivos está inspirar a las nuevas generaciones en ciencia, tecnología, ingeniería, artes y matemáticas (STEAM), y por eso embarca a docentes y estudiantes como parte de la tripulación."
        - "La expedición y la zona que se explora cambian a lo largo del año: conviene mirar en la web qué se está haciendo en cada momento."
      en:
        - "Nautilus Live is the deep-sea exploration programme of the Ocean Exploration Trust (OET), which operates aboard the research vessel E/V Nautilus. What makes it special is that it streams the expedition over the internet around the clock: the ocean floor, the dives and life on board, with live narration from the science crew."
        - "Anyone can watch video and real-time data from the remotely operated vehicles (ROVs) as they explore parts of the seabed that nobody has seen before. It is an open window onto a part of the planet we barely know."
        - "OET was founded in 2007 by explorer Robert Ballard, famous for finding the Titanic. One of its aims is to inspire new generations in science, technology, engineering, arts and mathematics (STEAM), which is why it brings teachers and students aboard as part of the crew."
        - "The expedition and the area being explored change throughout the year, so check the website to see what is happening at any given time."
      fr:
        - "Nautilus Live est le programme d’exploration des grands fonds de l’Ocean Exploration Trust (OET), qui opère à bord du navire de recherche E/V Nautilus. Sa particularité : il diffuse l’expédition sur Internet 24 heures sur 24, avec les fonds marins, les plongées et la vie à bord, commentés en direct par l’équipe scientifique."
        - "N’importe qui peut suivre la vidéo et les données en temps réel des véhicules télécommandés (ROV) pendant qu’ils explorent des zones des fonds marins que personne n’avait encore vues. C’est une fenêtre ouverte sur une partie de la planète que nous connaissons à peine."
        - "L’OET a été fondé en 2007 par l’explorateur Robert Ballard, célèbre pour avoir retrouvé le Titanic. Il vise notamment à inspirer les jeunes générations dans les sciences, la technologie, l’ingénierie, les arts et les mathématiques (STEAM) : c’est pourquoi il embarque enseignants et élèves dans l’équipage."
        - "L’expédition et la zone explorée changent au fil de l’année : mieux vaut consulter le site pour savoir ce qui se passe en ce moment."
      de:
        - "Nautilus Live ist das Tiefsee-Forschungsprogramm des Ocean Exploration Trust (OET), das an Bord des Forschungsschiffs E/V Nautilus arbeitet. Das Besondere: Die Expedition wird rund um die Uhr im Internet übertragen, mit Meeresboden, Tauchgängen und Bordleben, live kommentiert vom Wissenschaftsteam."
        - "Jeder kann Video und Echtzeitdaten der ferngesteuerten Unterwasserfahrzeuge (ROV) verfolgen, während sie Meeresbodenregionen erkunden, die noch niemand gesehen hat. Es ist ein offenes Fenster zu einem Teil des Planeten, den wir kaum kennen."
        - "Der OET wurde 2007 vom Entdecker Robert Ballard gegründet, der durch das Auffinden der Titanic bekannt wurde. Zu seinen Zielen gehört es, junge Generationen für Wissenschaft, Technik, Ingenieurwesen, Kunst und Mathematik (STEAM) zu begeistern, weshalb Lehrkräfte und Schüler als Teil der Crew an Bord kommen."
        - "Expedition und erkundetes Gebiet wechseln im Lauf des Jahres, ein Blick auf die Website zeigt, was gerade läuft."
      it:
        - "Nautilus Live è il programma di esplorazione dei fondali marini dell’Ocean Exploration Trust (OET), che opera a bordo della nave da ricerca E/V Nautilus. La particolarità è che trasmette la spedizione su internet 24 ore su 24: i fondali, le immersioni e la vita a bordo, con il commento in diretta dell’equipe scientifica."
        - "Chiunque può seguire video e dati in tempo reale dei veicoli telecomandati (ROV) mentre esplorano zone dei fondali che nessuno aveva mai visto. È una finestra aperta su una parte del pianeta che conosciamo appena."
        - "L’OET è stato fondato nel 2007 dall’esploratore Robert Ballard, famoso per aver ritrovato il Titanic. Tra i suoi obiettivi c’è ispirare le nuove generazioni nelle scienze, nella tecnologia, nell’ingegneria, nelle arti e nella matematica (STEAM), per questo imbarca docenti e studenti come parte dell’equipaggio."
        - "La spedizione e la zona esplorata cambiano nel corso dell’anno: conviene consultare il sito per sapere che cosa sta succedendo in ogni momento."
      pt:
        - "O Nautilus Live é o programa de exploração das profundezas do mar do Ocean Exploration Trust (OET), que opera a bordo do navio de investigação E/V Nautilus. A particularidade é que transmite a expedição pela internet 24 horas por dia: o fundo do oceano, os mergulhos e a vida a bordo, com a narração em direto da equipa científica."
        - "Qualquer pessoa pode ver o vídeo e os dados em tempo real dos veículos operados remotamente (ROV) enquanto exploram zonas do leito marinho que ninguém tinha visto antes. É uma janela aberta para uma parte do planeta que mal conhecemos."
        - "O OET foi fundado em 2007 pelo explorador Robert Ballard, famoso por ter encontrado o Titanic. Entre os seus objetivos está inspirar as novas gerações nas ciências, tecnologia, engenharia, artes e matemática (STEAM), por isso leva professores e estudantes a bordo como parte da tripulação."
        - "A expedição e a zona explorada mudam ao longo do ano, por isso convém consultar o site para saber o que está a acontecer em cada momento."

  - id: audubon-100-mejores-fotografias-aves
    titulo:
      es: "Audubon: las 100 mejores fotografías de aves"
      en: "Audubon: the 100 best bird photographs"
      fr: "Audubon : les 100 plus belles photos d’oiseaux"
      de: "Audubon: die 100 besten Vogelfotos"
      it: "Audubon: le 100 migliori fotografie di uccelli"
      pt: "Audubon: as 100 melhores fotografias de aves"
    fuente: Audubon
    enlace: https://www.audubon.org/es/revista/premios-de-fotografia-audubon-2026-los-100-mejores
    descripcion:
      es: "Una galería de la revista Audubon con las cien mejores imágenes de sus concursos anuales de fotografía de aves, a gran tamaño y con la historia de cada toma."
      en: "A gallery from Audubon magazine with the hundred best images from its annual bird photography contests, shown large and with the story behind each shot."
      fr: "Une galerie du magazine Audubon avec les cent meilleures images de ses concours annuels de photographie d’oiseaux, en grand format et avec l’histoire de chaque cliché."
      de: "Eine Galerie des Magazins Audubon mit den hundert besten Bildern seiner jährlichen Vogelfotowettbewerbe, großformatig und mit der Geschichte hinter jeder Aufnahme."
      it: "Una galleria della rivista Audubon con le cento migliori immagini dei suoi concorsi annuali di fotografia di uccelli, a grande formato e con la storia di ogni scatto."
      pt: "Uma galeria da revista Audubon com as cem melhores imagens dos seus concursos anuais de fotografia de aves, em grande formato e com a história de cada fotografia."
    detalle:
      es:
        - "Audubon, la revista especializada en aves, ha reunido en un especial digital las cien mejores fotografías de sus concursos anuales. Sus autores son fotógrafos de Estados Unidos, Canadá, Chile y Colombia."
        - "Además de la calidad de las imágenes, destaca cómo está presentado: cada foto se ve a gran tamaño y va acompañada de su ficha técnica y de la historia de cómo se consiguió."
        - "En un formato parecido se pueden ver también las fotografías ganadoras y las que recibieron menciones de honor en los Audubon Photography Awards 2026. Una cita para quien disfrute de la fotografía o de la naturaleza."
      en:
        - "Audubon, the magazine devoted to birds, has gathered the hundred best photographs from its annual contests in a digital special. The photographers come from the United States, Canada, Chile and Colombia."
        - "Beyond the quality of the images, the presentation stands out: each photo is shown large, with its technical details and the story of how it was taken."
        - "The winning photographs and the honourable mentions from the 2026 Audubon Photography Awards are available in a similar format. A treat for anyone who enjoys photography or nature."
      fr:
        - "Audubon, le magazine consacré aux oiseaux, a réuni dans un dossier numérique les cent meilleures photographies de ses concours annuels. Leurs auteurs viennent des États-Unis, du Canada, du Chili et de Colombie."
        - "Au-delà de la qualité des images, la présentation se distingue : chaque photo s’affiche en grand, avec sa fiche technique et l’histoire de sa prise de vue."
        - "Les photographies lauréates et les mentions d’honneur des Audubon Photography Awards 2026 sont également disponibles dans un format similaire. Un rendez-vous pour qui aime la photographie ou la nature."
      de:
        - "Audubon, das Magazin für Vogelkunde, hat in einem digitalen Special die hundert besten Fotos seiner jährlichen Wettbewerbe zusammengestellt. Die Fotografinnen und Fotografen stammen aus den USA, Kanada, Chile und Kolumbien."
        - "Neben der Qualität der Bilder überzeugt die Präsentation: Jedes Foto wird groß gezeigt, mit technischen Angaben und der Geschichte, wie es entstanden ist."
        - "In ähnlicher Form sind auch die Siegerfotos und die lobenden Erwähnungen der Audubon Photography Awards 2026 zu sehen. Ein Muss für alle, die Fotografie oder Natur lieben."
      it:
        - "Audubon, la rivista specializzata sugli uccelli, ha raccolto in uno speciale digitale le cento migliori fotografie dei suoi concorsi annuali. Gli autori sono fotografi di Stati Uniti, Canada, Cile e Colombia."
        - "Oltre alla qualità delle immagini, colpisce la presentazione: ogni foto si vede a grande formato ed è accompagnata dalla scheda tecnica e dalla storia di come è stata scattata."
        - "In un formato simile si possono vedere anche le fotografie vincitrici e le menzioni d’onore degli Audubon Photography Awards 2026. Un appuntamento per chi ama la fotografia o la natura."
      pt:
        - "A Audubon, revista especializada em aves, reuniu num especial digital as cem melhores fotografias dos seus concursos anuais. Os autores são fotógrafos dos Estados Unidos, Canadá, Chile e Colômbia."
        - "Para além da qualidade das imagens, destaca-se a apresentação: cada fotografia é vista em grande formato e vem acompanhada da ficha técnica e da história de como foi tirada."
        - "Num formato semelhante também se podem ver as fotografias vencedoras e as menções honrosas dos Audubon Photography Awards 2026. Uma visita para quem gosta de fotografia ou de natureza."

  - id: relief-world
    titulo:
      es: "Relief → World: mapa de elevación interactivo"
      en: "Relief → World: interactive elevation map"
      fr: "Relief → World : carte d’altitude interactive"
      de: "Relief → World: interaktive Höhenkarte"
      it: "Relief → World: mappa altimetrica interattiva"
      pt: "Relief → World: mapa de elevação interativo"
    fuente: Bert Spaan
    enlace: https://relief.bertspaan.nl/world
    descripcion:
      es: "Un mapa de relieve de todo el mundo en el que haces zoom hasta cualquier punto del planeta y la paleta de colores se ajusta a las altitudes de la zona que estás viendo."
      en: "A relief map of the whole world where you zoom in to any point on the planet and the colour palette adjusts to the altitudes of the area you are looking at."
      fr: "Une carte du relief du monde entier où l’on zoome sur n’importe quel point de la planète et dont la palette de couleurs s’adapte aux altitudes de la zone observée."
      de: "Eine Reliefkarte der ganzen Welt, in die man an jeden Punkt des Planeten hineinzoomen kann und deren Farbpalette sich an die Höhen des gerade betrachteten Gebiets anpasst."
      it: "Una mappa del rilievo di tutto il mondo in cui si può ingrandire qualsiasi punto del pianeta e la tavolozza dei colori si adatta alle altitudini della zona che si sta guardando."
      pt: "Um mapa de relevo de todo o mundo em que se faz zoom até qualquer ponto do planeta e a paleta de cores se ajusta às altitudes da zona que está a ver."
    detalle:
      es:
        - "Relief → World es un mapa de elevación interactivo de todo el planeta. Se recorre con el zoom y arrastrando el mapa hasta cualquier lugar del mundo."
        - "Lo que lo distingue es el color. Los mapas de altitud suelen usar la misma escala para todo el globo, de modo que una llanura apenas se distingue de otra. Aquí, la paleta se recalcula con el rango de altitudes de la zona que tienes delante, y por eso se aprecian los matices del relieve tanto en una cordillera como en una llanura casi plana."
        - "Un buen juguete para curiosear por geografía: busca tu región, un valle o una isla y deja que el color te cuente cómo es el terreno."
      en:
        - "Relief → World is an interactive elevation map of the whole planet. You explore it by zooming and dragging to any place in the world."
        - "What sets it apart is the colour. Elevation maps usually use the same scale for the entire globe, so one plain is hard to tell from another. Here, the palette is recalculated from the altitude range of the area in front of you, so you can see the subtle shapes of the terrain in a mountain range as well as on an almost flat plain."
        - "A good toy for geography browsing: look up your region, a valley or an island and let the colours show you what the terrain is like."
      fr:
        - "Relief → World est une carte d’altitude interactive de toute la planète. On l’explore en zoomant et en faisant glisser la carte vers n’importe quel endroit du monde."
        - "Ce qui la distingue, c’est la couleur. Les cartes d’altitude utilisent en général la même échelle pour tout le globe, si bien qu’on distingue à peine une plaine d’une autre. Ici, la palette est recalculée selon la plage d’altitudes de la zone affichée : on perçoit les nuances du relief aussi bien dans une chaîne de montagnes que dans une plaine presque plate."
        - "Un bon terrain de jeu pour flâner en géographie : cherchez votre région, une vallée ou une île et laissez les couleurs vous raconter le terrain."
      de:
        - "Relief → World ist eine interaktive Höhenkarte des ganzen Planeten. Man erkundet sie durch Zoomen und Verschieben an jeden beliebigen Ort der Welt."
        - "Das Besondere ist die Farbe. Höhenkarten verwenden meist dieselbe Skala für den ganzen Globus, sodass sich eine Ebene kaum von der anderen unterscheidet. Hier wird die Palette aus dem Höhenbereich des gerade gezeigten Gebiets neu berechnet, sodass man die feinen Formen des Geländes in einem Gebirge ebenso erkennt wie in einer fast flachen Ebene."
        - "Ein schönes Spielzeug zum Stöbern in der Geografie: Region, Tal oder Insel suchen und sich von den Farben das Gelände erzählen lassen."
      it:
        - "Relief → World è una mappa altimetrica interattiva di tutto il pianeta. Si esplora con lo zoom e trascinando la mappa fino a qualsiasi luogo del mondo."
        - "Ciò che la distingue è il colore. Le mappe altimetriche di solito usano la stessa scala per tutto il globo, così una pianura si distingue a stento da un’altra. Qui la tavolozza viene ricalcolata in base all’intervallo di altitudini della zona visualizzata, per cui si colgono le sfumature del rilievo sia in una catena montuosa sia in una pianura quasi piatta."
        - "Un bel giocattolo per curiosare in geografia: cerca la tua regione, una valle o un’isola e lascia che i colori ti raccontino il terreno."
      pt:
        - "O Relief → World é um mapa de elevação interativo de todo o planeta. Explora-se com o zoom e arrastando o mapa até qualquer lugar do mundo."
        - "O que o distingue é a cor. Os mapas de altitude costumam usar a mesma escala para todo o globo, pelo que mal se distingue uma planície de outra. Aqui, a paleta é recalculada a partir do intervalo de altitudes da zona que tem à frente, e assim notam-se as nuances do relevo tanto numa cordilheira como numa planície quase plana."
        - "Um bom brinquedo para explorar a geografia: procure a sua região, um vale ou uma ilha e deixe que as cores lhe contem como é o terreno."

  - id: nasa-eyes-on-the-solar-system
    titulo:
      es: "NASA’s Eyes: el sistema solar en 3D"
      en: "NASA’s Eyes: the solar system in 3D"
      fr: "NASA’s Eyes : le système solaire en 3D"
      de: "NASA’s Eyes: das Sonnensystem in 3D"
      it: "NASA’s Eyes: il sistema solare in 3D"
      pt: "NASA’s Eyes: o sistema solar em 3D"
    fuente: NASA
    enlace: https://eyes.nasa.gov/apps/solar-system/
    descripcion:
      es: "Aplicación gratuita de la NASA que se abre en el navegador y permite explorar en 3D planetas, lunas, asteroides, cometas y misiones espaciales con datos reales."
      en: "A free NASA app that runs in your browser and lets you explore planets, moons, asteroids, comets and space missions in 3D, using real data."
      fr: "Une application gratuite de la NASA qui s’ouvre dans le navigateur et permet d’explorer en 3D planètes, lunes, astéroïdes, comètes et missions spatiales à partir de données réelles."
      de: "Eine kostenlose NASA-App, die im Browser läuft und es erlaubt, Planeten, Monde, Asteroiden, Kometen und Raumfahrtmissionen mit echten Daten in 3D zu erkunden."
      it: "Un’app gratuita della NASA che si apre nel browser e permette di esplorare in 3D pianeti, lune, asteroidi, comete e missioni spaziali con dati reali."
      pt: "Uma aplicação gratuita da NASA que abre no navegador e permite explorar em 3D planetas, luas, asteroides, cometas e missões espaciais com dados reais."
    detalle:
      es:
        - "NASA’s Eyes es un conjunto de aplicaciones de visualización en 3D con las que cualquiera puede explorar, de forma entretenida e interactiva, datos e imágenes reales de la NASA. Eyes on the Solar System, la más popular, reúne cientos de planetas, lunas, asteroides, cometas y misiones."
        - "Una de sus novedades es la superficie completa de Marte: ahora es posible aterrizar en el planeta y recorrerlo en 3D."
        - "Todas las aplicaciones funcionan en un navegador normal, sin descargar ni instalar nada, y son gratuitas."
      en:
        - "NASA’s Eyes is a set of 3D visualisation apps that let anyone explore real NASA data and images in a fun, interactive way. Eyes on the Solar System, the best known, brings together hundreds of planets, moons, asteroids, comets and missions."
        - "One of its new features is the complete surface of Mars: you can now land on the planet and explore it in 3D."
        - "All the apps run in an ordinary web browser, with nothing to download or install, and they are free."
      fr:
        - "NASA’s Eyes est un ensemble d’applications de visualisation en 3D qui permet à chacun d’explorer de façon ludique et interactive des données et des images réelles de la NASA. Eyes on the Solar System, la plus connue, réunit des centaines de planètes, de lunes, d’astéroïdes, de comètes et de missions."
        - "L’une de ses nouveautés est la surface complète de Mars : on peut désormais atterrir sur la planète et l’explorer en 3D."
        - "Toutes les applications fonctionnent dans un navigateur web ordinaire, sans rien télécharger ni installer, et sont gratuites."
      de:
        - "NASA’s Eyes ist eine Sammlung von 3D-Visualisierungs-Apps, mit denen jeder reale NASA-Daten und -Bilder unterhaltsam und interaktiv erkunden kann. Eyes on the Solar System, die bekannteste, vereint Hunderte von Planeten, Monden, Asteroiden, Kometen und Missionen."
        - "Eine der Neuerungen ist die vollständige Marsoberfläche: Man kann jetzt auf dem Planeten landen und ihn in 3D erkunden."
        - "Alle Apps laufen in einem normalen Webbrowser, ohne Download oder Installation, und sind kostenlos."
      it:
        - "NASA’s Eyes è un insieme di applicazioni di visualizzazione in 3D con cui chiunque può esplorare in modo divertente e interattivo dati e immagini reali della NASA. Eyes on the Solar System, la più nota, riunisce centinaia di pianeti, lune, asteroidi, comete e missioni."
        - "Una delle novità è la superficie completa di Marte: ora è possibile atterrare sul pianeta ed esplorarlo in 3D."
        - "Tutte le applicazioni funzionano in un normale browser, senza scaricare o installare nulla, e sono gratuite."
      pt:
        - "O NASA’s Eyes é um conjunto de aplicações de visualização em 3D com que qualquer pessoa pode explorar, de forma divertida e interativa, dados e imagens reais da NASA. O Eyes on the Solar System, o mais conhecido, reúne centenas de planetas, luas, asteroides, cometas e missões."
        - "Uma das novidades é a superfície completa de Marte: agora é possível aterrar no planeta e explorá-lo em 3D."
        - "Todas as aplicações funcionam num navegador normal, sem descarregar nem instalar nada, e são gratuitas."

  - id: nasa-eyes-on-the-earth
    titulo:
      es: "NASA’s Eyes on the Earth: el planeta visto por los satélites"
      en: "NASA’s Eyes on the Earth: the planet seen by satellites"
      fr: "NASA’s Eyes on the Earth : la planète vue par les satellites"
      de: "NASA’s Eyes on the Earth: der Planet aus Sicht der Satelliten"
      it: "NASA’s Eyes on the Earth: il pianeta visto dai satelliti"
      pt: "NASA’s Eyes on the Earth: o planeta visto pelos satélites"
    fuente: NASA
    enlace: https://eyes.nasa.gov/apps/earth/
    descripcion:
      es: "La versión de NASA’s Eyes dedicada a la Tierra: una aplicación 3D gratuita para ver nuestro planeta con los datos y las imágenes de los satélites de observación de la NASA."
      en: "The Earth edition of NASA’s Eyes: a free 3D app to see our planet through the data and images of NASA’s Earth-observing satellites."
      fr: "La version de NASA’s Eyes consacrée à la Terre : une application 3D gratuite pour voir notre planète à travers les données et les images des satellites d’observation de la NASA."
      de: "Die Erd-Version von NASA’s Eyes: eine kostenlose 3D-App, um unseren Planeten mit den Daten und Bildern der Erdbeobachtungssatelliten der NASA zu sehen."
      it: "La versione di NASA’s Eyes dedicata alla Terra: un’app 3D gratuita per vedere il nostro pianeta attraverso i dati e le immagini dei satelliti di osservazione della NASA."
      pt: "A versão do NASA’s Eyes dedicada à Terra: uma aplicação 3D gratuita para ver o nosso planeta através dos dados e das imagens dos satélites de observação da NASA."
    detalle:
      es:
        - "Eyes on the Earth forma parte de NASA’s Eyes y centra la mirada en nuestro planeta. Permite seguir en tiempo real a los satélites de las misiones de ciencia de la Tierra de la NASA y ver cómo observan el planeta desde el espacio."
        - "También ofrece los «signos vitales» de la Tierra, como el dióxido de carbono, el ozono o el nivel del mar, e imágenes de satélite de grandes fenómenos meteorológicos. Se puede elegir un periodo y reproducir los datos y las imágenes globales de hasta veinte años atrás."
        - "Funciona en el navegador, sin descargar nada, y es gratuita."
      en:
        - "Eyes on the Earth is part of NASA’s Eyes and turns its gaze on our own planet. It lets you follow NASA’s Earth science missions’ satellites in real time and see how they observe the planet from space."
        - "It also shows Earth’s “vital signs”, such as carbon dioxide, ozone and sea level, along with satellite imagery of major weather events. You can pick a date range and replay global data and imagery going back as far as twenty years."
        - "It runs in your browser, with nothing to download, and it is free."
      fr:
        - "Eyes on the Earth fait partie de NASA’s Eyes et tourne le regard vers notre propre planète. Elle permet de suivre en temps réel les satellites des missions de science de la Terre de la NASA et de voir comment ils observent la planète depuis l’espace."
        - "Elle présente aussi les « signes vitaux » de la Terre, comme le dioxyde de carbone, l’ozone ou le niveau de la mer, ainsi que des images satellites de grands phénomènes météorologiques. On peut choisir une période et rejouer les données et les images mondiales jusqu’à vingt ans en arrière."
        - "Elle fonctionne dans le navigateur, sans rien télécharger, et est gratuite."
      de:
        - "Eyes on the Earth gehört zu NASA’s Eyes und richtet den Blick auf unseren eigenen Planeten. Man kann die Satelliten der Erdwissenschaftsmissionen der NASA in Echtzeit verfolgen und sehen, wie sie die Erde aus dem All beobachten."
        - "Außerdem zeigt die App die „Vitalzeichen“ der Erde, etwa Kohlendioxid, Ozon oder Meeresspiegel, sowie Satellitenbilder großer Wetterereignisse. Man kann einen Zeitraum wählen und globale Daten und Bilder bis zu zwanzig Jahre zurück abspielen."
        - "Sie läuft im Browser, ohne Download, und ist kostenlos."
      it:
        - "Eyes on the Earth fa parte di NASA’s Eyes e rivolge lo sguardo al nostro pianeta. Permette di seguire in tempo reale i satelliti delle missioni di scienza della Terra della NASA e di vedere come osservano il pianeta dallo spazio."
        - "Offre anche i «segni vitali» della Terra, come anidride carbonica, ozono o livello del mare, e immagini satellitari dei grandi fenomeni meteorologici. Si può scegliere un periodo e rivedere dati e immagini globali fino a vent’anni fa."
        - "Funziona nel browser, senza scaricare nulla, ed è gratuita."
      pt:
        - "O Eyes on the Earth faz parte do NASA’s Eyes e volta o olhar para o nosso próprio planeta. Permite seguir em tempo real os satélites das missões de ciência da Terra da NASA e ver como observam o planeta a partir do espaço."
        - "Mostra também os «sinais vitais» da Terra, como o dióxido de carbono, o ozono ou o nível do mar, e imagens de satélite de grandes fenómenos meteorológicos. Pode escolher-se um período e rever dados e imagens globais até vinte anos atrás."
        - "Funciona no navegador, sem descarregar nada, e é gratuita."

  - id: nasa-eyes-on-asteroids
    titulo:
      es: "NASA’s Eyes on Asteroids: asteroides y cometas cercanos a la Tierra"
      en: "NASA’s Eyes on Asteroids: near-Earth asteroids and comets"
      fr: "NASA’s Eyes on Asteroids : astéroïdes et comètes proches de la Terre"
      de: "NASA’s Eyes on Asteroids: erdnahe Asteroiden und Kometen"
      it: "NASA’s Eyes on Asteroids: asteroidi e comete vicini alla Terra"
      pt: "NASA’s Eyes on Asteroids: asteroides e cometas próximos da Terra"
    fuente: NASA/JPL
    enlace: https://eyes.nasa.gov/apps/asteroids/
    descripcion:
      es: "Una visualización 3D gratuita de los asteroides y cometas conocidos que se acercan a la órbita de la Tierra, con sus próximos pasos cercanos y las misiones que los estudian."
      en: "A free 3D visualisation of the known asteroids and comets that come near Earth’s orbit, with their upcoming close approaches and the missions that study them."
      fr: "Une visualisation 3D gratuite des astéroïdes et comètes connus qui s’approchent de l’orbite terrestre, avec leurs prochains passages rapprochés et les missions qui les étudient."
      de: "Eine kostenlose 3D-Visualisierung der bekannten Asteroiden und Kometen, die der Erdbahn nahe kommen, mit ihren nächsten Annäherungen und den Missionen, die sie erforschen."
      it: "Una visualizzazione 3D gratuita degli asteroidi e delle comete noti che si avvicinano all’orbita terrestre, con i loro prossimi passaggi ravvicinati e le missioni che li studiano."
      pt: "Uma visualização 3D gratuita dos asteroides e cometas conhecidos que se aproximam da órbita da Terra, com as suas próximas passagens próximas e as missões que os estudam."
    detalle:
      es:
        - "Eyes on Asteroids, de NASA/JPL, muestra en 3D y casi en tiempo real los asteroides y cometas conocidos que pasan cerca de la Tierra: decenas de miles de objetos, con los asteroides representados como puntos azules y los cometas como puntos blancos."
        - "Permite ver cuáles serán los próximos acercamientos a nuestro planeta y consultar relatos sobre las misiones de la NASA que estudian asteroides y cometas. Su alcance en el tiempo es de unos diez años hacia el futuro."
        - "Es gratuita y se abre en el navegador."
      en:
        - "Eyes on Asteroids, from NASA/JPL, shows in 3D and almost in real time the known asteroids and comets that pass near Earth: tens of thousands of objects, with asteroids drawn as blue dots and comets as white dots."
        - "You can see which close approaches to our planet are coming up and read stories about the NASA missions that study asteroids and comets. Its time range reaches about ten years into the future."
        - "It is free and opens in your browser."
      fr:
        - "Eyes on Asteroids, de NASA/JPL, montre en 3D et presque en temps réel les astéroïdes et comètes connus qui passent près de la Terre : des dizaines de milliers d’objets, les astéroïdes étant représentés par des points bleus et les comètes par des points blancs."
        - "On peut y voir les prochains passages rapprochés de notre planète et consulter des récits sur les missions de la NASA qui étudient astéroïdes et comètes. Sa portée dans le temps est d’environ dix ans dans le futur."
        - "Elle est gratuite et s’ouvre dans le navigateur."
      de:
        - "Eyes on Asteroids von NASA/JPL zeigt in 3D und nahezu in Echtzeit die bekannten Asteroiden und Kometen, die an der Erde vorbeiziehen: Zehntausende Objekte, Asteroiden als blaue, Kometen als weiße Punkte."
        - "Man sieht, welche Annäherungen an unseren Planeten bevorstehen, und kann Geschichten über die NASA-Missionen lesen, die Asteroiden und Kometen erforschen. Der Zeitraum reicht etwa zehn Jahre in die Zukunft."
        - "Die App ist kostenlos und öffnet sich im Browser."
      it:
        - "Eyes on Asteroids, di NASA/JPL, mostra in 3D e quasi in tempo reale gli asteroidi e le comete noti che passano vicino alla Terra: decine di migliaia di oggetti, con gli asteroidi rappresentati da punti blu e le comete da punti bianchi."
        - "Permette di vedere quali saranno i prossimi avvicinamenti al nostro pianeta e di leggere racconti sulle missioni della NASA che studiano asteroidi e comete. La sua portata nel tempo è di circa dieci anni nel futuro."
        - "È gratuita e si apre nel browser."
      pt:
        - "O Eyes on Asteroids, da NASA/JPL, mostra em 3D e quase em tempo real os asteroides e cometas conhecidos que passam perto da Terra: dezenas de milhares de objetos, com os asteroides representados por pontos azuis e os cometas por pontos brancos."
        - "Permite ver quais serão as próximas aproximações ao nosso planeta e ler histórias sobre as missões da NASA que estudam asteroides e cometas. O seu alcance no tempo é de cerca de dez anos para o futuro."
        - "É gratuita e abre-se no navegador."

  - id: nasa-eyes-on-exoplanets
    titulo:
      es: "NASA’s Eyes on Exoplanets: planetas de otras estrellas en 3D"
      en: "NASA’s Eyes on Exoplanets: planets of other stars in 3D"
      fr: "NASA’s Eyes on Exoplanets : les planètes d’autres étoiles en 3D"
      de: "NASA’s Eyes on Exoplanets: Planeten anderer Sterne in 3D"
      it: "NASA’s Eyes on Exoplanets: i pianeti di altre stelle in 3D"
      pt: "NASA’s Eyes on Exoplanets: planetas de outras estrelas em 3D"
    fuente: NASA
    enlace: https://eyes.nasa.gov/apps/exo/
    descripcion:
      es: "Una simulación 3D gratuita de los miles de exoplanetas confirmados (planetas que orbitan otras estrellas) y de las zonas donde podría existir agua líquida."
      en: "A free 3D simulation of the thousands of confirmed exoplanets (planets orbiting other stars) and of the zones where liquid water could exist."
      fr: "Une simulation 3D gratuite des milliers d’exoplanètes confirmées (planètes en orbite autour d’autres étoiles) et des zones où de l’eau liquide pourrait exister."
      de: "Eine kostenlose 3D-Simulation der Tausenden bestätigten Exoplaneten (Planeten, die andere Sterne umkreisen) und der Zonen, in denen flüssiges Wasser existieren könnte."
      it: "Una simulazione 3D gratuita delle migliaia di esopianeti confermati (pianeti che orbitano attorno ad altre stelle) e delle zone in cui potrebbe esistere acqua liquida."
      pt: "Uma simulação 3D gratuita dos milhares de exoplanetas confirmados (planetas que orbitam outras estrelas) e das zonas onde poderia existir água líquida."
    detalle:
      es:
        - "Eyes on Exoplanets recrea en 3D los sistemas planetarios conocidos fuera del nuestro: miles de exoplanetas confirmados, es decir, planetas que orbitan otras estrellas."
        - "Entre otras cosas, muestra la «zona habitable» de cada estrella, la región donde la temperatura podría permitir la existencia de agua líquida en la superficie de un planeta."
        - "Es una forma intuitiva de hacerse una idea de lo variado que es el universo más allá del sistema solar. Funciona en el navegador y es gratuita."
      en:
        - "Eyes on Exoplanets recreates in 3D the known planetary systems beyond our own, the exoplanets: thousands of confirmed planets orbiting other stars."
        - "Among other things, it shows each star’s “habitable zone”, the region where the temperature could allow liquid water to exist on a planet’s surface."
        - "It is an intuitive way to get a feel for how varied the universe is beyond the solar system. It runs in your browser and is free."
      fr:
        - "Eyes on Exoplanets reproduit en 3D les systèmes planétaires connus en dehors du nôtre, les exoplanètes : des milliers de planètes confirmées qui orbitent autour d’autres étoiles."
        - "Elle montre notamment la « zone habitable » de chaque étoile, la région où la température pourrait permettre l’existence d’eau liquide à la surface d’une planète."
        - "C’est une façon intuitive de se faire une idée de la diversité de l’Univers au-delà du système solaire. Elle fonctionne dans le navigateur et est gratuite."
      de:
        - "Eyes on Exoplanets bildet die bekannten Planetensysteme außerhalb unseres eigenen in 3D nach, die Exoplaneten: Tausende bestätigte Planeten, die andere Sterne umkreisen."
        - "Unter anderem zeigt die App die „habitable Zone“ jedes Sterns, den Bereich, in dem die Temperatur flüssiges Wasser auf der Oberfläche eines Planeten erlauben könnte."
        - "So bekommt man auf anschauliche Weise ein Gefühl dafür, wie vielfältig das Universum jenseits des Sonnensystems ist. Sie läuft im Browser und ist kostenlos."
      it:
        - "Eyes on Exoplanets riproduce in 3D i sistemi planetari noti al di fuori del nostro, gli esopianeti: migliaia di pianeti confermati che orbitano attorno ad altre stelle."
        - "Tra le altre cose mostra la «zona abitabile» di ogni stella, la regione in cui la temperatura potrebbe consentire l’esistenza di acqua liquida sulla superficie di un pianeta."
        - "È un modo intuitivo per farsi un’idea di quanto sia vario l’universo oltre il sistema solare. Funziona nel browser ed è gratuita."
      pt:
        - "O Eyes on Exoplanets reproduz em 3D os sistemas planetários conhecidos fora do nosso, os exoplanetas: milhares de planetas confirmados que orbitam outras estrelas."
        - "Entre outras coisas, mostra a «zona habitável» de cada estrela, a região onde a temperatura poderia permitir a existência de água líquida à superfície de um planeta."
        - "É uma forma intuitiva de ter uma ideia da variedade do universo para lá do sistema solar. Funciona no navegador e é gratuita."

  - id: google-pinpoint
    titulo:
      es: "Google Pinpoint: investigar con IA tus propios documentos"
      en: "Google Pinpoint: AI research across your own documents"
      fr: "Google Pinpoint : rechercher avec l’IA dans vos propres documents"
      de: "Google Pinpoint: KI-Recherche in den eigenen Dokumenten"
      it: "Google Pinpoint: ricerca con l’IA nei tuoi documenti"
      pt: "Google Pinpoint: investigar com IA os seus próprios documentos"
    fuente: Google
    enlace: https://journaliststudio.google.com/pinpoint/collections
    descripcion:
      es: "Una herramienta gratuita de Google que usa inteligencia artificial para analizar, transcribir y buscar en miles de tus propios documentos, de PDFs y fotos a audios."
      en: "A free Google tool that uses artificial intelligence to analyse, transcribe and search thousands of your own documents, from PDFs and photos to audio."
      fr: "Un outil gratuit de Google qui utilise l’intelligence artificielle pour analyser, transcrire et interroger des milliers de vos propres documents, des PDF et photos aux fichiers audio."
      de: "Ein kostenloses Google-Werkzeug, das mit künstlicher Intelligenz Tausende eigener Dokumente analysiert, transkribiert und durchsuchbar macht, von PDFs und Fotos bis zu Audiodateien."
      it: "Uno strumento gratuito di Google che usa l’intelligenza artificiale per analizzare, trascrivere e cercare in migliaia di tuoi documenti, da PDF e foto ad audio."
      pt: "Uma ferramenta gratuita da Google que usa inteligência artificial para analisar, transcrever e pesquisar milhares dos seus próprios documentos, de PDF e fotografias a áudio."
    detalle:
      es:
        - "Pinpoint nació como herramienta de investigación para periodistas y medios, y hoy puede usarla cualquiera de forma gratuita. Google la describe como un buscador de Google privado y «supervitaminado» para tus propios archivos."
        - "Se trabaja con «colecciones», una especie de carpeta de proyecto en la que se suben a la vez hasta 200.000 documentos: PDFs, imágenes, audios, webs, documentos de Word y más. Pinpoint los procesa con OCR e IA, incluidos los textos manuscritos, y transcribe los audios en varios idiomas."
        - "Además, extrae automáticamente los nombres de personas, organizaciones y lugares que aparecen y los reúne en un índice lateral. Puedes buscar un término y ver en qué páginas está, con sus sinónimos y variantes gramaticales, o hacer preguntas y obtener respuestas basadas en lo que has subido."
        - "Sirve, por ejemplo, para transcribir horas de entrevistas y localizar una declaración exacta, cruzar cientos de artículos académicos o documentos históricos para ver qué autores u organizaciones se repiten, extraer conclusiones de decenas de informes financieros o normativas sin leerlos enteros, o digitalizar notas manuscritas y cartas antiguas para convertirlas en un archivo en el que se pueda buscar."
      en:
        - "Pinpoint began as a research tool for journalists and news organisations, and anyone can now use it for free. Google describes it as a private, “supercharged” Google search for your own files."
        - "You work with “collections”, a kind of project folder where you can upload up to 200,000 documents at once: PDFs, images, audio, websites, Word documents and more. Pinpoint processes them with OCR and AI, handwriting included, and transcribes audio in several languages."
        - "It also automatically extracts the names of people, organisations and places that appear and gathers them in a side index. You can search for a term and see which pages it appears on, including synonyms and grammatical variants, or ask questions and get answers based on what you uploaded."
        - "It is useful, for example, for transcribing hours of interviews and finding an exact quote, cross-referencing hundreds of academic papers or historical documents to see which authors or organisations recur, drawing conclusions from dozens of financial reports or regulations without reading them in full, or digitising handwritten notes and old letters into a searchable archive."
      fr:
        - "Pinpoint est né comme outil de recherche pour les journalistes et les médias, et tout le monde peut désormais l’utiliser gratuitement. Google le décrit comme un moteur de recherche Google privé et « survitaminé » pour vos propres fichiers."
        - "On travaille avec des « collections », sortes de dossiers de projet où l’on peut importer jusqu’à 200 000 documents à la fois : PDF, images, audio, sites web, documents Word, etc. Pinpoint les traite par OCR et IA, y compris les textes manuscrits, et transcrit les fichiers audio en plusieurs langues."
        - "Il extrait aussi automatiquement les noms de personnes, d’organisations et de lieux qui apparaissent et les réunit dans un index latéral. On peut chercher un terme et voir sur quelles pages il figure, avec ses synonymes et variantes grammaticales, ou poser des questions et obtenir des réponses fondées sur les documents importés."
        - "Il sert par exemple à transcrire des heures d’entretiens et retrouver une citation exacte, à croiser des centaines d’articles universitaires ou de documents historiques pour voir quels auteurs ou organisations reviennent, à tirer des conclusions de dizaines de rapports financiers ou de textes réglementaires sans les lire en entier, ou à numériser notes manuscrites et vieilles lettres pour en faire des archives consultables."
      de:
        - "Pinpoint entstand als Recherchewerkzeug für Journalistinnen, Journalisten und Medien, und heute kann es jeder kostenlos nutzen. Google beschreibt es als eine private, „aufgeladene“ Google-Suche für die eigenen Dateien."
        - "Man arbeitet mit „Sammlungen“, einer Art Projektordner, in den sich bis zu 200.000 Dokumente auf einmal hochladen lassen: PDFs, Bilder, Audiodateien, Websites, Word-Dokumente und mehr. Pinpoint verarbeitet sie mit OCR und KI, auch Handschrift, und transkribiert Audio in mehreren Sprachen."
        - "Außerdem zieht es automatisch die Namen von Personen, Organisationen und Orten heraus und stellt sie in einem Seitenindex zusammen. Man kann einen Begriff suchen und sehen, auf welchen Seiten er vorkommt, samt Synonymen und grammatischen Varianten, oder Fragen stellen und Antworten auf Basis der hochgeladenen Unterlagen erhalten."
        - "Nützlich ist das etwa, um stundenlange Interviews zu transkribieren und ein genaues Zitat zu finden, Hunderte wissenschaftliche Artikel oder historische Dokumente abzugleichen und zu sehen, welche Autoren oder Organisationen wiederkehren, aus Dutzenden Finanzberichten oder Vorschriften Schlüsse zu ziehen, ohne sie ganz zu lesen, oder handschriftliche Notizen und alte Briefe in ein durchsuchbares Archiv zu verwandeln."
      it:
        - "Pinpoint è nato come strumento di ricerca per giornalisti e media e oggi chiunque può usarlo gratuitamente. Google lo descrive come un motore di ricerca Google privato e «potenziato» per i tuoi file."
        - "Si lavora con le «collezioni», una sorta di cartella di progetto in cui si possono caricare fino a 200.000 documenti alla volta: PDF, immagini, audio, siti web, documenti Word e altro. Pinpoint li elabora con OCR e IA, compresi i testi manoscritti, e trascrive l’audio in più lingue."
        - "Inoltre estrae automaticamente i nomi di persone, organizzazioni e luoghi che compaiono e li raccoglie in un indice laterale. Si può cercare un termine e vedere in quali pagine compare, con sinonimi e varianti grammaticali, oppure fare domande e ottenere risposte basate su ciò che si è caricato."
        - "È utile, per esempio, per trascrivere ore di interviste e trovare una dichiarazione esatta, incrociare centinaia di articoli accademici o documenti storici per vedere quali autori o organizzazioni ricorrono, trarre conclusioni da decine di rapporti finanziari o normative senza leggerli per intero, o digitalizzare appunti manoscritti e vecchie lettere in un archivio consultabile."
      pt:
        - "O Pinpoint nasceu como ferramenta de investigação para jornalistas e meios de comunicação e hoje qualquer pessoa pode usá-lo gratuitamente. A Google descreve-o como um motor de pesquisa Google privado e «reforçado» para os seus próprios ficheiros."
        - "Trabalha-se com «coleções», uma espécie de pasta de projeto onde se podem carregar até 200.000 documentos de uma só vez: PDF, imagens, áudio, sites, documentos Word e mais. O Pinpoint processa-os com OCR e IA, incluindo textos manuscritos, e transcreve o áudio em vários idiomas."
        - "Além disso, extrai automaticamente os nomes de pessoas, organizações e locais que aparecem e reúne-os num índice lateral. Pode pesquisar-se um termo e ver em que páginas surge, com sinónimos e variantes gramaticais, ou fazer perguntas e obter respostas baseadas no que foi carregado."
        - "Serve, por exemplo, para transcrever horas de entrevistas e encontrar uma declaração exata, cruzar centenas de artigos académicos ou documentos históricos para ver que autores ou organizações se repetem, tirar conclusões de dezenas de relatórios financeiros ou normativas sem os ler por inteiro, ou digitalizar notas manuscritas e cartas antigas num arquivo pesquisável."

  - id: linkedin-games
    titulo:
      es: "LinkedIn Games: minijuegos diarios"
      en: "LinkedIn Games: daily mini-games"
      fr: "LinkedIn Games : des mini-jeux quotidiens"
      de: "LinkedIn Games: tägliche Minispiele"
      it: "LinkedIn Games: minigiochi quotidiani"
      pt: "LinkedIn Games: minijogos diários"
    fuente: LinkedIn
    enlace: https://www.linkedin.com/games/
    descripcion:
      es: "Ocho minijuegos de palabras, lógica y trivial con los que LinkedIn propone pausas rápidas de concentración cada día, entre ellos Wend, Zip, Tango, Queens y Mini Sudoku."
      en: "Eight word, logic and trivia mini-games with which LinkedIn offers quick daily breaks of focus, including Wend, Zip, Tango, Queens and Mini Sudoku."
      fr: "Huit mini-jeux de mots, de logique et de culture générale par lesquels LinkedIn propose chaque jour de courtes pauses de concentration, dont Wend, Zip, Tango, Queens et Mini Sudoku."
      de: "Acht Minispiele mit Wörtern, Logik und Quizfragen, mit denen LinkedIn täglich kurze Konzentrationspausen anbietet, darunter Wend, Zip, Tango, Queens und Mini Sudoku."
      it: "Otto minigiochi di parole, logica e quiz con cui LinkedIn propone ogni giorno brevi pause di concentrazione, tra cui Wend, Zip, Tango, Queens e Mini Sudoku."
      pt: "Oito minijogos de palavras, lógica e trivialidades com que o LinkedIn propõe pausas rápidas de concentração todos os dias, entre eles Wend, Zip, Tango, Queens e Mini Sudoku."
    detalle:
      es:
        - "LinkedIn lanzó su propia oferta de minijuegos con la idea de ofrecer, cada día, momentos rápidos e interactivos de concentración durante la jornada de trabajo. Quien juega puede compartir sus resultados con otras personas."
        - "La oferta actual se compone de ocho juegos: Wend (ábrete paso entre las palabras), Patches (a darle forma), Mini Sudoku (el clásico, en versión mini), Zip (ábrete camino), Tango (todo cuadra), Queens (corona cada región), Pinpoint (adivina la categoría) y Crossclimb (resuelve una escalera de trivial)."
        - "Una forma ligera de despejar la cabeza en cinco minutos. Para entrar hace falta una cuenta de LinkedIn."
      en:
        - "LinkedIn launched its own range of mini-games with the aim of offering quick, interactive moments of focus every day during the working day. Players can share their results with other people."
        - "The current line-up has eight games: Wend (make your way through the words), Patches (shape it up), Mini Sudoku (the classic, in mini size), Zip (find your way), Tango (make it all fit), Queens (crown every region), Pinpoint (guess the category) and Crossclimb (solve a trivia ladder)."
        - "A light way to clear your head in five minutes. You need a LinkedIn account to play."
      fr:
        - "LinkedIn a lancé sa propre offre de mini-jeux dans le but de proposer chaque jour des moments de concentration rapides et interactifs pendant la journée de travail. Les joueurs peuvent partager leurs résultats avec d’autres personnes."
        - "L’offre actuelle compte huit jeux : Wend (frayez-vous un chemin parmi les mots), Patches (donnez-lui forme), Mini Sudoku (le classique, en version mini), Zip (trouvez votre chemin), Tango (tout doit coller), Queens (couronnez chaque région), Pinpoint (devinez la catégorie) et Crossclimb (résolvez une échelle de culture générale)."
        - "Une façon légère de se vider la tête en cinq minutes. Il faut un compte LinkedIn pour jouer."
      de:
        - "LinkedIn hat ein eigenes Angebot an Minispielen gestartet, um während des Arbeitstags jeden Tag kurze, interaktive Momente der Konzentration zu bieten. Wer spielt, kann seine Ergebnisse mit anderen teilen."
        - "Das aktuelle Angebot umfasst acht Spiele: Wend (such dir deinen Weg durch die Wörter), Patches (bring es in Form), Mini Sudoku (der Klassiker im Mini-Format), Zip (finde deinen Weg), Tango (alles muss passen), Queens (krone jede Region), Pinpoint (errate die Kategorie) und Crossclimb (löse eine Quiz-Leiter)."
        - "Eine leichte Art, in fünf Minuten den Kopf freizubekommen. Zum Spielen braucht man ein LinkedIn-Konto."
      it:
        - "LinkedIn ha lanciato una propria offerta di minigiochi con l’idea di proporre ogni giorno momenti di concentrazione rapidi e interattivi durante la giornata lavorativa. Chi gioca può condividere i propri risultati con altre persone."
        - "L’offerta attuale comprende otto giochi: Wend (fatti strada tra le parole), Patches (dagli forma), Mini Sudoku (il classico, in versione mini), Zip (trova la tua strada), Tango (tutto deve quadrare), Queens (incorona ogni regione), Pinpoint (indovina la categoria) e Crossclimb (risolvi una scala di quiz)."
        - "Un modo leggero per schiarirsi le idee in cinque minuti. Per giocare serve un account LinkedIn."
      pt:
        - "O LinkedIn lançou a sua própria oferta de minijogos com a ideia de proporcionar, todos os dias, momentos rápidos e interativos de concentração durante o horário de trabalho. Quem joga pode partilhar os resultados com outras pessoas."
        - "A oferta atual é composta por oito jogos: Wend (abre caminho entre as palavras), Patches (dá-lhe forma), Mini Sudoku (o clássico, em versão mini), Zip (abre caminho), Tango (tudo tem de encaixar), Queens (coroa cada região), Pinpoint (adivinha a categoria) e Crossclimb (resolve uma escada de trivialidades)."
        - "Uma forma leve de desanuviar a cabeça em cinco minutos. Para jogar é preciso uma conta do LinkedIn."

  - id: united-parks-of-america
    titulo:
      es: "United Parks of America: los parques nacionales de EE. UU. en Google Arts & Culture"
      en: "United Parks of America: US national parks on Google Arts & Culture"
      fr: "United Parks of America : les parcs nationaux américains sur Google Arts & Culture"
      de: "United Parks of America: die US-Nationalparks auf Google Arts & Culture"
      it: "United Parks of America: i parchi nazionali USA su Google Arts & Culture"
      pt: "United Parks of America: os parques nacionais dos EUA no Google Arts & Culture"
    fuente: Google Arts & Culture
    enlace: https://artsandculture.google.com/project/national-park-service
    descripcion:
      es: "Una exposición virtual gratuita de Google Arts & Culture y el Servicio de Parques Nacionales de EE. UU. para recorrer desde casa más de 60 parques nacionales, del Gran Cañón a Yellowstone."
      en: "A free virtual exhibition by Google Arts & Culture and the US National Park Service to tour more than 60 national parks from home, from the Grand Canyon to Yellowstone."
      fr: "Une exposition virtuelle gratuite de Google Arts & Culture et du Service des parcs nationaux américain pour parcourir depuis chez soi plus de 60 parcs nationaux, du Grand Canyon à Yellowstone."
      de: "Eine kostenlose virtuelle Ausstellung von Google Arts & Culture und dem US-Nationalparkdienst, mit der man von zu Hause mehr als 60 Nationalparks erkunden kann, vom Grand Canyon bis Yellowstone."
      it: "Una mostra virtuale gratuita di Google Arts & Culture e del Servizio dei parchi nazionali degli Stati Uniti per visitare da casa più di 60 parchi nazionali, dal Grand Canyon a Yellowstone."
      pt: "Uma exposição virtual gratuita da Google Arts & Culture e do Serviço de Parques Nacionais dos EUA para percorrer de casa mais de 60 parques nacionais, do Grand Canyon a Yellowstone."
    detalle:
      es:
        - "United Parks of America es un especial digital interactivo creado por Google Arts & Culture y el Servicio de Parques Nacionales de Estados Unidos. Es gratuito y permite explorar desde casa más de 60 parques nacionales del país."
        - "Reúne más de 450 recorridos virtuales, 5.000 imágenes, 200 historias, 60 vídeos, 50 colecciones y objetos en 3D, además de una experiencia narrativa con inteligencia artificial dedicada al Independence National Historical Park de Filadelfia."
        - "Es una guía multimedia sobre la historia, la cultura y la belleza de los parques, con paradas en lugares tan emblemáticos como el Gran Cañón, Yosemite o Yellowstone. Forma parte de Google Arts & Culture, el servicio digital que da acceso a museos, archivos y lugares patrimoniales de todo el mundo."
      en:
        - "United Parks of America is an interactive digital feature created by Google Arts & Culture and the US National Park Service. It is free and lets you explore more than 60 of the country’s national parks from home."
        - "It brings together more than 450 virtual tours, 5,000 images, 200 stories, 60 videos, 50 collections and 3D objects, plus an AI-powered storytelling experience about Independence National Historical Park in Philadelphia."
        - "It is a multimedia guide to the history, culture and beauty of the parks, with stops at landmarks such as the Grand Canyon, Yosemite and Yellowstone. It is part of Google Arts & Culture, the digital service that gives access to museums, archives and heritage sites around the world."
      fr:
        - "United Parks of America est un dossier numérique interactif créé par Google Arts & Culture et le Service des parcs nationaux américain. Il est gratuit et permet d’explorer depuis chez soi plus de 60 parcs nationaux du pays."
        - "Il réunit plus de 450 visites virtuelles, 5 000 images, 200 histoires, 60 vidéos, 50 collections et des objets en 3D, ainsi qu’une expérience narrative avec intelligence artificielle consacrée à l’Independence National Historical Park de Philadelphie."
        - "C’est un guide multimédia sur l’histoire, la culture et la beauté des parcs, avec des étapes dans des lieux aussi emblématiques que le Grand Canyon, Yosemite ou Yellowstone. Il fait partie de Google Arts & Culture, le service numérique qui donne accès à des musées, des archives et des sites patrimoniaux du monde entier."
      de:
        - "United Parks of America ist ein interaktives digitales Special von Google Arts & Culture und dem US-Nationalparkdienst. Es ist kostenlos und ermöglicht es, von zu Hause mehr als 60 Nationalparks des Landes zu erkunden."
        - "Es vereint mehr als 450 virtuelle Rundgänge, 5.000 Bilder, 200 Geschichten, 60 Videos, 50 Sammlungen und 3D-Objekte sowie ein KI-gestütztes Erzählerlebnis zum Independence National Historical Park in Philadelphia."
        - "Es ist ein multimedialer Führer durch Geschichte, Kultur und Schönheit der Parks mit Stationen an so berühmten Orten wie dem Grand Canyon, Yosemite oder Yellowstone. Es gehört zu Google Arts & Culture, dem digitalen Dienst mit Zugang zu Museen, Archiven und Kulturerbestätten aus aller Welt."
      it:
        - "United Parks of America è uno speciale digitale interattivo creato da Google Arts & Culture e dal Servizio dei parchi nazionali degli Stati Uniti. È gratuito e permette di esplorare da casa più di 60 parchi nazionali del paese."
        - "Riunisce più di 450 visite virtuali, 5.000 immagini, 200 storie, 60 video, 50 collezioni e oggetti in 3D, oltre a un’esperienza narrativa con intelligenza artificiale dedicata all’Independence National Historical Park di Filadelfia."
        - "È una guida multimediale alla storia, alla cultura e alla bellezza dei parchi, con tappe in luoghi emblematici come il Grand Canyon, Yosemite e Yellowstone. Fa parte di Google Arts & Culture, il servizio digitale che dà accesso a musei, archivi e siti patrimoniali di tutto il mondo."
      pt:
        - "United Parks of America é um especial digital interativo criado pela Google Arts & Culture e pelo Serviço de Parques Nacionais dos Estados Unidos. É gratuito e permite explorar de casa mais de 60 parques nacionais do país."
        - "Reúne mais de 450 visitas virtuais, 5.000 imagens, 200 histórias, 60 vídeos, 50 coleções e objetos em 3D, além de uma experiência narrativa com inteligência artificial dedicada ao Independence National Historical Park, em Filadélfia."
        - "É um guia multimédia sobre a história, a cultura e a beleza dos parques, com paragens em locais tão emblemáticos como o Grand Canyon, Yosemite ou Yellowstone. Faz parte da Google Arts & Culture, o serviço digital que dá acesso a museus, arquivos e sítios patrimoniais de todo o mundo."

  - id: anthropeum
    titulo:
      es: "Anthropeum: juego diario de arte del Metropolitan Museum"
      en: "Anthropeum: a daily art game with the Metropolitan Museum’s collection"
      fr: "Anthropeum : un jeu quotidien sur les œuvres du Metropolitan Museum"
      de: "Anthropeum: tägliches Kunstspiel mit der Sammlung des Metropolitan Museum"
      it: "Anthropeum: gioco quotidiano con le opere del Metropolitan Museum"
      pt: "Anthropeum: jogo diário de arte com a coleção do Metropolitan Museum"
    fuente: Anthropeum
    enlace: https://anthropeum.com/
    descripcion:
      es: "Un juego online diario en el que hay que adivinar cuándo y dónde se creó cada una de diez obras de arte de la colección del Metropolitan Museum de Nueva York."
      en: "A daily online game in which you guess when and where each of ten works of art from New York’s Metropolitan Museum collection was made."
      fr: "Un jeu en ligne quotidien où il faut deviner quand et où a été créée chacune de dix œuvres d’art de la collection du Metropolitan Museum de New York."
      de: "Ein tägliches Online-Spiel, bei dem man erraten muss, wann und wo jedes von zehn Kunstwerken aus der Sammlung des New Yorker Metropolitan Museum entstanden ist."
      it: "Un gioco online quotidiano in cui bisogna indovinare quando e dove è stata creata ciascuna di dieci opere d’arte della collezione del Metropolitan Museum di New York."
      pt: "Um jogo online diário em que é preciso adivinhar quando e onde foi criada cada uma de dez obras de arte da coleção do Metropolitan Museum de Nova Iorque."
    detalle:
      es:
        - "Anthropeum es un juego online que se renueva cada día. Muestra diez obras de arte de la colección del Metropolitan Museum de Nueva York y hay que situar cada una en el tiempo y en el mapa: en qué época y en qué lugar se hizo."
        - "Lo creó Matthew Chu, estudiante de la University of Washington, a partir de la iniciativa Open Access del Met, que ofrece imágenes y datos de casi 500.000 obras de su colección."
        - "Al terminar, el juego te dice en qué lugar del ranking has quedado respecto a los demás jugadores. Además, tiene un lado didáctico: tras cada respuesta muestra información sobre la obra y enlaza con su ficha en el Met."
        - "Una manera entretenida de aprender un poco de historia del arte y de geografía en unos minutos al día."
      en:
        - "Anthropeum is an online game that refreshes every day. It shows ten works of art from the Metropolitan Museum’s collection in New York, and you have to place each one in time and on the map: when and where it was made."
        - "It was created by Matthew Chu, a University of Washington student, using the Met’s Open Access initiative, which offers images and data for nearly 500,000 works in its collection."
        - "When you finish, the game tells you where you rank among the other players. It also has an educational side: after each answer it shows information about the work and links to its page at the Met."
        - "An entertaining way to learn a bit of art history and geography in a few minutes a day."
      fr:
        - "Anthropeum est un jeu en ligne renouvelé chaque jour. Il présente dix œuvres d’art de la collection du Metropolitan Museum de New York, et il faut situer chacune dans le temps et sur la carte : à quelle époque et en quel lieu elle a été réalisée."
        - "Il a été créé par Matthew Chu, étudiant à la University of Washington, à partir de l’initiative Open Access du Met, qui propose images et données pour près de 500 000 œuvres de sa collection."
        - "Une fois terminé, le jeu indique votre place dans le classement par rapport aux autres joueurs. Il a aussi un côté pédagogique : après chaque réponse, il affiche des informations sur l’œuvre et renvoie à sa fiche sur le site du Met."
        - "Une façon ludique d’apprendre un peu d’histoire de l’art et de géographie en quelques minutes par jour."
      de:
        - "Anthropeum ist ein Online-Spiel, das sich jeden Tag erneuert. Es zeigt zehn Kunstwerke aus der Sammlung des Metropolitan Museum in New York, und man muss jedes zeitlich und auf der Karte einordnen: wann und wo es entstanden ist."
        - "Erfunden hat es Matthew Chu, Student an der University of Washington, auf Grundlage der Open-Access-Initiative des Met, die Bilder und Daten zu fast 500.000 Werken der Sammlung bereitstellt."
        - "Am Ende zeigt das Spiel, welchen Platz man im Ranking der anderen Spielerinnen und Spieler belegt. Es hat auch eine lehrreiche Seite: Nach jeder Antwort liefert es Informationen zum Werk und verlinkt auf dessen Seite beim Met."
        - "Eine unterhaltsame Möglichkeit, in wenigen Minuten pro Tag etwas Kunstgeschichte und Geografie zu lernen."
      it:
        - "Anthropeum è un gioco online che si rinnova ogni giorno. Mostra dieci opere d’arte della collezione del Metropolitan Museum di New York e bisogna collocare ciascuna nel tempo e sulla mappa: in quale epoca e in quale luogo è stata realizzata."
        - "L’ha creato Matthew Chu, studente della University of Washington, a partire dall’iniziativa Open Access del Met, che offre immagini e dati di quasi 500.000 opere della sua collezione."
        - "Alla fine il gioco mostra in che posizione ci si è classificati rispetto agli altri giocatori. Ha anche un lato didattico: dopo ogni risposta mostra informazioni sull’opera e rimanda alla sua scheda sul sito del Met."
        - "Un modo divertente per imparare un po’ di storia dell’arte e di geografia in pochi minuti al giorno."
      pt:
        - "O Anthropeum é um jogo online que se renova todos os dias. Mostra dez obras de arte da coleção do Metropolitan Museum de Nova Iorque e é preciso situar cada uma no tempo e no mapa: em que época e em que lugar foi feita."
        - "Foi criado por Matthew Chu, estudante da University of Washington, a partir da iniciativa Open Access do Met, que disponibiliza imagens e dados de quase 500.000 obras da sua coleção."
        - "No final, o jogo mostra em que posição do ranking ficou em relação aos outros jogadores. Tem também um lado didático: após cada resposta mostra informação sobre a obra e liga à sua ficha no Met."
        - "Uma forma divertida de aprender um pouco de história da arte e de geografia em poucos minutos por dia."

  - id: the-drum-mejores-anuncios-futbol
    titulo:
