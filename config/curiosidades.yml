  - id: the-storygraph
    titulo:
      es: "The StoryGraph: tu diario de lecturas y recomendador de libros"
      en: "The StoryGraph: your reading journal and book recommender"
      fr: "The StoryGraph : votre journal de lecture et conseiller en livres"
      de: "The StoryGraph: dein Lesetagebuch und Buchempfehler"
      it: "The StoryGraph: il tuo diario di lettura e consigliere di libri"
      pt: "The StoryGraph: o seu diário de leituras e recomendador de livros"
    fuente: The StoryGraph
    enlace: https://thestorygraph.com/
    descripcion:
      es: "Web y app para registrar tus lecturas y descubrir libros según tu estado de ánimo y tus temas favoritos, una alternativa independiente a Goodreads."
      en: "A website and app to log your reading and discover books based on your mood and favourite topics, an independent alternative to Goodreads."
      fr: "Un site et une appli pour noter vos lectures et découvrir des livres selon votre humeur et vos thèmes favoris, une alternative indépendante à Goodreads."
      de: "Eine Website und App, um die eigenen Lektüren festzuhalten und Bücher nach Stimmung und Lieblingsthemen zu entdecken, eine unabhängige Alternative zu Goodreads."
      it: "Un sito e un’app per registrare le tue letture e scoprire libri in base al tuo umore e ai tuoi temi preferiti, un’alternativa indipendente a Goodreads."
      pt: "Um site e uma aplicação para registar as suas leituras e descobrir livros de acordo com o seu estado de espírito e os seus temas favoritos, uma alternativa independente ao Goodreads."
    detalle:
      es:
        - "The StoryGraph es una web y una app para quienes disfrutan leyendo. Sirve para apuntar los libros que has leído, seguir tu progreso, fijarte objetivos y encontrar tu próxima lectura. Sus recomendaciones tienen en cuenta tu estado de ánimo y los temas que más te gustan."
        - "Nació en 2019 y hoy es una comunidad global de más de cinco millones de lectores. Muchos la consideran una alternativa independiente a Goodreads, que pertenece a Amazon."
        - "Ofrece estadísticas detalladas de tus hábitos de lectura, lecturas conjuntas, sorteos y retos comunitarios. Está disponible en la web y como app para iOS y Android, con un servicio básico gratuito y una opción de pago con más funciones."
      en:
        - "The StoryGraph is a website and app for people who enjoy reading. Use it to log the books you have read, track your progress, set goals and find your next read. Its recommendations take into account your mood and the topics you like most."
        - "It started in 2019 and is now a global community of more than five million readers. Many consider it an independent alternative to Goodreads, which is owned by Amazon."
        - "It offers detailed statistics on your reading habits, buddy reads, giveaways and community challenges. It is available on the web and as an iOS and Android app, with a free basic service and a paid option with more features."
      fr:
        - "The StoryGraph est un site et une appli pour celles et ceux qui aiment lire. Elle sert à noter les livres lus, suivre sa progression, se fixer des objectifs et trouver sa prochaine lecture. Ses recommandations tiennent compte de votre humeur et des thèmes que vous préférez."
        - "Née en 2019, c’est aujourd’hui une communauté mondiale de plus de cinq millions de lecteurs. Beaucoup la considèrent comme une alternative indépendante à Goodreads, qui appartient à Amazon."
        - "Elle propose des statistiques détaillées sur vos habitudes de lecture, des lectures communes, des concours et des défis communautaires. Elle est disponible sur le web et en appli iOS et Android, avec un service de base gratuit et une option payante plus complète."
      de:
        - "The StoryGraph ist eine Website und App für Menschen, die gern lesen. Man hält darin gelesene Bücher fest, verfolgt seinen Fortschritt, setzt sich Ziele und findet die nächste Lektüre. Die Empfehlungen berücksichtigen deine Stimmung und deine Lieblingsthemen."
        - "Sie startete 2019 und ist heute eine globale Gemeinschaft von mehr als fünf Millionen Lesenden. Viele sehen sie als unabhängige Alternative zu Goodreads, das zu Amazon gehört."
        - "Es gibt ausführliche Statistiken zu den eigenen Lesegewohnheiten, gemeinsame Lektüren, Verlosungen und Community-Challenges. Verfügbar ist sie im Web und als App für iOS und Android, mit kostenlosem Basisdienst und einer kostenpflichtigen Option mit mehr Funktionen."
      it:
        - "The StoryGraph è un sito e un’app per chi ama leggere. Serve per annotare i libri letti, seguire i propri progressi, fissare obiettivi e trovare la prossima lettura. I suoi consigli tengono conto del tuo umore e dei temi che preferisci."
        - "Nata nel 2019, oggi è una comunità globale di più di cinque milioni di lettori. Molti la considerano un’alternativa indipendente a Goodreads, che appartiene ad Amazon."
        - "Offre statistiche dettagliate sulle tue abitudini di lettura, letture condivise, giveaway e sfide della community. È disponibile sul web e come app per iOS e Android, con un servizio base gratuito e un’opzione a pagamento con più funzioni."
      pt:
        - "O The StoryGraph é um site e uma aplicação para quem gosta de ler. Serve para registar os livros lidos, acompanhar o progresso, definir objetivos e encontrar a próxima leitura. As recomendações têm em conta o seu estado de espírito e os temas de que mais gosta."
        - "Nasceu em 2019 e é hoje uma comunidade global de mais de cinco milhões de leitores. Muitos consideram-no uma alternativa independente ao Goodreads, que pertence à Amazon."
        - "Oferece estatísticas detalhadas sobre os seus hábitos de leitura, leituras conjuntas, sorteios e desafios da comunidade. Está disponível na web e como aplicação para iOS e Android, com um serviço básico gratuito e uma opção paga com mais funcionalidades."

