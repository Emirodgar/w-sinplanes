# Curiosidades: recursos atemporales (cursos gratuitos, vídeos, apps, directos…) sin fecha de caducidad
# --------------------------------------------------------------------------------------------------
# Cada entrada tiene su ficha en /curiosidades/<id>/ y entra en la rotación del widget de la portada:
# una al día, en orden barajado y sin repetir hasta recorrer toda la lista (la misma para todos los visitantes).
# Añade entradas siempre AL FINAL.
#
# Campos de cada entrada:
#   id          identificador para la URL (minúsculas, sin espacios ni tildes)
#   titulo      { es, en, fr, de, it, pt }
#   fuente      (opcional) nombre del sitio o autor del recurso (Khan Academy, TED, TIME…)
#   enlace      URL del recurso
#   descripcion { es, en, fr, de, it, pt }  resumen corto: sale en el listado y en el widget
#   detalle     (opcional) { es: [párrafos], en: [párrafos], … }  amplía la ficha
#
# Plantilla (copia y rellena):
#   - id: ejemplo
#     titulo: { es: "", en: "", fr: "", de: "", it: "", pt: "" }
#     fuente: ""
#     enlace: https://
#     descripcion: { es: "", en: "", fr: "", de: "", it: "", pt: "" }

curiosidades:
  - id: pixar-in-a-box
    titulo:
      es: "Pixar in a Box: el arte de contar historias"
      en: "Pixar in a Box: the art of storytelling"
      fr: "Pixar in a Box : l’art de raconter des histoires"
      de: "Pixar in a Box: die Kunst des Geschichtenerzählens"
      it: "Pixar in a Box: l’arte di raccontare storie"
      pt: "Pixar in a Box: a arte de contar histórias"
    fuente: Khan Academy
    enlace: https://www.khanacademy.org/partner-content/hass-storytelling
    descripcion:
      es: "Un curso gratuito y completo de la Khan Academy en el que los guionistas de Pixar explican cómo trabajan y crean sus historias."
      en: "A complete free course on Khan Academy in which Pixar’s storytellers explain how they work and build their stories."
      fr: "Un cours gratuit et complet sur la Khan Academy dans lequel les scénaristes de Pixar expliquent comment ils travaillent et construisent leurs histoires."
      de: "Ein umfangreicher kostenloser Kurs der Khan Academy, in dem die Autorinnen und Autoren von Pixar erklären, wie sie arbeiten und ihre Geschichten entwickeln."
      it: "Un corso gratuito e completo della Khan Academy in cui gli sceneggiatori della Pixar spiegano come lavorano e costruiscono le loro storie."
      pt: "Um curso gratuito e completo da Khan Academy em que os argumentistas da Pixar explicam como trabalham e criam as suas histórias."

  - id: ted-how-to-tell-a-story
    titulo:
      es: "TED: «How to tell a story»"
      en: "TED: “How to tell a story”"
      fr: "TED : « How to tell a story »"
      de: "TED: „How to tell a story“"
      it: "TED: «How to tell a story»"
      pt: "TED: «How to tell a story»"
    fuente: TED
    enlace: https://www.ted.com/playlists/62/how_to_tell_a_story
    descripcion:
      es: "Una colección de charlas de TED centradas en el arte de contar historias, con maestros de la narración que dan nuevas respuestas a preguntas ancestrales."
      en: "A collection of TED talks about the art of storytelling, with master storytellers exploring new answers to age-old questions."
      fr: "Une collection de conférences TED consacrées à l’art de raconter des histoires, où des maîtres du récit apportent de nouvelles réponses à des questions ancestrales."
      de: "Eine Sammlung von TED-Vorträgen über die Kunst des Geschichtenerzählens, in denen Meister ihres Fachs neue Antworten auf uralte Fragen geben."
      it: "Una raccolta di interventi TED dedicati all’arte di raccontare storie, in cui maestri della narrazione offrono nuove risposte a domande antichissime."
      pt: "Uma coleção de palestras TED dedicadas à arte de contar histórias, em que mestres da narração dão novas respostas a perguntas ancestrais."
    detalle:
      es:
        - "En su presentación, TED se pregunta: ¿por qué nos encantan nuestras historias favoritas? ¿Necesitan acaso un principio, un desarrollo y un final, y un personaje que evolucione al concluir?"
        - "Maestros de la narración exploran nuevas respuestas a esas preguntas ancestrales sobre este arte."
      en:
        - "TED’s own introduction asks: why do we love our favourite stories? Do they really need a beginning, a middle and an end, and a character who changes by the time it is over?"
        - "Master storytellers explore new answers to those age-old questions about the craft."
      fr:
        - "Dans sa présentation, TED se demande : pourquoi aimons-nous tant nos histoires préférées ? Ont-elles vraiment besoin d’un début, d’un milieu et d’une fin, et d’un personnage qui évolue à la fin ?"
        - "Des maîtres du récit explorent de nouvelles réponses à ces questions ancestrales sur cet art."
      de:
        - "In der Einführung fragt TED: Warum lieben wir unsere Lieblingsgeschichten? Brauchen sie wirklich Anfang, Mitte und Ende und eine Figur, die sich bis zum Schluss verändert?"
        - "Meister des Erzählens suchen neue Antworten auf diese uralten Fragen zu ihrer Kunst."
      it:
        - "Nella sua presentazione TED si chiede: perché amiamo tanto le nostre storie preferite? Hanno davvero bisogno di un inizio, uno svolgimento e una fine, e di un personaggio che cambia alla conclusione?"
        - "Maestri della narrazione esplorano nuove risposte a queste domande antichissime su quest’arte."
      pt:
        - "Na sua apresentação, a TED pergunta: porque adoramos as nossas histórias favoritas? Precisam mesmo de princípio, meio e fim, e de uma personagem que evolua no final?"
        - "Mestres da narração exploram novas respostas a estas perguntas ancestrais sobre a sua arte."

  - id: mejores-inventos-time-2026
    titulo:
      es: "Mejores inventos de 2026 según TIME"
      en: "TIME’s Best Inventions of 2026"
      fr: "Meilleures inventions de 2026 selon TIME"
      de: "Beste Erfindungen 2026 laut TIME"
      it: "Migliori invenzioni del 2026 secondo TIME"
      pt: "Melhores inventos de 2026 segundo a TIME"
    fuente: TIME
    enlace: https://time.com/collection/best-inventions/2026/
    descripcion:
      es: "La selección anual de la revista TIME con 300 inventos «que están haciendo del mundo un lugar mejor, más inteligente y más divertido», filtrables por categorías."
      en: "TIME magazine’s annual selection of 300 inventions “that are making the world better, smarter and more fun”, which you can filter by category."
      fr: "La sélection annuelle du magazine TIME : 300 inventions « qui rendent le monde meilleur, plus intelligent et plus amusant », filtrables par catégorie."
      de: "Die jährliche Auswahl des Magazins TIME mit 300 Erfindungen, „die die Welt besser, klüger und unterhaltsamer machen“, nach Kategorien filterbar."
      it: "La selezione annuale della rivista TIME con 300 invenzioni «che rendono il mondo migliore, più intelligente e più divertente», filtrabili per categoria."
      pt: "A seleção anual da revista TIME com 300 inventos «que estão a tornar o mundo melhor, mais inteligente e mais divertido», filtráveis por categoria."
    detalle:
      es:
        - "Es la edición de 2026. Entre los inventos incluidos está el iPhone Duo de Apple, y la portada del número tiene como protagonista a John Ternus, el nuevo CEO de Apple, entrevistado para hablar de la nueva era de la compañía."
        - "La propia revista explica en un segundo artículo cómo elige los inventos de cada año."
      en:
        - "This is the 2026 edition. Apple’s iPhone Duo is among the inventions included, and the cover of the issue features John Ternus, Apple’s new CEO, interviewed about the company’s new era."
        - "The magazine explains in a second article how it chooses each year’s inventions."
      fr:
        - "C’est l’édition 2026. L’iPhone Duo d’Apple figure parmi les inventions retenues, et la couverture du numéro met en vedette John Ternus, le nouveau PDG d’Apple, interrogé sur la nouvelle ère de l’entreprise."
        - "Le magazine explique dans un second article comment il choisit les inventions de chaque année."
      de:
        - "Es ist die Ausgabe 2026. Apples iPhone Duo gehört zu den ausgewählten Erfindungen, und auf dem Titelblatt ist John Ternus zu sehen, Apples neuer CEO, der über die neue Ära des Unternehmens spricht."
        - "In einem zweiten Artikel erklärt das Magazin, wie es die Erfindungen jedes Jahres auswählt."
      it:
        - "È l’edizione 2026. Tra le invenzioni selezionate c’è l’iPhone Duo di Apple, e la copertina del numero ha come protagonista John Ternus, il nuovo CEO di Apple, intervistato sulla nuova era dell’azienda."
        - "In un secondo articolo la rivista spiega come sceglie le invenzioni di ogni anno."
      pt:
        - "É a edição de 2026. O iPhone Duo da Apple é um dos inventos incluídos, e a capa do número tem como protagonista John Ternus, o novo CEO da Apple, entrevistado sobre a nova era da empresa."
        - "A revista explica num segundo artigo como escolhe os inventos de cada ano."

  - id: google-maps-fan-favorite-dining-list-2026
    titulo:
      es: "Guía gastronómica de Google Maps: Fan-Favorite Dining List 2026"
      en: "Google Maps dining guide: Fan-Favorite Dining List 2026"
      fr: "Guide gastronomique de Google Maps : Fan-Favorite Dining List 2026"
      de: "Restaurantführer von Google Maps: Fan-Favorite Dining List 2026"
      it: "Guida gastronomica di Google Maps: Fan-Favorite Dining List 2026"
      pt: "Guia gastronómico do Google Maps: Fan-Favorite Dining List 2026"
    fuente: Google Maps
    enlace: https://blog.google/products-and-platforms/products/maps/google-maps-fan-favorite-dining-list/
    descripcion:
      es: "La primera guía gastronómica de Google Maps reúne los restaurantes favoritos del público y las tendencias culinarias del último año en 10 ciudades del mundo, de Tokio a Santiago de Chile."
      en: "Google Maps’ first dining guide brings together the crowd-favourite restaurants and the food trends of the past year in 10 cities around the world, from Tokyo to Santiago."
      fr: "Le premier guide gastronomique de Google Maps réunit les restaurants préférés du public et les tendances culinaires de l’année écoulée dans 10 villes du monde, de Tokyo à Santiago du Chili."
      de: "Der erste Restaurantführer von Google Maps vereint die Publikumslieblinge und die kulinarischen Trends des vergangenen Jahres in 10 Städten weltweit, von Tokio bis Santiago de Chile."
      it: "La prima guida gastronomica di Google Maps raccoglie i ristoranti preferiti dal pubblico e le tendenze culinarie dell’ultimo anno in 10 città del mondo, da Tokyo a Santiago del Cile."
      pt: "O primeiro guia gastronómico do Google Maps reúne os restaurantes favoritos do público e as tendências culinárias do último ano em 10 cidades do mundo, de Tóquio a Santiago do Chile."
    detalle:
      es:
        - "Para elaborar la guía, Google analizó las reseñas y valoraciones de restaurantes publicadas durante el último año en Atlanta, Chicago, Nueva York, San Francisco y Seattle (EE. UU.), Londres, Melbourne, Montreal, Santiago de Chile y Tokio."
        - "Además de los restaurantes más populares de cada ciudad, la guía recoge sus tendencias gastronómicas. A escala global destacan el regreso de los dulces clásicos, el dominio del matcha, los sabores terrosos y el gusto por las texturas crujientes. Por ejemplo, las menciones al yogur helado en las reseñas de Nueva York se disparan un 320 %, y las del hojicha en Londres, un 114 %."
        - "Hay que leerla como una foto de lo que interesa en Google Maps, no como un ranking definitivo de cada ciudad."
      en:
        - "To build the guide, Google analysed restaurant reviews and ratings posted over the past year in Atlanta, Chicago, New York, San Francisco and Seattle (US), London, Melbourne, Montréal, Santiago (Chile) and Tokyo."
        - "Besides each city’s most popular restaurants, the guide covers its food trends. Globally, classic sweets are back, matcha is everywhere, earthy flavours are in and crunchy textures are a hit. For example, mentions of frozen yogurt in New York reviews jumped 320%, and hojicha in London rose 114%."
        - "Read it as a snapshot of what people care about on Google Maps, not as a definitive ranking of each city."
      fr:
        - "Pour réaliser ce guide, Google a analysé les avis et les notes de restaurants publiés au cours de l’année écoulée à Atlanta, Chicago, New York, San Francisco et Seattle (États-Unis), Londres, Melbourne, Montréal, Santiago (Chili) et Tokyo."
        - "Outre les restaurants les plus populaires de chaque ville, le guide présente ses tendances culinaires. À l’échelle mondiale, on note le retour des douceurs classiques, la domination du matcha, les saveurs terreuses et le goût pour les textures croustillantes. Ainsi, les mentions du yaourt glacé dans les avis de New York bondissent de 320 %, et celles du hojicha à Londres de 114 %."
        - "À lire comme un instantané de ce qui intéresse les utilisateurs de Google Maps, pas comme un classement définitif de chaque ville."
      de:
        - "Für den Führer hat Google die im vergangenen Jahr veröffentlichten Restaurantbewertungen in Atlanta, Chicago, New York, San Francisco und Seattle (USA), London, Melbourne, Montréal, Santiago (Chile) und Tokio ausgewertet."
        - "Neben den beliebtesten Restaurants jeder Stadt enthält er auch ihre kulinarischen Trends. Weltweit kehren klassische Süßspeisen zurück, Matcha dominiert, erdige Aromen und knusprige Texturen sind gefragt. So stiegen die Erwähnungen von Frozen Yogurt in New Yorker Bewertungen um 320 %, die von Hojicha in London um 114 %."
        - "Man sollte ihn als Momentaufnahme dessen lesen, was auf Google Maps interessiert, nicht als endgültiges Ranking jeder Stadt."
      it:
        - "Per realizzare la guida, Google ha analizzato le recensioni e le valutazioni dei ristoranti pubblicate nell’ultimo anno ad Atlanta, Chicago, New York, San Francisco e Seattle (USA), Londra, Melbourne, Montréal, Santiago (Cile) e Tokyo."
        - "Oltre ai ristoranti più popolari di ogni città, la guida raccoglie le sue tendenze gastronomiche. A livello globale tornano i dolci classici, domina il matcha e piacciono i sapori terrosi e le consistenze croccanti. Per esempio, le menzioni dello yogurt gelato nelle recensioni di New York sono balzate del 320 %, quelle dell’hojicha a Londra del 114 %."
        - "Va letta come un’istantanea di ciò che interessa su Google Maps, non come una classifica definitiva di ogni città."
      pt:
        - "Para elaborar o guia, a Google analisou as avaliações e classificações de restaurantes publicadas no último ano em Atlanta, Chicago, Nova Iorque, São Francisco e Seattle (EUA), Londres, Melbourne, Montreal, Santiago (Chile) e Tóquio."
        - "Além dos restaurantes mais populares de cada cidade, o guia reúne as suas tendências gastronómicas. A nível global regressam os doces clássicos, domina o matcha e ganham força os sabores terrosos e as texturas estaladiças. Por exemplo, as menções a iogurte gelado nas avaliações de Nova Iorque dispararam 320 % e as de hojicha em Londres 114 %."
        - "Deve ler-se como um retrato do que interessa no Google Maps, não como um ranking definitivo de cada cidade."
