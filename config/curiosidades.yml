      it:
        - "The Drum, rivista specializzata in pubblicità e marketing, ha selezionato i 50 migliori spot di sempre che hanno il calcio come protagonista o come pretesto. Si possono vedere tutti sul suo sito."
        - "È un buon piano per gli appassionati di calcio e per chi si interessa alla creatività pubblicitaria: una rassegna di come i marchi hanno raccontato storie con lo sport più popolare del mondo."
      pt:
