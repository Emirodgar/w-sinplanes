# Curiosidades: recursos atemporales (cursos gratuitos, vídeos, apps, directos…) sin fecha de caducidad
# --------------------------------------------------------------------------------------------------
# Cada entrada tiene su ficha en /curiosidades/<id>/ y entra en la rotación del widget de la portada:
# una al día, en orden barajado y sin repetir hasta recorrer toda la lista (la misma para todos los visitantes).
# Añade entradas siempre AL FINAL.
#
# Campos de cada entrada:
#   id          identificador para la URL (minúsculas, sin espacios ni tildes)
#   titulo      { es, en, fr, de, it, pt }
#   fuente      (opcional) nombre del sitio o autor del recurso (Khan Academy, TED, TIME…)
#   enlace      URL del recurso
#   descripcion { es, en, fr, de, it, pt }  resumen corto: sale en el listado y en el widget
#   detalle     (opcional) { es: [párrafos], en: [párrafos], … }  amplía la ficha
#   imagen      (opcional) nombre de un fichero de public/img/curiosidades/ (jpg, webp, png…, ~1200x900). Sale en el widget,
#               el listado y la ficha. Usa solo imágenes propias o con licencia que lo permita (p. ej. dominio público de la NASA).
#   imagen_alt  (opcional) { es, en, … }  texto alternativo de la imagen
#   credito     (opcional) texto de crédito bajo la imagen en la ficha (p. ej. "Imagen: NASA/JPL")
#
# Plantilla (copia y rellena):
#   - id: ejemplo
#     titulo: { es: "", en: "", fr: "", de: "", it: "", pt: "" }
#     fuente: ""
#     enlace: https://
#     descripcion: { es: "", en: "", fr: "", de: "", it: "", pt: "" }

curiosidades:
  - id: pixar-in-a-box
    titulo:
      es: "Pixar in a Box: el arte de contar historias"
      en: "Pixar in a Box: the art of storytelling"
      fr: "Pixar in a Box : l’art de raconter des histoires"
      de: "Pixar in a Box: die Kunst des Geschichtenerzählens"
      it: "Pixar in a Box: l’arte di raccontare storie"
      pt: "Pixar in a Box: a arte de contar histórias"
    fuente: Khan Academy
    enlace: https://www.khanacademy.org/partner-content/hass-storytelling
    descripcion:
      es: "Un curso gratuito y completo de la Khan Academy en el que los guionistas de Pixar explican cómo trabajan y crean sus historias."
      en: "A complete free course on Khan Academy in which Pixar’s storytellers explain how they work and build their stories."
      fr: "Un cours gratuit et complet sur la Khan Academy dans lequel les scénaristes de Pixar expliquent comment ils travaillent et construisent leurs histoires."
      de: "Ein umfangreicher kostenloser Kurs der Khan Academy, in dem die Autorinnen und Autoren von Pixar erklären, wie sie arbeiten und ihre Geschichten entwickeln."
      it: "Un corso gratuito e completo della Khan Academy in cui gli sceneggiatori della Pixar spiegano come lavorano e costruiscono le loro storie."
      pt: "Um curso gratuito e completo da Khan Academy em que os argumentistas da Pixar explicam como trabalham e criam as suas histórias."

  - id: ted-how-to-tell-a-story
    titulo:
      es: "TED: «How to tell a story»"
      en: "TED: “How to tell a story”"
      fr: "TED : « How to tell a story »"
      de: "TED: „How to tell a story“"
      it: "TED: «How to tell a story»"
      pt: "TED: «How to tell a story»"
    fuente: TED
    enlace: https://www.ted.com/playlists/62/how_to_tell_a_story
    descripcion:
      es: "Una colección de charlas de TED centradas en el arte de contar historias, con maestros de la narración que dan nuevas respuestas a preguntas ancestrales."
      en: "A collection of TED talks about the art of storytelling, with master storytellers exploring new answers to age-old questions."
      fr: "Une collection de conférences TED consacrées à l’art de raconter des histoires, où des maîtres du récit apportent de nouvelles réponses à des questions ancestrales."
      de: "Eine Sammlung von TED-Vorträgen über die Kunst des Geschichtenerzählens, in denen Meister ihres Fachs neue Antworten auf uralte Fragen geben."
      it: "Una raccolta di interventi TED dedicati all’arte di raccontare storie, in cui maestri della narrazione offrono nuove risposte a domande antichissime."
      pt: "Uma coleção de palestras TED dedicadas à arte de contar histórias, em que mestres da narração dão novas respostas a perguntas ancestrais."
    detalle:
      es:
        - "En su presentación, TED se pregunta: ¿por qué nos encantan nuestras historias favoritas? ¿Necesitan acaso un principio, un desarrollo y un final, y un personaje que evolucione al concluir?"
      en:
        - "TED’s own introduction asks: why do we love our favourite stories? Do they really need a beginning, a middle and an end, and a character who changes by the time it is over?"
      fr:
        - "Dans sa présentation, TED se demande : pourquoi aimons-nous tant nos histoires préférées ? Ont-elles vraiment besoin d’un début, d’un milieu et d’une fin, et d’un personnage qui évolue à la fin ?"
      de:
        - "In der Einführung fragt TED: Warum lieben wir unsere Lieblingsgeschichten? Brauchen sie wirklich Anfang, Mitte und Ende und eine Figur, die sich bis zum Schluss verändert?"
      it:
        - "Nella sua presentazione TED si chiede: perché amiamo tanto le nostre storie preferite? Hanno davvero bisogno di un inizio, uno svolgimento e una fine, e di un personaggio che cambia alla conclusione?"
      pt:
        - "Na sua apresentação, a TED pergunta: porque adoramos as nossas histórias favoritas? Precisam mesmo de princípio, meio e fim, e de uma personagem que evolua no final?"

  - id: mejores-inventos-time-2026
    titulo:
      es: "Mejores inventos de 2026 según TIME"
      en: "TIME’s Best Inventions of 2026"
      fr: "Meilleures inventions de 2026 selon TIME"
      de: "Beste Erfindungen 2026 laut TIME"
      it: "Migliori invenzioni del 2026 secondo TIME"
      pt: "Melhores inventos de 2026 segundo a TIME"
    fuente: TIME
    enlace: https://time.com/collection/best-inventions/2026/
    descripcion:
      es: "La selección anual de la revista TIME con 300 inventos «que están haciendo del mundo un lugar mejor, más inteligente y más divertido», filtrables por categorías."
      en: "TIME magazine’s annual selection of 300 inventions “that are making the world better, smarter and more fun”, which you can filter by category."
      fr: "La sélection annuelle du magazine TIME : 300 inventions « qui rendent le monde meilleur, plus intelligent et plus amusant », filtrables par catégorie."
      de: "Die jährliche Auswahl des Magazins TIME mit 300 Erfindungen, „die die Welt besser, klüger und unterhaltsamer machen“, nach Kategorien filterbar."
      it: "La selezione annuale della rivista TIME con 300 invenzioni «che rendono il mondo migliore, più intelligente e più divertente», filtrabili per categoria."
      pt: "A seleção anual da revista TIME com 300 inventos «que estão a tornar o mundo melhor, mais inteligente e mais divertido», filtráveis por categoria."
    detalle:
      es:
        - "Es la edición de 2026. Entre los inventos incluidos está el iPhone Duo de Apple, y la portada del número tiene como protagonista a John Ternus, el nuevo CEO de Apple, entrevistado para hablar de la nueva era de la compañía."
        - "La propia revista explica en un segundo artículo cómo elige los inventos de cada año."
      en:
        - "This is the 2026 edition. Apple’s iPhone Duo is among the inventions included, and the cover of the issue features John Ternus, Apple’s new CEO, interviewed about the company’s new era."
        - "The magazine explains in a second article how it chooses each year’s inventions."
      fr:
        - "C’est l’édition 2026. L’iPhone Duo d’Apple figure parmi les inventions retenues, et la couverture du numéro met en vedette John Ternus, le nouveau PDG d’Apple, interrogé sur la nouvelle ère de l’entreprise."
        - "Le magazine explique dans un second article comment il choisit les inventions de chaque année."
      de:
        - "Es ist die Ausgabe 2026. Apples iPhone Duo gehört zu den ausgewählten Erfindungen, und auf dem Titelblatt ist John Ternus zu sehen, Apples neuer CEO, der über die neue Ära des Unternehmens spricht."
        - "In einem zweiten Artikel erklärt das Magazin, wie es die Erfindungen jedes Jahres auswählt."
      it:
        - "È l’edizione 2026. Tra le invenzioni selezionate c’è l’iPhone Duo di Apple, e la copertina del numero ha come protagonista John Ternus, il nuovo CEO di Apple, intervistato sulla nuova era dell’azienda."
        - "In un secondo articolo la rivista spiega come sceglie le invenzioni di ogni anno."
      pt:
        - "É a edição de 2026. O iPhone Duo da Apple é um dos inventos incluídos, e a capa do número tem como protagonista John Ternus, o novo CEO da Apple, entrevistado sobre a nova era da empresa."
        - "A revista explica num segundo artigo como escolhe os inventos de cada ano."

  - id: google-maps-fan-favorite-dining-list-2026
    titulo:
      es: "Guía gastronómica de Google Maps: Fan-Favorite Dining List 2026"
      en: "Google Maps dining guide: Fan-Favorite Dining List 2026"
      fr: "Guide gastronomique de Google Maps : Fan-Favorite Dining List 2026"
      de: "Restaurantführer von Google Maps: Fan-Favorite Dining List 2026"
      it: "Guida gastronomica di Google Maps: Fan-Favorite Dining List 2026"
      pt: "Guia gastronómico do Google Maps: Fan-Favorite Dining List 2026"
    fuente: Google Maps
    enlace: https://blog.google/products-and-platforms/products/maps/google-maps-fan-favorite-dining-list/
    descripcion:
      es: "La primera guía gastronómica de Google Maps reúne los restaurantes favoritos del público y las tendencias culinarias del último año en 10 ciudades del mundo, de Tokio a Santiago de Chile."
      en: "Google Maps’ first dining guide brings together the crowd-favourite restaurants and the food trends of the past year in 10 cities around the world, from Tokyo to Santiago."
      fr: "Le premier guide gastronomique de Google Maps réunit les restaurants préférés du public et les tendances culinaires de l’année écoulée dans 10 villes du monde, de Tokyo à Santiago du Chili."
      de: "Der erste Restaurantführer von Google Maps vereint die Publikumslieblinge und die kulinarischen Trends des vergangenen Jahres in 10 Städten weltweit, von Tokio bis Santiago de Chile."
      it: "La prima guida gastronomica di Google Maps raccoglie i ristoranti preferiti dal pubblico e le tendenze culinarie dell’ultimo anno in 10 città del mondo, da Tokyo a Santiago del Cile."
      pt: "O primeiro guia gastronómico do Google Maps reúne os restaurantes favoritos do público e as tendências culinárias do último ano em 10 cidades do mundo, de Tóquio a Santiago do Chile."
    detalle:
      es:
        - "Para elaborar la guía, Google analizó las reseñas y valoraciones de restaurantes publicadas durante el último año en Atlanta, Chicago, Nueva York, San Francisco y Seattle (EE. UU.), Londres, Melbourne, Montreal, Santiago de Chile y Tokio."
        - "Además de los restaurantes más populares de cada ciudad, la guía recoge sus tendencias gastronómicas. A escala global destacan el regreso de los dulces clásicos, el dominio del matcha, los sabores terrosos y el gusto por las texturas crujientes. Por ejemplo, las menciones al yogur helado en las reseñas de Nueva York se dispararon un 320 %, y las del hojicha en Londres, un 114 %."
        - "Hay que leerla como una foto de lo que interesa en Google Maps, no como un ranking definitivo de cada ciudad."
      en:
        - "To build the guide, Google analysed restaurant reviews and ratings posted over the past year in Atlanta, Chicago, New York, San Francisco and Seattle (US), London, Melbourne, Montréal, Santiago (Chile) and Tokyo."
        - "Besides each city’s most popular restaurants, the guide covers its food trends. Globally, classic sweets are back, matcha is everywhere, earthy flavours are in and crunchy textures are a hit. For example, mentions of frozen yogurt in New York reviews jumped 320%, and hojicha in London rose 114%."
        - "Read it as a snapshot of what people care about on Google Maps, not as a definitive ranking of each city."
      fr:
        - "Pour réaliser ce guide, Google a analysé les avis et les notes de restaurants publiés au cours de l’année écoulée à Atlanta, Chicago, New York, San Francisco et Seattle (États-Unis), Londres, Melbourne, Montréal, Santiago (Chili) et Tokyo."
        - "Outre les restaurants les plus populaires de chaque ville, le guide présente ses tendances culinaires. À l’échelle mondiale, on note le retour des douceurs classiques, la domination du matcha, les saveurs terreuses et le goût pour les textures croustillantes. Ainsi, les mentions du yaourt glacé dans les avis de New York ont bondi de 320 %, et celles du hojicha à Londres de 114 %."
        - "À lire comme un instantané de ce qui intéresse les utilisateurs de Google Maps, pas comme un classement définitif de chaque ville."
      de:
        - "Für den Führer hat Google die im vergangenen Jahr veröffentlichten Restaurantbewertungen in Atlanta, Chicago, New York, San Francisco und Seattle (USA), London, Melbourne, Montréal, Santiago (Chile) und Tokio ausgewertet."
        - "Neben den beliebtesten Restaurants jeder Stadt enthält er auch ihre kulinarischen Trends. Weltweit kehren klassische Süßspeisen zurück, Matcha dominiert, erdige Aromen und knusprige Texturen sind gefragt. So stiegen die Erwähnungen von Frozen Yogurt in New Yorker Bewertungen um 320 %, die von Hojicha in London um 114 %."
        - "Man sollte ihn als Momentaufnahme dessen lesen, was auf Google Maps interessiert, nicht als endgültiges Ranking jeder Stadt."
      it:
        - "Per realizzare la guida, Google ha analizzato le recensioni e le valutazioni dei ristoranti pubblicate nell’ultimo anno ad Atlanta, Chicago, New York, San Francisco e Seattle (USA), Londra, Melbourne, Montréal, Santiago (Cile) e Tokyo."
        - "Oltre ai ristoranti più popolari di ogni città, la guida raccoglie le sue tendenze gastronomiche. A livello globale tornano i dolci classici, domina il matcha e piacciono i sapori terrosi e le consistenze croccanti. Per esempio, le menzioni dello yogurt gelato nelle recensioni di New York sono balzate del 320 %, quelle dell’hojicha a Londra del 114 %."
        - "Va letta come un’istantanea di ciò che interessa su Google Maps, non come una classifica definitiva di ogni città."
      pt:
        - "Para elaborar o guia, a Google analisou as avaliações e classificações de restaurantes publicadas no último ano em Atlanta, Chicago, Nova Iorque, São Francisco e Seattle (EUA), Londres, Melbourne, Montreal, Santiago (Chile) e Tóquio."
        - "Além dos restaurantes mais populares de cada cidade, o guia reúne as suas tendências gastronómicas. A nível global regressam os doces clássicos, domina o matcha e ganham força os sabores terrosos e as texturas estaladiças. Por exemplo, as menções a iogurte gelado nas avaliações de Nova Iorque dispararam 320 % e as de hojicha em Londres 114 %."
        - "Deve ler-se como um retrato do que interessa no Google Maps, não como um ranking definitivo de cada cidade."

  - id: cheetah-cub-cam
    titulo:
      es: "Cheetah Cub Cam: cachorros de guepardo en directo"
      en: "Cheetah Cub Cam: live cheetah cubs"
      fr: "Cheetah Cub Cam : des bébés guépards en direct"
      de: "Cheetah Cub Cam: Gepardenbabys live"
      it: "Cheetah Cub Cam: cuccioli di ghepardo in diretta"
      pt: "Cheetah Cub Cam: crias de chita em direto"
    fuente: Smithsonian’s National Zoo
    enlace: https://nationalzoo.si.edu/webcams/cheetah-cub-cam
    descripcion:
      es: "Una cámara en directo, las 24 horas, para ver crecer a cinco cachorros de guepardo y a su madre, Zura, en el Smithsonian Conservation Biology Institute (Virginia, EE. UU.)."
      en: "A live camera, around the clock, to watch five cheetah cubs and their mother, Zura, grow up at the Smithsonian Conservation Biology Institute (Virginia, US)."
      fr: "Une caméra en direct, 24 heures sur 24, pour voir grandir cinq bébés guépards et leur mère, Zura, au Smithsonian Conservation Biology Institute (Virginie, États-Unis)."
      de: "Eine Live-Kamera rund um die Uhr, mit der man fünf Gepardenbabys und ihre Mutter Zura im Smithsonian Conservation Biology Institute (Virginia, USA) aufwachsen sehen kann."
      it: "Una telecamera in diretta, attiva 24 ore su 24, per vedere crescere cinque cuccioli di ghepardo e la loro madre, Zura, allo Smithsonian Conservation Biology Institute (Virginia, USA)."
      pt: "Uma câmara em direto, 24 horas por dia, para ver crescer cinco crias de chita e a mãe, Zura, no Smithsonian Conservation Biology Institute (Virgínia, EUA)."
    detalle:
      es:
        - "El 5 de octubre de 2026 nacieron en el Smithsonian Conservation Biology Institute, en Front Royal (Virginia), cinco cachorros de guepardo. La Cheetah Cub Cam permite verlos desde cualquier lugar a través de internet."
        - "Es la misma cámara que utiliza el personal que cuida de los cachorros y de su madre, Zura, para monitorizarlos de forma remota. A veces la guarida aparece vacía, porque Zura puede cambiar de sitio a las crías."
        - "Según el Smithsonian, quedan menos de 7.000 guepardos en libertad en todo el mundo."
      en:
        - "On 5 October 2026, five cheetah cubs were born at the Smithsonian Conservation Biology Institute in Front Royal, Virginia. The Cheetah Cub Cam lets you watch them from anywhere over the internet."
        - "It is the same camera the keepers use to monitor the cubs and their mother, Zura, remotely. Sometimes the den looks empty, because Zura may move her cubs elsewhere."
        - "According to the Smithsonian, fewer than 7,000 cheetahs remain in the wild worldwide."
      fr:
        - "Le 5 octobre 2026, cinq bébés guépards sont nés au Smithsonian Conservation Biology Institute, à Front Royal (Virginie). La Cheetah Cub Cam permet de les observer de n’importe où via Internet."
        - "C’est la même caméra que le personnel utilise pour surveiller à distance les petits et leur mère, Zura. Il arrive que la tanière paraisse vide, car Zura peut déplacer ses petits."
        - "Selon le Smithsonian, il reste moins de 7 000 guépards en liberté dans le monde."
      de:
        - "Am 5. Oktober 2026 kamen am Smithsonian Conservation Biology Institute in Front Royal (Virginia) fünf Gepardenbabys zur Welt. Die Cheetah Cub Cam macht es möglich, sie von überall im Internet zu beobachten."
        - "Es ist dieselbe Kamera, mit der das Pflegepersonal die Jungtiere und ihre Mutter Zura aus der Ferne überwacht. Manchmal wirkt die Höhle leer, weil Zura ihre Jungen umquartieren kann."
        - "Laut Smithsonian leben weltweit weniger als 7.000 Geparden in freier Wildbahn."
      it:
        - "Il 5 ottobre 2026 sono nati cinque cuccioli di ghepardo allo Smithsonian Conservation Biology Institute di Front Royal (Virginia). La Cheetah Cub Cam permette di vederli da qualsiasi luogo via internet."
        - "È la stessa telecamera che il personale usa per monitorare a distanza i cuccioli e la loro madre, Zura. A volte la tana appare vuota, perché Zura può spostare i piccoli."
        - "Secondo lo Smithsonian, in tutto il mondo restano meno di 7.000 ghepardi in libertà."
      pt:
        - "A 5 de outubro de 2026 nasceram no Smithsonian Conservation Biology Institute, em Front Royal (Virgínia), cinco crias de chita. A Cheetah Cub Cam permite vê-las de qualquer lugar através da internet."
        - "É a mesma câmara que a equipa usa para monitorizar à distância as crias e a mãe, Zura. Por vezes a toca aparece vazia, porque a Zura pode mudar as crias de sítio."
        - "Segundo o Smithsonian, restam menos de 7.000 chitas em liberdade em todo o mundo."

  - id: rewindmap
    titulo:
      es: "RewindMap: atlas histórico interactivo"
      en: "RewindMap: interactive historical atlas"
      fr: "RewindMap : atlas historique interactif"
      de: "RewindMap: interaktiver Geschichtsatlas"
      it: "RewindMap: atlante storico interattivo"
      pt: "RewindMap: atlas histórico interativo"
    fuente: RewindMap
    enlace: https://rewindmap.com/
    descripcion:
      es: "Un atlas histórico interactivo para recorrer miles de años de historia con un mapa del mundo y una línea temporal, año a año."
      en: "An interactive historical atlas to travel through thousands of years of history with a world map and a timeline, year by year."
      fr: "Un atlas historique interactif pour parcourir des milliers d’années d’histoire avec une carte du monde et une frise chronologique, année après année."
      de: "Ein interaktiver Geschichtsatlas, mit dem man dank Weltkarte und Zeitleiste Jahr für Jahr durch Jahrtausende der Geschichte reisen kann."
      it: "Un atlante storico interattivo per percorrere migliaia di anni di storia con una mappa del mondo e una linea del tempo, anno per anno."
      pt: "Um atlas histórico interativo para percorrer milhares de anos de história com um mapa do mundo e uma linha cronológica, ano a ano."
    detalle:
      es:
        - "RewindMap muestra el mundo año tras año: arrastras la línea temporal y el mapa cambia para enseñarte cómo eran los territorios en cada momento. Incluye eventos e historias asociados y capas que se pueden ajustar."
        - "Sirve igual para curiosear sin rumbo que para situar en el mapa un episodio que acabas de estudiar o leer."
      en:
        - "RewindMap shows the world year by year: drag the timeline and the map changes to show what the territories looked like at each moment. It includes related events and stories, and layers you can adjust."
        - "It works just as well for aimless browsing as for placing on the map an episode you have just studied or read about."
      fr:
        - "RewindMap montre le monde année après année : on fait glisser la frise et la carte change pour montrer à quoi ressemblaient les territoires à chaque époque. Il propose des événements et des histoires associés, ainsi que des couches réglables."
        - "Il convient aussi bien pour flâner sans but que pour situer sur la carte un épisode que l’on vient d’étudier ou de lire."
      de:
        - "RewindMap zeigt die Welt Jahr für Jahr: Zieht man die Zeitleiste, ändert sich die Karte und zeigt, wie die Gebiete zu jedem Zeitpunkt aussahen. Dazu gibt es passende Ereignisse und Geschichten sowie einstellbare Ebenen."
        - "Es eignet sich zum ziellosen Stöbern genauso wie dazu, eine gerade gelernte oder gelesene Episode auf der Karte zu verorten."
      it:
        - "RewindMap mostra il mondo anno dopo anno: si trascina la linea del tempo e la mappa cambia per mostrare com’erano i territori in ogni momento. Include eventi e storie collegati e livelli regolabili."
        - "Va bene sia per curiosare senza meta sia per collocare sulla mappa un episodio appena studiato o letto."
      pt:
        - "O RewindMap mostra o mundo ano após ano: arrasta-se a linha cronológica e o mapa muda para mostrar como eram os territórios em cada momento. Inclui eventos e histórias associados e camadas ajustáveis."
        - "Serve tanto para explorar sem destino como para situar no mapa um episódio que acabou de estudar ou ler."

  - id: lovie-awards-2026
    titulo:
      es: "Lovie Awards 2026: los premios europeos de internet"
      en: "Lovie Awards 2026: Europe’s internet awards"
      fr: "Lovie Awards 2026 : les prix européens d’Internet"
      de: "Lovie Awards 2026: die europäischen Internetpreise"
      it: "Lovie Awards 2026: i premi europei di internet"
      pt: "Lovie Awards 2026: os prémios europeus da internet"
    fuente: Lovie Awards
    enlace: https://www.lovieawards.com/
    descripcion:
      es: "El equivalente europeo de los Webby Awards: un escaparate de la mejor creatividad digital europea, con finalistas de webs, vídeo, publicidad, podcasts, apps, juegos, redes sociales e inteligencia artificial."
      en: "Europe’s answer to the Webby Awards: a showcase of the best European digital creativity, with finalists in websites, video, advertising, podcasts, apps, games, social media and artificial intelligence."
      fr: "L’équivalent européen des Webby Awards : une vitrine de la meilleure créativité numérique européenne, avec des finalistes en sites web, vidéo, publicité, podcasts, applications, jeux, réseaux sociaux et intelligence artificielle."
      de: "Das europäische Gegenstück zu den Webby Awards: ein Schaufenster der besten digitalen Kreativität Europas mit Finalisten bei Websites, Video, Werbung, Podcasts, Apps, Spielen, Social Media und künstlicher Intelligenz."
      it: "L’equivalente europeo dei Webby Awards: una vetrina della migliore creatività digitale europea, con finalisti in siti web, video, pubblicità, podcast, app, giochi, social media e intelligenza artificiale."
      pt: "O equivalente europeu dos Webby Awards: uma montra da melhor criatividade digital europeia, com finalistas em sites, vídeo, publicidade, podcasts, aplicações, jogos, redes sociais e inteligência artificial."
    detalle:
      es:
        - "Los Lovie Awards premian la excelencia digital de proyectos realizados en Europa en una larga lista de categorías: sitios web, vídeo, publicidad, relaciones públicas, podcasts, apps, juegos, redes sociales e inteligencia artificial e innovación."
        - "Los creó en 2010 el brazo europeo de la International Academy of Digital Arts and Sciences (IADAS), la misma academia que está detrás de los Webby. El jurado concede oro, plata y bronce en cada categoría, y el público elige además a sus ganadores."
        - "La web con los finalistas de 2026 es una buena forma de ver, de un vistazo, qué se está haciendo de más creativo en internet en Europa."
      en:
        - "The Lovie Awards honour digital excellence in projects made in Europe across a long list of categories: websites, video, advertising, public relations, podcasts, apps, games, social media, and artificial intelligence and innovation."
        - "They were created in 2010 by the European arm of the International Academy of Digital Arts and Sciences (IADAS), the same academy behind the Webbys. The jury awards gold, silver and bronze in each category, and the public also chooses its own winners."
        - "The 2026 finalists page is a good way to see, at a glance, the most creative work being done online in Europe."
      fr:
        - "Les Lovie Awards récompensent l’excellence numérique de projets réalisés en Europe dans une longue liste de catégories : sites web, vidéo, publicité, relations publiques, podcasts, applications, jeux, réseaux sociaux, et intelligence artificielle et innovation."
        - "Ils ont été créés en 2010 par la branche européenne de l’International Academy of Digital Arts and Sciences (IADAS), l’académie qui est aussi à l’origine des Webby. Le jury décerne l’or, l’argent et le bronze dans chaque catégorie, et le public choisit aussi ses lauréats."
        - "La page des finalistes 2026 permet de voir en un coup d’œil ce que l’Europe fait de plus créatif sur Internet."
      de:
        - "Die Lovie Awards zeichnen digitale Exzellenz in europäischen Projekten in einer langen Reihe von Kategorien aus: Websites, Video, Werbung, PR, Podcasts, Apps, Spiele, Social Media sowie künstliche Intelligenz und Innovation."
        - "Sie wurden 2010 vom europäischen Zweig der International Academy of Digital Arts and Sciences (IADAS) ins Leben gerufen, derselben Akademie, die auch hinter den Webbys steht. Die Jury vergibt in jeder Kategorie Gold, Silber und Bronze, und auch das Publikum wählt seine Gewinner."
        - "Auf der Seite der Finalisten 2026 sieht man auf einen Blick, was in Europa im Netz gerade am kreativsten ist."
      it:
        - "I Lovie Awards premiano l’eccellenza digitale di progetti realizzati in Europa in un lungo elenco di categorie: siti web, video, pubblicità, relazioni pubbliche, podcast, app, giochi, social media e intelligenza artificiale e innovazione."
        - "Sono stati creati nel 2010 dalla branca europea della International Academy of Digital Arts and Sciences (IADAS), la stessa accademia che sta dietro ai Webby. La giuria assegna oro, argento e bronzo in ogni categoria e anche il pubblico sceglie i suoi vincitori."
        - "La pagina dei finalisti 2026 è un buon modo per vedere a colpo d’occhio che cosa c’è di più creativo online in Europa."
      pt:
        - "Os Lovie Awards premeiam a excelência digital de projetos realizados na Europa numa longa lista de categorias: sites, vídeo, publicidade, relações públicas, podcasts, aplicações, jogos, redes sociais e inteligência artificial e inovação."
        - "Foram criados em 2010 pelo braço europeu da International Academy of Digital Arts and Sciences (IADAS), a mesma academia que está por trás dos Webby. O júri atribui ouro, prata e bronze em cada categoria, e o público também escolhe os seus vencedores."
        - "A página dos finalistas de 2026 é uma boa forma de ver, num relance, o que há de mais criativo na internet europeia."

  - id: nyt-10-minute-challenge
    titulo:
      es: "10-Minute Challenge: los retos de atención del New York Times"
      en: "10-Minute Challenge: The New York Times attention challenges"
      fr: "10-Minute Challenge : les défis d’attention du New York Times"
      de: "10-Minute Challenge: die Aufmerksamkeitsübungen der New York Times"
      it: "10-Minute Challenge: le sfide di attenzione del New York Times"
      pt: "10-Minute Challenge: os desafios de atenção do New York Times"
    fuente: The New York Times
    enlace: https://www.nytimes.com/spotlight/10-minute-challenge
    descripcion:
      es: "Cada primer lunes de mes, el New York Times propone dedicar diez minutos ininterrumpidos a contemplar a fondo una obra de arte, con zoom, preguntas previas y datos de la obra al terminar."
      en: "On the first Monday of every month, The New York Times invites you to spend ten uninterrupted minutes looking closely at a work of art, with zoom, questions beforehand and details about the piece afterwards."
      fr: "Chaque premier lundi du mois, le New York Times propose de consacrer dix minutes sans interruption à contempler une œuvre d’art en profondeur, avec zoom, questions préalables et informations sur l’œuvre à la fin."
      de: "Jeden ersten Montag im Monat lädt die New York Times dazu ein, zehn Minuten lang ununterbrochen ein Kunstwerk ganz genau zu betrachten, mit Zoom, Fragen vorab und Informationen zum Werk am Ende."
      it: "Ogni primo lunedì del mese il New York Times propone di dedicare dieci minuti ininterrotti a contemplare a fondo un’opera d’arte, con zoom, domande iniziali e informazioni sull’opera al termine."
      pt: "Todas as primeiras segundas-feiras do mês, o New York Times propõe dedicar dez minutos ininterruptos a contemplar a fundo uma obra de arte, com zoom, perguntas prévias e informação sobre a obra no final."
    detalle:
      es:
        - "La serie «10-Minute Challenge» del New York Times es un reto de concentración: un tiempo de atención ininterrumpida, por ejemplo diez minutos, para mirar con calma una obra de arte."
        - "Al entrar, puedes hacer zoom para ver todos los detalles y moverte por la imagen a tu ritmo. El diario plantea antes alguna pregunta y, cuando decides terminar, ofrece información detallada sobre la obra y te dice cuánto tiempo le has dedicado."
        - "Un buen antídoto contra la prisa de las pantallas: mirar una sola cosa durante diez minutos."
      en:
        - "The New York Times’ “10-Minute Challenge” series is a concentration challenge: a stretch of uninterrupted attention, for example ten minutes, to look calmly at a work of art."
        - "Once inside, you can zoom in to see every detail and move around the image at your own pace. The paper poses a question beforehand and, when you decide to finish, gives detailed information about the work and tells you how long you spent looking."
        - "A good antidote to screen-hurry: looking at a single thing for ten minutes."
      fr:
        - "La série « 10-Minute Challenge » du New York Times est un défi de concentration : un temps d’attention ininterrompue, par exemple dix minutes, pour regarder tranquillement une œuvre d’art."
        - "Une fois sur la page, on peut zoomer pour voir tous les détails et parcourir l’image à son rythme. Le journal pose une question au préalable et, quand on décide de terminer, il donne des informations détaillées sur l’œuvre et indique le temps passé à la contempler."
        - "Un bon antidote à la précipitation des écrans : regarder une seule chose pendant dix minutes."
      de:
        - "Die Serie „10-Minute Challenge“ der New York Times ist eine Konzentrationsübung: eine Zeit ununterbrochener Aufmerksamkeit, zum Beispiel zehn Minuten, um in Ruhe ein Kunstwerk zu betrachten."
        - "Auf der Seite kann man hineinzoomen, um jedes Detail zu sehen, und sich in eigenem Tempo durch das Bild bewegen. Die Zeitung stellt vorab eine Frage und liefert am Ende, wenn man die Betrachtung beendet, ausführliche Informationen zum Werk und teilt mit, wie lange man hingeschaut hat."
        - "Ein gutes Gegenmittel gegen die Hektik der Bildschirme: zehn Minuten lang nur eine einzige Sache betrachten."
      it:
        - "La serie «10-Minute Challenge» del New York Times è una sfida di concentrazione: un periodo di attenzione ininterrotta, per esempio dieci minuti, per guardare con calma un’opera d’arte."
        - "Una volta dentro, si può ingrandire per vedere ogni dettaglio e muoversi nell’immagine con i propri tempi. Il giornale pone prima una domanda e, quando si decide di concludere, offre informazioni dettagliate sull’opera e indica quanto tempo le si è dedicato."
        - "Un buon antidoto alla fretta degli schermi: guardare una sola cosa per dieci minuti."
      pt:
        - "A série «10-Minute Challenge» do New York Times é um desafio de concentração: um período de atenção ininterrupta, por exemplo dez minutos, para olhar com calma para uma obra de arte."
        - "Ao entrar, pode fazer zoom para ver todos os detalhes e deslocar-se pela imagem ao seu ritmo. O jornal coloca uma pergunta antes e, quando decide terminar, oferece informação detalhada sobre a obra e diz quanto tempo lhe dedicou."
        - "Um bom antídoto contra a pressa dos ecrãs: olhar para uma só coisa durante dez minutos."

  - id: premios-nobel
    titulo:
      es: "Premios Nobel: todos los ganadores"
      en: "Nobel Prizes: all the laureates"
      fr: "Prix Nobel : tous les lauréats"
      de: "Nobelpreise: alle Preisträger"
      it: "Premi Nobel: tutti i vincitori"
      pt: "Prémios Nobel: todos os vencedores"
    fuente: NobelPrize.org
    enlace: https://www.nobelprize.org/
    descripcion:
      es: "La web oficial de los Premios Nobel, para conocer a todos los galardonados de cada categoría y de cada año, con sus biografías y su trabajo."
      en: "The official website of the Nobel Prizes, to discover every laureate in every category and year, with their biographies and their work."
      fr: "Le site officiel des prix Nobel, pour découvrir tous les lauréats de chaque catégorie et de chaque année, avec leurs biographies et leurs travaux."
      de: "Die offizielle Website der Nobelpreise, auf der man alle Preisträger jeder Kategorie und jedes Jahres samt Biografien und Werk kennenlernen kann."
      it: "Il sito ufficiale dei premi Nobel, per conoscere tutti i vincitori di ogni categoria e di ogni anno, con le loro biografie e il loro lavoro."
      pt: "O site oficial dos Prémios Nobel, para conhecer todos os laureados de cada categoria e de cada ano, com as suas biografias e o seu trabalho."
    detalle:
      es:
        - "NobelPrize.org es la web oficial de los Premios Nobel. Permite explorar quién ha ganado cada premio, en qué año y por qué, con la biografía de cada galardonado y información sobre su trabajo."
        - "Es un buen punto de partida para dejarse llevar: de un físico a una escritora o a un movimiento por la paz, cada ficha abre la puerta a una historia que merece la pena leer."
      en:
        - "NobelPrize.org is the official website of the Nobel Prizes. You can explore who won each prize, in which year and why, with a biography of every laureate and information about their work."
        - "It is a good place to wander: from a physicist to a novelist or a peace movement, each page opens the door to a story worth reading."
      fr:
        - "NobelPrize.org est le site officiel des prix Nobel. On peut y explorer qui a remporté chaque prix, en quelle année et pour quelle raison, avec la biographie de chaque lauréat et des informations sur ses travaux."
        - "C’est un bon point de départ pour se laisser porter : d’un physicien à une romancière ou à un mouvement pour la paix, chaque fiche ouvre la porte à une histoire qui mérite d’être lue."
      de:
        - "NobelPrize.org ist die offizielle Website der Nobelpreise. Man kann erkunden, wer welchen Preis in welchem Jahr und weshalb gewonnen hat, mit einer Biografie jedes Preisträgers und Informationen zu seinem Werk."
        - "Ein guter Ausgangspunkt zum Stöbern: Vom Physiker über eine Schriftstellerin bis zu einer Friedensbewegung öffnet jede Seite die Tür zu einer lesenswerten Geschichte."
      it:
        - "NobelPrize.org è il sito ufficiale dei premi Nobel. Permette di scoprire chi ha vinto ogni premio, in quale anno e perché, con la biografia di ogni vincitore e informazioni sul suo lavoro."
        - "È un buon punto di partenza per lasciarsi guidare: da un fisico a una scrittrice o a un movimento per la pace, ogni scheda apre la porta a una storia che vale la pena leggere."
      pt:
        - "NobelPrize.org é o site oficial dos Prémios Nobel. Permite explorar quem ganhou cada prémio, em que ano e porquê, com a biografia de cada laureado e informação sobre o seu trabalho."
        - "É um bom ponto de partida para se deixar levar: de um físico a uma escritora ou a um movimento pela paz, cada página abre a porta a uma história que vale a pena ler."

  - id: oxford-economics-global-cities-index
    titulo:
      es: "Global Cities Index de Oxford Economics: ranking de las 1.000 mayores ciudades"
      en: "Oxford Economics Global Cities Index: ranking of the world’s 1,000 largest cities"
      fr: "Global Cities Index d’Oxford Economics : classement des 1 000 plus grandes villes"
      de: "Global Cities Index von Oxford Economics: Ranking der 1.000 größten Städte"
      it: "Global Cities Index di Oxford Economics: classifica delle 1.000 città più grandi"
      pt: "Global Cities Index da Oxford Economics: ranking das 1.000 maiores cidades"
    fuente: Oxford Economics
    enlace: https://www.oxfordeconomics.com/global-cities-index/
    descripcion:
      es: "Un ranking comparativo e interactivo de las 1.000 mayores ciudades del planeta, valoradas en economía, capital humano, calidad de vida, medio ambiente y gobernanza."
      en: "An interactive comparative ranking of the 1,000 largest cities on the planet, scored on economics, human capital, quality of life, environment and governance."
      fr: "Un classement comparatif et interactif des 1 000 plus grandes villes de la planète, évaluées sur l’économie, le capital humain, la qualité de vie, l’environnement et la gouvernance."
      de: "Ein interaktives Vergleichsranking der 1.000 größten Städte der Erde, bewertet nach Wirtschaft, Humankapital, Lebensqualität, Umwelt und Regierungsführung."
      it: "Una classifica comparativa e interattiva delle 1.000 città più grandi del pianeta, valutate in economia, capitale umano, qualità della vita, ambiente e governance."
      pt: "Um ranking comparativo e interativo das 1.000 maiores cidades do planeta, avaliadas em economia, capital humano, qualidade de vida, ambiente e governação."
    detalle:
      es:
        - "El Global Cities Index de Oxford Economics compara las 1.000 mayores ciudades del mundo y las puntúa en cinco categorías: economía, capital humano, calidad de vida, medio ambiente y gobernanza."
        - "Puedes buscar tu ciudad, ver en qué puesto está y compararla con otras, y descubrir en qué es fuerte y en qué flojea cada una."
      en:
        - "Oxford Economics’ Global Cities Index compares the world’s 1,000 largest cities and scores them in five categories: economics, human capital, quality of life, environment and governance."
        - "You can look up your own city, see where it ranks and compare it with others, and find out what each one is strong or weak at."
      fr:
        - "Le Global Cities Index d’Oxford Economics compare les 1 000 plus grandes villes du monde et les note dans cinq catégories : économie, capital humain, qualité de vie, environnement et gouvernance."
        - "On peut chercher sa ville, voir son rang et la comparer à d’autres, et découvrir ses points forts et ses points faibles."
      de:
        - "Der Global Cities Index von Oxford Economics vergleicht die 1.000 größten Städte der Welt und bewertet sie in fünf Kategorien: Wirtschaft, Humankapital, Lebensqualität, Umwelt und Regierungsführung."
        - "Man kann die eigene Stadt suchen, ihren Rang sehen, sie mit anderen vergleichen und herausfinden, wo jede stark oder schwach ist."
      it:
        - "Il Global Cities Index di Oxford Economics confronta le 1.000 città più grandi del mondo e le valuta in cinque categorie: economia, capitale umano, qualità della vita, ambiente e governance."
        - "Si può cercare la propria città, vedere in che posizione si trova, confrontarla con altre e scoprire in che cosa è forte o debole ciascuna."
      pt:
        - "O Global Cities Index da Oxford Economics compara as 1.000 maiores cidades do mundo e pontua-as em cinco categorias: economia, capital humano, qualidade de vida, ambiente e governação."
        - "Pode procurar a sua cidade, ver em que posição está, compará-la com outras e descobrir em que é forte ou fraca cada uma."

  - id: world-teachers-day-2026-google-ted
    titulo:
      es: "World Teachers’ Day 2026: historias de docentes y búsqueda de ideas de Google y TED"
      en: "World Teachers’ Day 2026: teacher stories and the Google and TED idea search"
      fr: "World Teachers’ Day 2026 : histoires d’enseignants et recherche d’idées de Google et TED"
      de: "World Teachers’ Day 2026: Lehrkräfte-Geschichten und die Ideensuche von Google und TED"
      it: "World Teachers’ Day 2026: storie di insegnanti e ricerca di idee di Google e TED"
      pt: "World Teachers’ Day 2026: histórias de professores e procura de ideias da Google e da TED"
    fuente: Google
    enlace: https://blog.google/products-and-platforms/products/education/world-teachers-day-2026/
    descripcion:
      es: "Una colección de historias de docentes de todo el mundo que usan la tecnología en el aula, y la búsqueda global de educadores innovadores que lanzan Google y TED."
      en: "A collection of stories from teachers around the world who use technology in the classroom, and the global search for innovative educators launched by Google and TED."
      fr: "Une collection d’histoires d’enseignants du monde entier qui utilisent la technologie en classe, et la recherche mondiale d’éducateurs innovants lancée par Google et TED."
      de: "Eine Sammlung von Geschichten von Lehrkräften aus aller Welt, die Technologie im Unterricht einsetzen, und die weltweite Suche nach innovativen Pädagoginnen und Pädagogen von Google und TED."
      it: "Una raccolta di storie di insegnanti di tutto il mondo che usano la tecnologia in classe e la ricerca globale di educatori innovativi lanciata da Google e TED."
      pt: "Uma coleção de histórias de professores de todo o mundo que usam a tecnologia na sala de aula e a procura global de educadores inovadores lançada pela Google e pela TED."
    detalle:
      es:
        - "Con motivo del Día Mundial de los Docentes, Google publica una colección de historias en primera persona de profesores que cuentan cómo afrontan los retos del día a día y cómo usan la tecnología, incluida la inteligencia artificial, para ayudar a sus alumnos a entender conceptos complejos, crear clases atractivas y fomentar el pensamiento crítico."
        - "Junto a TED, Google ha lanzado además una búsqueda mundial de educadores que innovan con tecnología y tienen ideas que merecen ser compartidas. Quienes presenten las ideas más interesantes tendrán la oportunidad de dar su charla en un escenario TED. Para participar, hay que inscribirse en el Idea Workshop que se explica en la propia página."
      en:
        - "For World Teachers’ Day, Google has published a collection of first-person stories from teachers on how they tackle everyday challenges and use technology, including AI, to help students grasp complex concepts, create engaging lessons and support critical thinking."
        - "Together with TED, Google has also launched a global idea search for educators who are innovating with technology and have ideas worth sharing. The educators with the most compelling ideas get the chance to give their talk on the TED stage. To take part, you register for the Idea Workshop explained on the page itself."
      fr:
        - "À l’occasion de la Journée mondiale des enseignants, Google publie une collection de témoignages à la première personne d’enseignants qui racontent comment ils relèvent les défis du quotidien et utilisent la technologie, y compris l’IA, pour aider leurs élèves à comprendre des notions complexes, créer des cours attrayants et développer l’esprit critique."
        - "Avec TED, Google a aussi lancé une recherche mondiale d’éducateurs qui innovent grâce à la technologie et dont les idées méritent d’être partagées. Ceux qui présenteront les idées les plus convaincantes pourront donner leur conférence sur une scène TED. Pour participer, il faut s’inscrire à l’Idea Workshop présenté sur la page."
      de:
        - "Zum Weltlehrertag veröffentlicht Google eine Sammlung von Berichten in der Ich-Form, in denen Lehrkräfte erzählen, wie sie den Schulalltag meistern und Technologie, auch KI, nutzen, um komplexe Konzepte verständlich zu machen, ansprechenden Unterricht zu gestalten und kritisches Denken zu fördern."
        - "Gemeinsam mit TED hat Google außerdem eine weltweite Ideensuche für Pädagoginnen und Pädagogen gestartet, die mit Technologie innovativ arbeiten und Ideen haben, die es wert sind, geteilt zu werden. Wer die überzeugendsten Ideen einreicht, darf seinen Vortrag auf einer TED-Bühne halten. Zur Teilnahme meldet man sich zum Idea Workshop an, der auf der Seite erklärt wird."
      it:
        - "In occasione della Giornata mondiale degli insegnanti, Google pubblica una raccolta di storie in prima persona di docenti che raccontano come affrontano le sfide quotidiane e usano la tecnologia, compresa l’IA, per aiutare gli studenti a capire concetti complessi, creare lezioni coinvolgenti e favorire il pensiero critico."
        - "Insieme a TED, Google ha lanciato anche una ricerca globale di educatori che innovano con la tecnologia e hanno idee che meritano di essere condivise. Chi presenterà le idee più convincenti avrà la possibilità di tenere il proprio intervento su un palco TED. Per partecipare ci si iscrive all’Idea Workshop spiegato nella pagina stessa."
      pt:
        - "No âmbito do Dia Mundial dos Professores, a Google publica uma coleção de histórias na primeira pessoa de professores que contam como enfrentam os desafios do dia a dia e usam a tecnologia, incluindo a IA, para ajudar os alunos a compreender conceitos complexos, criar aulas cativantes e apoiar o pensamento crítico."
        - "Em conjunto com a TED, a Google lançou também uma procura global de educadores que inovam com a tecnologia e têm ideias que merecem ser partilhadas. Quem apresentar as ideias mais convincentes terá a oportunidade de dar a sua palestra num palco TED. Para participar, é preciso inscrever-se no Idea Workshop explicado na própria página."

  - id: ripples-of-history
    titulo:
      es: "Ripples of History: atlas interactivo de causa y efecto en la historia"
      en: "Ripples of History: interactive atlas of cause and effect"
      fr: "Ripples of History : atlas interactif de cause à effet dans l’histoire"
      de: "Ripples of History: interaktiver Atlas von Ursache und Wirkung"
      it: "Ripples of History: atlante interattivo di causa ed effetto nella storia"
      pt: "Ripples of History: atlas interativo de causa e efeito na história"
    fuente: Ripples of History
    enlace: https://www.ripplesofhistory.com/
    descripcion:
      es: "Un atlas interactivo de la historia mundial, de 1800 a 2026, que conecta sobre un mapa más de 550 acontecimientos y sus relaciones de causa y efecto."
      en: "An interactive atlas of world history, from 1800 to 2026, that connects more than 550 events on a map through their causes and effects."
      fr: "Un atlas interactif de l’histoire mondiale, de 1800 à 2026, qui relie sur une carte plus de 550 événements par leurs relations de cause à effet."
      de: "Ein interaktiver Atlas der Weltgeschichte von 1800 bis 2026, der auf einer Karte mehr als 550 Ereignisse über Ursache und Wirkung miteinander verbindet."
      it: "Un atlante interattivo della storia mondiale, dal 1800 al 2026, che collega su una mappa più di 550 eventi attraverso i loro rapporti di causa ed effetto."
      pt: "Um atlas interativo da história mundial, de 1800 a 2026, que liga num mapa mais de 550 acontecimentos através das suas relações de causa e efeito."
    detalle:
      es:
        - "Ripples of History parte de una idea sencilla: nada ocurrió por sí solo. Cada revolución, invento o crisis de sus más de 550 acontecimientos puso en marcha algo más, y el atlas muestra más de 1.500 vínculos de causa y efecto que puedes seguir."
        - "Pulsa cualquier acontecimiento para ver qué lo provocó y qué desencadenó, sigue un hilo para recorrer una cadena de consecuencias por el mundo o dale al play para ver cómo se propagan dos siglos de historia sobre el mapa. También ofrece recorridos guiados, historias por regiones y un juego, Six Degrees."
      en:
        - "Ripples of History starts from a simple idea: nothing happened on its own. Every revolution, invention and crisis among its 550+ events set something else in motion, and the atlas shows more than 1,500 causal links you can follow."
        - "Tap any event to see what caused it and what it set off, follow a thread to walk a chain of consequences around the world, or press play to watch two centuries ripple across the map. It also offers guided journeys, region stories and a game, Six Degrees."
      fr:
        - "Ripples of History part d’une idée simple : rien ne s’est produit seul. Chaque révolution, invention ou crise parmi ses plus de 550 événements en a déclenché une autre, et l’atlas montre plus de 1 500 liens de cause à effet à suivre."
        - "Touchez un événement pour voir ce qui l’a provoqué et ce qu’il a déclenché, suivez un fil pour parcourir une chaîne de conséquences à travers le monde, ou lancez la lecture pour voir deux siècles d’histoire se propager sur la carte. Il propose aussi des parcours guidés, des histoires par région et un jeu, Six Degrees."
      de:
        - "Ripples of History geht von einer einfachen Idee aus: Nichts geschah von allein. Jede Revolution, Erfindung und Krise unter den mehr als 550 Ereignissen löste etwas anderes aus, und der Atlas zeigt über 1.500 Ursache-Wirkung-Verbindungen, denen man folgen kann."
        - "Man tippt ein Ereignis an, um zu sehen, was es ausgelöst hat und was daraus folgte, folgt einem Faden durch eine Kette von Folgen rund um die Welt oder startet die Wiedergabe, um zwei Jahrhunderte Geschichte über die Karte wandern zu sehen. Es gibt auch geführte Reisen, Regionengeschichten und ein Spiel, Six Degrees."
      it:
        - "Ripples of History parte da un’idea semplice: nulla è accaduto da solo. Ogni rivoluzione, invenzione o crisi tra i suoi oltre 550 eventi ne ha messo in moto un’altra, e l’atlante mostra più di 1.500 collegamenti di causa ed effetto da seguire."
        - "Si tocca un evento per vedere che cosa lo ha provocato e che cosa ha innescato, si segue un filo per percorrere una catena di conseguenze nel mondo oppure si preme play per vedere due secoli di storia propagarsi sulla mappa. Offre anche percorsi guidati, storie per regione e un gioco, Six Degrees."
      pt:
        - "O Ripples of History parte de uma ideia simples: nada aconteceu sozinho. Cada revolução, invento ou crise entre os seus mais de 550 acontecimentos desencadeou outra coisa, e o atlas mostra mais de 1.500 ligações de causa e efeito que se podem seguir."
        - "Toque num acontecimento para ver o que o provocou e o que desencadeou, siga um fio para percorrer uma cadeia de consequências pelo mundo ou carregue em play para ver dois séculos de história a propagarem-se no mapa. Oferece também percursos guiados, histórias por regiões e um jogo, Six Degrees."

