# Fuentes de sinplanes.com
# ------------------------------------------------------------
# adaptador: madrid | opendatasoft | euskadi | ical | rss | tmdb | football
# activa: false para apagar una fuente sin borrarla.
# Las URLs se validan con `npm run check-sources` (también en Actions, cada lunes).
# Las fuentes con clave (tmdb, football) solo se ejecutan si el secreto existe.
#
# Prensa (adaptador rss): cada feed devuelve titulares; la IA decide cuáles son planes con fecha y los estructura.
# Requieren ANTHROPIC_API_KEY (sin ella se descargan pero no se procesan). Campos útiles:
#   region: pista geográfica para la IA ("Castilla y León", "Salamanca"…)
#   dias:   antigüedad máxima de los titulares (por defecto 7)
#   sin_filtro: true para no aplicar el prefiltro de palabras de agenda
# Antes de activar un feed, revisa las condiciones de reutilización de su web. Nunca se copia texto:
# la IA redacta un resumen propio y cada plan enlaza a la noticia original.

fuentes:
  - id: madrid-agenda
    nombre: "Agenda de actividades del Ayuntamiento de Madrid"
    adaptador: madrid
    url: "https://datos.madrid.es/egob/catalogo/206974-0-agenda-eventos-culturales-100.json"
    licencia: "Datos abiertos Ayuntamiento de Madrid (atribución)"
    provincia: "Madrid"
    activa: true

  - id: jcyl-agenda
    nombre: "Agenda cultural de Castilla y León"
    adaptador: opendatasoft
    url: "https://analisis.datosabiertos.jcyl.es/api/explore/v2.1/catalog/datasets/eventos-de-la-agenda-cultural-categorizados-y-geolocalizados/records"
    licencia: "IGCYL-NC / datos abiertos JCyL (atribución)"
    activa: true

  - id: euskadi-kulturklik
    nombre: "Kulturklik, agenda cultural de Euskadi"
    adaptador: euskadi
    url: "https://api.euskadi.eus/culture/events/v1.0/events/upcoming"
    licencia: "Open Data Euskadi (CC BY 4.0)"
    activa: true

  - id: coruna-agenda
    nombre: "Axenda de eventos da Coruña"
    adaptador: ical
    url: "http://www.coruna.gal/axenda-ical/gl?argIdioma=gl"
    licencia: "CC BY 4.0, Concello da Coruña"
    provincia: "A Coruña"
    municipio: "A Coruña"
    activa: true

  # --- Para ver: estrenos y partidos (opcionales, requieren clave gratuita) ---
  - id: tmdb-estrenos
    nombre: "Estrenos de cine en España (TMDB)"
    adaptador: tmdb
    secreto: TMDB_API_KEY
    activa: true

  - id: futbol-laliga-champions
    nombre: "Partidos destacados de LaLiga y Champions (football-data.org)"
    adaptador: football
    secreto: FOOTBALL_DATA_TOKEN
    competiciones: [PD, CL]
    # Entra el partido si alguno de los dos equipos está entre los N primeros de la clasificación (además de la lista de abajo)
    top_clasificacion: 5
    # Solo entran partidos con alguno de estos equipos o fases finales
    equipos_destacados: ["Real Madrid", "FC Barcelona", "Atlético", "Athletic", "Real Sociedad", "Sevilla", "Betis", "Villarreal", "Valencia"]
    # Estadio de cada equipo destacado (el plan gratuito de la API no da el estadio). Mismo texto que en equipos_destacados.
    estadios:
      "Real Madrid": "Santiago Bernabéu"
      "FC Barcelona": "Spotify Camp Nou"
      "Atlético": "Riyadh Air Metropolitano"
      "Athletic": "San Mamés"
      "Real Sociedad": "Reale Arena"
      "Sevilla": "Ramón Sánchez-Pizjuán"
      "Betis": "Benito Villamarín"
      "Villarreal": "Estadio de la Cerámica"
      "Valencia": "Mestalla"
    activa: true

  # --- Prensa: secciones de cultura y ocio (feeds comprobados el 19/10/2026) ---
