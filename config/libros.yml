# Libro recomendado de la portada
# ------------------------------------------------------------
# destacados: libros ligados a un premio, evento o lanzamiento, con ventana de fechas (ISO, ambas incluidas).
#             Si hay varios activos a la vez, gana el primero de la lista.
# reserva:    libros para los meses sin gancho. Se elige uno por mes, de forma estable,
#             y no se repite hasta recorrer toda la lista.
#
# Campos de cada libro:
#   id        identificador (sin espacios)
#   titulo, autor
#   portada   ruta de la imagen en public/img/libros/ (webp o jpg, vertical, ~600x900).
#             Si el fichero no existe, sale una portada tipográfica.
#   sinopsis  { es, en }  (los demás idiomas muestran el inglés)
#   motivo    { es, en }  solo en destacados: por qué toca ahora ("Premio Planeta 2026")
#   desde, hasta          solo en destacados
#   enlace    (reservado) URL de compra o referido; de momento no se muestra
#
# Plantilla de destacado:
#   - id: ejemplo
#     titulo: "…"
#     autor: "…"
#     portada: "/img/libros/ejemplo.webp"
#     desde: "2026-10-16"
#     hasta: "2026-11-01"
#     motivo: { es: "Premio Planeta 2026", en: "2026 Planeta Prize" }
#     sinopsis: { es: "…", en: "…" }

# inicio:     primer mes del histórico ("AAAA-MM"). La reserva avanza un libro por mes desde ese mes, así que
#             añadir libros al FINAL de la lista no cambia lo que ya se recomendó.
# generos:    etiquetas para filtrar en la página de libros (id → nombre en cada idioma).
#             Cada libro lleva `generos: [id, …]`.

inicio: "2026-10"

generos:
  clasico: { es: "Clásicos", en: "Classics", fr: "Classiques", de: "Klassiker", it: "Classici", pt: "Clássicos" }
  historica: { es: "Novela histórica", en: "Historical fiction", fr: "Roman historique", de: "Historischer Roman", it: "Romanzo storico", pt: "Romance histórico" }
  misterio: { es: "Misterio", en: "Mystery", fr: "Mystère", de: "Krimi & Mystery", it: "Mistero", pt: "Mistério" }
  realismo-magico: { es: "Realismo mágico", en: "Magical realism", fr: "Réalisme magique", de: "Magischer Realismus", it: "Realismo magico", pt: "Realismo mágico" }
  contemporanea: { es: "Contemporánea", en: "Contemporary", fr: "Contemporain", de: "Gegenwartsliteratur", it: "Contemporanea", pt: "Contemporânea" }
  relatos: { es: "Relatos", en: "Short stories", fr: "Nouvelles", de: "Erzählungen", it: "Racconti", pt: "Contos" }

destacados:
  - id: don-quijote
    titulo: "Don Quijote de la Mancha"
    autor: "Miguel de Cervantes"
    generos: [clasico]
    portada: "/img/libros/don-quijote.webp"
    desde: "2027-04-16"
    hasta: "2027-04-30"
    motivo: { es: "Día del Libro: Cervantes murió un 23 de abril", en: "World Book Day: Cervantes died on 23 April" }
    sinopsis:
      es: "Un hidalgo manchego enloquece de tanto leer novelas de caballerías y sale por los caminos a deshacer entuertos, con Sancho Panza como escudero. La gran novela en castellano, y también una de las más divertidas."
      en: "A gentleman from La Mancha reads so many chivalry romances that he loses his wits and rides out to right wrongs, with Sancho Panza as his squire. The great novel in Spanish, and one of the funniest."

  - id: autobiografia-de-rojo
    titulo: "Autobiografía de Rojo"
    autor: "Anne Carson"
    generos: [contemporanea]
    portada: "/img/libros/autobiografia-de-rojo.webp"
    desde: "2026-10-08"
    hasta: "2026-10-31"
    motivo: { es: "Premio Nobel de Literatura 2026", en: "2026 Nobel Prize in Literature" }
    sinopsis:
      es: "Gerión, un niño monstruo rojo y con alas, crece, se enamora de Heracles y escribe su autobiografía. Una novela en verso que reinventa un mito griego, de la poeta canadiense Anne Carson, Nobel de Literatura 2026."
      en: "Geryon, a red, winged monster boy, grows up, falls in love with Herakles and writes his autobiography. A novel in verse that reinvents a Greek myth, by Canadian poet Anne Carson, 2026 Nobel laureate."

  # Premiados y muy comentados de los últimos doce meses (ventanas ya cerradas: solo alimentan el histórico).
  - id: tango-satanico
    titulo: "Tango satánico"
    autor: "László Krasznahorkai"
    generos: [contemporanea]
    portada: "/img/libros/tango-satanico.webp"
    desde: "2025-10-09"
    hasta: "2025-10-23"
    motivo: { es: "Premio Nobel de Literatura 2025", en: "2025 Nobel Prize in Literature" }
    sinopsis:
      es: "En una aldea húngara arruinada, la noticia de que ha vuelto un hombre dado por muerto lo cambia todo. La primera novela del Nobel de 2025, hipnótica, de frases larguísimas y humor negro."
      en: "In a ruined Hungarian hamlet, news that a man presumed dead has returned changes everything. The 2025 Nobel laureate's first novel: hypnotic, with very long sentences and black humour."
  - id: vera-una-historia-de-amor
    titulo: "Vera, una historia de amor"
    autor: "Juan del Val"
    generos: [contemporanea, misterio]
    portada: "/img/libros/vera-una-historia-de-amor.webp"
    desde: "2025-10-24"
    hasta: "2025-11-03"
    motivo: { es: "Premio Planeta 2025", en: "2025 Planeta Prize" }
    sinopsis:
      es: "Vera, tras veinte años casada con un marqués, se separa y conoce a un hombre más joven y de origen humilde. El rencor del exmarido convierte la historia de amor en algo mucho más oscuro."
      en: "After twenty years married to a marquis, Vera separates and meets a younger man of humble origins. Her ex-husband's resentment turns the love story into something far darker."
  - id: la-maison-vide
    titulo: "La Maison vide"
    autor: "Laurent Mauvignier"
    generos: [historica, contemporanea]
    portada: "/img/libros/la-maison-vide.webp"
    desde: "2025-11-04"
    hasta: "2025-11-09"
    motivo: { es: "Premio Goncourt 2025", en: "2025 Goncourt Prize" }
    sinopsis:
      es: "En 1976 una mansión de Touraine cerrada durante veinte años vuelve a abrirse, y el narrador tira del hilo de su familia a través de varias generaciones, con la acusación de colaboracionismo de su abuela como herida central. Saga familiar de unas 750 páginas."
      en: "In 1976 a Touraine mansion shut for twenty years is reopened, and the narrator pulls on the thread of his family across generations, with his grandmother's accusation of collaboration at its centre. A family saga of about 750 pages."
  - id: flesh
    titulo: "Flesh"
    autor: "David Szalay"
    generos: [contemporanea]
    portada: "/img/libros/flesh.webp"
    desde: "2025-11-10"
    hasta: "2025-11-24"
    motivo: { es: "Premio Booker 2025", en: "2025 Booker Prize" }
    sinopsis:
      es: "La vida de István, un chico húngaro callado que pasa de un barrio humilde al ejército, a Londres y al dinero. Prosa seca y casi sin adornos para contar una vida entera."
      en: "The life of István, a quiet Hungarian boy who moves from a modest neighbourhood to the army, to London and to money. Spare, almost unadorned prose to tell a whole life."
  - id: la-ciudad-de-las-luces-muertas
    titulo: "La ciudad de las luces muertas"
    autor: "David Uclés"
    generos: [historica, contemporanea]
    portada: "/img/libros/la-ciudad-de-las-luces-muertas.webp"
    desde: "2026-01-06"
    hasta: "2026-01-26"
    motivo: { es: "Premio Nadal 2026", en: "2026 Nadal Prize" }
    sinopsis:
      es: "Novela coral ambientada en la Barcelona de posguerra, donde un apagón total deja la ciudad a oscuras. Premio Nadal 2026, del autor de «La península de las casas vacías»."
      en: "A multi-voiced novel set in postwar Barcelona, where a total blackout plunges the city into darkness. 2026 Nadal Prize winner, by the author of «La península de las casas vacías»."
  - id: el-ejercito-ciego
    titulo: "El ejército ciego"
    autor: "David Toscana"
    generos: [historica]
    portada: "/img/libros/el-ejercito-ciego.webp"
    desde: "2026-01-27"
    hasta: "2026-02-10"
    motivo: { es: "Premio Alfaguara 2026", en: "2026 Alfaguara Prize" }
    sinopsis:
      es: "El emperador bizantino Basilio II manda cegar a miles de soldados búlgaros, y la historia la cuenta Kozaro, el escriba. Premio Alfaguara 2026, del mexicano David Toscana."
      en: "The Byzantine emperor Basil II orders thousands of Bulgarian soldiers blinded, and the story is told by Kozaro, the scribe. 2026 Alfaguara Prize winner, by Mexican author David Toscana."
  - id: angel-down
    titulo: "Angel Down"
    autor: "Daniel Kraus"
    generos: [historica]
    portada: "/img/libros/angel-down.webp"
    desde: "2026-05-04"
    hasta: "2026-05-18"
    motivo: { es: "Premio Pulitzer de Ficción 2026", en: "2026 Pulitzer Prize for Fiction" }
    sinopsis:
      es: "En la Primera Guerra Mundial, cinco soldados encuentran un ángel caído en tierra de nadie y se preguntan si puede acabar con la guerra. Está escrita en una sola frase de unas 300 páginas."
      en: "In the First World War, five soldiers find a fallen angel in no man's land and wonder whether it could end the war. Written as a single sentence across about 300 pages."
  - id: taiwan-travelogue
    titulo: "Taiwan Travelogue"
    autor: "Yáng Shuāng-zǐ"
    generos: [historica]
    portada: "/img/libros/taiwan-travelogue.webp"
    desde: "2026-05-19"
    hasta: "2026-06-02"
    motivo: { es: "Premio Booker Internacional 2026", en: "2026 International Booker Prize" }
    sinopsis:
      es: "Falso diario de viaje de los años treinta en la Taiwán ocupada por Japón: dos mujeres recorren la isla en una ruta gastronómica. Primera obra traducida del mandarín que gana el Booker Internacional."
      en: "A fictional 1930s travel memoir set in Japanese-occupied Taiwan: two women tour the island on a culinary journey. The first work translated from Mandarin to win the International Booker."

reserva:
  - id: cien-anos-de-soledad
    titulo: "Cien años de soledad"
    autor: "Gabriel García Márquez"
    generos: [realismo-magico, clasico]
    portada: "/img/libros/cien-anos-de-soledad.webp"
    sinopsis:
      es: "La saga de la familia Buendía a lo largo de siete generaciones en Macondo, un pueblo donde lo cotidiano y lo extraordinario conviven sin sobresaltos. Un clásico del realismo mágico."
      en: "The saga of the Buendía family across seven generations in Macondo, a town where the everyday and the extraordinary sit side by side. A classic of magical realism."
  - id: la-sombra-del-viento
    titulo: "La sombra del viento"
    autor: "Carlos Ruiz Zafón"
    generos: [misterio, historica]
    portada: "/img/libros/la-sombra-del-viento.webp"
    sinopsis:
      es: "En la Barcelona de posguerra, un niño elige un libro en el Cementerio de los Libros Olvidados y descubre que alguien se dedica a destruir todos los ejemplares de su autor. Misterio, intriga y amor por la lectura."
      en: "In postwar Barcelona, a boy picks a book in the Cemetery of Forgotten Books and learns that someone is destroying every copy of its author's work. Mystery, suspense and a love of reading."
  - id: nada
    titulo: "Nada"
    autor: "Carmen Laforet"
    generos: [clasico]
    portada: "/img/libros/nada.webp"
    sinopsis:
      es: "Andrea llega a Barcelona para estudiar y se instala en casa de unos parientes, en una familia asfixiante. Retrato de la posguerra y primer Premio Nadal."
      en: "Andrea arrives in Barcelona to study and moves in with relatives in a stifling household. A portrait of the postwar years and the first Nadal Prize winner."
  - id: los-santos-inocentes
    titulo: "Los santos inocentes"
    autor: "Miguel Delibes"
    generos: [clasico]
    portada: "/img/libros/los-santos-inocentes.webp"
    sinopsis:
      es: "La vida de una familia de campesinos al servicio de un cortijo extremeño en los años sesenta. Una novela breve, dura y muy bien escrita sobre la desigualdad."
      en: "The life of a family of farm workers serving an Extremadura estate in the 1960s. A short, hard and beautifully written novel about inequality."
  - id: la-ciudad-de-los-prodigios
    titulo: "La ciudad de los prodigios"
    autor: "Eduardo Mendoza"
    generos: [historica]
    portada: "/img/libros/la-ciudad-de-los-prodigios.webp"
    sinopsis:
      es: "Onofre Bouvila llega a Barcelona con una maleta y ningún escrúpulo, y se abre camino entre las dos Exposiciones Universales. Humor, picaresca y la ciudad como protagonista."
      en: "Onofre Bouvila arrives in Barcelona with a suitcase and no scruples, and works his way up between the two World Fairs. Humour, roguery and the city as the main character."
  - id: el-tiempo-entre-costuras
    titulo: "El tiempo entre costuras"
    autor: "María Dueñas"
    generos: [historica]
    portada: "/img/libros/el-tiempo-entre-costuras.webp"
    sinopsis:
      es: "Una joven modista madrileña acaba en el Marruecos de los años treinta y, de ahí, en el espionaje durante la Guerra Civil y la Segunda Guerra Mundial. Aventura y novela histórica de ritmo ágil."
      en: "A young Madrid seamstress ends up in 1930s Morocco and, from there, in espionage during the Civil War and the Second World War. Adventure and historical fiction at a brisk pace."
  - id: patria
    titulo: "Patria"
    autor: "Fernando Aramburu"
    generos: [contemporanea]
    portada: "/img/libros/patria.webp"
    sinopsis:
      es: "Dos familias vecinas de un pueblo vasco, unidas por la amistad y rotas por el terrorismo de ETA. Una novela coral sobre el dolor, el silencio y la convivencia."
      en: "Two neighbouring families in a Basque village, bound by friendship and broken by ETA terrorism. A multi-voiced novel about pain, silence and living together."
  - id: la-casa-de-los-espiritus
    titulo: "La casa de los espíritus"
    autor: "Isabel Allende"
    generos: [realismo-magico]
    portada: "/img/libros/la-casa-de-los-espiritus.webp"
    sinopsis:
      es: "Tres generaciones de mujeres de una misma familia, entre lo mágico y lo político, en un país latinoamericano que atraviesa grandes cambios. La primera novela de Isabel Allende."
      en: "Three generations of women in one family, between the magical and the political, in a Latin American country going through great upheaval. Isabel Allende's first novel."
  - id: niebla
    titulo: "Niebla"
    autor: "Miguel de Unamuno"
    generos: [clasico]
    portada: "/img/libros/niebla.webp"
    sinopsis:
      es: "Augusto Pérez, un joven aburrido, se enamora de una mujer que no le corresponde y decide visitar al autor de su novela. Una nivola breve y juguetona sobre quién escribe nuestra vida."
      en: "Augusto Pérez, a bored young man, falls for a woman who does not love him back and decides to visit the author of his own novel. A short, playful book about who writes our lives."
  - id: la-colmena
    titulo: "La colmena"
    autor: "Camilo José Cela"
    generos: [clasico]
    portada: "/img/libros/la-colmena.webp"
    sinopsis:
      es: "Un retrato coral del Madrid de 1942 a través de más de trescientos personajes que se cruzan en cafés, pensiones y calles. Una novela clave de la posguerra."
      en: "A choral portrait of Madrid in 1942 through more than three hundred characters who cross paths in cafés, boarding houses and streets. A key postwar novel."
  - id: los-girasoles-ciegos
    titulo: "Los girasoles ciegos"
    autor: "Alberto Méndez"
    generos: [relatos, historica]
    portada: "/img/libros/los-girasoles-ciegos.webp"
    sinopsis:
      es: "Cuatro relatos sobre los vencidos de la Guerra Civil, escritos con una sobriedad que duele. Un libro corto que se lee en una tarde."
      en: "Four stories about the losers of the Spanish Civil War, written with a sobriety that hurts. A short book you can read in an afternoon."
  - id: el-amor-en-los-tiempos-del-colera
    titulo: "El amor en los tiempos del cólera"
    autor: "Gabriel García Márquez"
    generos: [realismo-magico]
    portada: "/img/libros/el-amor-en-los-tiempos-del-colera.webp"
    sinopsis:
      es: "Florentino Ariza espera más de cincuenta años a que Fermina Daza vuelva a ser libre. Una historia de amor tenaz, con una ciudad caribeña de fondo."
      en: "Florentino Ariza waits more than fifty years for Fermina Daza to be free again. A tenacious love story set against a Caribbean city."

  # Premiados (añadidos al final: no alteran lo ya recomendado en el histórico).
  - id: el-jarama
    titulo: "El Jarama"
    autor: "Rafael Sánchez Ferlosio"
    generos: [clasico]
    portada: "/img/libros/el-jarama.webp"
    motivo: { es: "Premio Nadal 1955", en: "1955 Nadal Prize" }
    sinopsis:
      es: "Un domingo de verano, un grupo de jóvenes madrileños se baña en el río Jarama. Casi todo es conversación, y de esa charla trivial sale un retrato muy fiel de la España de los cincuenta, con un final que descoloca."
      en: "On a summer Sunday, a group of young Madrileños spend the day bathing in the Jarama river. Almost everything is dialogue, and from that trivial chatter comes a faithful portrait of 1950s Spain, with an unsettling ending."
  - id: la-ciudad-y-los-perros
    titulo: "La ciudad y los perros"
    autor: "Mario Vargas Llosa"
    generos: [contemporanea, clasico]
    portada: "/img/libros/la-ciudad-y-los-perros.webp"
    motivo: { es: "Premio Biblioteca Breve 1962", en: "1962 Biblioteca Breve Prize" }
    sinopsis:
      es: "Un colegio militar de Lima donde los cadetes sobreviven a base de violencia y código de honor. Cuando un disparo mata a uno de ellos, empieza a salir lo que todos querían callar."
      en: "A military academy in Lima where cadets survive on violence and a code of honour. When a gunshot kills one of them, what everyone wanted to hide starts coming out."
  - id: el-nombre-de-la-rosa
    titulo: "El nombre de la rosa"
    autor: "Umberto Eco"
    generos: [misterio, historica]
    portada: "/img/libros/el-nombre-de-la-rosa.webp"
    motivo: { es: "Premio Strega 1981", en: "1981 Strega Prize" }
    sinopsis:
      es: "En 1327, un fraile franciscano y su joven discípulo investigan una serie de muertes en una abadía benedictina con una biblioteca laberíntica. Novela policiaca medieval y mucho más."
      en: "In 1327, a Franciscan friar and his young apprentice investigate a series of deaths in a Benedictine abbey with a labyrinthine library. A medieval detective novel and much more."
  - id: los-hijos-de-la-medianoche
    titulo: "Los hijos de la medianoche"
    autor: "Salman Rushdie"
    generos: [realismo-magico, historica]
    portada: "/img/libros/los-hijos-de-la-medianoche.webp"
    motivo: { es: "Premio Booker 1981", en: "1981 Booker Prize" }
    sinopsis:
      es: "Saleem nace en el instante exacto de la independencia de la India y comparte poderes mágicos con los demás niños nacidos esa hora. La historia del país contada como una biografía desbordante."
      en: "Saleem is born at the exact moment of India's independence and shares magical powers with the other children born that hour. The country's history told as an overflowing biography."
  - id: beloved
    titulo: "Beloved"
    autor: "Toni Morrison"
    generos: [historica, contemporanea]
    portada: "/img/libros/beloved.webp"
    motivo: { es: "Premio Pulitzer de Ficción 1988", en: "1988 Pulitzer Prize for Fiction" }
    sinopsis:
      es: "Sethe, una mujer que escapó de la esclavitud, vive en Ohio con su hija, atormentada por un fantasma. Una novela sobre la memoria y lo que la esclavitud deja en las personas."
      en: "Sethe, a woman who escaped slavery, lives in Ohio with her daughter, haunted by a ghost. A novel about memory and what slavery leaves in people."
  - id: vida-de-pi
    titulo: "Vida de Pi"
    autor: "Yann Martel"
    generos: [contemporanea]
    portada: "/img/libros/vida-de-pi.webp"
    motivo: { es: "Premio Booker 2002", en: "2002 Booker Prize" }
    sinopsis:
      es: "Tras un naufragio, un adolescente indio sobrevive 227 días en un bote salvavidas con un tigre de Bengala. Aventura, fe y una pregunta final sobre qué historia preferimos creer."
      en: "After a shipwreck, an Indian teenager survives 227 days on a lifeboat with a Bengal tiger. Adventure, faith and a final question about which story we prefer to believe."
  - id: la-carretera
    titulo: "La carretera"
    autor: "Cormac McCarthy"
    generos: [contemporanea]
    portada: "/img/libros/la-carretera.webp"
    motivo: { es: "Premio Pulitzer de Ficción 2007", en: "2007 Pulitzer Prize for Fiction" }
    sinopsis:
      es: "Un padre y su hijo caminan hacia el sur por un país arrasado y cubierto de ceniza. Prosa muy seca para una historia de supervivencia y ternura."
      en: "A father and son walk south through a scorched, ash-covered country. Very spare prose for a story of survival and tenderness."
  - id: wolf-hall
    titulo: "Wolf Hall"
    autor: "Hilary Mantel"
    generos: [historica]
    portada: "/img/libros/wolf-hall.webp"
    motivo: { es: "Premio Booker 2009", en: "2009 Booker Prize" }
    sinopsis:
      es: "La corte de Enrique VIII vista por Thomas Cromwell, el hijo de un herrero que llega a ser su hombre de confianza. Novela histórica contada en presente, muy cerca del personaje."
      en: "The court of Henry VIII seen through Thomas Cromwell, a blacksmith's son who becomes his right-hand man. Historical fiction told in the present tense, very close to the character."
  - id: toda-la-luz-que-no-podemos-ver
    titulo: "Toda la luz que no podemos ver"
    autor: "Anthony Doerr"
    generos: [historica]
    portada: "/img/libros/toda-la-luz-que-no-podemos-ver.webp"
    motivo: { es: "Premio Pulitzer de Ficción 2015", en: "2015 Pulitzer Prize for Fiction" }
    sinopsis:
      es: "En la Segunda Guerra Mundial, una chica ciega francesa y un joven soldado alemán experto en radios acaban cruzando sus caminos en Saint-Malo. Capítulos cortos y mucho ritmo."
      en: "In the Second World War, a blind French girl and a young German soldier skilled with radios end up crossing paths in Saint-Malo. Short chapters and plenty of pace."
  - id: la-vegetariana
    titulo: "La vegetariana"
    autor: "Han Kang"
    generos: [contemporanea]
    portada: "/img/libros/la-vegetariana.webp"
    motivo: { es: "Premio Booker Internacional 2016", en: "2016 International Booker Prize" }
    sinopsis:
      es: "Yeong-hye deja de comer carne tras un sueño y su decisión desbarata a su familia. Tres voces cuentan una novela inquietante y breve de la surcoreana Han Kang."
      en: "Yeong-hye stops eating meat after a dream and her decision unravels her family. Three voices tell a short, unsettling novel by South Korea's Han Kang."
  - id: lincoln-en-el-bardo
    titulo: "Lincoln en el Bardo"
    autor: "George Saunders"
    generos: [historica, contemporanea]
    portada: "/img/libros/lincoln-en-el-bardo.webp"
    motivo: { es: "Premio Booker 2017", en: "2017 Booker Prize" }
    sinopsis:
      es: "En 1862, Abraham Lincoln visita de noche la tumba de su hijo Willie mientras los fantasmas del cementerio lo observan y comentan. Un coro de voces, entre lo trágico y lo cómico."
      en: "In 1862, Abraham Lincoln visits his son Willie's tomb at night while the cemetery's ghosts watch and comment. A chorus of voices, between the tragic and the comic."
  - id: la-anomalia
    titulo: "La anomalía"
    autor: "Hervé Le Tellier"
