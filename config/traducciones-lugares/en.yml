museo-nacional-prado:
  texto:
    - "The Museo Nacional del Prado is Spain's great art gallery and one of the most important in the world. It opened its doors in 1819 and houses an extraordinary collection of European painting, particularly strong in the 16th to 19th centuries."
    - "Among its most famous works are Velázquez's Las Meninas, Goya's Majas and The Third of May 1808, Bosch's The Garden of Earthly Delights, and several masterpieces by El Greco, Titian and Rubens. It is impossible to see everything in one visit, so it pays to choose which rooms to prioritise."
    - "The best approach is to go with a plan: pick between three and five works or rooms, check the floor plan and book your ticket in advance in high season. The museum offers free-entry time slots, which tend to be very crowded. Combine the visit with the Retiro, right next door, and with the Reina Sofía and the Thyssen, which complete the so-called Paseo del Arte (Art Walk)."
  faq:
    - p: "What shouldn't you miss at the Prado?"
      r: "Las Meninas, Goya's Majas and The Third of May 1808, Bosch's The Garden of Earthly Delights, and works by El Greco, Titian and Rubens. Decide beforehand what to see, because the museum is huge."
    - p: "How much time do you need?"
      r: "Between two and three hours for a selective visit. If you want to take it slowly, set aside half a day or split the visit in two."
    - p: "When is it free?"
      r: "The museum has free-entry time slots during the week. Always check the official website for opening hours, tickets and access conditions, which change."
    - p: "Do you need to book a ticket?"
      r: "It is recommended to buy your ticket in advance, especially in high season, at weekends and on public holidays, to avoid queues."
    - p: "Can you take photos?"
      r: "The rules on photography and backpacks are set by the museum and change. Check them on the official website before you go."
    - p: "Is it a good plan with kids?"
      r: "Yes, with a short visit focused on a few works. The museum offers materials and activities for families; check its website for details."
museo-reina-sofia:
  texto:
    - "The Museo Reina Sofía is Spain's great museum of 20th-century and contemporary art. It is housed in the former Hospital General de San Carlos, an 18th-century building to which glass towers designed by Jean Nouvel were added."
    - "Its most famous piece is Picasso's Guernica, which has a room of its own alongside sketches and studies for the painting. The collection also includes Dalí, Miró, Juan Gris and other names from the avant-garde movements, and a good overview of Spanish and European art of the last century."
    - "Guernica tends to draw most of the visitors, so it is best to see it first thing in the morning or during quieter time slots. Then explore the rest of the collection at your own pace. The museum hosts temporary exhibitions and has a café and a very well-stocked bookshop. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "Where is Guernica?"
      r: "At the Museo Reina Sofía, in a room of its own, together with sketches and studies for the work."
    - p: "What else is in the museum?"
      r: "Works by Dalí, Miró, Juan Gris and other avant-garde artists, as well as Spanish and European art from the 20th century and today."
    - p: "When is it free?"
      r: "The museum has free-entry time slots. Always check the official website for opening hours, tickets and access conditions, which change."
    - p: "How much time do you need?"
      r: "Between two and three hours for a selective visit, Guernica included."
    - p: "Do you need to book a ticket?"
      r: "Booking in advance is recommended in high season and at weekends."
    - p: "What else is there to see nearby?"
      r: "The Museo del Prado, the Thyssen and the Retiro are a few minutes' walk away. Together they are known as the Paseo del Arte (Art Walk)."
museo-thyssen-bornemisza:
  texto:
    - "The Museo Thyssen-Bornemisza completes Madrid's so-called Paseo del Arte (Art Walk) alongside the Prado and the Reina Sofía. Its collection spans eight centuries of painting, from the Gothic to the 20th-century avant-garde, and is enjoyed through a chronological route that is very easy to follow."
    - "It brings together works by great masters, from Italian and Flemish primitives to Impressionists, Expressionists and 20th-century artists, in a building that was once the Villahermosa palace. It is a manageable museum, with a visit that is easier to take in than the Prado's."
    - "If you are short on time, it is a good choice for a two-hour visit. The route starts on the top floor with the oldest art and works its way down towards the present. Make the most of it by seeing the temporary exhibitions and then strolling through the Retiro. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What kind of art is there at the Thyssen?"
      r: "Eight centuries of European painting, from the Gothic to the 20th-century avant-garde, with works by old masters, Impressionists and Expressionists."
    - p: "How much time do you need?"
      r: "Two to three hours is enough to go round at a relaxed pace."
    - p: "Do you visit it in order?"
      r: "Yes, the route is chronological, from the top floor (old art) to the bottom floor (modern art)."
    - p: "Do you need to book a ticket?"
      r: "It is recommended to buy your ticket in advance in high season and at weekends."
    - p: "When is it free?"
      r: "The museum has free or reduced-price entry time slots. Always check the official website for opening hours, tickets and access conditions, which change."
    - p: "Is it a good plan with kids?"
      r: "Yes, with a short visit. The museum offers activities and routes for families."
palacio-real-madrid:
  texto:
    - "The Royal Palace of Madrid is the official residence of the King, although it is only used for state ceremonies. It is the largest royal palace in Western Europe by floor area and can be visited almost all year round, except when official events are taking place."
    - "The visit takes you through rooms decorated with tapestries, frescoes and crystal chandeliers, such as the Throne Room and the Gala Dining Room, as well as the Royal Armoury and the Royal Pharmacy. There are collections of string instruments, clocks and 18th- and 19th-century furniture."
    - "Check in advance whether the palace is open on the day you want to go, because it closes for official events. Book your ticket in high season to avoid queues and allow between one and two hours for the visit. The Sabatini Gardens and the Campo del Moro, next to the palace, make a good complement. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "Does the King live in the Royal Palace?"
      r: "No, the royal family's residence is somewhere else. The palace is used for official events and ceremonies."
    - p: "What can you visit?"
      r: "State rooms, such as the Throne Room and the Gala Dining Room, the Royal Armoury, the Royal Pharmacy and various art and furniture collections."
    - p: "How much time do you need?"
      r: "Between one and two hours for the full visit."
    - p: "Can it be closed?"
      r: "Yes, the palace closes during official events. Check the website before you go."
    - p: "Do you need to book a ticket?"
      r: "Booking in advance is recommended in high season."
    - p: "What else is there to see nearby?"
      r: "The Almudena Cathedral, Plaza de Oriente, the Sabatini Gardens and the Campo del Moro."
parque-buen-retiro:
  texto:
    - "Buen Retiro Park is Madrid's great park and one of the places madrileños love most. Declared a UNESCO World Heritage Site together with the Paseo del Prado, it is an oasis of gardens, tree-lined paths, ponds and monuments right in the city centre."
    - "Among its best-known spots are the Estanque Grande (the Great Pond), with its rowing boats and the monument to Alfonso XII, the Crystal Palace, the Velázquez Palace and the Rose Garden. There is also a sculpture walk and several quiet corners, such as the Bosque del Recuerdo (Forest of Remembrance)."
    - "It is perfect for strolling, exercising, reading or simply relaxing. The park opens early and the best time to visit is in the morning or at dusk. It is especially lovely in spring, with the Rose Garden, and in autumn, with its colours. Every year it hosts the Book Fair, in late spring."
  faq:
    - p: "What is there to see in the Retiro?"
      r: "The Estanque Grande with its boats, the Crystal Palace, the Velázquez Palace, the Rose Garden and the Bosque del Recuerdo."
    - p: "Is it free?"
      r: "Entry to the park is free. Some activities, such as renting a boat, are paid."
    - p: "Can you rent boats?"
      r: "Yes, on the Estanque Grande, usually with opening hours and a season. Check the conditions."
    - p: "When is the best time to go?"
      r: "In the morning or at dusk. In spring and autumn the park is especially beautiful."
    - p: "Is it a good plan with kids?"
      r: "Yes, there are play areas, boats, puppet shows at certain times of year and plenty of space to run around."
    - p: "Is it a World Heritage Site?"
      r: "Yes, it is part of the Landscape of Light, Paseo del Prado and Buen Retiro, declared by UNESCO."
sagrada-familia:
  texto:
    - "The Sagrada Família is Antoni Gaudí's unfinished masterpiece and the most visited monument in Barcelona. Construction began in 1882 and is still under way, funded largely by visitors' ticket sales. It is part of the works by Gaudí declared a UNESCO World Heritage Site."
    - "The Nativity and Passion façades tell the life of Jesus, each with very different sculpture. The interior is the most surprising part: columns that branch out like trees, vaults with natural forms and coloured light that changes throughout the day depending on the time and the orientation of the stained-glass windows."
    - "Tickets are sold for a fixed date and time and sell out well in advance, so book online before you travel. Allow between an hour and a half and two hours for the visit, with or without an audio guide, and consider going up one of the towers if spaces are available. Beware of resellers in the queues around the site. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "Why is it still unfinished?"
      r: "Because construction began in 1882 and is funded mainly by ticket sales and donations, with a very complex project. Check the official website for the current state of the works."
    - p: "Do you need to book a ticket?"
      r: "Yes, it is best to book online in advance: tickets are sold for a specific time and sell out, especially in high season."
    - p: "How much time do you need?"
      r: "Between an hour and a half and two hours, more if you go up a tower."
    - p: "Can you go up the towers?"
      r: "Yes, there are tickets that include the tower climb, with limited places. Check the conditions on the website."
    - p: "What is there to see inside?"
      r: "The tree-shaped columns, the vaults and the coloured stained-glass windows, whose light changes throughout the day."
    - p: "Is it a World Heritage Site?"
      r: "Yes, it is part of the works by Antoni Gaudí declared a UNESCO World Heritage Site."
park-guell:
  texto:
    - "Park Güell is Gaudí's Modernista park, where architecture and nature blend on a hill with views over all of Barcelona. It is part of the works by Gaudí declared a UNESCO World Heritage Site and is one of the most photographed places in the city."
    - "The most famous part is the Monumental Zone: the great plaza with its undulating bench covered in trencadís mosaic, the colourful salamander, the slanting columns of the portico and the buildings at the entrance. The rest of the park is made up of paths, gardens and viewpoints with free access."
    - "The Monumental Zone has limited capacity and timed entry, and it is best to book in advance. Avoid the middle of the day and go first thing in the morning or late in the afternoon, when there are fewer people and the light is better. Wear comfortable shoes, because there are slopes, and bring water. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "Is Park Güell free?"
      r: "Part of the park is free to enter, but the Monumental Zone, with the undulating bench, requires a timed ticket. Always check the official website for opening hours, tickets and access conditions, which change."
    - p: "Do you need to book?"
      r: "Yes, it is best to book your ticket for the Monumental Zone in advance, because capacity is limited."
    - p: "How much time do you need?"
      r: "Between an hour and a half and two hours, more if you explore the free area of the park."
    - p: "When is the best time to go?"
      r: "First thing in the morning or late in the afternoon, when there are fewer people and the light is better."
    - p: "How do you get there?"
      r: "By metro and bus, or on foot from the nearby stops. There are slopes, so wear comfortable shoes."
    - p: "Is it a good plan with kids?"
      r: "Yes, although there are slopes and steps. Little ones usually enjoy the mosaics and the salamander."
casa-batllo:
  texto:
    - "Casa Batlló is one of Gaudí's most spectacular houses, right on Passeig de Gràcia. Gaudí remodelled it between 1904 and 1906 and created a façade of colours and undulating forms, with balconies that look like masks and a roof reminiscent of a dragon's back."
    - "Inside, everything feels like nature: the light well covered in blue tiles that change shade with height, the main salon with its large windows, the staircase and the attic, with its catenary arches. It is a house with almost no straight lines, and every detail has been thought through."
    - "The visit is done with an audio guide and usually includes augmented reality. Book in advance, because tickets sell out in high season, and allow an hour and a half. Casa Batlló is part of the stretch known as the Manzana de la Discordia (Block of Discord), alongside Casa Amatller and Casa Lleó Morera. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "Who built Casa Batlló?"
      r: "Antoni Gaudí remodelled it between 1904 and 1906 for the Batlló family."
    - p: "What is the Manzana de la Discordia?"
      r: "The stretch of Passeig de Gràcia where Modernista buildings by different architects stand side by side, including Casa Batlló, Casa Amatller and Casa Lleó Morera."
    - p: "Do you need to book a ticket?"
      r: "Yes, it is best to book in advance, especially in high season."
    - p: "How long does the visit last?"
      r: "Between an hour and an hour and a half, with an audio guide."
    - p: "What shouldn't you miss?"
      r: "The façade, the light well with its blue tiles, the main salon and the rooftop with the chimneys."
    - p: "Is it a World Heritage Site?"
      r: "Yes, it is part of the works by Gaudí declared a UNESCO World Heritage Site."
ciudad-artes-ciencias:
  texto:
    - "The City of Arts and Sciences is Valencia's great cultural and leisure complex, a set of futuristic buildings by Santiago Calatrava and Félix Candela that has become one of the city's symbols. It sits in the former bed of the River Turia, now a large garden."
    - "It brings together several venues: the Hemisfèric, with its IMAX cinema and eye-shaped planetarium; the Museu de les Ciències Príncipe Felipe; the Oceanogràfic, one of the largest aquariums in Europe; the Palau de les Arts Reina Sofía, devoted to opera; the Ágora; and the Umbracle, a walkway with gardens. Each one is visited separately and combined tickets are available."
    - "Although you can stroll around the outside for free, going inside the buildings requires a ticket. If you are travelling with kids, the Oceanogràfic and the Science Museum are the most recommended. Come by bike or on foot through the Turia garden and avoid the hottest hours. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What does the City of Arts and Sciences include?"
      r: "The Hemisfèric, the Museu de les Ciències, the Oceanogràfic, the Palau de les Arts, the Ágora and the Umbracle."
    - p: "Can you get in for free?"
      r: "You can walk around the outside, but access to the buildings requires a ticket. Always check the official website for opening hours, tickets and access conditions, which change."
    - p: "What should you see if you are short on time?"
      r: "A stroll around the outside to see the architecture and, if you have time, the Oceanogràfic or the Science Museum."
    - p: "Is it a good plan with kids?"
      r: "Yes, the Oceanogràfic and the Science Museum are well designed for families."
    - p: "How do you get there?"
      r: "By metro, tram or bus, or on foot or by bike through the Turia garden."
    - p: "Are there combined tickets?"
      r: "Yes, combined tickets are available for several venues. Check the options on the official website."
real-alcazar-sevilla:
  texto:
    - "The Real Alcázar of Seville is a fortified palace of Muslim origin, expanded over the centuries, and one of the finest examples of the Mudéjar style. It is a World Heritage Site together with the cathedral and the Archivo de Indias, and it is still an official residence of the King when he visits the city."
    - "The heart of the complex is the Palace of Pedro I, from the 14th century, with the Patio de las Doncellas (Courtyard of the Maidens), the Salón de Embajadores (Ambassadors' Hall) with its golden dome, and exquisitely delicate plasterwork. Around it stretch gardens with ponds, fountains, orange trees and shaded corners. It has been a filming location for series and films, including Game of Thrones."
    - "Book your ticket in advance, because it sells out, especially in spring and autumn. Allow between two and three hours for the visit and avoid the hottest hours if you go in summer. Combine the Alcázar with the cathedral, the Giralda and the Santa Cruz neighbourhood, which are right next door. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What is the Real Alcázar of Seville?"
      r: "A fortified palace of Muslim origin, expanded in Christian times, with the Mudéjar Palace of Pedro I as its centrepiece."
    - p: "Do you need to book a ticket?"
      r: "Yes, it is best to book in advance, especially in high season."
    - p: "How much time do you need?"
      r: "Between two and three hours, between the palaces and the gardens."
    - p: "What shouldn't you miss?"
      r: "The Patio de las Doncellas, the Salón de Embajadores, the Palace of Charles V and the gardens."
    - p: "Is it still a royal residence?"
      r: "Yes, it is one of the King's official residences and is used for official events."
    - p: "Is it a World Heritage Site?"
      r: "Yes, together with the cathedral and the Archivo General de Indias, since 1987."
plaza-mayor-madrid:
  texto:
    - "Plaza Mayor is one of the best-known squares in Madrid. It is a large, enclosed rectangular space surrounded by arcades and multi-storey buildings, built in the early 17th century, and for centuries it has hosted festivals, markets and public events."
    - "In the centre stands the statue of Philip III, and on one side is the Casa de la Panadería, with its frescoes on the façade. Under the arcades there are shops selling souvenirs, stamps and coins, and the square's café terraces are a classic spot for a drink, though pricier than the streets around."
    - "In winter the Christmas market is set up here, with stalls selling nativity scenes and decorations, and throughout the year there are concerts and activities. For something to eat, it is better to head to the nearby side streets, where you will find calamari sandwiches and the more traditional taverns. First thing in the morning it feels much calmer."
  faq:
    - p: "What is there to see in Plaza Mayor?"
      r: "The statue of Philip III, the Casa de la Panadería with its frescoes, the arcades and the atmosphere of the café terraces."
    - p: "Is there a Christmas market?"
      r: "Yes, in winter the Christmas market is set up, with stalls selling nativity scenes and decorations. Check the dates each year."
    - p: "Is it a good idea to eat in the square?"
      r: "The terraces in the square are more expensive. The side streets around it have cheaper taverns and calamari sandwiches."
    - p: "When is the best time to go?"
      r: "First thing in the morning or at sunset, to avoid the busiest hours."
    - p: "What else is there to see nearby?"
      r: "The Mercado de San Miguel, Puerta del Sol, the Royal Palace and the La Latina neighbourhood."
puerta-sol-madrid:
  texto:
    - "Puerta del Sol is the heart of Madrid and one of the best-known places in Spain. This is where you will find Kilometre Zero of Spain's radial roads, marked by a plaque on the ground, and the clock of the Real Casa de Correos that rings in the New Year's Eve chimes."
    - "The square is a popular meeting point and a very busy junction of streets. Here you will find the statue of the Bear and the Strawberry Tree, a symbol of the city, the Real Casa de Correos building, now the seat of the regional government, and the illuminated Tío Pepe sign, one of the most photographed."
    - "It is a quick stop of fifteen or twenty minutes, and it combines well with a stroll to Plaza Mayor, calle Mayor or the pedestrian streets of the centre. Watch out for pickpockets in crowded areas and for the usual scams in tourist zones. On New Year's Eve it fills up with people who want to experience the chimes in person."
  faq:
    - p: "What is Kilometre Zero?"
      r: "A plaque on the ground, in front of the Real Casa de Correos, that marks the origin of Spain's radial roads."
    - p: "Which clock is the one for the New Year's Eve chimes?"
      r: "The one on the Real Casa de Correos, in Puerta del Sol, which marks the twelve chimes of New Year's Eve."
    - p: "What else is there to see in the square?"
      r: "The statue of the Bear and the Strawberry Tree, the Tío Pepe sign and the Real Casa de Correos."
    - p: "How much time do you need?"
      r: "About fifteen or twenty minutes to see the main sights, more if you sit down to soak up the atmosphere."
    - p: "Are there pickpockets?"
      r: "It is a very busy area and pickpockets operate where there are lots of people. Look after your belongings."
    - p: "What is nearby?"
      r: "Plaza Mayor, the Mercado de San Miguel, calle Preciados and the Royal Palace are all a few minutes' walk away."
mercado-san-miguel:
  texto:
    - "The Mercado de San Miguel is an iron-and-glass covered market opened in 1916, next to Plaza Mayor. Today it is a food hall where you can graze on all sorts of things, standing or sitting, among stalls of fresh produce, tapas, wines and preserves."
    - "It offers a huge variety: ham, cheeses, seafood, omelettes, croquettes, pintxos, sweets and drinks of every kind. It is very popular with tourists and locals alike, and it is a quick way to try lots of things in one place, although prices are higher than in the taverns nearby."
    - "It gets very crowded at lunchtime and on weekends, so it is best to go first thing or in the mid-afternoon. If you want a cheaper experience, combine a stop here with some tapas in the taverns of La Latina. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What can you eat?"
      r: "Ham, cheeses, seafood, omelettes, croquettes, pintxos, sweets and wine, among other products."
    - p: "Is it expensive?"
      r: "Prices are usually higher than in the taverns nearby, because it is a very touristy spot."
    - p: "When is the best time to go?"
      r: "First thing or in the mid-afternoon. At lunchtime and on weekends it gets crowded."
    - p: "Can you book?"
      r: "In general no, it is a market with free access. Some stalls have tables."
    - p: "What else is there to see nearby?"
      r: "Plaza Mayor, Puerta del Sol and the La Latina neighbourhood."
casa-mila-pedrera:
  texto:
    - "Casa Milà, known as La Pedrera, is another of Gaudí's great works in Barcelona. It was built between 1906 and 1912 as a home for the Milà family, and its undulating stone façade, with hardly a straight line, earned it that nickname, which means \"the quarry\"."
    - "The most impressive part is the rooftop, with its chimneys and ventilation outlets that look like sculpted warriors and with views over the city, and the attic, with brick arches forming a rib-like structure. You can also visit a recreated apartment to see how people lived in the early 20th century."
    - "Book ahead, because tickets sell out in high season, and allow an hour and a half for the visit. La Pedrera also organises night visits and cultural activities. It is part of the works of Gaudí declared a UNESCO World Heritage Site. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "Why is it called La Pedrera?"
      r: "Because of its undulating stone façade, which recalls a quarry, a nickname it was given when it was built."
    - p: "What is there to see at La Pedrera?"
      r: "The rooftop with its chimneys, the attic with its arches and a recreated apartment from the early 20th century."
    - p: "Do you need to book tickets?"
      r: "Yes, it is best to book ahead, especially in high season."
    - p: "How long does the visit take?"
      r: "About an hour and a half."
    - p: "Are there night visits?"
      r: "La Pedrera organises visits and activities outside regular hours. Check what is on offer on the official website."
    - p: "Is it a World Heritage Site?"
      r: "Yes, it is part of the works of Gaudí declared a UNESCO World Heritage Site."
museo-picasso-barcelona:
  texto:
    - "The Picasso Museum in Barcelona occupies five medieval palaces on calle Montcada, in the Ribera neighbourhood. Its collection focuses on the artist's youth and his relationship with the city, and it is one of the best places to understand how Picasso evolved from his early years."
    - "It brings together works from his formative years, his Blue Period and other stages, and above all the complete Las Meninas series, a reinterpretation of Velázquez's painting that Picasso made in 1957. The route lets you follow the artist's development before he became famous."
    - "Book ahead, because tickets sell out in high season, and allow an hour and a half for the visit. It is a small, well-organised museum, ideal to combine with a stroll around El Born and the basilica of Santa María del Mar. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What is there in the Picasso Museum?"
      r: "Early works and pieces from different stages of Picasso's career, plus the complete Las Meninas series."
    - p: "Where is it?"
      r: "On calle Montcada, in the Ribera neighbourhood of Barcelona, in five medieval palaces."
    - p: "Do you need to book tickets?"
      r: "Yes, it is best to book ahead, especially in high season."
    - p: "How long does the visit take?"
      r: "About an hour and a half."
    - p: "What else is there to see nearby?"
      r: "The basilica of Santa María del Mar, the El Born neighbourhood and the cathedral."
boqueria:
  texto:
    - "La Boqueria, officially the Mercat de Sant Josep, is Barcelona's most famous market and one of the best known in Europe. It is on La Rambla and brings together stalls of fruit, vegetables, meat, fish, cured meats, sweets and plenty of colour."
    - "As well as buying fresh produce, you can eat and snack at the market's bars, which serve Catalan dishes such as eggs with mushrooms, squid or omelette. The fruit and freshly made juice stalls are at the entrance, and the more traditional ones are inside."
    - "It gets very crowded, especially at midday, and it is an area with pickpockets, so look after your belongings. For a more authentic and cheaper meal, avoid the stalls at the entrance and head further inside, or go out to the nearby streets. Go first thing in the morning if you want to avoid the crowds. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What is La Boqueria?"
      r: "Barcelona's most famous market, officially the Mercat de Sant Josep, located on La Rambla."
    - p: "What can you eat?"
      r: "Tapas and Catalan dishes at the market's bars, plus fruit, juices, cured meats and sweets."
    - p: "When is the best time to go?"
      r: "First thing in the morning, before it fills up with people."
    - p: "Is it expensive?"
      r: "The stalls at the entrance are the most touristy and expensive. Those inside and in the nearby streets are usually cheaper."
    - p: "Are there pickpockets?"
      r: "Yes, it is a very busy area. Look after your belongings."
giralda:
  texto:
    - "The Giralda is the symbol of Seville. It was the minaret of the old Almohad mosque, built in the 12th century, to which the Christians added a Renaissance bell tower in the 16th century. Today it is part of the cathedral, a World Heritage Site together with the Alcázar and the Archivo de Indias."
    - "Climbing the Giralda is one of the city's most popular experiences. Instead of stairs it has ramps, which according to tradition allowed riders to go up on horseback, and from the top you can see all of Seville, with its rooftops, the cathedral's courtyards and the river. The ticket for the tower usually includes a visit to the cathedral."
    - "Buy your tickets in advance and avoid the hottest hours. In the cathedral you can also see the tomb of Christopher Columbus and the main altarpiece. Allow an hour and a half for the whole complex. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What is the Giralda?"
      r: "The tower of Seville Cathedral, the former minaret of the 12th-century Almohad mosque, with a Renaissance bell tower added later."
    - p: "Can you climb it?"
      r: "Yes, by ramps instead of stairs. From the top there are views of the whole city."
    - p: "Do you have to pay?"
      r: "Entry to the cathedral and the Giralda is paid, with special conditions at certain times. Always check the official website for opening hours, tickets and access conditions, which change."
    - p: "What else is there to see in the cathedral?"
      r: "The tomb of Columbus, the main altarpiece and the Patio de los Naranjos."
    - p: "How much time do you need?"
      r: "Around an hour and a half for the cathedral and tower."
torre-oro:
  texto:
    - "The Torre del Oro is an Almohad-era albarrana tower, built in the early 13th century on the banks of the Guadalquivir as part of the city's defences. Its name is attributed to the golden reflections of its tiles on the water, or to the gold that arrived from America and was stored there."
    - "Today it houses a small naval museum, with models, instruments and documents on the history of Seville's port, and from its rooftop you can see the river and the old town. The visit is short, around 20 to 30 minutes, and combines well with a stroll along the paseo de Colón."
    - "It is one of the most typical images of Seville, and it looks especially good at sunset, with the light on the river. Take the chance to cross the Triana bridge or walk along the riverbank. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What is the Torre del Oro?"
      r: "A defensive tower of Almohad origin, from the 13th century, on the banks of the Guadalquivir."
    - p: "Why is it called that?"
      r: "The name is attributed to the golden reflections of its tiles on the water, or to the gold that came from America."
    - p: "Can you visit it?"
      r: "Yes, it houses a naval museum. Check the opening hours and conditions."
    - p: "How much time do you need?"
      r: "About 20-30 minutes."
    - p: "When is the best time to see it?"
      r: "At sunset, when the light reflected on the river brings out more colour."
plaza-espana-sevilla:
  texto:
    - "Plaza de España is one of the most beautiful squares in Spain. Designed by Aníbal González for the 1929 Ibero-American Exposition, it is semicircular, with a large building of brick and ceramics, a tower at each end and a canal with bridges."
    - "Along the square there are tiled benches representing the Spanish provinces, each with its coat of arms and a historical scene. You can stroll under the arcades, cross the bridges and rent a boat on the canal. It has been a film location, including for one of the Star Wars movies."
    - "Entry is free and it is next to María Luisa park. Go first thing or at sunset, when there are fewer people and better light, and avoid the hottest hours. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What is Plaza de España?"
      r: "A large semicircular square built for the 1929 Ibero-American Exposition, designed by Aníbal González."
    - p: "Is there an entrance fee?"
      r: "No, access is free. The boats on the canal do cost money."
    - p: "What is there to see?"
      r: "The tiled benches of the provinces, the bridges, the towers and the canal."
    - p: "When is the best time to go?"
      r: "First thing or at sunset, to avoid the crowds and the heat."
    - p: "What is nearby?"
      r: "María Luisa park and the Santa Cruz neighbourhood."
universidad-salamanca:
  texto:
    - "The University of Salamanca is the oldest in Spain still in operation. It was founded in 1218 and for centuries was one of the great centres of learning in Europe, with figures such as Fray Luis de León and Miguel de Unamuno linked to its classrooms."
    - "The historic complex centres on the Patio de Escuelas. The Plateresque façade of the Escuelas Mayores is one of the city's most recognisable sights, and hidden in it is a small frog on top of a skull that visitors traditionally try to spot. Inside you can tour the historic lecture halls and the Old Library, with its highly valuable collections."
    - "Autumn is a good time to visit: the Old Library is part of \"Las llaves de la ciudad\" (\"The keys to the city\"), the guided-tour programme that Salamanca holds every year (in 2026, from 24 October to 20 December). Those who complete the programme's passport can enter a draw to see the library's sanctum sanctorum. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What is the University of Salamanca best known for?"
      r: "The Plateresque façade of the Escuelas Mayores, with its hidden frog, and the Old Library."
    - p: "Where is the frog?"
      r: "On the façade of the Escuelas Mayores, on top of a skull. It is a tradition to try to find it."
    - p: "Can you visit the Old Library?"
      r: "Yes. Besides the regular visit, it is part of \"Las llaves de la ciudad\", with guided tours in autumn. Check the official website for places and conditions."
    - p: "What is Las llaves de la ciudad?"
      r: "An annual programme of guided visits to heritage sites in Salamanca. The local press presents it as free, but you have to book on the Salamanca Tourism website."
    - p: "How much time do you need?"
      r: "An hour or two for the exterior and the visitable areas. More if you add the Old Library and the area around the cathedrals."
    - p: "What else is there to see nearby?"
      r: "The Cathedrals, the Casa de las Conchas and the Clerecía are a few minutes' walk away."
teatro-real-madrid:
  texto:
    - "The Teatro Real is Madrid's opera house. Opened in 1850, it has hosted major premieres and the finest opera, ballet and classical music, and it remains one of the most important cultural institutions in Spain."
    - "It has its own opera season with high-quality productions, and it also programmes ballet and concerts. The building can also be visited on a guided tour, which lets you see the auditorium, the dressing rooms, the workshops and the inner workings of a great theatre."
    - "If you want to attend a performance, check the programme and buy in advance: the most in-demand operas sell out. There are tickets at different prices, some with a restricted view. Every 22 December the Christmas Lottery draw is held here. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What can you do at the Teatro Real?"
      r: "Attend an opera, a ballet or a concert, or take a guided tour of the building."
    - p: "Can you visit it without going to a performance?"
      r: "Yes, there are guided tours of the building. Check the schedule and booking on the official website."
    - p: "Are there cheap tickets?"
      r: "There are tickets at different prices, including some with a restricted view. Check the conditions on the website."
    - p: "What should you wear?"
      r: "There is no compulsory dress code, although many people dress a little more formally to go to the opera."
    - p: "What else is there to see nearby?"
      r: "The Royal Palace, the Plaza de Oriente and the Plaza de Isabel II are just a few steps away."
palau-musica-catalana:
  texto:
    - "The Palau de la Música Catalana is a gem of Catalan Modernisme, designed by Lluís Domènech i Montaner and opened in 1908. Together with the Hospital de Sant Pau, it forms a UNESCO World Heritage site, and it is still an active concert hall."
    - "The main hall is the great attraction: an inverted skylight of coloured glass dominates the ceiling, surrounded by sculptures, mosaics and stained-glass windows. Decorative details, with flowers, instruments and figures, cover almost every surface of the building, and the lavish auditorium has a very special beauty."
    - "You can visit it on a guided tour or attend a concert, which is the best way to experience the hall with its acoustics. Book in advance, because the tours fill up. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What is the Palau de la Música Catalana?"
      r: "A Modernista concert hall designed by Domènech i Montaner, opened in 1908 and declared a World Heritage site."
    - p: "Can you visit it?"
      r: "Yes, with guided tours. Check the schedule and booking on the official website."
    - p: "Is it better to take a tour or go to a concert?"
      r: "If you can, go to a concert: you see the hall in use and enjoy its acoustics. If not, the guided tour lets you see it in detail."
    - p: "How long does the tour last?"
      r: "About an hour. Check the exact duration on the website."
    - p: "What shouldn't you miss?"
      r: "The great coloured-glass skylight in the concert hall."
catedral-barcelona:
  texto:
    - "The Cathedral of the Holy Cross and Saint Eulalia is Barcelona's Gothic cathedral, right in the Gothic Quarter. It was built between the 13th and 15th centuries, and its main façade dates from the late 19th century, although it is inspired by the original medieval design."
    - "Inside, the highlights are the tall, dim naves, the carved wooden choir, the crypt with the tomb of Saint Eulalia and the cloister, an oasis of calm with a garden and a flock of thirteen geese that have lived there for centuries. You can also take a lift up to the rooftop for a view over the city from above."
    - "Many people visit the cathedral during worship hours, with limited free entry, and there is also a paid ticket for the tourist route. Respect the religious character of the building and dress appropriately. On Sundays, the sardana is usually danced in front of the cathedral. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What is there to see in Barcelona Cathedral?"
      r: "The choir, the crypt of Saint Eulalia, the cloister with the geese and the view from the rooftop."
    - p: "Why are there geese in the cloister?"
      r: "It is a centuries-old tradition: there are thirteen geese, recalling the age of Saint Eulalia when she died, according to legend."
    - p: "Can you go up to the rooftop?"
      r: "Yes, a lift takes you up to the rooftop, with a separate ticket. Check the conditions."
    - p: "Is it free?"
      r: "There are worship hours with limited access and a paid ticket for the tourist route. Always check the official website for opening hours, tickets and access conditions, which change."
    - p: "What should you wear?"
      r: "Modest clothing, with shoulders and knees covered, out of respect for the religious character of the building."
    - p: "What is the sardana?"
      r: "A traditional Catalan dance performed in a circle. It is usually held in front of the cathedral on certain days; check the schedule."
teatro-museo-dali:
  texto:
    - "The Dalí Theatre-Museum, in Figueres, is the great museum dedicated to Salvador Dalí, created by the artist himself in the former municipal theatre of his hometown and opened in 1974. It is a work of art in itself, a surrealist space conceived by Dalí as a single theatrical object."
    - "The tour includes an enormous geodesic dome, the courtyard with the Rainy Cadillac, the Mae West Room, works from every period of the artist's career and the crypt where he is buried. It is a museum full of surprises and details, with a collection that runs from his earliest works to his last."
    - "Figueres is about two hours from Barcelona and just over one hour from the Costa Brava. Book in advance, because tickets sell out in summer, and combine it with the Dalí House in Portlligat and Púbol Castle to complete the so-called Dalinian triangle. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "Who created the Dalí Theatre-Museum?"
      r: "Salvador Dalí himself, who designed it in the former municipal theatre of Figueres, opened as a museum in 1974."
    - p: "Where is Dalí buried?"
      r: "In a crypt inside the Theatre-Museum itself, in Figueres."
    - p: "How much time do you need?"
      r: "Between two and three hours."
    - p: "Do you need to book a ticket?"
      r: "Yes, it is best to book in advance, especially in summer."
    - p: "What else is there to see related to Dalí?"
      r: "The Dalí House in Portlligat (Cadaqués) and Púbol Castle, which together form the Dalinian triangle."
    - p: "How do you get there from Barcelona?"
      r: "By train or bus to Figueres, in about two hours."
lonja-seda:
  texto:
    - "The Silk Exchange (Lonja de la Seda) is one of the great monuments of European civil Gothic architecture and a UNESCO World Heritage site since 1996. It was built between the 15th and 16th centuries as the home of the silk trade, at the time of Valencia's greatest splendour."
    - "The most spectacular part is the Contract Hall (Sala de Contratación), a great hall with spiral columns that open out like palm trees to form vaults. The building also has an orange-tree courtyard, a tower and the hall of the Consulate of the Sea, with a polychrome wooden ceiling."
    - "It is a short visit, of about an hour, and it is in the centre, next to the Central Market. Combine it with the cathedral and the Miguelete. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What is the Silk Exchange?"
      r: "A 15th-century civil Gothic building, the former home of the silk trade, declared a World Heritage site."
    - p: "What is there to see?"
      r: "The Contract Hall with its spiral columns, the orange-tree courtyard and the hall of the Consulate of the Sea."
    - p: "How much time do you need?"
      r: "About an hour."
    - p: "Where is it?"
      r: "In the centre of Valencia, next to the Central Market."
    - p: "Is it a World Heritage site?"
      r: "Yes, since 1996, declared by UNESCO."
catedral-valencia:
  texto:
    - "Valencia Cathedral is a Gothic church with Romanesque, Renaissance and Baroque elements that reflect centuries of history. It stands right in the centre, next to the Plaza de la Virgen, and is the city's great church."
    - "In its Holy Chalice chapel it keeps a cup that tradition holds to be the Holy Grail, an object of great devotion. Its doors are also notable, such as the Apostles' Door, where the Water Tribunal meets on Thursdays at noon, the oldest institution in Europe still in operation. You can also climb the Miguelete, its bell tower."
    - "Respect the religious character of the building and dress appropriately. Check the visiting hours, because some areas close during worship. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What is the Holy Chalice?"
      r: "A cup that tradition holds to be the Holy Grail and which is venerated in a chapel of the cathedral."
    - p: "What is the Water Tribunal?"
      r: "A medieval institution that settles irrigation disputes of the huerta every Thursday at noon, in front of the Apostles' Door."
    - p: "Can you climb the tower?"
      r: "Yes, the Miguelete, the bell tower. Check the access conditions."
    - p: "Is it free?"
      r: "There is a ticket for the tourist route. Always check the official website for opening hours, tickets and access conditions, which change."
    - p: "What should you wear?"
      r: "Modest clothing, with shoulders and knees covered, out of respect for the religious character of the building."
museo-picasso-malaga:
  texto:
    - "The Museo Picasso Málaga is dedicated to the most universal artist born in the city, in 1881. It is housed in the Buenavista Palace, a 16th-century Renaissance building in the old town, and brings together works from different stages of his life, largely donated by his family."
    - "The collection follows Picasso's career, from his earliest works to his final period, with painting, drawing, sculpture, ceramics and printmaking. The building also preserves Phoenician and Roman archaeological remains visible in the basement, and temporary exhibitions are held."
    - "It makes a good visit of an hour and a half or two hours. Combine it with Picasso's birthplace, which is nearby, in the Plaza de la Merced, and with a stroll through the centre. Book in advance in high season. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "Was Picasso born in Málaga?"
      r: "Yes, he was born in Málaga in 1881. The museum is in the city's historic centre."
    - p: "What is in the museum?"
      r: "Painting, drawing, sculpture, ceramics and printmaking from different stages of Picasso's career."
    - p: "How much time do you need?"
      r: "Between an hour and a half and two hours."
    - p: "Do you need to book?"
      r: "Booking is recommended in high season."
    - p: "What else is there to see nearby?"
      r: "Picasso's birthplace, the Plaza de la Merced and the cathedral."
alcazaba-malaga:
  texto:
    - "The Alcazaba of Málaga is an 11th-century Muslim palace-fortress, one of the best preserved in Spain. It rises on a hill right in the centre, with courtyards, gardens, fountains, walls and views of the port and the city."
    - "The route climbs through several gates and courtyards to the Nasrid palaces, with horseshoe arches, plasterwork and pools. From the walls you can see the cathedral, the port and the Roman Theatre, which lies right at its foot. Another fortress, Gibralfaro Castle, is linked to it by a fortified path."
    - "Wear comfortable shoes and bring water and sun protection, because there are slopes and stairs. Avoid the hottest hours and set aside an hour and a half or two hours for the visit. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What is the Alcazaba of Málaga?"
      r: "An 11th-century Muslim palace-fortress, with courtyards, gardens and views of the city."
    - p: "What is there to see?"
      r: "The courtyards, the gardens, the Nasrid palaces and the views of the port from the walls."
    - p: "How much time do you need?"
      r: "Between an hour and a half and two hours."
    - p: "How do you get up?"
      r: "On foot, by ramps and stairs. There is a lift from the outside for some stretches; check the accessibility information."
    - p: "What is nearby?"
      r: "The Roman Theatre, the cathedral and the Picasso Museum."
plaza-mayor-salamanca:
  texto:
    - "The Plaza Mayor of Salamanca is one of the most beautiful squares in Spain and the heart of the city's life. It is a Baroque square of golden stone, built in the 18th century to a design by Alberto de Churriguera, with continuous arcades and a very harmonious whole."
    - "On the arches and the façades there are medallions with reliefs of figures from Spanish history, and on one side stands the Town Hall, the Casa Consistorial. By day it is a good place to have a coffee under the arcades, and at night, with the lighting, it looks even better."
    - "This autumn the Casa Consistorial takes part in \"Las llaves de la ciudad\" (The Keys to the City), the Town Hall's visit programme (in 2026, from 24 October to 20 December), which opens some of its rooms. Always check the official website for opening hours and visiting conditions, which change."
  faq:
    - p: "Who designed the Plaza Mayor?"
      r: "Alberto de Churriguera, in the 18th century, in the Salamanca Baroque style."
    - p: "What are the medallions?"
      r: "Reliefs with portraits of figures from Spanish history that decorate the arches and façades of the square."
    - p: "Can you visit the Town Hall?"
      r: "It opens to visitors during \"Las llaves de la ciudad\", held in autumn. Check the official Salamanca Tourism website for dates and bookings."
    - p: "When is the best time to go?"
      r: "By day for a stroll and a coffee, and at dusk, when the lighting brings out the golden stone."
    - p: "What else is there to see nearby?"
      r: "The Casa de las Conchas, the University and the Cathedrals, all a few minutes' walk away."
catedrales-salamanca:
  texto:
    - "Salamanca has two joined cathedrals: the Old one, Romanesque and from the 12th century, and the New one, Gothic and built between the 16th and 18th centuries. They are toured together and are one of the city's main visits."
    - "The Old Cathedral has an intimate interior and a much-admired altarpiece, while the New one stands out for its vaults and great height. On the Ramos Door of the New Cathedral there are curious details added during a recent restoration, such as an astronaut and a dragon eating an ice cream, which visitors like to look for."
    - "The towers can be accessed by a route through the inside of the cathedral, with views over the city. Book in advance in high season and combine the visit with the University and the Casa de las Conchas, which are very close. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What is the difference between the Old and the New Cathedral?"
      r: "The Old one is Romanesque, from the 12th century. The New one is Gothic, built between the 16th and 18th centuries."
    - p: "Where is the astronaut?"
      r: "On the Ramos Door of the New Cathedral. Next to it there are other curious figures, such as a dragon with an ice cream."
    - p: "Can you go up the towers?"
      r: "Yes, there is access to the towers with views of the city. Check the official website for tickets and opening hours."
    - p: "How much time do you need?"
      r: "Between one and two hours to see both cathedrals, longer if you go up the towers."
    - p: "Do you need to book?"
      r: "It is recommended in high season, at weekends and on public holidays."
    - p: "What else is there to see nearby?"
      r: "The University, the Casa de las Conchas and the Clerecía are a few minutes' walk away."
galeria-de-las-colecciones-reales:
  texto:
    - "The Galería de las Colecciones Reales (Royal Collections Gallery) is a museum next to the Royal Palace of Madrid, devoted to the collections that the Spanish Crown has gathered over the centuries. It displays tapestries, paintings, furniture, carriages and pieces of great historical and artistic value."
    - "The contemporary building looks out over the Manzanares valley and the Casa de Campo. Its route arranges the works by period and by king, and helps you understand how the artistic heritage of the Spanish monarchy was built up."
    - "It is a good complementary visit to the Royal Palace and can be done in one or two hours. If you plan to combine the two, check whether joint tickets are available and book in advance. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What is there in the Galería de las Colecciones Reales?"
      r: "Tapestries, paintings, furniture, carriages and other pieces from the Crown's collections."
    - p: "Where is it?"
      r: "Next to the Royal Palace of Madrid, overlooking the Manzanares valley."
    - p: "How much time do you need?"
      r: "Between one and two hours."
    - p: "Can you combine it with the Royal Palace?"
      r: "Yes, they are very close to each other. Check the website to see whether joint tickets are available."
    - p: "Do you need to book?"
      r: "Booking is recommended in high season and at weekends."
castillo-santa-barbara:
  texto:
    - "Santa Bárbara Castle towers over Alicante from the top of Mount Benacantil and is the city's great viewpoint. It is a medieval fortress with centuries of history, expanded over different periods, and it offers spectacular views of the bay, the port and the coast."
    - "You can walk up along a path or drive, and there is also a lift from Postiguet beach. The visit includes courtyards, walls, halls and a small museum that explains the history of the castle and the city. At sunset, the light over the bay is especially beautiful."
    - "Wear comfortable shoes and bring water and sun protection, because in summer it is very hot and there is little shade. Allow between one and two hours for the visit. Check the access conditions and whether there is an entrance fee. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "How do you get up to the castle?"
      r: "On foot along a path, by car or by lift from Postiguet beach."
    - p: "Is it free?"
      r: "Check the access conditions on the official website, as they can change."
    - p: "How much time do you need?"
      r: "Between one and two hours, depending on what you see."
    - p: "When is the best time to go?"
      r: "At sunset, to avoid the heat and see the city in the best light."
    - p: "What should you wear?"
      r: "Comfortable shoes, a hat, water and sun protection, especially in summer."
    - p: "Is it a good plan with kids?"
      r: "Yes, although there are slopes and steps. The lift makes access easier."
casa-pilatos:
  texto:
    - "The Casa de Pilatos is one of the most beautiful palaces in Seville, a blend of Mudejar, Gothic and Italian Renaissance styles. Built in the late 15th and early 16th centuries by the Enríquez de Ribera family, it now belongs to the ducal house of Medinaceli."
    - "It stands out for its main courtyard, with arches, tiles and plasterwork, and for its gardens. It preserves one of the largest collections of tiles in Spain, as well as classical sculptures, coffered ceilings and a staircase with a dome. The visit covers a ground floor and an upper floor, the latter by guided tour."
    - "It is a pleasant visit of about an hour, less crowded than the Alcázar. It is in the centre, close to the Santa Cruz quarter and the Plaza del Salvador. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What is the Casa de Pilatos?"
      r: "A Sevillian palace from the 15th and 16th centuries, combining Mudejar, Gothic and Renaissance styles."
    - p: "What is there to see?"
      r: "The main courtyard with its tiles, the gardens, the classical sculptures and the staircase with a dome."
    - p: "How much time do you need?"
      r: "About an hour."
    - p: "Who owns it?"
      r: "It belongs to the ducal house of Medinaceli."
    - p: "Where is it?"
      r: "In the centre of Seville, close to the Santa Cruz quarter."
barrio-santa-cruz:
  texto:
    - "The Santa Cruz quarter is the old Jewish quarter of Seville and one of the most charming corners of the historic centre. Its narrow lanes, squares with orange trees, whitewashed houses and flower-filled patios form a labyrinth made for getting lost in."
    - "Among its best-known spots are the Plaza de Doña Elvira, Calle Agua, the Plaza de los Venerables and the Murillo Gardens. Here you can feel the most traditional Seville, with taverns, craft shops and quiet corners just a few metres from the cathedral and the Alcázar."
    - "The best way to explore it is on foot, without rushing and without a map, first thing in the morning or at sunset, when there are fewer people. In the middle of the day it fills up with tourists and heat. Look after your belongings and try a tapa in one of the quarter's taverns. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What is the Santa Cruz quarter?"
      r: "The old Jewish quarter of Seville, with narrow streets, squares with orange trees and whitewashed houses."
    - p: "What is there to see?"
      r: "The Plaza de Doña Elvira, Calle Agua, the Plaza de los Venerables and the Murillo Gardens."
    - p: "When is the best time to go?"
      r: "First thing in the morning or at sunset, to avoid the heat and the crowds."
    - p: "Is it safe?"
      r: "It is a very busy area, so it is wise to look after your belongings."
    - p: "What else is nearby?"
      r: "The cathedral, the Giralda, the Alcázar and the Casa de Pilatos."
catedral-malaga:
  texto:
    - "Málaga Cathedral is a large Renaissance church built between the 16th and 18th centuries. It is known as La Manquita (the one-armed lady) because only one of its towers was completed: according to tradition, the money set aside for the second was used for other purposes."
    - "The interior is notable for its carved wooden choir, its high vaults and its chapels. You can go up to the roof, from where you can see the city, the port and the Alcazaba, with a very complete panoramic view of the historic centre."
    - "Respect the religious character of the building and dress appropriately. Allow between one hour and an hour and a half for the visit. Check the opening hours, which vary depending on services. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "Why is it called La Manquita?"
      r: "Because only one of the two planned towers was completed."
    - p: "What is there to see?"
      r: "The carved wooden choir, the chapels and the views from the roof."
    - p: "Can you go up to the roof?"
      r: "Yes, with a separate ticket. Check the conditions."
    - p: "How much time do you need?"
      r: "Between one hour and an hour and a half."
    - p: "What should you wear?"
      r: "Modest clothing, with shoulders and knees covered, out of respect for the religious character of the building."
basilica-nuestra-senora-pilar:
  texto:
    - "The Basilica of Our Lady of the Pillar is the great symbol of Zaragoza and one of Spain's major Marian shrines. It stands beside the Ebro and houses the Virgen del Pilar, a small image on a jasper column that draws pilgrims from all over the world, especially every 12 October."
    - "The Baroque church stands out for its eleven domes covered in coloured tiles and for the paintings in the dome of the choir, by Goya and Francisco Bayeu. Inside is the Holy Chapel, where the Virgin is venerated, and to one side are kept the bombs that fell in 1936 without exploding. You can also climb one of the towers to see the city from above."
    - "It is a place of worship, so keep quiet and dress appropriately. The visit can be combined with the Plaza del Pilar, La Seo cathedral and the Lonja, all very close by. If you go in October, it coincides with the Fiestas del Pilar and the Flower Offering. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What is the Virgen del Pilar?"
      r: "A small image of the Virgin on a jasper column, venerated in the basilica's Holy Chapel and patron saint of Zaragoza and of the Hispanic world."
    - p: "What is there to see in the basilica?"
      r: "The domes with paintings by Goya and Bayeu, the Holy Chapel, the bombs of 1936 and the Pilar museum."
    - p: "Can you go up the tower?"
      r: "Yes, there is a viewpoint in one of the towers. Check the access conditions."
    - p: "Do you have to pay to get in?"
      r: "Entry to the basilica is free, and there are paid tickets for the tower and the museum. Always check the official website for opening hours, tickets and access conditions, which change."
    - p: "When is the Flower Offering?"
      r: "On 12 October, during the Fiestas del Pilar."
    - p: "What should you wear?"
      r: "Modest clothing, with shoulders and knees covered, out of respect for the religious character of the building."
palacio-aljaferia:
  texto:
    - "The Aljafería Palace is a jewel of Hispano-Muslim art, built in the 11th century as the residence of the kings of the taifa of Zaragoza. It is the best example of Islamic architecture in the north of the peninsula and a unique monument that preserves elements from every period."
    - "The most impressive parts are the Santa Isabel courtyard, with its interlaced arches, and the oratory, a small space that was once a mosque, with a mihrab of great decorative richness. After the Christian conquest, the palace of the Catholic Monarchs was added, with a gilded coffered ceiling, along with the Throne Room. The Troubadour Tower is famous for inspiring Verdi's opera."
    - "Today it is the seat of the Cortes of Aragón, so some areas have limited opening hours. It is part of the Mudejar Architecture of Aragón, declared a World Heritage Site. Allow an hour and a half for the visit. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What is the Aljafería?"
      r: "An 11th-century Hispano-Muslim palace that was the residence of the kings of the taifa of Zaragoza and is now the seat of the Cortes of Aragón."
    - p: "What is there to see?"
      r: "The Santa Isabel courtyard, the oratory, the palace of the Catholic Monarchs and the Troubadour Tower."
    - p: "Is it a World Heritage Site?"
      r: "Yes, it is part of the Mudejar architecture of Aragón."
    - p: "How much time do you need?"
      r: "About an hour and a half."
    - p: "Is it free?"
      r: "There are free-entry time slots. Always check the official website for opening hours, tickets and access conditions, which change."
museo-guggenheim:
  texto:
    - "The Guggenheim Museum Bilbao is the city's most famous building and one of the most visited contemporary art museums in Europe. Designed by Frank Gehry and opened in 1997, its curved, titanium-clad forms beside the Nervión estuary transformed Bilbao's image."
    - "Before going in, it is worth walking around the building to see the sculptures outside: Puppy, Jeff Koons's giant dog covered in flowers, Maman, Louise Bourgeois's giant spider, and Koons's Tulips. Inside, the museum hosts temporary exhibitions of modern and contemporary art and large-scale permanent works, such as Richard Serra's The Matter of Time."
    - "Book your ticket in advance in high season and allow between two and three hours for the visit. You can stroll around the exterior for free, beside the estuary, and the building looks especially striking at sunrise and sunset. If you are short on time, prioritise the Serra gallery and a temporary exhibition. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "Who designed the Guggenheim Bilbao?"
      r: "The architect Frank Gehry. The museum opened in 1997."
    - p: "What is there to see?"
      r: "The exterior, with Puppy, Maman and the Tulips, and inside, Richard Serra's The Matter of Time and the temporary exhibitions."
    - p: "How much time do you need?"
      r: "Between two and three hours for a full visit."
    - p: "Do you need to book a ticket?"
      r: "Booking in advance is recommended in high season and at weekends."
    - p: "Can you see the exterior for free?"
      r: "Yes, the walk around the exterior beside the estuary and the sculptures can be enjoyed without a ticket."
    - p: "Is it a good plan with kids?"
      r: "Yes, children often enjoy the exterior and the sculptures, and the museum offers activities for families."
catedral-santiago-compostela:
  texto:
    - "Santiago de Compostela Cathedral is the destination of the Camino de Santiago and one of the great churches of Christendom. According to tradition, it holds the remains of the Apostle James and is the centre of a World Heritage city that pilgrims from all over the world come to."
    - "The building is mainly Romanesque, with Gothic, Renaissance and Baroque additions, such as the great Obradoiro façade. The most valuable features are the Portico of Glory, a 12th-century masterpiece by Master Mateo, and the crypt with the apostle's tomb. Traditionally, pilgrims hug the image of Saint James and visit the tomb. The botafumeiro, the great censer, is used on certain occasions."
    - "The Pilgrims' Mass is held at midday and tends to be packed, so arrive early. The Obradoiro square, in front of the façade, is where many pilgrims end their journey. Check the schedule for visits, for the roofs and for the celebrations in which the botafumeiro is used. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What is Santiago Cathedral?"
      r: "The great church of Santiago de Compostela, the destination of the Camino de Santiago, where according to tradition the apostle rests."
    - p: "What is the Portico of Glory?"
      r: "A masterpiece of Romanesque sculpture by Master Mateo, from the 12th century, located at the entrance of the cathedral."
    - p: "What is the botafumeiro?"
      r: "A large censer that swings through the transept on certain occasions. Check the dates on the official website."
    - p: "When is the Pilgrims' Mass?"
      r: "It is usually held at midday. Arrive early because it fills up. Always check the official website for opening hours, tickets and access conditions, which change."
    - p: "Can you go up to the roofs?"
      r: "Yes, there are guided visits to the roofs with advance booking. Check the conditions."
    - p: "Is it a World Heritage Site?"
      r: "Yes, the old town of Santiago de Compostela and the Camino de Santiago are both declared World Heritage Sites."
hostal-reyes-catolicos:
  texto:
    - "The Hostal de los Reyes Católicos is a great Plateresque building on the Obradoiro square, next to the cathedral. Founded in 1499 by the Catholic Monarchs as a hospital for pilgrims, it is now a parador and is considered one of the oldest hotels in the world."
    - "Its spectacular Plateresque doorway, with reliefs and sculptures, and its four Renaissance cloisters with fountains and arcades stand out. Inside there is a chapel, lounges and a gallery with an exhibition. Although it is a hotel, parts of the building can be visited."
    - "Check the visiting conditions, as some areas are reserved for guests. One option is to have a meal or a drink in its restaurant or café, and see the cloisters. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What is the Hostal de los Reyes Católicos?"
      r: "A Plateresque building from 1499, created as a hospital for pilgrims and now a parador, next to Santiago cathedral."
    - p: "Can you visit it?"
      r: "Some areas, such as the cloisters, yes. Check the conditions."
    - p: "What is there to see?"
      r: "The Plateresque doorway, the cloisters and the chapel."
    - p: "Is it the oldest hotel in the world?"
      r: "It is considered one of the oldest, as it has served as lodging for pilgrims since the 15th century."
    - p: "Where is it?"
      r: "On the Obradoiro square, next to the cathedral."
