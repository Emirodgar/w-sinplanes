museo-nacional-prado:
  texto:
    - "The Museo Nacional del Prado is Spain's great art gallery and one of the most important in the world. It opened its doors in 1819 and houses an extraordinary collection of European painting, particularly strong in the 16th to 19th centuries."
    - "Among its most famous works are Velázquez's Las Meninas, Goya's Majas and The Third of May 1808, Bosch's The Garden of Earthly Delights, and several masterpieces by El Greco, Titian and Rubens. It is impossible to see everything in one visit, so it pays to choose which rooms to prioritise."
    - "The best approach is to go with a plan: pick between three and five works or rooms, check the floor plan and book your ticket in advance in high season. The museum offers free-entry time slots, which tend to be very crowded. Combine the visit with the Retiro, right next door, and with the Reina Sofía and the Thyssen, which complete the so-called Paseo del Arte (Art Walk)."
  faq:
    - p: "What shouldn't you miss at the Prado?"
      r: "Las Meninas, Goya's Majas and The Third of May 1808, Bosch's The Garden of Earthly Delights, and works by El Greco, Titian and Rubens. Decide beforehand what to see, because the museum is huge."
    - p: "How much time do you need?"
      r: "Between two and three hours for a selective visit. If you want to take it slowly, set aside half a day or split the visit in two."
    - p: "When is it free?"
      r: "The museum has free-entry time slots during the week. Always check the official website for opening hours, tickets and access conditions, which change."
    - p: "Do you need to book a ticket?"
      r: "It is recommended to buy your ticket in advance, especially in high season, at weekends and on public holidays, to avoid queues."
    - p: "Can you take photos?"
      r: "The rules on photography and backpacks are set by the museum and change. Check them on the official website before you go."
    - p: "Is it a good plan with kids?"
      r: "Yes, with a short visit focused on a few works. The museum offers materials and activities for families; check its website for details."
museo-reina-sofia:
  texto:
    - "The Museo Reina Sofía is Spain's great museum of 20th-century and contemporary art. It is housed in the former Hospital General de San Carlos, an 18th-century building to which glass towers designed by Jean Nouvel were added."
    - "Its most famous piece is Picasso's Guernica, which has a room of its own alongside sketches and studies for the painting. The collection also includes Dalí, Miró, Juan Gris and other names from the avant-garde movements, and a good overview of Spanish and European art of the last century."
    - "Guernica tends to draw most of the visitors, so it is best to see it first thing in the morning or during quieter time slots. Then explore the rest of the collection at your own pace. The museum hosts temporary exhibitions and has a café and a very well-stocked bookshop. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "Where is Guernica?"
      r: "At the Museo Reina Sofía, in a room of its own, together with sketches and studies for the work."
    - p: "What else is in the museum?"
      r: "Works by Dalí, Miró, Juan Gris and other avant-garde artists, as well as Spanish and European art from the 20th century and today."
    - p: "When is it free?"
      r: "The museum has free-entry time slots. Always check the official website for opening hours, tickets and access conditions, which change."
    - p: "How much time do you need?"
      r: "Between two and three hours for a selective visit, Guernica included."
    - p: "Do you need to book a ticket?"
      r: "Booking in advance is recommended in high season and at weekends."
    - p: "What else is there to see nearby?"
      r: "The Museo del Prado, the Thyssen and the Retiro are a few minutes' walk away. Together they are known as the Paseo del Arte (Art Walk)."
museo-thyssen-bornemisza:
  texto:
    - "The Museo Thyssen-Bornemisza completes Madrid's so-called Paseo del Arte (Art Walk) alongside the Prado and the Reina Sofía. Its collection spans eight centuries of painting, from the Gothic to the 20th-century avant-garde, and is enjoyed through a chronological route that is very easy to follow."
    - "It brings together works by great masters, from Italian and Flemish primitives to Impressionists, Expressionists and 20th-century artists, in a building that was once the Villahermosa palace. It is a manageable museum, with a visit that is easier to take in than the Prado's."
    - "If you are short on time, it is a good choice for a two-hour visit. The route starts on the top floor with the oldest art and works its way down towards the present. Make the most of it by seeing the temporary exhibitions and then strolling through the Retiro. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What kind of art is there at the Thyssen?"
      r: "Eight centuries of European painting, from the Gothic to the 20th-century avant-garde, with works by old masters, Impressionists and Expressionists."
    - p: "How much time do you need?"
      r: "Two to three hours is enough to go round at a relaxed pace."
    - p: "Do you visit it in order?"
      r: "Yes, the route is chronological, from the top floor (old art) to the bottom floor (modern art)."
    - p: "Do you need to book a ticket?"
      r: "It is recommended to buy your ticket in advance in high season and at weekends."
    - p: "When is it free?"
      r: "The museum has free or reduced-price entry time slots. Always check the official website for opening hours, tickets and access conditions, which change."
    - p: "Is it a good plan with kids?"
      r: "Yes, with a short visit. The museum offers activities and routes for families."
palacio-real-madrid:
  texto:
    - "The Royal Palace of Madrid is the official residence of the King, although it is only used for state ceremonies. It is the largest royal palace in Western Europe by floor area and can be visited almost all year round, except when official events are taking place."
    - "The visit takes you through rooms decorated with tapestries, frescoes and crystal chandeliers, such as the Throne Room and the Gala Dining Room, as well as the Royal Armoury and the Royal Pharmacy. There are collections of string instruments, clocks and 18th- and 19th-century furniture."
    - "Check in advance whether the palace is open on the day you want to go, because it closes for official events. Book your ticket in high season to avoid queues and allow between one and two hours for the visit. The Sabatini Gardens and the Campo del Moro, next to the palace, make a good complement. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "Does the King live in the Royal Palace?"
      r: "No, the royal family's residence is somewhere else. The palace is used for official events and ceremonies."
    - p: "What can you visit?"
      r: "State rooms, such as the Throne Room and the Gala Dining Room, the Royal Armoury, the Royal Pharmacy and various art and furniture collections."
    - p: "How much time do you need?"
      r: "Between one and two hours for the full visit."
    - p: "Can it be closed?"
      r: "Yes, the palace closes during official events. Check the website before you go."
    - p: "Do you need to book a ticket?"
      r: "Booking in advance is recommended in high season."
    - p: "What else is there to see nearby?"
      r: "The Almudena Cathedral, Plaza de Oriente, the Sabatini Gardens and the Campo del Moro."
parque-buen-retiro:
  texto:
    - "Buen Retiro Park is Madrid's great park and one of the places madrileños love most. Declared a UNESCO World Heritage Site together with the Paseo del Prado, it is an oasis of gardens, tree-lined paths, ponds and monuments right in the city centre."
    - "Among its best-known spots are the Estanque Grande (the Great Pond), with its rowing boats and the monument to Alfonso XII, the Crystal Palace, the Velázquez Palace and the Rose Garden. There is also a sculpture walk and several quiet corners, such as the Bosque del Recuerdo (Forest of Remembrance)."
    - "It is perfect for strolling, exercising, reading or simply relaxing. The park opens early and the best time to visit is in the morning or at dusk. It is especially lovely in spring, with the Rose Garden, and in autumn, with its colours. Every year it hosts the Book Fair, in late spring."
  faq:
    - p: "What is there to see in the Retiro?"
      r: "The Estanque Grande with its boats, the Crystal Palace, the Velázquez Palace, the Rose Garden and the Bosque del Recuerdo."
    - p: "Is it free?"
      r: "Entry to the park is free. Some activities, such as renting a boat, are paid."
    - p: "Can you rent boats?"
      r: "Yes, on the Estanque Grande, usually with opening hours and a season. Check the conditions."
    - p: "When is the best time to go?"
      r: "In the morning or at dusk. In spring and autumn the park is especially beautiful."
    - p: "Is it a good plan with kids?"
      r: "Yes, there are play areas, boats, puppet shows at certain times of year and plenty of space to run around."
    - p: "Is it a World Heritage Site?"
      r: "Yes, it is part of the Landscape of Light, Paseo del Prado and Buen Retiro, declared by UNESCO."
sagrada-familia:
  texto:
    - "The Sagrada Família is Antoni Gaudí's unfinished masterpiece and the most visited monument in Barcelona. Construction began in 1882 and is still under way, funded largely by visitors' ticket sales. It is part of the works by Gaudí declared a UNESCO World Heritage Site."
    - "The Nativity and Passion façades tell the life of Jesus, each with very different sculpture. The interior is the most surprising part: columns that branch out like trees, vaults with natural forms and coloured light that changes throughout the day depending on the time and the orientation of the stained-glass windows."
    - "Tickets are sold for a fixed date and time and sell out well in advance, so book online before you travel. Allow between an hour and a half and two hours for the visit, with or without an audio guide, and consider going up one of the towers if spaces are available. Beware of resellers in the queues around the site. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "Why is it still unfinished?"
      r: "Because construction began in 1882 and is funded mainly by ticket sales and donations, with a very complex project. Check the official website for the current state of the works."
    - p: "Do you need to book a ticket?"
      r: "Yes, it is best to book online in advance: tickets are sold for a specific time and sell out, especially in high season."
    - p: "How much time do you need?"
      r: "Between an hour and a half and two hours, more if you go up a tower."
    - p: "Can you go up the towers?"
      r: "Yes, there are tickets that include the tower climb, with limited places. Check the conditions on the website."
    - p: "What is there to see inside?"
      r: "The tree-shaped columns, the vaults and the coloured stained-glass windows, whose light changes throughout the day."
    - p: "Is it a World Heritage Site?"
      r: "Yes, it is part of the works by Antoni Gaudí declared a UNESCO World Heritage Site."
park-guell:
  texto:
    - "Park Güell is Gaudí's Modernista park, where architecture and nature blend on a hill with views over all of Barcelona. It is part of the works by Gaudí declared a UNESCO World Heritage Site and is one of the most photographed places in the city."
    - "The most famous part is the Monumental Zone: the great plaza with its undulating bench covered in trencadís mosaic, the colourful salamander, the slanting columns of the portico and the buildings at the entrance. The rest of the park is made up of paths, gardens and viewpoints with free access."
    - "The Monumental Zone has limited capacity and timed entry, and it is best to book in advance. Avoid the middle of the day and go first thing in the morning or late in the afternoon, when there are fewer people and the light is better. Wear comfortable shoes, because there are slopes, and bring water. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "Is Park Güell free?"
      r: "Part of the park is free to enter, but the Monumental Zone, with the undulating bench, requires a timed ticket. Always check the official website for opening hours, tickets and access conditions, which change."
    - p: "Do you need to book?"
      r: "Yes, it is best to book your ticket for the Monumental Zone in advance, because capacity is limited."
    - p: "How much time do you need?"
      r: "Between an hour and a half and two hours, more if you explore the free area of the park."
    - p: "When is the best time to go?"
      r: "First thing in the morning or late in the afternoon, when there are fewer people and the light is better."
    - p: "How do you get there?"
      r: "By metro and bus, or on foot from the nearby stops. There are slopes, so wear comfortable shoes."
    - p: "Is it a good plan with kids?"
      r: "Yes, although there are slopes and steps. Little ones usually enjoy the mosaics and the salamander."
casa-batllo:
  texto:
    - "Casa Batlló is one of Gaudí's most spectacular houses, right on Passeig de Gràcia. Gaudí remodelled it between 1904 and 1906 and created a façade of colours and undulating forms, with balconies that look like masks and a roof reminiscent of a dragon's back."
    - "Inside, everything feels like nature: the light well covered in blue tiles that change shade with height, the main salon with its large windows, the staircase and the attic, with its catenary arches. It is a house with almost no straight lines, and every detail has been thought through."
    - "The visit is done with an audio guide and usually includes augmented reality. Book in advance, because tickets sell out in high season, and allow an hour and a half. Casa Batlló is part of the stretch known as the Manzana de la Discordia (Block of Discord), alongside Casa Amatller and Casa Lleó Morera. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "Who built Casa Batlló?"
      r: "Antoni Gaudí remodelled it between 1904 and 1906 for the Batlló family."
    - p: "What is the Manzana de la Discordia?"
      r: "The stretch of Passeig de Gràcia where Modernista buildings by different architects stand side by side, including Casa Batlló, Casa Amatller and Casa Lleó Morera."
    - p: "Do you need to book a ticket?"
      r: "Yes, it is best to book in advance, especially in high season."
    - p: "How long does the visit last?"
      r: "Between an hour and an hour and a half, with an audio guide."
    - p: "What shouldn't you miss?"
      r: "The façade, the light well with its blue tiles, the main salon and the rooftop with the chimneys."
    - p: "Is it a World Heritage Site?"
      r: "Yes, it is part of the works by Gaudí declared a UNESCO World Heritage Site."
ciudad-artes-ciencias:
  texto:
    - "The City of Arts and Sciences is Valencia's great cultural and leisure complex, a set of futuristic buildings by Santiago Calatrava and Félix Candela that has become one of the city's symbols. It sits in the former bed of the River Turia, now a large garden."
    - "It brings together several venues: the Hemisfèric, with its IMAX cinema and eye-shaped planetarium; the Museu de les Ciències Príncipe Felipe; the Oceanogràfic, one of the largest aquariums in Europe; the Palau de les Arts Reina Sofía, devoted to opera; the Ágora; and the Umbracle, a walkway with gardens. Each one is visited separately and combined tickets are available."
    - "Although you can stroll around the outside for free, going inside the buildings requires a ticket. If you are travelling with kids, the Oceanogràfic and the Science Museum are the most recommended. Come by bike or on foot through the Turia garden and avoid the hottest hours. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What does the City of Arts and Sciences include?"
      r: "The Hemisfèric, the Museu de les Ciències, the Oceanogràfic, the Palau de les Arts, the Ágora and the Umbracle."
    - p: "Can you get in for free?"
      r: "You can walk around the outside, but access to the buildings requires a ticket. Always check the official website for opening hours, tickets and access conditions, which change."
    - p: "What should you see if you are short on time?"
      r: "A stroll around the outside to see the architecture and, if you have time, the Oceanogràfic or the Science Museum."
    - p: "Is it a good plan with kids?"
      r: "Yes, the Oceanogràfic and the Science Museum are well designed for families."
    - p: "How do you get there?"
      r: "By metro, tram or bus, or on foot or by bike through the Turia garden."
    - p: "Are there combined tickets?"
      r: "Yes, combined tickets are available for several venues. Check the options on the official website."
real-alcazar-sevilla:
  texto:
    - "The Real Alcázar of Seville is a fortified palace of Muslim origin, expanded over the centuries, and one of the finest examples of the Mudéjar style. It is a World Heritage Site together with the cathedral and the Archivo de Indias, and it is still an official residence of the King when he visits the city."
    - "The heart of the complex is the Palace of Pedro I, from the 14th century, with the Patio de las Doncellas (Courtyard of the Maidens), the Salón de Embajadores (Ambassadors' Hall) with its golden dome, and exquisitely delicate plasterwork. Around it stretch gardens with ponds, fountains, orange trees and shaded corners. It has been a filming location for series and films, including Game of Thrones."
    - "Book your ticket in advance, because it sells out, especially in spring and autumn. Allow between two and three hours for the visit and avoid the hottest hours if you go in summer. Combine the Alcázar with the cathedral, the Giralda and the Santa Cruz neighbourhood, which are right next door. Always check the official website for opening hours, tickets and access conditions, which change."
  faq:
    - p: "What is the Real Alcázar of Seville?"
      r: "A fortified palace of Muslim origin, expanded in Christian times, with the Mudéjar Palace of Pedro I as its centrepiece."
    - p: "Do you need to book a ticket?"
      r: "Yes, it is best to book in advance, especially in high season."
    - p: "How much time do you need?"
      r: "Between two and three hours, between the palaces and the gardens."
    - p: "What shouldn't you miss?"
      r: "The Patio de las Doncellas, the Salón de Embajadores, the Palace of Charles V and the gardens."
    - p: "Is it still a royal residence?"
      r: "Yes, it is one of the King's official residences and is used for official events."
    - p: "Is it a World Heritage Site?"
      r: "Yes, together with the cathedral and the Archivo General de Indias, since 1987."
