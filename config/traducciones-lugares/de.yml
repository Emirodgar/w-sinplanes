museo-nacional-prado:
  texto:
    - "Das Museo Nacional del Prado ist die große Gemäldegalerie Spaniens und eine der bedeutendsten der Welt. Es öffnete 1819 seine Türen und vereint eine außergewöhnliche Sammlung europäischer Malerei, mit besonderer Stärke im 16. bis 19. Jahrhundert."
    - "Zu seinen berühmtesten Werken zählen Las Meninas von Velázquez, die Majas und die Erschießungen vom 3. Mai von Goya, Der Garten der Lüste von Hieronymus Bosch sowie mehrere Meisterwerke von El Greco, Tizian oder Rubens. Es ist unmöglich, alles in einem Besuch zu sehen, daher lohnt es sich, vorher auszuwählen, welche Säle man priorisiert."
    - "Am besten gehst du mit einem Plan hin: Wähle drei bis fünf Werke oder Säle aus, wirf einen Blick auf den Lageplan und reserviere in der Hochsaison das Ticket rechtzeitig im Voraus. Das Museum bietet Zeitfenster mit kostenlosem Eintritt, die meist sehr voll sind. Verbinde den Besuch mit dem Retiro-Park direkt nebenan sowie mit dem Reina Sofía und dem Thyssen, die zusammen den sogenannten Paseo del Arte bilden."
  faq:
    - p: "Was sollte man im Prado nicht verpassen?"
      r: "Las Meninas, die Majas und die Erschießungen vom 3. Mai von Goya, Der Garten der Lüste von Hieronymus Bosch sowie Werke von El Greco, Tizian und Rubens. Entscheide vorher, was du sehen willst, denn das Museum ist riesig."
    - p: "Wie viel Zeit braucht man?"
      r: "Zwei bis drei Stunden für einen gezielten Besuch. Wenn du es in Ruhe sehen möchtest, plane einen halben Tag ein oder teile den Besuch auf zwei Tage auf."
    - p: "Wann ist der Eintritt kostenlos?"
      r: "Das Museum bietet im Laufe der Woche Zeitfenster mit kostenlosem Eintritt. Informiere dich für Öffnungszeiten, Tickets und Zugangsbedingungen, die sich ändern können, immer auf der offiziellen Website."
    - p: "Muss man ein Ticket reservieren?"
      r: "Es wird empfohlen, das Ticket im Voraus zu kaufen, vor allem in der Hochsaison, an Wochenenden und Feiertagen, um Warteschlangen zu vermeiden."
    - p: "Darf man fotografieren?"
      r: "Die Regeln zum Fotografieren und zu Rucksäcken legt das Museum fest und sie können sich ändern. Informiere dich vor dem Besuch auf der offiziellen Website."
    - p: "Ist es ein guter Plan mit Kindern?"
      r: "Ja, mit einem kurzen Besuch, der sich auf wenige Werke konzentriert. Das Museum bietet Materialien und Aktivitäten für Familien an; informiere dich dazu auf der Website."
museo-reina-sofia:
  texto:
    - "Das Museo Reina Sofía ist Spaniens großes Museum für Kunst des 20. Jahrhunderts und zeitgenössische Kunst. Es befindet sich im ehemaligen Hospital General de San Carlos, einem Gebäude aus dem 18. Jahrhundert, an das von Jean Nouvel entworfene Glastürme angebaut wurden."
    - "Sein berühmtestes Werk ist Picassos Guernica, das einen eigenen Saal hat und von Skizzen und Studien zum Gemälde begleitet wird. Die Sammlung umfasst außerdem Dalí, Miró, Juan Gris und weitere Namen der Avantgarde sowie einen guten Überblick über spanische und europäische Kunst des vergangenen Jahrhunderts."
    - "Der Guernica zieht die meisten Besucher an, daher sieht man ihn am besten gleich morgens oder in den Zeiten mit weniger Andrang. Danach kannst du den Rest der Sammlung in Ruhe erkunden. Das Museum veranstaltet Wechselausstellungen und hat ein Café sowie eine sehr gut sortierte Buchhandlung. Informiere dich für Öffnungszeiten, Tickets und Zugangsbedingungen, die sich ändern können, immer auf der offiziellen Website."
  faq:
    - p: "Wo ist der Guernica?"
      r: "Im Museo Reina Sofía, in einem eigenen Saal, zusammen mit Skizzen und Studien zum Werk."
    - p: "Was gibt es sonst noch im Museum?"
      r: "Werke von Dalí, Miró, Juan Gris und anderen Künstlern der Avantgarde sowie spanische und europäische Kunst des 20. Jahrhunderts und zeitgenössische Kunst."
    - p: "Wann ist der Eintritt kostenlos?"
      r: "Das Museum bietet Zeitfenster mit kostenlosem Eintritt. Informiere dich für Öffnungszeiten, Tickets und Zugangsbedingungen, die sich ändern können, immer auf der offiziellen Website."
    - p: "Wie viel Zeit braucht man?"
      r: "Zwei bis drei Stunden für einen gezielten Besuch, einschließlich des Guernica."
    - p: "Muss man ein Ticket reservieren?"
      r: "In der Hochsaison und an Wochenenden wird empfohlen, im Voraus zu reservieren."
    - p: "Was kann man in der Nähe noch sehen?"
      r: "Das Museo del Prado, das Thyssen und der Retiro-Park liegen nur wenige Gehminuten entfernt. Zusammen sind sie als Paseo del Arte bekannt."
museo-thyssen-bornemisza:
  texto:
    - "Das Museo Thyssen-Bornemisza vervollständigt zusammen mit dem Prado und dem Reina Sofía den sogenannten Paseo del Arte in Madrid. Seine Sammlung umfasst acht Jahrhunderte Malerei, von der Gotik bis zur Avantgarde des 20. Jahrhunderts, und lässt sich mit einem chronologischen, sehr leicht nachvollziehbaren Rundgang genießen."
    - "Es vereint Werke großer Meister, von italienischen und flämischen Primitiven bis zu Impressionisten, Expressionisten und Künstlern des 20. Jahrhunderts, in einem Gebäude, das früher der Palacio de Villahermosa war. Es ist ein überschaubares Museum, dessen Besuch sich leichter bewältigen lässt als der des Prado."
    - "Wenn du wenig Zeit hast, ist es eine gute Option für einen zweistündigen Besuch. Der Rundgang beginnt im obersten Stock mit der ältesten Kunst und führt nach unten bis in die Gegenwart. Nutze die Gelegenheit, dir die Wechselausstellungen anzusehen und danach im Retiro-Park spazieren zu gehen. Informiere dich für Öffnungszeiten, Tickets und Zugangsbedingungen, die sich ändern können, immer auf der offiziellen Website."
  faq:
    - p: "Welche Art von Kunst gibt es im Thyssen?"
      r: "Europäische Malerei aus acht Jahrhunderten, von der Gotik bis zur Avantgarde des 20. Jahrhunderts, mit Werken alter Meister, Impressionisten und Expressionisten."
    - p: "Wie viel Zeit braucht man?"
      r: "Zwei bis drei Stunden reichen aus, um es in Ruhe zu besichtigen."
    - p: "Besichtigt man es der Reihe nach?"
      r: "Ja, der Rundgang ist chronologisch, vom obersten Stock (alte Kunst) bis zum untersten (moderne Kunst)."
    - p: "Muss man ein Ticket reservieren?"
      r: "Es wird empfohlen, das Ticket in der Hochsaison und an Wochenenden im Voraus zu kaufen."
    - p: "Wann ist der Eintritt kostenlos?"
      r: "Das Museum bietet Zeitfenster mit kostenlosem oder ermäßigtem Eintritt. Informiere dich für Öffnungszeiten, Tickets und Zugangsbedingungen, die sich ändern können, immer auf der offiziellen Website."
    - p: "Ist es ein guter Plan mit Kindern?"
      r: "Ja, mit einem kurzen Besuch. Das Museum bietet Aktivitäten und Rundgänge für Familien an."
palacio-real-madrid:
  texto:
    - "Der Königspalast von Madrid (Palacio Real) ist die offizielle Residenz des Königs, wird aber nur für Staatsakte genutzt. Er ist flächenmäßig der größte Königspalast Westeuropas und lässt sich fast das ganze Jahr über besichtigen, außer bei offiziellen Veranstaltungen."
    - "Die Besichtigung führt durch Säle mit Wandteppichen, Fresken und Kristalllüstern, wie den Thronsaal und den Galaspeisesaal, außerdem durch die Königliche Waffenkammer (Real Armería) und die Königliche Apotheke (Real Farmacia). Es gibt Sammlungen von Streichinstrumenten, Uhren und Möbeln aus dem 18. und 19. Jahrhundert."
    - "Prüfe vorab, ob der Palast an dem Tag geöffnet ist, an dem du ihn besuchen möchtest, denn er wird bei offiziellen Veranstaltungen geschlossen. Reserviere in der Hochsaison das Ticket, um Warteschlangen zu vermeiden, und plane ein bis zwei Stunden für den Besuch ein. Die Jardines de Sabatini und der Campo del Moro direkt neben dem Palast sind eine schöne Ergänzung. Informiere dich für Öffnungszeiten, Tickets und Zugangsbedingungen, die sich ändern können, immer auf der offiziellen Website."
  faq:
    - p: "Wohnt der König im Königspalast?"
      r: "Nein, die Residenz der königlichen Familie befindet sich an einem anderen Ort. Der Palast wird für offizielle Veranstaltungen und Zeremonien genutzt."
    - p: "Was kann man besichtigen?"
      r: "Prunksäle wie den Thronsaal und den Galaspeisesaal, die Königliche Waffenkammer, die Königliche Apotheke sowie verschiedene Kunst- und Möbelsammlungen."
    - p: "Wie viel Zeit braucht man?"
      r: "Ein bis zwei Stunden für die vollständige Besichtigung."
    - p: "Kann er geschlossen sein?"
      r: "Ja, der Palast schließt bei offiziellen Veranstaltungen. Prüfe die Website, bevor du hingehst."
    - p: "Muss man ein Ticket reservieren?"
      r: "In der Hochsaison wird empfohlen, im Voraus zu reservieren."
    - p: "Was kann man in der Nähe noch sehen?"
      r: "Die Kathedrale La Almudena, die Plaza de Oriente, die Jardines de Sabatini und den Campo del Moro."
parque-buen-retiro:
  texto:
    - "Der Parque del Buen Retiro ist der große Park von Madrid und einer der beliebtesten Orte der Madrilenen. Zusammen mit dem Paseo del Prado zum UNESCO-Welterbe erklärt, ist er eine Oase aus Gärten, baumbestandenen Wegen, Teichen und Denkmälern mitten im Zentrum."
    - "Zu seinen bekanntesten Ecken zählen der Große Teich (Estanque Grande) mit Ruderbooten und dem Denkmal für Alfons XII., der Palacio de Cristal, der Palacio de Velázquez und der Rosengarten (La Rosaleda). Außerdem gibt es einen Skulpturenweg und mehrere ruhige Winkel, wie den Bosque del Recuerdo."
    - "Er ist perfekt zum Spazierengehen, für Sport, zum Lesen oder einfach zum Ausruhen. Der Park öffnet schon früh am Morgen, und am besten besucht man ihn vormittags oder bei Sonnenuntergang. Im Frühling mit dem Rosengarten und im Herbst mit den bunten Farben ist er besonders schön. Jedes Jahr findet hier gegen Ende des Frühlings die Buchmesse (Feria del Libro) statt."
  faq:
    - p: "Was kann man im Retiro sehen?"
      r: "Den Großen Teich mit Booten, den Palacio de Cristal, den Palacio de Velázquez, den Rosengarten und den Bosque del Recuerdo."
    - p: "Ist er kostenlos?"
      r: "Der Zugang zum Park ist frei. Einige Aktivitäten, wie das Mieten eines Bootes, sind kostenpflichtig."
    - p: "Kann man Boote mieten?"
      r: "Ja, auf dem Großen Teich, normalerweise innerhalb bestimmter Öffnungszeiten und Saisonzeiten. Informiere dich über die Bedingungen."
    - p: "Wann ist die beste Zeit für einen Besuch?"
      r: "Vormittags oder bei Sonnenuntergang. Im Frühling und Herbst ist der Park besonders schön."
    - p: "Ist es ein guter Plan mit Kindern?"
      r: "Ja, es gibt Spielplätze, Boote, in manchen Zeiträumen Puppentheater und viel Platz zum Rennen."
    - p: "Ist er Welterbe?"
      r: "Ja, er gehört zur Kulturlandschaft Paseo del Prado und Retiro, Landschaft der Künste und der Wissenschaften, die von der UNESCO zum Welterbe erklärt wurde."
sagrada-familia:
  texto:
    - "Die Sagrada Família ist das unvollendete Meisterwerk von Antoni Gaudí und das meistbesuchte Monument Barcelonas. Die Bauarbeiten begannen 1882 und dauern bis heute an, größtenteils finanziert durch die Eintrittsgelder der Besucher. Sie gehört zu den Werken Gaudís, die von der UNESCO zum Welterbe erklärt wurden."
    - "Die Geburtsfassade und die Passionsfassade erzählen das Leben Jesu mit jeweils sehr unterschiedlicher Bildhauerei. Am überraschendsten ist das Innere: Säulen, die sich wie Bäume verzweigen, Gewölbe in natürlichen Formen und farbiges Licht, das sich im Laufe des Tages je nach Uhrzeit und Ausrichtung der Glasfenster verändert."
    - "Die Tickets werden für einen festen Tag und eine feste Uhrzeit verkauft und sind lange im Voraus ausverkauft, daher solltest du online buchen, bevor du losreist. Plane für den Besuch anderthalb bis zwei Stunden ein, mit oder ohne Audioguide, und überlege, ob du auf einen der Türme steigst, falls noch Plätze frei sind. Vorsicht vor Wiederverkäufern in den Warteschlangen rund um die Kirche. Informiere dich für Öffnungszeiten, Tickets und Zugangsbedingungen, die sich ändern können, immer auf der offiziellen Website."
  faq:
    - p: "Warum ist sie immer noch nicht fertig?"
      r: "Weil die Bauarbeiten 1882 begannen und hauptsächlich durch Eintrittsgelder und Spenden finanziert werden, bei einem sehr komplexen Projekt. Den aktuellen Stand der Arbeiten findest du auf der offiziellen Website."
    - p: "Muss man ein Ticket reservieren?"
      r: "Ja, am besten reservierst du online im Voraus: Die Tickets werden mit Uhrzeit verkauft und sind vor allem in der Hochsaison schnell ausverkauft."
    - p: "Wie viel Zeit braucht man?"
      r: "Anderthalb bis zwei Stunden, mehr, wenn du auf einen Turm steigst."
    - p: "Kann man auf die Türme steigen?"
      r: "Ja, es gibt Tickets mit Turmaufstieg, mit begrenzter Platzzahl. Informiere dich über die Bedingungen auf der Website."
    - p: "Was sollte man im Inneren sehen?"
      r: "Die baumförmigen Säulen, die Gewölbe und die farbigen Glasfenster, deren Licht sich im Laufe des Tages verändert."
    - p: "Ist sie Welterbe?"
      r: "Ja, sie gehört zu den Werken von Antoni Gaudí, die von der UNESCO zum Welterbe erklärt wurden."
park-guell:
  texto:
    - "Der Park Güell ist Gaudís modernistischer Park, in dem Architektur und Natur auf einem Hügel mit Blick über ganz Barcelona miteinander verschmelzen. Er gehört zu den Werken Gaudís, die von der UNESCO zum Welterbe erklärt wurden, und ist einer der meistfotografierten Orte der Stadt."
    - "Am berühmtesten ist die Zona Monumental: der große Platz mit der geschwungenen Bank, die mit Trencadís-Mosaik verkleidet ist, dem bunten Salamander, den schrägen Säulen des Säulengangs und den Gebäuden am Eingang. Der Rest des Parks besteht aus frei zugänglichen Wegen, Gärten und Aussichtspunkten."
    - "Die Zona Monumental hat eine begrenzte Besucherzahl und Eintritt mit festem Zeitfenster, daher solltest du im Voraus reservieren. Meide die Mittagszeit und komm früh am Morgen oder am späten Nachmittag, wenn weniger los ist und das Licht schöner ist. Trage bequeme Schuhe, denn es gibt Steigungen, und nimm Wasser mit. Informiere dich für Öffnungszeiten, Tickets und Zugangsbedingungen, die sich ändern können, immer auf der offiziellen Website."
  faq:
    - p: "Ist der Park Güell kostenlos?"
      r: "Ein Teil des Parks ist frei zugänglich, aber für die Zona Monumental mit der geschwungenen Bank ist ein Ticket mit festem Zeitfenster nötig. Informiere dich für Öffnungszeiten, Tickets und Zugangsbedingungen, die sich ändern können, immer auf der offiziellen Website."
    - p: "Muss man reservieren?"
      r: "Ja, das Ticket für die Zona Monumental solltest du im Voraus reservieren, denn die Besucherzahl ist begrenzt."
    - p: "Wie viel Zeit braucht man?"
      r: "Anderthalb bis zwei Stunden, mehr, wenn du den frei zugänglichen Bereich des Parks erkundest."
    - p: "Wann ist die beste Zeit für einen Besuch?"
      r: "Früh am Morgen oder am späten Nachmittag, wenn weniger los ist und das Licht besser ist."
    - p: "Wie kommt man hin?"
      r: "Mit U-Bahn und Bus oder zu Fuß von den nahe gelegenen Haltestellen. Es gibt Steigungen, also trage bequeme Schuhe."
    - p: "Ist es ein guter Plan mit Kindern?"
      r: "Ja, auch wenn es Steigungen und Treppen gibt. Die Mosaike und der Salamander gefallen den Kleinen meist."
casa-batllo:
  texto:
    - "Das Casa Batlló ist eines der spektakulärsten Häuser Gaudís, mitten am Passeig de Gràcia. Gaudí baute es zwischen 1904 und 1906 um und schuf eine Fassade mit Farben und wellenförmigen Formen, mit Balkonen, die wie Masken aussehen, und einem Dach, das an den Rücken eines Drachen erinnert."
    - "Im Inneren wirkt alles wie Natur: der Lichthof mit blauen Fliesen, die je nach Höhe ihren Farbton ändern, der Hauptsalon mit seinen großen Fenstern, die Treppe und der Dachboden mit Kettenlinienbögen. Es ist ein Haus, in dem es fast keine geraden Linien gibt und jedes Detail durchdacht ist."
    - "Die Besichtigung erfolgt mit Audioguide und umfasst in der Regel Augmented Reality. Reserviere im Voraus, denn in der Hochsaison sind die Tickets schnell ausverkauft, und plane anderthalb Stunden ein. Das Casa Batlló liegt an dem Abschnitt, der als Manzana de la Discordia (Block der Zwietracht) bekannt ist, neben dem Casa Amatller und dem Casa Lleó Morera. Informiere dich für Öffnungszeiten, Tickets und Zugangsbedingungen, die sich ändern können, immer auf der offiziellen Website."
  faq:
    - p: "Wer hat das Casa Batlló gebaut?"
      r: "Antoni Gaudí baute es zwischen 1904 und 1906 für die Familie Batlló um."
    - p: "Was ist die Manzana de la Discordia?"
      r: "Der Abschnitt des Passeig de Gràcia, an dem modernistische Gebäude verschiedener Architekten nebeneinanderstehen, darunter das Casa Batlló, das Casa Amatller und das Casa Lleó Morera."
    - p: "Muss man ein Ticket reservieren?"
      r: "Ja, am besten reservierst du im Voraus, vor allem in der Hochsaison."
    - p: "Wie lange dauert die Besichtigung?"
      r: "Eine bis anderthalb Stunden, mit Audioguide."
    - p: "Was sollte man nicht verpassen?"
      r: "Die Fassade, den Lichthof mit den blauen Fliesen, den Hauptsalon und die Dachterrasse mit den Schornsteinen."
    - p: "Ist es Welterbe?"
      r: "Ja, es gehört zu den Werken Gaudís, die von der UNESCO zum Welterbe erklärt wurden."
ciudad-artes-ciencias:
  texto:
    - "Die Stadt der Künste und Wissenschaften (Ciudad de las Artes y las Ciencias) ist der große Kultur- und Freizeitkomplex Valencias, eine Gruppe futuristischer Gebäude von Santiago Calatrava und Félix Candela, die zu einem der Wahrzeichen der Stadt geworden ist. Sie liegt im ehemaligen Flussbett des Turia, das heute ein großer Garten ist."
    - "Sie vereint mehrere Einrichtungen: das Hemisfèric mit seinem IMAX-Kino und Planetarium in Form eines Auges, das Museu de les Ciències Príncipe Felipe, das Oceanogràfic, eines der größten Aquarien Europas, den Palau de les Arts Reina Sofía, der der Oper gewidmet ist, die Ágora und den Umbracle, einen Spazierweg mit Gärten. Jede Einrichtung wird einzeln besichtigt, und es gibt Kombitickets."
    - "Man kann zwar kostenlos außen herumspazieren, für das Innere der Gebäude ist jedoch ein Ticket nötig. Wenn du mit Kindern unterwegs bist, sind das Oceanogràfic und das Wissenschaftsmuseum am empfehlenswertesten. Komm mit dem Fahrrad oder zu Fuß durch den Turia-Garten und meide die heißesten Stunden. Informiere dich für Öffnungszeiten, Tickets und Zugangsbedingungen, die sich ändern können, immer auf der offiziellen Website."
  faq:
    - p: "Was umfasst die Stadt der Künste und Wissenschaften?"
      r: "Das Hemisfèric, das Museu de les Ciències, das Oceanogràfic, den Palau de les Arts, die Ágora und den Umbracle."
    - p: "Kann man kostenlos hinein?"
      r: "Man kann außen herumspazieren, für den Zugang zu den Gebäuden ist jedoch ein Ticket nötig. Informiere dich für Öffnungszeiten, Tickets und Zugangsbedingungen, die sich ändern können, immer auf der offiziellen Website."
    - p: "Was sieht man, wenn man wenig Zeit hat?"
      r: "Einen Spaziergang außen, um die Architektur zu sehen, und, wenn die Zeit reicht, das Oceanogràfic oder das Wissenschaftsmuseum."
    - p: "Ist es ein guter Plan mit Kindern?"
      r: "Ja, das Oceanogràfic und das Wissenschaftsmuseum sind sehr auf Familien ausgerichtet."
    - p: "Wie kommt man hin?"
      r: "Mit U-Bahn, Straßenbahn oder Bus oder zu Fuß und mit dem Fahrrad durch den Turia-Garten."
    - p: "Gibt es Kombitickets?"
      r: "Ja, es gibt Kombitickets für mehrere Einrichtungen. Informiere dich über die Optionen auf der offiziellen Website."
real-alcazar-sevilla:
  texto:
    - "Der Real Alcázar von Sevilla ist ein befestigter Palast muslimischen Ursprungs, der im Laufe der Jahrhunderte erweitert wurde, und eines der besten Beispiele für den Mudéjar-Stil. Er gehört gemeinsam mit der Kathedrale und dem Archivo de Indias zum Welterbe und ist weiterhin offizielle Residenz des Königs, wenn dieser die Stadt besucht."
    - "Das Herz der Anlage ist der Palast Peters I. aus dem 14. Jahrhundert, mit dem Patio de las Doncellas, dem Salón de Embajadores mit seiner goldenen Kuppel und äußerst feinen Stuckarbeiten. Rundherum erstrecken sich Gärten mit Teichen, Brunnen, Orangenbäumen und schattigen Winkeln. Er war Schauplatz von Serien und Filmen, darunter Game of Thrones."
    - "Reserviere das Ticket im Voraus, denn es ist schnell ausverkauft, vor allem im Frühling und Herbst. Plane zwei bis drei Stunden für den Besuch ein und meide im Sommer die heißesten Stunden. Verbinde den Alcázar mit der Kathedrale, der Giralda und dem Viertel Santa Cruz, die direkt nebenan liegen. Informiere dich für Öffnungszeiten, Tickets und Zugangsbedingungen, die sich ändern können, immer auf der offiziellen Website."
  faq:
    - p: "Was ist der Real Alcázar von Sevilla?"
      r: "Ein befestigter Palast muslimischen Ursprungs, in christlicher Zeit erweitert, mit dem Mudéjar-Palast Peters I. als Herzstück."
    - p: "Muss man ein Ticket reservieren?"
      r: "Ja, am besten reservierst du im Voraus, vor allem in der Hochsaison."
    - p: "Wie viel Zeit braucht man?"
      r: "Zwei bis drei Stunden, für Paläste und Gärten zusammen."
    - p: "Was sollte man nicht verpassen?"
      r: "Den Patio de las Doncellas, den Salón de Embajadores, den Palast Karls V. und die Gärten."
    - p: "Ist er weiterhin Königsresidenz?"
      r: "Ja, er gehört zu den offiziellen Residenzen des Königs und wird für offizielle Veranstaltungen genutzt."
    - p: "Ist er Welterbe?"
      r: "Ja, gemeinsam mit der Kathedrale und dem Archivo General de Indias, seit 1987."
plaza-mayor-madrid:
  texto:
    - "Die Plaza Mayor ist einer der bekanntesten Plätze Madrids. Es ist ein großer, rechteckiger und geschlossener Platz, umgeben von Arkaden und mehrstöckigen Gebäuden, der Anfang des 17. Jahrhunderts erbaut wurde und jahrhundertelang Schauplatz von Festen, Märkten und öffentlichen Veranstaltungen war."
    - "In der Mitte steht die Statue von Philipp III., und an einer der Seiten die Casa de la Panadería mit ihren Fassadenfresken. Unter den Arkaden gibt es Geschäfte für Souvenirs, Briefmarken und Münzen, und die Terrassen des Platzes sind ein klassischer Ort für einen Drink, allerdings teurer als in den umliegenden Straßen."
    - "Im Winter wird der Weihnachtsmarkt aufgebaut, mit Ständen für Krippen und Weihnachtsschmuck, und das ganze Jahr über gibt es Konzerte und Veranstaltungen. Zum Essen gehst du besser in die nahen Gassen, wo es Calamari-Brötchen und die traditionellsten Tavernen gibt. Am frühen Morgen wirkt der Platz deutlich ruhiger."
  faq:
    - p: "Was kann man auf der Plaza Mayor sehen?"
      r: "Die Statue von Philipp III., die Casa de la Panadería mit ihren Fresken, die Arkaden und die Atmosphäre auf den Terrassen."
    - p: "Gibt es einen Weihnachtsmarkt?"
      r: "Ja, im Winter wird der Weihnachtsmarkt aufgebaut, mit Ständen für Krippen und Weihnachtsschmuck. Informiere dich jedes Jahr über die Termine."
    - p: "Ist es besser, direkt am Platz zu essen?"
      r: "Die Terrassen am Platz sind teurer. In den Gassen der Umgebung gibt es günstigere Tavernen und Calamari-Brötchen."
    - p: "Wann ist der beste Zeitpunkt für einen Besuch?"
      r: "Am frühen Morgen oder bei Sonnenuntergang, um die Zeiten mit dem größten Andrang zu vermeiden."
    - p: "Was kann man in der Nähe noch sehen?"
      r: "Den Mercado de San Miguel, die Puerta del Sol, den Königspalast und das Viertel La Latina."
puerta-sol-madrid:
  texto:
    - "Die Puerta del Sol ist das Herz Madrids und einer der bekanntesten Orte Spaniens. Hier befindet sich der Kilometer null der spanischen Fernstraßen, der durch eine Platte im Boden markiert ist, sowie die Uhr der Real Casa de Correos, die die Glockenschläge in der Silvesternacht anzeigt."
    - "Der Platz ist ein beliebter Treffpunkt und eine stark befahrene Straßenkreuzung. Dort stehen die Statue des Bären und des Erdbeerbaums, das Wahrzeichen der Stadt, das Gebäude der Real Casa de Correos, heute Sitz der Regionalregierung, und die Leuchtreklame von Tío Pepe, eine der meistfotografierten."
    - "Es ist ein kurzer Stopp von fünfzehn oder zwanzig Minuten, der sich gut mit einem Spaziergang über die Plaza Mayor, die Calle Mayor oder die Fußgängerstraßen der Innenstadt verbinden lässt. Vorsicht vor Taschendieben in belebten Bereichen und vor den üblichen Betrügereien in Touristengegenden. An Silvester füllt sich der Platz mit Menschen, die die Glockenschläge miterleben wollen."
  faq:
    - p: "Was ist der Kilometer null?"
      r: "Eine Platte im Boden vor der Real Casa de Correos, die den Ausgangspunkt der spanischen Fernstraßen markiert."
    - p: "Welche Uhr ist die der Glockenschläge?"
      r: "Die der Real Casa de Correos an der Puerta del Sol, die die zwölf Glockenschläge der Silvesternacht anzeigt."
    - p: "Was gibt es auf dem Platz sonst noch zu sehen?"
      r: "Die Statue des Bären und des Erdbeerbaums, die Leuchtreklame von Tío Pepe und die Real Casa de Correos."
    - p: "Wie viel Zeit braucht man?"
      r: "Etwa fünfzehn bis zwanzig Minuten für die wichtigsten Punkte, länger, wenn du dich hinsetzt und die Atmosphäre beobachtest."
    - p: "Gibt es Gefahr durch Taschendiebe?"
      r: "Es ist ein sehr belebter Bereich, und Taschendiebe sind an Orten mit viel Andrang aktiv. Pass auf deine Sachen auf."
    - p: "Was gibt es in der Nähe?"
      r: "Die Plaza Mayor, der Mercado de San Miguel, die Calle Preciados und der Königspalast sind nur wenige Gehminuten entfernt."
mercado-san-miguel:
  texto:
    - "Der Mercado de San Miguel ist eine überdachte Markthalle aus Eisen und Glas, die 1916 eröffnet wurde und direkt an der Plaza Mayor liegt. Heute ist er ein gastronomischer Treffpunkt, an dem man im Stehen oder Sitzen alles Mögliche naschen kann, zwischen Ständen mit frischen Produkten, Tapas, Weinen und Konserven."
    - "Er bietet eine große Vielfalt: Schinken, Käse, Meeresfrüchte, Tortillas, Kroketten, Pinchos, Süßes und Getränke aller Art. Er ist bei Touristen und Madrilenen sehr beliebt und bietet eine schnelle Möglichkeit, an einem einzigen Ort viele Dinge zu probieren, auch wenn die Preise höher sind als in den Tavernen der Gegend."
    - "Mittags und an den Wochenenden ist es sehr voll, daher lohnt es sich, früh am Tag oder am Nachmittag zu kommen. Wenn du es günstiger möchtest, kombiniere einen Halt hier mit ein paar Tapas in den Tavernen von La Latina. Informiere dich für Öffnungszeiten, Tickets und Zugangsbedingungen, die sich ändern, immer auf der offiziellen Website."
  faq:
    - p: "Was kann man essen?"
      r: "Schinken, Käse, Meeresfrüchte, Tortillas, Kroketten, Pinchos, Süßes und Wein, unter anderem."
    - p: "Ist es teuer?"
      r: "Die Preise sind in der Regel höher als in den Tavernen der Gegend, da es ein sehr touristischer Ort ist."
    - p: "Wann ist der beste Zeitpunkt für einen Besuch?"
      r: "Früh am Tag oder am Nachmittag. Mittags und an den Wochenenden ist es voll."
    - p: "Kann man reservieren?"
      r: "In der Regel nicht, es ist ein frei zugänglicher Markt. Einige Stände haben Tische."
    - p: "Was kann man in der Nähe noch sehen?"
      r: "Die Plaza Mayor, die Puerta del Sol und das Viertel La Latina."
casa-mila-pedrera:
  texto:
    - "Die Casa Milà, bekannt als La Pedrera, ist ein weiteres der großen Werke Gaudís in Barcelona. Sie wurde zwischen 1906 und 1912 als Wohnhaus für die Familie Milà erbaut, und ihre wellenförmige Steinfassade, fast ohne gerade Linien, brachte ihr den Spitznamen Steinbruch ein."
    - "Am beeindruckendsten sind die Dachterrasse mit ihren Schornsteinen und Lüftungsschächten, die wie gemeißelte Krieger aussehen und einen Blick über die Stadt bieten, sowie der Dachboden mit Backsteinbögen, die eine rippenartige Struktur bilden. Man kann auch eine rekonstruierte Wohnung besichtigen, um zu sehen, wie man Anfang des 20. Jahrhunderts lebte."
    - "Reserviere rechtzeitig im Voraus, denn die Tickets sind in der Hochsaison ausverkauft, und plane anderthalb Stunden für den Besuch ein. La Pedrera bietet außerdem Nachtbesichtigungen und kulturelle Veranstaltungen an. Sie gehört zu den Werken Gaudís, die von der UNESCO zum Weltkulturerbe erklärt wurden. Informiere dich für Öffnungszeiten, Tickets und Zugangsbedingungen, die sich ändern, immer auf der offiziellen Website."
  faq:
    - p: "Warum heißt sie La Pedrera?"
      r: "Wegen ihrer wellenförmigen Steinfassade, die an einen Steinbruch erinnert, ein Spitzname, den sie beim Bau erhielt."
    - p: "Was kann man in La Pedrera sehen?"
      r: "Die Dachterrasse mit den Schornsteinen, den Dachboden mit seinen Bögen und eine rekonstruierte Wohnung aus dem frühen 20. Jahrhundert."
    - p: "Muss man ein Ticket reservieren?"
      r: "Ja, es empfiehlt sich, rechtzeitig im Voraus zu reservieren, vor allem in der Hochsaison."
    - p: "Wie lange dauert der Besuch?"
      r: "Ungefähr anderthalb Stunden."
    - p: "Gibt es Nachtbesichtigungen?"
      r: "La Pedrera bietet Besichtigungen und Veranstaltungen zu besonderen Zeiten an. Informiere dich über das Angebot auf der offiziellen Website."
    - p: "Gehört sie zum Weltkulturerbe?"
      r: "Ja, sie gehört zu den Werken Gaudís, die von der UNESCO zum Weltkulturerbe erklärt wurden."
museo-picasso-barcelona:
  texto:
    - "Das Museu Picasso in Barcelona befindet sich in fünf mittelalterlichen Palästen in der Carrer de Montcada, im Viertel La Ribera. Seine Sammlung konzentriert sich auf die Jugend des Künstlers und seine Beziehung zur Stadt und ist eine der besten, um zu verstehen, wie sich Picasso seit seinen frühen Jahren entwickelt hat."
    - "Es vereint Werke aus seiner Ausbildungszeit, seiner Blauen Periode und anderen Schaffensphasen, vor allem aber die vollständige Serie der Meninas, eine Neuinterpretation des Gemäldes von Velázquez, die Picasso 1957 malte. Der Rundgang ermöglicht es, die Entwicklung des Künstlers vor seinem Ruhm nachzuvollziehen."
    - "Reserviere rechtzeitig im Voraus, denn die Tickets sind in der Hochsaison ausverkauft, und plane anderthalb Stunden für den Besuch ein. Es ist ein kleines, gut organisiertes Museum, ideal in Kombination mit einem Spaziergang durch das Born-Viertel und die Basilika Santa Maria del Mar. Informiere dich für Öffnungszeiten, Tickets und Zugangsbedingungen, die sich ändern, immer auf der offiziellen Website."
  faq:
    - p: "Was gibt es im Museu Picasso?"
      r: "Jugendwerke und Werke aus verschiedenen Schaffensphasen Picassos sowie die vollständige Serie der Meninas."
    - p: "Wo befindet es sich?"
      r: "In der Carrer de Montcada, im Viertel La Ribera in Barcelona, in fünf mittelalterlichen Palästen."
    - p: "Muss man ein Ticket reservieren?"
      r: "Ja, es empfiehlt sich, rechtzeitig im Voraus zu reservieren, vor allem in der Hochsaison."
    - p: "Wie lange dauert der Besuch?"
      r: "Ungefähr anderthalb Stunden."
    - p: "Was kann man in der Nähe noch sehen?"
      r: "Die Basilika Santa Maria del Mar, das Born-Viertel und die Kathedrale."
boqueria:
  texto:
    - "Die Boqueria, offiziell Mercat de Sant Josep, ist der berühmteste Markt Barcelonas und einer der bekanntesten Europas. Sie liegt an der Rambla und vereint Stände mit Obst, Gemüse, Fleisch, Fisch, Wurstwaren, Süßigkeiten und jeder Menge Farbe."
    - "Neben dem Einkauf frischer Produkte kann man in den Bars des Marktes essen und naschen, die Gerichte der katalanischen Küche wie Eier mit Pilzen, Calamari oder Tortilla servieren. Die Stände mit Obst und frisch gepressten Säften befinden sich am Eingang, die traditionelleren im Inneren."
    - "Es ist sehr voll, vor allem mittags, und es ist ein Gebiet mit Taschendieben, also pass auf deine Sachen auf. Für authentischeres und günstigeres Essen meide die Stände am Eingang und geh tiefer ins Innere oder in die nahen Straßen. Komm früh am Morgen, wenn du den Menschenmassen aus dem Weg gehen willst. Informiere dich für Öffnungszeiten, Tickets und Zugangsbedingungen, die sich ändern, immer auf der offiziellen Website."
  faq:
    - p: "Was ist die Boqueria?"
      r: "Der berühmteste Markt Barcelonas, offiziell Mercat de Sant Josep, an der Rambla gelegen."
    - p: "Was kann man essen?"
      r: "Tapas und Gerichte der katalanischen Küche in den Bars des Marktes, dazu Obst, Säfte, Wurstwaren und Süßigkeiten."
    - p: "Wann ist der beste Zeitpunkt für einen Besuch?"
      r: "Früh am Morgen, bevor es voll wird."
    - p: "Ist es teuer?"
      r: "Die Stände am Eingang sind die touristischsten und teuersten. Die im Inneren und in den nahen Straßen sind in der Regel günstiger."
    - p: "Gibt es Gefahr durch Taschendiebe?"
      r: "Ja, es ist ein sehr belebter Bereich. Pass auf deine Sachen auf."
giralda:
  texto:
    - "Die Giralda ist das Wahrzeichen Sevillas. Sie war das Minarett der alten almohadischen Moschee, im 12. Jahrhundert erbaut, dem die Christen im 16. Jahrhundert einen Glockenturm im Renaissancestil hinzufügten. Heute gehört sie zur Kathedrale, die zusammen mit dem Alcázar und dem Indienarchiv zum Weltkulturerbe zählt."
    - "Der Aufstieg auf die Giralda ist eines der beliebtesten Erlebnisse der Stadt. Statt Treppen hat sie Rampen, die der Überlieferung nach den Aufstieg zu Pferd ermöglichten, und von oben sieht man ganz Sevilla, mit den Dächern, den Höfen der Kathedrale und dem Fluss. Der Eintritt zum Turm schließt in der Regel den Besuch der Kathedrale ein."
    - "Kaufe die Tickets im Voraus und meide die heißesten Stunden. In der Kathedrale kannst du auch das Grabmal von Christoph Kolumbus und den Hauptaltar sehen. Plane anderthalb Stunden für das gesamte Ensemble ein. Informiere dich für Öffnungszeiten, Tickets und Zugangsbedingungen, die sich ändern, immer auf der offiziellen Website."
  faq:
    - p: "Was ist die Giralda?"
      r: "Der Turm der Kathedrale von Sevilla, das ehemalige Minarett der almohadischen Moschee aus dem 12. Jahrhundert, dem später ein Glockenturm im Renaissancestil hinzugefügt wurde."
    - p: "Kann man hinaufsteigen?"
      r: "Ja, über Rampen statt Treppen. Von oben hat man einen Blick über die ganze Stadt."
    - p: "Muss man bezahlen?"
      r: "Der Eintritt zur Kathedrale und zur Giralda ist kostenpflichtig, mit Sonderkonditionen zu bestimmten Zeiten. Informiere dich für Öffnungszeiten, Tickets und Zugangsbedingungen, die sich ändern, immer auf der offiziellen Website."
    - p: "Was kann man in der Kathedrale sonst noch sehen?"
      r: "Das Grabmal von Kolumbus, den Hauptaltar und den Orangenhof."
    - p: "Wie viel Zeit braucht man?"
      r: "Etwa anderthalb Stunden für Kathedrale und Turm."
torre-oro:
  texto:
    - "Der Torre del Oro ist ein vorgelagerter Wehrturm almohadischen Ursprungs, der Anfang des 13. Jahrhunderts am Ufer des Guadalquivir als Teil der Stadtbefestigung errichtet wurde. Sein Name wird den goldenen Reflexen seiner Kacheln auf dem Wasser zugeschrieben oder dem Gold aus Amerika, das darin aufbewahrt wurde."
    - "Heute beherbergt er ein kleines Marinemuseum mit Modellen, Instrumenten und Dokumenten zur Geschichte des Hafens von Sevilla, und von seiner Dachterrasse sieht man den Fluss und die Altstadt. Der Besuch ist kurz, etwa 20 bis 30 Minuten, und lässt sich gut mit einem Spaziergang auf dem Paseo de Colón verbinden."
    - "Er ist eines der typischsten Bilder Sevillas und besonders schön bei Sonnenuntergang, wenn das Licht auf dem Fluss liegt. Nutze die Gelegenheit, um die Triana-Brücke zu überqueren oder am Ufer entlangzuspazieren. Informiere dich für Öffnungszeiten, Tickets und Zugangsbedingungen, die sich ändern, immer auf der offiziellen Website."
  faq:
    - p: "Was ist der Torre del Oro?"
      r: "Ein Wehrturm almohadischen Ursprungs aus dem 13. Jahrhundert am Ufer des Guadalquivir."
    - p: "Warum heißt er so?"
      r: "Es wird den goldenen Reflexen seiner Kacheln auf dem Wasser zugeschrieben oder dem Gold, das aus Amerika kam."
    - p: "Kann man ihn besichtigen?"
      r: "Ja, er beherbergt ein Marinemuseum. Informiere dich über Öffnungszeiten und Bedingungen."
    - p: "Wie viel Zeit braucht man?"
      r: "Etwa 20 bis 30 Minuten."
    - p: "Wann ist der beste Zeitpunkt, ihn zu sehen?"
      r: "Bei Sonnenuntergang, wenn das im Fluss reflektierte Licht mehr Farbe gibt."
plaza-espana-sevilla:
  texto:
    - "Die Plaza de España ist einer der schönsten Plätze Spaniens. Von Aníbal González für die Iberoamerikanische Ausstellung von 1929 entworfen, hat sie die Form eines Halbkreises, mit einem großen Gebäude aus Backstein und Keramik, einem Turm an jedem Ende und einem Kanal mit Brücken."
    - "Entlang des Platzes stehen Bänke aus Azulejos, die die spanischen Provinzen darstellen, jeweils mit ihrem Wappen und einer historischen Szene. Man kann durch die Arkaden spazieren, die Brücken überqueren und ein Boot auf dem Kanal mieten. Der Platz war Kulisse für Filme, zum Beispiel für einen der Star-Wars-Reihe."
    - "Der Eintritt ist frei, und der Platz liegt direkt neben dem Park María Luisa. Geh früh am Morgen oder bei Sonnenuntergang, wenn weniger Leute da sind und das Licht besser ist, und meide die heißesten Stunden. Informiere dich für Öffnungszeiten, Tickets und Zugangsbedingungen, die sich ändern, immer auf der offiziellen Website."
  faq:
    - p: "Was ist die Plaza de España?"
      r: "Ein großer halbkreisförmiger Platz, erbaut für die Iberoamerikanische Ausstellung von 1929, ein Werk von Aníbal González."
    - p: "Muss man Eintritt zahlen?"
      r: "Nein, der Zugang ist frei. Die Boote auf dem Kanal sind dagegen kostenpflichtig."
    - p: "Was gibt es zu sehen?"
      r: "Die Azulejo-Bänke der Provinzen, die Brücken, die Türme und den Kanal."
    - p: "Wann ist der beste Zeitpunkt für einen Besuch?"
      r: "Früh am Morgen oder bei Sonnenuntergang, um Menschenmassen und Hitze zu vermeiden."
    - p: "Was gibt es in der Nähe?"
      r: "Der Park María Luisa und das Viertel Santa Cruz."
universidad-salamanca:
  texto:
    - "Die Universität Salamanca ist die älteste noch in Betrieb befindliche Universität Spaniens. Sie wurde 1218 gegründet und war jahrhundertelang eines der großen Wissenszentren Europas, mit Persönlichkeiten wie Fray Luis de León oder Miguel de Unamuno, die mit ihren Hörsälen verbunden sind."
    - "Das historische Ensemble gruppiert sich um den Patio de Escuelas. Die plateareske Fassade der Escuelas Mayores ist eines der erkennbarsten Bilder der Stadt, und in ihr versteckt sich ein kleiner Frosch auf einem Totenkopf, den Besucher traditionell suchen. Im Inneren besichtigt man die historischen Hörsäle und die Alte Bibliothek mit ihren wertvollen Beständen."
    - "Der Herbst ist ein guter Zeitpunkt für einen Besuch: Die Alte Bibliothek ist Teil von \"Las llaves de la ciudad\" (Die Schlüssel der Stadt), dem Programm geführter Besichtigungen, das Salamanca jedes Jahr veranstaltet (2026 vom 24. Oktober bis zum 20. Dezember). Wer den Pass des Programms vollständig ausfüllt, kann an einer Verlosung teilnehmen, um das Sanctasanctórum der Bibliothek zu sehen. Informiere dich für Öffnungszeiten, Tickets und Zugangsbedingungen, die sich ändern, immer auf der offiziellen Website."
  faq:
    - p: "Was ist das Bekannteste an der Universität Salamanca?"
      r: "Die plateareske Fassade der Escuelas Mayores mit dem versteckten Frosch und die Alte Bibliothek."
    - p: "Wo ist der Frosch?"
      r: "An der Fassade der Escuelas Mayores, auf einem Totenkopf. Es ist Tradition, ihn finden zu wollen."
    - p: "Kann man die Alte Bibliothek besichtigen?"
      r: "Ja. Neben dem üblichen Besuch ist sie Teil von \"Las llaves de la ciudad\", mit geführten Besichtigungen im Herbst. Informiere dich auf der offiziellen Website über Plätze und Bedingungen."
    - p: "Was ist Las llaves de la ciudad?"
      r: "Ein jährliches Programm geführter Besichtigungen von Kulturerbestätten in Salamanca. Die lokale Presse stellt es als kostenlos dar, aber man muss auf der Website des Fremdenverkehrsamts von Salamanca reservieren."
    - p: "Wie viel Zeit braucht man?"
      r: "Ein bis zwei Stunden für das Äußere und die besuchbaren Bereiche. Mehr, wenn du die Alte Bibliothek und die Umgebung der Kathedralen hinzunimmst."
    - p: "Was kann man in der Nähe noch sehen?"
      r: "Die Kathedralen, die Casa de las Conchas und die Clerecía sind nur wenige Gehminuten entfernt."
