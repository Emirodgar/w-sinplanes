museo-nacional-prado:
  texto:
    - "O Museu Nacional do Prado é a grande pinacoteca de Espanha e uma das mais importantes do mundo. Abriu portas em 1819 e reúne uma coleção extraordinária de pintura europeia, com especial força nos séculos XVI a XIX."
    - "Entre as obras mais célebres estão As Meninas de Velázquez, as Majas e os fuzilamentos de 3 de maio de Goya, O Jardim das Delícias de Bosch e várias obras-primas de El Greco, Ticiano ou Rubens. É impossível ver tudo numa só visita, por isso convém escolher que salas priorizar."
    - "O melhor é ir com um plano: escolhe entre três e cinco obras ou salas, consulta a planta e reserva o bilhete com antecedência na época alta. O museu oferece períodos de entrada gratuita, que costumam estar muito concorridos. Combina a visita com o Retiro, que fica mesmo ao lado, e com o Reina Sofía e o Thyssen, que completam o chamado Paseo del Arte."
  faq:
    - p: "O que não se deve perder no Prado?"
      r: "As Meninas, as Majas e os fuzilamentos de 3 de maio de Goya, O Jardim das Delícias de Bosch, e obras de El Greco, Ticiano e Rubens. Escolhe antes o que ver, porque o museu é enorme."
    - p: "Quanto tempo é preciso?"
      r: "Entre duas e três horas para uma visita seletiva. Se quiseres vê-lo com calma, reserva meio dia ou divide a visita em dois momentos."
    - p: "Quando é gratuito?"
      r: "O museu tem períodos de entrada gratuita ao longo da semana. Consulta sempre o site oficial para horários, bilhetes e condições de acesso, que mudam."
    - p: "É preciso reservar bilhete?"
      r: "Recomenda-se comprar o bilhete com antecedência, sobretudo na época alta, aos fins de semana e feriados, para evitar filas."
    - p: "Podem tirar-se fotografias?"
      r: "As condições sobre fotografia e mochilas são definidas pelo museu e mudam. Consulta-as no site oficial antes de ir."
    - p: "É um bom plano com crianças?"
      r: "Sim, com uma visita curta e centrada em poucas obras. O museu oferece materiais e atividades para famílias; consulta-os no site."
museo-reina-sofia:
  texto:
    - "O Museu Reina Sofía é o grande museu de arte do século XX e contemporânea de Espanha. Está instalado no antigo Hospital Geral de San Carlos, um edifício do século XVIII ao qual foram acrescentadas torres de vidro desenhadas por Jean Nouvel."
    - "A sua peça mais famosa é o Guernica de Picasso, que ocupa uma sala própria e é acompanhado por esboços e estudos do quadro. A coleção inclui ainda Dalí, Miró, Juan Gris e outros nomes das vanguardas, e uma boa panorâmica da arte espanhola e europeia do último século."
    - "O Guernica costuma concentrar a maioria dos visitantes, por isso convém vê-lo logo de manhã ou nos períodos de menos afluência. Depois, percorre o resto da coleção com calma. O museu organiza exposições temporárias e tem uma cafetaria e uma livraria muito completa. Consulta sempre o site oficial para horários, bilhetes e condições de acesso, que mudam."
  faq:
    - p: "Onde está o Guernica?"
      r: "No Museu Reina Sofía, numa sala própria, juntamente com esboços e estudos da obra."
    - p: "O que mais há no museu?"
      r: "Obras de Dalí, Miró, Juan Gris e outros artistas das vanguardas, além de arte espanhola e europeia do século XX e contemporânea."
    - p: "Quando é gratuito?"
      r: "O museu tem períodos de entrada gratuita. Consulta sempre o site oficial para horários, bilhetes e condições de acesso, que mudam."
    - p: "Quanto tempo é preciso?"
      r: "Entre duas e três horas para uma visita seletiva, com o Guernica incluído."
    - p: "É preciso reservar bilhete?"
      r: "Recomenda-se reservar com antecedência na época alta e aos fins de semana."
    - p: "O que mais ver nas proximidades?"
      r: "O Museu do Prado, o Thyssen e o Retiro ficam a poucos minutos a pé. O conjunto é conhecido como Paseo del Arte."
museo-thyssen-bornemisza:
  texto:
    - "O Museu Thyssen-Bornemisza completa o chamado Paseo del Arte de Madrid, juntamente com o Prado e o Reina Sofía. A sua coleção percorre oito séculos de pintura, do gótico às vanguardas do século XX, e desfruta-se com um percurso cronológico muito fácil de seguir."
    - "Reúne obras de grandes mestres, desde primitivos italianos e flamengos até impressionistas, expressionistas e artistas do século XX, num edifício que antes foi o palácio de Villahermosa. É um museu fácil de gerir, com uma visita mais abarcável do que a do Prado."
    - "Se tiveres pouco tempo, é uma boa opção para uma visita de duas horas. O percurso começa no piso superior, com a arte mais antiga, e desce em direção ao presente. Aproveita para ver as exposições temporárias e para passear depois pelo Retiro. Consulta sempre o site oficial para horários, bilhetes e condições de acesso, que mudam."
  faq:
    - p: "Que tipo de arte há no Thyssen?"
      r: "Pintura europeia de oito séculos, do gótico às vanguardas do século XX, com obras de mestres antigos, impressionistas e expressionistas."
    - p: "Quanto tempo é preciso?"
      r: "Entre duas e três horas chegam para o percorrer com calma."
    - p: "Visita-se por ordem?"
      r: "Sim, o percurso é cronológico, do piso superior (arte antiga) ao inferior (arte moderna)."
    - p: "É preciso reservar bilhete?"
      r: "Recomenda-se comprar o bilhete com antecedência na época alta e aos fins de semana."
    - p: "Quando é gratuito?"
      r: "O museu tem períodos de entrada gratuita ou reduzida. Consulta sempre o site oficial para horários, bilhetes e condições de acesso, que mudam."
    - p: "É um bom plano com crianças?"
      r: "Sim, com uma visita breve. O museu oferece atividades e percursos para famílias."
palacio-real-madrid:
  texto:
    - "O Palácio Real de Madrid é a residência oficial do Rei, embora só seja utilizado para atos de Estado. É o maior palácio real da Europa Ocidental em superfície e pode visitar-se quase todo o ano, exceto quando há atos oficiais."
    - "A visita percorre salões decorados com tapeçarias, frescos e lustres de cristal, como o Salão do Trono e a Sala de Jantar de Gala, além da Real Armaria e da Real Farmácia. Há coleções de instrumentos de corda, relógios e mobiliário dos séculos XVIII e XIX."
    - "Confirma com antecedência se o palácio está aberto no dia em que queres ir, porque fecha por atos oficiais. Reserva o bilhete na época alta para evitar filas e calcula entre uma e duas horas de visita. Os jardins de Sabatini e o Campo del Moro, junto ao palácio, são um bom complemento. Consulta sempre o site oficial para horários, bilhetes e condições de acesso, que mudam."
  faq:
    - p: "O Rei vive no Palácio Real?"
      r: "Não, a residência da família real é noutro local. O palácio usa-se para atos oficiais e cerimónias."
    - p: "O que se visita?"
      r: "Salões de gala, como o do Trono e a Sala de Jantar de Gala, a Real Armaria, a Real Farmácia e diversas coleções de arte e mobiliário."
    - p: "Quanto tempo é preciso?"
      r: "Entre uma e duas horas para a visita completa."
    - p: "Pode estar fechado?"
      r: "Sim, o palácio fecha durante atos oficiais. Verifica o site antes de ir."
    - p: "É preciso reservar bilhete?"
      r: "Recomenda-se reservar com antecedência na época alta."
    - p: "O que mais ver nas proximidades?"
      r: "A Catedral da Almudena, a Plaza de Oriente, os jardins de Sabatini e o Campo del Moro."
parque-buen-retiro:
  texto:
    - "O Parque do Buen Retiro é o grande parque de Madrid e um dos lugares mais queridos pelos madrilenos. Classificado como Património Mundial pela UNESCO, juntamente com o Paseo del Prado, é um oásis de jardins, alamedas arborizadas, lagos e monumentos em pleno centro."
    - "Entre os recantos mais conhecidos estão o Estanque Grande, com barcos a remos e o monumento a Afonso XII, o Palácio de Cristal, o Palácio de Velázquez e o Roseiral. Há também um passeio de esculturas e vários recantos tranquilos, como o Bosque do Recuerdo."
    - "É perfeito para passear, fazer desporto, ler ou simplesmente descansar. O parque abre logo de manhã e o melhor é visitá-lo de manhã ou ao fim da tarde. Na primavera, com o Roseiral, e no outono, com as cores, é especialmente bonito. Todos os anos acolhe a Feira do Livro, no final da primavera."
  faq:
    - p: "O que ver no Retiro?"
      r: "O Estanque Grande com barcos, o Palácio de Cristal, o Palácio de Velázquez, o Roseiral e o Bosque do Recuerdo."
    - p: "É gratuito?"
      r: "O acesso ao parque é livre. Algumas atividades, como alugar um barco, são pagas."
    - p: "Podem alugar-se barcos?"
      r: "Sim, no Estanque Grande, normalmente com horário de abertura e época. Consulta as condições."
    - p: "Quando é melhor ir?"
      r: "De manhã ou ao fim da tarde. Na primavera e no outono o parque está especialmente bonito."
    - p: "É um bom plano com crianças?"
      r: "Sim, há zonas de jogos, barcos, marionetas em alguns períodos e muito espaço para correr."
    - p: "É Património Mundial?"
      r: "Sim, faz parte da Paisagem da Luz, Paseo del Prado e El Retiro, classificada pela UNESCO."
sagrada-familia:
  texto:
    - "A Sagrada Família é a obra-prima inacabada de Antoni Gaudí e o monumento mais visitado de Barcelona. As obras começaram em 1882 e continuam em curso, financiadas em grande parte pelos bilhetes dos visitantes. Faz parte das obras de Gaudí classificadas como Património Mundial pela UNESCO."
    - "As fachadas do Nascimento e da Paixão contam a vida de Jesus com uma escultura muito diferente em cada uma. O interior é o mais surpreendente: colunas que se abrem como árvores, abóbadas de formas naturais e uma luz de cores que muda ao longo do dia, consoante a hora e a orientação dos vitrais."
    - "Os bilhetes vendem-se com dia e hora marcados e esgotam com antecedência, por isso reserva online antes de viajar. Prevê entre uma hora e meia e duas para a visita, com ou sem audioguia, e pondera subir a uma das torres, se houver lugares. Cuidado com os revendedores nas filas à volta. Consulta sempre o site oficial para horários, bilhetes e condições de acesso, que mudam."
  faq:
    - p: "Porque é que continua por terminar?"
      r: "Porque as obras começaram em 1882 e são financiadas sobretudo com os bilhetes e donativos, num projeto muito complexo. Consulta no site oficial o estado atual das obras."
    - p: "É preciso reservar bilhete?"
      r: "Sim, convém reservar online com antecedência: os bilhetes vendem-se com hora marcada e esgotam, sobretudo na época alta."
    - p: "Quanto tempo é preciso?"
      r: "Entre uma hora e meia e duas horas, mais se subires a uma torre."
    - p: "Pode subir-se às torres?"
      r: "Sim, há bilhetes com subida às torres, com lugares limitados. Consulta as condições no site."
    - p: "O que ver no interior?"
      r: "As colunas em forma de árvore, as abóbadas e os vitrais coloridos, cuja luz muda ao longo do dia."
    - p: "É Património Mundial?"
      r: "Sim, faz parte das obras de Antoni Gaudí classificadas como Património Mundial pela UNESCO."
park-guell:
  texto:
    - "O Park Güell é o parque modernista de Gaudí, com arquitetura e natureza fundidas numa colina com vista para toda a Barcelona. Faz parte das obras de Gaudí classificadas como Património Mundial pela UNESCO e é um dos lugares mais fotografados da cidade."
    - "O mais famoso é a Zona Monumental: a grande praça com o seu banco ondulado revestido de mosaico de trencadís, a salamandra colorida, as colunas inclinadas do pórtico e os edifícios da entrada. O resto do parque são caminhos, jardins e miradouros de acesso livre."
    - "A Zona Monumental tem lotação limitada e entrada com horário, e convém reservá-la com antecedência. Evita as horas centrais do dia e vai logo de manhã ou ao fim da tarde, quando há menos gente e melhor luz. Leva calçado confortável, porque há subidas, e água. Consulta sempre o site oficial para horários, bilhetes e condições de acesso, que mudam."
  faq:
    - p: "O Park Güell é gratuito?"
      r: "Parte do parque é de acesso livre, mas a Zona Monumental, com o banco ondulado, requer bilhete com horário. Consulta sempre o site oficial para horários, bilhetes e condições de acesso, que mudam."
    - p: "É preciso reservar?"
      r: "Sim, convém reservar com antecedência o bilhete para a Zona Monumental, porque a lotação é limitada."
    - p: "Quanto tempo é preciso?"
      r: "Entre uma hora e meia e duas horas, mais se explorares a zona livre do parque."
    - p: "Quando é melhor ir?"
      r: "Logo de manhã ou ao fim da tarde, quando há menos gente e a luz é melhor."
    - p: "Como chegar?"
      r: "De metro e autocarro ou a pé a partir das paragens próximas. Há subidas, por isso leva calçado confortável."
    - p: "É um bom plano com crianças?"
      r: "Sim, embora haja subidas e escadas. Os mosaicos e a salamandra costumam agradar aos mais pequenos."
casa-batllo:
  texto:
    - "A Casa Batlló é uma das casas mais espetaculares de Gaudí, em pleno Passeig de Gràcia. Gaudí remodelou-a entre 1904 e 1906 e criou uma fachada de cores e formas ondulantes, com varandas que parecem máscaras e um telhado que faz lembrar o dorso de um dragão."
    - "No interior, tudo parece natureza: o pátio de luz revestido de azulejos azuis que mudam de tom consoante a altura, o salão principal com as suas janelas, a escadaria e o sótão, com arcos de catenária. É uma casa onde quase não há linhas retas e cada pormenor foi pensado."
    - "A visita faz-se com audioguia e costuma incluir realidade aumentada. Reserva com antecedência, porque na época alta os bilhetes esgotam, e prevê uma hora e meia. A Casa Batlló faz parte do troço conhecido como Manzana de la Discordia, juntamente com a Casa Amatller e a Casa Lleó Morera. Consulta sempre o site oficial para horários, bilhetes e condições de acesso, que mudam."
  faq:
    - p: "Quem construiu a Casa Batlló?"
      r: "Antoni Gaudí remodelou-a entre 1904 e 1906 para a família Batlló."
    - p: "O que é a Manzana de la Discordia?"
      r: "O troço do Passeig de Gràcia onde coexistem edifícios modernistas de diferentes arquitetos, entre eles a Casa Batlló, a Casa Amatller e a Casa Lleó Morera."
    - p: "É preciso reservar bilhete?"
      r: "Sim, convém reservar com antecedência, sobretudo na época alta."
    - p: "Quanto dura a visita?"
      r: "Entre uma hora e uma hora e meia, com audioguia."
    - p: "O que não se deve perder?"
      r: "A fachada, o pátio de luz de azulejos azuis, o salão principal e o terraço com as chaminés."
    - p: "É Património Mundial?"
      r: "Sim, faz parte das obras de Gaudí classificadas como Património Mundial pela UNESCO."
ciudad-artes-ciencias:
  texto:
    - "A Cidade das Artes e das Ciências é o grande complexo cultural e de lazer de Valência, um conjunto de edifícios futuristas da autoria de Santiago Calatrava e Félix Candela que se tornou um dos símbolos da cidade. Fica no antigo leito do rio Turia, hoje um grande jardim."
    - "Reúne vários espaços: o Hemisfèric, com o seu cinema IMAX e planetário em forma de olho; o Museu de les Ciències Príncipe Felipe; o Oceanogràfic, um dos maiores aquários da Europa; o Palau de les Arts Reina Sofía, dedicado à ópera; o Ágora e o Umbracle, um passeio com jardins. Cada um visita-se em separado e existem bilhetes combinados."
    - "Embora se possa passear pelo exterior sem pagar, o interior dos edifícios requer bilhete. Se fores com crianças, o Oceanogràfic e o Museu das Ciências são os mais recomendáveis. Vai de bicicleta ou a pé pelo jardim do Turia e evita as horas de mais calor. Consulta sempre o site oficial para horários, bilhetes e condições de acesso, que mudam."
  faq:
    - p: "O que inclui a Cidade das Artes e das Ciências?"
      r: "O Hemisfèric, o Museu de les Ciències, o Oceanogràfic, o Palau de les Arts, o Ágora e o Umbracle."
    - p: "Pode entrar-se gratuitamente?"
      r: "Pode passear-se pelo exterior, mas o acesso aos edifícios requer bilhete. Consulta sempre o site oficial para horários, bilhetes e condições de acesso, que mudam."
    - p: "O que ver se tiver pouco tempo?"
      r: "Um passeio pelo exterior para ver a arquitetura e, se houver tempo, o Oceanogràfic ou o Museu das Ciências."
    - p: "É um bom plano com crianças?"
      r: "Sim, o Oceanogràfic e o Museu das Ciências estão muito pensados para as famílias."
    - p: "Como chegar?"
      r: "De metro, elétrico ou autocarro, ou a pé e de bicicleta pelo jardim do Turia."
    - p: "Há bilhetes combinados?"
      r: "Sim, existem bilhetes combinados para vários espaços. Consulta as opções no site oficial."
real-alcazar-sevilla:
  texto:
    - "O Real Alcázar de Sevilha é um palácio fortificado de origem muçulmana, ampliado ao longo dos séculos, e um dos melhores exemplos do estilo mudéjar. É Património Mundial, juntamente com a catedral e o Arquivo das Índias, e continua a ser residência oficial do Rei quando visita a cidade."
    - "O coração do conjunto é o Palácio de Pedro I, do século XIV, com o Pátio das Donzelas, o Salão dos Embaixadores com a sua cúpula dourada e gessos de grande delicadeza. À sua volta estendem-se jardins com tanques, fontes, laranjeiras e recantos sombreados. Foi cenário de séries e filmes, entre eles Guerra dos Tronos."
    - "Reserva o bilhete com antecedência, porque esgota, sobretudo na primavera e no outono. Prevê entre duas e três horas de visita e evita as horas de mais calor se fores no verão. Combina o Alcázar com a catedral, a Giralda e o bairro de Santa Cruz, que ficam ao lado. Consulta sempre o site oficial para horários, bilhetes e condições de acesso, que mudam."
  faq:
    - p: "O que é o Real Alcázar de Sevilha?"
      r: "Um palácio fortificado de origem muçulmana, ampliado em época cristã, tendo o Palácio mudéjar de Pedro I como peça central."
    - p: "É preciso reservar bilhete?"
      r: "Sim, convém reservar com antecedência, sobretudo na época alta."
    - p: "Quanto tempo é preciso?"
      r: "Entre duas e três horas, entre palácios e jardins."
    - p: "O que não se deve perder?"
      r: "O Pátio das Donzelas, o Salão dos Embaixadores, o Palácio de Carlos V e os jardins."
    - p: "Continua a ser residência real?"
      r: "Sim, faz parte das residências oficiais do Rei e é usado para atos oficiais."
    - p: "É Património Mundial?"
      r: "Sim, juntamente com a catedral e o Arquivo Geral das Índias, desde 1987."
