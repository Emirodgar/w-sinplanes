museo-nacional-prado:
  texto:
    - "Le Museo Nacional del Prado est la grande pinacothèque d'Espagne et l'une des plus importantes au monde. Il a ouvert ses portes en 1819 et rassemble une collection extraordinaire de peinture européenne, particulièrement riche du XVIe au XIXe siècle."
    - "Parmi ses œuvres les plus célèbres figurent Les Ménines de Velázquez, les Majas et les fusillades du 3 mai de Goya, Le Jardin des délices de Jérôme Bosch, ainsi que plusieurs chefs-d'œuvre du Greco, du Titien ou de Rubens. Il est impossible de tout voir en une seule visite : mieux vaut donc choisir les salles à privilégier."
    - "Le mieux est de venir avec un plan : choisissez entre trois et cinq œuvres ou salles, consultez le plan du musée et réservez votre billet à l'avance en haute saison. Le musée propose des créneaux d'entrée gratuite, souvent très fréquentés. Combinez la visite avec le Retiro, tout proche, ainsi qu'avec le Reina Sofía et le Thyssen, qui complètent ce que l'on appelle le Paseo del Arte."
  faq:
    - p: "Que ne faut-il pas manquer au Prado ?"
      r: "Les Ménines, les Majas et les fusillades du 3 mai de Goya, Le Jardin des délices de Bosch, ainsi que des œuvres du Greco, du Titien et de Rubens. Choisissez à l'avance ce que vous voulez voir, car le musée est immense."
    - p: "Combien de temps faut-il prévoir ?"
      r: "Entre deux et trois heures pour une visite sélective. Si vous voulez le découvrir tranquillement, comptez une demi-journée ou répartissez la visite en deux fois."
    - p: "Quand l'entrée est-elle gratuite ?"
      r: "Le musée propose des créneaux d'entrée gratuite au fil de la semaine. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
    - p: "Faut-il réserver son billet ?"
      r: "Il est recommandé d'acheter son billet à l'avance, surtout en haute saison, le week-end et les jours fériés, afin d'éviter les files d'attente."
    - p: "Peut-on prendre des photos ?"
      r: "Les règles concernant la photographie et les sacs à dos sont fixées par le musée et évoluent. Consultez-les sur le site officiel avant de venir."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Oui, avec une visite courte centrée sur quelques œuvres. Le musée propose du matériel et des activités pour les familles ; consultez-les sur son site."
museo-reina-sofia:
  texto:
    - "Le Museo Reina Sofía est le grand musée d'art du XXe siècle et d'art contemporain d'Espagne. Il est installé dans l'ancien Hôpital général de San Carlos, un édifice du XVIIIe siècle auquel ont été ajoutées des tours de verre conçues par Jean Nouvel."
    - "Son œuvre la plus célèbre est le Guernica de Picasso, qui occupe une salle à lui seul et est accompagné d'esquisses et d'études du tableau. La collection comprend aussi Dalí, Miró, Juan Gris et d'autres grands noms des avant-gardes, ainsi qu'un bon panorama de l'art espagnol et européen du dernier siècle."
    - "Le Guernica attire la majorité des visiteurs ; il vaut donc mieux le voir à l'ouverture ou pendant les créneaux les moins fréquentés. Parcourez ensuite le reste de la collection tranquillement. Le musée organise des expositions temporaires et dispose d'un café et d'une librairie très complète. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Où se trouve le Guernica ?"
      r: "Au Museo Reina Sofía, dans une salle qui lui est dédiée, avec des esquisses et des études de l'œuvre."
    - p: "Que voir d'autre dans le musée ?"
      r: "Des œuvres de Dalí, Miró, Juan Gris et d'autres artistes des avant-gardes, ainsi que de l'art espagnol et européen du XXe siècle et de l'art contemporain."
    - p: "Quand l'entrée est-elle gratuite ?"
      r: "Le musée propose des créneaux d'entrée gratuite. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
    - p: "Combien de temps faut-il prévoir ?"
      r: "Entre deux et trois heures pour une visite sélective, Guernica compris."
    - p: "Faut-il réserver son billet ?"
      r: "Il est recommandé de réserver à l'avance en haute saison et le week-end."
    - p: "Que voir d'autre à proximité ?"
      r: "Le Museo del Prado, le Thyssen et le Retiro sont à quelques minutes à pied. L'ensemble est connu sous le nom de Paseo del Arte."
museo-thyssen-bornemisza:
  texto:
    - "Le Museo Thyssen-Bornemisza complète ce que l'on appelle le Paseo del Arte de Madrid, aux côtés du Prado et du Reina Sofía. Sa collection parcourt huit siècles de peinture, du gothique aux avant-gardes du XXe siècle, avec un parcours chronologique très facile à suivre."
    - "Il rassemble des œuvres de grands maîtres, des primitifs italiens et flamands aux impressionnistes, expressionnistes et artistes du XXe siècle, dans un bâtiment qui fut autrefois le palais de Villahermosa. C'est un musée à taille humaine, dont la visite est plus abordable que celle du Prado."
    - "Si vous avez peu de temps, c'est une bonne option pour une visite de deux heures. Le parcours commence à l'étage supérieur avec l'art le plus ancien et descend vers l'époque actuelle. Profitez-en pour voir les expositions temporaires et pour vous promener ensuite dans le Retiro. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Quel type d'art trouve-t-on au Thyssen ?"
      r: "De la peinture européenne sur huit siècles, du gothique aux avant-gardes du XXe siècle, avec des œuvres de maîtres anciens, d'impressionnistes et d'expressionnistes."
    - p: "Combien de temps faut-il prévoir ?"
      r: "Entre deux et trois heures suffisent pour le parcourir tranquillement."
    - p: "Se visite-t-il dans un ordre précis ?"
      r: "Oui, le parcours est chronologique, de l'étage supérieur (art ancien) à l'étage inférieur (art moderne)."
    - p: "Faut-il réserver son billet ?"
      r: "Il est recommandé d'acheter son billet à l'avance en haute saison et le week-end."
    - p: "Quand l'entrée est-elle gratuite ?"
      r: "Le musée propose des créneaux d'entrée gratuite ou à tarif réduit. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Oui, avec une visite brève. Le musée propose des activités et des parcours pour les familles."
palacio-real-madrid:
  texto:
    - "Le Palais royal de Madrid est la résidence officielle du roi, même s'il n'est utilisé que pour les cérémonies d'État. C'est le plus grand palais royal d'Europe occidentale par sa superficie, et il se visite presque toute l'année, sauf lorsqu'il y a des cérémonies officielles."
    - "La visite traverse des salons décorés de tapisseries, de fresques et de lustres en cristal, comme la salle du Trône et la salle à manger de gala, ainsi que l'Armurerie royale et la Pharmacie royale. On y trouve aussi des collections d'instruments à cordes, d'horloges et de mobilier des XVIIIe et XIXe siècles."
    - "Vérifiez à l'avance si le palais est ouvert le jour où vous voulez y aller, car il ferme lors des cérémonies officielles. Réservez votre billet en haute saison pour éviter les files d'attente et comptez entre une et deux heures de visite. Les jardins de Sabatini et le Campo del Moro, à côté du palais, sont un bon complément. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Le roi vit-il au Palais royal ?"
      r: "Non, la résidence de la famille royale se trouve ailleurs. Le palais sert aux cérémonies et aux événements officiels."
    - p: "Que visite-t-on ?"
      r: "Des salons de gala, comme la salle du Trône et la salle à manger de gala, l'Armurerie royale, la Pharmacie royale et diverses collections d'art et de mobilier."
    - p: "Combien de temps faut-il prévoir ?"
      r: "Entre une et deux heures pour la visite complète."
    - p: "Peut-il être fermé ?"
      r: "Oui, le palais ferme lors des cérémonies officielles. Vérifiez sur le site avant de venir."
    - p: "Faut-il réserver son billet ?"
      r: "Il est recommandé de réserver à l'avance en haute saison."
    - p: "Que voir d'autre à proximité ?"
      r: "La cathédrale de l'Almudena, la place d'Orient, les jardins de Sabatini et le Campo del Moro."
parque-buen-retiro:
  texto:
    - "Le parc du Buen Retiro est le grand parc de Madrid et l'un des lieux préférés des Madrilènes. Classé au patrimoine mondial de l'UNESCO avec le Paseo del Prado, c'est une oasis de jardins, d'allées ombragées, de bassins et de monuments en plein centre-ville."
    - "Parmi ses coins les plus connus figurent le Grand Étang, avec ses barques à rames et le monument à Alphonse XII, le Palais de Cristal, le Palais de Velázquez et la Roseraie. On y trouve aussi une promenade de sculptures et plusieurs endroits tranquilles, comme le Bosque del Recuerdo."
    - "C'est un lieu idéal pour se promener, faire du sport, lire ou tout simplement se reposer. Le parc ouvre tôt et le mieux est de le visiter le matin ou en fin de journée. Au printemps, avec la Roseraie, et en automne, avec ses couleurs, il est particulièrement beau. Chaque année, il accueille la Foire du livre, à la fin du printemps."
  faq:
    - p: "Que voir au Retiro ?"
      r: "Le Grand Étang avec ses barques, le Palais de Cristal, le Palais de Velázquez, la Roseraie et le Bosque del Recuerdo."
    - p: "Est-ce gratuit ?"
      r: "L'accès au parc est libre. Certaines activités, comme la location d'une barque, sont payantes."
    - p: "Peut-on louer des barques ?"
      r: "Oui, sur le Grand Étang, généralement selon des horaires d'ouverture et une saison. Renseignez-vous sur les conditions."
    - p: "Quand vaut-il mieux y aller ?"
      r: "Le matin ou en fin de journée. Au printemps et en automne, le parc est particulièrement beau."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Oui, il y a des aires de jeux, des barques, des marionnettes à certaines périodes et beaucoup d'espace pour courir."
    - p: "Est-ce classé au patrimoine mondial ?"
      r: "Oui, il fait partie du Paysage de la Lumière, Paseo del Prado et Buen Retiro, classé par l'UNESCO."
sagrada-familia:
  texto:
    - "La Sagrada Família est le chef-d'œuvre inachevé d'Antoni Gaudí et le monument le plus visité de Barcelone. Les travaux ont commencé en 1882 et se poursuivent, financés en grande partie par les billets des visiteurs. Elle fait partie des œuvres de Gaudí classées au patrimoine mondial par l'UNESCO."
    - "Les façades de la Nativité et de la Passion racontent la vie de Jésus avec une sculpture très différente sur chacune. C'est l'intérieur qui surprend le plus : des colonnes qui s'ouvrent comme des arbres, des voûtes aux formes naturelles et une lumière colorée qui change au fil de la journée selon l'heure et l'orientation des vitraux."
    - "Les billets sont vendus avec un jour et une heure précis et s'épuisent à l'avance ; réservez donc en ligne avant votre voyage. Comptez entre une heure et demie et deux heures de visite, avec ou sans audioguide, et pensez à monter dans l'une des tours s'il reste des places. Méfiez-vous des revendeurs dans les files d'attente aux alentours. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Pourquoi n'est-elle toujours pas terminée ?"
      r: "Parce que les travaux ont commencé en 1882 et sont financés principalement par les billets et les dons, pour un projet très complexe. Consultez le site officiel pour connaître l'état actuel des travaux."
    - p: "Faut-il réserver son billet ?"
      r: "Oui, il est conseillé de réserver en ligne à l'avance : les billets sont vendus avec une heure précise et s'épuisent, surtout en haute saison."
    - p: "Combien de temps faut-il prévoir ?"
      r: "Entre une heure et demie et deux heures, davantage si vous montez dans une tour."
    - p: "Peut-on monter dans les tours ?"
      r: "Oui, il existe des billets avec montée dans les tours, avec un nombre de places limité. Consultez les conditions sur le site."
    - p: "Que voir à l'intérieur ?"
      r: "Les colonnes en forme d'arbre, les voûtes et les vitraux colorés, dont la lumière change au fil de la journée."
    - p: "Est-ce classé au patrimoine mondial ?"
      r: "Oui, elle fait partie des œuvres d'Antoni Gaudí classées au patrimoine mondial par l'UNESCO."
park-guell:
  texto:
    - "Le Park Güell est le parc moderniste de Gaudí, où architecture et nature se fondent sur une colline offrant une vue sur tout Barcelone. Il fait partie des œuvres de Gaudí classées au patrimoine mondial par l'UNESCO et c'est l'un des lieux les plus photographiés de la ville."
    - "Le plus célèbre est la Zone monumentale : la grande place avec son banc ondulé recouvert de mosaïque en trencadís, la salamandre multicolore, les colonnes inclinées du portique et les bâtiments de l'entrée. Le reste du parc se compose de sentiers, de jardins et de belvédères en accès libre."
    - "La Zone monumentale a une capacité limitée et une entrée à horaire fixe, et il est conseillé de la réserver à l'avance. Évitez les heures du milieu de journée et venez à l'ouverture ou en fin d'après-midi, quand il y a moins de monde et une meilleure lumière. Portez des chaussures confortables, car il y a des côtes, et emportez de l'eau. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Le Park Güell est-il gratuit ?"
      r: "Une partie du parc est en accès libre, mais la Zone monumentale, avec le banc ondulé, nécessite un billet à horaire fixe. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
    - p: "Faut-il réserver ?"
      r: "Oui, il est conseillé de réserver à l'avance l'entrée de la Zone monumentale, car la capacité est limitée."
    - p: "Combien de temps faut-il prévoir ?"
      r: "Entre une heure et demie et deux heures, davantage si vous explorez la zone libre du parc."
    - p: "Quand vaut-il mieux y aller ?"
      r: "À l'ouverture le matin ou en fin d'après-midi, quand il y a moins de monde et que la lumière est plus belle."
    - p: "Comment s'y rendre ?"
      r: "En métro et en bus, ou à pied depuis les arrêts les plus proches. Il y a des côtes, alors portez des chaussures confortables."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Oui, même s'il y a des côtes et des escaliers. Les mosaïques et la salamandre plaisent généralement aux plus petits."
casa-batllo:
  texto:
    - "La Casa Batlló est l'une des maisons les plus spectaculaires de Gaudí, en plein Passeig de Gràcia. Gaudí l'a rénovée entre 1904 et 1906 et lui a donné une façade aux couleurs et aux formes ondulantes, avec des balcons qui ressemblent à des masques et un toit qui rappelle l'échine d'un dragon."
    - "À l'intérieur, tout évoque la nature : le puits de lumière recouvert de carreaux bleus dont la teinte change selon la hauteur, le salon principal avec ses grandes baies vitrées, l'escalier et le grenier, avec ses arcs caténaires. C'est une maison où il n'y a presque aucune ligne droite et où chaque détail a été pensé."
    - "La visite se fait avec un audioguide et inclut généralement de la réalité augmentée. Réservez à l'avance, car en haute saison les billets s'épuisent, et prévoyez une heure et demie. La Casa Batlló fait partie du tronçon connu sous le nom d'Îlot de la Discorde, avec la Casa Amatller et la Casa Lleó Morera. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Qui a construit la Casa Batlló ?"
      r: "Antoni Gaudí l'a rénovée entre 1904 et 1906 pour la famille Batlló."
    - p: "Qu'est-ce que l'Îlot de la Discorde ?"
      r: "Le tronçon du Passeig de Gràcia où cohabitent des édifices modernistes de différents architectes, dont la Casa Batlló, la Casa Amatller et la Casa Lleó Morera."
    - p: "Faut-il réserver son billet ?"
      r: "Oui, il est conseillé de réserver à l'avance, surtout en haute saison."
    - p: "Combien dure la visite ?"
      r: "Entre une heure et une heure et demie, avec audioguide."
    - p: "Que ne faut-il pas manquer ?"
      r: "La façade, le puits de lumière aux carreaux bleus, le salon principal et la terrasse avec les cheminées."
    - p: "Est-ce classé au patrimoine mondial ?"
      r: "Oui, elle fait partie des œuvres de Gaudí classées au patrimoine mondial par l'UNESCO."
ciudad-artes-ciencias:
  texto:
    - "La Cité des arts et des sciences est le grand complexe culturel et de loisirs de Valence, un ensemble d'édifices futuristes dus à Santiago Calatrava et Félix Candela, devenu l'un des symboles de la ville. Elle se trouve dans l'ancien lit du fleuve Turia, aujourd'hui un grand jardin."
    - "Elle réunit plusieurs espaces : l'Hemisfèric, avec son cinéma IMAX et son planétarium en forme d'œil ; le Museu de les Ciències Príncipe Felipe ; l'Oceanogràfic, l'un des plus grands aquariums d'Europe ; le Palau de les Arts Reina Sofía, consacré à l'opéra ; l'Ágora et l'Umbracle, une promenade bordée de jardins. Chacun se visite séparément et il existe des billets combinés."
    - "Même si l'on peut se promener à l'extérieur sans payer, l'accès à l'intérieur des bâtiments nécessite un billet. Si vous venez avec des enfants, l'Oceanogràfic et le Musée des sciences sont les plus recommandés. Venez à vélo ou à pied par le jardin du Turia et évitez les heures les plus chaudes. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Que comprend la Cité des arts et des sciences ?"
      r: "L'Hemisfèric, le Museu de les Ciències, l'Oceanogràfic, le Palau de les Arts, l'Ágora et l'Umbracle."
    - p: "Peut-on entrer gratuitement ?"
      r: "On peut se promener à l'extérieur, mais l'accès aux bâtiments nécessite un billet. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
    - p: "Que voir si l'on a peu de temps ?"
      r: "Une promenade à l'extérieur pour admirer l'architecture et, s'il reste du temps, l'Oceanogràfic ou le Musée des sciences."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Oui, l'Oceanogràfic et le Musée des sciences sont très bien conçus pour les familles."
    - p: "Comment s'y rendre ?"
      r: "En métro, en tramway ou en bus, ou bien à pied et à vélo par le jardin du Turia."
    - p: "Existe-t-il des billets combinés ?"
      r: "Oui, il existe des billets combinés pour plusieurs espaces. Consultez les options sur le site officiel."
real-alcazar-sevilla:
  texto:
    - "Le Real Alcázar de Séville est un palais fortifié d'origine musulmane, agrandi au fil des siècles, et l'un des meilleurs exemples du style mudéjar. Il est classé au patrimoine mondial avec la cathédrale et les Archives des Indes, et reste la résidence officielle du roi lorsqu'il visite la ville."
    - "Le cœur de l'ensemble est le palais de Pierre Ier, du XIVe siècle, avec le Patio de las Doncellas, le Salon des Ambassadeurs et sa coupole dorée, ainsi que des stucs d'une grande délicatesse. Tout autour s'étendent des jardins avec bassins, fontaines, orangers et recoins ombragés. Il a servi de décor à des séries et à des films, dont Game of Thrones."
    - "Réservez votre billet à l'avance, car il s'épuise, surtout au printemps et en automne. Prévoyez entre deux et trois heures de visite et évitez les heures les plus chaudes si vous venez en été. Combinez l'Alcázar avec la cathédrale, la Giralda et le quartier de Santa Cruz, qui sont tout proches. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Qu'est-ce que le Real Alcázar de Séville ?"
      r: "Un palais fortifié d'origine musulmane, agrandi à l'époque chrétienne, dont le palais mudéjar de Pierre Ier est la pièce maîtresse."
    - p: "Faut-il réserver son billet ?"
      r: "Oui, il est conseillé de réserver à l'avance, surtout en haute saison."
    - p: "Combien de temps faut-il prévoir ?"
      r: "Entre deux et trois heures, entre palais et jardins."
    - p: "Que ne faut-il pas manquer ?"
      r: "Le Patio de las Doncellas, le Salon des Ambassadeurs, le palais de Charles Quint et les jardins."
    - p: "Est-ce toujours une résidence royale ?"
      r: "Oui, il fait partie des résidences officielles du roi et sert pour des cérémonies officielles."
    - p: "Est-ce classé au patrimoine mondial ?"
      r: "Oui, avec la cathédrale et les Archives générales des Indes, depuis 1987."
plaza-mayor-madrid:
  texto:
    - "La Plaza Mayor est l'une des places les plus connues de Madrid. C'est un vaste espace rectangulaire et fermé, entouré d'arcades et d'immeubles de plusieurs étages, construit au début du XVIIe siècle et qui a accueilli fêtes, marchés et cérémonies publiques pendant des siècles."
    - "Au centre se dresse la statue de Philippe III et, sur l'un des côtés, la Casa de la Panadería, avec ses fresques en façade. Sous les arcades se trouvent des boutiques de souvenirs, de timbres et de pièces de monnaie, et les terrasses de la place sont un lieu classique pour prendre un verre, même si c'est plus cher que dans les rues alentour."
    - "En hiver, le marché de Noël s'installe ici, avec ses stands de crèches et de décorations, et tout au long de l'année on y trouve des concerts et des animations. Pour manger, mieux vaut s'aventurer dans les ruelles voisines, où l'on trouve les sandwichs aux calamars et les tavernes les plus traditionnelles. Tôt le matin, la place est plus calme."
  faq:
    - p: "Que peut-on voir sur la Plaza Mayor ?"
      r: "La statue de Philippe III, la Casa de la Panadería et ses fresques, les arcades et l'ambiance des terrasses."
    - p: "Y a-t-il un marché de Noël ?"
      r: "Oui, en hiver, le marché de Noël s'installe avec ses stands de crèches et de décorations. Consultez les dates chaque année."
    - p: "Vaut-il mieux manger sur la place ?"
      r: "Les terrasses de la place sont plus chères. Les ruelles des alentours proposent des tavernes et des sandwichs aux calamars plus abordables."
    - p: "Quel est le meilleur moment pour y aller ?"
      r: "Tôt le matin ou en fin de journée, pour éviter les heures de grande affluence."
    - p: "Que voir d'autre à proximité ?"
      r: "Le Mercado de San Miguel, la Puerta del Sol, le Palais royal et le quartier de La Latina."
puerta-sol-madrid:
  texto:
    - "La Puerta del Sol est le cœur de Madrid et l'un des lieux les plus connus d'Espagne. C'est ici que se trouve le kilomètre zéro des routes radiales, signalé par une plaque au sol, ainsi que l'horloge de la Real Casa de Correos, qui sonne les douze coups de la Saint-Sylvestre."
    - "La place est un point de rendez-vous habituel et un carrefour très fréquenté. On y trouve la statue de l'Ours et de l'Arbousier, symbole de la ville, l'édifice de la Real Casa de Correos, aujourd'hui siège du gouvernement régional, et l'enseigne lumineuse de Tío Pepe, l'une des plus photographiées."
    - "C'est un arrêt rapide, de quinze ou vingt minutes, qui se combine bien avec une promenade sur la Plaza Mayor, la calle Mayor ou les rues piétonnes du centre. Attention aux pickpockets dans les zones très fréquentées et aux arnaques habituelles des quartiers touristiques. Le soir de la Saint-Sylvestre, la place se remplit de personnes venues vivre les douze coups de minuit."
  faq:
    - p: "Qu'est-ce que le kilomètre zéro ?"
      r: "Une plaque au sol, face à la Real Casa de Correos, qui marque l'origine des routes radiales d'Espagne."
    - p: "Quelle est l'horloge des douze coups de minuit ?"
      r: "Celle de la Real Casa de Correos, située sur la Puerta del Sol, qui sonne les douze coups de la Saint-Sylvestre."
    - p: "Que voir d'autre sur la place ?"
      r: "La statue de l'Ours et de l'Arbousier, l'enseigne de Tío Pepe et la Real Casa de Correos."
    - p: "Combien de temps faut-il prévoir ?"
      r: "Environ quinze ou vingt minutes pour voir les points principaux, davantage si vous vous asseyez pour observer l'ambiance."
    - p: "Y a-t-il un risque de pickpockets ?"
      r: "C'est une zone très fréquentée et les pickpockets opèrent là où il y a beaucoup de monde. Surveillez vos affaires."
    - p: "Qu'y a-t-il à proximité ?"
      r: "La Plaza Mayor, le Mercado de San Miguel, la calle Preciados et le Palais royal sont à quelques minutes à pied."
mercado-san-miguel:
  texto:
    - "Le Mercado de San Miguel est un marché couvert en fer et en verre inauguré en 1916, à côté de la Plaza Mayor. Aujourd'hui, c'est un espace gastronomique où l'on peut grignoter de tout, debout ou assis, parmi des stands de produits frais, de tapas, de vins et de conserves."
    - "On y trouve une grande variété : jambon, fromages, fruits de mer, tortillas, croquettes, pintxos, douceurs et boissons en tout genre. Très apprécié des touristes comme des Madrilènes, il permet de goûter rapidement beaucoup de choses au même endroit, même si les prix sont plus élevés que dans les tavernes du quartier."
    - "Il est très fréquenté à l'heure du déjeuner et le week-end ; mieux vaut donc y aller tôt le matin ou en milieu d'après-midi. Si vous cherchez une expérience moins chère, combinez un arrêt ici avec des tapas dans les tavernes de La Latina. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Que peut-on manger ?"
      r: "Jambon, fromages, fruits de mer, tortillas, croquettes, pintxos, douceurs et vin, entre autres produits."
    - p: "Est-ce cher ?"
      r: "Les prix sont généralement plus élevés que dans les tavernes du quartier, car c'est un lieu très touristique."
    - p: "Quel est le meilleur moment pour y aller ?"
      r: "Tôt le matin ou en milieu d'après-midi. À l'heure du déjeuner et le week-end, il y a foule."
    - p: "Peut-on réserver ?"
      r: "En général non, c'est un marché en accès libre. Certains stands disposent de tables."
    - p: "Que voir d'autre à proximité ?"
      r: "La Plaza Mayor, la Puerta del Sol et le quartier de La Latina."
casa-mila-pedrera:
  texto:
    - "La Casa Milà, connue sous le nom de La Pedrera, est une autre grande œuvre de Gaudí à Barcelone. Elle a été construite entre 1906 et 1912 comme habitation pour la famille Milà, et sa façade de pierre ondulée, presque sans lignes droites, lui a valu ce surnom de carrière de pierre."
    - "Le plus impressionnant est la terrasse, avec ses cheminées et ses sorties de ventilation qui ressemblent à des guerriers sculptés et offrent une vue sur la ville, ainsi que les combles, avec des arcs de brique qui forment une structure de côtes. On peut aussi visiter un appartement reconstitué pour voir comment on vivait au début du XXe siècle."
    - "Réservez à l'avance, car les billets s'épuisent en haute saison, et prévoyez une heure et demie pour la visite. La Pedrera organise aussi des visites nocturnes et des activités culturelles. Elle fait partie des œuvres de Gaudí classées au patrimoine mondial de l'UNESCO. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Pourquoi l'appelle-t-on La Pedrera ?"
      r: "À cause de sa façade de pierre ondulée, qui rappelle une carrière, surnom qui lui a été donné lors de sa construction."
    - p: "Que voir à La Pedrera ?"
      r: "La terrasse avec ses cheminées, les combles avec leurs arcs et un appartement reconstitué du début du XXe siècle."
    - p: "Faut-il réserver son billet ?"
      r: "Oui, il est conseillé de réserver à l'avance, surtout en haute saison."
    - p: "Combien de temps dure la visite ?"
      r: "Environ une heure et demie."
    - p: "Y a-t-il des visites nocturnes ?"
      r: "La Pedrera organise des visites et des activités en horaire spécial. Consultez l'offre sur le site officiel."
    - p: "Est-elle classée au patrimoine mondial ?"
      r: "Oui, elle fait partie des œuvres de Gaudí classées au patrimoine mondial de l'UNESCO."
museo-picasso-barcelona:
  texto:
    - "Le Musée Picasso de Barcelone occupe cinq palais médiévaux de la rue Montcada, dans le quartier de la Ribera. Sa collection se concentre sur la jeunesse de l'artiste et sur sa relation avec la ville, et c'est l'une des meilleures pour comprendre comment Picasso a évolué depuis ses premières années."
    - "On y trouve des œuvres de sa période de formation, de sa période bleue et d'autres époques, et surtout la série complète des Ménines, une réinterprétation du tableau de Velázquez que Picasso a peinte en 1957. Le parcours permet de suivre l'évolution de l'artiste avant qu'il n'atteigne la célébrité."
    - "Réservez à l'avance, car les billets s'épuisent en haute saison, et prévoyez une heure et demie de visite. C'est un musée petit et bien organisé, idéal à combiner avec une promenade dans le Born et la basilique Santa Maria del Mar. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Qu'y a-t-il au Musée Picasso ?"
      r: "Des œuvres de jeunesse et de différentes périodes de Picasso, ainsi que la série complète des Ménines."
    - p: "Où se trouve-t-il ?"
      r: "Rue Montcada, dans le quartier de la Ribera, à Barcelone, dans cinq palais médiévaux."
    - p: "Faut-il réserver son billet ?"
      r: "Oui, il est conseillé de réserver à l'avance, surtout en haute saison."
    - p: "Combien de temps dure la visite ?"
      r: "Environ une heure et demie."
    - p: "Que voir d'autre à proximité ?"
      r: "La basilique Santa Maria del Mar, le quartier du Born et la cathédrale."
boqueria:
  texto:
    - "La Boqueria, officiellement Mercat de Sant Josep, est le marché le plus célèbre de Barcelone et l'un des plus connus d'Europe. Il se trouve sur La Rambla et réunit des étals de fruits, de légumes, de viande, de poisson, de charcuterie, de douceurs et beaucoup de couleurs."
    - "En plus d'acheter des produits frais, on peut y manger et grignoter dans les bars du marché, qui servent des plats de cuisine catalane comme les œufs aux champignons, les calamars ou la tortilla. Les stands de fruits et de jus pressés sont à l'entrée, et les plus traditionnels à l'intérieur."
    - "Il y a énormément de monde, surtout à midi, et c'est une zone avec des pickpockets : surveillez donc vos affaires. Pour manger de façon plus authentique et moins chère, évitez les stands de l'entrée et enfoncez-vous vers l'intérieur, ou rendez-vous dans les rues voisines. Venez tôt le matin si vous voulez éviter la foule. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Qu'est-ce que la Boqueria ?"
      r: "Le marché le plus célèbre de Barcelone, officiellement Mercat de Sant Josep, situé sur La Rambla."
    - p: "Que peut-on manger ?"
      r: "Des tapas et des plats de cuisine catalane dans les bars du marché, ainsi que des fruits, des jus, de la charcuterie et des douceurs."
    - p: "Quel est le meilleur moment pour y aller ?"
      r: "Tôt le matin, avant l'arrivée de la foule."
    - p: "Est-ce cher ?"
      r: "Les stands de l'entrée sont les plus touristiques et les plus chers. Ceux de l'intérieur et des rues voisines sont généralement plus abordables."
    - p: "Y a-t-il un risque de pickpockets ?"
      r: "Oui, c'est une zone très fréquentée. Surveillez vos affaires."
giralda:
  texto:
    - "La Giralda est le symbole de Séville. C'était le minaret de l'ancienne mosquée almohade, construit au XIIe siècle, auquel les chrétiens ont ajouté au XVIe siècle un clocher Renaissance. Elle fait aujourd'hui partie de la cathédrale, classée au patrimoine mondial avec l'Alcázar et les Archives des Indes."
    - "Monter à la Giralda est l'une des expériences les plus populaires de la ville. Au lieu d'escaliers, elle possède des rampes qui, selon la tradition, permettaient de monter à cheval, et du haut on voit tout Séville, avec ses toits, les patios de la cathédrale et le fleuve. L'entrée de la tour inclut généralement la visite de la cathédrale."
    - "Achetez vos billets à l'avance et évitez les heures les plus chaudes. Dans la cathédrale, vous pouvez aussi voir le tombeau de Christophe Colomb et le retable principal. Prévoyez une heure et demie pour l'ensemble. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Qu'est-ce que la Giralda ?"
      r: "La tour de la cathédrale de Séville, ancien minaret de la mosquée almohade du XIIe siècle, auquel un clocher Renaissance a été ajouté par la suite."
    - p: "Peut-on monter ?"
      r: "Oui, par des rampes au lieu d'escaliers. Depuis le haut, la vue embrasse toute la ville."
    - p: "L'entrée est-elle payante ?"
      r: "L'entrée à la cathédrale et à la Giralda est payante, avec des conditions particulières à certains horaires. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
    - p: "Que voir d'autre dans la cathédrale ?"
      r: "Le tombeau de Colomb, le retable principal et le patio des Orangers."
    - p: "Combien de temps faut-il prévoir ?"
      r: "Environ une heure et demie pour la cathédrale et la tour."
torre-oro:
  texto:
    - "La Torre del Oro est une tour albarrane d'origine almohade, construite au début du XIIIe siècle au bord du Guadalquivir dans le cadre des défenses de la ville. Son nom est attribué aux reflets dorés de ses carreaux de faïence sur l'eau, ou à l'or arrivé d'Amérique qui y fut conservé."
    - "Elle abrite aujourd'hui un petit musée naval, avec des maquettes, des instruments et des documents sur l'histoire du port de Séville, et de sa terrasse on voit le fleuve et le centre historique. La visite est courte, d'environ 20 à 30 minutes, et se combine bien avec une promenade sur le paseo de Colón."
    - "C'est l'une des images les plus typiques de Séville, et elle est particulièrement belle au coucher du soleil, avec la lumière sur le fleuve. Profitez-en pour traverser le pont de Triana ou vous promener sur la berge. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Qu'est-ce que la Torre del Oro ?"
      r: "Une tour défensive d'origine almohade, du XIIIe siècle, au bord du Guadalquivir."
    - p: "Pourquoi s'appelle-t-elle ainsi ?"
      r: "On l'attribue aux reflets dorés de ses carreaux de faïence sur l'eau, ou à l'or arrivé d'Amérique."
    - p: "Peut-on la visiter ?"
      r: "Oui, elle abrite un musée naval. Consultez les horaires et les conditions."
    - p: "Combien de temps faut-il prévoir ?"
      r: "Environ 20 à 30 minutes."
    - p: "Quel est le meilleur moment pour la voir ?"
      r: "Au coucher du soleil, quand la lumière reflétée par le fleuve lui donne plus de couleur."
plaza-espana-sevilla:
  texto:
    - "La Plaza de España est l'une des plus belles places d'Espagne. Conçue par Aníbal González pour l'Exposition ibéro-américaine de 1929, elle a la forme d'un demi-cercle, avec un grand édifice de brique et de céramique, une tour à chaque extrémité et un canal traversé de ponts."
    - "Le long de la place, des bancs de faïence représentent les provinces espagnoles, chacune avec ses armoiries et une scène historique. On peut se promener sous les arcades, traverser les ponts et louer une barque sur le canal. Elle a servi de décor à des films, comme l'un de la saga Star Wars."
    - "L'entrée est libre et la place se trouve à côté du parc María Luisa. Venez tôt le matin ou en fin de journée, quand il y a moins de monde et une meilleure lumière, et évitez les heures les plus chaudes. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Qu'est-ce que la Plaza de España ?"
      r: "Une grande place semi-circulaire construite pour l'Exposition ibéro-américaine de 1929, œuvre d'Aníbal González."
    - p: "L'entrée est-elle payante ?"
      r: "Non, l'accès est libre. Les barques du canal, en revanche, sont payantes."
    - p: "Que voir ?"
      r: "Les bancs de faïence des provinces, les ponts, les tours et le canal."
    - p: "Quel est le meilleur moment pour y aller ?"
      r: "Tôt le matin ou en fin de journée, pour éviter la foule et la chaleur."
    - p: "Qu'y a-t-il à proximité ?"
      r: "Le parc María Luisa et le quartier de Santa Cruz."
universidad-salamanca:
  texto:
    - "L'Université de Salamanque est la plus ancienne d'Espagne encore en activité. Fondée en 1218, elle fut pendant des siècles l'un des grands centres du savoir européen, avec des figures comme Fray Luis de León ou Miguel de Unamuno liées à ses salles de cours."
    - "L'ensemble historique s'organise autour du Patio de Escuelas. La façade plateresque des Escuelas Mayores est l'une des images les plus reconnaissables de la ville, et on y trouve cachée une petite grenouille posée sur un crâne que les visiteurs cherchent par tradition. À l'intérieur, on parcourt les salles de cours historiques et la Bibliothèque ancienne, aux fonds de grande valeur."
    - "L'automne est un bon moment pour la visiter : la Bibliothèque ancienne fait partie de « Las llaves de la ciudad » (Les clés de la ville), le programme de visites guidées que Salamanque organise chaque année (en 2026, du 24 octobre au 20 décembre). Les personnes qui complètent le passeport du programme peuvent participer à un tirage au sort pour voir le sanctasanctórum de la bibliothèque. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Qu'est-ce qui est le plus connu à l'Université de Salamanque ?"
      r: "La façade plateresque des Escuelas Mayores, avec la grenouille cachée, et la Bibliothèque ancienne."
    - p: "Où se trouve la grenouille ?"
      r: "Sur la façade des Escuelas Mayores, sur un crâne. La tradition veut que l'on essaie de la trouver."
    - p: "Peut-on visiter la Bibliothèque ancienne ?"
      r: "Oui. Outre la visite habituelle, elle fait partie de « Las llaves de la ciudad », avec des visites guidées en automne. Consultez le site officiel pour les places et les conditions."
    - p: "Qu'est-ce que Las llaves de la ciudad ?"
      r: "Un programme annuel de visites guidées de sites patrimoniaux de Salamanque. La presse locale le présente comme gratuit, mais il faut réserver sur le site du Tourisme de Salamanque."
    - p: "Combien de temps faut-il prévoir ?"
      r: "Une à deux heures pour l'extérieur et les zones visitables. Davantage si vous ajoutez la Bibliothèque ancienne et les abords des cathédrales."
    - p: "Que voir d'autre à proximité ?"
      r: "Les Cathédrales, la Casa de las Conchas et la Clerecía sont à quelques minutes à pied."
teatro-real-madrid:
  texto:
    - "Le Teatro Real est l'opéra de Madrid. Inauguré en 1850, il a été le théâtre de grandes premières et accueille le meilleur de l'opéra, du ballet et de la musique classique ; il reste l'une des institutions culturelles les plus importantes d'Espagne."
    - "Il propose sa propre saison d'opéra, avec des productions de très haut niveau, mais programme aussi du ballet et des concerts. Le bâtiment se visite en outre avec un guide, ce qui permet de découvrir la salle, les loges, les ateliers et les coulisses d'un grand théâtre."
    - "Si vous souhaitez assister à une représentation, consultez la programmation et réservez à l'avance : les opéras les plus demandés affichent complet. Il existe des billets à différents prix, certains avec une visibilité réduite. Chaque 22 décembre, le tirage de la Loterie de Noël (Lotería de Navidad) a lieu ici. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Que peut-on faire au Teatro Real ?"
      r: "Assister à un opéra, un ballet ou un concert, ou faire une visite guidée du bâtiment."
    - p: "Peut-on le visiter sans assister à une représentation ?"
      r: "Oui, il existe des visites guidées du bâtiment. Consultez les horaires et la réservation sur le site officiel."
    - p: "Y a-t-il des billets bon marché ?"
      r: "Il existe des billets à différents prix, dont certains avec une visibilité réduite. Consultez les conditions sur le site."
    - p: "Comment s'habiller ?"
      r: "Il n'y a pas de code vestimentaire obligatoire, même si beaucoup de gens optent pour une tenue un peu plus soignée pour aller à l'opéra."
    - p: "Que voir d'autre à proximité ?"
      r: "Le Palais royal, la place d'Orient et la place Isabelle II sont à deux pas."
palau-musica-catalana:
  texto:
    - "Le Palau de la Música Catalana est un joyau du modernisme catalan, œuvre de Lluís Domènech i Montaner, inauguré en 1908. Avec l'Hôpital de Sant Pau, il fait partie de l'ensemble inscrit au patrimoine mondial de l'UNESCO et reste une salle de concerts en activité."
    - "La salle principale en est la grande attraction : une verrière inversée en verre coloré orne le plafond, entourée de sculptures, de mosaïques et de vitraux. Les détails décoratifs, avec des fleurs, des instruments et des figures, couvrent presque toutes les surfaces du bâtiment, et le somptueux auditorium possède une beauté très particulière."
    - "On peut le visiter avec un guide ou assister à un concert, qui est la meilleure façon de vivre la salle avec son acoustique. Réservez à l'avance, car les visites se remplissent vite. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Qu'est-ce que le Palau de la Música Catalana ?"
      r: "Une salle de concerts moderniste, œuvre de Domènech i Montaner, inaugurée en 1908 et inscrite au patrimoine mondial."
    - p: "Peut-on le visiter ?"
      r: "Oui, avec des visites guidées. Consultez les horaires et la réservation sur le site officiel."
    - p: "Vaut-il mieux le visiter ou assister à un concert ?"
      r: "Si vous le pouvez, un concert : vous voyez la salle en activité et profitez de l'acoustique. Sinon, la visite guidée permet de l'admirer en détail."
    - p: "Combien de temps dure la visite ?"
      r: "Environ une heure. Consultez la durée exacte sur le site."
    - p: "Que ne faut-il pas manquer ?"
      r: "La grande verrière en verre coloré de la salle de concerts."
catedral-barcelona:
  texto:
    - "La cathédrale de la Sainte-Croix et de Sainte-Eulalie est la cathédrale gothique de Barcelone, en plein quartier gothique. Elle a été construite entre le XIIIe et le XVe siècle ; sa façade principale date de la fin du XIXe siècle, bien qu'elle s'inspire du dessin médiéval d'origine."
    - "À l'intérieur, on remarque les nefs hautes et sombres, le chœur en bois sculpté, la crypte avec le tombeau de sainte Eulalie et le cloître, un havre de paix avec un jardin et une colonie de treize oies qui y vivent depuis des siècles. On peut aussi monter en ascenseur sur la terrasse pour contempler la ville d'en haut."
    - "Beaucoup de personnes visitent la cathédrale pendant les horaires de culte, avec une entrée gratuite limitée ; il existe également un billet payant pour le parcours touristique. Respectez le caractère religieux du lieu et portez une tenue adaptée. Le dimanche, devant la cathédrale, on danse généralement la sardane. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Que voir à la cathédrale de Barcelone ?"
      r: "Le chœur, la crypte de sainte Eulalie, le cloître avec les oies et la vue depuis la terrasse."
    - p: "Pourquoi y a-t-il des oies dans le cloître ?"
      r: "C'est une tradition séculaire : il y a treize oies, qui rappellent l'âge de sainte Eulalie à sa mort selon la légende."
    - p: "Peut-on monter sur la terrasse ?"
      r: "Oui, un ascenseur mène à la terrasse, avec un billet à part. Consultez les conditions."
    - p: "Est-ce gratuit ?"
      r: "Il existe des horaires de culte avec un accès limité et un billet payant pour le parcours touristique. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
    - p: "Comment s'habiller ?"
      r: "Une tenue discrète, avec les épaules et les genoux couverts, par respect pour le caractère religieux du lieu."
    - p: "Qu'est-ce que la sardane ?"
      r: "Une danse traditionnelle catalane que l'on danse en ronde. Elle a généralement lieu devant la cathédrale certains jours ; consultez l'horaire."
teatro-museo-dali:
  texto:
    - "Le Théâtre-Musée Dalí, à Figueres, est le grand musée consacré à Salvador Dalí, créé par l'artiste lui-même dans l'ancien théâtre municipal de sa ville natale et inauguré en 1974. C'est une œuvre d'art à part entière, un espace surréaliste conçu par Dalí comme un unique objet théâtral."
    - "Le parcours comprend une immense coupole géodésique, la cour avec la Cadillac sous la pluie, la salle Mae West, des œuvres de toutes les époques de l'artiste et la crypte où il est enterré. C'est un musée plein de surprises et de détails, avec une collection qui va de ses premières œuvres aux dernières."
    - "Figueres se trouve à environ deux heures de Barcelone et à un peu plus d'une heure de la Costa Brava. Réservez à l'avance, car les billets s'épuisent en été, et combinez la visite avec la Maison de Dalí à Portlligat et le château de Púbol pour compléter ce que l'on appelle le triangle dalinien. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Qui a créé le Théâtre-Musée Dalí ?"
      r: "Salvador Dalí lui-même, qui l'a conçu dans l'ancien théâtre municipal de Figueres, inauguré comme musée en 1974."
    - p: "Où est enterré Dalí ?"
      r: "Dans une crypte du Théâtre-Musée lui-même, à Figueres."
    - p: "Combien de temps faut-il prévoir ?"
      r: "Entre deux et trois heures."
    - p: "Faut-il réserver son billet ?"
      r: "Oui, il est conseillé de réserver à l'avance, surtout en été."
    - p: "Que voir d'autre de Dalí ?"
      r: "La Maison de Dalí à Portlligat (Cadaqués) et le château de Púbol, qui forment le triangle dalinien."
    - p: "Comment venir depuis Barcelone ?"
      r: "En train ou en bus jusqu'à Figueres, en environ deux heures."
lonja-seda:
  texto:
    - "La Lonja de la Seda (la Bourse de la soie) est l'un des grands monuments du gothique civil européen et est inscrite au patrimoine mondial de l'UNESCO depuis 1996. Elle a été construite entre le XVe et le XVIe siècle pour accueillir les transactions commerciales de la soie, à l'époque de plus grande splendeur de Valence."
    - "Le plus spectaculaire est la Salle des Contrats (Sala de Contratación), une grande nef dont les colonnes hélicoïdales s'ouvrent comme des palmiers jusqu'à former des voûtes. Le bâtiment possède en outre un patio d'orangers, une tour et une salle du Consulat de la Mer, avec un plafond en bois polychrome."
    - "C'est une visite courte, d'environ une heure, située dans le centre, à côté du Marché central. Combinez-la avec la cathédrale et le Miguelete. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Qu'est-ce que la Lonja de la Seda ?"
      r: "Un édifice gothique civil du XVe siècle, ancien siège des transactions de la soie, inscrit au patrimoine mondial."
    - p: "Que voir ?"
      r: "La Salle des Contrats avec ses colonnes hélicoïdales, le patio d'orangers et la salle du Consulat de la Mer."
    - p: "Combien de temps faut-il prévoir ?"
      r: "Environ une heure."
    - p: "Où se trouve-t-elle ?"
      r: "Dans le centre de Valence, à côté du Marché central."
    - p: "Est-elle inscrite au patrimoine mondial ?"
      r: "Oui, depuis 1996, par décision de l'UNESCO."
catedral-valencia:
  texto:
    - "La cathédrale de Valence est un édifice gothique comportant des éléments romans, Renaissance et baroques qui reflètent des siècles d'histoire. Elle se trouve en plein centre, à côté de la place de la Vierge, et c'est le grand temple de la ville."
    - "Dans sa chapelle du Saint Calice, elle conserve une coupe que la tradition considère comme le Saint Graal, un objet de grande dévotion. Ses portes sont également remarquables, comme celle des Apôtres, où se réunit chaque jeudi à midi le Tribunal des Eaux, l'institution la plus ancienne d'Europe encore en fonctionnement. On peut aussi monter au Miguelete, sa tour-clocher."
    - "Respectez le caractère religieux du lieu et portez une tenue adaptée. Consultez les horaires de visite, car certaines zones sont fermées pendant le culte. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Qu'est-ce que le Saint Calice ?"
      r: "Une coupe que la tradition considère comme le Saint Graal et qui est vénérée dans une chapelle de la cathédrale."
    - p: "Qu'est-ce que le Tribunal des Eaux ?"
      r: "Une institution médiévale qui règle chaque jeudi à midi les conflits d'irrigation de la huerta, devant la porte des Apôtres."
    - p: "Peut-on monter à la tour ?"
      r: "Oui, au Miguelete, la tour-clocher. Consultez les conditions d'accès."
    - p: "Est-ce gratuit ?"
      r: "Il existe un billet pour le parcours touristique. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
    - p: "Comment s'habiller ?"
      r: "Une tenue discrète, avec les épaules et les genoux couverts, par respect pour le caractère religieux du lieu."
museo-picasso-malaga:
  texto:
    - "Le Museo Picasso Málaga est consacré à l'artiste le plus universel né dans la ville, en 1881. Il se trouve dans le Palais de Buenavista, un édifice Renaissance du XVIe siècle situé dans le centre historique, et réunit des œuvres de différentes périodes de sa vie, en grande partie données par sa famille."
    - "La collection retrace le parcours de Picasso, de ses premières œuvres jusqu'à sa dernière période, avec de la peinture, du dessin, de la sculpture, de la céramique et de l'art graphique. Le bâtiment conserve en outre des vestiges archéologiques phéniciens et romains visibles au sous-sol, et des expositions temporaires y sont organisées."
    - "C'est une belle visite d'une heure et demie à deux heures. Combinez-la avec la maison natale de Picasso, toute proche, sur la place de la Merced, et avec une promenade dans le centre. Réservez à l'avance en haute saison. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Picasso est-il né à Malaga ?"
      r: "Oui, il est né à Malaga en 1881. Le musée se trouve dans le centre historique de la ville."
    - p: "Que trouve-t-on dans le musée ?"
      r: "De la peinture, du dessin, de la sculpture, de la céramique et de l'art graphique de différentes périodes de Picasso."
    - p: "Combien de temps faut-il prévoir ?"
      r: "Entre une heure et demie et deux heures."
    - p: "Faut-il réserver ?"
      r: "Il est recommandé de réserver en haute saison."
    - p: "Que voir d'autre à proximité ?"
      r: "La maison natale de Picasso, la place de la Merced et la cathédrale."
alcazaba-malaga:
  texto:
    - "L'Alcazaba de Malaga est une forteresse-palais musulmane du XIe siècle, l'une des mieux conservées d'Espagne. Elle se dresse sur une colline en plein centre-ville, avec des patios, des jardins, des fontaines, des remparts et des vues sur le port et sur la ville."
    - "Le parcours monte à travers plusieurs portes et patios jusqu'aux palais nasrides, avec des arcs en fer à cheval, des plâtres sculptés et des bassins. Depuis les remparts, on aperçoit la cathédrale, le port et le Théâtre romain, qui se trouve juste à ses pieds. Une autre forteresse, le château de Gibralfaro, lui est reliée par un chemin fortifié."
    - "Portez des chaussures confortables et emportez de l'eau et une protection solaire, car il y a des pentes et des escaliers. Évitez les heures les plus chaudes et prévoyez une heure et demie à deux heures pour la visite. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Qu'est-ce que l'Alcazaba de Malaga ?"
      r: "Une forteresse-palais musulmane du XIe siècle, avec des patios, des jardins et des vues sur la ville."
    - p: "Que voir ?"
      r: "Les patios, les jardins, les palais nasrides et les vues sur le port depuis les remparts."
    - p: "Combien de temps faut-il prévoir ?"
      r: "Entre une heure et demie et deux heures."
    - p: "Comment y monte-t-on ?"
      r: "À pied, par des rampes et des escaliers. Un ascenseur part de l'extérieur sur certains tronçons ; renseignez-vous sur l'accessibilité."
    - p: "Qu'y a-t-il à proximité ?"
      r: "Le Théâtre romain, la cathédrale et le Musée Picasso."
plaza-mayor-salamanca:
  texto:
    - "La Plaza Mayor de Salamanque est l'une des plus belles d'Espagne et le cœur de la vie de la ville. C'est une place baroque en pierre dorée, construite au XVIIIe siècle sur un projet d'Alberto de Churriguera, avec des arcades continues et un ensemble très harmonieux."
    - "Sur les arcs et les façades, des médaillons présentent en relief des personnages de l'histoire d'Espagne, et l'un des côtés abrite l'Hôtel de ville, la Casa Consistorial. De jour, c'est un bon endroit pour prendre un café sous les arcades, et de nuit, avec l'éclairage, elle gagne beaucoup en charme."
    - "Cet automne, la Casa Consistorial participe à « Las llaves de la ciudad » (Les clés de la ville), le programme de visites de la mairie (en 2026, du 24 octobre au 20 décembre), qui ouvre certaines de ses salles. Consultez toujours le site officiel pour connaître les horaires et les conditions de visite, qui changent."
  faq:
    - p: "Qui a conçu la Plaza Mayor ?"
      r: "Alberto de Churriguera, au XVIIIe siècle, dans le style baroque de Salamanque."
    - p: "Que sont les médaillons ?"
      r: "Des reliefs avec des portraits de personnages de l'histoire d'Espagne qui décorent les arcs et les façades de la place."
    - p: "Peut-on visiter l'Hôtel de ville ?"
      r: "Il ouvre ses portes aux visites pendant « Las llaves de la ciudad », qui a lieu en automne. Consultez le site officiel de l'office de tourisme de Salamanque pour les dates et les réservations."
    - p: "Quel est le meilleur moment pour y aller ?"
      r: "De jour pour se promener et prendre un café, et à la tombée de la nuit, lorsque l'éclairage met en valeur la pierre dorée."
    - p: "Que voir d'autre à proximité ?"
      r: "La Casa de las Conchas, l'Université et les Cathédrales, toutes à quelques minutes à pied."
catedrales-salamanca:
  texto:
    - "Salamanque possède deux cathédrales accolées : la Vieille, romane et du XIIe siècle, et la Nouvelle, gothique et construite entre le XVIe et le XVIIIe siècle. On les visite ensemble et elles comptent parmi les visites incontournables de la ville."
    - "La Cathédrale Vieille conserve un intérieur recueilli et un retable très admiré, et la Nouvelle se distingue par ses voûtes et sa grande hauteur. Sur la Porte des Rameaux (Puerta de Ramos) de la Cathédrale Nouvelle, on trouve des détails curieux ajoutés lors d'une restauration récente, comme un astronaute et un dragon qui mange une glace, que les visiteurs aiment chercher."
    - "Les tours sont accessibles par un parcours à l'intérieur de la cathédrale et offrent des vues sur la ville. Réservez à l'avance en haute saison et combinez la visite avec l'Université et la Casa de las Conchas, qui sont tout près. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Quelle différence y a-t-il entre la Cathédrale Vieille et la Nouvelle ?"
      r: "La Vieille est romane, du XIIe siècle. La Nouvelle est gothique, construite entre le XVIe et le XVIIIe siècle."
    - p: "Où se trouve l'astronaute ?"
      r: "Sur la Porte des Rameaux de la Cathédrale Nouvelle. À ses côtés, on trouve d'autres figures curieuses, comme un dragon avec une glace."
    - p: "Peut-on monter aux tours ?"
      r: "Oui, les tours sont accessibles et offrent des vues sur la ville. Consultez le site officiel pour les billets et les horaires."
    - p: "Combien de temps faut-il prévoir ?"
      r: "Entre une et deux heures pour voir les deux cathédrales, davantage si vous montez aux tours."
    - p: "Faut-il réserver ?"
      r: "C'est recommandé en haute saison, le week-end et les jours fériés."
    - p: "Que voir d'autre à proximité ?"
      r: "L'Université, la Casa de las Conchas et la Clerecía sont à quelques minutes à pied."
galeria-de-las-colecciones-reales:
  texto:
    - "La Galería de las Colecciones Reales est un musée situé à côté du Palais royal de Madrid, consacré aux collections que la Couronne d'Espagne a réunies au fil des siècles. On y découvre des tapisseries, des peintures, du mobilier, des carrosses et des pièces de grande valeur historique et artistique."
    - "L'édifice, de conception contemporaine, donne sur la vallée du Manzanares et sur la Casa de Campo. Son parcours organise les œuvres par époques et par rois, et permet de comprendre comment s'est constitué le patrimoine artistique de la monarchie espagnole."
    - "C'est une bonne visite complémentaire du Palais royal, que l'on peut faire en une ou deux heures. Si vous comptez combiner les deux, regardez s'il existe des billets combinés et réservez à l'avance. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Que trouve-t-on à la Galería de las Colecciones Reales ?"
      r: "Des tapisseries, des peintures, du mobilier, des carrosses et d'autres pièces des collections de la Couronne."
    - p: "Où se trouve-t-elle ?"
      r: "À côté du Palais royal de Madrid, face à la vallée du Manzanares."
    - p: "Combien de temps faut-il prévoir ?"
      r: "Entre une et deux heures."
    - p: "Peut-on la combiner avec le Palais royal ?"
      r: "Oui, les deux sont très proches. Consultez le site officiel pour savoir s'il existe des billets combinés."
    - p: "Faut-il réserver ?"
      r: "Il est recommandé de réserver en haute saison et le week-end."
castillo-santa-barbara:
  texto:
    - "Le château de Santa Bárbara domine Alicante depuis le sommet du mont Benacantil et constitue le grand belvédère de la ville. C'est une forteresse médiévale riche de plusieurs siècles d'histoire, agrandie à différentes époques, qui offre des vues spectaculaires sur la baie, le port et la côte."
    - "On peut y monter à pied par un sentier ou en voiture, mais aussi en ascenseur depuis la plage du Postiguet. Le parcours comprend des cours, des remparts, des salles et un petit musée qui retrace l'histoire du château et de la ville. Au coucher du soleil, la lumière sur la baie est particulièrement belle."
    - "Apportez des chaussures confortables, de l'eau et une protection solaire : en été, il fait très chaud et il y a peu d'ombre. Prévoyez entre une et deux heures de visite. Renseignez-vous sur les conditions d'accès et sur l'existence éventuelle d'un droit d'entrée. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Comment monte-t-on au château ?"
      r: "À pied par un sentier, en voiture ou en ascenseur depuis la plage du Postiguet."
    - p: "L'entrée est-elle gratuite ?"
      r: "Consultez les conditions d'accès sur le site officiel, car elles peuvent changer."
    - p: "Combien de temps faut-il prévoir ?"
      r: "Entre une et deux heures, selon ce que vous visitez."
    - p: "Quel est le meilleur moment pour y aller ?"
      r: "Au coucher du soleil, pour éviter la chaleur et voir la ville sous sa plus belle lumière."
    - p: "Quels vêtements et quelles chaussures faut-il prévoir ?"
      r: "Des chaussures confortables, une casquette, de l'eau et une protection solaire, surtout en été."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Oui, même s'il y a des côtes et des escaliers. L'ascenseur facilite l'accès."
casa-pilatos:
  texto:
    - "La Casa de Pilatos est l'un des plus beaux palais de Séville, un mélange de styles mudéjar, gothique et Renaissance italienne. Construite à la fin du XVe siècle et au début du XVIe siècle par la famille Enríquez de Ribera, elle appartient aujourd'hui à la maison ducale de Medinaceli."
    - "Elle se distingue par son patio principal, avec ses arcs, ses azulejos et ses stucs, ainsi que par ses jardins. Elle conserve l'une des plus importantes collections d'azulejos d'Espagne, ainsi que des sculptures classiques, des plafonds à caissons et un escalier à coupole. Le parcours comprend un rez-de-chaussée et un étage, ce dernier avec visite guidée."
    - "C'est une visite agréable, d'environ une heure, moins fréquentée que l'Alcázar. Elle se trouve dans le centre, près du quartier de Santa Cruz et de la place du Salvador. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Qu'est-ce que la Casa de Pilatos ?"
      r: "Un palais sévillan des XVe et XVIe siècles, mêlant les styles mudéjar, gothique et Renaissance."
    - p: "Que voir ?"
      r: "Le patio principal avec ses azulejos, les jardins, les sculptures classiques et l'escalier à coupole."
    - p: "Combien de temps faut-il prévoir ?"
      r: "Environ une heure."
    - p: "À qui appartient-elle ?"
      r: "Elle appartient à la maison ducale de Medinaceli."
    - p: "Où se trouve-t-elle ?"
      r: "Dans le centre de Séville, près du quartier de Santa Cruz."
barrio-santa-cruz:
  texto:
    - "Le quartier de Santa Cruz est l'ancien quartier juif de Séville et l'un des coins les plus charmants du centre historique. Ses ruelles étroites, ses places plantées d'orangers, ses maisons blanchies à la chaux et ses patios fleuris forment un labyrinthe fait pour se perdre."
    - "Parmi ses lieux les plus connus figurent la place de Doña Elvira, la calle Agua, la place de los Venerables et les jardins de Murillo. On y ressent la Séville la plus traditionnelle, avec ses tavernes, ses boutiques d'artisanat et ses recoins tranquilles à quelques mètres de la cathédrale et de l'Alcázar."
    - "Le mieux est de le parcourir à pied, sans se presser et sans carte, tôt le matin ou au coucher du soleil, quand il y a moins de monde. Aux heures centrales de la journée, il se remplit de touristes et il y fait très chaud. Surveillez vos affaires et goûtez une tapa dans l'une des tavernes du quartier. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Qu'est-ce que le quartier de Santa Cruz ?"
      r: "L'ancien quartier juif de Séville, avec ses rues étroites, ses places plantées d'orangers et ses maisons blanchies à la chaux."
    - p: "Que voir ?"
      r: "La place de Doña Elvira, la calle Agua, la place de los Venerables et les jardins de Murillo."
    - p: "Quel est le meilleur moment pour y aller ?"
      r: "Tôt le matin ou au coucher du soleil, pour éviter la chaleur et la foule."
    - p: "Est-ce sûr ?"
      r: "C'est une zone très fréquentée ; il est donc conseillé de surveiller ses affaires."
    - p: "Que trouve-t-on d'autre à proximité ?"
      r: "La cathédrale, la Giralda, l'Alcázar et la Casa de Pilatos."
catedral-malaga:
  texto:
    - "La cathédrale de Malaga est une grande église de style Renaissance construite entre le XVIe et le XVIIIe siècle. On l'appelle La Manquita (la Manchote) parce qu'une seule de ses tours a été achevée : selon la tradition, l'argent prévu pour la seconde fut affecté à d'autres usages."
    - "À l'intérieur, on remarque son chœur en bois sculpté, ses hautes voûtes et ses chapelles. On peut monter sur le toit, d'où l'on voit la ville, le port et l'Alcazaba, avec un panorama très complet sur le centre historique."
    - "Respectez le caractère religieux du lieu et adoptez une tenue appropriée. Prévoyez entre une heure et une heure et demie de visite. Renseignez-vous sur les horaires, qui varient selon les offices. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Pourquoi l'appelle-t-on La Manquita ?"
      r: "Parce qu'une seule des deux tours prévues a été achevée."
    - p: "Que voir ?"
      r: "Le chœur en bois sculpté, les chapelles et les vues depuis le toit."
    - p: "Peut-on monter sur le toit ?"
      r: "Oui, avec un billet à part. Renseignez-vous sur les conditions."
    - p: "Combien de temps faut-il prévoir ?"
      r: "Entre une heure et une heure et demie."
    - p: "Quelle tenue faut-il porter ?"
      r: "Une tenue discrète, avec les épaules et les genoux couverts, par respect pour le caractère religieux du lieu."
basilica-nuestra-senora-pilar:
  texto:
    - "La basilique Notre-Dame-du-Pilier (Basílica de Nuestra Señora del Pilar) est le grand symbole de Saragosse et l'un des principaux sanctuaires mariaux d'Espagne. Elle s'élève au bord de l'Èbre et abrite la Vierge du Pilier, une petite statue posée sur une colonne de jaspe qui attire des pèlerins du monde entier, surtout chaque 12 octobre."
    - "Le temple, de style baroque, se distingue par ses onze coupoles recouvertes d'azulejos colorés et par les peintures de la coupole du chœur, œuvre de Goya et de Francisco Bayeu. À l'intérieur se trouve la Santa Capilla, où la Vierge est vénérée, et sur un côté sont conservées les bombes tombées en 1936 sans avoir explosé. On peut aussi monter dans l'une des tours pour admirer la ville d'en haut."
    - "C'est un lieu de culte : respectez donc le silence et adoptez une tenue appropriée. La visite peut se combiner avec la place du Pilar, la cathédrale de La Seo et la Lonja, tous très proches. Si vous venez en octobre, vous tomberez en pleine Fiesta del Pilar et Offrande de fleurs. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Qu'est-ce que la Vierge du Pilier ?"
      r: "Une petite statue de la Vierge posée sur une colonne de jaspe, vénérée dans la Santa Capilla de la basilique, patronne de Saragosse et de l'Hispanité."
    - p: "Que voir dans la basilique ?"
      r: "Les coupoles aux peintures de Goya et de Bayeu, la Santa Capilla, les bombes de 1936 et le musée du Pilar."
    - p: "Peut-on monter dans la tour ?"
      r: "Oui, il y a un belvédère dans l'une des tours. Renseignez-vous sur les conditions d'accès."
    - p: "L'entrée est-elle payante ?"
      r: "L'entrée de la basilique est libre ; l'accès à la tour et au musée est payant. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
    - p: "Quand a lieu l'Offrande de fleurs ?"
      r: "Le 12 octobre, pendant les Fiestas del Pilar."
    - p: "Quelle tenue faut-il porter ?"
      r: "Une tenue discrète, avec les épaules et les genoux couverts, par respect pour le caractère religieux du lieu."
palacio-aljaferia:
  texto:
    - "Le palais de l'Aljafería est un joyau de l'art hispano-musulman, construit au XIe siècle comme résidence des rois de la taifa de Saragosse. C'est le meilleur exemple d'architecture islamique du nord de la péninsule et un monument unique, qui conserve des éléments de toutes les époques."
    - "Le plus impressionnant est le patio de Santa Isabel, avec ses arcs entrelacés, et l'oratoire, un petit espace qui fut une mosquée, avec un mihrab d'une grande richesse décorative. Après la conquête chrétienne ont été ajoutés le palais des Rois Catholiques, avec son plafond à caissons doré, et la salle du Trône. La tour du Troubadour est célèbre pour avoir inspiré l'opéra de Verdi."
    - "Aujourd'hui, il abrite les Cortes d'Aragon ; certaines zones ont donc des horaires limités. Il fait partie de l'ensemble de l'architecture mudéjare d'Aragon, classé au patrimoine mondial. Prévoyez une heure et demie de visite. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Qu'est-ce que l'Aljafería ?"
      r: "Un palais hispano-musulman du XIe siècle, qui fut la résidence des rois de la taifa de Saragosse et abrite aujourd'hui les Cortes d'Aragon."
    - p: "Que voir ?"
      r: "Le patio de Santa Isabel, l'oratoire, le palais des Rois Catholiques et la tour du Troubadour."
    - p: "Est-il classé au patrimoine mondial ?"
      r: "Oui, il fait partie de l'ensemble de l'architecture mudéjare d'Aragon."
    - p: "Combien de temps faut-il prévoir ?"
      r: "Environ une heure et demie."
    - p: "L'entrée est-elle gratuite ?"
      r: "Il existe des créneaux d'entrée gratuite. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
museo-guggenheim:
  texto:
    - "Le musée Guggenheim de Bilbao est l'édifice le plus célèbre de la ville et l'un des musées d'art contemporain les plus visités d'Europe. Œuvre de Frank Gehry, inauguré en 1997, il a transformé l'image de Bilbao avec ses formes courbes recouvertes de titane, au bord de la ría du Nervión."
    - "Avant d'entrer, cela vaut la peine de faire le tour du bâtiment et de découvrir les sculptures extérieures : Puppy, le grand chien couvert de fleurs de Jeff Koons, Maman, l'araignée géante de Louise Bourgeois, et les Tulips de Koons. À l'intérieur, le musée accueille des expositions temporaires d'art moderne et contemporain ainsi que des œuvres permanentes de grand format, comme La Matière du temps de Richard Serra."
    - "Réservez votre billet à l'avance en haute saison et prévoyez entre deux et trois heures de visite. On peut se promener gratuitement à l'extérieur, le long de la ría, et l'édifice est particulièrement beau à l'aube et au coucher du soleil. Si vous avez peu de temps, privilégiez la salle de Serra et une exposition temporaire. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Qui a conçu le Guggenheim de Bilbao ?"
      r: "L'architecte Frank Gehry. Le musée a été inauguré en 1997."
    - p: "Que voir ?"
      r: "À l'extérieur, Puppy, Maman et les Tulips ; à l'intérieur, La Matière du temps de Richard Serra et les expositions temporaires."
    - p: "Combien de temps faut-il prévoir ?"
      r: "Entre deux et trois heures pour une visite complète."
    - p: "Faut-il réserver son billet ?"
      r: "Il est recommandé de réserver à l'avance en haute saison et le week-end."
    - p: "Peut-on voir l'extérieur gratuitement ?"
      r: "Oui, la promenade extérieure le long de la ría et les sculptures se découvrent sans billet."
    - p: "Est-ce une bonne idée avec des enfants ?"
      r: "Oui, l'extérieur et les sculptures plaisent généralement aux petits, et le musée propose des activités pour les familles."
catedral-santiago-compostela:
  texto:
    - "La cathédrale de Saint-Jacques-de-Compostelle est le point d'arrivée du Chemin de Saint-Jacques et l'un des grands temples de la chrétienté. Elle abrite, selon la tradition, les restes de l'apôtre Jacques et se trouve au cœur d'une ville classée au patrimoine mondial de l'humanité, où arrivent des pèlerins du monde entier."
    - "L'édifice est avant tout roman, avec des ajouts gothiques, Renaissance et baroques, comme la grande façade de l'Obradoiro. Le plus précieux est le Portique de la Gloire, chef-d'œuvre du maître Mateo datant du XIIe siècle, ainsi que la crypte qui abrite le tombeau de l'apôtre. Traditionnellement, les pèlerins étreignent la statue de saint Jacques et se recueillent devant la tombe. Le botafumeiro, le grand encensoir, est utilisé lors de certaines célébrations."
    - "La messe du pèlerin a lieu à midi et fait souvent salle comble : arrivez donc en avance. La place de l'Obradoiro, devant la façade, est le lieu où de nombreux pèlerins terminent leur voyage. Renseignez-vous sur les horaires de visite, sur ceux des toits et sur les célébrations où le botafumeiro est utilisé. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Qu'est-ce que la cathédrale de Saint-Jacques ?"
      r: "Le grand temple de Saint-Jacques-de-Compostelle, point d'arrivée du Chemin de Saint-Jacques, où repose, selon la tradition, l'apôtre."
    - p: "Qu'est-ce que le Portique de la Gloire ?"
      r: "Un chef-d'œuvre de la sculpture romane du maître Mateo, datant du XIIe siècle, situé à l'entrée de la cathédrale."
    - p: "Qu'est-ce que le botafumeiro ?"
      r: "Un grand encensoir qui se balance à travers le transept lors de certaines célébrations. Consultez les dates sur le site officiel."
    - p: "Quand a lieu la messe du pèlerin ?"
      r: "Elle se célèbre normalement à midi. Arrivez en avance, car la cathédrale se remplit. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
    - p: "Peut-on monter sur les toits ?"
      r: "Oui, il existe des visites des toits sur réservation. Renseignez-vous sur les conditions."
    - p: "Est-elle classée au patrimoine mondial ?"
      r: "Oui, la vieille ville de Saint-Jacques-de-Compostelle et le Chemin de Saint-Jacques sont classés au patrimoine mondial."
hostal-reyes-catolicos:
  texto:
    - "L'Hostal de los Reyes Católicos est un grand édifice de style plateresque situé sur la place de l'Obradoiro, à côté de la cathédrale. Fondé en 1499 par les Rois Catholiques comme hôpital pour les pèlerins, c'est aujourd'hui un parador, considéré comme l'un des plus anciens hôtels du monde."
    - "On y admire son spectaculaire portail plateresque, orné de reliefs et de sculptures, et ses quatre cloîtres Renaissance avec fontaines et arcades. À l'intérieur se trouvent une chapelle, des salons et une galerie d'exposition. Bien qu'il s'agisse d'un hôtel, certaines parties de l'édifice se visitent."
    - "Renseignez-vous sur les conditions de visite, car certaines zones sont réservées aux clients. Une option consiste à déjeuner ou à prendre un verre à son restaurant ou à sa cafétéria, et à voir les cloîtres. Consultez toujours le site officiel pour connaître les horaires, les billets et les conditions d'accès, qui changent."
  faq:
    - p: "Qu'est-ce que l'Hostal de los Reyes Católicos ?"
      r: "Un édifice plateresque de 1499, créé comme hôpital pour les pèlerins et aujourd'hui parador, à côté de la cathédrale de Saint-Jacques."
    - p: "Peut-on le visiter ?"
      r: "Certaines zones, comme les cloîtres, oui. Renseignez-vous sur les conditions."
    - p: "Que voir ?"
      r: "Le portail plateresque, les cloîtres et la chapelle."
    - p: "Est-ce l'hôtel le plus ancien du monde ?"
      r: "On le considère comme l'un des plus anciens, car il accueille des pèlerins depuis le XVe siècle."
    - p: "Où se trouve-t-il ?"
      r: "Sur la place de l'Obradoiro, à côté de la cathédrale."
