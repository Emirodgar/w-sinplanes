museo-nacional-prado:
  texto:
    - "Il Museo Nazionale del Prado è la grande pinacoteca della Spagna e una delle più importanti al mondo. Ha aperto i battenti nel 1819 e riunisce una straordinaria collezione di pittura europea, particolarmente ricca tra il XVI e il XIX secolo."
    - "Tra le sue opere più celebri ci sono Las Meninas di Velázquez, le Majas e le fucilazioni del 3 maggio di Goya, Il giardino delle delizie di Bosch e vari capolavori di El Greco, Tiziano o Rubens. È impossibile vedere tutto in una sola visita, quindi conviene scegliere quali sale privilegiare."
    - "La cosa migliore è andarci con un piano: scegli tra tre e cinque opere o sale, consulta la pianta e prenota il biglietto in anticipo in alta stagione. Il museo offre fasce di ingresso gratuito, che di solito sono molto affollate. Abbina la visita al Retiro, che è lì accanto, e al Reina Sofía e al Thyssen, che completano il cosiddetto Paseo del Arte."
  faq:
    - p: "Cosa non bisogna perdersi al Prado?"
      r: "Las Meninas, le Majas e le fucilazioni del 3 maggio di Goya, Il giardino delle delizie di Bosch e opere di El Greco, Tiziano e Rubens. Scegli prima cosa vedere, perché il museo è enorme."
    - p: "Quanto tempo ci vuole?"
      r: "Tra due e tre ore per una visita selettiva. Se vuoi vederlo con calma, prevedi mezza giornata oppure dividi la visita in due."
    - p: "Quando è gratis?"
      r: "Il museo prevede fasce di ingresso gratuito nel corso della settimana. Consulta sempre il sito ufficiale per orari, biglietti e condizioni di accesso, che cambiano."
    - p: "Bisogna prenotare il biglietto?"
      r: "Si consiglia di acquistare il biglietto in anticipo, soprattutto in alta stagione, nei fine settimana e nei giorni festivi, per evitare le code."
    - p: "Si possono fare foto?"
      r: "Le condizioni su fotografie e zaini sono stabilite dal museo e cambiano. Consultale sul sito ufficiale prima di andare."
    - p: "È un buon programma con i bambini?"
      r: "Sì, con una visita breve e concentrata su poche opere. Il museo offre materiali e attività per le famiglie; consultali sul suo sito."
museo-reina-sofia:
  texto:
    - "Il Museo Reina Sofía è il grande museo d'arte del Novecento e contemporanea della Spagna. Ha sede nell'antico Hospital General de San Carlos, un edificio del XVIII secolo a cui sono state aggiunte torri di vetro progettate da Jean Nouvel."
    - "Il suo pezzo più famoso è Guernica di Picasso, che occupa una sala tutta per sé ed è accompagnato da bozzetti e studi del dipinto. La collezione comprende inoltre Dalí, Miró, Juan Gris e altri nomi delle avanguardie, oltre a un buon excursus sull'arte spagnola ed europea dell'ultimo secolo."
    - "Guernica tende a concentrare la maggior parte dei visitatori, quindi conviene vederlo a prima ora o nelle fasce con meno affluenza. Poi percorri con calma il resto della collezione. Il museo organizza mostre temporanee e ha una caffetteria e una libreria molto fornita. Consulta sempre il sito ufficiale per orari, biglietti e condizioni di accesso, che cambiano."
  faq:
    - p: "Dov'è Guernica?"
      r: "Al Museo Reina Sofía, in una sala tutta sua, insieme a bozzetti e studi dell'opera."
    - p: "Cos'altro c'è nel museo?"
      r: "Opere di Dalí, Miró, Juan Gris e altri artisti delle avanguardie, oltre ad arte spagnola ed europea del Novecento e contemporanea."
    - p: "Quando è gratis?"
      r: "Il museo prevede fasce di ingresso gratuito. Consulta sempre il sito ufficiale per orari, biglietti e condizioni di accesso, che cambiano."
    - p: "Quanto tempo ci vuole?"
      r: "Tra due e tre ore per una visita selettiva, Guernica compreso."
    - p: "Bisogna prenotare il biglietto?"
      r: "Si consiglia di prenotare in anticipo in alta stagione e nei fine settimana."
    - p: "Cos'altro c'è da vedere nei dintorni?"
      r: "Il Museo del Prado, il Thyssen e il Retiro sono a pochi minuti a piedi. L'insieme è noto come Paseo del Arte."
museo-thyssen-bornemisza:
  texto:
    - "Il Museo Thyssen-Bornemisza completa il cosiddetto Paseo del Arte di Madrid, insieme al Prado e al Reina Sofía. La sua collezione attraversa otto secoli di pittura, dal gotico alle avanguardie del Novecento, e si gode con un percorso cronologico molto facile da seguire."
    - "Riunisce opere di grandi maestri, dai primitivi italiani e fiamminghi agli impressionisti, agli espressionisti e agli artisti del Novecento, in un edificio che un tempo era il palazzo di Villahermosa. È un museo a misura d'uomo, con una visita più abbordabile di quella del Prado."
    - "Se hai poco tempo, è una buona opzione per una visita di due ore. Il percorso inizia dal piano superiore con l'arte più antica e scende verso il presente. Approfitta per vedere le mostre temporanee e per passeggiare poi al Retiro. Consulta sempre il sito ufficiale per orari, biglietti e condizioni di accesso, che cambiano."
  faq:
    - p: "Che tipo di arte c'è al Thyssen?"
      r: "Pittura europea di otto secoli, dal gotico alle avanguardie del Novecento, con opere di maestri antichi, impressionisti ed espressionisti."
    - p: "Quanto tempo ci vuole?"
      r: "Bastano tra due e tre ore per visitarlo con calma."
    - p: "Si visita in ordine?"
      r: "Sì, il percorso è cronologico, dal piano superiore (arte antica) a quello inferiore (arte moderna)."
    - p: "Bisogna prenotare il biglietto?"
      r: "Si consiglia di acquistare il biglietto in anticipo in alta stagione e nei fine settimana."
    - p: "Quando è gratis?"
      r: "Il museo prevede fasce di ingresso gratuito o ridotto. Consulta sempre il sito ufficiale per orari, biglietti e condizioni di accesso, che cambiano."
    - p: "È un buon programma con i bambini?"
      r: "Sì, con una visita breve. Il museo offre attività e percorsi per le famiglie."
palacio-real-madrid:
  texto:
    - "Il Palazzo Reale di Madrid è la residenza ufficiale del Re, anche se viene utilizzato solo per gli atti di Stato. È il più grande palazzo reale dell'Europa occidentale per superficie e si può visitare quasi tutto l'anno, tranne quando ci sono eventi ufficiali."
    - "La visita attraversa sale decorate con arazzi, affreschi e lampadari di cristallo, come il Salone del Trono e la Sala da Pranzo di Gala, oltre alla Real Armería e alla Real Farmacia. Ci sono collezioni di strumenti ad arco, orologi e mobili del XVIII e XIX secolo."
    - "Controlla in anticipo se il palazzo è aperto il giorno in cui vuoi andare, perché chiude in occasione di eventi ufficiali. Prenota il biglietto in alta stagione per evitare le code e calcola tra una e due ore di visita. I giardini di Sabatini e il Campo del Moro, accanto al palazzo, sono un buon complemento. Consulta sempre il sito ufficiale per orari, biglietti e condizioni di accesso, che cambiano."
  faq:
    - p: "Il Re vive nel Palazzo Reale?"
      r: "No, la residenza della famiglia reale è in un altro luogo. Il palazzo viene usato per atti ufficiali e cerimonie."
    - p: "Cosa si visita?"
      r: "Sale di gala, come quella del Trono e la Sala da Pranzo di Gala, la Real Armería, la Real Farmacia e varie collezioni di arte e mobili."
    - p: "Quanto tempo ci vuole?"
      r: "Tra una e due ore per la visita completa."
    - p: "Può essere chiuso?"
      r: "Sì, il palazzo chiude durante gli atti ufficiali. Controlla il sito prima di andare."
    - p: "Bisogna prenotare il biglietto?"
      r: "Si consiglia di prenotare in anticipo in alta stagione."
    - p: "Cos'altro c'è da vedere nei dintorni?"
      r: "La Cattedrale dell'Almudena, la Plaza de Oriente, i giardini di Sabatini e il Campo del Moro."
parque-buen-retiro:
  texto:
    - "Il parco del Buen Retiro è il grande parco di Madrid e uno dei luoghi più amati dai madrileni. Dichiarato Patrimonio dell'Umanità dall'UNESCO insieme al Paseo del Prado, è un'oasi di giardini, viali alberati, laghetti e monumenti in pieno centro."
    - "Tra gli angoli più conosciuti ci sono lo Estanque Grande, con le barche a remi e il monumento ad Alfonso XII, il Palacio de Cristal, il Palacio de Velázquez e la Rosaleda. C'è anche un percorso di sculture e vari angoli tranquilli, come il Bosque del Recuerdo."
    - "È perfetto per passeggiare, fare sport, leggere o semplicemente riposare. Il parco apre di buon'ora e la cosa migliore è visitarlo di mattina o al tramonto. In primavera, con la Rosaleda, e in autunno, con i suoi colori, è particolarmente bello. Ogni anno ospita la Fiera del Libro, a fine primavera."
  faq:
    - p: "Cosa vedere al Retiro?"
      r: "Lo Estanque Grande con le barche, il Palacio de Cristal, il Palacio de Velázquez, la Rosaleda e il Bosque del Recuerdo."
    - p: "È gratis?"
      r: "L'accesso al parco è libero. Alcune attività, come noleggiare una barca, sono a pagamento."
    - p: "Si possono noleggiare le barche?"
      r: "Sì, allo Estanque Grande, normalmente con orari di apertura e stagione. Consulta le condizioni."
    - p: "Quando è meglio andare?"
      r: "Di mattina o al tramonto. In primavera e in autunno il parco è particolarmente bello."
    - p: "È un buon programma con i bambini?"
      r: "Sì, ci sono aree giochi, barche, burattini in alcuni periodi e tanto spazio per correre."
    - p: "È Patrimonio dell'Umanità?"
      r: "Sì, fa parte del Paesaggio della Luce, Paseo del Prado e El Retiro, dichiarato dall'UNESCO."
sagrada-familia:
  texto:
    - "La Sagrada Família è il capolavoro incompiuto di Antoni Gaudí e il monumento più visitato di Barcellona. I lavori sono iniziati nel 1882 e proseguono tuttora, finanziati in gran parte con i biglietti dei visitatori. Fa parte delle opere di Gaudí dichiarate Patrimonio dell'Umanità dall'UNESCO."
    - "Le facciate della Natività e della Passione raccontano la vita di Gesù con una scultura molto diversa in ciascuna. L'interno è la parte più sorprendente: colonne che si aprono come alberi, volte dalle forme naturali e una luce colorata che cambia nel corso della giornata a seconda dell'ora e dell'orientamento delle vetrate."
    - "I biglietti si vendono con giorno e orario stabiliti e si esauriscono con anticipo, quindi prenota online prima di partire. Calcola tra un'ora e mezza e due ore per la visita, con o senza audioguida, e valuta di salire su una delle torri se ci sono posti. Attenzione ai rivenditori abusivi nelle code intorno. Consulta sempre il sito ufficiale per orari, biglietti e condizioni di accesso, che cambiano."
  faq:
    - p: "Perché non è ancora terminata?"
      r: "Perché i lavori sono iniziati nel 1882 e sono finanziati principalmente con i biglietti e le donazioni, con un progetto molto complesso. Consulta sul sito ufficiale lo stato attuale dei lavori."
    - p: "Bisogna prenotare il biglietto?"
      r: "Sì, conviene prenotare online in anticipo: i biglietti si vendono con orario e si esauriscono, soprattutto in alta stagione."
    - p: "Quanto tempo ci vuole?"
      r: "Tra un'ora e mezza e due ore, di più se sali su una torre."
    - p: "Si può salire sulle torri?"
      r: "Sì, ci sono biglietti con salita alle torri, con posti limitati. Consulta le condizioni sul sito."
    - p: "Cosa vedere all'interno?"
      r: "Le colonne a forma di albero, le volte e le vetrate colorate, che cambiano di luce nel corso della giornata."
    - p: "È Patrimonio dell'Umanità?"
      r: "Sì, fa parte delle opere di Antoni Gaudí dichiarate Patrimonio dell'Umanità dall'UNESCO."
park-guell:
  texto:
    - "Il Park Güell è il parco modernista di Gaudí, con architettura e natura fuse in una collina con vista su tutta Barcellona. Fa parte delle opere di Gaudí dichiarate Patrimonio dell'Umanità dall'UNESCO ed è uno dei luoghi più fotografati della città."
    - "La parte più famosa è la Zona Monumentale: la grande piazza con la sua panca ondulata rivestita di mosaico di trencadís, la salamandra colorata, le colonne inclinate del porticato e gli edifici all'ingresso. Il resto del parco è fatto di sentieri, giardini e belvedere ad accesso libero."
    - "La Zona Monumentale ha una capienza limitata e ingresso con orario, e conviene prenotarla in anticipo. Evita le ore centrali e vai a prima ora o a fine pomeriggio, quando c'è meno gente e la luce è migliore. Porta scarpe comode, perché ci sono salite, e dell'acqua. Consulta sempre il sito ufficiale per orari, biglietti e condizioni di accesso, che cambiano."
  faq:
    - p: "Il Park Güell è gratis?"
      r: "Una parte del parco è ad accesso libero, ma la Zona Monumentale, con la panca ondulata, richiede un biglietto con orario. Consulta sempre il sito ufficiale per orari, biglietti e condizioni di accesso, che cambiano."
    - p: "Bisogna prenotare?"
      r: "Sì, conviene prenotare in anticipo il biglietto per la Zona Monumentale, perché la capienza è limitata."
    - p: "Quanto tempo ci vuole?"
      r: "Tra un'ora e mezza e due ore, di più se esplori la zona libera del parco."
    - p: "Quando è meglio andare?"
      r: "A prima ora del mattino o a fine pomeriggio, quando c'è meno gente e la luce è migliore."
    - p: "Come arrivare?"
      r: "In metro e autobus o a piedi dalle fermate vicine. Ci sono salite, quindi porta scarpe comode."
    - p: "È un buon programma con i bambini?"
      r: "Sì, anche se ci sono salite e scale. I mosaici e la salamandra di solito piacciono ai più piccoli."
casa-batllo:
  texto:
    - "Casa Batlló è una delle case più spettacolari di Gaudí, in pieno Passeig de Gràcia. Gaudí la ristrutturò tra il 1904 e il 1906 e creò una facciata di colori e forme ondulate, con balconi che sembrano maschere e un tetto che ricorda il dorso di un drago."
    - "All'interno tutto sembra natura: il cortile di luce rivestito di piastrelle azzurre che cambiano tonalità in base all'altezza, il salone principale con le sue grandi vetrate, la scala e la soffitta, con archi a catenaria. È una casa in cui quasi non ci sono linee rette e ogni dettaglio è pensato."
    - "La visita si fa con audioguida e di solito comprende la realtà aumentata. Prenota in anticipo, perché in alta stagione i biglietti si esauriscono, e calcola un'ora e mezza. Casa Batlló fa parte del tratto noto come Manzana de la Discordia (l'isolato della discordia), insieme a Casa Amatller e Casa Lleó Morera. Consulta sempre il sito ufficiale per orari, biglietti e condizioni di accesso, che cambiano."
  faq:
    - p: "Chi ha costruito Casa Batlló?"
      r: "Antoni Gaudí la ristrutturò tra il 1904 e il 1906 per la famiglia Batlló."
    - p: "Cos'è la Manzana de la Discordia?"
      r: "Il tratto del Passeig de Gràcia dove convivono edifici modernisti di diversi architetti, tra cui Casa Batlló, Casa Amatller e Casa Lleó Morera."
    - p: "Bisogna prenotare il biglietto?"
      r: "Sì, conviene prenotare in anticipo, soprattutto in alta stagione."
    - p: "Quanto dura la visita?"
      r: "Tra un'ora e un'ora e mezza, con audioguida."
    - p: "Cosa non bisogna perdersi?"
      r: "La facciata, il cortile di luce con le piastrelle azzurre, il salone principale e la terrazza con i camini."
    - p: "È Patrimonio dell'Umanità?"
      r: "Sì, fa parte delle opere di Gaudí dichiarate Patrimonio dell'Umanità dall'UNESCO."
ciudad-artes-ciencias:
  texto:
    - "La Città delle Arti e delle Scienze è il grande complesso culturale e ricreativo di Valencia, un insieme di edifici futuristi opera di Santiago Calatrava e Félix Candela che è diventato uno dei simboli della città. Si trova nell'antico letto del fiume Turia, oggi un grande giardino."
    - "Riunisce vari spazi: l'Hemisfèric, con il suo cinema IMAX e planetario a forma di occhio; il Museu de les Ciències Príncipe Felipe; l'Oceanogràfic, uno dei più grandi acquari d'Europa; il Palau de les Arts Reina Sofía, dedicato all'opera; l'Ágora e l'Umbracle, una passeggiata con giardini. Ognuno si visita separatamente e ci sono biglietti combinati."
    - "Anche se si può passeggiare all'esterno senza pagare, l'interno degli edifici richiede un biglietto. Se vai con i bambini, l'Oceanogràfic e il Museo delle Scienze sono i più consigliati. Vai in bici o a piedi dal giardino del Turia ed evita le ore più calde. Consulta sempre il sito ufficiale per orari, biglietti e condizioni di accesso, che cambiano."
  faq:
    - p: "Cosa comprende la Città delle Arti e delle Scienze?"
      r: "L'Hemisfèric, il Museu de les Ciències, l'Oceanogràfic, il Palau de les Arts, l'Ágora e l'Umbracle."
    - p: "Si può entrare gratis?"
      r: "Si può passeggiare all'esterno, ma l'accesso agli edifici richiede un biglietto. Consulta sempre il sito ufficiale per orari, biglietti e condizioni di accesso, che cambiano."
    - p: "Cosa vedere se ho poco tempo?"
      r: "Una passeggiata all'esterno per vedere l'architettura e, se c'è tempo, l'Oceanogràfic o il Museo delle Scienze."
    - p: "È un buon programma con i bambini?"
      r: "Sì, l'Oceanogràfic e il Museo delle Scienze sono pensati molto bene per le famiglie."
    - p: "Come arrivare?"
      r: "In metro, tram o autobus, oppure a piedi e in bici lungo il giardino del Turia."
    - p: "Ci sono biglietti combinati?"
      r: "Sì, esistono biglietti combinati per più spazi. Consulta le opzioni sul sito ufficiale."
real-alcazar-sevilla:
  texto:
    - "Il Real Alcázar di Siviglia è un palazzo fortificato di origine musulmana, ampliato nel corso dei secoli, e uno dei migliori esempi di stile mudéjar. È Patrimonio dell'Umanità insieme alla cattedrale e all'Archivio delle Indie, e continua a essere residenza ufficiale del Re quando visita la città."
    - "Il cuore del complesso è il Palazzo di Pietro I, del XIV secolo, con il Patio de las Doncellas, il Salón de Embajadores con la sua cupola dorata e stucchi di grande delicatezza. Tutt'intorno si estendono giardini con laghetti, fontane, aranci e angoli ombreggiati. È stato set di serie e film, tra cui Il Trono di Spade."
    - "Prenota il biglietto in anticipo, perché si esaurisce, soprattutto in primavera e in autunno. Calcola tra due e tre ore di visita ed evita le ore più calde se vai in estate. Abbina l'Alcázar alla cattedrale, alla Giralda e al quartiere di Santa Cruz, che sono lì accanto. Consulta sempre il sito ufficiale per orari, biglietti e condizioni di accesso, che cambiano."
  faq:
    - p: "Cos'è il Real Alcázar di Siviglia?"
      r: "Un palazzo fortificato di origine musulmana, ampliato in epoca cristiana, con il palazzo mudéjar di Pietro I come pezzo centrale."
    - p: "Bisogna prenotare il biglietto?"
      r: "Sì, conviene prenotare in anticipo, soprattutto in alta stagione."
    - p: "Quanto tempo ci vuole?"
      r: "Tra due e tre ore, tra palazzi e giardini."
    - p: "Cosa non bisogna perdersi?"
      r: "Il Patio de las Doncellas, il Salón de Embajadores, il Palazzo di Carlo V e i giardini."
    - p: "È ancora residenza reale?"
      r: "Sì, fa parte delle residenze ufficiali del Re e viene usato per atti ufficiali."
    - p: "È Patrimonio dell'Umanità?"
      r: "Sì, insieme alla cattedrale e all'Archivio Generale delle Indie, dal 1987."
plaza-mayor-madrid:
  texto:
    - "La Plaza Mayor è una delle piazze più conosciute di Madrid. È un grande spazio rettangolare e chiuso, circondato da portici e da edifici di vari piani, costruito all'inizio del XVII secolo e per secoli teatro di feste, mercati e cerimonie pubbliche."
    - "Al centro si erge la statua di Filippo III e, su uno dei lati, la Casa de la Panadería, con gli affreschi sulla facciata. Sotto i portici ci sono negozi di souvenir, francobolli e monete, e i tavolini della piazza sono un luogo classico per bere qualcosa, anche se più caro che nelle strade intorno."
    - "In inverno si allestisce il mercatino di Natale, con bancarelle di presepi e addobbi, e durante l'anno ci sono concerti e attività. Per mangiare, meglio spostarsi nei vicoli vicini, dove si trovano i panini con i calamari e le taverne più tradizionali. Di prima mattina si visita con più calma."
  faq:
    - p: "Cosa si può vedere in Plaza Mayor?"
      r: "La statua di Filippo III, la Casa de la Panadería con i suoi affreschi, i portici e l'atmosfera dei tavolini all'aperto."
    - p: "C'è il mercatino di Natale?"
      r: "Sì, in inverno si allestisce il mercatino natalizio, con bancarelle di presepi e addobbi. Controlla le date ogni anno."
    - p: "Conviene mangiare in piazza?"
      r: "I tavolini della piazza sono più cari. I vicoli intorno hanno taverne e panini con i calamari più economici."
    - p: "Quando è meglio andare?"
      r: "Di prima mattina o al tramonto, per evitare le ore di maggiore affollamento."
    - p: "Cos'altro vedere nei dintorni?"
      r: "Il Mercado de San Miguel, la Puerta del Sol, il Palazzo Reale e il quartiere di La Latina."
puerta-sol-madrid:
  texto:
    - "La Puerta del Sol è il cuore di Madrid e uno dei luoghi più conosciuti della Spagna. Qui si trova il chilometro zero delle strade radiali, segnato da una targa sul pavimento, e l'orologio della Real Casa de Correos che scandisce i rintocchi di Capodanno."
    - "La piazza è un abituale punto d'incontro e un crocevia di strade molto trafficato. Vi si trovano la statua dell'Orso e del Corbezzolo, simbolo della città, l'edificio della Real Casa de Correos, oggi sede del governo regionale, e l'insegna luminosa di Tío Pepe, una delle più fotografate."
    - "È una tappa veloce, di quindici o venti minuti, che si abbina bene a una passeggiata per la Plaza Mayor, la calle Mayor o le vie pedonali del centro. Attenzione ai borseggiatori nelle zone affollate e alle truffe tipiche delle zone turistiche. A Capodanno si riempie di persone che vogliono vivere i rintocchi di mezzanotte."
  faq:
    - p: "Cos'è il chilometro zero?"
      r: "Una targa sul pavimento, davanti alla Real Casa de Correos, che segna l'origine delle strade radiali della Spagna."
    - p: "Qual è l'orologio dei rintocchi di Capodanno?"
      r: "Quello della Real Casa de Correos, in Puerta del Sol, che scandisce i dodici rintocchi di Capodanno."
    - p: "Cos'altro vedere nella piazza?"
      r: "La statua dell'Orso e del Corbezzolo, l'insegna di Tío Pepe e la Real Casa de Correos."
    - p: "Quanto tempo ci vuole?"
      r: "Circa quindici o venti minuti per vedere i punti principali, di più se ti siedi a osservare l'atmosfera."
    - p: "C'è il rischio di borseggiatori?"
      r: "È una zona molto affollata e i borseggiatori agiscono dove c'è molta gente. Fai attenzione ai tuoi effetti personali."
    - p: "Cosa c'è nei dintorni?"
      r: "La Plaza Mayor, il Mercado de San Miguel, la calle Preciados e il Palazzo Reale sono a pochi minuti a piedi."
mercado-san-miguel:
  texto:
    - "Il Mercado de San Miguel è un mercato coperto in ferro e vetro inaugurato nel 1916, accanto alla Plaza Mayor. Oggi è uno spazio gastronomico dove si può assaggiare di tutto, in piedi o seduti, tra banchi di prodotti freschi, tapas, vini e conserve."
    - "Offre una grande varietà: prosciutto, formaggi, frutti di mare, tortillas, crocchette, pinchos, dolci e bevande di ogni tipo. È molto popolare tra turisti e madrileni e permette di assaggiare tante cose in un unico posto, anche se i prezzi sono più alti che nelle taverne della zona."
    - "Si riempie molto all'ora di pranzo e nei fine settimana, quindi conviene andare di prima mattina o a metà pomeriggio. Se vuoi un'esperienza più economica, abbina una sosta qui a qualche tapa nelle taverne di La Latina. Consulta sempre il sito ufficiale per orari, biglietti e condizioni di accesso, che cambiano."
  faq:
    - p: "Cosa si può mangiare?"
      r: "Prosciutto, formaggi, frutti di mare, tortillas, crocchette, pinchos, dolci e vino, tra gli altri prodotti."
    - p: "È caro?"
      r: "I prezzi sono in genere più alti che nelle taverne della zona, trattandosi di un luogo molto turistico."
    - p: "Quando è meglio andare?"
      r: "Di prima mattina o a metà pomeriggio. All'ora di pranzo e nei fine settimana si riempie."
    - p: "Si può prenotare?"
      r: "In generale no, è un mercato ad accesso libero. Alcuni banchi hanno dei tavoli."
    - p: "Cos'altro vedere nei dintorni?"
      r: "La Plaza Mayor, la Puerta del Sol e il quartiere di La Latina."
casa-mila-pedrera:
  texto:
    - "La Casa Milà, conosciuta come La Pedrera, è un'altra delle grandi opere di Gaudí a Barcellona. Fu costruita tra il 1906 e il 1912 come abitazione per la famiglia Milà, e la sua facciata di pietra ondulata, quasi priva di linee rette, le valse il soprannome di cava di pietra."
    - "La parte più impressionante è la terrazza, con i suoi camini e le uscite di ventilazione che sembrano guerrieri scolpiti e con vista sulla città, e la soffitta, con archi di mattoni che formano una struttura a costole. Si può anche visitare un appartamento ricostruito per vedere come si viveva all'inizio del XX secolo."
    - "Prenota in anticipo, perché i biglietti si esauriscono in alta stagione, e calcola un'ora e mezza per la visita. La Pedrera organizza anche visite serali e attività culturali. Fa parte delle opere di Gaudí dichiarate Patrimonio dell'Umanità dall'UNESCO. Consulta sempre il sito ufficiale per orari, biglietti e condizioni di accesso, che cambiano."
  faq:
    - p: "Perché si chiama La Pedrera?"
      r: "Per la sua facciata di pietra ondulata, che ricorda una cava, soprannome che le fu dato quando venne costruita."
    - p: "Cosa vedere alla Pedrera?"
      r: "La terrazza con i camini, la soffitta con i suoi archi e un appartamento ricostruito dell'inizio del XX secolo."
    - p: "Bisogna prenotare il biglietto?"
      r: "Sì, conviene prenotare in anticipo, soprattutto in alta stagione."
    - p: "Quanto dura la visita?"
      r: "Circa un'ora e mezza."
    - p: "Ci sono visite serali?"
      r: "La Pedrera organizza visite e attività in orari speciali. Consulta l'offerta sul sito ufficiale."
    - p: "È Patrimonio dell'Umanità?"
      r: "Sì, fa parte delle opere di Gaudí dichiarate Patrimonio dell'Umanità dall'UNESCO."
museo-picasso-barcelona:
  texto:
    - "Il Museo Picasso di Barcellona occupa cinque palazzi medievali di carrer de Montcada, nel quartiere della Ribera. La sua collezione si concentra sulla giovinezza dell'artista e sul suo rapporto con la città, ed è una delle migliori per capire come Picasso si sia evoluto fin dai primi anni."
    - "Riunisce opere del suo periodo di formazione, del periodo blu e di altre epoche, e soprattutto la serie completa de Las Meninas, una reinterpretazione del dipinto di Velázquez che Picasso realizzò nel 1957. Il percorso permette di seguire l'evoluzione dell'artista prima della fama."
    - "Prenota in anticipo, perché i biglietti si esauriscono in alta stagione, e calcola un'ora e mezza di visita. È un museo piccolo e ben organizzato, ideale da abbinare a una passeggiata per il Born e la basilica di Santa Maria del Mar. Consulta sempre il sito ufficiale per orari, biglietti e condizioni di accesso, che cambiano."
  faq:
    - p: "Cosa c'è al Museo Picasso?"
      r: "Opere giovanili e di diverse fasi di Picasso, oltre alla serie completa de Las Meninas."
    - p: "Dov'è?"
      r: "In carrer de Montcada, nel quartiere della Ribera, a Barcellona, in cinque palazzi medievali."
    - p: "Bisogna prenotare il biglietto?"
      r: "Sì, conviene prenotare in anticipo, soprattutto in alta stagione."
    - p: "Quanto dura la visita?"
      r: "Circa un'ora e mezza."
    - p: "Cos'altro vedere nei dintorni?"
      r: "La basilica di Santa Maria del Mar, il quartiere del Born e la cattedrale."
boqueria:
  texto:
    - "La Boqueria, ufficialmente Mercat de Sant Josep, è il mercato più famoso di Barcellona e uno dei più conosciuti d'Europa. Si trova sulla Rambla e riunisce banchi di frutta, verdura, carne, pesce, salumi, dolci e tanti colori."
    - "Oltre a comprare prodotti freschi, si può mangiare e fare uno spuntino nei bar del mercato, che servono piatti della cucina catalana come uova con funghi, calamari o tortilla. I banchi di frutta e di succhi appena spremuti sono all'ingresso, quelli più tradizionali all'interno."
    - "Si riempie molto, soprattutto a mezzogiorno, ed è una zona con borseggiatori, quindi fai attenzione ai tuoi effetti personali. Per mangiare in modo più autentico e più economico, evita i banchi all'ingresso e addentrati verso l'interno, oppure esci nelle strade vicine. Vai di prima mattina se vuoi evitare la folla. Consulta sempre il sito ufficiale per orari, biglietti e condizioni di accesso, che cambiano."
  faq:
    - p: "Cos'è la Boqueria?"
      r: "Il mercato più famoso di Barcellona, ufficialmente Mercat de Sant Josep, situato sulla Rambla."
    - p: "Cosa si può mangiare?"
      r: "Tapas e piatti della cucina catalana nei bar del mercato, oltre a frutta, succhi, salumi e dolci."
    - p: "Quando è meglio andare?"
      r: "Di prima mattina, prima che si riempia di gente."
    - p: "È caro?"
      r: "I banchi all'ingresso sono i più turistici e cari. Quelli all'interno e nelle strade vicine sono in genere più economici."
    - p: "C'è il rischio di borseggiatori?"
      r: "Sì, è una zona molto affollata. Fai attenzione ai tuoi effetti personali."
giralda:
  texto:
    - "La Giralda è il simbolo di Siviglia. Era il minareto dell'antica moschea almohade, costruito nel XII secolo, a cui i cristiani aggiunsero nel XVI secolo un campanile rinascimentale. Oggi fa parte della cattedrale, Patrimonio dell'Umanità insieme all'Alcázar e all'Archivo de Indias."
    - "Salire sulla Giralda è una delle esperienze più popolari della città. Al posto delle scale ha delle rampe, che secondo la tradizione permettevano di salire a cavallo, e dall'alto si vede tutta Siviglia, con i tetti, i patii della cattedrale e il fiume. Il biglietto per la torre di solito include la visita alla cattedrale."
    - "Acquista i biglietti in anticipo ed evita le ore più calde. Nella cattedrale puoi vedere anche il sepolcro di Cristoforo Colombo e la pala d'altare maggiore. Calcola un'ora e mezza per l'intero complesso. Consulta sempre il sito ufficiale per orari, biglietti e condizioni di accesso, che cambiano."
  faq:
    - p: "Cos'è la Giralda?"
      r: "La torre della cattedrale di Siviglia, antico minareto della moschea almohade del XII secolo, a cui fu aggiunto in seguito un campanile rinascimentale."
    - p: "Si può salire?"
      r: "Sì, tramite rampe al posto delle scale. Dall'alto si gode di una vista su tutta la città."
    - p: "Bisogna pagare?"
      r: "L'ingresso alla cattedrale e alla Giralda è a pagamento, con condizioni speciali in alcuni orari. Consulta sempre il sito ufficiale per orari, biglietti e condizioni di accesso, che cambiano."
    - p: "Cos'altro vedere nella cattedrale?"
      r: "Il sepolcro di Colombo, la pala d'altare maggiore e il Patio de los Naranjos."
    - p: "Quanto tempo ci vuole?"
      r: "Circa un'ora e mezza per cattedrale e torre."
torre-oro:
  texto:
    - "La Torre del Oro è una torre albarrana di origine almohade, costruita all'inizio del XIII secolo sulle rive del Guadalquivir come parte delle difese della città. Il suo nome si attribuisce ai riflessi dorati delle sue piastrelle sull'acqua, oppure all'oro arrivato dall'America che vi si custodiva."
    - "Oggi ospita un piccolo museo navale, con modellini, strumenti e documenti sulla storia del porto di Siviglia, e dalla sua terrazza si vedono il fiume e il centro storico. La visita è breve, di circa 20 o 30 minuti, e si abbina bene a una passeggiata lungo il paseo de Colón."
    - "È una delle immagini più tipiche di Siviglia e si vede particolarmente bene al tramonto, con la luce sul fiume. Approfitta per attraversare il ponte di Triana o passeggiare lungo la riva. Consulta sempre il sito ufficiale per orari, biglietti e condizioni di accesso, che cambiano."
  faq:
    - p: "Cos'è la Torre del Oro?"
      r: "Una torre difensiva di origine almohade, del XIII secolo, sulle rive del Guadalquivir."
    - p: "Perché si chiama così?"
      r: "Si attribuisce ai riflessi dorati delle sue piastrelle sull'acqua, o all'oro arrivato dall'America."
    - p: "Si può visitare?"
      r: "Sì, ospita un museo navale. Consulta gli orari e le condizioni."
    - p: "Quanto tempo ci vuole?"
      r: "Circa 20-30 minuti."
    - p: "Quando è meglio vederla?"
      r: "Al tramonto, quando la luce riflessa sul fiume dà più colore."
plaza-espana-sevilla:
  texto:
    - "La Plaza de España è una delle piazze più belle della Spagna. Progettata da Aníbal González per l'Esposizione Iberoamericana del 1929, ha forma di semicerchio, con un grande edificio di mattoni e ceramica, una torre a ciascuna estremità e un canale con ponti."
    - "Lungo la piazza ci sono panchine di azulejos che rappresentano le province spagnole, ciascuna con il suo stemma e una scena storica. Si può passeggiare sotto i portici, attraversare i ponti e noleggiare una barca sul canale. È stata set di film, come uno della saga di Star Wars."
    - "L'ingresso è libero e si trova accanto al parco di María Luisa. Vai di prima mattina o al tramonto, quando c'è meno gente e la luce è migliore, ed evita le ore più calde. Consulta sempre il sito ufficiale per orari, biglietti e condizioni di accesso, che cambiano."
  faq:
    - p: "Cos'è la Plaza de España?"
      r: "Una grande piazza semicircolare costruita per l'Esposizione Iberoamericana del 1929, opera di Aníbal González."
    - p: "Si paga l'ingresso?"
      r: "No, l'accesso è libero. Le barche sul canale invece sono a pagamento."
    - p: "Cosa vedere?"
      r: "Le panchine di azulejos delle province, i ponti, le torri e il canale."
    - p: "Quando è meglio andare?"
      r: "Di prima mattina o al tramonto, per evitare la folla e il caldo."
    - p: "Cosa c'è nei dintorni?"
      r: "Il parco di María Luisa e il quartiere di Santa Cruz."
universidad-salamanca:
  texto:
    - "L'Università di Salamanca è la più antica della Spagna ancora in attività. Nacque nel 1218 e fu per secoli uno dei grandi centri del sapere europeo, con figure come Fray Luis de León o Miguel de Unamuno legate alle sue aule."
    - "Il complesso storico ruota attorno al Patio de Escuelas. La facciata plateresca delle Escuelas Mayores è una delle immagini più riconoscibili della città, e vi si nasconde una piccola rana sopra un teschio che i visitatori cercano per tradizione. All'interno si visitano le aule storiche e la Biblioteca Antigua, con fondi di grande valore."
    - "L'autunno è un buon momento per visitarla: la Biblioteca Antigua fa parte de «Las llaves de la ciudad», il programma di visite guidate che Salamanca organizza ogni anno (nel 2026, dal 24 ottobre al 20 dicembre). Chi completa il passaporto del programma può partecipare a un sorteggio per vedere il sancta sanctorum della biblioteca. Consulta sempre il sito ufficiale per orari, biglietti e condizioni di accesso, che cambiano."
  faq:
    - p: "Qual è l'elemento più noto dell'Università di Salamanca?"
      r: "La facciata plateresca delle Escuelas Mayores, con la rana nascosta, e la Biblioteca Antigua."
    - p: "Dov'è la rana?"
      r: "Sulla facciata delle Escuelas Mayores, sopra un teschio. Per tradizione si cerca di trovarla."
    - p: "Si può visitare la Biblioteca Antigua?"
      r: "Sì. Oltre alla visita abituale, fa parte de «Las llaves de la ciudad», con visite guidate in autunno. Consulta il sito ufficiale per posti e condizioni."
    - p: "Cos'è Las llaves de la ciudad?"
      r: "Un programma annuale di visite guidate a spazi patrimoniali di Salamanca. La stampa locale lo presenta come gratuito, ma bisogna prenotare sul sito di Turismo de Salamanca."
    - p: "Quanto tempo ci vuole?"
      r: "Una o due ore per l'esterno e le zone visitabili. Di più se aggiungi la Biblioteca Antigua e l'area delle cattedrali."
    - p: "Cos'altro vedere nei dintorni?"
      r: "Le Cattedrali, la Casa de las Conchas e la Clerecía sono a pochi minuti a piedi."
