# Calendario estacional de sinplanes.com
# ------------------------------------------------------------
# Se edita a mano (o con ayuda de IA) muy de vez en cuando.
# El pipeline lo convierte cada día en planes con fechas reales.
#
# temporada: planes "de siempre" que valen para todo un mes o varios.
# citas:     eventos que se repiten cada año con una regla de fecha.
#
# Reglas de fecha (citas):
#   fija:     inicio "MM-DD", fin "MM-DD" (opcional)
#   pascua:   desde / hasta = días respecto al Domingo de Resurrección
#   enesimo:  mes, dia_semana (0=domingo … 6=sábado), n (1,2,3… o -1 = último), dura (días, opcional)
# aprox: true → la web avisa de que la fecha es orientativa.
# lugar: omítelo si es un plan para toda España; si no, provincia y municipio.

temporada:
  - id: castanas-otono
    meses: [10, 11]
    temas: [naturaleza, gastronomia]
    es: { titulo: "Ir a coger castañas", resumen: "Los castañares de El Bierzo, el Valle del Genal, la sierra de Francia o el Valle del Tiétar se llenan de erizos. Pide permiso si el terreno es privado." }
    en: { titulo: "Go chestnut picking", resumen: "Chestnut groves in El Bierzo, the Genal Valley, Sierra de Francia or the Tiétar Valley fill with burrs. Ask permission on private land." }
  - id: magostos
    meses: [11]
    temas: [fiestas, gastronomia]
    es: { titulo: "Celebrar un magosto", resumen: "Castañas asadas, hoguera y vino nuevo: la fiesta de otoño de Galicia, Asturias y El Bierzo alrededor de San Martín." }
    en: { titulo: "Join a magosto", resumen: "Roast chestnuts, bonfires and new wine: the autumn feast of Galicia, Asturias and El Bierzo around Saint Martin's Day." }
  - id: setas
    meses: [10, 11]
    temas: [naturaleza, gastronomia]
    es: { titulo: "Salir a por setas", resumen: "Soria, el Pirineo y los montes de León y Zamora son los clásicos. Infórmate de la regulación y el permiso de recolección de cada zona." }
    en: { titulo: "Go mushroom foraging", resumen: "Soria, the Pyrenees and the hills of León and Zamora are the classics. Check each area's foraging rules and permits." }
  - id: hayedos
    meses: [10, 11]
    temas: [naturaleza]
    es: { titulo: "Ver el otoño en un hayedo", resumen: "Irati, Montejo, Tejera Negra o el hayedo de Otzarreta cambian de color en pocas semanas. Ve entre semana para evitar cupos completos." }
    en: { titulo: "See autumn colours in a beech forest", resumen: "Irati, Montejo, Tejera Negra or Otzarreta turn gold in a few weeks. Go on a weekday to avoid full visitor quotas." }
  - id: berrea
    meses: [9, 10]
    temas: [naturaleza]
    es: { titulo: "Escuchar la berrea del ciervo", resumen: "Al amanecer y al atardecer en Monfragüe, Cabañeros, la Sierra de Andújar o Riaño. Lleva prismáticos y guarda silencio." }
    en: { titulo: "Hear the red deer rut", resumen: "At dawn and dusk in Monfragüe, Cabañeros, Sierra de Andújar or Riaño. Bring binoculars and keep quiet." }
  - id: vendimia
    meses: [9]
    temas: [gastronomia]
    es: { titulo: "Vivir la vendimia", resumen: "Rioja, Ribera del Duero, Jerez o el Penedès organizan visitas y fiestas de la vendimia en bodegas." }
    en: { titulo: "Experience the grape harvest", resumen: "Rioja, Ribera del Duero, Jerez and Penedès offer winery visits and harvest festivals." }
  - id: piscinas-naturales
    meses: [6, 7, 8]
    temas: [agua, naturaleza]
    es: { titulo: "Bañarse en una piscina natural", resumen: "La Vera, el Valle del Jerte, Las Hurdes o la sierra de Gredos tienen pozas y gargantas de agua fría y clara." }
    en: { titulo: "Swim in a natural pool", resumen: "La Vera, Jerte Valley, Las Hurdes and the Gredos mountains have clear, cold river pools." }
  - id: playas-fluviales
    meses: [7, 8]
    temas: [agua]
    es: { titulo: "Pasar el día en una playa fluvial", resumen: "Una alternativa al mar para el interior: arenales en ríos y embalses con zona de baño señalizada." }
    en: { titulo: "Spend a day at a river beach", resumen: "An inland alternative to the sea: sandy river and reservoir beaches with marked swimming areas." }
  - id: verbenas
    meses: [7, 8]
    temas: [fiestas]
    es: { titulo: "Ir a las fiestas de un pueblo", resumen: "Agosto es el mes de las fiestas patronales: verbenas, peñas y orquestas en casi cada pueblo de España." }
    en: { titulo: "Go to a village festival", resumen: "August is patron-saint season: open-air dances, music and street parties in almost every Spanish village." }
  - id: perseidas
    meses: [8]
    temas: [naturaleza]
    es: { titulo: "Ver las Perseidas", resumen: "Hacia el 12 de agosto, lejos de la contaminación lumínica. Monfragüe, la Sierra Sur de Jaén o Gúdar-Javalambre son reservas Starlight." }
    en: { titulo: "Watch the Perseids", resumen: "Around 12 August, away from light pollution. Monfragüe, Sierra Sur de Jaén and Gúdar-Javalambre are Starlight reserves." }
  - id: cerezos-jerte
