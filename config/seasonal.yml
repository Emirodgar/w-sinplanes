  - id: halloween-difuntos
    regla: { tipo: fija, inicio: "10-31", fin: "11-01" }
    temas: [fiestas, ninos]
    es: { titulo: "Halloween y Todos los Santos", resumen: "Pasajes del terror y fiestas infantiles el 31, y tradición de buñuelos y huesos de santo el 1 de noviembre." }
    en: { titulo: "Halloween and All Saints' Day", resumen: "Haunted houses and kids' parties on the 31st, then traditional pastries on 1 November." }
    relacionados: [cabalgata-reyes, castanas-otono, magostos]
    contenido:
      es:
        texto:
          - "El 31 de octubre y el 1 de noviembre conviven en España dos tradiciones muy distintas: Halloween, con disfraces, pasajes del terror y fiestas infantiles, y Todos los Santos, un día de recuerdo a los difuntos, con visitas al cementerio y dulces propios."
          - "Halloween tiene cada vez más presencia, sobre todo entre los jóvenes y los niños, con fiestas temáticas, casas del terror y parques de atracciones decorados. El 1 de noviembre, en cambio, es festivo y tradicional: se visitan los cementerios con flores, se comen huesos de santo y buñuelos de viento y, en Cataluña, panellets y castañas en la castañada."
          - "En muchos teatros se representa estos días Don Juan Tenorio, de Zorrilla, una tradición del 1 y el 2 de noviembre. Consulta la cartelera y los programas del ayuntamiento, y si vas con niños, elige fiestas adaptadas y celebra la parte tradicional también."
        faq:
          - p: "¿Qué se celebra el 1 de noviembre?"
            r: "El Día de Todos los Santos, festivo en toda España, en el que se recuerda a los difuntos y se visitan los cementerios con flores."
          - p: "¿Qué dulces se comen?"
            r: "Huesos de santo, buñuelos de viento y, en Cataluña, panellets y castañas en la castañada."
          - p: "¿Qué es la castañada?"
            r: "Una fiesta tradicional catalana de Todos los Santos en la que se comen castañas, panellets y boniatos."
          - p: "¿Qué hacer en Halloween?"
            r: "Fiestas con disfraces, pasajes del terror, casas encantadas y rutas de misterio. Muchos parques de atracciones y ayuntamientos organizan actividades."
          - p: "¿Qué es Don Juan Tenorio?"
            r: "Una obra de teatro de José Zorrilla que se representa tradicionalmente en estas fechas en muchos teatros."
          - p: "¿Es buen plan con niños?"
            r: "Sí, hay muchas actividades infantiles para Halloween. Si vas a un cementerio, conviene explicarles el sentido tranquilo de la visita."
