    es: { titulo: "Descenso Internacional del Sella", resumen: "Miles de piragüistas bajan el río desde Arriondas hasta Ribadesella, con fiesta en las orillas durante toda la jornada." }
    en: { titulo: "International Sella Canoe Descent", resumen: "Thousands of paddlers race down the river from Arriondas to Ribadesella, with a party along the banks all day." }
    relacionados: [feria-malaga, piscinas-naturales, verbenas]
    contenido:
      es:
        texto:
          - "El Descenso Internacional del Sella es una de las fiestas más populares de Asturias y una de las más conocidas de España. Cada agosto, miles de piragüistas bajan el río Sella entre Arriondas y Ribadesella, mientras miles de personas lo viven desde las orillas, con comida, bebida y mucho ambiente."
          - "Es Fiesta de Interés Turístico Internacional y mezcla competición deportiva, tradición y fiesta popular. Los participantes recorren unos veinte kilómetros por el río, y el recorrido se puede ver desde varios puntos y desde las orillas, con picnics y música a lo largo del trayecto."
          - "Si quieres ver el descenso, elige un punto con buen acceso, llega pronto y ten en cuenta que el tráfico se complica y que Arriondas y Ribadesella se llenan de gente. Para participar, hace falta inscribirse con antelación. Lleva agua, crema solar y calzado cómodo."
        faq:
          - p: "¿Cuándo es el Descenso del Sella?"
            r: "Normalmente el primer sábado de agosto. Consulta la fecha exacta cada año."
          - p: "¿Dónde se celebra?"
            r: "En el río Sella, entre Arriondas y Ribadesella, en Asturias."
          - p: "¿Cómo verlo?"
            r: "Desde las orillas, con picnic y ambiente de fiesta, o desde puntos habilitados. En Ribadesella está la llegada."
          - p: "¿Se puede participar?"
            r: "Sí, pero hay que inscribirse con antelación y cumplir los requisitos de la organización."
          - p: "¿Cómo llegar?"
            r: "Con tiempo: el tráfico se complica. Valora el transporte organizado y aparcamientos habilitados."
          - p: "¿Es buen plan con niños?"
            r: "Sí, el ambiente de orilla es familiar, pero hay mucha gente y calor. Lleva agua y crema solar."
