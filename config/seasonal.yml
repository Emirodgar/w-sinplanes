  - id: fallas
    fuente: "https://www.spain.info/es/agenda/fallas-san-jose/"
    regla: { tipo: fija, inicio: "03-15", fin: "03-19" }
    temas: [fiestas]
    lugar: { provincia: "Valencia", municipio: "València" }
    es: { titulo: "Fallas de Valencia", resumen: "Mascletàs, monumentos falleros y la cremà de la noche del 19 de marzo." }
    en: { titulo: "Las Fallas in Valencia", resumen: "Firecracker displays, giant sculptures and the burning on the night of 19 March." }
    relacionados: [san-fermin, tomatina, feria-abril]
    contenido:
      es:
        texto:
          - "Las Fallas son las fiestas de Valencia en honor a San José, del 15 al 19 de marzo. Declaradas Patrimonio Cultural Inmaterial de la Humanidad por la UNESCO, combinan monumentos de cartón y madera, pirotecnia, música, pólvora y mucha vida en la calle."
          - "Las fallas son enormes monumentos satíricos que se plantan en las calles el día 15. Se pueden recorrer a pie, y las más importantes compiten por premios. Cada día a las 14:00, la mascletà, una sinfonía de pólvora en la plaza del Ayuntamiento, es una cita imprescindible. El 17 y el 18 se celebra la Ofrenda de Flores a la Virgen de los Desamparados."
          - "El final llega la noche del 19 de marzo con la cremà: las fallas arden, empezando por las infantiles y terminando por la grande, a medianoche. Reserva alojamiento con meses de antelación, usa el transporte público y ve con tiempo para coger sitio en la mascletà. Ten cuidado con los petardos en la calle y con los niños pequeños."
        faq:
          - p: "¿Cuándo son las Fallas?"
            r: "Del 15 al 19 de marzo todos los años. La plantà es el día 15 y la cremà, la noche del 19."
          - p: "¿Qué es la mascletà?"
            r: "Es un espectáculo de pólvora que se centra en el sonido y la potencia más que en los colores. Se dispara cada día a las 14:00 en la plaza del Ayuntamiento y se siente en el cuerpo."
          - p: "¿Qué es la cremà?"
            r: "Es la quema de las fallas la noche del 19 de marzo, con la quema final de la falla municipal a medianoche."
          - p: "¿Cómo moverme por Valencia en Fallas?"
            r: "A pie y en transporte público. Hay cortes de tráfico y el aparcamiento es casi imposible. El metro refuerza el servicio."
          - p: "¿Qué se come?"
            r: "Buñuelos de calabaza con chocolate, paella, y bocadillos de calle. Los buñuelos son el sabor típico de estas fiestas."
          - p: "¿Es buen plan con niños?"
            r: "Sí, hay fallas infantiles y actividades, pero el ruido de los petardos y las aglomeraciones pueden agobiar a los pequeños."
  - id: semana-santa
    regla: { tipo: pascua, desde: -7, hasta: 0 }
    temas: [fiestas, cultura]
    es: { titulo: "Procesiones de Semana Santa", resumen: "Sevilla, Málaga, Valladolid, Zamora o Cuenca tienen las más conocidas, cada una con un estilo muy distinto." }
    en: { titulo: "Holy Week processions", resumen: "Seville, Málaga, Valladolid, Zamora and Cuenca have the best known, each with a very different style." }
    relacionados: [semana-santa-sevilla, semana-santa-malaga, semana-santa-valladolid, semana-santa-salamanca]
    contenido:
      es:
        texto:
          - "La Semana Santa es la semana previa al Domingo de Resurrección, del Domingo de Ramos al Domingo de Pascua, y es una de las celebraciones más profundas y visitadas de España. Cofradías y hermandades sacan a la calle sus pasos e imágenes en procesiones que mezclan fe, arte, música y tradición."
          - "Cada ciudad tiene su propio estilo. En Sevilla y Málaga destacan los grandes tronos y palios, en Valladolid, Zamora o Salamanca las procesiones son más sobrias y de imaginería castellana, y en lugares como Cuenca o Murcia hay costumbres muy propias. Muchas son Fiestas de Interés Turístico Internacional."
          - "Como las fechas dependen de la Pascua, cambian cada año, entre marzo y abril. Si piensas viajar, reserva alojamiento con mucha antelación y consulta los itinerarios y horarios oficiales de cada cofradía, que se publican semanas antes. Las procesiones son actos religiosos: respeta el silencio, no te cruces entre los cortejos y evita los flashes cuando pasan los pasos."
        faq:
          - p: "¿Cuándo es la Semana Santa?"
            r: "Es la semana anterior al Domingo de Resurrección, que cae cada año en una fecha distinta entre finales de marzo y finales de abril. Va del Domingo de Ramos al Domingo de Pascua."
          - p: "¿Dónde ver las mejores procesiones?"
            r: "Sevilla, Málaga, Valladolid, Zamora, Salamanca, Cuenca, Murcia y Cartagena son de las más conocidas, cada una con un estilo muy distinto. Muchas son Fiestas de Interés Turístico Internacional."
          - p: "¿Hay que pagar para ver las procesiones?"
            r: "No. Se ven gratis desde la calle. En algunas ciudades hay sillas de pago en la carrera oficial o en tramos concretos."
          - p: "¿Qué días hay más procesiones?"
            r: "Jueves Santo y Viernes Santo suelen ser los días de mayor afluencia, y las noches de más ambiente, la madrugada entre ambos en ciudades como Sevilla. Domingo de Ramos y Sábado Santo también tienen procesiones."
          - p: "¿Cómo me organizo para verlas?"
            r: "Consulta el programa oficial de cada cofradía, con sus horarios e itinerarios, llega con tiempo a un buen sitio y ten paciencia: los cortejos avanzan despacio y las calles se cortan al tráfico."
          - p: "¿Es buen plan con niños?"
            r: "Sí, pero con cuidado: hay mucha gente y muchas horas de espera. Elige procesiones de tarde, busca un sitio con espacio y explícales que es un acto de respeto."
  - id: feria-abril
    fuente: "https://www.spain.info/es/agenda/feria-abril/"
    regla: { tipo: pascua, desde: 13, hasta: 20 }
    aprox: true
    temas: [fiestas]
    lugar: { provincia: "Sevilla", municipio: "Sevilla" }
    es: { titulo: "Feria de Abril de Sevilla", resumen: "Casetas, sevillanas y paseo de caballos en el Real de la Feria." }
    en: { titulo: "Seville April Fair", resumen: "Marquees, sevillanas dancing and horse parades at the fairground." }
    relacionados: [semana-santa-sevilla, san-fermin, romeria-rocio]
    contenido:
      es:
        texto:
          - "La Feria de Abril de Sevilla es una semana de fiesta con casetas, sevillanas, caballos y coches de caballos, y trajes de flamenca. Se celebra en el Real de la Feria, en el barrio de Los Remedios, unas dos semanas después de la Semana Santa."
          - "La feria arranca con el Alumbrado, la noche del lunes, cuando se encienden las miles de bombillas de la portada. Durante la semana, desde el mediodía, hay un paseo de caballos y carruajes; a partir de entonces, las casetas se llenan de música, baile y comida y bebida: rebujito, fino, jamón y pescaíto frito. El domingo se cierra con un castillo de fuegos artificiales."
          - "Una cosa que conviene saber: la mayoría de las casetas son privadas y solo entra quien tiene invitación o es socio. Hay también casetas públicas y algunas del ayuntamiento, abiertas a todos, y la calle y el Real se pueden recorrer libremente. Se suele ir bien vestido: traje de flamenca para ellas y traje corto o traje de chaqueta para ellos."
        faq:
          - p: "¿Cuándo es la Feria de Abril?"
            r: "Normalmente comienza dos semanas después del Domingo de Resurrección, entre abril y mayo. Dura una semana, con el Alumbrado la noche del lunes."
          - p: "¿Puedo entrar en cualquier caseta?"
            r: "No. La mayoría son privadas y solo se entra con invitación o siendo socio. Hay casetas públicas y del ayuntamiento abiertas a todo el mundo."
          - p: "¿Cuánto cuesta entrar a la feria?"
            r: "La entrada al recinto es gratuita. Pagas lo que consumas, y las atracciones de la calle del Infierno son de pago."
          - p: "¿Qué hay que ponerse?"
            r: "Muchos visitantes visten traje de flamenca o traje corto, pero no es obligatorio. Lo más importante es el calzado cómodo, porque se camina mucho."
          - p: "¿Cómo llegar?"
            r: "En metro, tranvía o autobús. Evita llevar coche: el aparcamiento es casi imposible y el entorno se corta al tráfico."
          - p: "¿Es buen plan con niños?"
            r: "Por el día sí, con paseo de caballos y casetas familiares. La calle del Infierno tiene atracciones. Por la noche hay más gente y más ruido."
  - id: sant-jordi
    regla: { tipo: fija, inicio: "04-23" }
    temas: [libros, fiestas]
    es: { titulo: "Día del Libro y Sant Jordi", resumen: "Paradas de libros y rosas en las calles, sobre todo en Barcelona, y firmas de autores en toda España." }
    en: { titulo: "World Book Day and Sant Jordi", resumen: "Book and rose stalls on the streets, especially in Barcelona, and author signings across Spain." }
    relacionados: [premio-cervantes, cabalgata-reyes, campanadas]
    contenido:
      es:
        texto:
          - "El 23 de abril se celebran el Día del Libro y Sant Jordi, y las calles se llenan de paradas de libros y de rosas. En Cataluña, la tradición es regalar una rosa y un libro, y es una de las fiestas más queridas de Barcelona, con mucha gente en la calle."
          - "En Barcelona, los puestos de libros y rosas ocupan Las Ramblas, el Paseo de Gracia y casi todos los barrios, y muchos escritores firman ejemplares. También se celebra en toda España el Día Internacional del Libro, con firmas, lecturas y descuentos en librerías, y en Aragón es el Día de Aragón."
          - "Si quieres firmar un libro, llega pronto: las colas son largas. Ve por la mañana o al atardecer, cuando hay menos agobio, y consulta la lista de autores y los horarios en las librerías y editoriales. Y recuerda: no hace falta ser de Cataluña para regalar una rosa o un libro."
        faq:
          - p: "¿Cuándo es Sant Jordi?"
            r: "Cada 23 de abril. Coincide con el Día del Libro."
          - p: "¿Qué se regala?"
            r: "Tradicionalmente, el hombre regala una rosa y la mujer un libro. Hoy se regalan ambos entre todo tipo de personas."
          - p: "¿Dónde ir en Barcelona?"
            r: "Las Ramblas, el Paseo de Gracia y las calles del centro se llenan de puestos. Hay paradas en casi todos los barrios."
          - p: "¿Hay firmas de autores?"
            r: "Sí, muchos autores firman libros en puestos, librerías y ferias. Llega pronto para evitar colas."
          - p: "¿Se celebra fuera de Cataluña?"
            r: "Sí, el Día del Libro se celebra en toda España y en el mundo, con actividades en librerías y bibliotecas."
          - p: "¿Es buen plan con niños?"
            r: "Sí, hay cuentacuentos y actividades infantiles. Cuidado con las aglomeraciones del centro de Barcelona."
