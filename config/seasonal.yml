    temas: [fiestas, cultura]
    lugar: { provincia: "Valencia", municipio: "València" }
    fuente: "https://www.spain.info/es/agenda/semana-santa-marinera-valencia/"
    es: { titulo: "Semana Santa Marinera de Valencia", resumen: "Procesiones en los barrios marineros del Cabanyal y el Grau, con la Resurrección de Pascua como cierre." }
    en: { titulo: "Seafarers’ Holy Week in Valencia", resumen: "Processions through the seafaring districts of El Cabanyal and El Grau, closing with the Easter Resurrection." }
    relacionados: [semana-santa, fallas, semana-santa-malaga]
    contenido:
      es:
        texto:
          - "La Semana Santa Marinera de Valencia se celebra en los barrios marineros del Cabanyal, el Canyamelar y el Grau, junto al mar. Es Fiesta de Interés Turístico Internacional y tiene un carácter muy propio, ligado a la vida de los pescadores y al Mediterráneo."
          - "Empieza el Viernes de Dolores y se alarga hasta el Domingo de Resurrección, con procesiones que recorren las calles de estos barrios, con sus bandas, sus cofradías y su ambiente popular. El cierre llega con la Procesión de la Resurrección, el Domingo de Pascua, más festiva y llena de color."
          - "Consulta el programa oficial, con los horarios y los itinerarios de las procesiones, y combina la visita con un paseo por la playa y una paella junto al mar. Llega con tiempo y evita los coches, porque algunas calles se cortan al tráfico."
        faq:
          - p: "¿Cuándo es la Semana Santa Marinera?"
            r: "Desde el Viernes de Dolores hasta el Domingo de Resurrección, entre marzo y abril según el año."
          - p: "¿Dónde se celebra?"
            r: "En los barrios marineros de Valencia: el Cabanyal, el Canyamelar y el Grau."
          - p: "¿Qué la hace diferente?"
            r: "Su carácter marinero y popular, con procesiones junto al mar y una Resurrección final festiva."
          - p: "¿Cómo llegar?"
            r: "En metro, tranvía o autobús. Las calles cercanas se cortan al tráfico durante las procesiones."
          - p: "¿Es gratis?"
            r: "Sí, ver las procesiones desde la calle es gratuito."
          - p: "¿Es buen plan con niños?"
            r: "Sí, la Resurrección del domingo es especialmente festiva y apta para familias."
  - id: romeria-rocio
    regla: { tipo: pascua, desde: 47, hasta: 50 }
    aprox: true
    temas: [fiestas]
    lugar: { provincia: "Huelva", municipio: "Almonte" }
    fuente: "https://www.spain.info/es/agenda/romeria-rocio/"
    es: { titulo: "Romería del Rocío", resumen: "Cientos de miles de peregrinos llegan a la aldea de El Rocío en carretas, a caballo y a pie por Pentecostés. Termina con la procesión de la Virgen." }
    en: { titulo: "El Rocío pilgrimage", resumen: "Hundreds of thousands of pilgrims reach the village of El Rocío by cart, horse and on foot at Pentecost, ending with the Virgin’s procession." }
    relacionados: [feria-abril, semana-santa-sevilla, san-juan]
    contenido:
      es:
        texto:
          - "La Romería del Rocío es una de las peregrinaciones más multitudinarias de España. Cientos de miles de personas viajan a pie, a caballo y en carretas, desde distintos puntos de Andalucía, hasta la aldea de El Rocío, en Almonte (Huelva), por Pentecostés."
          - "Los romeros organizados en hermandades recorren los caminos de Doñana durante días, entre cantes, oraciones, bailes y convivencia. El punto culminante llega la madrugada del lunes de Pentecostés, cuando los almonteños saltan la reja y sacan en procesión a la Virgen del Rocío."
          - "Si quieres vivirlo sin ser peregrino, puedes visitar la aldea y ver el paso de las hermandades y las carretas. Las calles son de arena y hay mucha gente, el calor es fuerte y los alojamientos y aparcamientos se agotan. Lleva agua, calzado cómodo y mucha paciencia, y respeta el carácter religioso de la romería y el entorno natural de Doñana."
        faq:
          - p: "¿Cuándo es la Romería del Rocío?"
            r: "Por Pentecostés, 50 días después del Domingo de Resurrección, normalmente entre mayo y junio. El día principal es el lunes."
          - p: "¿Dónde se celebra?"
            r: "En la aldea de El Rocío, en Almonte (Huelva), junto al Parque Nacional de Doñana."
          - p: "¿Qué es el salto de la reja?"
            r: "Es el momento en el que los almonteños saltan la reja que protege a la Virgen para sacarla en procesión, en la madrugada del lunes de Pentecostés."
          - p: "¿Se puede ir sin ser romero?"
            r: "Sí, pero el acceso es complicado: hay mucha gente, poco aparcamiento y calles de arena. Consulta con antelación cómo llegar y si hay restricciones de tráfico."
          - p: "¿Qué hay que llevar?"
            r: "Agua, sombrero, protección solar, calzado cómodo y ropa para el calor del día y el fresco de la noche. Respeta el entorno natural y no dejes basura."
          - p: "¿Es buen plan con niños?"
            r: "Con cuidado: hay mucho calor, mucha gente y trayectos largos. Mejor visitar la aldea en las horas de menos afluencia."
  - id: feria-malaga
    regla: { tipo: fija, inicio: "08-15", fin: "08-22" }
    aprox: true
    temas: [fiestas]
    lugar: { provincia: "Málaga", municipio: "Málaga" }
    fuente: "https://www.spain.info/es/agenda/feria-malaga/"
    es: { titulo: "Feria de Málaga", resumen: "Una semana de agosto con casetas, música y baile en el centro y en el recinto de Cortijo de Torres." }
    en: { titulo: "Málaga Fair", resumen: "A week in August of marquees, music and dancing, in the centre and at the Cortijo de Torres fairground." }
    relacionados: [semana-santa-malaga, feria-abril, verbenas]
    contenido:
      es:
        texto:
          - "La Feria de Málaga, a mediados de agosto, es una de las ferias más animadas del sur: una semana de música, baile, casetas, fuegos artificiales y vino dulce. Se celebra en dos escenarios: la Feria del Centro, de día, y la Feria de Cortijo de Torres, de noche."
          - "Durante el día, el centro histórico se llena de peñas, música, fandangos verdiales y gente vestida de gitana o de corto. Por la noche, el recinto de Cortijo de Torres reúne casetas, atracciones, conciertos y mucho ambiente. Hay actividades para todos los públicos, y mucho pescaíto frito y vino de Málaga."
          - "Ve al centro de día y al recinto de noche. Evita el coche y usa los autobuses o el transporte público de la feria, porque el tráfico y el aparcamiento son complicados. Lleva calzado cómodo, ropa fresca y paciencia, y reserva alojamiento con antelación."
        faq:
          - p: "¿Cuándo es la Feria de Málaga?"
            r: "A mediados de agosto, durante una semana. Las fechas exactas cambian cada año."
          - p: "¿Qué es la Feria del Centro?"
            r: "La parte diurna de la feria, en el centro histórico, con música, baile y ambiente popular."
          - p: "¿Qué es Cortijo de Torres?"
            r: "El recinto ferial donde se celebra la feria de noche, con casetas, conciertos y atracciones."
          - p: "¿Cómo llegar a Cortijo de Torres?"
            r: "En autobuses y servicios especiales de la feria. Evita el coche, porque el aparcamiento es difícil."
          - p: "¿Qué se come y se bebe?"
            r: "Pescaíto frito, espetos, jamón y vino dulce de Málaga, entre otras cosas."
          - p: "¿Es buen plan con niños?"
            r: "Por el día y en el centro, sí. Por la noche hay mucha gente y ruido."
