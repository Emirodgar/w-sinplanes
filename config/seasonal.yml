  - id: loteria-navidad
    regla: { tipo: fija, inicio: "12-22" }
    temas: [pantalla, navidad]
    es: { titulo: "Sorteo de la Lotería de Navidad", resumen: "Los niños de San Ildefonso cantan los premios desde primera hora. Una tradición que se sigue en directo." }
    en: { titulo: "Christmas Lottery draw", resumen: "Schoolchildren sing out the winning numbers from early morning. A tradition watched live." }
    relacionados: [cabalgata-reyes, campanadas, luces-navidad]
    contenido:
      es:
        texto:
          - "El Sorteo de la Lotería de Navidad, cada 22 de diciembre, es uno de los ritos más seguidos de la Navidad en España. Los niños y niñas de San Ildefonso cantan los números y los premios con su melodía inconfundible, que se escucha en radios y televisiones de todo el país."
          - "El sorteo se celebra desde hace años en el Teatro Real de Madrid y dura varias horas desde primera hora de la mañana. El premio más famoso es El Gordo, pero hay muchos premios, y se juega en familia, entre amigos o en el trabajo, a menudo con un número compartido."
          - "Puedes seguirlo por televisión o por radio, o consultar los resultados en la web oficial de Loterías. El acceso al Teatro Real es limitado, así que lo habitual es verlo desde casa. Si has jugado, guarda bien el décimo y revisa los plazos para cobrar los premios."
        faq:
          - p: "¿Cuándo es el sorteo de Navidad?"
            r: "El 22 de diciembre, desde primera hora de la mañana. Dura varias horas."
          - p: "¿Dónde se celebra?"
            r: "En el Teatro Real de Madrid. El acceso del público es limitado."
          - p: "¿Quiénes cantan los números?"
            r: "Los niños y niñas del Colegio de San Ildefonso, que los cantan junto con los premios."
          - p: "¿Cómo seguirlo?"
            r: "Por televisión, radio o internet. También puedes comprobar los resultados en la web oficial de Loterías."
          - p: "¿Cuándo hay que cobrar el premio?"
            r: "Los premios tienen un plazo para cobrarse. Consulta las condiciones y los plazos en la web oficial de Loterías."
          - p: "¿Es buen plan con niños?"
            r: "Sí, a muchos les encanta oír cantar los números y el ambiente de la mañana."
  - id: campanadas
    regla: { tipo: fija, inicio: "12-31" }
    temas: [pantalla, navidad, fiestas]
    es: { titulo: "Campanadas de Nochevieja", resumen: "Las doce uvas con las campanadas de la Puerta del Sol, en directo o por televisión." }
    en: { titulo: "New Year's Eve chimes", resumen: "Twelve grapes with the twelve chimes from Puerta del Sol, live or on TV." }
    relacionados: [loteria-navidad, cabalgata-reyes, luces-navidad]
    contenido:
      es:
        texto:
          - "Las Campanadas de Nochevieja marcan el cambio de año en España con una tradición única: tomar doce uvas, una con cada campanada, para recibir el nuevo año con suerte. Se retransmiten en directo desde el reloj de la Puerta del Sol de Madrid y se siguen en casi todos los hogares."
          - "Mucha gente las ve por televisión, en casa o con amigos y familia, y otros prefieren ir a una plaza. En la Puerta del Sol, el acceso suele tener un aforo limitado y controles de seguridad, así que consulta las condiciones y llega con tiempo. Otras ciudades montan sus propios actos en las plazas principales."
          - "Para las uvas, algunos consejos prácticos: pela y quita las pepitas, prepara las doce uvas con antelación y empieza con las primeras campanadas, no con los cuartos. Después, brindis, cotillón y fiesta hasta la madrugada, o a descansar, según el plan."
        faq:
          - p: "¿Cuándo son las Campanadas?"
            r: "La noche del 31 de diciembre, a las 00:00. Las doce campanadas del reloj marcan el cambio de año."
          - p: "¿Por qué se toman doce uvas?"
            r: "Es una tradición que consiste en tomar una uva con cada campanada para recibir el año con suerte. Se hace en toda España."
          - p: "¿Puedo ir a la Puerta del Sol?"
            r: "Sí, pero el acceso suele tener aforo limitado y controles de seguridad. Consulta las condiciones del Ayuntamiento de Madrid y llega con tiempo."
          - p: "¿Qué canales las retransmiten?"
            r: "Varios canales de televisión emiten las campanadas en directo desde la Puerta del Sol. Consulta la programación."
          - p: "¿Cómo prepararse las uvas?"
            r: "Pela las uvas y quita las pepitas, ten doce preparadas y empieza con las campanadas, no con los cuartos que las preceden."
          - p: "¿Es buen plan con niños?"
            r: "Sí, en casa o en un acto tranquilo. Con niños pequeños, las uvas se pueden preparar peladas, sin pepitas o cortadas para evitar atragantamientos."

  # ---- Citas periódicas añadidas desde el rastreo de spain.info (solo lo que se repite cada año) ----
  - id: semana-santa-sevilla
    regla: { tipo: pascua, desde: -7, hasta: 0 }
    temas: [fiestas, cultura]
    lugar: { provincia: "Sevilla", municipio: "Sevilla" }
    fuente: "https://www.spain.info/es/agenda/semana-santa-sevilla/"
    es: { titulo: "Semana Santa de Sevilla", resumen: "Decenas de hermandades recorren la ciudad cada día con sus pasos y sus nazarenos. La Madrugá del Viernes Santo es la noche más multitudinaria." }
    en: { titulo: "Holy Week in Seville", resumen: "Dozens of brotherhoods cross the city each day with their floats and hooded penitents. Good Friday’s Madrugá is the busiest night." }
    relacionados: [semana-santa, feria-abril, semana-santa-malaga]
    contenido:
      es:
        texto:
          - "La Semana Santa de Sevilla es probablemente la más famosa de España. Durante ocho días, unas sesenta hermandades recorren la ciudad con sus pasos de Cristo y de la Virgen, acompañadas de nazarenos, bandas de música y miles de personas en las calles."
          - "Todas las hermandades pasan por la Carrera Oficial, que va de la Campana a la Catedral. La noche entre el Jueves y el Viernes Santo es la Madrugá, la de mayor emoción y afluencia, con hermandades como el Silencio, el Gran Poder, la Macarena, los Gitanos y la Esperanza de Triana."
          - "Es una fiesta multitudinaria: las calles del centro se llenan y los cortejos tardan horas en pasar. Descarga el programa oficial, elige las hermandades que quieres ver y llega con tiempo. Reserva alojamiento con meses de antelación, usa el transporte público y sé paciente con los cortes de calles. Y recuerda: es un acto religioso, así que respeta el silencio y a los nazarenos."
        faq:
          - p: "¿Cuándo es la Semana Santa de Sevilla?"
            r: "Del Domingo de Ramos al Domingo de Resurrección, que cambia cada año entre marzo y abril. Consulta el calendario oficial para las fechas exactas."
          - p: "¿Qué es la Madrugá?"
            r: "Es la noche entre el Jueves Santo y el Viernes Santo. Varias de las hermandades más emblemáticas salen en esas horas y es el momento de mayor afluencia y emoción."
          - p: "¿Dónde ver las procesiones?"
            r: "En la Carrera Oficial (de la Campana a la Catedral) hay mucho ambiente pero también mucha gente. Otras zonas del centro o los barrios, como Triana, permiten verlas con más tranquilidad."
          - p: "¿Hay que reservar?"
            r: "No para ver las procesiones desde la calle, pero sí el alojamiento y los restaurantes, que se agotan con meses de antelación."
          - p: "¿Cómo consulto los horarios?"
            r: "El Consejo de Hermandades y Cofradías publica el programa oficial con los itinerarios y los horarios de cada hermandad. También hay aplicaciones y webs con seguimiento en tiempo real."
          - p: "¿Qué hay que llevar o tener en cuenta?"
            r: "Calzado cómodo, ropa por capas y paciencia. Respeta el silencio, no cruces entre los cortejos y evita el flash cerca de los pasos."
  - id: semana-santa-malaga
    regla: { tipo: pascua, desde: -7, hasta: 0 }
    temas: [fiestas, cultura]
    lugar: { provincia: "Málaga", municipio: "Málaga" }
    fuente: "https://www.spain.info/es/agenda/semana-santa-malaga/"
    es: { titulo: "Semana Santa de Málaga", resumen: "Tronos de gran tamaño que desfilan a hombros por el centro, con el traslado del Cristo de la Esperanza como momento destacado." }
    en: { titulo: "Holy Week in Málaga", resumen: "Huge thrones carried on shoulders through the city centre, with the Cristo de la Esperanza procession a highlight." }
    relacionados: [semana-santa, semana-santa-sevilla, feria-malaga]
    contenido:
      es:
        texto:
          - "La Semana Santa de Málaga se distingue por sus tronos de gran tamaño, que desfilan a hombros de cientos de portadores por el centro de la ciudad. Fiesta de Interés Turístico Internacional, cada procesión es un espectáculo de música, flores, incienso y emoción popular."
          - "Las cofradías salen desde sus templos y barrios y se dirigen a la Carrera Oficial, en la Alameda y calle Larios, donde hay una tribuna y sillas. Una cita muy esperada es la del Jueves Santo, con la Legión acompañando al Cristo de la Buena Muerte, aunque cada día tiene sus propias procesiones y cada barrio su ambiente."
          - "Consulta el programa oficial de la Agrupación de Cofradías con los horarios y los itinerarios. Las calles del centro se llenan y los desfiles son lentos, así que llega con tiempo y elige un sitio. Reserva alojamiento con antelación y, si puedes, ve también a las procesiones de los barrios, más tranquilas."
        faq:
          - p: "¿Cuándo es la Semana Santa de Málaga?"
            r: "Del Domingo de Ramos al Domingo de Resurrección, entre marzo y abril según el año. Hay también actos previos desde el Viernes de Dolores."
          - p: "¿Qué la hace diferente?"
            r: "Los tronos son grandes y se llevan a hombros, y el ambiente mezcla fe, música y tradición popular. La Legión y las bandas de música tienen un papel importante."
          - p: "¿Dónde ver las procesiones?"
            r: "En la Carrera Oficial (Alameda, calle Larios y plaza de la Constitución), con más ambiente y más gente. Las procesiones de los barrios son una alternativa más tranquila."
          - p: "¿Hay que pagar?"
            r: "Ver las procesiones desde la calle es gratis. Hay sillas y tribunas de pago en la Carrera Oficial."
          - p: "¿Cómo consulto los horarios?"
            r: "La Agrupación de Cofradías publica el programa oficial con los itinerarios y los horarios de cada cofradía."
          - p: "¿Es buen plan con niños?"
            r: "Sí, con cuidado: hay mucha gente y esperas largas. Elige procesiones de tarde y un sitio con espacio."
  - id: semana-santa-valladolid
    regla: { tipo: pascua, desde: -7, hasta: 0 }
    temas: [fiestas, cultura]
    lugar: { provincia: "Valladolid", municipio: "Valladolid" }
    fuente: "https://www.spain.info/es/agenda/semana-santa-valladolid/"
    es: { titulo: "Semana Santa de Valladolid", resumen: "Procesiones sobrias con imaginería de madera policromada de los grandes escultores castellanos." }
    en: { titulo: "Holy Week in Valladolid", resumen: "Austere processions of polychrome wooden sculpture by great Castilian sculptors." }
    relacionados: [semana-santa, semana-santa-salamanca, seminci]
    contenido:
      es:
        texto:
          - "La Semana Santa de Valladolid es sobria e intensa, y destaca por su imaginería de madera policromada, obra de grandes escultores castellanos como Gregorio Fernández y Juan de Juni. Es Fiesta de Interés Turístico Internacional y atrae a visitantes de toda España."
          - "Los pasos recorren las calles del centro con cofradías, bandas de música y mucho silencio. El Viernes Santo concentra dos citas muy esperadas: el Sermón de las Siete Palabras en la Plaza Mayor y la Procesión General de la Sagrada Pasión, en la que desfilan los principales pasos de la ciudad."
          - "Si quieres profundizar, el Museo Nacional de Escultura, en Valladolid, guarda obras de los mismos escultores y es un buen complemento. Consulta el programa oficial, llega pronto a un buen sitio y abrígate, porque en Castilla las noches de abril son frescas."
        faq:
          - p: "¿Cuándo es la Semana Santa de Valladolid?"
            r: "Del Domingo de Ramos al Domingo de Resurrección, que cae entre marzo y abril según el año."
          - p: "¿Qué la hace especial?"
            r: "La imaginería castellana de madera policromada, con pasos de gran valor artístico, y un ambiente sobrio y silencioso."
          - p: "¿Qué procesión no hay que perderse?"
            r: "La Procesión General de la Sagrada Pasión, el Viernes Santo por la tarde, que reúne a los principales pasos. El Sermón de las Siete Palabras, el mismo día en la Plaza Mayor, también es muy popular."
          - p: "¿Dónde ver los pasos fuera de Semana Santa?"
            r: "En el Museo Nacional de Escultura de Valladolid, con obras de Gregorio Fernández y Juan de Juni."
          - p: "¿Qué ropa llevar?"
            r: "Ropa de abrigo: en Valladolid las tardes y noches de marzo y abril son frescas, y se pasa mucho tiempo en la calle."
          - p: "¿Es buen plan con niños?"
            r: "Con cuidado: hay mucha gente y esperas largas. Elige procesiones de tarde y un sitio con espacio."
  - id: semana-santa-salamanca
    regla: { tipo: pascua, desde: -7, hasta: 0 }
    temas: [fiestas, cultura]
    lugar: { provincia: "Salamanca", municipio: "Salamanca" }
    fuente: "https://www.spain.info/es/agenda/semana-santa-salamanca/"
    es: { titulo: "Semana Santa de Salamanca", resumen: "Cofradías que recorren la ciudad de piedra dorada, con la procesión del Cristo Yacente entre sus citas más sentidas." }
    en: { titulo: "Holy Week in Salamanca", resumen: "Brotherhoods process through the golden-stone city, with the Cristo Yacente procession among its most moving moments." }
    relacionados: [semana-santa, semana-santa-valladolid, semana-santa-caceres]
    contenido:
      es:
        texto:
          - "La Semana Santa de Salamanca se vive entre piedra dorada, con procesiones que recorren calles y plazas de una ciudad Patrimonio de la Humanidad. Las cofradías y hermandades sacan pasos de gran valor artístico en un ambiente recogido y solemne."
          - "Muchas procesiones pasan por la Plaza Mayor y por los alrededores de la Catedral, con un escenario difícil de igualar. Una de las citas más sentidas es la procesión del Cristo Yacente, y cada cofradía tiene su estilo y su recorrido."
          - "Consulta el programa oficial de las cofradías con los horarios y los itinerarios. Si vas a ver procesiones por la noche, abrígate: en Salamanca las noches de abril son frías. Reserva alojamiento con antelación, porque la ciudad se llena de visitantes, y respeta el silencio de los cortejos."
        faq:
          - p: "¿Cuándo es la Semana Santa de Salamanca?"
            r: "Del Domingo de Ramos al Domingo de Resurrección, entre marzo y abril según el año."
          - p: "¿Dónde ver las procesiones?"
            r: "En la Plaza Mayor y en las calles del casco histórico, sobre todo cerca de la Catedral. Cada cofradía tiene su itinerario."
          - p: "¿Qué procesión es la más sentida?"
            r: "La del Cristo Yacente es una de las más recordadas, con un ambiente muy sobrio. Consulta el programa para el día y la hora exactos."
          - p: "¿Es gratis?"
            r: "Sí, ver las procesiones desde la calle es gratuito."
          - p: "¿Qué ropa llevar?"
            r: "Ropa de abrigo, porque las noches son frías en Salamanca, y calzado cómodo."
          - p: "¿Es buen plan con niños?"
            r: "Sí, con precaución: hay mucha gente y esperas largas."
  - id: semana-santa-caceres
    regla: { tipo: pascua, desde: -7, hasta: 0 }
    temas: [fiestas, cultura]
    lugar: { provincia: "Cáceres", municipio: "Cáceres" }
    fuente: "https://www.spain.info/es/agenda/semana-santa-caceres/"
    es: { titulo: "Semana Santa de Cáceres", resumen: "Procesiones por la ciudad monumental, cuyas plazas medievales sirven de escenario a pasos y cofradías." }
    en: { titulo: "Holy Week in Cáceres", resumen: "Processions through the monumental old town, whose medieval squares serve as a stage for floats and brotherhoods." }
    relacionados: [semana-santa, semana-santa-salamanca, festival-womad-caceres]
    contenido:
      es:
        texto:
          - "La Semana Santa de Cáceres se celebra en la ciudad monumental, Patrimonio de la Humanidad, y el escenario hace que cada procesión tenga un encanto especial. Los pasos recorren plazas medievales, callejones y palacios, entre muros de piedra y farolas."
          - "Las cofradías salen de sus templos de la ciudad vieja y de otros barrios, con procesiones sobrias y de gran recogimiento. La combinación de patrimonio y tradición convierte a Cáceres en un buen destino para quienes quieren vivir una Semana Santa menos multitudinaria que las de las grandes capitales."
          - "Consulta el programa oficial de las cofradías con los horarios y los itinerarios, y reserva alojamiento con antelación. Camina por el casco antiguo, con calzado cómodo, ya que las calles son empedradas, y respeta el silencio de las procesiones."
        faq:
          - p: "¿Cuándo es la Semana Santa de Cáceres?"
            r: "Del Domingo de Ramos al Domingo de Resurrección, entre marzo y abril según el año."
          - p: "¿Dónde ver las procesiones?"
            r: "En la ciudad monumental, con sus plazas y callejones, y en otros barrios. Cada cofradía tiene su itinerario."
          - p: "¿Qué la hace distinta?"
            r: "El entorno monumental de piedra y un ambiente recogido, con menos masificación que en las grandes capitales."
          - p: "¿Es gratis?"
            r: "Sí, ver las procesiones desde la calle es gratuito."
          - p: "¿Qué calzado llevar?"
            r: "Calzado cómodo y con buena suela: las calles del casco antiguo son empedradas y hay cuestas."
          - p: "¿Es buen plan con niños?"
            r: "Sí, con precaución por las esperas y las multitudes."
  - id: semana-santa-marinera-valencia
