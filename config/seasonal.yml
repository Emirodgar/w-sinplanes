  - id: pilar
    fuente: "https://www.spain.info/es/agenda/fiestas-pilar/"
    regla: { tipo: fija, inicio: "10-12" }
    temas: [fiestas]
    lugar: { provincia: "Zaragoza", municipio: "Zaragoza" }
    es: { titulo: "Fiestas del Pilar", resumen: "La Ofrenda de Flores del 12 de octubre es el momento central de una semana de fiestas en Zaragoza." }
    en: { titulo: "Fiestas del Pilar", resumen: "The 12 October Flower Offering is the highlight of a week of festivities in Zaragoza." }
    relacionados: [san-fermin, fallas, feria-abril]
    contenido:
      es:
        texto:
          - "Las Fiestas del Pilar son las fiestas mayores de Zaragoza, en honor a la Virgen del Pilar, y se celebran en torno al 12 de octubre, que además es fiesta nacional. Durante una semana, la ciudad se llena de conciertos, desfiles, actos populares y mucho ambiente en la calle."
          - "El momento central es la Ofrenda de Flores, el 12 de octubre, cuando miles de personas, muchas con trajes regionales aragoneses, desfilan por el centro hasta la plaza del Pilar para depositar sus flores ante la Virgen y formar un gran manto floral. Al día siguiente, el 13 de octubre, se celebra la Ofrenda de Frutos."
          - "Además de la ofrenda, hay gigantes y cabezudos, conciertos en distintos escenarios, espectáculos de pirotecnia y actos culturales y deportivos. Consulta el programa oficial del Ayuntamiento de Zaragoza. Reserva alojamiento con antelación, porque es una fiesta muy popular y el centro se llena. Y para la ofrenda, llega pronto si quieres ver el desfile."
        faq:
          - p: "¿Cuándo son las Fiestas del Pilar?"
            r: "En torno al 12 de octubre. Duran aproximadamente una semana, con el día 12 como jornada principal."
          - p: "¿Qué es la Ofrenda de Flores?"
            r: "Es el desfile en el que miles de personas, muchas con trajes regionales, llevan flores a la Virgen del Pilar para formar un gran manto floral. Se celebra el 12 de octubre."
          - p: "¿Hay que reservar?"
            r: "Para ver la ofrenda no. Sí el alojamiento, porque Zaragoza se llena durante las fiestas."
          - p: "¿Qué más se puede hacer?"
            r: "Conciertos, gigantes y cabezudos, espectáculos de fuegos artificiales, ferias gastronómicas y actividades infantiles. El programa oficial lo publica el ayuntamiento."
          - p: "¿Es gratis?"
            r: "La mayoría de los actos son gratuitos, pero algunos conciertos y espectáculos tienen entrada."
          - p: "¿Es buen plan con niños?"
            r: "Sí, hay muchas actividades infantiles y el desfile de gigantes y cabezudos suele encantarles. Cuidado con las aglomeraciones en el día 12."
