# Calendario estacional de sinplanes.com
# ------------------------------------------------------------
# Se edita a mano (o con ayuda de IA) muy de vez en cuando.
# El pipeline lo convierte cada día en planes con fechas reales.
#
# temporada: planes "de siempre" que valen para todo un mes o varios.
# citas:     eventos que se repiten cada año con una regla de fecha.
#
# Reglas de fecha (citas):
#   fija:     inicio "MM-DD", fin "MM-DD" (opcional)
#   pascua:   desde / hasta = días respecto al Domingo de Resurrección
#   enesimo:  mes, dia_semana (0=domingo … 6=sábado), n (1,2,3… o -1 = último), dura (días, opcional)
# aprox: true → la web avisa de que la fecha es orientativa.
# lugar: omítelo si es un plan para toda España; si no, provincia y municipio.

temporada:
  - id: castanas-otono
    meses: [10, 11]
    temas: [naturaleza, gastronomia]
    es: { titulo: "Ir a coger castañas", resumen: "Los castañares de El Bierzo, el Valle del Genal, la sierra de Francia o el Valle del Tiétar se llenan de erizos. Pide permiso si el terreno es privado." }
    en: { titulo: "Go chestnut picking", resumen: "Chestnut groves in El Bierzo, the Genal Valley, Sierra de Francia or the Tiétar Valley fill with burrs. Ask permission on private land." }
    imagen: "/img/planes/castanas-otono.webp"
    imagen_tam: [694, 422]
    relacionados: [magostos, setas, hayedos]
    contenido:
      es:
        imagen_alt: "Suelo de un castañar en otoño cubierto de hojas doradas y erizos de castaña"
        texto:
          - "Cuando llega octubre, los castañares del norte y del centro de la península se llenan de erizos caídos entre las hojas. Salir a coger castañas es uno de los planes de otoño más sencillos y más agradecidos: un paseo tranquilo por el monte, una cesta que se va llenando y, al volver, algo rico que asar en casa."
          - "La temporada empieza, según la altitud y el año, hacia mediados de octubre y se alarga hasta bien entrado noviembre. Los mejores castañares suelen estar en zonas de montaña con clima húmedo: El Bierzo (León), el Valle del Genal (Málaga), la sierra de Francia (Salamanca), el Valle del Tiétar (Ávila), además de buena parte de Galicia y Asturias."
          - "Lo más importante es saber de quién es el castañar. Muchos son fincas privadas con dueño que las cuida y las vende, y recoger en ellas sin permiso puede tener consecuencias. Pregunta en el pueblo, en el ayuntamiento o en una casa rural de la zona: es habitual que alguien te indique dónde se puede coger o te ponga en contacto con un propietario."
          - "Lleva calzado cerrado que agarre bien, guantes gruesos (los erizos pinchan de verdad), una cesta o un saco y ropa que no te importe manchar. Las castañas caen solas cuando están maduras: lo normal es recoger las del suelo, sin varear los árboles ni dañarlos. Los días siguientes a la lluvia y al viento suelen ser los más generosos."
          - "Ya en casa, haz un corte en la piel de cada castaña antes de asarla o cocerla para que no revienten. Se conservan mejor en un lugar fresco o en la nevera, y conviene consumirlas en pocos días. El broche natural de este plan es un magosto: castañas asadas, hoguera y vino nuevo."
        faq:
          - p: "¿Cuándo es la temporada de castañas?"
            r: "En España, de mediados de octubre a mediados de noviembre aproximadamente. En zonas bajas empieza antes y en las más altas se retrasa unos días. Si quieres acertar, pregunta por la zona la semana antes: la cosecha cambia de un año a otro según la lluvia y el calor del verano."
          - p: "¿Se pueden coger castañas en cualquier monte?"
            r: "No siempre. Muchos castañares son propiedad privada y, en monte público, cada ayuntamiento o comunidad puede tener sus propias normas. Pregunta en el ayuntamiento o a los vecinos antes de recoger, y no entres en fincas cercadas."
          - p: "¿Dónde ir a coger castañas?"
            r: "Los destinos clásicos son El Bierzo (León), el Valle del Genal (Málaga), la sierra de Francia (Salamanca) y el Valle del Tiétar (Ávila), además de Galicia, Asturias y la zona de Aracena. Todos tienen castañares muy extensos y mucha tradición."
          - p: "¿Qué hay que llevar?"
            r: "Guantes gruesos, calzado cerrado, una cesta o saco y ropa de abrigo que no te importe ensuciar. Los erizos se abren pisándolos con la suela del zapato, sin necesidad de herramientas."
          - p: "¿Cómo se asan las castañas?"
            r: "Haz un corte en la piel de cada una, ábrelas en una sartén de agujeros, en el horno o sobre una parrilla, y déjalas de 20 a 30 minutos hasta que la piel se abra. Envuélvelas unos minutos en un paño para que se sigan haciendo con su propio vapor y se pelen mejor."
          - p: "¿Es buen plan con niños?"
            r: "Sí, aunque con cuidado: los erizos pinchan. Dales guantes y enséñales a no meter la mano sin mirar. Para ellos es una actividad que mezcla paseo, juego y recompensa."
          - p: "¿Qué es un magosto?"
            r: "Es la fiesta tradicional de otoño de Galicia, Asturias y El Bierzo: se asan castañas en una hoguera y se comen con vino nuevo o sidra, sobre todo por San Martín, el 11 de noviembre."
  - id: magostos
    meses: [11]
    temas: [fiestas, gastronomia]
    es: { titulo: "Celebrar un magosto", resumen: "Castañas asadas, hoguera y vino nuevo: la fiesta de otoño de Galicia, Asturias y El Bierzo alrededor de San Martín." }
    en: { titulo: "Join a magosto", resumen: "Roast chestnuts, bonfires and new wine: the autumn feast of Galicia, Asturias and El Bierzo around Saint Martin's Day." }
  - id: setas
    meses: [10, 11]
    temas: [naturaleza, gastronomia]
    es: { titulo: "Salir a por setas", resumen: "Soria, el Pirineo y los montes de León y Zamora son los clásicos. Infórmate de la regulación y el permiso de recolección de cada zona." }
    en: { titulo: "Go mushroom foraging", resumen: "Soria, the Pyrenees and the hills of León and Zamora are the classics. Check each area's foraging rules and permits." }
    relacionados: [castanas-otono, hayedos, magostos]
    contenido:
      es:
        texto:
          - "Con las primeras lluvias de otoño, los pinares, robledales y castañares se llenan de setas, y salir a buscarlas se convierte en uno de los planes más esperados del año. Es una excusa perfecta para pasar la mañana en el monte, con o sin cesta llena."
          - "La temporada fuerte va de octubre a noviembre, aunque depende mucho de la lluvia y de las temperaturas: tras unas semanas húmedas y sin heladas, el monte arranca. Provincias como Soria, el Pirineo, León, Zamora, la Sierra de Gredos o Cataluña son clásicos, y en muchas hay rutas micológicas y jornadas organizadas."
          - "Antes de salir, infórmate de la normativa de la zona. Varias comunidades exigen un permiso o una autorización de recolección (en Castilla y León, por ejemplo, funciona el sistema de Micocyl), y existen límites de cantidad, zonas acotadas y horarios. Las normas cambian de un sitio a otro, así que consulta la web del ayuntamiento o de la comunidad autónoma."
          - "Si no tienes experiencia, la regla de oro es no comer ninguna seta que no hayas identificado con seguridad. Lo más sensato para empezar es apuntarte a una salida guiada o a una jornada micológica con un experto, y llevar una guía de campo. Recoge con cesta de mimbre, que deja caer las esporas y permite que el ejemplar respire, y corta o extrae con cuidado sin arrasar el terreno."
        faq:
          - p: "¿Cuándo es la temporada de setas?"
            r: "En España, la temporada principal va de octubre a noviembre, aunque en algunas zonas se alarga hasta diciembre o empieza en septiembre. Depende de la lluvia, la altitud y la temperatura: tras varias semanas húmedas y sin heladas, el monte arranca."
          - p: "¿Dónde buscar setas?"
            r: "Soria, el Pirineo, los montes de León y Zamora, la Sierra de Gredos o Cataluña son destinos clásicos. Lo más práctico es preguntar en la oficina de turismo o en una casa rural de la zona, donde suelen conocer las rutas y la normativa vigente."
          - p: "¿Hace falta permiso para recoger setas?"
            r: "En muchas zonas sí. Varias comunidades autónomas exigen un permiso o una autorización de recolección, y puede haber límites de cantidad y zonas acotadas. Infórmate siempre antes de salir en la web del ayuntamiento o de la comunidad autónoma."
          - p: "¿Cómo sé si una seta es comestible?"
            r: "No te fíes de trucos populares: solo se puede comer una seta si la has identificado con certeza. Si dudas, no la recojas. Una salida guiada o una jornada micológica es la forma más segura de aprender, y en caso de intoxicación hay que acudir a urgencias o llamar al 112."
          - p: "¿Qué hay que llevar?"
            r: "Una cesta de mimbre, una navaja, una guía de identificación, calzado de monte, ropa de abrigo, agua y algo de comer. Evita las bolsas de plástico, que estropean las setas y no dejan caer las esporas."
          - p: "¿Es buen plan con niños?"
            r: "Sí, siempre que vayan acompañados y sepan que no se toca ni se come nada sin que un adulto lo revise. Los más pequeños disfrutan mucho de la búsqueda, pero conviene elegir recorridos sencillos y fijarse en que no se lleven las manos a la boca."
  - id: hayedos
    meses: [10, 11]
    temas: [naturaleza]
    es: { titulo: "Ver el otoño en un hayedo", resumen: "Irati, Montejo, Tejera Negra o el hayedo de Otzarreta cambian de color en pocas semanas. Ve entre semana para evitar cupos completos." }
    en: { titulo: "See autumn colours in a beech forest", resumen: "Irati, Montejo, Tejera Negra or Otzarreta turn gold in a few weeks. Go on a weekday to avoid full visitor quotas." }
    imagen: "/img/planes/hayedos.webp"
    imagen_tam: [989, 529]
    relacionados: [castanas-otono, setas, berrea]
    contenido:
      es:
        imagen_alt: "Sendero cubierto de hojas entre hayas con los colores del otoño y algo de niebla al fondo"
        texto:
          - "Durante unas pocas semanas de otoño, los hayedos pasan del verde al amarillo, el naranja y el cobrizo, y el suelo se cubre de hojas. Es uno de los espectáculos naturales más fotogénicos de España y un plan perfecto para caminar sin prisa entre troncos plateados."
          - "El mejor momento suele ser entre mediados de octubre y mediados de noviembre, aunque el pico de color cambia cada año según el frío, la lluvia y el viento. Entre los hayedos más conocidos están la Selva de Irati (Navarra), el Hayedo de Montejo (Madrid), el Hayedo de la Tejera Negra (Guadalajara) y el de Otzarreta (Bizkaia), además de los de Cantabria, Asturias y el Pirineo."
          - "Ojo con los cupos: algunos hayedos, como el de Montejo, limitan el número de visitantes o exigen reserva o permiso de acceso, sobre todo los fines de semana de máximo color. Consulta antes la web del espacio protegido, y si puedes, ve entre semana: habrá menos gente y más silencio."
          - "Lleva calzado cómodo que agarre sobre hojas mojadas, una capa de abrigo y chubasquero, que en el hayedo la humedad es habitual, y no te salgas de los senderos señalizados. Las mañanas con algo de niebla y la luz baja del atardecer son las mejores para fotografiar."
        faq:
          - p: "¿Cuándo es el mejor momento para ver un hayedo en otoño?"
            r: "Entre mediados de octubre y mediados de noviembre, con un pico de color que suele durar unas dos o tres semanas. Varía cada año con el frío y la lluvia, así que conviene mirar el parte del espacio protegido o las redes de los centros de visitantes."
          - p: "¿Cuáles son los mejores hayedos de España?"
            r: "La Selva de Irati (Navarra), el Hayedo de Montejo (Madrid), el Hayedo de la Tejera Negra (Guadalajara) y el de Otzarreta (Bizkaia) son los más conocidos. También destacan los de Cantabria, Asturias y el Pirineo."
          - p: "¿Hace falta reservar o pedir permiso?"
            r: "En algunos sí. El Hayedo de Montejo, por ejemplo, limita las visitas y exige autorización, y en otros espacios hay cupos o aparcamientos que se llenan los fines de semana de máximo color. Consulta la web del espacio protegido antes de ir."
          - p: "¿Se puede ir con niños o con perro?"
            r: "Los recorridos cortos y señalizados son aptos para niños. Con perro depende de cada espacio: en algunos están prohibidos o deben ir atados, así que conviene comprobarlo antes."
          - p: "¿Qué ropa y calzado llevar?"
            r: "Calzado cómodo que agarre sobre hojas mojadas, ropa de abrigo por capas y un chubasquero, porque la humedad y la temperatura bajan rápido en el bosque."
          - p: "¿Cómo evitar las aglomeraciones?"
            r: "Ve entre semana, a primera hora de la mañana o a última de la tarde, y evita los puentes y los fines de semana de máximo color. Una alternativa es elegir hayedos menos conocidos de la misma zona."
  - id: berrea
    meses: [9, 10]
    temas: [naturaleza]
    es: { titulo: "Escuchar la berrea del ciervo", resumen: "Al amanecer y al atardecer en Monfragüe, Cabañeros, la Sierra de Andújar o Riaño. Lleva prismáticos y guarda silencio." }
    en: { titulo: "Hear the red deer rut", resumen: "At dawn and dusk in Monfragüe, Cabañeros, Sierra de Andújar or Riaño. Bring binoculars and keep quiet." }
    relacionados: [hayedos, setas, perseidas]
    contenido:
      es:
        texto:
          - "A finales de verano los machos de ciervo empiezan a bramar para atraer a las hembras y retar a sus rivales. Ese rugido grave y poderoso, que resuena por el monte al amanecer y al atardecer, es la berrea, uno de los espectáculos de fauna más impresionantes de España."
          - "La berrea se concentra entre septiembre y octubre, con el momento álgido normalmente a finales de septiembre y principios de octubre, aunque varía según la zona y el año. Los lugares más conocidos son el Parque Nacional de Cabañeros, el Parque Nacional de Monfragüe, la Sierra de Andújar, la Reserva Nacional de Riaño y la Sierra de la Culebra, entre otros."
          - "Lo mejor es llegar antes del amanecer o un rato antes del anochecer, cuando los ciervos están más activos, y escuchar en silencio desde un punto de observación. Lleva prismáticos, ropa de abrigo y de colores discretos, y no uses linternas ni flash. Los ciervos en celo son imprevisibles: mantén siempre la distancia y no te acerques a ellos."
          - "En algunos espacios hay rutas guiadas, observatorios o accesos regulados durante la berrea, y conviene reservar con antelación. Consulta la web del espacio protegido o del centro de visitantes antes de ir."
        faq:
          - p: "¿Cuándo es la berrea del ciervo?"
            r: "Entre septiembre y octubre. El momento de mayor actividad suele ser a finales de septiembre y principios de octubre, aunque cambia según la zona y el año. Lo mejor es salir al amanecer o al atardecer."
          - p: "¿Dónde ver la berrea?"
            r: "Los lugares más conocidos son Cabañeros, Monfragüe, la Sierra de Andújar, la Reserva Nacional de Riaño y la Sierra de la Culebra. En muchos hay rutas guiadas, observatorios o puntos de escucha señalizados."
          - p: "¿Qué hay que llevar?"
            r: "Prismáticos, ropa de abrigo y de colores discretos (verdes, marrones, grises), calzado cómodo y algo de comer y beber. En las horas de más actividad hace fresco, aunque el día sea caluroso."
          - p: "¿Es peligroso acercarse a los ciervos?"
            r: "Sí. Los machos en celo están muy agresivos y son impredecibles. No te acerques, no los rodees ni les cortes el paso y mantén la distancia que indiquen los guías o los carteles."
          - p: "¿Hace falta reservar?"
            r: "En algunos espacios sí, sobre todo para rutas guiadas, observatorios o accesos regulados en plena berrea. Mira la web del espacio protegido o del centro de visitantes antes de ir, porque las plazas se agotan."
          - p: "¿Se puede ir con niños?"
            r: "Sí, es un plan muy bonito para ellos, pero hay que ir en silencio, a horas tempranas y sin separarse del grupo. Elige rutas sencillas y mejor con un guía."
  - id: vendimia
    meses: [9]
    temas: [gastronomia]
    es: { titulo: "Vivir la vendimia", resumen: "Rioja, Ribera del Duero, Jerez o el Penedès organizan visitas y fiestas de la vendimia en bodegas." }
    en: { titulo: "Experience the grape harvest", resumen: "Rioja, Ribera del Duero, Jerez and Penedès offer winery visits and harvest festivals." }
    relacionados: [castanas-otono, terrazas-primavera, berrea]
    contenido:
      es:
        texto:
          - "Septiembre es el mes de la vendimia en buena parte de España: los racimos maduros se cortan a mano o a máquina y las bodegas se llenan de olor a mosto. Vivirla de cerca, entre viñedos y lagares, es uno de los planes de final de verano con más encanto, y tiene mucho de fiesta."
          - "La fecha exacta cambia según la zona, la variedad y el año. Las uvas blancas y las variedades tempranas suelen recogerse desde finales de agosto, y las tintas más tardías pueden alargarse hasta octubre. Regiones como La Rioja, la Ribera del Duero, Jerez, el Penedès, Rías Baixas o La Mancha organizan visitas, catas y actividades relacionadas."
          - "Muchas bodegas ofrecen experiencias en las que puedes cortar racimos, pisar la uva o ver cómo llega la cosecha a la bodega, normalmente con reserva previa y de pago. Además hay fiestas dedicadas a la vendimia, como las de Jerez o las de San Mateo en Logroño, con pisado de uva, ofrendas del primer mosto y degustaciones."
          - "Si te apuntas a una experiencia en el viñedo, lleva calzado cerrado y cómodo, gorra, protector solar y ropa que pueda mancharse. Mejor ir a primera hora de la mañana, cuando hace menos calor y se trabaja con más tranquilidad."
        faq:
          - p: "¿Cuándo es la vendimia en España?"
            r: "Depende de la zona y la variedad, pero la época principal va de finales de agosto a octubre, con septiembre como mes central. Las uvas blancas y tempranas se recogen antes que las tintas tardías."
          - p: "¿Dónde vivir la vendimia?"
            r: "Los destinos clásicos son La Rioja, la Ribera del Duero, Jerez, el Penedès, Rías Baixas y La Mancha. Muchas bodegas organizan visitas y experiencias en esas fechas."
          - p: "¿Se puede participar en la vendimia?"
            r: "Sí, hay bodegas que ofrecen experiencias en las que puedes cortar racimos, pisar la uva o ver la entrada de la cosecha. Suelen ser de pago y requieren reserva previa, así que infórmate con tiempo."
          - p: "¿Hay fiestas de la vendimia?"
            r: "Sí. Entre las más conocidas están las Fiestas de la Vendimia de Jerez y las Fiestas de San Mateo y de la vendimia riojana en Logroño, con pisado de uva, ofrenda del mosto y degustaciones."
          - p: "¿Qué hay que llevar?"
            r: "Calzado cerrado y cómodo, gorra, protector solar y ropa que pueda mancharse. Mejor ir a primera hora de la mañana, cuando hace menos calor."
          - p: "¿Es buen plan con niños?"
            r: "En general sí. Muchas bodegas organizan actividades para familias, con pisado de uva simbólico y mosto sin alcohol. Pregunta al reservar si admiten niños."
  - id: piscinas-naturales
    meses: [6, 7, 8]
    temas: [agua, naturaleza]
    es: { titulo: "Bañarse en una piscina natural", resumen: "La Vera, el Valle del Jerte, Las Hurdes o la sierra de Gredos tienen pozas y gargantas de agua fría y clara." }
    en: { titulo: "Swim in a natural pool", resumen: "La Vera, Jerte Valley, Las Hurdes and the Gredos mountains have clear, cold river pools." }
    imagen: "/img/planes/piscinas-naturales.webp"
    imagen_tam: [1006, 539]
    relacionados: [playas-fluviales, perseidas, verbenas]
    contenido:
      es:
        imagen_alt: "Poza de agua verde y transparente entre rocas de granito con una bañista en una garganta de montaña"
        texto:
          - "Pozas de agua cristalina entre rocas de granito, pequeñas cascadas y gargantas frescas en pleno verano: las piscinas naturales son una de las mejores formas de huir del calor sin ir a la costa. Son agua de río o de arroyo de montaña, sin cloro ni socorrista, y eso las hace tan especiales como delicadas."
          - "Las zonas más conocidas están en el norte de Cáceres y el Sistema Central: La Vera, el Valle del Jerte (con sus famosos Pilones), Las Hurdes y la sierra de Gredos, en Ávila. También hay muchísimas en Galicia, Asturias, Cantabria, Castilla y León, el Pirineo y Sierra Nevada, y el agua suele ser fría incluso en agosto."
          - "Entra en el agua con calma, sobre todo si vienes de pasar horas al sol, porque el cambio de temperatura puede provocar un corte de digestión. No saltes sin conocer el fondo, ten cuidado con las rocas resbaladizas y no te bañes tras lluvias fuertes ni con el caudal alto. En las pozas no hay vigilancia, así que ve siempre acompañado y presta especial atención a los niños."
          - "Algunas pozas, por su fragilidad o por la afluencia, tienen aforo limitado, reserva previa o accesos regulados en verano, y los fines de semana de agosto se llenan pronto. Consulta antes la web del ayuntamiento o del espacio natural y llega temprano. Lleva calzado que agarre dentro del agua, no uses jabón ni cremas en la poza y llévate toda tu basura."
        faq:
          - p: "¿Dónde hay piscinas naturales en España?"
            r: "Las zonas más conocidas son La Vera y el Valle del Jerte (Cáceres), Las Hurdes, la sierra de Gredos (Ávila) y el Sistema Central, además de muchas pozas de Galicia, Asturias, Cantabria, el Pirineo y Sierra Nevada."
          - p: "¿Cuándo ir a una piscina natural?"
            r: "De junio a septiembre, con julio y agosto como meses de más afluencia. Si quieres tranquilidad, ve entre semana y llega temprano. En las que dependen del deshielo o de la lluvia, el caudal baja a finales de verano."
          - p: "¿Es necesario reservar o pagar?"
            r: "Casi siempre son gratuitas, pero algunas tienen aforo limitado, acceso regulado o aparcamiento de pago en temporada alta. Consulta la web del ayuntamiento o del espacio natural antes de ir."
          - p: "¿Hay socorristas?"
            r: "No en la mayoría de pozas y gargantas, que son agua de río sin vigilancia. Ve acompañado, no dejes a los niños sin supervisión y evita bañarte si hay mal tiempo o el caudal ha subido."
          - p: "¿Qué hay que llevar?"
            r: "Calzado que agarre en el agua (sandalias de río o escarpines), toalla, agua, algo de comer, protección solar y una bolsa para tu basura. No uses jabón ni cremas en la poza."
          - p: "¿Se puede ir con niños o con perro?"
            r: "Con niños, mejor en pozas poco profundas y de fácil acceso, y siempre con un adulto dentro del agua. Con perro, depende del espacio: en algunos está prohibido o debe ir atado, así que comprueba la normativa local."
  - id: playas-fluviales
    meses: [7, 8]
    temas: [agua]
    es: { titulo: "Pasar el día en una playa fluvial", resumen: "Una alternativa al mar para el interior: arenales en ríos y embalses con zona de baño señalizada." }
    en: { titulo: "Spend a day at a river beach", resumen: "An inland alternative to the sea: sandy river and reservoir beaches with marked swimming areas." }
    relacionados: [piscinas-naturales, verbenas, perseidas]
    contenido:
      es:
        texto:
          - "Una playa fluvial es una zona de baño acondicionada en un río, un embalse o un lago, con arena o césped, accesos señalizados y, en muchos casos, servicios como aparcamiento, chiringuito, baños o socorrista. Es una forma muy cómoda de pasar el día en el agua sin ir a la costa, ideal para familias y para quienes viven en el interior."
          - "Las hay en casi todas las comunidades: Extremadura, Castilla y León, Castilla-La Mancha, Galicia, Aragón, Madrid o Asturias tienen zonas de baño muy populares, y el embalse de San Juan, en Madrid, es un clásico. La temporada va de junio a septiembre, con julio y agosto como momento de máxima afluencia."
          - "Aunque parezcan una playa, siguen siendo agua dulce con corrientes, fondos irregulares y, en los embalses, niveles que cambian. Báñate solo en la zona señalizada, no te alejes de la orilla con niños y respeta las banderas y los avisos. En verano puede haber cierres puntuales por la calidad del agua, por ejemplo por proliferación de algas, así que conviene comprobarlo."
          - "Antes de ir, mira la web del ayuntamiento y la información sanitaria de las zonas de baño, que se publica en el sistema Náyade del Ministerio de Sanidad. Lleva sombrilla, calzado de agua porque el fondo suele ser de piedra o fango, agua y protección solar, y llega pronto en fin de semana: las más conocidas se llenan."
        faq:
          - p: "¿Qué es una playa fluvial?"
            r: "Es una zona de baño señalizada en un río, un embalse o un lago, con arena o césped y, a menudo, servicios como aparcamiento, chiringuito, baños y socorrista. Es agua dulce, no salada."
          - p: "¿Cuándo ir a una playa fluvial?"
            r: "De junio a septiembre. En julio y agosto hay más ambiente y también más gente, así que si quieres tranquilidad, ve entre semana o a primera hora."
          - p: "¿Cómo sé si el agua es segura para bañarse?"
            r: "La calidad del agua de las zonas de baño oficiales se publica en el sistema Náyade del Ministerio de Sanidad y suele haber cartelería en la propia playa. En verano puede haber cierres puntuales, por ejemplo por algas, así que conviene comprobarlo antes."
          - p: "¿Hay socorristas?"
            r: "En muchas sí, durante la temporada alta, pero no en todas. Si no hay, extrema la precaución con los niños, báñate solo en la zona señalizada y no te alejes de la orilla."
          - p: "¿Qué hay que llevar?"
            r: "Sombrilla, protección solar, agua, calzado de agua (el fondo suele ser de piedra o fango) y una bolsa para tu basura. Muchas tienen chiringuito, pero no siempre."
          - p: "¿Se puede ir con niños o con perro?"
            r: "Con niños es un plan muy cómodo, pero siempre con supervisión dentro del agua. Con perro depende de la playa: algunas lo prohíben o tienen un área concreta, así que consulta la normativa local."
