  - id: san-juan
    regla: { tipo: fija, inicio: "06-23", fin: "06-24" }
    temas: [fiestas, agua]
    es: { titulo: "Noche de San Juan", resumen: "Hogueras en las playas de A Coruña, Alicante o Barcelona y fiestas del fuego en el Pirineo." }
    en: { titulo: "Saint John's Eve", resumen: "Beach bonfires in A Coruña, Alicante and Barcelona and fire festivals in the Pyrenees." }
    relacionados: [fallas, romeria-rocio, san-fermin]
    contenido:
      es:
        texto:
          - "La Noche de San Juan, la víspera del 24 de junio, es una de las celebraciones más antiguas ligadas al solsticio de verano. En toda España se encienden hogueras, se hacen rituales para pedir deseos y se celebran fiestas en playas, plazas y montañas."
          - "Algunas de las más conocidas son las de A Coruña, con hogueras en las playas de Riazor y el Orzán, las Hogueras de Alicante, Fiesta de Interés Turístico Internacional, la Revetlla de Sant Joan en Cataluña con petardos y coca de Sant Joan, y las fiestas del fuego del solsticio en el Pirineo, reconocidas por la UNESCO."
          - "Es costumbre saltar la hoguera, bañarse a medianoche o escribir un deseo en un papel y quemarlo. Hazlo con seguridad: usa solo las hogueras autorizadas, no enciendas fuego por tu cuenta en zonas de riesgo, vigila a los niños con los petardos y ten mucho cuidado con el baño nocturno. Y no dejes basura en la playa."
        faq:
          - p: "¿Cuándo es la noche de San Juan?"
            r: "La noche del 23 al 24 de junio, con el día 24 como festivo en algunas comunidades."
          - p: "¿Dónde ver las hogueras?"
            r: "A Coruña, Alicante, Barcelona, Cádiz y muchas playas de la costa tienen celebraciones muy populares. Mira el programa de cada ayuntamiento."
          - p: "¿Se pueden encender hogueras?"
            r: "Solo donde esté autorizado. En muchos arenales y zonas forestales está prohibido encender fuego por cuenta propia, y hay riesgo de multa y de incendio."
          - p: "¿Qué rituales se hacen?"
            r: "Saltar la hoguera, pedir deseos, escribir y quemar un papel con lo que quieres dejar atrás, y bañarse a medianoche. Cada zona tiene sus costumbres."
          - p: "¿Es seguro bañarse de noche?"
            r: "Hay riesgo, sobre todo con alcohol y poca visibilidad. Báñate solo en playas con vigilancia, acompañado y sin alejarte de la orilla."
          - p: "¿Es buen plan con niños?"
            r: "Sí, hay muchas actividades familiares, pero conviene vigilar el fuego y los petardos, y evitar las horas de más aglomeración."
  - id: batalla-vino
    regla: { tipo: fija, inicio: "06-29" }
    temas: [fiestas, gastronomia]
    lugar: { provincia: "La Rioja", municipio: "Haro" }
    es: { titulo: "Batalla del Vino de Haro", resumen: "Miles de personas se empapan de vino tinto en los Riscos de Bilibio. Ve de blanco." }
    en: { titulo: "Haro Wine Battle", resumen: "Thousands drench each other in red wine at the Riscos de Bilibio. Wear white." }
    relacionados: [san-fermin, tomatina, vendimia]
    contenido:
      es:
        texto:
          - "La Batalla del Vino de Haro es una fiesta única: cada 29 de junio, miles de personas se lanzan vino tinto en los Riscos de Bilibio, a pocos kilómetros de Haro, en La Rioja. Es una celebración de San Pedro que combina tradición religiosa, vino y mucho humor."
          - "La jornada empieza con una procesión desde el pueblo hasta los Riscos de Bilibio y una misa en la ermita de San Felices. Después comienza la batalla, con cubos, pistolas, botas de vino y regaderas, y se vacían miles de litros de vino. Casi todo el mundo viste de blanco y lleva pañuelo morado."
          - "Lleva ropa blanca que no te importe estropear, calzado cómodo que se pueda mojar y gafas para proteger los ojos. No lleves objetos de valor ni cámaras que puedan mancharse, y ten en cuenta que la fiesta es muy multitudinaria. Reserva alojamiento y transporte con antelación y bebe con cabeza."
        faq:
          - p: "¿Cuándo es la Batalla del Vino?"
            r: "Cada 29 de junio, día de San Pedro, en los Riscos de Bilibio, cerca de Haro (La Rioja)."
          - p: "¿Qué ropa llevar?"
            r: "Ropa blanca que no te importe estropear y calzado cómodo. Muchos participantes usan gafas de natación y pañuelo morado."
          - p: "¿Cómo llegar?"
            r: "Desde Haro, la mayoría de la gente va a pie en procesión o en transporte organizado. Evita llevar coche, porque el aparcamiento es complicado."
          - p: "¿Hace falta entrada?"
            r: "En general es una fiesta popular de acceso libre, pero conviene consultar las condiciones y el programa del Ayuntamiento de Haro."
          - p: "¿Es seguro?"
            r: "Es una fiesta multitudinaria y con vino, así que hay que ir con cuidado, proteger los ojos y no ir solo."
          - p: "¿Es buen plan con niños?"
            r: "Es muy multitudinaria y mojada, así que no suele recomendarse para niños pequeños."
  - id: san-fermin
    regla: { tipo: fija, inicio: "07-06", fin: "07-14" }
    temas: [fiestas]
    lugar: { provincia: "Navarra", municipio: "Pamplona" }
    es: { titulo: "Sanfermines", resumen: "Del chupinazo del 6 de julio al Pobre de mí del 14, con encierros cada mañana." }
    en: { titulo: "San Fermín", resumen: "From the opening rocket on 6 July to the closing song on the 14th, with bull runs every morning." }
    relacionados: [feria-abril, tomatina, fallas]
    contenido:
      es:
        texto:
          - "Los Sanfermines son las fiestas de Pamplona, del 6 al 14 de julio, y una de las celebraciones más conocidas del mundo. Comienzan con el chupinazo en la plaza del Ayuntamiento, a mediodía del 6 de julio, y terminan a medianoche del 14 con el Pobre de mí."
          - "El gran símbolo son los encierros: cada mañana, a las ocho, los toros corren por un recorrido de unos 850 metros desde el corral de Santo Domingo hasta la plaza de toros. Pero los Sanfermines son mucho más: procesión de San Fermín el 7 de julio, gigantes y cabezudos, conciertos, fuegos artificiales, vestimenta blanca con pañuelo rojo y un ambiente de calle de día y de noche."
          - "Correr el encierro es peligroso y tiene normas: hay que ser mayor de edad, no haber bebido alcohol y respetar las indicaciones de la organización. Si prefieres verlo, puedes hacerlo por televisión o desde algún punto habilitado, que se ocupa muy temprano. Reserva alojamiento con meses de antelación, porque los precios suben y la ciudad se llena."
        faq:
          - p: "¿Cuándo son los Sanfermines?"
            r: "Del 6 al 14 de julio todos los años. Empiezan con el chupinazo el día 6 al mediodía y terminan con el Pobre de mí a medianoche del 14."
          - p: "¿A qué hora son los encierros?"
            r: "Cada mañana a las 8:00 desde el 7 hasta el 14 de julio. Dura apenas unos minutos."
          - p: "¿Cómo ver un encierro?"
            r: "Por televisión, o en directo desde zonas habilitadas, que se ocupan muy temprano. En algunos balcones hay plazas de pago. Los puntos con vista del recorrido se llenan desde antes del amanecer."
          - p: "¿Puede correr cualquiera?"
            r: "No. Hay que ser mayor de edad y no estar bajo los efectos del alcohol u otras sustancias, y obedecer las normas de la organización. Es una actividad peligrosa y se producen heridos cada año."
          - p: "¿Qué ropa llevar?"
            r: "Tradicionalmente, ropa blanca con pañuelo rojo al cuello y faja roja. Calzado cómodo y cerrado, y un cambio de ropa, porque se mancha casi seguro."
          - p: "¿Es buen plan con niños?"
            r: "El ambiente diurno es familiar, con gigantes, cabezudos y actividades para niños. Por la noche es más multitudinario. Conviene evitar los encierros y las zonas más masificadas."
  - id: tomatina
    fuente: "https://www.spain.info/es/agenda/la-tomatina/"
    regla: { tipo: enesimo, mes: 8, dia_semana: 3, n: -1 }
    temas: [fiestas]
    lugar: { provincia: "Valencia", municipio: "Buñol" }
    es: { titulo: "La Tomatina de Buñol", resumen: "Una hora de batalla de tomates el último miércoles de agosto. Requiere entrada." }
    en: { titulo: "La Tomatina in Buñol", resumen: "An hour-long tomato fight on the last Wednesday of August. Tickets required." }
    relacionados: [san-fermin, feria-abril, fallas]
    contenido:
      es:
        texto:
          - "La Tomatina es la mayor batalla de tomates del mundo. Se celebra en Buñol, un pueblo de la provincia de Valencia, el último miércoles de agosto, y durante aproximadamente una hora miles de personas se lanzan tomates maduros hasta que las calles quedan teñidas de rojo."
          - "Para participar necesitas entrada. El ayuntamiento limita el aforo y vende los tickets de forma anticipada, por lo que conviene comprarlos con tiempo en los canales oficiales y desconfiar de reventas. La fiesta empieza con el palo jabón, un palo engrasado con un jamón en lo alto, y la batalla comienza cuando se dispara un cohete hacia las 11 de la mañana."
          - "Lleva ropa vieja y calzado que no te importe perder, gafas de natación para proteger los ojos y guantes. Aplasta el tomate antes de lanzarlo para no hacer daño, y no tires nada más que tomates. No lleves objetos de valor ni cámaras, y llega con tiempo desde Valencia, por ejemplo en tren o en los autobuses que se organizan para ese día."
        faq:
          - p: "¿Cuándo es la Tomatina?"
            r: "El último miércoles de agosto, en Buñol (Valencia). La batalla dura aproximadamente una hora, a partir de las 11 de la mañana."
          - p: "¿Hace falta entrada?"
            r: "Sí. El aforo está limitado y las entradas se compran con antelación a través de los canales oficiales. Evita comprar a revendedores."
          - p: "¿Cómo llegar a Buñol?"
            r: "Desde Valencia, en tren de Cercanías o autobús. Conviene llegar con tiempo, porque el día de la fiesta hay muchísima gente."
          - p: "¿Qué ropa llevar?"
            r: "Ropa vieja y calzado que no te importe perder. Muchos participantes usan gafas de natación para protegerse los ojos y guantes."
          - p: "¿Qué normas hay?"
            r: "Aplasta el tomate antes de lanzarlo, no lances nada más que tomates, no lleves objetos de cristal ni de valor y obedece las indicaciones de la organización."
          - p: "¿Es buen plan con niños?"
            r: "Hay edad mínima para participar y la fiesta es multitudinaria. Consulta las condiciones oficiales antes de comprar entradas."
  - id: festival-san-sebastian
    fuente: "https://www.spain.info/es/agenda/festival-internacional-cine-san-sebastian/"
